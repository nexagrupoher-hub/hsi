      .map((it,i)=> marcados[i] ? {nro: String(i+1).padStart(2,"0"), item: it} : null)
      .filter(Boolean);
    const comentariosLimpios = {};
    SECTORES.forEach(s => { if((comentarios[s]||"").trim()) comentariosLimpios[s] = comentarios[s].trim(); });
    if(conNovedades && itemsMarcados.length===0 && Object.keys(comentariosLimpios).length===0 && adjuntos.length===0){
      return mostrarToast("Marcaste 'Planilla de novedades' pero no cargaste ninguna. Marcá ítems, comentá o adjuntá algo — o pasá a 'Sin novedades'.", true);
    }
    const informe = {
      empresa: empresaNombre, empresa_id: empresaId,
      fecha, hora,
      ...datosDeUnidad(vehiculos, vehId),
      conductor: user.nombre, conductor_id: user.id, dni: user.dni,
      movimiento: movimiento,
      chofer2: chofer2 || "",
      linea, taller,
      kmsIniciales: parseFloat(kmIni),
      kmsFinales: parseFloat(kmFin),
      totalKms,
      tipoPlanilla: conNovedades ? "CON NOVEDADES" : "SIN NOVEDADES",
      items: conNovedades ? itemsMarcados : [],
      comentariosSector: conNovedades ? comentariosLimpios : {},
      adjuntos: adjuntos.map(a=>({tipo:a.tipo, nombre:a.nombre, mime:a.mime, base64:a.base64, url:a.url||""})),
      timestamp: new Date().toISOString(),
    };
    setBusy(true);
    const res = await enviarOEncolar("guardarCheck", informe, demo);
    setBusy(false);
    onSaved({...informe, adjuntos: informe.adjuntos.length, pendiente: !!res.encolado});
    mostrarToast(res.encolado
      ? "📴 Sin señal: el informe quedó guardado en el teléfono. Se manda solo cuando haya conexión."
      : (conNovedades
        ? "✓ Informe guardado. Las novedades pasaron a Mantenimiento como correctivas."
        : "✓ Informe guardado correctamente"));
    setKmIni(""); setKmFin(""); setMarcados({}); setComentarios({}); setAdjuntos([]);
    setConNovedades(true); setHora(horaAhora()); setChofer2("");
  };
  return (
    <React.Fragment>
      {toast && <div className={"toast" + (toast.err ? " err":"")}>{toast.msg}</div>}
      <div className="card">
        <h2>Tipo de check</h2>
        <div className="toggle">
          <button className={movimiento==="SALIDA DEL PREDIO" ? "on-ok":""} onClick={()=>setMovimiento("SALIDA DEL PREDIO")}>
            🔼 Salida del predio
          </button>
          <button className={movimiento==="INGRESO AL PREDIO" ? "on-ok":""} onClick={()=>setMovimiento("INGRESO AL PREDIO")}>
            🔽 Ingreso al predio
          </button>
        </div>
      </div>
      <div className="card">
        <h2>Datos del viaje</h2>
        <div className="grid c2">
          <SelectorUnidad vehiculos={vehiculos} vehId={vehId} setVehId={setVehId} label="Interno *"/>
          <div className="field">
            <label>Chofer N°1</label>
            <input readOnly value={user.nombre + (user.dni ? " · DNI " + user.dni : "")}/>
          </div>
          <div className="field">
            <label>Chofer N°2 (opcional)</label>
            <input value={chofer2} onChange={e=>setChofer2(e.target.value)} placeholder="Apellido y nombre"/>
          </div>
          <div className="field">
            <label>Línea</label>
            <select value={linea} onChange={e=>setLinea(e.target.value)}>
              {LINEAS.map(l=><option key={l}>{l}</option>)}
            </select>
          </div>
          <div className="field">
            <label>Día</label>
            <input type="date" value={fecha} onChange={e=>setFecha(e.target.value)}/>
          </div>
          <div className="field">
            <label>Hora</label>
            <input type="time" value={hora} onChange={e=>setHora(e.target.value)}/>
          </div>
          <div className="field" style={{gridColumn:"1 / -1"}}>
            <label>Taller (opcional)</label>
            <input value={taller} onChange={e=>setTaller(e.target.value)} placeholder="Nombre del taller" list="talleres"/>
            <datalist id="talleres">{TALLERES_DEF.map(t=><option key={t} value={t}/>)}</datalist>
          </div>
        </div>
      </div>
      <div className="card">
        <h2>Kilómetros</h2>
        <div className="grid c3">
          <div className="field">
            <label>Kms. Iniciales * {kmFijado ? "(fijado por el último check)" : ""}</label>
            <input className="mono" type="number" inputMode="numeric" value={kmIni}
              readOnly={kmFijado}
              onChange={e=>{ if(!kmFijado) setKmIni(e.target.value); }} placeholder="97107"/>
          </div>
          <div className="field">
            <label>Kms. Finales *</label>
            <input className="mono" type="number" inputMode="numeric" value={kmFin}
              onChange={e=>setKmFin(e.target.value)} placeholder="97250"/>
          </div>
          <div>
            <div className="kms-total mono">
              {totalKms===null ? "—" : totalKms.toLocaleString("es-AR")}
              <small>TOTAL KMS.</small>
            </div>
          </div>
        </div>
        {totalKms!==null && totalKms<0 &&
          <div className="kms-alert">⚠ Los kms finales son menores que los iniciales.</div>}
      </div>
      <div className="card">
        <h2>Tipo de planilla</h2>
        <div className="toggle">
          <button className={conNovedades ? "on-nov":""} onClick={()=>setConNovedades(true)}>
            ● Planilla de novedades
          </button>
          <button className={!conNovedades ? "on-ok":""} onClick={()=>setConNovedades(false)}>
            ✓ Planilla sin novedades
          </button>
        </div>
      </div>
      {conNovedades && (
        <React.Fragment>
          <div className="card">
            <h2>Taller (varios)</h2>
            <div className="chk-help">Marcá solamente los ítems que presentan <b>novedad u observación</b>. Cada novedad entra al panel como <b>correctiva</b> en Mantenimiento.</div>
            <div className="chk-grid">
              {ITEMS.map((it,i)=>(
                <label key={i} className={"chk" + (marcados[i] ? " marked":"")}>
                  <input type="checkbox" checked={!!marcados[i]} onChange={()=>toggleItem(i)}/>
                  <span><span className="num">{String(i+1).padStart(2,"0")}</span> · {it}</span>
                </label>
              ))}
            </div>
          </div>
          <div className="card">
            <h2>Comentarios del conductor al finalizar el viaje</h2>
            {SECTORES.map(s=>(
              <div className="sector" key={s}>
                <label>{s}</label>
                <textarea value={comentarios[s]||""} placeholder="Sin comentarios"
                  onChange={e=>setComentarios(c=>({...c,[s]:e.target.value}))}/>
              </div>
            ))}
          </div>
          <Adjuntos adjuntos={adjuntos} setAdjuntos={setAdjuntos}/>
        </React.Fragment>
      )}
      <div className="savebar">
        <button className="btn" onClick={guardar} disabled={busy}>
          {busy ? "Guardando..." : "Cargar informe de control (check)"}
        </button>
      </div>
    </React.Fragment>
  );
}
/* ================= CHAPA PATENTE / VEREDICTO ================= */
function Chapa({patente, grande}){
  if (!patente) return null;
  const p = String(patente).toUpperCase().replace(/\s+/g," ").trim();
  const fmtP = /^[A-Z]{2}\d{3}[A-Z]{2}$/.test(p.replace(/\s/g,""))
    ? p.replace(/\s/g,"").replace(/^([A-Z]{2})(\d{3})([A-Z]{2})$/, "$1 $2 $3")
    : /^[A-Z]{3}\d{3}$/.test(p.replace(/\s/g,""))
      ? p.replace(/\s/g,"").replace(/^([A-Z]{3})(\d{3})$/, "$1 $2")
      : p;
  return (
    <span className={"chapa" + (grande ? " grande" : "")}>
      <span className="banda">República Argentina</span>
      <span className="nro">{fmtP}</span>
    </span>
  );
}
function CabeceraUnidad({v}){
  return (
    <div className="unidad-head" style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:12,flexWrap:"wrap"}}>
      <div>
        {v.vehiculo ? <b>Interno {v.vehiculo}</b> : <b>{v.marca || "Unidad"}</b>}
        <span>{[v.marca, v.modelo].filter(Boolean).join(" ")}</span>
      </div>
      <Chapa patente={v.patente}/>
    </div>
  );
}
function VeredictoCirculacion({v}){
  const vencs = [
    {nom:"VTV / RTO", f:v.vencimientoVTV},
    {nom:"Seguro", f:v.vencimientoSeguro},
    {nom:"Oblea / Habilitación", f:v.vencimientoOblea},
  ];
  const vencidos = vencs.filter(x => { const d = diasHasta(x.f); return d !== null && d < 0; });
  const sinDato = vencs.filter(x => diasHasta(x.f) === null);
  if (vencidos.length)
    return <div className="veredicto mal">⛔ <div>NO está en condiciones de circular<small>{vencidos.map(x=>x.nom).join(" y ")} vencido{vencidos.length>1?"s":""}. Avisá al asesor antes de salir.</small></div></div>;
  if (sinDato.length === vencs.length)
    return <div className="veredicto duda">❓ <div>Sin datos de documentación<small>La unidad no tiene vencimientos cargados. Consultá con el asesor.</small></div></div>;
  if (sinDato.length)
    return <div className="veredicto duda">⚠️ <div>Documentación incompleta<small>Falta el dato de: {sinDato.map(x=>x.nom).join(", ")}. El resto está al día.</small></div></div>;
  return <div className="veredicto ok">✅ <div>En condiciones de circular<small>Toda la documentación está al día.</small></div></div>;
}
function FilasVencimientos({v}){
  return (
    <React.Fragment>
      <div className="venc-card">
        <div><div className="nom">VTV / RTO</div><div className="fec">{fmtFecha(v.vencimientoVTV)}</div></div>
        <ChipVenc fecha={v.vencimientoVTV}/>
      </div>
      <div className="venc-card">
        <div><div className="nom">Seguro</div><div className="fec">{fmtFecha(v.vencimientoSeguro)}</div></div>
        <ChipVenc fecha={v.vencimientoSeguro}/>
      </div>
      <div className="venc-card">
        <div><div className="nom">Oblea / Habilitación</div><div className="fec">{fmtFecha(v.vencimientoOblea)}</div></div>
        <ChipVenc fecha={v.vencimientoOblea}/>
      </div>
    </React.Fragment>
  );
}
/* ================= VENCIMIENTOS + QR ================= */
function ChipVenc({fecha, mini}){
  const d = diasHasta(fecha);
  const cls = "venc-chip" + (mini ? " mini" : "");
  if (d === null) return <span className={cls + " na"}>sin dato</span>;
  if (d < 0)  return <span className={cls + " vencido"}>VENCIDO hace {Math.abs(d)} día{Math.abs(d)===1?"":"s"}</span>;
  if (d === 0) return <span className={cls + " vencido"}>VENCE HOY</span>;
  if (d <= 30) return <span className={cls + " pronto"}>vence en {d} día{d===1?"":"s"}</span>;
  return <span className={cls + " ok"}>faltan {d} días</span>;
}
function buscarUnidadPorClave(vehiculos, clave){
  if (!clave) return null;
  const k = String(clave).toUpperCase().replace(/\s/g,"");
  return vehiculos.find(x =>
    String(x.vehiculo||"").toUpperCase().replace(/\s/g,"") === k ||
    String(x.patente||"").toUpperCase().replace(/\s/g,"") === k) || null;
}
function Vencimientos({datos, user, internoInicial}){
  const vehiculos = datos.vehiculos || [];
  const inicial = useMemo(()=>{
    const v = buscarUnidadPorClave(vehiculos, internoInicial || INTERNO_QR);
    return v ? String(v.id) : "";
  },[vehiculos, internoInicial]);
  const [vehId,setVehId] = useState(inicial);
  useEffect(()=>{ if(inicial) setVehId(inicial); },[inicial]);
  const v = vehiculos.find(x => mismoId(x.id, vehId));
  return (
    <React.Fragment>
      <div className="card">
        <h2>Documentación de la unidad</h2>
        <div className="chk-help">Escaneá el <b>QR pegado en la unidad</b> con la cámara del teléfono y esta pantalla se abre sola con esa unidad. También podés elegirla a mano.</div>
        <SelectorUnidad vehiculos={vehiculos} vehId={vehId} setVehId={setVehId} label="Unidad"/>
        {v && (
          <div style={{marginTop:14}}>
            <CabeceraUnidad v={v}/>
            <VeredictoCirculacion v={v}/>
            <FilasVencimientos v={v}/>
          </div>
        )}
      </div>
      {user && user.vencLicencia ? (
        <div className="card">
          <h2>Tu licencia de conducir</h2>
          <div className="venc-card">
            <div><div className="nom">Licencia {user.licencia || ""}</div><div className="fec">{fmtFecha(user.vencLicencia)}</div></div>
            <ChipVenc fecha={user.vencLicencia}/>
          </div>
        </div>
      ) : null}
        </React.Fragment>
  );
}
/* ================= PEDIDOS DE INSUMOS ================= */
function Pedidos({user, datos, empresaId, empresaNombre, demo, onSaved}){
  const vehiculos = datos.vehiculos || [];
  const insumos = (datos.insumos || []).filter(i => String(i.activo==null?"si":i.activo).toLowerCase() !== "no");
  const [vehId,setVehId] = useState(vehiculos.length===1 ? String(vehiculos[0].id) : "");
  const [busq,setBusq] = useState("");
  const [carrito,setCarrito] = useState([]);   // {id, nombre, unidad, categoria, cantidad}
  const [otro,setOtro] = useState("");
  const [comentario,setComentario] = useState("");
  const [toast,setToast] = useState(null);
  const [busy,setBusy] = useState(false);
  const mostrarToast = (msg, err=false) => { setToast({msg,err}); setTimeout(()=>setToast(null), 4000); };
  const sinTilde = (s) => String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
  const resultados = busq.trim()
    ? insumos.filter(i => (sinTilde(i.nombre) + " " + sinTilde(i.categoria)).indexOf(sinTilde(busq.trim())) > -1).slice(0, 8)
    : [];
  const agregarAlPedido = (i) => {
    setCarrito(c => c.find(x=>mismoId(x.id,i.id))
      ? c.map(x=>mismoId(x.id,i.id) ? {...x, cantidad:x.cantidad+1} : x)
      : [...c, {id:i.id, nombre:i.nombre, unidad:i.unidad||"", categoria:i.categoria||"", cantidad:1}]);
  };
  const cambiarCant = (id, delta) => setCarrito(c =>
    c.map(x=>mismoId(x.id,id) ? {...x, cantidad:Math.max(0,x.cantidad+delta)} : x).filter(x=>x.cantidad>0));
  const [confirmados,setConfirmados] = useState({});
  const misPedidos = (datos.pedidos || [])
    .filter(p => !p.dni || soloDigitos(p.dni) === soloDigitos(user.dni))
    .sort((a,b)=>String(b.fecha||"").localeCompare(String(a.fecha||"")));
  const estadoDe = (p) => confirmados[p.id] ? "recibido" : String(p.estado||"solicitado").toLowerCase().trim();
  const PASOS_PED = ["solicitado","preparado","enviado","recibido"];
  const ETIQ_PED = {solicitado:"Solicitado", preparado:"Preparado", enviado:"Enviado", recibido:"Recibido"};
  const pasoDePedido = (e) => {
    if (/recib/.test(e)) return 3;
    if (/envi/.test(e)) return 2;
    if (/prepar|aprob/.test(e)) return 1;
    return 0;
  };
  const confirmarRecepcion = async (p) => {
    setBusy(true);
    const res = await enviarOEncolar("confirmarPedido", {id: p.id, dni: user.dni, fecha: hoy(), hora: horaAhora()}, demo);
    setBusy(false);
    setConfirmados(c => ({...c, [p.id]: true}));
    mostrarToast(res.encolado
      ? "📴 Sin señal: el visto bueno quedó guardado y sale solo con conexión."
      : "✓ Recepción confirmada. ¡Gracias!");
  };
  const enviar = async () => {
    const items = carrito.map(x=>({nombre:x.nombre, cantidad:x.cantidad, unidad:x.unidad||""}));
    if (otro.trim()) items.push({nombre: otro.trim(), cantidad: 1, unidad: ""});
    if (!items.length) return mostrarToast("Marcá al menos un insumo (o escribilo en 'Otro pedido').", true);
    const pedido = {
      empresa: empresaNombre, empresa_id: empresaId,
      fecha: hoy(), hora: horaAhora(),
      ...datosDeUnidad(vehiculos, vehId),
      conductor: user.nombre, conductor_id: user.id, dni: user.dni,
      items: items, comentario: comentario.trim(),
      adjuntos: [],
      timestamp: new Date().toISOString(),
    };
    setBusy(true);
    const res = await enviarOEncolar("guardarPedido", pedido, demo);
    setBusy(false);
    onSaved({tipo:"pedido", interno:pedido.interno, fecha:pedido.fecha, hora:pedido.hora,
      tipoPlanilla:"PEDIDO", items:[], descripcion: items.map(x=>x.cantidad+"× "+x.nombre).join(", "),
      pendiente: !!res.encolado});
    mostrarToast(res.encolado
      ? "📴 Sin señal: el pedido quedó guardado y sale solo cuando haya conexión."
      : "✓ Pedido enviado al pañol.");
    setCarrito([]); setBusq(""); setOtro(""); setComentario("");
  };
  return (
    <React.Fragment>
      {toast && <div className={"toast" + (toast.err ? " err":"")}>{toast.msg}</div>}
      <div className="card">
        <h2>Pedir insumos</h2>
        <div className="chk-help"><b>1.</b> Buscá el insumo o repuesto · <b>2.</b> Tocá «Agregar» · <b>3.</b> Abajo se arma <b>TU PEDIDO</b> con las cantidades.</div>
        <SelectorUnidad vehiculos={vehiculos} vehId={vehId} setVehId={setVehId} label="Unidad (opcional)"/>
        <div className="field" style={{marginTop:12}}>
          <label>🔍 Buscá acá lo que necesitás</label>
          <input value={busq} onChange={e=>setBusq(e.target.value)} placeholder="Ej: aceite, filtro, urea…"/>
        </div>
        <div style={{marginTop:10}}>
          {insumos.length === 0 && <div className="empty">Todavía no hay insumos cargados en la planilla (hoja "Insumos").</div>}
          {busq.trim() !== "" && resultados.length === 0 && insumos.length > 0 &&
            <div className="empty">No encontré «{busq}» en el catálogo. Escribilo abajo en «Otro pedido» y va igual.</div>}
          {resultados.map(i=>(
            <div className="insumo" key={i.id}>
              <div className="nom">{i.nombre}<small>{[i.categoria, i.unidad].filter(Boolean).join(" · ")}</small></div>
              <button className="btn" style={{width:"auto",marginTop:0,padding:"10px 18px",fontSize:14}} onClick={()=>agregarAlPedido(i)}>＋ Agregar</button>
            </div>
          ))}
        </div>
        {carrito.length > 0 && (
          <div style={{marginTop:14,border:"2px solid var(--ok)",borderRadius:12,padding:"12px 12px 6px",background:"var(--ok-bg)"}}>
            <div style={{fontSize:12,fontWeight:800,letterSpacing:".5px",color:"var(--ok)",marginBottom:8}}>
              🧺 TU PEDIDO ({carrito.reduce((s,x)=>s+x.cantidad,0)} artículo(s)) — ajustá las cantidades con − y +
            </div>
            {carrito.map(x=>(
              <div className="insumo con" key={x.id}>
                <div className="nom">{x.nombre}<small>{[x.categoria, x.unidad].filter(Boolean).join(" · ")}</small></div>
                <div className="cont">
                  <button onClick={()=>cambiarCant(x.id,-1)}>−</button>
                  <span className="n">{x.cantidad}</span>
                  <button onClick={()=>cambiarCant(x.id,1)}>+</button>
                </div>
              </div>
            ))}
          </div>
        )}
        <div className="field" style={{marginTop:10}}>
          <label>Otro pedido (si no está en la lista)</label>
          <input value={otro} onChange={e=>setOtro(e.target.value)} placeholder="Ej: escoba, trapo de piso"/>
        </div>
        <div className="field" style={{marginTop:10}}>
          <label>Comentario (opcional)</label>
          <textarea value={comentario} onChange={e=>setComentario(e.target.value)} placeholder="Aclaraciones para el pañol" style={{minHeight:56}}/>
        </div>
      </div>
      <div className="card">
        <h2>Mis pedidos</h2>
        {misPedidos.length === 0 && <div className="empty">Todavía no hiciste pedidos.</div>}
        {misPedidos.slice(0,15).map((p,i)=>{
          const est = estadoDe(p);
          const paso = pasoDePedido(est);
          return (
          <div className="item-lista" key={p.id||i}>
            <div className="arriba">
              <b>{fmtFecha(p.fecha)} {p.hora||""}</b>
              <span className={"chip-est " + PASOS_PED[paso]}>{ETIQ_PED[PASOS_PED[paso]]}</span>
            </div>
            <div className="det">
              {(Array.isArray(p.items) ? p.items.map(x=>(x.cantidad||1)+"× "+x.nombre).join(", ") : String(p.items||""))}
              {p.respuesta ? <div><b>Respuesta del pañol:</b> {p.respuesta}</div> : null}
            </div>
            <div className="pasos mini">
              {PASOS_PED.map((nombre,j)=>(
                <div className={"paso" + (j < paso ? " hecho" : j === paso ? (paso === 3 ? " hecho" : " actual") : "")} key={nombre}>
                  <div className="pto">{j < paso || paso === 3 ? "✓" : j+1}</div>
                  <small>{ETIQ_PED[nombre]}</small>
                </div>
              ))}
            </div>
            {paso === 2 &&
              <button className="btn" style={{marginTop:10}} disabled={busy} onClick={()=>confirmarRecepcion(p)}>
                ✓ Recibí el pedido
              </button>}
          </div>
          );
        })}
      </div>
      <div className="savebar">
        <button className="btn" onClick={enviar} disabled={busy}>{busy ? "Enviando..." : "Enviar pedido"}</button>
      </div>
    </React.Fragment>
  );
}
/* ================= SEGUIMIENTO DE NOVEDADES (taller) ================= */
const PASOS_OT = [
  {ids:["programado","pendiente","inicio"], label:"Inicio"},
  {ids:["en_progreso","en_proceso","en curso","proceso"], label:"En proceso"},
  {ids:["completado","finalizado","fin","hecho"], label:"Finalizado"},
];
const pasoDeEstado = (estado) => {
  const e = String(estado||"programado").toLowerCase();
  for (let i = PASOS_OT.length - 1; i >= 0; i--){
    if (PASOS_OT[i].ids.some(x => e.indexOf(x) > -1)) return i;
  }
  return 0;
};
function Seguimiento({user, datos}){
  const vehiculos = datos.vehiculos || [];
  const pref = "[" + String(user.nombre||"").toUpperCase().trim() + "]";
  const [verTerminadas,setVerTerminadas] = useState(false);
  const todas = (datos.mantenimiento || [])
    .filter(m => String(m.descripcion||"").toUpperCase().trim().indexOf(pref) === 0)
    .sort((a,b)=>String(b.fecha||"").localeCompare(String(a.fecha||"")));
  const terminadas = todas.filter(m => pasoDeEstado(m.estado) >= 2).length;
  const mias = todas.filter(m => verTerminadas || pasoDeEstado(m.estado) < 2);
  const segDe = (m) => (datos.seguimientoOT || [])
    .filter(s => mismoId(s.ot_id, m.id))
    .sort((a,b)=>String(a.fecha||"").localeCompare(String(b.fecha||"")));
  return (
    <React.Fragment>
      <div className="card">
        <h2>Seguimiento de tus novedades</h2>
        <div className="chk-help">Cada novedad que reportás pasa por el asesor técnico y el taller. Acá ves en qué está cada una. <b>Las que se terminan se archivan solas.</b></div>
        {terminadas > 0 &&
          <label style={{display:"flex",alignItems:"center",gap:8,fontSize:13,color:"var(--muted)",marginBottom:10,cursor:"pointer"}}>
            <input type="checkbox" checked={verTerminadas} onChange={e=>setVerTerminadas(e.target.checked)}
              style={{width:17,height:17,accentColor:"var(--acento)"}}/>
            Ver también las terminadas ({terminadas})
          </label>}
        {mias.length === 0 && <div className="empty">{todas.length === 0
          ? 'Todavía no tenés novedades reportadas. Cuando mandes una desde "Reportar novedad" o el check, aparece acá.'
          : "🎉 No tenés novedades en curso: las terminadas quedaron archivadas (casilla de arriba para verlas)."}</div>}
        {mias.map((m,i)=>{
          const v = vehiculos.find(x=>mismoId(x.id, m.vehiculo_id));
          const paso = pasoDeEstado(m.estado);
          const detalle = String(m.descripcion||"").replace(/^\[[^\]]*\]\s*/,"");
          const comentarios = segDe(m);
          return (
            <div className="item-lista" key={m.id||i}>
              <div className="arriba">
                <b>{v ? [v.vehiculo ? "Interno " + v.vehiculo : "", v.patente || ""].filter(Boolean).join(" · ") : "Unidad"}</b>
                <span style={{color:"var(--muted)",fontSize:12}}>{fmtFecha(m.fecha)}</span>
              </div>
              <div className="det"><TextoConLinks texto={detalle}/></div>
              <div className="pasos">
                {PASOS_OT.map((p,j)=>(
                  <div className={"paso" + (j < paso ? " hecho" : j === paso ? (paso === 2 ? " hecho" : " actual") : "")} key={p.label}>
                    <div className="pto">{j < paso || paso === 2 ? "✓" : j+1}</div>
                    <small>{p.label}</small>
                  </div>
                ))}
              </div>
              {comentarios.map((c,k)=>(
                <div className="coment" key={k}>
                  <div className="f">{fmtFecha(c.fecha)}</div>
                  {c.comentario}
                </div>
              ))}
            </div>
          );
        })}
      </div>
    </React.Fragment>
  );
}
/* ================= DIAGRAMAS (lavado y gasoil planificados) ================= */
/* el estado del diagrama puede venir escrito de cualquier forma en la hoja:
   "pendiente", "programado", "programdo", vacío... → todo eso es PENDIENTE */
const estadoDiagramaNorm = (e) => {
  const s = String(e||"").toLowerCase();
  if (/hecho|finaliz|realizad|complet|listo/.test(s)) return "hecho";
  if (/curso|inicia|proceso|progres/.test(s)) return "en_curso";
  return "pendiente";
};
const iconoTarea = (t) => {
  const s = String(t||"").toLowerCase();
  if (/lav/.test(s)) return "🧼";
  if (/gas|comb|carga/.test(s)) return "⛽";
  if (/serv|mant/.test(s)) return "🔧";
  return "📌";
};
function Diagramas({datos, user, demo}){
  const vehiculos = datos.vehiculos || [];
  const [vehId,setVehId] = useState("");
  const [cambios,setCambios] = useState({});   // id -> estado nuevo (optimista)
  const [toast,setToast] = useState(null);
  const [busy,setBusy] = useState(false);
  const mostrarToast = (msg, err=false) => { setToast({msg,err}); setTimeout(()=>setToast(null), 4000); };
  const claveDe = (d) => String(d.id || "") || [d.fecha, d.interno, d.tarea, d.hora].map(x=>String(x||"")).join("|");
  const marcar = async (d, accion) => {
    setBusy(true);
    const res = await enviarOEncolar("estadoDiagrama", {
      id: d.id || "",
      ref: {fecha: d.fecha, interno: d.interno, tarea: d.tarea, hora: d.hora},
      accion, conductor: user.nombre, dni: user.dni
    }, demo);
    setBusy(false);
    setCambios(c => ({...c, [claveDe(d)]: accion === "fin" ? "hecho" : "en_curso"}));
    mostrarToast(res.encolado
      ? "📴 Sin señal: quedó guardado y sale solo con conexión."
      : (accion === "fin" ? "✓ Tarea finalizada. ¡Gracias!" : "▶ Tarea iniciada."));
  };
  const v = vehiculos.find(x=>mismoId(x.id, vehId));
  const clave = v ? String(v.vehiculo||v.patente||"").toUpperCase().replace(/\s/g,"") : "";
  const lista = (datos.diagramas || [])
    .filter(d => !clave || String(d.interno||"").toUpperCase().replace(/\s/g,"") === clave ||
                 (v && String(d.interno||"").toUpperCase().replace(/\s/g,"") === String(v.patente||"").toUpperCase().replace(/\s/g,"")))
    .sort((a,b)=>String(a.fecha||"").localeCompare(String(b.fecha||"")));
  const estadoDe = (d) => cambios[claveDe(d)] || estadoDiagramaNorm(d.estado);
  const proximos = lista.filter(d => !d.fecha || String(d.fecha) >= hoy() || estadoDe(d) !== "hecho");
  const esHoyD = (f) => String(f||"") === hoy();
  return (
    <React.Fragment>
      {toast && <div className={"toast" + (toast.err ? " err":"")}>{toast.msg}</div>}
      <div className="card">
        <h2>Diagramas de la unidad</h2>
        <div className="chk-help">Lavados y cargas de gasoil planificados con mantenimiento. Fijate qué le toca a tu unidad y cuándo.</div>
        <SelectorUnidad vehiculos={vehiculos} vehId={vehId} setVehId={setVehId} label="Unidad (todas si no elegís)"/>
        <div style={{marginTop:12}}>
          {proximos.length === 0 && <div className="empty">No hay tareas programadas{v ? " para esta unidad" : ""}.</div>}
          {proximos.map((d,i)=>{
            const est = estadoDe(d);
            return (
            <div className="item-lista" key={claveDe(d)+"-"+i} style={esHoyD(d.fecha) ? {borderColor:"var(--alerta)", background:"var(--alerta-bg)"} : null}>
              <div className="arriba">
                <b>{iconoTarea(d.tarea)} {d.tarea || "Tarea"} · Interno {d.interno||"—"}</b>
                <span className={"chip-est " + est}>{est === "en_curso" ? "en curso" : est === "hecho" ? "hecho" : "pendiente"}</span>
              </div>
              <div className="det">
                {esHoyD(d.fecha) ? "HOY" : fmtFecha(d.fecha)}{d.hora ? " · " + d.hora + " hs" : ""}
                {d.notas ? " · " + d.notas : ""}
              </div>
              {est === "pendiente" &&
                <button className="btn" style={{marginTop:10}} disabled={busy} onClick={()=>marcar(d,"inicio")}>
                  ▶ Iniciar tarea
                </button>}
              {est === "en_curso" &&
                <button className="btn" style={{marginTop:10,background:"var(--ok)"}} disabled={busy} onClick={()=>marcar(d,"fin")}>
                  ✔ Finalizar tarea
                </button>}
            </div>
            );
          })}
        </div>
      </div>
    </React.Fragment>
  );
}
/* ================= LECTOR DE QR (cámara) + FICHA DE UNIDAD ================= */
/* Al escanear el QR de una unidad ASIGNADA, abre su documentación normal.
   Si la unidad NO está asignada al conductor, consulta la ficha al servidor:
   vencimientos + veredicto de circulación + reporte rápido con fotos/audio.
   Así, al tomar servicio en una unidad ajena, sabe al toque si puede salir. */
function FichaUnidadExterna({unidad, clave, user, empresaNombre, demo, onSaved, onOtra}){
  const [descripcion,setDescripcion] = useState("");
  const [adjuntos,setAdjuntos] = useState([]);
  const [toast,setToast] = useState(null);
  const [busy,setBusy] = useState(false);
  const mostrarToast = (msg, err=false) => { setToast({msg,err}); setTimeout(()=>setToast(null), 4000); };
  const v = unidad;   // puede ser null si no hubo señal para consultar
  const enviar = async () => {
    if (!descripcion.trim() && adjuntos.length === 0)
      return mostrarToast("Escribí algo o adjuntá una foto o audio.", true);
    const nov = {
      origen: "novedad",
      empresa: empresaNombre, empresa_id: (v && v.empresa_id) || "",
      fecha: hoy(), hora: horaAhora(),
      vehiculo_id: v ? v.id : "",
      interno: (v && v.vehiculo) || clave || "",
      patente: (v && v.patente) || clave || "",
      conductor: user.nombre, conductor_id: user.id, dni: user.dni,
      sector: "",
      descripcion: (descripcion.trim() || "Reporte al tomar servicio") + " (unidad tomada por QR)",
      adjuntos: adjuntos.map(a=>({tipo:a.tipo, nombre:a.nombre, mime:a.mime, base64:a.base64, url:a.url||""})),
      timestamp: new Date().toISOString(),
    };
    setBusy(true);
    const res = await enviarOEncolar("guardarNovedad", nov, demo);
    setBusy(false);
    onSaved({tipo:"novedad", interno:nov.interno, patente:nov.patente, fecha:nov.fecha, hora:nov.hora,
      tipoPlanilla:"NOVEDAD", items:[], adjuntos:nov.adjuntos.length, descripcion:nov.descripcion,
      pendiente: !!res.encolado});
    mostrarToast(res.encolado
      ? "📴 Sin señal: quedó guardado y sale solo cuando haya conexión."
      : "✓ Enviado al taller. ¡Gracias!");
    setDescripcion(""); setAdjuntos([]);
  };
  return (
    <React.Fragment>
      {toast && <div className={"toast" + (toast.err ? " err":"")}>{toast.msg}</div>}
      <div className="card">
        <h2>Unidad escaneada</h2>
        {v
          ? <React.Fragment>
              <CabeceraUnidad v={v}/>
              <VeredictoCirculacion v={v}/>
              <FilasVencimientos v={v}/>
              <div className="chk-help" style={{marginTop:8}}>Esta unidad no es de tus asignadas: la ves porque escaneaste su QR.</div>
            </React.Fragment>
          : <React.Fragment>
              <div className="unidad-head" style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:12,flexWrap:"wrap"}}>
                <div><b>Unidad {clave}</b><span>Sin conexión para consultar la ficha</span></div>
                <Chapa patente={clave}/>
              </div>
              <div className="veredicto duda">📴 <div>No se pudo consultar la documentación<small>Sin señal o la unidad no está en la flota. Igual podés mandar el reporte: queda guardado y sale al volver la conexión.</small></div></div>
            </React.Fragment>}
        <button className="btn sec" style={{marginTop:10}} onClick={onOtra}>Escanear otra unidad</button>
      </div>
      <div className="card">
        <h2>Reportar sobre esta unidad</h2>
        <div className="chk-help">¿Tomás servicio en esta unidad y ves algo raro? Contalo, sacá una foto o mandá un audio: llega al taller con tu nombre.</div>
        <div className="field">
          <label>¿Qué observaste? (opcional si adjuntás algo)</label>
          <textarea value={descripcion} onChange={e=>setDescripcion(e.target.value)}
            placeholder="Ej: la tomo con el parabrisas rajado y 3/4 de gasoil"/>
        </div>
      </div>
      <Adjuntos adjuntos={adjuntos} setAdjuntos={setAdjuntos}/>
      <div className="savebar">
        <button className="btn" onClick={enviar} disabled={busy}>
          {busy ? "Enviando..." : "Enviar reporte de esta unidad"}
        </button>
      </div>
    </React.Fragment>
  );
}
/* Lector de QR chiquito, para usar adentro de la hoja de ruta.
   Mismo motor que el escáner de unidades: BarcodeDetector si el teléfono lo
   tiene, y si no jsQR. No cierra la cámara hasta que el conductor lo diga:
   así escanea varias credenciales seguidas sin tener que volver a abrir. */
function LectorCredencial({onLeer, onCerrar}){
  const videoRef = React.useRef(null);
  const [error,setError] = React.useState("");
  const ultimo = React.useRef({cod:"", cuando:0});
  React.useEffect(()=>{
    let stream=null, timer=0, activo=true;
    const canvas=document.createElement("canvas");
    const ctx=canvas.getContext("2d",{willReadFrequently:true});
    let detector=null;
    try { if ("BarcodeDetector" in window) detector = new BarcodeDetector({formats:["qr_code"]}); } catch(e){ detector=null; }
    const entregar = (txt) => {
      const ahora = Date.now();
      /* el mismo código dos veces seguidas es la cámara insistiendo, no el
         conductor escaneando dos veces */
      if (txt === ultimo.current.cod && ahora - ultimo.current.cuando < 2500) return;
      ultimo.current = {cod:txt, cuando:ahora};
      try { if (navigator.vibrate) navigator.vibrate(60); } catch(e){}
      onLeer(txt);
    };
    const leer = async () => {
      if (!activo) return;
      const v = videoRef.current;
      if (v && v.readyState === 4){
        try{
          if (detector){
            const codes = await detector.detect(v);
            if (codes && codes.length && codes[0].rawValue) entregar(codes[0].rawValue);
          } else if (typeof jsQR !== "undefined"){
            canvas.width=v.videoWidth; canvas.height=v.videoHeight;
            ctx.drawImage(v,0,0);
            const img=ctx.getImageData(0,0,canvas.width,canvas.height);
            const code=jsQR(img.data,img.width,img.height);
            if (code && code.data) entregar(code.data);
          } else {
            setError("No se pudo cargar el lector. Marcá a mano y avisá a la oficina.");
            return;
          }
        }catch(e){ }
      }
      timer=setTimeout(leer,250);
    };
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      setError("Este teléfono no deja usar la cámara desde el navegador. Marcá a mano.");
    } else {
      navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}})
        .then(st=>{ stream=st;
          if (videoRef.current){ videoRef.current.srcObject=st; videoRef.current.setAttribute("playsinline","true");
            /* si el conductor cambia de pantalla mientras arranca la cámara,
               play() queda colgado: se ignora, no es un error de verdad */
            const pr = videoRef.current.play(); if (pr && pr.catch) pr.catch(()=>{}); }
          timer=setTimeout(leer,400);
        })
        .catch(()=>setError("No se pudo abrir la cámara. Dale permiso y probá de nuevo, o marcá a mano."));
    }
    return ()=>{ activo=false; if(timer) clearTimeout(timer); if(stream) stream.getTracks().forEach(t=>t.stop()); };
  },[]);
  return (
    <div className="cred-lector">
      <div className="cred-lector-caja">
        <video ref={videoRef} className="cred-lector-video" muted playsInline></video>
        <div className="cred-lector-marco"></div>
      </div>
      {error
        ? <p className="cred-lector-error">{error}</p>
        : <p className="cred-lector-ayuda">Apuntá al QR de la credencial. Podés escanear una atrás de la otra.</p>}
      <button className="btn sec" onClick={onCerrar}>Listo, cerrar la cámara</button>
    </div>
  );
}

function Escaner({vehiculos, user, empresaNombre, demo, onUnidad, onSaved}){
  const videoRef = useRef(null);
  const [error,setError] = useState("");
  const [resultado,setResultado] = useState(null);
  const [ficha,setFicha] = useState(null);        // {unidad|null, clave}
  const [consultando,setConsultando] = useState(false);
  useEffect(()=>{
    if (resultado) return;   // ya leyó: no reabrir la cámara
    let stream = null, timer = 0, activo = true;
    const canvas = document.createElement("canvas");
    const ctx = canvas.getContext("2d", {willReadFrequently:true});
    let detector = null;
    try { if ("BarcodeDetector" in window) detector = new BarcodeDetector({formats:["qr_code"]}); } catch(e){ detector = null; }
    const leer = async () => {
      if (!activo) return;
      const v = videoRef.current;
      if (v && v.readyState === 4){
        try{
          if (detector){
            const codes = await detector.detect(v);
            if (codes && codes.length && codes[0].rawValue){ setResultado(codes[0].rawValue); return; }
          } else if (typeof jsQR !== "undefined"){
            canvas.width = v.videoWidth; canvas.height = v.videoHeight;
            ctx.drawImage(v, 0, 0);
            const img = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const code = jsQR(img.data, img.width, img.height);
            if (code && code.data){ setResultado(code.data); return; }
          } else {
            setError("No se pudo cargar el lector de QR. Revisá la conexión y volvé a entrar a esta pantalla.");
            return;
          }
        }catch(e){ /* frame malo: se reintenta */ }
      }
      timer = setTimeout(leer, 250);
    };
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      setError("Este navegador no permite usar la cámara. Probá con Chrome.");
    } else {
      navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}})
        .then(s=>{
          stream = s;
          if (videoRef.current){
            videoRef.current.srcObject = s;
            videoRef.current.setAttribute("playsinline","true");
            videoRef.current.play();
          }
          timer = setTimeout(leer, 400);
        })
        .catch(()=>setError("No se pudo abrir la cámara. Dale permiso a la cámara en el navegador y probá de nuevo."));
    }
    return ()=>{ activo = false; if (timer) clearTimeout(timer); if (stream) stream.getTracks().forEach(t=>t.stop()); };
  },[resultado]);
  useEffect(()=>{
    if (!resultado) return;
    let clave = resultado;
    try{
      const u = new URL(resultado);
      const i = u.searchParams.get("interno");
      if (i) clave = i;
    }catch(e){ }
    clave = String(clave).trim();
    // 1) ¿es una de MIS unidades? → documentación normal
    const propia = buscarUnidadPorClave(vehiculos, clave);
    if (propia){ onUnidad(propia); return; }
    // 2) unidad ajena → consultar la ficha al servidor
    const consultar = async () => {
      setConsultando(true);
      try{
        if (demo){
          const v = buscarUnidadPorClave(DEMO.vehiculos, clave);
          setFicha({unidad: v || null, clave});
        } else {
          let ses = null;
          try { ses = JSON.parse(almacen.get("SESION")||"null"); } catch(e){ }
          const r = await apiPost({action:"consultarUnidad", dni: ses ? ses.dni : "", pin: ses ? ses.pin : "", clave});
          setFicha({unidad: (r && r.ok && r.vehiculo) ? r.vehiculo : null, clave});
        }
      }catch(e){
        setFicha({unidad: null, clave});   // sin señal: ficha sin datos, reporte igual
      }finally{ setConsultando(false); }
    };
    consultar();
  },[resultado]);
  const otra = () => { setFicha(null); setResultado(null); };
  if (ficha){
    return <FichaUnidadExterna unidad={ficha.unidad} clave={ficha.clave} user={user}
      empresaNombre={empresaNombre} demo={demo} onSaved={onSaved} onOtra={otra}/>;
  }
  return (
    <div className="card">
      <h2>Escanear código QR</h2>
      <div className="chk-help">Apuntá al QR pegado en la unidad. Si es tuya, se abre su documentación; si no, igual ves sus <b>vencimientos</b> y podés <b>reportar</b> sobre ella.</div>
      {error && <div className="kms-alert">⚠ {error}</div>}
      {consultando && <div className="sync-note">Consultando la unidad…</div>}
      {!resultado && !error &&
        <div className="escaner-marco">
          <video ref={videoRef} muted playsInline/>
          <div className="escaner-guia"><div></div></div>
        </div>}
    </div>
  );
}

}

/* ================= PENDIENTES DE ENVÍO (modo campo) ================= */
function Pendientes({colaN, setColaN}){
  const cola = colaLeer();
  const etiqueta = {guardarCheck:"Check del viaje", guardarNovedad:"Novedad / fotos", guardarPedido:"Pedido de insumos"};
  return (
    <div className="card">
      <h2>Pendientes de envío</h2>
      {cola.length === 0
        ? <div className="empty">🎉 No hay nada pendiente: todo lo tuyo ya llegó a la planilla.</div>
        : <React.Fragment>
            <div className="chk-help">Esto quedó guardado en el teléfono porque no había señal. Se manda solo cuando vuelva la conexión, o forzalo ahora.</div>
            {cola.map((it,i)=>(
              <div className="item-lista" key={it.uid||i}>
                <div className="arriba">

/* ================= HOJA DE RUTA · estilo Uber (v5.3) =========================
   El mapa ES la pantalla. Abajo, una sola tarjeta con la parada que viene y
   un botón grande. El chofer no lee: mira el mapa y toca.

   Mapa: Leaflet + OpenStreetMap. Gratis, sin cuenta y sin clave.
   Ubicación en vivo: watchPosition del teléfono. El puntito azul es la unidad.
   Todo funciona sin señal salvo los mosaicos del mapa: la hoja de ruta queda
   guardada en el teléfono y lo que marca el chofer sale solo al reconectar.
   ============================================================================= */

/* Carga Leaflet una sola vez, cuando de verdad se abre el mapa. */
let _leafletCargando = null;
function cargarLeaflet(){
  if (window.L) return Promise.resolve(window.L);
  if (_leafletCargando) return _leafletCargando;
  _leafletCargando = new Promise((listo, falla) => {
    const css = document.createElement("link");
    css.rel = "stylesheet";
    css.href = "https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css";
    document.head.appendChild(css);
    const js = document.createElement("script");
    js.src = "https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js";
    js.onload = () => listo(window.L);
    js.onerror = () => falla(new Error("no se pudo cargar el mapa"));
    document.head.appendChild(js);
  });
  return _leafletCargando;
}

function ubicacionRapida(){
  return new Promise((listo)=>{
    if (!navigator.geolocation) return listo({});
    let contestado = false;
    const cortar = setTimeout(()=>{ if(!contestado){ contestado=true; listo({}); } }, 6000);
    navigator.geolocation.getCurrentPosition(
      (p)=>{ if(contestado) return; contestado=true; clearTimeout(cortar);
             listo({lat:p.coords.latitude, lng:p.coords.longitude}); },
      ()=>{ if(contestado) return; contestado=true; clearTimeout(cortar); listo({}); },
      {enableHighAccuracy:true, timeout:6000, maximumAge:30000}
    );
  });
}

const rutaHoraAhora = () => {
  const d = new Date(), p = (n)=> n<10 ? "0"+n : ""+n;
  return p(d.getHours())+":"+p(d.getMinutes())+":"+p(d.getSeconds());
};
const rutaDos = (n)=> n<10 ? "0"+n : ""+n;
const rutaEstLeer = (sid) => { try { return JSON.parse(almacen.get("RUTA_EST_"+sid)||"{}"); } catch(e){ return {}; } };
const rutaEstGuardar = (sid, est) => { try { almacen.set("RUTA_EST_"+sid, JSON.stringify(est)); } catch(e){} };

function HojaDeRuta({user, demo, onSaved, onVolver}){
  const dni = soloDigitos(user.dni);
  const [cargando,setCargando] = useState(true);
  const [error,setError] = useState("");
  const [servicio,setServicio] = useState(null);
  const [paradas,setParadas] = useState([]);
  const [trasbordos,setTrasbordos] = useState([]);
  const [espera,setEspera] = useState(180);
  const [offline,setOffline] = useState(false);
  const [actual,setActual] = useState(0);
  const [llegadas,setLlegadas] = useState({});
  const [marcas,setMarcas] = useState({});
  /* OJO: estos dos van ACÁ y no más abajo. Este componente tiene returns
     tempranos (cargando / error / sin paradas), y un useState declarado
     después de un return se saltea en esos renders → React error 310. */
  const [escaneando, setEscaneando] = useState(false);
  const [avisoQR, setAvisoQR] = useState(null);   // {tipo, texto}
  const [enviando,setEnviando] = useState("");
  const [abierto,setAbierto] = useState(false);      // la tarjeta de abajo desplegada
  const [tick,setTick] = useState(0);
  const [miPos,setMiPos] = useState(null);
  const [sinMapa,setSinMapa] = useState(false);
  const desdeRef = useRef(null);
  const mapaRef = useRef(null);
  const objetos = useRef({ mapa:null, yo:null, paradas:[], linea:null });

  /* ── traer la hoja de ruta ── */
  const traer = async () => {
    setCargando(true); setError(""); setOffline(false);
    const clave = "RUTA_"+dni+"_"+hoy();
    if (demo || !API_URL){ setCargando(false); setError("Modo demo: no hay servicio para mostrar."); return; }
    const deCache = () => {
      try { const c = JSON.parse(almacen.get(clave)||"null");
        if (c && c.paradas){ aplicar(c); setOffline(true); return true; } } catch(e){}
      return false;
    };
    if (!navigator.onLine){
      setCargando(false);
      if (!deCache()) setError("Sin señal y sin la hoja de ruta guardada en este teléfono. La primera vez hay que abrirla con internet.");
      return;
    }
    try{
      const r = await apiPost({action:"recServicioDelDia", data:{fecha:hoy(), dni:dni}});
      setCargando(false);
      if (!r || r.ok === false){ setError((r&&r.error)||"No se pudo traer la hoja de ruta."); return; }
      if (!r.hay){ setServicio(null); setError(r.mensaje||"Hoy no tenés un servicio cargado."); return; }
      try { almacen.set(clave, JSON.stringify(r)); } catch(e){}
      aplicar(r);
    }catch(e){
      setCargando(false);
      if (!deCache()) setError("No se pudo conectar. Probá de nuevo cuando tengas señal.");
    }
  };

  const aplicar = (r) => {
    setServicio(r.servicio); setParadas(r.paradas||[]);
    setTrasbordos(r.trasbordos||[]); setEspera(r.espera_maxima_seg || 180);
    const est = rutaEstLeer(r.servicio.id);
    setLlegadas(est.llegadas || {}); setMarcas(est.marcas || {});
    setActual(typeof est.actual === "number" ? est.actual : 0);
  };

  useEffect(()=>{ traer(); },[]);
  useEffect(()=>{ if (servicio) rutaEstGuardar(servicio.id, {llegadas, marcas, actual}); },[llegadas, marcas, actual, servicio]);
  useEffect(()=>{ const t = setInterval(()=>setTick(x=>x+1), 500); return ()=>clearInterval(t); },[]);

  /* ── la unidad en vivo ── */
  useEffect(()=>{
    if (!navigator.geolocation) return;
    const id = navigator.geolocation.watchPosition(
      (p)=> setMiPos({lat:p.coords.latitude, lng:p.coords.longitude, precision:p.coords.accuracy}),
      ()=>{}, {enableHighAccuracy:true, maximumAge:5000, timeout:15000}
    );
    return ()=> navigator.geolocation.clearWatch(id);
  },[]);

  /* ── dibujar el mapa ── */
  const conCoords = paradas.filter(p => Number(p.lat) && Number(p.lng));
  useEffect(()=>{
    if (!servicio || !mapaRef.current) return;
    let vivo = true;
    cargarLeaflet().then(L => {
      if (!vivo || !mapaRef.current) return;
      const o = objetos.current;
      if (!o.mapa){
        o.mapa = L.map(mapaRef.current, {zoomControl:false, attributionControl:true})
          .setView([-38.94, -68.06], 12);
        L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
          {maxZoom:19, attribution:"© OpenStreetMap"}).addTo(o.mapa);
        L.control.zoom({position:"bottomleft"}).addTo(o.mapa);
      }
      /* paradas */
      o.paradas.forEach(m => o.mapa.removeLayer(m)); o.paradas = [];
      if (o.linea){ o.mapa.removeLayer(o.linea); o.linea = null; }
      const puntos = [];
      conCoords.forEach((p, i) => {
        const idx = paradas.indexOf(p);
        const hecha = !!llegadas[p.parada_id];
        const esActual = idx === actual;
        const color = hecha ? "#16A34A" : (esActual ? "#1f7a4d" : "#6B7580");
        const etiqueta = p.letra || (String(p.tipo)==="destino" ? "🏭" : "•");
        const icono = L.divIcon({ className:"", iconSize:[30,30], iconAnchor:[15,15],
          html:'<div style="width:30px;height:30px;border-radius:50%;background:'+color+
               ';color:#fff;display:flex;align-items:center;justify-content:center;font:800 14px Arial;'+
               'border:'+(esActual?"3px solid #f5b52e":"2px solid #fff")+';box-shadow:0 1px 4px rgba(0,0,0,.4)">'+etiqueta+'</div>' });
        const m = L.marker([Number(p.lat), Number(p.lng)], {icon:icono}).addTo(o.mapa);
        m.bindPopup("<b>"+(p.letra?"Parada "+p.letra+" · ":"")+p.nombre+"</b><br>"+
                    (p.hora_prevista||"")+"<br>"+(p.pasajeros||[]).map(x=>x.nombre).join("<br>"));
        o.paradas.push(m);
        puntos.push([Number(p.lat), Number(p.lng)]);
      });
      if (puntos.length > 1){
        o.linea = L.polyline(puntos, {color:"#1f7a4d", weight:4, opacity:.65, dashArray:"6 6"}).addTo(o.mapa);
      }
      /* El mapa SIGUE a la parada que viene, como en Uber: siempre centrado
         en lo próximo que tiene que hacer el chofer. Si esa parada no tiene
         ubicación cargada, encuadra todo lo que sí tenga. */
      const actualP = paradas[actual];
      if (actualP && Number(actualP.lat) && Number(actualP.lng)){
        o.mapa.setView([Number(actualP.lat), Number(actualP.lng)], 15, {animate:true});
      } else if (puntos.length && !o._encuadro){
        o.mapa.fitBounds(puntos, {padding:[50,50], maxZoom:15});
        o._encuadro = true;
      }
      setTimeout(()=>{ try{ o.mapa.invalidateSize(); }catch(e){} }, 200);
    }).catch(()=> setSinMapa(true));
    return ()=>{ vivo = false; };
  },[servicio, paradas, llegadas, actual]);

  /* ── el puntito de la unidad ── */
  useEffect(()=>{
    const o = objetos.current;
    if (!o.mapa || !miPos || !window.L) return;
    const L = window.L;
    if (!o.yo){
      o.yo = L.circleMarker([miPos.lat, miPos.lng],
        {radius:9, color:"#fff", weight:3, fillColor:"#2563eb", fillOpacity:1}).addTo(o.mapa);
      o.yo.bindPopup("Tu unidad");
    } else {
      o.yo.setLatLng([miPos.lat, miPos.lng]);
    }
  },[miPos]);

  if (cargando) return <div className="sync-note">Buscando tu hoja de ruta de hoy…</div>;

  if (error && !servicio) return (
    <div className="card">
      <h2>Hoja de ruta</h2>
      <p style={{fontSize:14.5,color:"var(--muted)",lineHeight:1.5}}>{error}</p>
      <button className="btn sec" onClick={traer}>Volver a probar</button>
    </div>
  );

  const totalPax = paradas.reduce((n,p)=> n + (p.pasajeros||[]).length, 0);
  const hechos = Object.keys(marcas).length;
  /* Si no hay paradas, esto NO está terminado: está vacío. Antes caía en
     "Servicio terminado 0 y 0", que confunde a cualquiera. */
  const sinParadas = !paradas.length;
  const terminado = !sinParadas && actual >= paradas.length;

  /* ── acciones ── */
  const tocarLlegue = async (p) => {
    setEnviando(p.parada_id);
    const pos = miPos || await ubicacionRapida();
    const hora = rutaHoraAhora();
    desdeRef.current = Date.now();
    setLlegadas(x => ({...x, [p.parada_id]: {hora}}));
    setAbierto(true);
    await enviarOEncolar("recMarcarPaso", {
      servicio_id: servicio.id, fecha: servicio.fecha, parada_id: p.parada_id,
      parada: (p.letra ? "Parada "+p.letra+" - " : "") + p.nombre,
      hora_prevista: p.hora_prevista, hora_real: hora, resultado: "paso_con_pasajeros",
      lat: pos.lat||"", lng: pos.lng||"", dni: dni, chofer: user.nombre
    }, demo);
    setEnviando("");
  };

  const nadieSube = async (p) => {
    setEnviando(p.parada_id);
    const pos = miPos || await ubicacionRapida();
    const hora = rutaHoraAhora();
    setLlegadas(x => ({...x, [p.parada_id]: {hora, salteada:true}}));
    await enviarOEncolar("recMarcarPaso", {
      servicio_id: servicio.id, fecha: servicio.fecha, parada_id: p.parada_id,
      parada: (p.letra ? "Parada "+p.letra+" - " : "") + p.nombre,
      hora_prevista: p.hora_prevista, hora_real: hora, resultado: "paso_sin_pasajeros",
      lat: pos.lat||"", lng: pos.lng||"", dni: dni, chofer: user.nombre
    }, demo);
    setEnviando(""); setActual(a=>a+1); desdeRef.current = null; setAbierto(false);
  };

  const marcar = async (p, pa, resultado, metodo) => {
    setEnviando(pa.pasajero_id);
    const pos = miPos || await ubicacionRapida();
    const hora = rutaHoraAhora();
    const esperado = desdeRef.current ? Math.round((Date.now()-desdeRef.current)/1000) : "";
    setMarcas(x => ({...x, [pa.pasajero_id]: {resultado, hora, espera:esperado, metodo: metodo === "QR" ? "QR" : "MANUAL"}}));
    await enviarOEncolar("recMarcarAscenso", {
      servicio_id: servicio.id, fecha: servicio.fecha, parada_id: p.parada_id,
      parada: (p.letra ? "Parada "+p.letra+" - " : "") + p.nombre,
      pasajero_id: pa.pasajero_id, pasajero: pa.nombre, resultado: resultado,
      hora_prevista: p.hora_prevista, hora_real: hora, espera_seg: esperado,
      lat: pos.lat||"", lng: pos.lng||"", dni: dni, chofer: user.nombre,
      /* QR = escaneó la credencial. MANUAL = lo marcó con el dedo.
         Las dos cosas son válidas, pero en la oficina se ven distintas. */
      metodo: metodo === "QR" ? "QR" : "MANUAL"
    }, demo);
    setEnviando("");
  };

  /* ── ESCANEAR LA CREDENCIAL ────────────────────────────────────────────
     Los códigos del día ya vinieron con el recorrido, así que esto anda SIN
     SEÑAL: se compara contra lo que el teléfono ya tiene. */
  const codigoLimpio = (t) => String(t||"").trim().toUpperCase();

  const alEscanear = async (texto, p) => {
    const cod = codigoLimpio(texto);
    if (!cod) return;
    /* 1) ¿es de alguien de ESTA parada? */
    const aca = (p.pasajeros||[]).find(x => codigoLimpio(x.qr) === cod);
    if (aca) {
      if (marcas[aca.pasajero_id]) {
        setAvisoQR({tipo:"ya", texto: aca.nombre + " ya estaba marcado."});
        return;
      }
      setEscaneando(false);
      await marcar(p, aca, "subio", "QR");
      setAvisoQR({tipo:"ok", texto: "✅ " + aca.nombre + " · subió (credencial escaneada)"});
      return;
    }
    /* 2) ¿es de otra parada del mismo servicio? Pasa de verdad: la gente
          camina hasta otra esquina. No se pierde: se ofrece marcarlo acá. */
    let otra = null, dondeIba = null;
    (paradas||[]).forEach(q => (q.pasajeros||[]).forEach(x => {
      if (codigoLimpio(x.qr) === cod) { otra = x; dondeIba = q; }
    }));
    if (otra) {
      setEscaneando(false);
      if (marcas[otra.pasajero_id]) { setAvisoQR({tipo:"ya", texto: otra.nombre + " ya estaba marcado."}); return; }
      const ok = confirm(otra.nombre + " figura en la parada " + (dondeIba.letra || dondeIba.nombre) + ", no en esta.\n\n¿Subió acá igual?");
      if (!ok) { setAvisoQR({tipo:"no", texto:"No se marcó nada."}); return; }
      await marcar(p, otra, "subio", "QR");
      setAvisoQR({tipo:"ok", texto:"✅ " + otra.nombre + " · subió acá (venía de la parada " + (dondeIba.letra||dondeIba.nombre) + ")"});
      return;
    }
    /* 3) no es de este servicio */
    setAvisoQR({tipo:"no", texto:"Esa credencial no es de ningún pasajero de tu servicio de hoy."});
  };

  const siguiente = () => { setActual(a=>a+1); desdeRef.current = null; setAbierto(false); };

  const cerrar = async () => {
    setEnviando("cierre");
    await enviarOEncolar("recCerrarServicio", {servicio_id: servicio.id, dni: dni}, demo);
    setEnviando(""); setActual(paradas.length);
    if (onSaved) onSaved({tipo:"Hoja de ruta", fecha:hoy(), hora:rutaHoraAhora(),
      detalle:"Servicio "+(servicio.grupo||servicio.id)+" · "+Object.keys(marcas).length+" pasajero(s)"});
  };

  if (sinParadas) return (
    <div className="card">
      <h2>Sin paradas</h2>
      <p style={{fontSize:14.5,color:"var(--muted)",lineHeight:1.5}}>
        Tu servicio de hoy está cargado pero todavía no tiene paradas armadas. Avisale a la oficina.
      </p>
      <button className="btn sec" onClick={traer}>Volver a probar</button>
    </div>
  );

  /* ── pantalla final ── */
  if (terminado){
    let subieron=0, faltaron=0;
    Object.keys(marcas).forEach(k => marcas[k].resultado==="subio" ? subieron++ : faltaron++);
    return (
      <React.Fragment>
        <div className="card">
          <h2>Servicio terminado</h2>
          <p style={{fontSize:13,color:"var(--muted)",fontWeight:600,margin:"0 0 6px"}}>
            {(servicio.grupo || "Servicio") + " · " + fmtFecha(servicio.fecha)}
          </p>
          <div className="ruta-cuadros">
            <div className="ruta-cuadro v"><b>{subieron}</b><span>SUBIERON</span></div>
            <div className="ruta-cuadro r"><b>{faltaron}</b><span>NO ESTABAN</span></div>
          </div>
          <div className="ruta-detalle">
            {paradas.map(p => {
              const l = llegadas[p.parada_id];
              return <div key={p.parada_id}>{p.letra ? "Parada "+p.letra : p.nombre} · {!l ? "— sin registrar" : (l.salteada ? "⏭ no se paró" : "✓ "+l.hora)}</div>;
            })}
          </div>
        </div>
        <button className="btn sec" onClick={() => {
          if (!window.confirm("¿Empezar esta hoja de ruta de nuevo?\n\nSe borra solo lo marcado EN ESTE TELÉFONO y volvés a la primera parada. Lo que ya se mandó a la oficina queda registrado igual.")) return;
          try { almacen.del("RUTA_EST_" + servicio.id); } catch(e){}
          setLlegadas({}); setMarcas({}); setActual(0); desdeRef.current = null;
        }}>↻ Empezar la hoja de ruta de nuevo</button>
        <button className="btn sec" onClick={onVolver} style={{marginTop:10}}>Volver al inicio</button>
      </React.Fragment>
    );
  }

  const p = paradas[actual];
  const yaLlegue = llegadas[p.parada_id] && !llegadas[p.parada_id].salteada;
  const esPlanta = String(p.tipo) === "destino";
  const pax = p.pasajeros || [];
  const faltanMarcar = pax.filter(x => !marcas[x.pasajero_id]).length;
  const tieneCoord = Number(p.lat) && Number(p.lng);

  let crono = null;
  if (yaLlegue && !esPlanta && desdeRef.current){
    const pasado = Math.floor((Date.now()-desdeRef.current)/1000);
    const queda = espera - pasado, vencido = queda < 0, v = Math.abs(queda);
    crono = (
      <div className={"ruta-crono"+(vencido?" vencido":"")}>
        <div className="num">{(vencido?"+":"")+Math.floor(v/60)+":"+rutaDos(v%60)}</div>
        <div className="txt">{vencido ? "Ya pasaron los "+Math.round(espera/60)+" minutos. Podés seguir." : "Esperá en la parada"}</div>
      </div>
    );
  }

  const comoLlegar = () => {
    const destino = tieneCoord ? (p.lat + "," + p.lng) : p.nombre;
    window.open("https://www.google.com/maps/dir/?api=1&destination=" + encodeURIComponent(destino) + "&travelmode=driving", "_blank");
  };

  return (
    <div className="ruta-pantalla">
      {offline && <div className="ruta-banda">📴 Estás viendo la hoja de ruta guardada. Lo que marques sale solo cuando vuelva la señal.</div>}

      <div className="ruta-cabecera">
        <div>
          <b>{servicio.grupo || "Servicio de hoy"}</b>
          <span>Parada {actual+1} de {paradas.length} · {hechos} de {totalPax} pasajeros</span>
        </div>
        <div className="ruta-riel"><i style={{width: Math.round(actual/paradas.length*100)+"%"}}/></div>
      </div>

      <div className="ruta-mapa-caja">
        <div ref={mapaRef} className="ruta-mapa"/>
        {(sinMapa || !conCoords.length) && (
          <div className="ruta-mapa-vacio">
            {sinMapa ? "No se pudo cargar el mapa. La hoja de ruta funciona igual."
                     : "Las paradas de hoy todavía no tienen ubicación cargada. Avisale a la oficina para verlas en el mapa."}
          </div>
        )}
      </div>

      <div className={"ruta-hoja"+(abierto?" abierta":"")}>
        <div className="ruta-agarre" onClick={()=>setAbierto(a=>!a)}><span/></div>

        <div className="ruta-parada-cab">
          <div className="letra">{p.letra || (esPlanta ? "🏭" : "📍")}</div>
          <div className="txt">
            <b>{(p.letra ? "Parada "+p.letra+" · " : "")+p.nombre}</b>
            <span>{esPlanta ? "Llegada prevista "+(p.hora_prevista||"—")
                  : (p.hora_prevista||"—")+" · "+pax.length+(pax.length===1?" pasajero":" pasajeros")}</span>
          </div>
          <button className="ruta-ir" onClick={comoLlegar}>Ir ▸</button>
        </div>

        {!yaLlegue ? (
          <div className="ruta-acciones">
            <button className="ruta-btn" disabled={enviando===p.parada_id}
              onClick={()=> esPlanta ? (tocarLlegue(p), setTimeout(cerrar, 10)) : tocarLlegue(p)}>
              {enviando===p.parada_id ? "Guardando…" : (esPlanta ? "🏭 Llegué a la planta" : "📍 Llegué a la parada")}
            </button>
            {!esPlanta && <button className="ruta-btn gris" disabled={enviando===p.parada_id} onClick={()=>nadieSube(p)}>
              Nadie sube acá
            </button>}
          </div>
        ) : (
          <div className="ruta-acciones">
            {crono}
            <p className="ruta-rotulo">👤 ¿Quién subió acá?</p>
            {escaneando
              ? <LectorCredencial onLeer={(t)=>alEscanear(t,p)} onCerrar={()=>{setEscaneando(false); setAvisoQR(null);}} />
              : <button className="cred-btn" onClick={()=>{setAvisoQR(null); setEscaneando(true);}}>📷 Escanear credencial</button>}
            {avisoQR && <div className={"cred-aviso "+avisoQR.tipo}>{avisoQR.texto}</div>}
            {pax.map(pa => {
              const m = marcas[pa.pasajero_id];
              return (
                <div className={"ruta-pax"+(m?" resuelto":"")} key={pa.pasajero_id}>
                  <div className="nom">
                    {pa.nombre}
                    {pa.trasbordo ? <span className="ruta-chip">Trasbordo {pa.trasbordo}</span> : null}
                  </div>
                  {pa.tel ? <a className="ruta-tel" href={"tel:"+String(pa.tel).replace(/[^0-9+]/g,"")}>📞 {pa.tel}</a> : null}
                  {!m ? (
                    <div className="ruta-par">
                      <button className="si" disabled={enviando===pa.pasajero_id} onClick={()=>marcar(p,pa,"subio")}>✅ Subió</button>
                      <button className="no" disabled={enviando===pa.pasajero_id} onClick={()=>marcar(p,pa,"no_estaba")}>❌ No estaba</button>
                    </div>
                  ) : (
                    <div className={"ruta-marca "+(m.resultado==="subio"?"ok":"mal")}>
                      <span>{m.resultado==="subio" ? "✅ Subió a las "+m.hora : "❌ No estaba · "+m.hora}{m.resultado==="subio" ? <em className="cred-metodo">{m.metodo==="QR" ? "credencial escaneada" : "marcado a mano"}</em> : null}</span>
                      <button className="ruta-deshacer" onClick={()=>setMarcas(x=>{const c={...x}; delete c[pa.pasajero_id]; return c;})}>deshacer</button>
                      {m.resultado!=="subio" && <small>{Number(m.espera) >= espera
                        ? "Esperaste los "+Math.round(espera/60)+" minutos. Queda registrado que la unidad estuvo."
                        : "Ojo: esperaste "+m.espera+" seg de los "+espera+" que corresponden."}</small>}
                    </div>
                  )}
                </div>
              );
            })}
            <button className="ruta-btn" onClick={siguiente}>
              {faltanMarcar ? "Seguir igual ("+faltanMarcar+" sin marcar) →" : "Seguir a la próxima parada →"}
            </button>
          </div>
        )}

        {!!trasbordos.length && abierto && (
          <div className="ruta-trasbordo">
            {trasbordos.map(t => (
              <div key={t.proveedor}>
                <b>↔ Los trae {t.proveedor}</b>
                <span>{(t.gente||[]).map(x=>x.nombre).join(", ")}{t.punto ? " · en "+t.punto : ""}</span>
              </div>
            ))}
          </div>
        )}
      </div>
    </div>
  );
}

/* ================= BIBLIOTECA (v5.3.2) =================
   Manuales e instructivos que la oficina marcó como visibles para los
   conductores. Cada documento es un link (Drive) que se abre en el navegador.
   Llega desde el conector v2.9.2+ en datosConductor. */
function Biblioteca({datos}){
  const docs = (datos.biblioteca || []);
  const cats = [];
  docs.forEach(d => {
    const c = String(d.categoria || "Otros");
    let g = cats.find(x => x.cat === c);
    if (!g){ g = {cat:c, items:[]}; cats.push(g); }
    g.items.push(d);
  });
  return (
    <React.Fragment>
      {docs.length === 0 && (
        <div className="seccion"><div className="item-lista"><div className="det">
          Todavía no hay manuales publicados. Cuando la oficina cargue documentos en la Biblioteca, los vas a ver acá.
        </div></div></div>
      )}
      {cats.map(g => (
        <div className="seccion" key={g.cat}>
          <div className="cabecera"><h3>{g.cat}</h3></div>
          {g.items.map((d,i)=>(
            <a className="item-lista" key={d.id||i} href={d.url} target="_blank" rel="noopener noreferrer"
               style={{display:"block",cursor:"pointer",textDecoration:"none",color:"inherit"}}>
              <div className="arriba"><b>📄 {d.titulo}</b><span style={{color:"var(--muted)",fontSize:12}}>abrir →</span></div>
              {d.notas ? <div className="det">{d.notas}</div> : null}
            </a>
          ))}
        </div>
      ))}
      <div className="seccion"><div className="item-lista"><div className="det">
        Los documentos se abren desde Drive: hace falta señal para verlos. Si un link no abre, avisale a la oficina.
      </div></div></div>
    </React.Fragment>
  );
}
/* ================= APP v3 ================= */
const TITULOS = {check:"Check del viaje", novedad:"Reportar novedad", media:"Fotos de la unidad",
  venc:"Unidad · Documentación", historial:"Mis envíos", ajustes:"Personalización",
  pedidos:"Pedidos de insumos", seguimiento:"Seguimiento del taller", diagramas:"Diagramas",
  escaner:"Escanear QR", pendientes:"Pendientes de envío", biblioteca:"Biblioteca",
  ruta:"Hoja de ruta"};
function App(){
  const modoDemo = !API_URL;
  const [datos,setDatos] = useState(null);
  const [cargando,setCargando] = useState(false);
  const [errorCarga,setErrorCarga] = useState("");
  const [fechaCache,setFechaCache] = useState("");
  const [user,setUser] = useState(null);
  const [vista,setVista] = useState(INTERNO_QR ? "venc" : "home");
  const [internoSel,setInternoSel] = useState(INTERNO_QR || "");
  const [registros,setRegistros] = useState([]);
  const [colaN,setColaN] = useState(colaLeer().length);
  const [marcaTick,setMarcaTick] = useState(0);
  const [verContactos,setVerContactos] = useState(false);
  const [arrancando,setArrancando] = useState(()=>{ try{ return !!JSON.parse(almacen.get("SESION")||"null"); }catch(e){ return false; } });
  const marca = marcaFinal(datos);
  useEffect(()=>{ aplicarMarca(marca); },[datos, marcaTick]);
  const alEntrar = (r) => {
    setUser(r.conductor);
    setDatos(r.datos);
    setRegistros(registrosLeer(soloDigitos(r.conductor.dni)));
    setFechaCache(r.fecha || "");
    setErrorCarga(r.offline ? "Sin conexión: estás viendo lo último sincronizado en este teléfono." : "");
  };
  const refrescar = async () => {
    let ses = null;
    try { ses = JSON.parse(almacen.get("SESION")||"null"); } catch(e){ }
    if (!ses || !ses.dni){ setArrancando(false); return; }
    setCargando(true);
    const r = await loginConductor(ses.dni, ses.pin);
    setCargando(false); setArrancando(false);
    if (r.error){
      if (/PIN|conductor/i.test(r.error)){ almacen.del("SESION"); setUser(null); setDatos(null); }
      else setErrorCarga(r.error);
      return;
    }
    alEntrar(r);
  };
  /* al abrir: retomar sesión; cola: al reconectar y cada 1 minuto */
  useEffect(()=>{
    refrescar();
    procesarCola(setColaN);
    const alConectar = () => { procesarCola(setColaN); refrescar(); };
    window.addEventListener("online", alConectar);
    const timer = setInterval(()=>procesarCola(setColaN), 60000);
    return ()=>{ window.removeEventListener("online", alConectar); clearInterval(timer); };
  },[]);
  if (arrancando) return (
    <div className="login-wrap"><div className="login-card">
      <div className="login-banda"><Insignia marca={marca}/><h1>{marca.nombre}</h1><p>Entrando…</p></div>
    </div></div>
  );
  if (!user || !datos){
    return <Login marca={marca} demo={modoDemo} onLogin={alEntrar}/>;
  }
  const empresas = datos.empresas || [];
  const empActiva = empresas.find(e=>esActivo(e.estado)) || empresas[0] || null;
  const empresaId = empActiva ? empActiva.id : 1;
  const empresaNombre = (empActiva && empActiva.nombre) || (datos.marca && datos.marca.nombreSistema) || "Mi empresa";
  const datosEmpresa = {
    ...datos,
    vehiculos: (datos.vehiculos||[]).filter(v => !/inactivo|suspendido/.test(String(v.estado||"").toLowerCase())),
  };
  const yo = datos.conductor || user;
  const salir = () => { setUser(null); setDatos(null); almacen.del("SESION"); setVista("home"); };
  const alGuardar = (inf) => setRegistros(registrosAgregar(soloDigitos(yo.dni), inf));
  const abrirUnidad = (v) => { setInternoSel(String(v.vehiculo || v.patente || "")); setVista("venc"); };
  return (
    <React.Fragment>
      <div className="topbar">
        <div className="tt">
          <Insignia marca={marca} size={34}/>
          <div className="who">
            <span className="emp">{empresaNombre}</span>
            <b>{yo.nombre}</b>
          </div>
        </div>
        <div style={{display:"flex",gap:6}}>
          <button className="ib tel" title="Llamar al asesor o a contingencias" onClick={()=>setVerContactos(true)}><Ico n="phone" s={18}/></button>
          <button className={"ib" + (cargando ? " gira" : "")} title="Actualizar" onClick={refrescar}><Ico n="ref" s={18}/></button>
          <button className="ib" title="Personalización" onClick={()=>setVista("ajustes")}><Ico n="gear" s={18}/></button>
          <button className="ib" title="Salir" onClick={salir}><Ico n="out" s={18}/></button>
        </div>
      </div>
      {errorCarga && <div className="offline-band" style={{background:"var(--amber-soft)",color:"var(--alerta)"}}>
        📴 {errorCarga}{fechaCache ? " (" + fmtFecha(fechaCache.slice(0,10)) + ")" : ""} <a style={{cursor:"pointer",textDecoration:"underline"}} onClick={refrescar}>Reintentar</a>
      </div>}
      {modoDemo && <div className="offline-band" style={{background:"var(--amber-soft)",color:"var(--alerta)"}}>Modo demo: nada se guarda en la planilla.</div>}
      {colaN > 0 && vista !== "pendientes" && vista !== "home" &&
        <div className="offline-band" style={{background:"var(--amber-soft)",color:"var(--alerta)",cursor:"pointer"}} onClick={()=>setVista("pendientes")}>
          📴 {colaN} envío(s) guardados esperando señal — tocá para ver
        </div>}
      {verContactos && <Contactos contactos={datos.contactos} onCerrar={()=>setVerContactos(false)}/>}
      {vista !== "home" && vista !== "ruta" &&
        <div className="back-row">
          <button className="back-btn" onClick={()=>setVista("home")}><Ico n="back" s={16}/> Volver</button>
          <div className="screen-title">{TITULOS[vista] || ""}</div>
        </div>}
      <div className={vista === "home" || vista === "ruta" ? "" : "container"} style={vista === "home" ? {paddingBottom:"calc(var(--nav-h) + 40px)"} : null}>
        {cargando && vista !== "home" && <div className="sync-note">Actualizando tus datos…</div>}
        {vista==="home" && <Home user={yo} empresaNombre={empresaNombre} datos={datosEmpresa} colaN={colaN} irA={setVista} abrirContactos={()=>setVerContactos(true)}/>}
        {vista==="check" &&
          <CheckForm user={yo} datos={datosEmpresa} empresaId={empresaId} empresaNombre={empresaNombre}
            demo={modoDemo} onSaved={alGuardar}/>}
        {vista==="novedad" &&
          <NovedadRapida user={yo} datos={datosEmpresa} empresaId={empresaId} empresaNombre={empresaNombre}
            demo={modoDemo} modo="novedad" onSaved={alGuardar} onVolver={()=>setVista("home")}/>}
        {vista==="media" &&
          <NovedadRapida user={yo} datos={datosEmpresa} empresaId={empresaId} empresaNombre={empresaNombre}
            demo={modoDemo} modo="media" onSaved={alGuardar} onVolver={()=>setVista("home")}/>}
        {vista==="pedidos" &&
          <Pedidos user={yo} datos={datosEmpresa} empresaId={empresaId} empresaNombre={empresaNombre}
            demo={modoDemo} onSaved={alGuardar}/>}
        {vista==="seguimiento" && <Seguimiento user={yo} datos={datosEmpresa}/>}
        {vista==="diagramas" && <Diagramas datos={datosEmpresa} user={yo} demo={modoDemo}/>}
        {vista==="biblioteca" && <Biblioteca datos={datosEmpresa}/>}
        {vista==="ruta" && <HojaDeRuta user={yo} demo={modoDemo} onSaved={alGuardar} onVolver={()=>setVista("home")}/>}
        {vista==="venc" && <Vencimientos datos={datosEmpresa} user={yo} internoInicial={internoSel}/>}
        {vista==="escaner" && <Escaner vehiculos={datosEmpresa.vehiculos} user={yo} empresaNombre={empresaNombre}
          demo={modoDemo} onUnidad={abrirUnidad} onSaved={alGuardar}/>}
        {vista==="pendientes" && <Pendientes colaN={colaN} setColaN={setColaN}/>}
        {vista==="historial" && <Historial registros={registros}/>}
        {vista==="ajustes" && <Ajustes marca={marca} onCambio={()=>setMarcaTick(t=>t+1)} onVolver={()=>setVista("home")}/>}
      </div>
      <div className="bottomnav">
        <button className={vista==="home"?"act":""} onClick={()=>setVista("home")}><Ico n="home"/>Inicio</button>
        <button className={vista==="check"?"act":""} onClick={()=>setVista("check")}><Ico n="check"/>Check</button>
        <div className="nav-qr">
          <button onClick={()=>setVista("escaner")} title="Escanear QR"><Ico n="qr"/></button>
          <small>QR</small>
        </div>
        <button className={vista==="seguimiento"?"act":""} onClick={()=>setVista("seguimiento")}><Ico n="tool"/>Taller</button>
        <button className={vista==="pedidos"?"act":""} onClick={()=>setVista("pedidos")}><Ico n="box"/>Pedidos</button>
      </div>
    </React.Fragment>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
