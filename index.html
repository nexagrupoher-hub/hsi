<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Gestión de Flota · App del conductor</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<script src="https://unpkg.com/jsqr@1.4.0/dist/jsQR.js"></script>
<style>
  :root{
    --ink:#16211c; --panel:#ffffff; --bg:#eef1ed; --line:#d5dcd4;
    --green:#1f7a4d; --green-dark:#155c39; --amber:#f5b52e; --amber-soft:#fdf3d7;
    --red:#c0392b; --muted:#6b7a70; --blue:#2563eb; --nav-h:64px;
    --dark:#12251b; --dark2:#1a3325; --hero2:#1f4632; --hero3:#2b6647;
    --sobre-oscuro:#a8c6b4;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Segoe UI",system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);-webkit-text-size-adjust:100%}
  .mono{font-variant-numeric:tabular-nums;font-family:"Consolas","Roboto Mono",monospace}
  /* ---------- LOGIN / CONFIG ---------- */
  .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(160deg,var(--dark) 0%,var(--hero2) 60%,var(--hero3) 100%);padding:20px}
  .login-card{background:var(--panel);border-radius:16px;width:100%;max-width:400px;
    padding:34px 30px;box-shadow:0 18px 50px rgba(0,0,0,.35)}
  .brand{display:flex;align-items:center;gap:12px;margin-bottom:6px}
  .brand-badge{width:46px;height:46px;border-radius:12px;background:var(--green);color:#fff;
    display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px;letter-spacing:-1px}
  .brand h1{font-size:21px;letter-spacing:-.3px}
  .brand small{display:block;color:var(--muted);font-weight:500;font-size:12px}
  .login-card label{display:block;font-size:12px;font-weight:700;color:var(--muted);
    text-transform:uppercase;letter-spacing:.6px;margin:18px 0 6px}
  .login-card input{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;
    font-size:16px;outline:none;transition:border .15s}
  .login-card input:focus{border-color:var(--green)}
  .btn{width:100%;margin-top:24px;padding:13px;border:none;border-radius:10px;background:var(--green);
    color:#fff;font-size:16px;font-weight:700;cursor:pointer;transition:background .15s}
  .btn:hover{background:var(--green-dark)}
  .btn:disabled{opacity:.5;cursor:default}
  .btn.sec{background:#fff;color:var(--green-dark);border:1.5px solid var(--green)}
  .btn.sec:hover{background:#e7f4ec}
  .login-error{margin-top:14px;color:var(--red);font-size:14px;text-align:center}
  .login-hint{margin-top:20px;padding:10px 12px;background:var(--amber-soft);
    border:1px dashed var(--amber);border-radius:8px;font-size:12px;color:var(--alerta)}
  /* ---------- SHELL ---------- */
  .topbar{background:var(--dark);color:#fff;padding:12px 16px;display:flex;align-items:center;
    justify-content:space-between;position:sticky;top:0;z-index:20;gap:10px}
  .topbar .tt{display:flex;align-items:center;gap:10px;min-width:0}
  .topbar .mini-badge{width:34px;height:34px;border-radius:9px;background:var(--green);color:#fff;
    display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;flex-shrink:0}
  .topbar .who{font-size:11.5px;color:var(--sobre-oscuro);min-width:0}
  .topbar .who b{color:#fff;display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .topbar .who .emp{color:var(--amber);font-weight:700}
  .link-btn{background:none;border:1px solid #3e6a52;color:#cfe6d8;border-radius:8px;
    padding:6px 12px;font-size:13px;cursor:pointer;white-space:nowrap}
  .back-row{display:flex;align-items:center;gap:8px;padding:12px 14px 0;max-width:880px;margin:0 auto}
  .back-btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 14px;
    font-size:14px;font-weight:700;color:var(--green-dark);cursor:pointer}
  .screen-title{font-size:16px;font-weight:800;color:var(--ink)}
  .container{max-width:880px;margin:0 auto;padding:16px 14px calc(var(--nav-h) + 96px)}
  /* bottom nav */
  .bottomnav{position:fixed;bottom:0;left:0;right:0;height:var(--nav-h);background:var(--dark);
    display:flex;z-index:30;box-shadow:0 -6px 20px rgba(0,0,0,.25);
    padding-bottom:env(safe-area-inset-bottom)}
  .bottomnav button{flex:1;background:none;border:none;color:#7fa38d;font-size:11px;font-weight:700;
    cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
  .bottomnav button .ic{font-size:21px;line-height:1}
  .bottomnav button.act{color:var(--amber)}
  /* ---------- HOME ---------- */
  .hero{background:linear-gradient(150deg,var(--dark),var(--hero2));border-radius:14px;color:#fff;
    padding:18px 16px;margin-bottom:16px}
  .hero .emp{color:var(--amber);font-weight:800;font-size:12px;letter-spacing:.8px;text-transform:uppercase}
  .hero h3{font-size:19px;margin:4px 0 2px}
  .hero p{font-size:13px;color:var(--sobre-oscuro)}
  .hero .lic{margin-top:10px}
  .tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 14px;
    cursor:pointer;text-align:left;transition:transform .06s, box-shadow .12s;display:block;width:100%}
  .tile:active{transform:scale(.97)}
  .tile .ic{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;
    font-size:22px;margin-bottom:10px}
  .tile b{display:block;font-size:14.5px;margin-bottom:3px}
  .tile span{font-size:12px;color:var(--muted);line-height:1.35;display:block}
  .ic.g{background:#e7f4ec} .ic.a{background:var(--amber-soft)} .ic.r{background:#fdecea} .ic.b{background:#e8eefb}
  /* ---------- CARDS / FORM ---------- */
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 16px;margin-bottom:16px}
  .card h2{font-size:15px;text-transform:uppercase;letter-spacing:.8px;color:var(--green-dark);
    margin-bottom:14px;display:flex;align-items:center;gap:8px}
  .card h2::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--amber)}
  .grid{display:grid;gap:12px}
  .grid.c2{grid-template-columns:1fr 1fr}
  .grid.c3{grid-template-columns:1fr 1fr 1fr}
  @media(max-width:560px){.grid.c2,.grid.c3{grid-template-columns:1fr}}
  .field label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:5px}
  .field input,.field select,.field textarea{width:100%;padding:10px 12px;border:1.5px solid var(--line);
    border-radius:8px;font-size:15px;background:#fff;outline:none;font-family:inherit}
  .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--green)}
  .field input[readonly]{background:#f4f6f4;color:var(--muted)}
  .field textarea{min-height:80px;resize:vertical}
  .kms-total{background:var(--dark);color:var(--amber);border-radius:8px;padding:10px 12px;
    font-size:20px;font-weight:800;text-align:center}
  .kms-total small{display:block;color:var(--sobre-oscuro);font-size:11px;font-weight:600;letter-spacing:.6px}
  .kms-alert{color:var(--red);font-size:13px;margin-top:6px;font-weight:600}
  .toggle{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .toggle button{padding:12px;border-radius:9px;border:2px solid var(--line);background:#fff;
    font-size:14px;font-weight:700;cursor:pointer;color:var(--muted)}
  .toggle button.on-nov,.toggle button.on-ok{border-color:var(--green-dark);background:var(--green);color:#fff}
  .chk-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  @media(max-width:640px){.chk-grid{grid-template-columns:1fr}}
  .chk{display:flex;align-items:flex-start;gap:10px;padding:10px 11px;border-radius:8px;
    border:1.5px solid var(--line);cursor:pointer;font-size:13.5px;user-select:none;background:#fff;line-height:1.3}
  .chk input{margin-top:2px;width:17px;height:17px;accent-color:#c0392b;flex-shrink:0}
  .chk.marked{border-color:var(--red);background:#fdecea}
  .chk .num{font-weight:800;color:var(--muted);margin-right:2px}
  .chk.marked .num{color:var(--red)}
  .chk-help{font-size:12.5px;color:var(--muted);margin-bottom:10px}
  .sector{margin-bottom:12px}
  .sector label{display:block;font-size:12px;font-weight:800;letter-spacing:.5px;color:var(--ink);
    margin-bottom:5px;text-transform:uppercase}
  .sector textarea{width:100%;min-height:52px;padding:10px 12px;border:1.5px solid var(--amber);
    background:var(--amber-soft);border-radius:8px;font-size:14px;resize:vertical;font-family:inherit;outline:none}
  .sector textarea:focus{border-color:#d99a10;background:#fff}
  /* adjuntos */
  .adj-btns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px}
  @media(max-width:560px){.adj-btns{grid-template-columns:1fr}}
  .adj-btn{padding:11px 8px;border-radius:9px;border:1.5px dashed var(--green);background:#f2f8f4;
    color:var(--green-dark);font-size:13px;font-weight:700;cursor:pointer;text-align:center}
  .adj-btn:active{background:#e7f4ec}
  .adj-item{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:8px;
    padding:8px 10px;margin-bottom:6px;font-size:13px}
  .adj-item img{width:44px;height:44px;object-fit:cover;border-radius:6px;flex-shrink:0}
  .adj-item .ico{width:44px;height:44px;border-radius:6px;background:#e7f4ec;display:flex;
    align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
  .adj-item .inf{flex:1;min-width:0}
  .adj-item .inf b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .adj-est{font-size:11.5px;font-weight:700}
  .adj-est.ok{color:var(--green-dark)} .adj-est.sub{color:var(--blue)} .adj-est.err{color:var(--red)}
  .adj-x{border:none;background:none;color:var(--red);font-size:18px;cursor:pointer;padding:4px}
  .savebar{position:fixed;bottom:var(--nav-h);left:0;right:0;background:#fff;border-top:1px solid var(--line);
    padding:10px 14px;display:flex;gap:10px;justify-content:center;z-index:20;box-shadow:0 -6px 20px rgba(0,0,0,.06)}
  .savebar .btn{max-width:420px;margin-top:0}
  .toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:var(--green-dark);
    color:#fff;padding:12px 22px;border-radius:9px;font-weight:700;box-shadow:0 10px 30px rgba(0,0,0,.3);
    z-index:50;font-size:14px;max-width:92vw;text-align:center}
  .toast.err{background:var(--red)}
  .hist-item{border:1px solid var(--line);border-radius:9px;padding:12px;margin-bottom:8px;font-size:13.5px}
  .hist-item b{color:var(--green-dark)}
  .tag{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11.5px;font-weight:700;margin-left:6px}
  .tag.nov{background:#fdecea;color:var(--red)}
  .tag.ok{background:#e7f4ec;color:var(--green-dark)}
  .empty{color:var(--muted);font-size:14px;text-align:center;padding:14px}
  /* vencimientos */
  .venc-card{border:1.5px solid var(--line);border-radius:10px;padding:14px;margin-bottom:10px;
    display:flex;align-items:center;justify-content:space-between;gap:10px}
  .venc-card .nom{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.4px}
  .venc-card .fec{font-size:13px;color:var(--muted);margin-top:3px}
  .venc-chip{padding:6px 13px;border-radius:20px;font-size:13px;font-weight:800;white-space:nowrap}
  .venc-chip.ok{background:#e7f4ec;color:var(--green-dark)}
  .venc-chip.pronto{background:var(--amber-soft);color:#8a6410}
  .venc-chip.vencido{background:#fdecea;color:var(--red)}
  .venc-chip.na{background:#eef1ed;color:var(--muted)}
  .venc-chip.mini{font-size:11.5px;padding:4px 10px}
  .unidad-head{background:var(--dark);color:#fff;border-radius:10px;padding:14px;margin-bottom:14px}
  .unidad-head b{font-size:19px;color:var(--amber)}
  .unidad-head span{display:block;font-size:13px;color:var(--sobre-oscuro);margin-top:2px}
  /* Lector de credenciales dentro de la hoja de ruta */
  .cred-btn{width:100%;padding:13px;border-radius:12px;border:2px solid var(--pri,#1E293B);
            background:#fff;color:var(--pri,#1E293B);font-size:15px;font-weight:800;cursor:pointer;margin-bottom:10px}
  .cred-lector{margin-bottom:10px}
  .cred-lector-caja{position:relative;width:100%;aspect-ratio:4/3;background:#000;border-radius:12px;overflow:hidden}
  .cred-lector-video{width:100%;height:100%;object-fit:cover;display:block}
  .cred-lector-marco{position:absolute;left:16%;top:16%;width:68%;height:68%;
                     border:3px solid rgba(255,255,255,.9);border-radius:10px;pointer-events:none}
  .cred-lector-ayuda{font-size:13px;color:var(--muted,#64748B);margin:8px 0;line-height:1.4}
  .cred-lector-error{font-size:13.5px;color:#B45309;background:#FFFBEB;border:1px solid #FDE68A;
                     border-radius:9px;padding:9px 11px;margin:8px 0;line-height:1.4}
  .cred-aviso{font-size:14px;font-weight:700;border-radius:10px;padding:10px 12px;margin-bottom:10px;line-height:1.35}
  .cred-aviso.ok{background:#F0FDF4;border:1px solid #BBF7D0;color:#166534}
  .cred-aviso.ya{background:#EFF6FF;border:1px solid #BFDBFE;color:#1E40AF}
  .cred-aviso.no{background:#FEF2F2;border:1px solid #FECACA;color:#991B1B}
  .cred-metodo{display:block;font-style:normal;font-size:11.5px;font-weight:600;opacity:.75;margin-top:2px}

  /* QR print */
  .qr-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}
  .qr-item{border:1.5px solid var(--line);border-radius:10px;padding:14px;text-align:center;background:#fff}
  .qr-item .qrbox{display:flex;justify-content:center;margin-bottom:8px}
  .qr-item b{display:block;font-size:16px}
  .qr-item small{color:var(--muted);font-size:12px}
  @media print{
    body *{visibility:hidden}
    .qr-print, .qr-print *{visibility:visible}
    .qr-print{position:absolute;left:0;top:0;width:100%}
    .qr-grid{grid-template-columns:repeat(3,1fr)}
  }
  .sync-note{font-size:12px;color:var(--muted);text-align:center;margin-bottom:10px}
  .offline-band{background:#fdecea;color:var(--red);font-size:12.5px;font-weight:700;
    text-align:center;padding:7px 10px}
  /* ---------- v3: estilo app de banco ---------- */
  .hero3{background:linear-gradient(160deg,var(--dark) 0%,var(--hero2) 100%);
    padding:18px 16px 54px;color:#fff}
  .hero3 .saludo{font-size:20px;font-weight:800;display:flex;align-items:center;gap:10px}
  .hero3 .sub{font-size:12.5px;color:var(--sobre-oscuro);margin-top:2px}
  .tarjeta-principal{background:#fff;border-radius:16px;margin:-38px 14px 14px;
    padding:16px 14px 14px;box-shadow:0 10px 30px rgba(0,0,0,.12);position:relative;z-index:2}
  .tarjeta-principal .fila-info{display:flex;justify-content:space-between;align-items:center;
    gap:8px;margin-bottom:12px;flex-wrap:wrap}
  .tarjeta-principal .dato b{font-size:16px;display:block}
  .tarjeta-principal .dato span{font-size:11.5px;color:var(--muted);text-transform:uppercase;
    letter-spacing:.5px;font-weight:700}
  .acciones{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .accion{border:none;background:#f2f6f3;border-radius:12px;padding:12px 4px 10px;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:6px;transition:transform .06s}
  .accion:active{transform:scale(.95)}
  .accion .ico{font-size:22px;line-height:1}
  .accion b{font-size:11px;color:var(--green-dark);font-weight:700;line-height:1.15;text-align:center}
  .seccion{margin:0 14px 14px}
  .seccion .cabecera{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
  .seccion .cabecera h3{font-size:15px;font-weight:800}
  .seccion .cabecera a{font-size:13px;color:var(--green);font-weight:700;cursor:pointer;text-decoration:none}
  .item-lista{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;
    margin-bottom:8px;font-size:13.5px}
  .item-lista .arriba{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
  .item-lista b{color:var(--ink)}
  .item-lista .det{color:var(--muted);margin-top:4px;line-height:1.4}
  /* pasos de seguimiento */
  .pasos{display:flex;align-items:center;gap:0;margin:10px 0 4px}
  .paso{display:flex;flex-direction:column;align-items:center;flex:1;position:relative}
  .paso .pto{width:22px;height:22px;border-radius:50%;background:#e2e8e3;color:#8aa192;
    display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;z-index:2}
  .paso.hecho .pto{background:var(--green);color:#fff}
  .paso.actual .pto{background:var(--amber);color:#3d2f05;box-shadow:0 0 0 4px var(--amber-soft)}
  .paso small{font-size:10.5px;color:var(--muted);margin-top:4px;font-weight:700}
  .paso.hecho small,.paso.actual small{color:var(--ink)}
  .paso::before{content:"";position:absolute;top:11px;left:-50%;width:100%;height:3px;background:#e2e8e3;z-index:1}
  .paso:first-child::before{display:none}
  .paso.hecho::before{background:var(--green)}
  .paso.actual::before{background:var(--green)}
  .coment{background:#f6f8f6;border-radius:8px;padding:8px 10px;margin-top:6px;font-size:12.5px}
  .coment .f{color:var(--muted);font-size:11px;margin-bottom:2px}
  /* estados chips */
  .chip-est{display:inline-block;padding:3px 11px;border-radius:20px;font-size:11.5px;font-weight:800}
  .chip-est.pendiente{background:var(--amber-soft);color:#8a6410}
  .chip-est.aprobado,.chip-est.en_progreso,.chip-est.en_proceso,.chip-est.en_curso{background:#e3ecfc;color:#1d4fa8}
  .chip-est.entregado,.chip-est.completado,.chip-est.hecho{background:#e7f4ec;color:var(--green-dark)}
  .chip-est.rechazado,.chip-est.cancelado{background:#fdecea;color:var(--red)}
  .chip-est.programado{background:#efe9fb;color:#6b3fc4}
  .chip-est.solicitado{background:var(--amber-soft);color:#8a6410}
  .chip-est.preparado{background:#e3ecfc;color:#1d4fa8}
  .chip-est.enviado{background:#e0f2f7;color:#0e6f8a}
  .chip-est.recibido{background:#e7f4ec;color:var(--green-dark)}
  .pasos.mini .pto{width:18px;height:18px;font-size:10px}
  .pasos.mini small{font-size:9.5px}
  .pasos.mini .paso::before{top:9px}
  /* pedidos: contador de insumos */
  .insumo{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;
    padding:10px 12px;margin-bottom:7px;background:#fff}
  .insumo .nom{flex:1;font-size:14px;font-weight:600}
  .insumo .nom small{display:block;color:var(--muted);font-size:11.5px;font-weight:500}
  .insumo .cont{display:flex;align-items:center;gap:8px}
  .insumo .cont button{width:32px;height:32px;border-radius:9px;border:1.5px solid var(--line);
    background:#fff;font-size:18px;font-weight:700;cursor:pointer;color:var(--green-dark)}
  .insumo .cont button:active{background:#e7f4ec}
  .insumo .cont .n{min-width:22px;text-align:center;font-weight:800;font-size:15px}
  .insumo.con{border-color:var(--green);background:#f2f8f4}
  /* bottom nav con QR central */
  .bottomnav{align-items:stretch}
  .nav-qr{position:relative;flex:1;display:flex;align-items:center;justify-content:center}
  .nav-qr button{position:absolute;top:-24px;width:58px;height:58px;border-radius:50%;
    background:var(--amber);border:4px solid var(--bg);font-size:24px;cursor:pointer;
    box-shadow:0 6px 16px rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center}
  .nav-qr button:active{transform:scale(.94)}
  .nav-qr small{position:absolute;bottom:6px;font-size:10.5px;font-weight:700;color:#7fa38d}
  /* chapa patente estilo Mercosur */
  .chapa{display:inline-block;background:#fff;border:2.5px solid #111;border-radius:7px;
    overflow:hidden;box-shadow:0 2px 6px rgba(0,0,0,.25);min-width:150px}
  .chapa .banda{background:#1746a0;color:#fff;font-size:8.5px;font-weight:700;letter-spacing:2.5px;
    text-align:center;padding:2.5px 6px;text-transform:uppercase}
  .chapa .nro{font-family:"Arial Narrow","Roboto Condensed",Arial,sans-serif;font-weight:800;
    font-size:26px;letter-spacing:3px;color:#111;text-align:center;padding:3px 12px 5px;white-space:nowrap}
  .chapa.grande .nro{font-size:32px}
  /* veredicto de circulación */
  .veredicto{border-radius:10px;padding:13px 14px;margin-bottom:12px;font-weight:800;font-size:15px;
    display:flex;align-items:center;gap:10px}
  .veredicto small{display:block;font-weight:600;font-size:12px;margin-top:2px}
  .veredicto.ok{background:#e7f4ec;color:var(--green-dark);border:1.5px solid var(--green)}
  .veredicto.mal{background:#fdecea;color:var(--red);border:1.5px solid var(--red)}
  .veredicto.duda{background:var(--amber-soft);color:#8a6410;border:1.5px solid var(--amber)}
  /* contactos de emergencia */
  .contactos-fondo{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:60;
    display:flex;align-items:flex-end;justify-content:center}
  .contactos-panel{background:#fff;border-radius:18px 18px 0 0;width:100%;max-width:520px;
    padding:18px 16px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -10px 40px rgba(0,0,0,.35)}
  .contactos-panel h3{font-size:16px;font-weight:800;margin-bottom:12px;text-align:center}
  .contacto-card{border-radius:14px;padding:14px;margin-bottom:12px;border:2px solid var(--line)}
  .contacto-card.asesor{border-color:var(--green);background:#f2f8f4}
  .contacto-card.emergencia{border-color:var(--red);background:#fdecea}
  .contacto-card .rol{font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.6px}
  .contacto-card.asesor .rol{color:var(--green-dark)}
  .contacto-card.emergencia .rol{color:var(--red)}
  .contacto-card .nom{font-size:17px;font-weight:800;margin:3px 0 10px}
  .contacto-botones{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .contacto-botones a{display:flex;align-items:center;justify-content:center;gap:7px;
    padding:12px;border-radius:10px;font-size:15px;font-weight:800;text-decoration:none}
  .btn-llamar{background:var(--green);color:#fff}
  .contacto-card.emergencia .btn-llamar{background:var(--red)}
  .btn-wsp{background:#25d366;color:#fff}
  .sin-contacto{font-size:13px;color:var(--muted)}
  .btn-tel-top{background:var(--amber) !important;border-color:var(--amber) !important;color:#12251b !important;font-weight:800}
  .banda-sos{margin:0 14px 14px;border:2px solid var(--red);background:#fdecea;border-radius:12px;
    padding:12px;display:flex;align-items:center;gap:10px;cursor:pointer}
  .banda-sos .ic{font-size:24px}
  .banda-sos b{color:var(--red);display:block;font-size:14.5px}
  .banda-sos span{font-size:12px;color:var(--muted)}
  /* escáner */
  .escaner-marco{position:relative;border-radius:14px;overflow:hidden;background:#000;
    aspect-ratio:3/4;max-height:56vh;display:flex;align-items:center;justify-content:center}
  .escaner-marco video{width:100%;height:100%;object-fit:cover}
  .escaner-guia{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
  .escaner-guia div{width:62%;aspect-ratio:1;border:3px solid rgba(255,255,255,.85);border-radius:18px;
    box-shadow:0 0 0 2000px rgba(0,0,0,.35)}
  /* ===== HOJA DE RUTA estilo Uber (v5.3) ===== */
  .ruta-pantalla{position:fixed;inset:0;top:0;display:flex;flex-direction:column;background:#e8ece9;z-index:40}
  .ruta-banda{background:var(--amber-soft);color:var(--alerta);font-size:12.5px;font-weight:700;padding:8px 12px;text-align:center}
  .ruta-cabecera{background:#fff;padding:10px 14px 8px;border-bottom:1px solid var(--line);flex:0 0 auto;position:relative;z-index:3}
  .ruta-cabecera > div:first-child{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
  .ruta-cabecera b{font-size:14.5px;font-weight:800;color:var(--ink)}
  .ruta-cabecera span{font-size:12px;color:var(--muted);font-weight:700}
  .ruta-riel{height:6px;background:#e2e8e3;border-radius:99px;overflow:hidden;margin-top:8px}
  .ruta-riel i{display:block;height:100%;background:var(--green);border-radius:99px;transition:width .35s ease}
  /* overflow:hidden y z-index propios: si el CSS de Leaflet no llega (pasa
     sin señal), los mosaicos se desbordan y tapan los botones de abajo.
     Con esto el chofer siempre puede tocar, cargue o no el mapa. */
  .ruta-mapa-caja{position:relative;flex:1 1 auto;min-height:0;overflow:hidden;z-index:1}
  .ruta-mapa{position:absolute;inset:0;overflow:hidden}
  .ruta-mapa-vacio{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    text-align:center;padding:24px;background:#eef1ed;color:var(--muted);font-size:13.5px;font-weight:600;line-height:1.5}
  .leaflet-container{font-family:inherit}

  .ruta-hoja{background:#fff;border-radius:18px 18px 0 0;box-shadow:0 -3px 14px rgba(20,40,30,.14);position:relative;z-index:3;
    flex:0 0 auto;max-height:62vh;overflow-y:auto;padding-bottom:calc(var(--nav-h) + 10px)}
  .ruta-hoja.abierta{max-height:82vh}
  .ruta-agarre{display:flex;justify-content:center;padding:8px 0 4px;cursor:pointer}
  .ruta-agarre span{width:44px;height:5px;border-radius:99px;background:#cfd8d2;display:block}
  .ruta-parada-cab{display:flex;gap:11px;align-items:center;padding:6px 14px 12px}
  .ruta-parada-cab .letra{width:46px;height:46px;border-radius:13px;background:#e7f4ec;color:var(--green);
    display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;flex:0 0 auto}
  .ruta-parada-cab .txt{flex:1;min-width:0}
  .ruta-parada-cab b{display:block;font-size:15px;font-weight:800;line-height:1.25;color:var(--ink)}
  .ruta-parada-cab span{display:block;font-size:12.5px;color:var(--muted);font-weight:600;margin-top:2px}
  .ruta-ir{flex:0 0 auto;padding:10px 14px;border-radius:11px;border:none;background:var(--blue);color:#fff;
    font-size:14px;font-weight:800;cursor:pointer;font-family:inherit}
  .ruta-acciones{padding:0 14px 14px}
  .ruta-btn{width:100%;padding:17px;border-radius:13px;font-size:16.5px;font-weight:800;border:none;
    color:#fff;background:var(--green);cursor:pointer;font-family:inherit;margin-top:2px}
  .ruta-btn:active{transform:scale(.985)}
  .ruta-btn:disabled{opacity:.6}
  .ruta-btn.gris{background:#fff;color:var(--muted);border:2px solid var(--line);font-size:14.5px;padding:13px;margin-top:9px}
  .ruta-crono{background:#e7f4ec;border:2px solid var(--green);border-radius:13px;padding:11px;text-align:center;margin-bottom:12px}
  .ruta-crono .num{font-size:32px;font-weight:800;color:var(--green);line-height:1;font-variant-numeric:tabular-nums}
  .ruta-crono .txt{font-size:12.5px;font-weight:700;color:var(--green);margin-top:2px}
  .ruta-crono.vencido{background:#fdecea;border-color:var(--red)}
  .ruta-crono.vencido .num,.ruta-crono.vencido .txt{color:var(--red)}
  .ruta-rotulo{font-size:11.5px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
  .ruta-pax{border:1px solid var(--line);border-radius:12px;padding:11px;margin-bottom:9px;background:#fff}
  .ruta-pax .nom{font-size:15px;font-weight:800;margin-bottom:2px}
  .ruta-tel{font-size:12.5px;color:var(--muted);font-weight:700;text-decoration:none;display:inline-block}
  .ruta-chip{display:inline-block;background:var(--amber-soft);color:var(--alerta);border-radius:7px;
    padding:2px 7px;font-size:11px;font-weight:800;margin-left:6px}
  .ruta-par{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}
  .ruta-par button{padding:15px 6px;border-radius:12px;font-size:15px;font-weight:800;border:2px solid;cursor:pointer;font-family:inherit}
  .ruta-par button:disabled{opacity:.6}
  .ruta-par .si{background:#e7f4ec;border-color:var(--green);color:var(--green)}
  .ruta-par .no{background:#fdecea;border-color:var(--red);color:var(--red)}
  .ruta-marca{margin-top:9px;border-radius:11px;padding:10px 12px;font-size:14px;font-weight:800;
    display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .ruta-marca.ok{background:#e7f4ec;color:var(--green)}
  .ruta-marca.mal{background:#fdecea;color:var(--red)}
  .ruta-marca small{display:block;width:100%;font-size:12px;font-weight:600;opacity:.9;margin-top:2px}
  .ruta-deshacer{background:none;border:none;color:inherit;text-decoration:underline;font-weight:700;
    font-size:12.5px;padding:0;cursor:pointer;font-family:inherit}
  .ruta-trasbordo{margin:0 14px 14px;padding:11px 13px;border-radius:11px;background:var(--amber-soft);border:1px solid var(--amber)}
  .ruta-trasbordo b{display:block;font-size:13.5px;color:var(--alerta)}
  .ruta-trasbordo span{display:block;font-size:12.5px;color:#8a6a10;font-weight:600;margin-top:2px}
  .ruta-cuadros{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0 14px}
  .ruta-cuadro{border-radius:12px;padding:14px 10px;text-align:center}
  .ruta-cuadro b{display:block;font-size:28px;font-weight:800;line-height:1}
  .ruta-cuadro span{font-size:11.5px;font-weight:800}
  .ruta-cuadro.v{background:#e7f4ec;color:var(--green)}
  .ruta-cuadro.r{background:#fdecea;color:var(--red)}
  .ruta-detalle{border-top:1px solid var(--line);padding-top:10px}
  .ruta-detalle div{font-size:13.5px;font-weight:600;padding:7px 0;border-bottom:1px dashed var(--line)}
  .ruta-detalle div:last-child{border:0}

  /* ==================== PIEL GESTIÓN DE FLOTA (v6.0) ====================
     Misma paleta que el sistema de la oficina: fondo gris claro, tarjetas
     blancas con sombra suave, gris grafito como color principal, Montserrat.
     Las variables viejas (--green, --amber, --dark…) se siguen usando en las
     pantallas internas, por eso acá se les da el valor nuevo. */
  :root{
    --acento:#2b3440; --acento-suave:#eceef1; --fondo:#f4f5f7; --tarjeta:#fff;
    --t1:#1f2328; --t2:#4a5057; --t3:#8a9099; --linea:#e7e9ec;
    --ok:#1e7a52; --ok-bg:#e9f4ee; --alerta:#8a5b00; --alerta-bg:#fbf2e0;
    --mal:#9b2c2c; --mal-bg:#fbecec; --info:#1a4f8a; --info-bg:#e9f0f8;
    --sombra:0 1px 2px rgba(16,24,40,.05),0 4px 14px rgba(16,24,40,.05);
    --ink:var(--t1); --panel:#fff; --bg:var(--fondo); --line:var(--linea); --muted:var(--t3);
    --red:var(--mal); --blue:var(--info); --nav-h:66px;
  }
  body{font-family:Montserrat,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--fondo);color:var(--t1);font-size:13.5px}
  button,input,select,textarea{font-family:inherit}
  /* --- entrada --- */
  .login-wrap{display:block;min-height:100vh;background:var(--fondo);padding:0}
  .login-wrap::before{content:"";display:block;height:0}
  .login-card{max-width:none;border-radius:0;padding:0;box-shadow:none;background:transparent}
  .login-banda{background:var(--acento);color:#fff;padding:calc(48px + env(safe-area-inset-top)) 24px 66px}
  .login-banda .brand-badge{background:#fff;color:var(--acento);width:54px;height:54px;font-size:21px;border-radius:14px;margin-bottom:16px}
  .login-banda img.brand-logo{width:54px;height:54px;border-radius:14px;object-fit:cover;background:#fff;margin-bottom:16px;display:block}
  .login-banda h1{font-size:24px;font-weight:800;letter-spacing:-.4px;line-height:1.15}
  .login-banda p{font-size:13px;opacity:.75;margin-top:6px;font-weight:500}
  .login-caja{background:#fff;margin:-40px 16px 0;border-radius:14px;box-shadow:var(--sombra);padding:18px 18px 20px;max-width:440px}
  @media(min-width:520px){.login-caja{margin-left:auto;margin-right:auto}}
  .login-card label{font-size:10.5px;letter-spacing:.6px;color:var(--t3);margin:14px 0 6px}
  .login-card input{border:1.5px solid var(--linea);border-radius:10px;padding:12px 13px;font-size:16px}
  .login-card input:focus{border-color:var(--acento)}
  .btn{background:var(--acento);border-radius:10px;font-weight:700;padding:13px;margin-top:18px}
  .btn:hover{background:#1f262f}
  .btn.sec{background:#fff;color:var(--t2);border:1px solid var(--linea);font-size:13.5px;padding:11px}
  .btn.sec:hover{background:var(--fondo)}
  .login-hint{margin:14px 16px 24px;background:#fff;border:0;border-radius:12px;box-shadow:var(--sombra);padding:12px 14px;font-size:12px;color:var(--t2);line-height:1.5;max-width:440px}
  @media(min-width:520px){.login-hint{margin-left:auto;margin-right:auto}}
  .login-hint b{color:var(--t1)}
  .login-error{margin-top:12px;background:var(--mal-bg);color:var(--mal);border-radius:9px;padding:9px 12px;font-size:13px;font-weight:600}
  /* --- barra de arriba --- */
  .topbar{background:#fff;color:var(--t1);border-bottom:1px solid var(--linea);padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top))}
  .topbar .mini-badge{background:var(--acento);border-radius:10px;width:38px;height:38px}
  .topbar .who{color:var(--t3)}
  .topbar .who b{color:var(--t1);font-size:14px;font-weight:700}
  .topbar .who .emp{color:var(--t3);font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;font-weight:600}
  .ib{width:36px;height:36px;border-radius:9px;border:1px solid var(--linea);background:#fff;display:flex;align-items:center;justify-content:center;color:var(--t2);cursor:pointer;padding:0;flex:none}
  .ib svg{width:18px;height:18px}
  .ib:active{background:var(--fondo)}
  .ib.tel{border-color:#f0d3d3;background:var(--mal-bg);color:var(--mal)}
  .ib.gira svg{animation:girar 1s linear infinite}
  @keyframes girar{to{transform:rotate(360deg)}}
  .back-row{padding:12px 14px 0}
  .back-btn{border:1px solid var(--linea);border-radius:9px;color:var(--t2);font-weight:700;display:inline-flex;align-items:center;gap:6px;padding:8px 12px}
  .back-btn svg{width:16px;height:16px}
  .screen-title{font-size:15px;font-weight:800}
  .container{padding:12px 14px calc(var(--nav-h) + 96px)}
  .offline-band{font-weight:600}
  /* --- barra de abajo --- */
  .bottomnav{background:#fff;border-top:1px solid var(--linea);box-shadow:none;padding:0 6px env(safe-area-inset-bottom)}
  .bottomnav button{color:var(--t3);font-size:10.5px;gap:4px}
  .bottomnav button svg{width:22px;height:22px}
  .bottomnav button.act{color:var(--acento)}
  .nav-qr button{background:var(--acento);color:#fff;border:4px solid var(--fondo);box-shadow:0 6px 16px rgba(43,52,64,.35);width:54px;height:54px;top:-22px}
  .nav-qr button svg{width:24px;height:24px}
  .nav-qr small{color:var(--t3);bottom:8px}
  /* --- inicio --- */
  .inicio{padding:14px 14px 0}
  .saludo{display:flex;justify-content:space-between;align-items:baseline;margin:2px 2px 12px;gap:10px}
  .saludo h2{font-size:18px;font-weight:800;letter-spacing:-.3px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .saludo span{font-size:11.5px;color:var(--t3);font-weight:600;white-space:nowrap}
  .kpis{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:12px}
  .kpi{background:#fff;border-radius:12px;box-shadow:var(--sombra);padding:11px 12px;min-width:0}
  .kpi .et{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--t3);font-weight:600}
  .kpi .nu{font-size:15px;font-weight:700;margin-top:4px;letter-spacing:-.3px;line-height:1.2;word-break:break-word}
  .kpi .nu.ok{color:var(--ok)} .kpi .nu.al{color:var(--alerta)} .kpi .nu.mal{color:var(--mal)}
  .rotulo{font-size:10.5px;text-transform:uppercase;letter-spacing:.9px;color:var(--t3);font-weight:700;margin:14px 2px 8px}
  .grilla{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .tarjeta{background:#fff;border:0;border-radius:12px;box-shadow:var(--sombra);padding:13px 12px 12px;display:flex;flex-direction:column;gap:8px;min-height:104px;text-align:left;cursor:pointer;width:100%;font-family:inherit}
  .tarjeta:active{transform:scale(.98)}
  .tarjeta .ic{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;background:var(--acento-suave);color:var(--acento);margin:0;font-size:inherit}
  .tarjeta .ic svg{width:19px;height:19px}
  .tarjeta .ic.mal{background:var(--mal-bg);color:var(--mal)} .tarjeta .ic.ok{background:var(--ok-bg);color:var(--ok)}
  .tarjeta .ic.info{background:var(--info-bg);color:var(--info)} .tarjeta .ic.al{background:var(--alerta-bg);color:var(--alerta)}
  .tarjeta b{font-size:13.5px;font-weight:700;line-height:1.2;color:var(--t1)}
  .tarjeta span{font-size:11px;color:var(--t3);line-height:1.35;display:block}
  .aviso{background:#fff;border:0;border-left:4px solid var(--info);border-radius:12px;box-shadow:var(--sombra);padding:11px 12px;display:flex;gap:10px;align-items:center;margin-bottom:8px;width:100%;text-align:left;cursor:pointer;font-family:inherit}
  .aviso.al{border-left-color:var(--alerta)} .aviso.ok{border-left-color:var(--ok)} .aviso.mal{border-left-color:var(--mal)}
  .aviso > div{flex:1;min-width:0}
  .aviso b{font-size:13px;display:block;color:var(--t1)} .aviso span{font-size:11.5px;color:var(--t3);display:block;margin-top:2px}
  .aviso .chip-ir{font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--info-bg);color:var(--info);white-space:nowrap;flex:none}
  .aviso.al .chip-ir{background:var(--alerta-bg);color:var(--alerta)} .aviso.ok .chip-ir{background:var(--ok-bg);color:var(--ok)} .aviso.mal .chip-ir{background:var(--mal-bg);color:var(--mal)}
  /* --- tarjetas y formularios de las pantallas internas --- */
  .card{border:0;box-shadow:var(--sombra);border-radius:12px;padding:14px}
  .card h2{font-size:11px;letter-spacing:.7px;color:var(--t3);font-weight:700;margin-bottom:10px}
  .card h2::before{display:none}
  .field label{font-size:11.5px;font-weight:600;color:var(--t2)}
  .field input,.field select,.field textarea{border:1.5px solid var(--linea);border-radius:9px;font-size:14px}
  .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--acento)}
  .field input[readonly]{background:var(--fondo);color:var(--t3)}
  .kms-total{background:var(--acento);color:#fff}
  .kms-total small{color:rgba(255,255,255,.7)}
  .toggle button{border-color:var(--linea);color:var(--t3);border-radius:9px}
  .toggle button.on-ok{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
  .toggle button.on-nov{border-color:var(--mal);background:var(--mal-bg);color:var(--mal)}
  .chk{border-color:var(--linea);border-radius:9px}
  .chk input{accent-color:var(--mal)}
  .chk.marked{border-color:var(--mal);background:var(--mal-bg)}
  .sector label{color:var(--t2);font-size:11.5px;letter-spacing:.3px}
  .sector textarea{border-color:var(--linea);background:#fff}
  .sector textarea:focus{border-color:var(--acento)}
  .adj-btn{border:1.5px dashed #c9ced4;background:#fff;color:var(--t2);border-radius:9px}
  .adj-btn:active{background:var(--fondo)}
  .adj-item .ico{background:var(--acento-suave)}
  .adj-est.ok{color:var(--ok)} .adj-est.sub{color:var(--info)}
  .savebar{border-top:1px solid var(--linea);box-shadow:none}
  .toast{background:var(--acento);border-radius:10px}
  .toast.err{background:var(--mal)}
  .hist-item{border:0;box-shadow:var(--sombra);border-radius:12px;background:#fff}
  .hist-item b{color:var(--t1)}
  .tag.ok{background:var(--ok-bg);color:var(--ok)} .tag.nov{background:var(--mal-bg);color:var(--mal)}
  .tiles{gap:10px}

  const h = String(hex||"").replace("#","");
  if (h.length !== 6) return hex;
  const n = parseInt(h,16);
  const canal = (c) => {
    const v = amt < 0 ? c * (1 + amt) : c + (255 - c) * amt;
    return Math.max(0, Math.min(255, Math.round(v)));
  };
  const r = canal((n>>16)&255), g = canal((n>>8)&255), b = canal(n&255);
  return "#" + ((1<<24) + (r<<16) + (g<<8) + b).toString(16).slice(1);

function Ico({n, s}){

/* Insignia: logo de la empresa o iniciales */
function Insignia({marca, size}){
  const s = size || 46;
  if (marca && marca.logo)
    return <img src={marca.logo} alt="" style={{width:s,height:s,borderRadius:Math.round(s*0.22),objectFit:"cover",flexShrink:0,background:"#fff"}}/>;
  const palabras = String((marca && marca.nombre) || "GF").replace(/[^A-Za-zÁÉÍÓÚÑáéíóúñ0-9 ]/g,"").trim().split(/\s+/)
    .filter(p => p && !/^(de|del|la|el|los|las|y|e)$/i.test(p));
  const ini = (palabras.length >= 2 ? palabras.map(p=>p[0]).join("").slice(0,2) : (palabras[0]||"GF").slice(0,2)).toUpperCase();
  return <div className="brand-badge" style={{width:s,height:s,fontSize:Math.round(s*0.42)}}>{ini}</div>;
}
const mismoId = (a,b) => String(a) === String(b);
const esActivo = (e) => { const s = String(e||"").trim().toLowerCase(); return s==="activo"||s==="activa"; };

/* Las URLs largas de Drive se muestran como "📎 Ver adjunto" en vez del chorizo de letras */
function TextoConLinks({texto}){
  const partes = String(texto||"").split(/(https?:\/\/[^\s]+)/g);

    <React.Fragment>

const API_URL_FIJA = "https://script.google.com/macros/s/AKfycbxZ7-_1MOP785xB5UUlNQ_8tKFubTW8c_0IWrPoJct-NiZzeEp1ik3NHdKa-7bqdS_H/exec";

async function apiGet(){

async function apiPost(payload){
  const r = await fetch(API_URL, {
    method:"POST",

  });

   MODO CAMPO (Vaca Muerta y yacimientos sin señal)

     en un archivo.
   ============================================================ */
const colaLeer = () => { try { return JSON.parse(almacen.get("COLA")||"[]"); } catch(e){ return []; } };

function encolar(action, data){
  const cola = colaLeer();
  cola.push({uid: Date.now()+"-"+Math.random().toString(36).slice(2), action, data, creado:new Date().toISOString()});
  try { colaGuardar(cola); } catch(e){
    alert("La memoria del teléfono está llena de envíos pendientes. Descargá el archivo de pendientes y vaciá la cola.");
  }
}
async function subirAdjuntosPendientes(adjuntos){
  const out = [];
  for (const a of (adjuntos||[])){
    if (a.url){ out.push({tipo:a.tipo, nombre:a.nombre, url:a.url}); continue; }
    const r = await apiPost({action:"subirAdjunto", nombre:a.nombre, mime:a.mime, base64:a.base64});
    if (!r || r.ok === false) throw new Error((r&&r.error)||"No se pudo subir un adjunto");
    a.url = r.url;
    out.push({tipo:a.tipo, nombre:a.nombre, url:r.url});
  }
  return out;
}
/* Envía ya si hay señal; si no (o si falla), queda guardado para después. */
async function enviarOEncolar(action, data, demo){
  if (demo) return {ok:true, demo:true};
  if (!API_URL || !navigator.onLine){ encolar(action, data); return {encolado:true}; }
  try{
    const adjuntos = await subirAdjuntosPendientes(data.adjuntos);
    const r = await apiPost({action: action, data: {...data, adjuntos: adjuntos}});
    if (!r || r.ok === false) throw new Error((r&&r.error)||"error del script");
    return {ok:true};
  }catch(e){
    encolar(action, data);
    return {encolado:true, error:String(e.message||e)};
  }
}
let _procesandoCola = false;
async function procesarCola(alCambiar){
  if (_procesandoCola || !API_URL || !navigator.onLine) { if(alCambiar) alCambiar(colaLeer().length); return; }
  _procesandoCola = true;
  try{
    let cola = colaLeer();
    while (cola.length){
      const it = cola[0];
      const adjuntos = await subirAdjuntosPendientes(it.data.adjuntos || []);
      colaGuardar(cola);   // deja anotadas las URLs de lo que ya subió
      const r = await apiPost({action: it.action, data: {...it.data, adjuntos: adjuntos}});
      if (!r || r.ok === false) throw new Error((r&&r.error)||"error del script");
      cola.shift();
      colaGuardar(cola);
      if (alCambiar) alCambiar(cola.length);
    }
  }catch(e){ /* sigue sin señal o falló: se reintenta más tarde */ }
  finally{
    _procesandoCola = false;
    if (alCambiar) alCambiar(colaLeer().length);
  }
}
function descargarPendientes(){
  const cola = colaLeer().map(it => {
    const d = {...it.data};
    d.adjuntos = (d.adjuntos||[]).map(a => a.url ? {tipo:a.tipo,nombre:a.nombre,url:a.url} : {tipo:a.tipo,nombre:a.nombre,base64:a.base64,mime:a.mime});
    return {creado:it.creado, action:it.action, data:d};
  });
  const blob = new Blob([JSON.stringify(cola, null, 2)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "checkflota_pendientes_" + hoy() + ".json";
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 5000);
}

async function loginConductor(dni, pin){
  const d = soloDigitos(dni);

  if (!API_URL){
    // modo demo (sin URL configurada)
    const c = (DEMO.conductores||[]).find(x => soloDigitos(x.dni) === d && esActivo(x.estado));
    if (!c) return {error:"No hay un conductor activo con ese DNI."};
    const ok = c.pin ? String(pin).trim()===String(c.pin) : String(pin).trim()===d.slice(-4);
    if (!ok) return {error:"PIN incorrecto."};
    return {conductor:c, datos:{...DEMO, conductor:c}, demo:true};
  }
  const deCache = () => {
    let cache = null;
    try { cache = JSON.parse(almacen.get("DATOS_"+d)||"null"); } catch(e){ }
    if (!cache || !cache.datos || !cache.datos.conductor) return null;
    const c = cache.datos.conductor;
    const ok = (c.pin != null && String(c.pin).trim() !== "")
      ? String(pin).trim() === String(c.pin).trim()
      : String(pin).trim() === d.slice(-4);
    if (!ok) return {error:"PIN incorrecto."};
    return {conductor:c, datos:cache.datos, offline:true, fecha:cache.fecha};
  };
  if (!navigator.onLine){
    return deCache() || {error:"Sin señal y sin datos guardados en este teléfono. La primera vez hay que entrar con internet."};
  }
  try{
    const r = await apiPost({action:"datosConductor", dni:d, pin:String(pin).trim()});
    if (!r || r.ok === false) return {error:(r && r.error) || "No se pudo ingresar."};
    try { almacen.set("DATOS_"+d, JSON.stringify({fecha:new Date().toISOString(), datos:r.datos})); } catch(e){ }
    return {conductor:r.datos.conductor, datos:r.datos};
  }catch(e){
    const c = deCache();
    if (c) return c;
    /* No mentir: si el script contestó pero mal (una página de error de
       Google, o la implementación vieja), el problema NO es la señal.
       Decirlo con todas las letras ahorra media hora de buscar donde no es. */
    const msg = String((e && e.message) || e || "");
    if (/no devolvió datos|implementaci|DOCTYPE|JSON/i.test(msg)){
      return {error:"El sistema no está respondiendo bien. NO es tu teléfono ni tu señal: hay que volver a publicar el script en la planilla (Implementar → Administrar implementaciones → Versión: NUEVA). Mostrale este mensaje a la oficina."};
    }
    return {error:"Sin señal y sin datos guardados en este teléfono. La primera vez hay que entrar con internet."};
  }
}

/* ---------- lectura de archivos / compresión de imágenes ---------- */
const leerBase64 = (file) => new Promise((resolve,reject)=>{
  const lector = new FileReader();
  lector.onerror = () => reject(new Error("No se pudo leer el archivo."));
  lector.onload = () => resolve(String(lector.result).split(",")[1]);
  lector.readAsDataURL(file);
});
const comprimirImagen = (file, maxLado=1400, calidad=0.72) => new Promise((resolve,reject)=>{
  const lector = new FileReader();
  lector.onerror = () => reject(new Error("No se pudo leer el archivo."));
  lector.onload = () => {
    const img = new Image();
    img.onerror = () => reject(new Error("El archivo no es una imagen válida."));
    img.onload = () => {
      let w = img.width, h = img.height;
      if (Math.max(w,h) > maxLado){ const esc = maxLado/Math.max(w,h); w = Math.round(w*esc); h = Math.round(h*esc); }
      const cv = document.createElement("canvas");
      cv.width = w; cv.height = h;
      cv.getContext("2d").drawImage(img, 0, 0, w, h);
      const dataUrl = cv.toDataURL("image/jpeg", calidad);
      resolve({ base64: dataUrl.split(",")[1], mime: "image/jpeg", preview: dataUrl });
    };
    img.src = lector.result;
  };
  lector.readAsDataURL(file);
});

function Adjuntos({adjuntos, setAdjuntos, titulo}){
  const refFoto = useRef(null);
  const refImagen = useRef(null);
  const refAudio = useRef(null);
  const agregar = async (file, tipo) => {
    if (!file) return;
    const nombre = file.name || (tipo === "audio" ? "audio.m4a" : "foto.jpg");
    let base64, mime = file.type || "", preview = null;
    try{
      if (tipo === "imagen"){
        const c = await comprimirImagen(file);
        base64 = c.base64; mime = c.mime; preview = c.preview;
      }else{
        if (file.size > 10*1024*1024){ alert("El audio es muy pesado (máx. 10 MB). Grabá uno más corto."); return; }
        base64 = await leerBase64(file);
      }
    }catch(e){ alert(e.message || "No se pudo leer el archivo."); return; }
    const uid = Date.now() + "-" + Math.random().toString(36).slice(2);
    setAdjuntos(a => [...a, {uid, tipo, nombre, mime, base64, preview, url:""}]);
  };
  const alElegir = (tipo) => (e) => {
    Array.from(e.target.files || []).forEach(f => agregar(f, tipo));

      <input ref={refAudio} type="file" accept="audio/*" style={{display:"none"}} onChange={alElegir("audio")}/>
