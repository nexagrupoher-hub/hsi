/* ---------------------------- 7) INFORMES ---------------------------- */
function neumInformes(m){
  var mont = montajeActual();
  var ns = T('Neumaticos');
  var conKm = ns.filter(function(n){ return num(n.km_acumulados)>0; });
  var costoKm = conKm.length ? conKm.reduce(function(a,n){ return a + num(n.costo)/num(n.km_acumulados); },0)/conKm.length : 0;
  var g = el('div',{cls:'grid g4'});
  g.appendChild(kpi('Costo por km', costoKm?('$'+costoKm.toFixed(2)):'—', 'promedio de la flota'));
  g.appendChild(kpi('Vida promedio', conKm.length?miles(Math.round(conKm.reduce(function(a,n){ return a+num(n.km_acumulados); },0)/conKm.length)):'—', 'km por cubierta'));
  g.appendChild(kpi('En recapado', miles(ns.filter(function(n){ return n.estado==='En recapado'; }).length), 'afuera'));
  g.appendChild(kpi('Scrap', miles(ns.filter(function(n){ return n.estado==='Scrap'; }).length), 'dadas de baja'));
  m.appendChild(g);

  var porMarca = {};
  ns.forEach(function(n){
    var k = n.marca||'Sin marca';
    if(!porMarca[k]) porMarca[k] = { marca:k, cant:0, km:0, costo:0 };
    porMarca[k].cant++; porMarca[k].km += num(n.km_acumulados); porMarca[k].costo += num(n.costo);
  });
  carta(m, tabla(Object.keys(porMarca).map(function(k){
      var r = porMarca[k]; r.kmProm = r.cant? Math.round(r.km/r.cant):0;
      r.costoKm = r.km ? Math.round(r.costo/r.km*100)/100 : 0; return r;
    }), [['marca','Marca','b'],['cant','Cubiertas','n'],['kmProm','Km promedio','n'],['costoKm','$/km','$']]),
    'Rendimiento por marca · con esto se decide qué comprar');

  var alerta = [];
  ns.forEach(function(n){
    var d = mont.porFuego[n.fuego];
    if(profActual(n) && profActual(n)<=4) alerta.push({ fuego:n.fuego, motivo:'Al límite ('+profActual(n)+' mm)', donde: d?('interno '+d.interno+' pos '+d.posicion):(n.deposito||'') });
    if(d && num(n.km_acumulados)>0 && num(n.km_acumulados)%50000 < 3000) alerta.push({ fuego:n.fuego, motivo:'Toca rotación', donde:'interno '+d.interno+' pos '+d.posicion });
  });
  carta(m, tabla(alerta, [['fuego','Cubierta','b'],['motivo','Alerta'],['donde','Dónde está']]), 'Alertas de desgaste y rotación');
}

/* --------------------------- ficha de una cubierta ------------------- */
function fichaNeumatico(fuego){
  var n = neumatico(fuego); if(!n) return;
  var mont = montajeActual(), d = mont.porFuego[fuego];
  var movs = T('NeumaticosMovs').filter(function(x){ return String(x.fuego)===String(fuego); });
  var ctrl = T('NeumControles').filter(function(x){ return String(x.fuego)===String(fuego); });
  var cuerpo = el('div');
  cuerpo.appendChild(el('div',{cls:'grid g3',style:'margin-bottom:12px'},
    '<div class="kpi"><div class="et">Dónde está</div><div class="nu" style="font-size:17px">'+(d?('Interno '+esc(d.interno)):esc(n.deposito||'sin ubicar'))+'</div><div class="pie">'+(d?('posición '+esc(d.posicion)):esc(n.estado||''))+'</div></div>'+
    '<div class="kpi"><div class="et">Profundidad</div><div class="nu" style="font-size:17px">'+profActual(n)+' mm</div><div class="pie">arrancó en '+num(n.profundidad_inicial)+' mm</div></div>'+
    '<div class="kpi"><div class="et">Kilómetros</div><div class="nu" style="font-size:17px">'+miles(n.km_acumulados)+'</div><div class="pie">'+(num(n.km_acumulados)?('$'+(num(n.costo)/num(n.km_acumulados)).toFixed(2)+' por km'):'sin rodar')+'</div></div>'));
  cuerpo.appendChild(el('div',{cls:'card',style:'box-shadow:none;padding:0;margin-bottom:12px'},
    '<table><tbody>'+
    fila2('Cubierta', esc(n.marca||'')+' '+esc(n.medida||'')+' · '+esc(n.dibujo||''))+
    fila2('Vida', (num(n.vida)||1)+'ª · '+esc(n.tipo||''))+
    fila2('Serie / DOT', esc(n.serie_dot||'—'))+
    fila2('Costo', pesos(n.costo))+
    '</tbody></table>'));
  cuerpo.appendChild(el('b',null,'Historia'));
  cuerpo.appendChild(tabla(ordenarPor(movs,'fecha'), [['fecha','Fecha','fecha'],['accion','Acción','chip'],
    ['interno','Interno'],['posicion','Pos'],['km_vehiculo','Km unidad','n'],['profundidad_mm','mm','n'],['motivo','Motivo']]));
  if(ctrl.length){
    cuerpo.appendChild(el('b',null,'Controles'));
    cuerpo.appendChild(tabla(ordenarPor(ctrl,'fecha'), [['fecha','Fecha','fecha'],['prof_ext','Ext','n'],
      ['prof_cen','Centro','n'],['prof_int','Int','n'],['presion_psi','Presión','n'],['desgaste','Desgaste']]));
  }
  var bots = [el('button',{cls:'btn', onclick:function(){ formGenerico('Neumaticos', n); }},'Editar')];
  if(d) bots.push(el('button',{cls:'btn pri', onclick:function(){ cerrarModal(); desmontarA(fuego, 'STK-PNA'); }},'Desmontar'));
  modal('Cubierta '+fuego, cuerpo, bots, 'ancho');
}

function vistaInventario(m){
  encabezado(m,'Inventario','Conteo cíclico a ciegas: mientras está abierto no se ve el stock del sistema',
    [btnNuevo('Inventarios','Nuevo conteo',{fecha_apertura:hoy(), estado:'Abierto', empresa:(S.empresa!=='*'?S.empresa:'')})]);
  var inv = T('Inventarios');

  var exa = cerrados.length ? cerrados.reduce(function(a,i){ return a+num(i.exactitud_pct); },0)/cerrados.length : 0;

      var q = normTexto(S.buscar||'');

        if(S.filtroEstado && v.estado!==S.filtroEstado) return false;

        return normTexto([v.vehiculo,v.patente,v.marca,v.modelo,v.base].join(' ')).indexOf(q)>=0;
      }).map(function(v){
        var o = Object.create(v), ps = proximoServicio(v), cons = consumoReal(v.vehiculo);
        o._km = kmActual(v.vehiculo);
        o._prox = ps ? (ps.codigo+' en '+miles(ps.falta)+' km') : '—';
        o._modelo = (v.marca||'')+' '+(v.modelo||'');
        o._consumo = cons ? cons.toFixed(1)+' L/100' : '—';
        o._ejes = v.ruedas ? nombreConfig(v.ruedas) : '—';
        if(cons && num(v.consumoRef)){
          var dd = (cons-num(v.consumoRef))/num(v.consumoRef);
          o._consumo += dd>.2 ? ' ▲' : (dd<-.1 ? ' ▼' : '');
        }
        return o;
      });
      caja.innerHTML='';
      caja.appendChild(tabla(filas, [['vehiculo','Interno','b'],['patente','Patente'],['_modelo','Marca y modelo'],

    };

      o._plazo = isNaN(dd) ? '—' : (dd<0 ? 'vencido hace '+(-dd)+' d' : 'faltan '+dd+' d');
      o._est = isNaN(dd) ? '' : (dd<0 ? 'Vencido' : (dd<=30 ? 'Por vencer' : 'Vigente'));
      return o;
    });
    var vencidos = docs.filter(function(d){ return d._est==='Vencido'; }).length;
    var g = el('div',{cls:'grid g4', style:'margin-bottom:14px'});

    g.appendChild(kpi('Vencidos', miles(vencidos), 'meta: cero', vencidos>0));
    g.appendChild(kpi('Vencen en 30 días', miles(docs.filter(function(d){ return d._est==='Por vencer'; }).length), 'hay que sacar turno'));
    c.appendChild(g);
    c.appendChild(tabla(docs, [['ref','Unidad / persona','b'],['tipo','Documento'],['vence','Vence','fecha'],
      ['_plazo','Plazo'],['_est','Estado','chip'],['origen','Está cargado en']],
      function(f){ formGenerico(f.origen, f._fila); }));

/* el módulo se pinta con la MISMA paleta y la misma tipografía que el resto:
   se le esconde su barra propia y sus solapas quedan como las de acá */
function estiloDelModulo(){
  var hex = acento().replace('#','');
  var r = parseInt(hex.substr(0,2),16), g = parseInt(hex.substr(2,2),16), b = parseInt(hex.substr(4,2),16);
  var mez = function(p){ return 'rgb('+Math.round(r+(255-r)*p)+','+Math.round(g+(255-g)*p)+','+Math.round(b+(255-b)*p)+')'; };
  return ':root{--pri:'+acento()+';--pri-s:'+mez(.92)+';--tinta:#1f2328;--t2:#4a5057;--t3:#8a9099;'+
         '--fondo:#f4f5f7;--papel:#fff;--linea:#e7e9ec}'+
         'body{font-family:Montserrat,-apple-system,Segoe UI,Roboto,sans-serif;font-size:13.5px;background:#f4f5f7}'+
         '.top{display:none!important}'+
         'nav{background:#fff;border-bottom:1px solid var(--linea)}'+
         'nav .wrap{max-width:none;padding:0 22px;align-items:center}'+
         'nav button{font-family:inherit}'+
         '.navsp{flex:1}'+
         '.navses{border:1px solid var(--linea);background:#fff;border-radius:9px;padding:7px 13px;'+
           'margin:7px 0;font:600 12.5px Montserrat,sans-serif;color:var(--t2);cursor:pointer;white-space:nowrap}'+
         '.navses:hover{border-color:#d5d8dd;color:#1f2328}'+
         '.navses.dentro{border-color:var(--pri);color:var(--pri)}'+
         'main{max-width:none;padding:20px 22px 70px}'+
         /* el módulo venía un punto más grande en todo: lo emparejo */
         'button,input,select,textarea{font-size:13px}'+
         '.btn{padding:7px 12px;font-size:12.5px;border-radius:9px;font-weight:600}'+
         '.btn.mini{padding:3px 8px;font-size:11px;border-radius:7px}'+
         '.btn.sec{border:1px solid var(--linea);color:var(--t2)}'+
         '.btn.sec:hover{border-color:#d5d8dd;color:#1f2328;background:#fafbfc}'+
         /* que no se partan en dos renglones: es lo que las hacía ver enormes */
         '.pill{font-size:10.5px;padding:2px 8px;font-weight:700;white-space:nowrap}'+
         'table .mono{white-space:nowrap}'+
         /* que la tabla respete el ancho natural de cada columna y, si no entra,
            se corra de costado: mejor eso que un renglón por palabra */
         '.scroll table{min-width:1150px}'+
         'table td{vertical-align:middle}'+
         '.pill.solido{font-size:10px;padding:2px 8px;font-weight:700;letter-spacing:.2px;text-shadow:none}'+
         'table{font-size:12.8px}'+
         'table th{font-size:11px;letter-spacing:.4px}'+
         'input[type=text],input[type=number],input[type=date],select,textarea{padding:7px 10px;font-size:12.8px}'+
         'label{font-size:11px}'+
         '.kpi .v{font-size:23px}'+
         '.kpi .t{font-size:11px}'+
         '.kpi .d{font-size:12px}'+
         'nav button{padding:11px 13px;font-size:12.8px}'+
         /* las pastillas de subsolapa quedaban gordas al lado de las de acá */
         '.tabs2 button{padding:5px 12px;font-size:12px;border-radius:999px}'+
         '.tabs2{gap:5px;margin-bottom:12px}'+
         'h2{font:700 21px Montserrat,sans-serif;letter-spacing:-.3px;margin:0 0 3px}'+
         'h3{font-size:14.5px}'+
         '.sub{color:var(--t3);font-size:12.8px;margin:0 0 16px}';
}
/* Las empresas, bases y unidades son UNA SOLA lista: la de acá. Se las paso
   armadas al módulo para que no tenga las suyas propias. */
function maestrosParaModulo(){
  var empresas = T('Empresas').filter(function(e){ return e.activa!=='No'; }).map(function(e){
    return { id:String(e.id||e.codigo), nombre:e.nombre||e.codigo, alias:e.codigo||'', cuit:e.cuit||'', color:acento() };
  });
  var porCodigo = {};
  T('Empresas').forEach(function(e){ if(e.codigo) porCodigo[String(e.codigo).trim().toUpperCase()] = String(e.id||e.codigo); });
  var bases = T('Bases').filter(function(b){ return b.activa!=='No'; }).map(function(b){
    return { id:String(b.id||b.codigo), empresaId:porCodigo[String(b.empresa||'').trim().toUpperCase()]||'',
             nombre:b.nombre||b.codigo, tipo:b.nivel||'', localidad:b.localidad||'' };
  });
  var unidades = T('Vehiculos').map(function(v){
    return { id:String(v.id), empresaId:porCodigo[String(v.empresa||'').trim().toUpperCase()]||'',
             baseId:'', interno:v.vehiculo||'', patente:v.patente||'',
             marca:v.marca||'', modelo:v.modelo||'' };
  });
  return { empresas:empresas, bases:bases, unidades:unidades };
}

      var e = S.permEst[mo];

  g.appendChild(el('div',{cls:'mini',style:'margin-bottom:10px'},

  g.appendChild(fs);
  g.appendChild(el('button',{cls:'btn', onclick:function(){
    var v = gi.value.trim();
    if(v) localStorage.setItem('GF_GOOGLE_ID', v); else localStorage.removeItem('GF_GOOGLE_ID');
    if(ck.checked) localStorage.setItem('GF_GOOGLE_SOLO','1'); else localStorage.removeItem('GF_GOOGLE_SOLO');
    alert('Guardado. Cerrá sesión para ver la pantalla de entrada nueva.');
    pintar();
  }},'Guardar'));
  g.appendChild(el('div',{cls:'mini',style:'margin-top:10px'},
    'Esto solo cambia lo que se VE en la pantalla de entrada. El que decide de verdad es el .gs: si ahí ponés <span class="mono">GF_EXIGIR_GOOGLE = true</span>, el ingreso con usuario y PIN deja de funcionar aunque alguien toquetee el navegador.'));
  m.appendChild(g);
}
function verFilasPermisos(tipo, quien){
  var li = ['tipo\tquien\tmodulo\tver\tcargar\tborrar\tautorizar'];
  Object.keys(S.permEst||{}).forEach(function(mo){
    var e = S.permEst[mo];
    if(!e.ver && !e.cargar && !e.borrar && !e.autorizar) return;
    li.push([tipo, quien, mo, e.ver?'Sí':'No', e.cargar?'Sí':'No', e.borrar?'Sí':'No', e.autorizar?'Sí':'No'].join('\t'));

/* ---- código de acceso de Mi empresa ----
   Parámetro clave_miempresa de la planilla. Si está cargado, esta pantalla lo
   pide al entrar, sea quien sea el usuario, y el conector no deja guardar en
   las hojas de Mi empresa hasta que la sesión lo escribió bien. */
/* El código vive en el conector (GF_CLAVE_MIEMPRESA, arriba del bloque de
   permisos del .gs). Mi empresa lo pide CADA vez que se entra. Si el conector
   es viejo y no lo conoce, vale el de fábrica. */
var CLAVE_CONFIG_DEFECTO = '1234';
function exigeClaveConfig(){ return S.claveConfigServidor===false ? false : true; }
function pantallaClaveConfig(m){
  encabezado(m,'Mi empresa','Empresas, bases, usuarios y la conexión con la planilla');
  var c = el('div',{cls:'card', style:'max-width:420px;margin:30px auto;text-align:center'});
  c.innerHTML = '<div class="h1" style="font-size:17px;margin-bottom:4px">Código de acceso</div><div class="sub" style="margin-bottom:14px">Para entrar a Mi empresa hay que escribir el código.</div>';
  if(S.error){ c.appendChild(el('div',{cls:'err'}, esc(S.error))); S.error=''; }
  var inp = el('input',{type:'password', cls:'pin codigo', maxlength:'40', placeholder:'••••••', autocomplete:'off'});
  c.appendChild(inp);
  var seguir = function(){
    var v = inp.value.trim(); if(!v) return;
    var listo = function(){ S.cfgOk = true; S.error=''; pintar(); };
    var fabrica = function(){ if(v===CLAVE_CONFIG_DEFECTO) listo(); else { S.error='Código de acceso incorrecto.'; pintar(); } };
    if(S.token){                       /* lo revisa el conector contra GF_CLAVE_MIEMPRESA */
      apiGet({accion:'clave_config', clave:v}, function(){ listo(); }, function(err){
        if(/incorrecto|vencida/i.test(String(err))){ S.error = err; pintar(); } else fabrica();   /* conector viejo */
      });
    } else fabrica();
  };
  inp.addEventListener('keydown', function(e){ if(e.key==='Enter') seguir(); });
  c.appendChild(el('div',{style:'height:10px'}));
  c.appendChild(el('button',{cls:'btn pri', style:'width:100%;justify-content:center', onclick:seguir},'Entrar a Mi empresa'));
  c.appendChild(el('div',{cls:'mini',style:'margin-top:12px'},'Es un código aparte del PIN y se pide cada vez que entrás a Mi empresa. Se cambia en el conector de la planilla (línea GF_CLAVE_MIEMPRESA).'));
  m.appendChild(c);
  setTimeout(function(){ try{ inp.focus(); }catch(e){} }, 50);
}

/* ------------------- entrar con la cuenta de Google -------------------
   Sirve para cuentas mezcladas (Gmail sueltas y de dominio propio): Google
   confirma quién es, y el conector chequea que ese correo esté en la hoja
   Usuarios. El navegador nunca decide nada: manda el comprobante de Google
   y el .gs lo verifica contra Google antes de dejar entrar. */
function googleClientId(){ return (localStorage.getItem('GF_GOOGLE_ID')||'').trim(); }
function googleObligatorio(){ return localStorage.getItem('GF_GOOGLE_SOLO')==='1'; }
function cargarGoogle(alListo){
  if(window.google && window.google.accounts && window.google.accounts.id) return alListo();
  if(document.getElementById('gsi-script')) { setTimeout(function(){ cargarGoogle(alListo); }, 300); return; }
  var s = document.createElement('script');
  s.id='gsi-script'; s.src='https://accounts.google.com/gsi/client'; s.async=true; s.defer=true;
  s.onload = alListo;
  s.onerror = function(){ S.error='No se pudo cargar el botón de Google (¿sin internet?). Entrá con usuario y PIN.'; pintar(); };
  document.head.appendChild(s);
}
function botonGoogle(caja){
  var cid = googleClientId(); if(!cid) return;
  cargarGoogle(function(){
    try{
      google.accounts.id.initialize({ client_id: cid, callback: function(resp){
        S.cargando = true; S.error=''; pintar();
        var ped = { accion:'entrar_google', idtoken: resp.credential }; if(S.clave) ped.clave = S.clave;
        apiPost(ped, function(j){
          S.cargando = false;
          if(!j || !j.token){ S.error = 'Google confirmó tu cuenta pero la planilla no la reconoció.'; pintar(); return; }
          S.token = j.token; localStorage.setItem(LS.tok, j.token);
          S.usuario = j.usuario; S.permServidor = j.permisos || null; S.error='';
          localStorage.setItem(LS.ses, S.usuario.usuario);
          fijarEmpresa(j.empresa || S.empresaEntrada);
          traer();
        }, function(err){ S.cargando=false; S.error = err; pintar(); });
      }});
      google.accounts.id.renderButton(caja, { theme:'outline', size:'large', width:280, text:'signin_with', locale:'es' });
    }catch(e){ caja.innerHTML = '<div class="mini">No se pudo dibujar el botón de Google: '+esc(e.message)+'</div>'; }
  });
}

/* ------------------- código de acceso de la empresa -------------------
   Cada empresa puede tener su código (Mi empresa → Empresas y bases). Si
   alguna lo tiene, antes del usuario y PIN se pide el código: el conector no
   entrega ni la lista de usuarios sin él. La persona queda trabajando en la
   empresa de ese código. */
function fijarEmpresa(emp){
  if(!emp || !emp.codigo){ S.empresaFija=''; localStorage.removeItem(LS.empFija); return; }
  S.empresaFija = emp.codigo; S.empresa = emp.codigo;
  localStorage.setItem(LS.empFija, emp.codigo); localStorage.setItem(LS.emp, emp.codigo);
}
function salir(){
  S.usuario=null; S.token=''; S.permServidor=null; S.empresaEntrada=null;
  localStorage.removeItem(LS.ses); localStorage.removeItem(LS.tok);
  fijarEmpresa(null);
  /* vuelvo a pedir la lista de usuarios: si el conector exige código, la
     pide con el que quedó guardado en esta computadora */
  S.db.Usuarios = [];
  S.cfgOk=false;
  traer();
}
function pantallaCodigo(){
  var w = portada();
  var c = el('div',{cls:'login'});
  c.innerHTML = (logoDe('*')?'<img class="logoemp" src="'+logoDe('*')+'">':isoHtml(marcaNombre()))+'<h1>'+esc(marcaNombre())+'</h1><p>Escribí el código de acceso de tu empresa</p>';
  if(S.error) c.appendChild(el('div',{cls:'err'}, esc(S.error)));
  if(S.cargando){ c.appendChild(el('div',{cls:'mini'},'Comprobando…')); w.appendChild(c); return w; }
  var inp = el('input',{type:'password', cls:'pin codigo', maxlength:'40', placeholder:'••••••', autocomplete:'off'});
  c.appendChild(el('div',{cls:'campo',style:'text-align:left'},'<label>Código de acceso</label>').appendChild(inp).parentNode);
  var seguir = function(){
    var v = inp.value.trim(); if(!v) return;
    S.error='';
    if(S.exigeClave){          /* lo controla el conector: sin código no baja ni la lista de usuarios */
      S.cargando = true; pintar();
      pedirUsuarios(v, function(){ S.cargando=false; pintar(); });
      return;
    }
    var e = claveLocal(v);     /* conector viejo: se controla acá */
    if(!e){ S.error='Código de acceso incorrecto.'; pintar(); return; }
    S.clave = v; S.empresaEntrada = e; localStorage.setItem(LS.clave, v); pintar();
  };
  inp.addEventListener('keydown', function(e){ if(e.key==='Enter') seguir(); });
  c.appendChild(el('button',{cls:'btn pri', style:'width:100%;justify-content:center', onclick:seguir},'Continuar'));
  c.appendChild(el('div',{cls:'mini',style:'margin-top:14px'},'El código te lo da el administrador de tu empresa.<br><b>'+esc(GF_VERSION)+'</b>'));
  w.appendChild(c);
  setTimeout(function(){ try{ inp.focus(); }catch(e){} }, 50);
  return w;
}

function pantallaLogin(){
  /* con el conector viejo, el código se controla acá contra la columna clave_acceso */
  if(exigeClaveLocal() && !S.empresaEntrada && S.clave){ var e0 = claveLocal(S.clave); if(e0) S.empresaEntrada = e0; else { S.clave=''; localStorage.removeItem(LS.clave); } }
  if((S.exigeClave || exigeClaveLocal()) && !S.empresaEntrada) return pantallaCodigo();

  var w = portada();
  var c = el('div',{cls:'login'});
  c.innerHTML = (logoDe('*')?'<img class="logoemp" src="'+logoDe('*')+'">':isoHtml(marcaNombre()))+'<h1>'+esc(marcaNombre())+'</h1><p>'+(S.planilla?esc(S.planilla):'Entrá con tu usuario y PIN')+'</p>';
  if(S.empresaEntrada){
    var ce = el('div',{cls:'emp-entrada'}, '<b>'+esc(S.empresaEntrada.nombre)+'</b> · <a>cambiar de empresa</a>');
    ce.querySelector('a').addEventListener('click', function(){
      S.clave=''; S.empresaEntrada=null; S.error=''; localStorage.removeItem(LS.clave);
      if(S.exigeClave) S.db.Usuarios = [];
      pintar();
    });
    c.appendChild(ce);
  }
  if(S.error) c.appendChild(el('div',{cls:'err'}, esc(S.error)));
  if(S.cargando){ c.appendChild(el('div',{cls:'mini'},'Trayendo los datos de la planilla…')); w.appendChild(c); return w; }

  if(googleClientId()){
    var caja = el('div',{style:'display:flex;justify-content:center;margin-bottom:6px;min-height:44px'});
    c.appendChild(caja);
    botonGoogle(caja);
    if(googleObligatorio()){
      c.appendChild(el('div',{cls:'mini',style:'margin-top:10px'},'Se entra con la cuenta de Google. Tu correo tiene que estar cargado en la hoja Usuarios.<br><b>'+esc(GF_VERSION)+'</b>'));
      w.appendChild(c); return w;
    }
    c.appendChild(el('div',{cls:'mini',style:'margin:10px 0 4px;text-align:center'},'— o entrá con usuario y PIN —'));
  }

  var us = T('Usuarios').filter(function(u){ return u.activo!=='No'; });
  if(!us.length){
    c.appendChild(el('div',{cls:'aviso'},'La hoja Usuarios está vacía. Cargá al menos uno en la planilla (o usá "2. Cargar datos de ejemplo").'));
    c.appendChild(el('button',{cls:'btn', style:'width:100%;justify-content:center', onclick:function(){ traer(); }},'Reintentar'));
    w.appendChild(c); return w;
  }
  var sel = el('select');
  us.forEach(function(u){ sel.appendChild(el('option',{value:u.usuario}, esc(u.nombre)+' — '+esc(u.rol))); });
  c.appendChild(el('div',{cls:'campo',style:'text-align:left'},'<label>Usuario</label>').appendChild(sel).parentNode);
  var pin = el('input',{type:'password', cls:'pin', maxlength:'8', placeholder:'••••'});
  c.appendChild(el('div',{cls:'campo',style:'text-align:left'},'<label>PIN</label>').appendChild(pin).parentNode);
  var entrar = function(){
    var u = null; us.forEach(function(x){ if(x.usuario===sel.value) u=x; });
    if(!u) return;
    var local = function(){
      if(String(u.pin||'') !== pin.value.trim()){ S.error='PIN incorrecto para '+u.nombre+'.'; pintar(); return; }
      if(S.empresaEntrada && String(u.empresa||'').trim() && String(u.empresa).trim()!==S.empresaEntrada.codigo){ S.error='Ese usuario no pertenece a '+S.empresaEntrada.nombre+'.'; pintar(); return; }
      S.usuario = u; S.error=''; localStorage.setItem(LS.ses, u.usuario);
      fijarEmpresa(S.empresaEntrada); pintar();
    };
    /* si el conector ya tiene el bloque de permisos, el PIN lo revisa el servidor
       y vuelve con un token. Si no lo tiene, seguimos como siempre. */
    S.cargando = true; pintar();
    var ped = { accion:'entrar', usuario:u.usuario, pin:pin.value.trim() }; if(S.clave) ped.clave = S.clave;
    apiGet(ped, function(j){
      S.cargando = false;
      if(!j || !j.token){ local(); return; }
      S.token = j.token; localStorage.setItem(LS.tok, j.token);
      S.usuario = j.usuario || u; S.permServidor = j.permisos || null; S.error='';
      localStorage.setItem(LS.ses, S.usuario.usuario);
      fijarEmpresa(j.empresa || S.empresaEntrada);
      traer();
    }, function(err){
      S.cargando = false;
      if(/pin incorrecto|dado de baja|inexistente|no pertenece|c[oó]digo de acceso/i.test(String(err))){
        S.error = err;
        if(/c[oó]digo de acceso/i.test(String(err))){ S.clave=''; S.empresaEntrada=null; localStorage.removeItem(LS.clave); }
        pintar(); return;
      }
      local();   /* el conector viejo no conoce "entrar": chequeo acá como antes */
    });
  };
  pin.addEventListener('keydown', function(e){ if(e.key==='Enter') entrar(); });
  c.appendChild(el('button',{cls:'btn pri', style:'width:100%;justify-content:center', onclick:entrar},'Entrar'));
  c.appendChild(el('div',{cls:'mini',style:'margin-top:14px'},'<b>'+esc(GF_VERSION)+'</b>'));
  w.appendChild(c);
  return w;
}

function guardarFila(hoja, obj){
  if(!S.db[hoja]) S.db[hoja]=[];
  if(!obj.id) obj.id = idNuevo();
  var i = -1; S.db[hoja].forEach(function(r,k){ if(String(r.id)===String(obj.id)) i=k; });
  if(i>=0) S.db[hoja][i] = obj; else S.db[hoja].push(obj);
}
function borrarFila(hoja, obj){
  S.db[hoja] = (S.db[hoja]||[]).filter(function(r){ return String(r.id)!==String(obj.id); });
}

function campoDe(col, valor, alCambiar){
  var c = el('div',{cls:'campo'});

  var ent;
  if(col.val && col.val.indexOf('l:')===0){
    ent = el('select');

    ((S.listas||{})[col.val.substring(2)]||[]).forEach(function(v){
      var o = el('option',{value:v}, esc(v)); if(String(valor)===String(v)) o.selected=true; ent.appendChild(o);
    });
  } else if(col.val && col.val.indexOf('r:')===0){
    var p = col.val.substring(2).split('.');
    ent = el('select');
    ent.appendChild(el('option',{value:''},'—'));
    T(p[0]).forEach(function(r){
      var etiq = r[p[1]] + (r.nombre? ' · '+r.nombre : (r.descripcion? ' · '+r.descripcion : (r.razon_social? ' · '+r.razon_social : (r.patente? ' · '+r.patente:''))));
      var o = el('option',{value:r[p[1]]}, esc(etiq)); if(String(valor)===String(r[p[1]])) o.selected=true; ent.appendChild(o);
    });
  } else if(/^(obs|descripcion|falla|diagnostico|trabajo|detalle|no_conformes|sintoma|causa|solucion|alcance|permisos)$/.test(col.clave)){
    ent = el('textarea', null, esc(valor===undefined?'':valor));
  } else if(col.fmt==='e'||col.fmt==='n'||col.fmt==='$'||col.fmt==='%'){
    ent = el('input',{type:'number', step:(col.fmt==='e'?'1':'0.01'), value:(valor===''||valor===undefined?'':valor)});
  } else {
    ent = el('input',{value:(valor===undefined||valor===null?'':valor)});
    if(/fecha|vencimiento|emision|entrega|apertura|cierre|inicio|fin|despacho|recepcion$/.test(col.clave)) ent.placeholder='aaaa-mm-dd';
    if(/^hora/.test(col.clave)) ent.placeholder='hh:mm';
  }
  ent.addEventListener('change', function(e){ alCambiar(col.fmt==='t'? e.target.value : (e.target.value===''?'':num(e.target.value))); });
  ent.addEventListener('input', function(e){ alCambiar(col.fmt==='t'? e.target.value : (e.target.value===''?'':num(e.target.value))); });
  c.appendChild(ent);
  return c;
}

function formGenerico(hoja, registro, alTerminar){
  if(!puede(S.vista,'cargar')){ alert('Tu usuario puede mirar este módulo pero no cargar ni editar.'); return; }
  var esq = (S.esq||{})[hoja];
  if(!esq){
    if(!S.esq){
      aviso('Descargando la estructura de la planilla…');
      pedirEsquema(function(ok, err){
        if(ok) formGenerico(hoja, registro, alTerminar);
        else { alert('No pude bajar la estructura de la planilla: '+(err||'sin respuesta')+'\n\nProbá de nuevo en unos segundos.'); }
      });
      return;
    }
    alert('La planilla no tiene la hoja "'+hoja+'". Corré "Crear / reparar la plantilla" desde el menú Gestión de Flota de la planilla.'); return;
  }
  /* las tablas pasan la fila "vestida" (Object.create) con columnas calculadas _km, _prox…:
     hay que copiar también lo heredado (los datos reales) y dejar afuera lo calculado */
  var obj = {};
  if(registro){ for(var k in registro){ if(k.charAt(0)!=='_') obj[k]=registro[k]; } }
  var nuevo = !registro || !registro.id;
  var cuerpo = el('div');
  cuerpo.appendChild(el('div',{cls:'mini',style:'margin-bottom:12px'}, esc(esq.desc||'')));

  /* la configuración de ejes se elige con el dibujo, no escribiendo un patrón */
  if(hoja==='Vehiculos'){
    var bloque = el('div',{style:'border:1px solid var(--linea);border-radius:12px;padding:12px;margin-bottom:14px'});
    bloque.appendChild(el('label',null,'Configuración de ejes'));
    var resumen = el('div',{cls:'mini',style:'margin:-2px 0 10px'});
    var pintarResumen = function(){
      resumen.innerHTML = obj.ruedas
        ? '<b style="color:var(--t1)">'+esc(nombreConfig(obj.ruedas))+'</b> · '+esc(patronDe(obj.ruedas))+' · '+num(obj.ejes)+' ejes · '+totalRuedas(obj.ruedas)+' posiciones de neumático'
        : 'Elegí la configuración: de acá salen las posiciones donde se montan las cubiertas.';
    };
    pintarResumen();
    bloque.appendChild(resumen);
    bloque.appendChild(selectorEjes(obj.ruedas, function(patron, ejes){
      obj.ruedas = patron; obj.ejes = ejes; pintarResumen();
    }));
    cuerpo.appendChild(bloque);
  }

  var f = el('div',{cls:'fila'});
  esq.cols.forEach(function(col){
    if(col.clave==='id') return;
    if(hoja==='Vehiculos' && (col.clave==='ruedas' || col.clave==='ejes')) return;   /* ya se eligieron arriba */
    f.appendChild(campoDe(col, obj[col.clave], function(v){ obj[col.clave]=v; }));
  });
  cuerpo.appendChild(f);

  var bots = [];
  if(!nuevo && puede(S.vista,'borrar')) bots.push(el('button',{cls:'btn', onclick:function(){
    if(!confirm('¿Borrar este registro de la hoja '+hoja+'?')) return;
    borrarFila(hoja, obj); guardar([hoja]); cerrarModal();
  }},'Borrar'));
  bots.push(el('button',{cls:'btn pri', onclick:function(){
    guardarFila(hoja, obj); guardar([hoja], function(){ alTerminar && alTerminar(obj); }); cerrarModal();
  }},'Guardar'));
  modal((nuevo?'Nuevo registro · ':'Editar · ')+hoja, cuerpo, bots);
}

/* ------------------------------ FICHA O.T. --------------------------- */
function totalesOT(numero){
  var mo = T('OT_ManoObra').filter(function(x){ return x.ot===numero; }).reduce(function(a,b){ return a+num(b.importe); },0);
  var ma = T('OT_Materiales').filter(function(x){ return x.ot===numero; }).reduce(function(a,b){ return a+num(b.importe); },0);
  var te = T('OT_Terceros').filter(function(x){ return x.ot===numero; }).reduce(function(a,b){ return a+num(b.importe); },0);
  return { mo:mo, ma:ma, te:te, total:mo+ma+te };
}

  var cuerpo = el('div');

    '<div class="kpi"><div class="et">Costo</div><div class="nu" style="font-size:19px">'+pesos(t.total)+'</div><div class="pie">MO '+pesos(t.mo)+' · Mat '+pesos(t.ma)+' · 3ros '+pesos(t.te)+'</div></div>'));

  var d = el('div',{cls:'card', style:'box-shadow:none;padding:0;margin-bottom:14px'});
  d.innerHTML = '<table><tbody>'+

    fila2('Odómetro', miles(o.odometro)+' km')+

    return c;
  };
  cuerpo.appendChild(seccion('Tareas','OT_Tareas',

    function(){ return { ot:o.numero, item:T('OT_Tareas').filter(function(x){return x.ot===o.numero;}).length+1, estado:'Pendiente' }; }));
  cuerpo.appendChild(seccion('Mano de obra','OT_ManoObra',
    [['fecha','Fecha','fecha'],['nombre','Quién'],['hora_inicio','Entrada'],['hora_fin','Salida'],['horas','Horas','n'],['costo_hora','$/hora','$'],['importe','Importe','$']],
    function(){ return { ot:o.numero, fecha:hoy() }; }));
  cuerpo.appendChild(seccion('Repuestos','OT_Materiales',

    function(){ return { ot:o.numero, base:o.base, empresa_stock:o.empresa, prestamo:'No' }; }));
  cuerpo.appendChild(seccion('Terceros','OT_Terceros',

    el('button',{cls:'btn pri', onclick:function(){ recalcularOT(o.numero, true); }}, o.estado==='Cerrada'?'Recalcular costos':'Recalcular y cerrar')
  ];

function fila2(a,b){ return '<tr><td style="width:190px;color:var(--t3)">'+esc(a)+'</td><td><b>'+b+'</b></td></tr>'; }
function otPorNumero(n){ var r=null; T('OT').forEach(function(o){ if(o.numero===n) r=o; }); return r; }

function recalcularOT(numero, cerrar){
  var o = otPorNumero(numero); if(!o) return;
  var t = totalesOT(numero);
  o.costo_mo = t.mo; o.costo_materiales = t.ma; o.costo_terceros = t.te; o.costo_total = t.total;
  if(cerrar && o.estado!=='Cerrada'){
    if(!t.mo && !confirm('Esta O.T. no tiene horas de mano de obra cargadas. Sin horas el costo por km miente.\n\n¿La cerramos igual?')) return;
    o.estado = 'Cerrada'; o.fecha_cierre = hoy(); o.cerrada_por = S.usuario? S.usuario.nombre : '';
    if(!o.fecha_fin) o.fecha_fin = hoy();
    var v = unidad(o.interno); if(v && v.estado==='En taller'){ v.estado='Operativa'; guardarFila('Vehiculos', v); }
  }
  guardarFila('OT', o);
  guardar(['OT','Vehiculos'], function(){ fichaOT(otPorNumero(numero)); });
}

/* --------------------------- VALE DE CONSUMO ------------------------- */
function abrirVale(ot){
  var stk = stockLista();
  /* si está mirando "todas las empresas", el vale igual tiene que salir de un pañol concreto */
  var empresa = (ot? ot.empresa : (S.empresa!=='*'?S.empresa:'')) || (S.usuario&&S.usuario.empresa) || ((T('Empresas')[0]||{}).codigo||'');
  var base = (ot? ot.base : (S.usuario? S.usuario.base:'')) || '';
  if(!base || !T('Bases').some(function(b){ return b.codigo===base && b.empresa===empresa; })){
    var b0 = T('Bases').filter(function(b){ return b.empresa===empresa; })[0];
    base = b0 ? b0.codigo : base;
  }
  var renglones = [{ articulo:'', cantidad:1 }];
  var destinoOT = ot ? ot.numero : '';
  var interno = ot ? ot.interno : '';

  var cuerpo = el('div');
  var dibujar = function(){
    cuerpo.innerHTML = '';
    var enc = el('div',{cls:'fila'});
    var selEmp = el('select'); T('Empresas').forEach(function(e){ var o=el('option',{value:e.codigo}, esc(e.nombre)); if(e.codigo===empresa) o.selected=true; selEmp.appendChild(o); });
    selEmp.addEventListener('change', function(e){ empresa=e.target.value;
      if(!T('Bases').some(function(b){ return b.codigo===base && b.empresa===empresa; })){
        var b0=T('Bases').filter(function(b){ return b.empresa===empresa; })[0]; base = b0?b0.codigo:'';
      }
      dibujar(); });
    enc.appendChild(el('div',{cls:'campo'},'<label>Empresa del stock</label>').appendChild(selEmp).parentNode);
    var selBase = el('select'); T('Bases').filter(function(b){ return !empresa||b.empresa===empresa; }).forEach(function(b){ var o=el('option',{value:b.codigo}, esc(b.nombre)); if(b.codigo===base) o.selected=true; selBase.appendChild(o); });
    selBase.addEventListener('change', function(e){ base=e.target.value; dibujar(); });
    enc.appendChild(el('div',{cls:'campo'},'<label>Base que entrega</label>').appendChild(selBase).parentNode);
    var selOT = el('select'); selOT.appendChild(el('option',{value:''},'— sin O.T. —'));
    T('OT').filter(function(o){ return o.estado!=='Cerrada'&&o.estado!=='Anulada'; }).forEach(function(o){
      var op=el('option',{value:o.numero}, esc(o.numero+' · interno '+o.interno)); if(o.numero===destinoOT) op.selected=true; selOT.appendChild(op); });
    selOT.addEventListener('change', function(e){ destinoOT=e.target.value; var o=otPorNumero(destinoOT); if(o) interno=o.interno; dibujar(); });
    enc.appendChild(el('div',{cls:'campo'},'<label>Orden de trabajo</label>').appendChild(selOT).parentNode);
    var inpInt = el('input',{value:interno, placeholder:'interno'});
    inpInt.addEventListener('input', function(e){ interno=e.target.value; });
    enc.appendChild(el('div',{cls:'campo'},'<label>Interno (a quién se le carga)</label>').appendChild(inpInt).parentNode);
    cuerpo.appendChild(enc);

    var v = unidad(interno);
    if(v && empresa && empCod(v) !== empresa)
      cuerpo.appendChild(el('div',{cls:'aviso'},'Préstamo entre empresas: el material sale del pañol de '+esc(empresa)+' y lo paga '+esc(empCod(v))+', dueña del coche.'));

    renglones.forEach(function(r, i){
      var caja = el('div',{style:'border:1px solid var(--linea);border-radius:10px;padding:12px;margin-bottom:10px'});
      var f = el('div',{cls:'fila'});
      var sel = el('select');
      sel.appendChild(el('option',{value:''},'— elegir artículo —'));
      T('Articulos').forEach(function(a){
        var s = stk.filter(function(x){ return x.articulo===a.codigo && x.empresa===empresa && x.base===base; })[0];
        var op = el('option',{value:a.codigo}, esc(a.codigo+' · '+a.descripcion+' · hay '+(s?miles(s.cant):'0')+' '+(a.um||'')));
        if(r.articulo===a.codigo) op.selected=true; sel.appendChild(op);
      });
      sel.addEventListener('change', function(e){ r.articulo=e.target.value; dibujar(); });
      f.appendChild(el('div',{cls:'campo'},'<label>Artículo</label>').appendChild(sel).parentNode);
      var inpC = el('input',{type:'number', step:'0.01', value:r.cantidad});
      inpC.addEventListener('input', function(e){ r.cantidad = num(e.target.value); });
      f.appendChild(el('div',{cls:'campo'},'<label>Cantidad que sale</label>').appendChild(inpC).parentNode);
      caja.appendChild(f);
      if(r.articulo){
        var s = stk.filter(function(x){ return x.articulo===r.articulo && x.empresa===empresa && x.base===base; })[0];
        var otras = stk.filter(function(x){ return x.articulo===r.articulo && x.cant>0 && !(x.empresa===empresa&&x.base===base); });
        caja.appendChild(el('div',{cls:'mini'},
          (s&&s.ubicacion ? '📍 <b>'+esc(s.ubicacion)+'</b> · ' : '📍 sin ubicación cargada · ')+
          'hay '+(s?miles(s.cant):'0')+' en '+esc(base)+
          (s && num(r.cantidad)>s.cant ? ' <span class="chip ma">no alcanza</span>' : '')+
          (otras.length ? ' · también hay en '+otras.map(function(x){ return esc(x.base)+' ('+miles(x.cant)+')'; }).join(', ') : '')));
      }
      if(renglones.length>1) caja.appendChild(el('button',{cls:'btn chico', style:'margin-top:8px', onclick:function(){ renglones.splice(i,1); dibujar(); }},'Quitar renglón'));
      cuerpo.appendChild(caja);
    });
    cuerpo.appendChild(el('button',{cls:'btn chico', onclick:function(){ renglones.push({articulo:'',cantidad:1}); dibujar(); }},'+ Otro renglón'));
  };
  dibujar();

  var confirmar = el('button',{cls:'btn pri', onclick:function(){
    var validos = renglones.filter(function(r){ return r.articulo && num(r.cantidad)>0; });
    if(!validos.length){ alert('Elegí al menos un artículo.'); return; }
    proximoNumero('VC', function(vale){
      var v = unidad(interno);
      var art = {}; T('Articulos').forEach(function(a){ art[a.codigo]=a; });
      var st = stockMapa();
      validos.forEach(function(r){
        var a = art[r.articulo]||{};
        var k = empresa+'|'+base+'|'+r.articulo;
        var costo = (st[k] && st[k].costo) ? st[k].costo : num(a.costo_referencia);
        var par = T('StockParam').filter(function(p){ return p.articulo===r.articulo&&p.empresa===empresa&&p.base===base; })[0];
        guardarFila('Movimientos', { id:idNuevo(), fecha:hoy(), tipo:'Vale de consumo', articulo:r.articulo,
          descripcion:a.descripcion||'', empresa:empresa, base:base, cantidad:-num(r.cantidad), um:a.um||'',
          costo_unit:costo, importe:-num(r.cantidad)*costo,
          destino_tipo: destinoOT? 'Orden de trabajo':'Vehículo', destino: destinoOT||interno,
          interno:interno, ot:destinoOT, empresa_imputa: (v? (empCod(v)||empresa) : empresa), vale:vale, documento:'',
          ubicacion: par?par.ubicacion:'', usuario: S.usuario?S.usuario.nombre:'', motivo:'', obs:'' });
        if(destinoOT){
          guardarFila('OT_Materiales', { id:idNuevo(), ot:destinoOT, tarea:'', articulo:r.articulo,
            descripcion:a.descripcion||'', cantidad:num(r.cantidad), um:a.um||'', costo_unit:costo,
            importe:num(r.cantidad)*costo, vale:vale, base:base, empresa_stock:empresa,
            prestamo:(v && empCod(v)!==empresa)?'Sí':'No' });
        }
      });
      var hojas = destinoOT? ['Movimientos','OT_Materiales','OT'] : ['Movimientos'];
      if(destinoOT) recalcularOTsinGuardar(destinoOT);
      guardar(hojas);
      cerrarModal();
    });
  }},'Firmar el vale');
  modal('Vale de consumo'+(ot?' · O.T. '+ot.numero:''), cuerpo, [confirmar], 'ancho');
}
function recalcularOTsinGuardar(numero){
  var o = otPorNumero(numero); if(!o) return;
  var t = totalesOT(numero);
  o.costo_mo=t.mo; o.costo_materiales=t.ma; o.costo_terceros=t.te; o.costo_total=t.total;
  guardarFila('OT', o);
}

      var iu = el('input',{value:d.ubicacion, placeholder:'A-03-2'}); iu.addEventListener('input',function(e){ d.ubicacion=e.target.value; });

            else guardarFila('StockParam', { id:idNuevo(), articulo:d.it.articulo, empresa:oc.empresa, base:oc.base,

          }
        }
        d.it.recibida_acum = num(d.it.recibida_acum) + acepta;
        guardarFila('OrdenItems', d.it);
      });
      var completa = T('OrdenItems').filter(function(i){ return i.orden===oc.numero; })

function numerarDevoluciones(){
  var sin = T('Devoluciones').filter(function(d){ return !d.numero; });
  if(!sin.length) return;
  var max = 0;
  T('Devoluciones').forEach(function(d){ var m=String(d.numero||'').match(/(\d+)$/); if(m) max=Math.max(max,parseInt(m[1],10)); });
  sin.forEach(function(d){ max++; var n=String(max); while(n.length<6) n='0'+n; d.numero='DV-'+n; guardarFila('Devoluciones', d); });
  guardar(['Devoluciones']);
}

function normTexto(s){
  return String(s===undefined||s===null?'':s).toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^a-z0-9]+/g,' ').trim();
}

/* clave natural de cada hoja, para no duplicar al reimportar */
var CLAVE_HOJA = { Vehiculos:'vehiculo', Conductores:'dni', Personal:'legajo', Articulos:'codigo',
  Proveedores:'codigo', Empresas:'codigo', Bases:'codigo', OT:'numero', Neumaticos:'fuego' };

function separadorDe(linea){
  var c = { ';':0, ',':0, '\t':0, '|':0 };
  for(var i=0;i<linea.length;i++) if(c[linea[i]]!==undefined) c[linea[i]]++;
  var mejor=';', max=-1;
  Object.keys(c).forEach(function(k){ if(c[k]>max){ max=c[k]; mejor=k; } });
  return max>0 ? mejor : ';';
}
function parseCSV(texto){
  texto = texto.replace(/^﻿/,'').replace(/\r\n/g,'\n').replace(/\r/g,'\n');
  var lineas = texto.split('\n').filter(function(l){ return l.trim()!==''; });
  if(!lineas.length) return [];
  var sep = separadorDe(lineas[0]);
  return lineas.map(function(l){
    var out=[], act='', comillas=false;
    for(var i=0;i<l.length;i++){
      var ch=l[i];
      if(ch==='"'){ if(comillas && l[i+1]==='"'){ act+='"'; i++; } else comillas=!comillas; }
      else if(ch===sep && !comillas){ out.push(act.trim()); act=''; }
      else act+=ch;
    }
    out.push(act.trim());
    return out;
  });
}
function leerArchivo(file, cb, cbErr){
  var nombre = (file.name||'').toLowerCase();
  var r = new FileReader();
  if(/\.(xlsx|xlsm|xls)$/.test(nombre)){
    if(typeof XLSX === 'undefined') return cbErr('Para leer Excel hace falta internet la primera vez. Guardalo como CSV y probá de nuevo.');
    r.onload = function(e){
      try{
        var wb = XLSX.read(new Uint8Array(e.target.result), {type:'array'});
        var hoja = wb.Sheets[wb.SheetNames[0]];
        var filas = XLSX.utils.sheet_to_json(hoja, {header:1, raw:false, defval:''});
        cb(filas.filter(function(f){ return f.some(function(c){ return String(c).trim()!==''; }); }));
      }catch(err){ cbErr('No se pudo leer el Excel: '+err.message); }
    };
    r.readAsArrayBuffer(file);
  } else {
    r.onload = function(e){
      var txt = e.target.result;
      /* los reportes viejos vienen en Latin-1 y rompen los acentos */
      if(/Ã|Â/.test(txt)){ try{ txt = new TextDecoder('windows-1252').decode(new TextEncoder().encode(txt)); }catch(x){} }
      cb(parseCSV(txt));
    };
    r.readAsText(file, 'utf-8');
  }
}

function mapearEncabezados(hoja, encabezados){
  var cols = ((S.esq||{})[hoja]||{cols:[]}).cols;
  var alias = ALIAS[hoja] || {};
  var mapa = [];
  encabezados.forEach(function(h){
    var n = normTexto(h), elegida = '';
    cols.forEach(function(c){
      if(elegida) return;
      if(n === normTexto(c.clave) || n === normTexto(c.titulo)) elegida = c.clave;
    });
    if(!elegida) Object.keys(alias).forEach(function(k){
      if(elegida) return;
      if(alias[k].some(function(a){ return normTexto(a) === n; })) elegida = k;
    });
    if(!elegida) cols.forEach(function(c){
      if(elegida) return;
      var t = normTexto(c.titulo);
      if(n && (t.indexOf(n)===0 || n.indexOf(t)===0)) elegida = c.clave;
    });
    mapa.push({ origen:h, destino:elegida });
  });
  return mapa;
}

function importarMasivo(hoja, opciones){
  opciones = opciones || {};
  var cols = ((S.esq||{})[hoja]||{cols:[]}).cols;
  if(!cols.length){
    if(!S.esq){ aviso('Descargando la estructura de la planilla…'); pedirEsquema(function(ok){ if(ok) importarMasivo(hoja, opciones); else alert('No pude bajar la estructura de la planilla. Probá de nuevo en unos segundos.'); }); return; }
    alert('La planilla no tiene la hoja "'+hoja+'". Corré "Crear / reparar la plantilla" desde el menú Gestión de Flota de la planilla.'); return;
  }
  var clave = opciones.clave || CLAVE_HOJA[hoja] || '';
  var estado = { filas:null, mapa:null, listas:null, actualizar:true, avisos:[], corregirKm:false };

  var cuerpo = el('div');
  var dibujar = function(){
    cuerpo.innerHTML = '';
    if(!estado.filas){
      var zona = el('div',{cls:'soltar'},'<b>Soltá acá el archivo</b>CSV, TSV o Excel (.xlsx). También podés hacer clic y elegirlo.');
      var inp = el('input',{type:'file', accept:'.csv,.txt,.tsv,.xlsx,.xlsm,.xls', style:'display:none'});
      inp.addEventListener('change', function(e){ if(e.target.files[0]) cargar(e.target.files[0]); });
      zona.addEventListener('click', function(){ inp.click(); });
      zona.addEventListener('dragover', function(e){ e.preventDefault(); });
      zona.addEventListener('drop', function(e){ e.preventDefault(); if(e.dataTransfer.files[0]) cargar(e.dataTransfer.files[0]); });
      cuerpo.appendChild(zona); cuerpo.appendChild(inp);
      cuerpo.appendChild(el('div',{cls:'mini',style:'margin-top:12px'},
        'La primera fila tiene que ser la de los títulos. Reconozco los nombres de los reportes que ya usás (dominio, kilometraje, nro doc, fecha fin vigencia…). El separador lo detecto solo: punto y coma, coma o tabulación.'));
      return;
    }
    /* mapeo */
    var m = el('div',{cls:'mapeo'});
    m.innerHTML = '<b style="color:var(--t2)">Columnas reconocidas:</b><br>';
    estado.mapa.forEach(function(x, i){
      var c = cols.filter(function(c){ return c.clave===x.destino; })[0];
      var sp = el('span', x.destino?{}:{cls:'no'});
      sp.innerHTML = esc(x.origen||'(sin título)') + ' → ' + (c ? esc(c.titulo) : 'se ignora');
      sp.style.cursor='pointer';
      sp.addEventListener('click', function(){
        var opts = cols.map(function(c){ return c.clave; });
        var elegido = prompt('¿A qué columna va "'+x.origen+'"?\n\n'+opts.join(', ')+'\n\n(vacío = ignorar)', x.destino||'');
        if(elegido!==null){ estado.mapa[i].destino = elegido.trim(); recalcular(); }
      });
      m.appendChild(sp);
    });
    cuerpo.appendChild(m);

    estado.avisos.forEach(function(a){ cuerpo.appendChild(el('div',{cls:a.nivel==='mal'?'err':'aviso'}, a.txt)); });

    if(estado.corregirKm){
      cuerpo.appendChild(el('button',{cls:'btn chico', style:'margin-bottom:10px', onclick:function(){
        estado.listas.forEach(function(r){ if(r._kmChico) { r[r._kmCampo] = num(r[r._kmCampo])*1000; r._kmChico=false; } });
        recalcular(true); }},'Corregir los kilómetros (×1000)'));
    }

    var op = el('div',{style:'display:flex;gap:14px;align-items:center;margin:10px 0;flex-wrap:wrap'});
    if(clave){
      var chk = el('input',{type:'checkbox', style:'width:auto'}); chk.checked = estado.actualizar;
      chk.addEventListener('change', function(e){ estado.actualizar=e.target.checked; recalcular(); });
      var lab = el('label',{style:'display:flex;gap:7px;align-items:center;text-transform:none;font-size:12.5px;color:var(--t2)'});
      lab.appendChild(chk); lab.appendChild(document.createTextNode('Actualizar los que ya existen (por '+clave+') en vez de duplicarlos'));
      op.appendChild(lab);
    }
    cuerpo.appendChild(op);

    var nuevos = estado.listas.filter(function(r){ return !r._existe; }).length;
    var actual = estado.listas.length - nuevos;
    cuerpo.appendChild(el('div',{cls:'mini',style:'margin-bottom:8px'},
      '<b style="color:var(--t1)">'+estado.listas.length+' filas leídas</b> · '+nuevos+' nuevas'+(clave?' · '+actual+' ya existen':'')));

    var usadas = estado.mapa.filter(function(x){ return x.destino; }).map(function(x){ return x.destino; });
    var vista = estado.listas.slice(0,8);
    cuerpo.appendChild(tabla(vista, usadas.slice(0,8).map(function(k){
      var c = cols.filter(function(c){ return c.clave===k; })[0];
      return [k, c?c.titulo:k, (c&&c.fmt!=='t')?'n':'t'];
    })));
  };

  var recalcular = function(sinRevalidar){
    var enc = estado.filas[0];
    if(!sinRevalidar) estado.mapa = estado.mapa || mapearEncabezados(hoja, enc);
    var listas = [], avisos = [], corregir = false;
    var existentes = {};
    if(clave) T(hoja).forEach(function(r){ existentes[normTexto(r[clave])] = r; });

    for(var i=1;i<estado.filas.length;i++){
      var f = estado.filas[i], o = {};
      estado.mapa.forEach(function(x, k){
        if(!x.destino) return;
        var c = cols.filter(function(c){ return c.clave===x.destino; })[0];
        var v = f[k];
        o[x.destino] = (c && c.fmt!=='t') ? num(v) : String(v===undefined?'':v).trim();
      });
      if(!Object.keys(o).length) continue;
      if(!Object.keys(o).some(function(k){ return String(o[k]).trim()!==''; })) continue;
      /* si la hoja apunta por vehiculo_id, lo resolvemos desde la patente o el interno */
      if(cols.some(function(c){ return c.clave==='vehiculo_id'; })){
        var vv = unidadDe({ patente:o.Patente||o.patente||o.dominio, interno:o.Unidad||o.interno, vehiculo_id:o.vehiculo_id });
        if(vv){ o.vehiculo_id = vv.id; if(cols.some(function(c){ return c.clave==='Unidad'; })) o.Unidad = vv.vehiculo;
                if(cols.some(function(c){ return c.clave==='Patente'; })) o.Patente = vv.patente;
                if(!o.empresa_id && cols.some(function(c){ return c.clave==='empresa_id'; })) o.empresa_id = vv.empresa_id; }
        else if(o.Patente||o.patente) avisos.push({nivel:'al', txt:'La fila '+(i+1)+' trae la patente '+esc(o.Patente||o.patente)+' y esa unidad no está dada de alta. Se carga igual, pero conviene crearla en Vehículos.'});
      }
      if(cols.some(function(c){ return c.clave==='conductor_id'; }) && (o.DNI || o.dni)){
        var cc = IX.condDni[String(o.DNI||o.dni)];
        if(cc){ o.conductor_id = cc.id; if(cols.some(function(x){ return x.clave==='Conductor'; })) o.Conductor = cc.nombre; }
      }
      if(clave && o[clave]!==undefined){
        var ya = existentes[normTexto(o[clave])];
        if(ya){ o._existe = true; o.id = ya.id; }
      }
      /* control de odómetro: el clásico 446.000 que entra como 446 */
      ['odometro','km','km_carga','kmFinal','kmsFinales','kmManual'].forEach(function(campo){
        if(o[campo]===undefined || !num(o[campo])) return;
        var interno = o.vehiculo || o.interno || (o.patente ? String((IX.vehPat[normTexto(o.patente)]||{}).vehiculo||'') : '');
        var kmv = interno ? kmActual(interno) : 0;
        if(kmv && num(o[campo]) * 500 < kmv){ o._kmChico = true; o._kmCampo = campo; corregir = true; }
        if(kmv && num(o[campo]) > kmv * 50) avisos.push({nivel:'al', txt:'La fila '+(i+1)+' trae un kilometraje enorme ('+miles(o[campo])+'). Revisá que la columna no esté corrida.'});
      });
      listas.push(o);
    }
    if(corregir) avisos.unshift({ nivel:'mal', txt:'Hay kilometrajes que dan mil veces más chicos que el odómetro de la unidad. Suele ser el punto de miles leído como decimal ("446.000" entrando como 446). Corregilos antes de importar.' });
    if(!estado.mapa.some(function(x){ return x.destino; })) avisos.push({nivel:'mal', txt:'No reconocí ninguna columna. Hacé clic en un título para asignarlo a mano.'});
    estado.listas = listas; estado.avisos = avisos; estado.corregirKm = corregir;
    dibujar();
  };

  var cargar = function(file){
    leerArchivo(file, function(filas){
      if(filas.length<2){ alert('El archivo no tiene filas debajo del encabezado.'); return; }
      estado.filas = filas; estado.mapa = mapearEncabezados(hoja, filas[0]);
      recalcular(true);
    }, function(err){ alert(err); });
  };

  dibujar();
  var confirmar = el('button',{cls:'btn pri', onclick:function(){
    if(!estado.listas || !estado.listas.length){ alert('Todavía no cargaste el archivo.'); return; }
    if(estado.corregirKm && !confirm('Hay kilometrajes que parecen divididos por mil. ¿Importar igual?')) return;
    var n = 0;
    estado.listas.forEach(function(r){
      var o = {};
      Object.keys(r).forEach(function(k){ if(k.indexOf('_')!==0) o[k]=r[k]; });
      if(r._existe && estado.actualizar){
        var ya = (T(hoja).filter(function(x){ return String(x.id)===String(r.id); })[0]) || {};
        Object.keys(ya).forEach(function(k){ if(o[k]===undefined || o[k]==='') o[k]=ya[k]; });
      } else if(r._existe && !estado.actualizar){ return; }
      else { o.id = idNuevo(); if(opciones.base) Object.keys(opciones.base).forEach(function(k){ if(!o[k]) o[k]=opciones.base[k]; }); }
      guardarFila(hoja, o); n++;
    });
    guardar([hoja], function(){ alert('Se importaron '+n+' filas a '+hoja+'.'); });
    cerrarModal();
  }},'Importar');
  modal('Carga masiva · '+hoja, cuerpo, [confirmar], 'ancho');
}

/* ------------------------- logo de la empresa ------------------------ */
function logoDe(codigo){ try{ return JSON.parse(localStorage.getItem('GF_LOGOS')||'{}')[codigo]||''; }catch(e){ return ''; } }
function guardarLogo(codigo, dato){
  var datos = {}; try{ datos = JSON.parse(localStorage.getItem('GF_LOGOS')||'{}'); }catch(x){}
  if(dato) datos[codigo] = dato; else delete datos[codigo];
  try{ localStorage.setItem('GF_LOGOS', JSON.stringify(datos)); }
  catch(x){ alert('El logo es muy pesado para el navegador. Probá con una imagen más chica.'); return false; }
  return true;
}
function borrarLogo(codigo){ guardarLogo(codigo, ''); pintar(); }
function subirLogo(codigo, cb){
  var inp = el('input',{type:'file', accept:'image/*', style:'display:none'});
  inp.addEventListener('change', function(e){
    var f = e.target.files[0]; if(!f) return;
    var r = new FileReader();
    r.onerror = function(){ alert('No se pudo leer el archivo.'); };
    r.onload = function(ev){
      var img = new Image();
      /* un SVG sin medidas propias da ancho 0: ahí guardamos el archivo tal cual */
      img.onerror = function(){ if(guardarLogo(codigo, ev.target.result)){ cb && cb(); pintar(); } };
      img.onload = function(){
        var an = img.naturalWidth || img.width, al = img.naturalHeight || img.height;
        if(!an || !al){ if(guardarLogo(codigo, ev.target.result)){ cb && cb(); pintar(); } return; }
        var c = document.createElement('canvas');
        var esc2 = Math.min(1, 320/an);
        c.width = Math.round(an*esc2); c.height = Math.round(al*esc2);
        c.getContext('2d').drawImage(img,0,0,c.width,c.height);
        if(guardarLogo(codigo, c.toDataURL('image/png'))){ cb && cb(); pintar(); }
      };
      img.src = ev.target.result;
    };
    r.readAsDataURL(f);
  });
  document.body.appendChild(inp); inp.click(); setTimeout(function(){ inp.remove(); }, 60000);
}

/* ---------------------- foto de la pantalla de entrada ---------------- */
function subirFondo(){
  var inp = el('input',{type:'file', accept:'image/*', style:'display:none'});
  inp.addEventListener('change', function(e){
    var f = e.target.files[0]; if(!f) return;
    var r = new FileReader();
    r.onerror = function(){ alert('No se pudo leer el archivo.'); };
    r.onload = function(ev){
      var img = new Image();
      img.onerror = function(){ alert('Ese archivo no es una imagen que el navegador pueda mostrar.'); };
      img.onload = function(){
        var an = img.naturalWidth || img.width, al = img.naturalHeight || img.height;
        var c = document.createElement('canvas');
        var esc2 = Math.min(1, 1600/an);
        c.width = Math.round(an*esc2); c.height = Math.round(al*esc2);
        c.getContext('2d').drawImage(img,0,0,c.width,c.height);
        var dato = c.toDataURL('image/jpeg', 0.82);
        try{ localStorage.setItem('GF_PORTADA_FONDO', dato); pintar(); }
        catch(x){ alert('La foto es muy pesada para el navegador. Probá con una más chica.'); }
      };
      img.src = ev.target.result;
    };
    r.readAsDataURL(f);
  });
  document.body.appendChild(inp); inp.click(); setTimeout(function(){ inp.remove(); }, 60000);
}

/* ============================== ARRANQUE ============================== */
function arrancar(){
  var c = localStorage.getItem(LS.cache);
  if(c){ try{ var j=JSON.parse(c); S.db=j.db||{}; S.version=j.version||1; S.planilla=j.planilla||''; }catch(e){} }
  S.empresa = localStorage.getItem(LS.emp) || '*';
  S.periodo = localStorage.getItem('GF_PERIODO') || '3';
  indexar();
  pintar();
  if(S.api){
    traer(function(){
      var u = localStorage.getItem(LS.ses);
      if(u) T('Usuarios').forEach(function(x){ if(x.usuario===u && x.activo!=='No') S.usuario=x; });
      pintar();
    });
    pedirEsquema();
  }
}
