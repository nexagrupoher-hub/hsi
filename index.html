function guardarUsuario(i){
  var nom=val("f_unombre").trim(), pin=val("f_upin").trim();
  if(!nom) return aviso("Falta el nombre");
  if(!/^[0-9]{4,6}$/.test(pin)) return aviso("El PIN tiene que ser de 4 a 6 dígitos");
  var dup=operadores().filter(function(x){ return String(x.pin)===pin && x.id!=i; })[0];
  if(dup) return aviso("Ese PIN ya lo usa "+dup.nombre+". Dos personas con el mismo PIN rompen la trazabilidad.");
  var perm=[]; ACCIONES.forEach(function(a){
    var c=document.getElementById("f_up_"+a.k); if(c&&c.checked) perm.push(a.k); });
  var cargo=[]; DB.bases.forEach(function(b){ var c=document.getElementById("f_ub_"+b.id);
    if(c&&c.checked) cargo.push(String(b.id)); });
  var o={nombre:nom,rol:val("f_urol"),pin:pin,baseId:val("f_ubase2"),basesACargo:cargo,
    activo:val("f_uactivo")==="1",permisos:perm};
  if(!DB.operadores) DB.operadores=[];
  if(i){ var e=operador(i); for(var k in o) e[k]=o[k]; }
  else { o.id=id(); o.intentos=0; o.ultimoAcceso=""; DB.operadores.push(o); }
  guardar(); cerrar(); render(); aviso("Usuario guardado");
}

function importarJSON(inp){
  var f=inp.files[0]; if(!f) return;
  var r=new FileReader();
  r.onload=function(){ try{ var d=JSON.parse(r.result);
    if(!d.empresas) throw new Error("El archivo no tiene el formato esperado");
    DB=d; guardar(); render(); aviso("Datos restaurados");
  }catch(e){ aviso("No se pudo leer: "+e.message); } };
  r.readAsText(f);
}

    if(c) return vConteo(c); SUB.conteo=null; }

  var h='<h2>Inventario</h2><p class="sub">Conteo cíclico <b>a ciegas</b>: se cuenta una estantería por vez, sin ver lo que dice el sistema. '+
    'Las diferencias se ven recién al cerrar, y cada una se explica antes de ajustar.</p>'+
    '<div class="barra"><button class="btn" onclick="mNuevoConteo()">+ Nuevo conteo</button><div class="sp"></div></div>';

  if(!lista.length) return h+'<div class="vacio card"><h3>Sin conteos</h3>'+
    '<p style="max-width:560px;margin:8px auto 0">Elegí una empresa y una base, y armá un conteo por estantería. '+
    'El sistema imprime la hoja en blanco para ir al pañol, y después cargás lo que contaste.</p></div>';

  /* exactitud: el indicador que dice si el resto de los números del sistema son creíbles */
  var cerrados=lista.filter(function(c){return c.estado==="Cerrado";});

    });});
    h+='<div class="grid g3">'+
      kpi("Exactitud de inventario", tot? Math.round(ok/tot*100)+"%" : "—",

  }

  h+='<div class="card scroll"><table><thead><tr><th>N°</th><th>Fecha</th><th>Empresa / base</th><th>Alcance</th>'+

    '<th>Estado</th><th></th></tr></thead><tbody>';
  lista.forEach(function(c){
    var cont=c.items.filter(function(it){return it.contado!=null;}).length;
    var dif=c.items.filter(function(it){return it.contado!=null && n(it.contado)!==n(it.sistema);}).length;
    h+='<tr><td class="mono"><b>'+esc(c.numero)+'</b></td><td class="mono mini">'+esc(c.fecha)+'</td>'+
      '<td>'+chipEmp(c.empresaId)+'<div class="mini">'+esc(nomBase(c.baseId))+'</div></td>'+
      '<td>'+esc(c.alcanceTxt||"todo")+'</td>'+
      '<td class="num">'+c.items.length+'</td>'+
      '<td class="num">'+cont+'</td>'+
      '<td class="num">'+(c.estado==="Cerrado"? (dif? alerta(dif,"al") : '<span class="pill ok">0</span>')
        : '<span class="mini">se ve al cerrar</span>')+'</td>'+
      '<td><span class="pill '+(c.estado==="Cerrado"?"ok":"al")+'">'+esc(c.estado)+'</span></td>'+
      '<td><button class="btn sec mini" onclick="SUB.conteo=\''+c.id+'\';render()">Abrir</button></td></tr>';
  });
  return h+'</tbody></table></div>';
}

function crearConteo(){
  var e=val("f_cemp"), b=val("f_cbase"), alc=val("f_calc"), fil=val("f_cfiltro").trim().toUpperCase();
  if(!e||!b) return aviso("Faltan empresa o base");
  var filas=filasStock(e,b), sel=[], txt="todo el pañol";
  filas.forEach(function(f){
    if(alc==="ubic"){ if(!fil || (f.ubicacion||"").toUpperCase().indexOf(fil)!==0) return; }
    if(alc==="fam"){ if(!fil || (f.art.familia||"").toUpperCase().indexOf(fil)!==0) return; }
    if(alc==="crit"){ if((f.art.criticidad||"C")!=="A") return; }
    sel.push(f);
  });
  if(alc==="ubic") txt="estantería "+fil;
  if(alc==="fam") txt="familia "+fil;
  if(alc==="crit") txt="críticos (A)";
  if(!sel.length) return aviso("No hay artículos que cumplan ese criterio en esa base");
  DB.seq.in++;
  var c={id:id(),numero:"IN-"+DB.seq.in,fecha:hoy(),empresaId:e,baseId:b,
    alcance:alc,filtro:fil,alcanceTxt:txt,estado:"Abierto",
    abrePor:quienOpera(),quienCuenta:val("f_cquien").trim(),cierraPor:"",fechaCierre:"",
    items:sel.map(function(f){ return {articuloId:f.art.id, ubicacion:f.ubicacion,
      sistema:f.stock, costo:f.costo, contado:null, motivo:""}; })};
  if(!DB.conteos) DB.conteos=[];
  DB.conteos.push(c);
  guardar(); cerrar(); SUB.conteo=c.id; VISTA="inventario"; render();
  aviso(c.numero+" abierto · "+c.items.length+" renglones");
}

function cerrarConteo(cId){
  if(!permitido("cont_cerrar", function(){cerrarConteo(cId);})) return;
  var c=(DB.conteos||[]).filter(function(x){return x.id==cId;})[0]; if(!c) return;
  var sinContar=c.items.filter(function(it){return it.contado==null;}).length;
  if(sinContar && !confirm("Quedan "+sinContar+" renglones sin contar. Se van a ignorar (no generan ajuste). ¿Cerrar igual?")) return;
  /* el ajuste se calcula contra el stock DE AHORA, no contra la foto del momento de abrir:
     entre medio pudo haber salido un vale legítimo */
  var conDif=[];
  c.items.forEach(function(it){
    if(it.contado==null) return;
    it.sistema = stock(it.articuloId, c.empresaId, c.baseId);
    if(n(it.contado)!==n(it.sistema)) conDif.push(it);
  });
  if(!conDif.length){
    c.estado="Cerrado"; c.cierraPor=quienOpera()||"—"; c.fechaCierre=hoy();
    guardar(); render(); aviso("Cerrado sin diferencias · exactitud 100%");
    return;
  }
  mMotivosConteo(c, conDif);
}

function confirmarCierre(cId){
  var c=(DB.conteos||[]).filter(function(x){return x.id==cId;})[0]; if(!c) return;
  var conDif=TMP.conDif||[];

/* ============================ TRASLADOS ============================
   Un traslado NO es instantáneo: la mercadería sale de una base y queda EN TRÁNSITO
   hasta que alguien la recibe del otro lado. Mientras viaja no está en ningún stock,
   que es exactamente lo que pasa en la realidad. Si el destino es otra empresa,
   además genera recupero: el stock lo puso una y lo usa la otra.
   ==================================================================== */
var TMP = {items:[]};

function vTraslados(){
  var lista=DB.traslados.filter(function(t){ return !EMP || t.origenEmpresaId==EMP || t.destinoEmpresaId==EMP; })
    .slice().sort(function(a,b){ return (b.fechaSalida+b.numero).localeCompare(a.fechaSalida+a.numero); });
  var transito=lista.filter(function(t){ return t.estado==="En tránsito"; });
  var h='<h2>Traslados</h2><p class="sub">Mercadería que se manda de una base a otra, o que una empresa le presta a otra. '+
    'Mientras viaja queda <b>en tránsito</b>: ya no está en el stock que la mandó, pero todavía no está en el que la espera.</p>'+
    '<div class="barra"><button class="btn" onclick="mTraslado()">+ Nuevo traslado</button><div class="sp"></div>'+
    (transito.length? alerta(transito.length+" EN TRÁNSITO","al"):'<span class="pill ok">nada en tránsito</span>')+'</div>';

  if(transito.length){
    h+='<div class="nota al"><b>Hay mercadería viajando.</b> Un traslado que queda en tránsito para siempre es stock perdido: '+
      'lo despacharon y nadie lo dio por recibido. Revisá los que tengan varios días.</div>';
  }
  if(!lista.length) return h+'<div class="vacio card"><h3>Sin traslados</h3>'+
    '<p>Antes de comprar conviene mirar si el repuesto ya está en otra base. Cuando lo esté, se manda desde acá.</p></div>';

  h+='<div class="card scroll"><table><thead><tr><th>N°</th><th>Guía</th><th>Desde</th><th>Hacia</th><th>Qué va</th>'+
    '<th class="num">Valor</th><th>Estado</th><th></th></tr></thead><tbody>';
  lista.forEach(function(t){
    var pil = t.estado==="En tránsito"?"al":t.estado==="Recibido con diferencia"?"mal":"ok";
    var v=t.items.reduce(function(s,it){ return s+n(it.cantidad)*n(it.costoUnit); },0);
    h+='<tr><td class="mono"><b>'+esc(t.numero)+'</b><div class="mini">'+esc(t.fechaSalida)+'</div></td>'+
      '<td class="mono mini">'+esc(t.guia||"—")+'</td>'+

      '<td>'+chipEmp(t.destinoEmpresaId)+'<div class="mini">'+esc(nomBase(t.destinoBaseId))+'</div>'+
        (t.origenEmpresaId!=t.destinoEmpresaId?'<span class="pill al">préstamo</span>':'')+'</td>'+
      '<td>'+t.items.map(function(it){ var a=art(it.articuloId);
        return '<div>'+miles(it.cantidad)+' × '+esc(a?a.descripcion:"?")+
          (it.recibida!=null && n(it.recibida)!=n(it.cantidad)? ' <span class="pill mal">llegaron '+miles(it.recibida)+'</span>'+
            (it.motivoDif? '<div class="mini" style="color:var(--mal)">'+esc(it.motivoDif)+'</div>':'') :'')+
        '</div>'; }).join("")+'</td>'+
      '<td class="num">'+pesos(v)+'</td>'+
      '<td><span class="pill '+pil+'">'+esc(t.estado)+'</span>'+
        (t.fechaLlegada?'<div class="mini">llegó '+esc(t.fechaLlegada)+'</div>':'')+
        (t.obsRecepcion?'<div class="mini" style="color:var(--mal)">'+esc(t.obsRecepcion)+'</div>':'')+'</td>'+
      '<td>'+(t.estado==="En tránsito"? '<button class="btn ok mini" onclick="mRecibirTraslado(\''+t.id+'\')">Recibir</button>':'')+'</td></tr>';
  });
  return h+'</tbody></table></div>';
}

function guardarTraslado(){
  leerItemsTraslado();
  var oe=val("f_toemp"), ob=val("f_tobase"), de=val("f_tdemp"), db=val("f_tdbase");
  if(!oe||!ob||!de||!db) return aviso("Faltan origen o destino");
  if(oe===de && ob===db) return aviso("El origen y el destino son el mismo depósito");
  var items=TMP.items.filter(function(it){ return it.articuloId && n(it.cantidad)>0; });
  if(!items.length) return aviso("Cargá al menos un renglón");
  for(var i=0;i<items.length;i++){
    var d=stock(items[i].articuloId,oe,ob);
    if(n(items[i].cantidad)>d && !confirm("De "+art(items[i].articuloId).descripcion+" hay "+miles(d)+
      " en la base de origen y estás mandando "+miles(items[i].cantidad)+". ¿Despachar igual?")) return;
  }
  DB.seq.tr++;
  var num="TR-"+DB.seq.tr, f=val("f_tsalida")||hoy();
  items.forEach(function(it){ it.costoUnit=costoUlt(it.articuloId); it.recibida=null; it.motivoDif=""; });
  DB.traslados.push({id:id(),numero:num,guia:val("f_tguia").trim(),
    origenEmpresaId:oe,origenBaseId:ob,destinoEmpresaId:de,destinoBaseId:db,
    items:items,estado:"En tránsito",fechaSalida:f,fechaLlegada:"",
    envia:val("f_tenvia").trim(),recibe:"",obsRecepcion:""});
  /* la salida se registra AHORA: el stock deja de estar en la base de origen */
  items.forEach(function(it,k){
    DB.movimientos.push({id:id()+k,fecha:f,tipo:"traslado",articuloId:it.articuloId,empresaId:oe,baseId:ob,
      cantidad:-Math.abs(n(it.cantidad)),costoUnit:it.costoUnit,doc:num+" → "+nomBase(db),
      destinoTipo:"",unidadId:"",centro:"",ot:""});
  });
  guardar(); cerrar(); VISTA="traslados"; render(); aviso(num+" despachado · en tránsito");
}

function selMotivoTraslado(idSel){
  return '<select id="'+idSel+'"><option value="">— sin diferencia —</option>'+
    ["Faltante en el viaje","Rotura en el traslado","Se cargó de más en origen",
     "Quedó en origen","Diferencia de conteo"].map(function(m){ return '<option>'+m+'</option>'; }).join("")+'</select>';
}
function guardarRecepcionTraslado(i){
  var t=DB.traslados.filter(function(x){return x.id==i;})[0]; if(!t) return;
  var f=val("f_rtfecha")||hoy(), dif=false, u=val("f_rtubic").trim().toUpperCase();
  t.items.forEach(function(it,k){
    var rec=n(val("rt_cant_"+k)), mot=val("rt_mot_"+k);
    it.recibida=rec; it.motivoDif=mot;
    if(rec!=n(it.cantidad)) dif=true;
    if(rec>0){
      if(u) setUbic(it.articuloId,t.destinoEmpresaId,t.destinoBaseId,u);
      DB.movimientos.push({id:id()+k,fecha:f,tipo:"traslado",articuloId:it.articuloId,
        empresaId:t.destinoEmpresaId,baseId:t.destinoBaseId,cantidad:Math.abs(rec),costoUnit:it.costoUnit,
        doc:t.numero+" ← "+nomBase(t.origenBaseId),destinoTipo:"",unidadId:"",centro:"",ot:"",
        prestamo:(t.origenEmpresaId!=t.destinoEmpresaId),
        recuperoDe:(t.origenEmpresaId!=t.destinoEmpresaId? t.origenEmpresaId:"")});
    }
    /* lo que salió y no llegó queda como faltante en tránsito, con motivo: nunca se borra el despacho */
    var falta=n(it.cantidad)-rec;
    if(falta>0){
      DB.movimientos.push({id:id()+100+k,fecha:f,tipo:"ajuste",articuloId:it.articuloId,
        empresaId:t.origenEmpresaId,baseId:t.origenBaseId,cantidad:0,costoUnit:it.costoUnit,
        doc:t.numero+" · faltante en tránsito: "+(mot||"sin motivo")+" ("+miles(falta)+")",
        destinoTipo:"",unidadId:"",centro:"",ot:""});
    }
  });
  t.estado = dif? "Recibido con diferencia":"Recibido";
  t.fechaLlegada=f; t.recibe=val("f_rtrecibe").trim();
  t.obsRecepcion = dif? "Diferencias registradas al recibir":"";
  guardar(); cerrar(); render();
  aviso(dif? "Recibido CON DIFERENCIA · quedó registrada":"Recibido sin diferencias");
}

/* ====================== RECEPCIÓN DE MERCADERÍA ======================
   Dos pasos separados a propósito: LLEGÓ no es lo mismo que SIRVE.
   Se cuenta contra el remito, se compara el precio contra lo pactado,
   y lo que no pasa se rechaza con motivo y se va a devolución.
   ==================================================================== */
var MOTIVOS_RECHAZO = ["Llegó de menos","Llegó de más","Precio distinto al pactado","Rota o dañada",
  "Otra marca / no es la pedida","No es el artículo pedido","Fuera de especificación",
  "Vencida o fuera de vida útil","Sin documentación / sin certificado","Mal embalada"];

function vRecepcion(){
  var recs=DB.recepciones.filter(function(r){ return !EMP || r.empresaId==EMP; })
    .slice().sort(function(a,b){ return (b.fecha+b.numero).localeCompare(a.fecha+a.numero); });
  var devs=DB.devoluciones.filter(function(d){ return !EMP || d.empresaId==EMP; })
    .slice().sort(function(a,b){ return (b.fecha+b.numero).localeCompare(a.fecha+a.numero); });
  var abiertas=devs.filter(function(d){ return d.estado!=="Cerrada"; });

  var h='<h2>Recepción de mercadería</h2><p class="sub">Se recibe contra el remito y contra lo que se había pedido. '+
    'Lo que no coincide en cantidad, en precio, en marca o en estado no entra al stock: se rechaza y se devuelve.</p>'+
    '<div class="barra"><button class="btn ok" onclick="mRecepcion()">+ Recibir mercadería</button><div class="sp"></div>'+
    (abiertas.length? alerta(abiertas.length+" DEVOLUCIONES ABIERTAS"):'')+'</div>';

  h+='<div class="tabs2"><button class="'+(SUB.rec!=="dev"?"on":"")+'" onclick="SUB.rec=\'rec\';render()">Recepciones</button>'+
    '<button class="'+(SUB.rec==="dev"?"on":"")+'" onclick="SUB.rec=\'dev\';render()">Devoluciones al proveedor'+
    (abiertas.length?" ("+abiertas.length+")":"")+'</button></div>';

  if(SUB.rec==="dev"){
    if(!devs.length) return h+'<div class="vacio card"><h3>Sin devoluciones</h3>'+
      '<p>Cuando rechaces algo en una recepción, la devolución aparece acá y no se cierra hasta que el proveedor la resuelva.</p></div>';
    h+='<div class="nota">Una devolución no termina cuando el proveedor se lleva la pieza: termina cuando llega la <b>nota de crédito</b> '+
      'o el repuesto de reemplazo. Hasta entonces es plata de ustedes en la calle.</div>';
    h+='<div class="card scroll"><table><thead><tr><th>N°</th><th>Fecha</th><th>Proveedor</th><th>Artículo</th>'+
      '<th class="num">Cant.</th><th>Motivo</th><th class="num">Valor</th><th>Estado</th><th></th></tr></thead><tbody>';
    devs.forEach(function(d){
      var a=art(d.articuloId);
      var pil=d.estado==="Cerrada"?"ok":d.estado==="Pendiente de retiro"?"mal":"al";
      h+='<tr><td class="mono"><b>'+esc(d.numero)+'</b></td><td class="mono mini">'+esc(d.fecha)+'</td>'+
        '<td>'+esc(d.proveedor||"—")+'<div class="mini">'+esc(d.recepcionNumero||"")+'</div></td>'+
        '<td>'+esc(a?a.descripcion:"?")+'</td><td class="num">'+miles(d.cantidad)+'</td>'+
        '<td><span class="pill mal">'+esc(d.motivo)+'</span>'+(d.detalle?'<div class="mini">'+esc(d.detalle)+'</div>':'')+'</td>'+
        '<td class="num">'+pesos(n(d.cantidad)*n(d.costoUnit))+'</td>'+
        '<td><span class="pill '+pil+'">'+esc(d.estado)+'</span>'+
          (d.cierre?'<div class="mini">'+esc(d.cierre)+'</div>':'')+'</td>'+
        '<td>'+(d.estado!=="Cerrada"? '<button class="btn sec mini" onclick="mCerrarDev(\''+d.id+'\')">Resolver</button>':'')+'</td></tr>';
    });
    return h+'</tbody></table></div>';
  }

  if(!recs.length) return h+'<div class="vacio card"><h3>Sin recepciones</h3>'+
    '<p>Cuando llegue mercadería, cargala acá: el stock nace en la recepción, no en la orden de compra.</p></div>';

  h+='<div class="card scroll"><table><thead><tr><th>N°</th><th>Fecha</th><th>Proveedor</th><th>Remito / Factura</th>'+
    '<th>Empresa / base</th><th>Renglones</th><th class="num">Aceptado</th><th>Estado</th></tr></thead><tbody>';
  recs.forEach(function(r){
    var pil=r.estado==="Aceptada"?"ok":"mal";
    var acep=r.items.reduce(function(t,it){ return t+n(it.aceptada)*n(it.precioReal); },0);
    h+='<tr><td class="mono"><b>'+esc(r.numero)+'</b></td><td class="mono mini">'+esc(r.fecha)+'</td>'+
      '<td>'+esc(r.proveedor||"—")+'</td>'+
      '<td class="mini mono">'+esc(r.remito||"—")+(r.factura?'<br>'+esc(r.factura):'')+'</td>'+
      '<td>'+chipEmp(r.empresaId)+'<div class="mini">'+esc(nomBase(r.baseId))+'</div></td>'+
      '<td>'+r.items.map(function(it){ var a=art(it.articuloId);
        var mal = n(it.rechazada)>0 || n(it.recibida)!=n(it.pedida) || (n(it.precioOC)>0 && n(it.precioReal)!=n(it.precioOC));
        return '<div>'+miles(it.aceptada)+' × '+esc(a?a.descripcion:"?")+
          (mal? ' <span class="pill mal">'+esc(it.motivo||"diferencia")+'</span>':'')+'</div>'; }).join("")+'</td>'+
      '<td class="num">'+pesos(acep)+'</td>'+
      '<td><span class="pill '+pil+'">'+esc(r.estado)+'</span>'+
        (r.quienRecibe?'<div class="mini">'+esc(r.quienRecibe)+'</div>':'')+'</td></tr>';
  });
  return h+'</tbody></table></div>';
}

/* ---- SALDOS ----
   La solicitud se descarga cuando se emite la orden. La ORDEN se descarga cuando llega la mercadería.
   Son dos saldos distintos y hay que poder ver los dos. */
function pendienteItemSol(it){ return Math.max(0, n(it.cantidad) - n(it.ordenadaAcum)); }
function pendienteSol(s){ return s.items.reduce(function(t,it){ return t+pendienteItemSol(it); },0); }
function pendienteItem(it){ return Math.max(0, n(it.cantidad) - n(it.recibidaAcum)); }
function pendienteOC(o){ return o.items.reduce(function(t,it){ return t+pendienteItem(it); },0); }
function ordenesConSaldo(empresaId){
  return DB.ordenes.filter(function(o){
    if(empresaId && o.empresaId!=empresaId) return false;
    if(o.estado==="Anulada") return false;
    return pendienteOC(o)>0;
  });
}
function ordenesDeSol(solId){ return DB.ordenes.filter(function(o){ return o.solicitudId==solId; }); }
function mRecepcion(ocId){
  var o = ocId? DB.ordenes.filter(function(x){return x.id==ocId;})[0] : null;
  var e = o? o.empresaId : (EMP||(DB.empresas[0]||{}).id);
  TMP={oc:o, items:[]};
  abrir('<h3>Recepción de mercadería</h3>'+
  '<p class="mini" style="margin:0 0 14px">La recepción se hace <b>contra una orden de compra</b>: lo que entra descuenta del saldo pendiente '+
  'de esa orden. Lo que se acepta va al stock; lo que se rechaza genera devolución.</p>'+
  '<div class="campo"><label>Orden de compra que se está recibiendo</label>'+
    '<select id="f_rsol" onchange="cambioSolRec()"></select>'+
    '<div class="mini" id="infoSol" style="margin-top:6px"></div></div>'+

    '<div class="campo"><label>Empresa que recibe</label>'+selectEmpresas("f_remp",e)+'</div>'+

  llenarSolRec(o);

function llenarSolRec(o){
  var sel=document.getElementById("f_rsol"); if(!sel) return;

  sel.innerHTML=lista.map(function(x){
    return '<option value="'+x.id+'"'+(o&&o.id==x.id?" selected":"")+'>'+esc(x.numero)+' · '+esc(x.proveedor||"sin proveedor")+
      ' · '+esc(nomEmp(x.empresaId))+' · pendiente '+miles(pendienteOC(x))+'</option>'; }).join("")+

  if(!lista.length) sel.value="";

/* al elegir la orden, los renglones se traen de ella con el saldo pendiente ya cargado */
function cambioSolRec(inicial){
  var idOC=val("f_rsol");
  var o = idOC? DB.ordenes.filter(function(x){return x.id==idOC;})[0] : null;
  TMP.oc=o;
  var info=document.getElementById("infoSol");
  if(o){
    TMP.items=o.items.filter(function(it){ return pendienteItem(it)>0; }).map(function(it){
      return {articuloId:it.articuloId, pedida:n(it.cantidad), yaRecibida:n(it.recibidaAcum),
        pendiente:pendienteItem(it), recibida:pendienteItem(it), rechazada:0, motivo:"",
        precioOC:n(it.precio), precioReal:n(it.precio)}; });
    if(info) info.innerHTML='<span style="color:var(--ok)">✓ '+esc(o.numero)+' · '+esc(o.proveedor||"")+
      (o.solicitudNumero? ' · nace de '+esc(o.solicitudNumero):'')+
      (o.fechaComprometida? ' · entrega comprometida '+esc(o.fechaComprometida):'')+
      ' · pendiente de recibir: <b>'+miles(pendienteOC(o))+'</b></span>';
    var emp=document.getElementById("f_remp"); if(emp){ emp.value=o.empresaId; ligarBases("f_remp","f_rbase", o.baseId); }
    var prov=document.getElementById("f_rprov"); if(prov && o.proveedor) prov.value=o.proveedor;
  } else {
    if(!inicial || !TMP.items.length) TMP.items=[{articuloId:"",pedida:0,yaRecibida:0,pendiente:0,
      recibida:1,rechazada:0,motivo:"",precioOC:0,precioReal:0}];
    if(info) info.innerHTML='<span style="color:var(--alerta)">⚠ Recepción sin orden de compra: entra al stock pero no descuenta de ninguna orden. '+
      'Queda marcada como excepción — es la vía por donde se cuela lo que nadie autorizó.</span>';
  }
  pintarItemsRec();
}

  TMP.items.forEach(function(it,k){

function pintarResumenRec(){
  var d=document.getElementById("resumenRec"); if(!d) return;

  TMP.items.forEach(function(it){
    if(!it.articuloId) return;
    var a=art(it.articuloId), nom=a?a.descripcion:"?";
    if(it.pedida>0 && n(it.recibida)<n(it.pendiente))
      alertas.push('<b>'+esc(nom)+'</b>: quedan pendientes '+miles(n(it.pendiente)-n(it.recibida))+
        ' — la orden queda abierta por ese saldo');
    if(it.pedida>0 && n(it.recibida)>n(it.pendiente))
      alertas.push('<b>'+esc(nom)+'</b>: llegaron '+miles(it.recibida)+' y solo quedaban '+miles(it.pendiente)+
        ' pendientes de la orden');
    if(n(it.precioOC)>0 && n(it.precioReal)!=n(it.precioOC)){
      var df=n(it.precioReal)-n(it.precioOC);
      alertas.push('<b>'+esc(nom)+'</b>: precio pactado '+pesos(it.precioOC)+' y el remito dice '+pesos(it.precioReal)+
        ' ('+(df>0?"+":"")+pesos(df)+' por unidad)');
    }
    if(n(it.rechazada)>0 && !it.motivo)
      alertas.push('<b>'+esc(nom)+'</b>: hay '+miles(it.rechazada)+' rechazadas sin motivo cargado');
    if(n(it.rechazada)>n(it.recibida))
      alertas.push('<b>'+esc(nom)+'</b>: no se puede rechazar más de lo que llegó');

function guardarRecepcion(){
  leerItemsRec();
  var e=val("f_remp"), b=val("f_rbase");
  if(!e||!b) return aviso("Faltan empresa o base");
  var items=TMP.items.filter(function(it){ return it.articuloId && (n(it.recibida)>0 || n(it.rechazada)>0); });
  if(!items.length) return aviso("Cargá al menos un renglón");
  for(var i=0;i<items.length;i++){
    if(n(items[i].rechazada)>n(items[i].recibida)) return aviso("No se puede rechazar más de lo que llegó");
    if(n(items[i].rechazada)>0 && !items[i].motivo) return aviso("Falta el motivo del rechazo");
  }
  var f=val("f_rfecha")||hoy(), u=val("f_rubic").trim().toUpperCase(), prov=val("f_rprov").trim();
  DB.seq.re++; var num="RE-"+DB.seq.re, hayRechazo=false;
  items.forEach(function(it,k){
    it.aceptada = Math.max(0, n(it.recibida)-n(it.rechazada));
    if(it.aceptada>0){
      if(u) setUbic(it.articuloId,e,b,u);
      DB.movimientos.push({id:id()+k,fecha:f,tipo:"ingreso",articuloId:it.articuloId,empresaId:e,baseId:b,
        cantidad:it.aceptada,costoUnit:n(it.precioReal)||n(it.precioOC),
        doc:num+(prov?" · "+prov:"")+(val("f_rremito")?" · rem "+val("f_rremito"):""),
        destinoTipo:"",unidadId:"",centro:"",ot:"",ubicacion:u});
    }
    if(n(it.rechazada)>0){
      hayRechazo=true; DB.seq.dv++;
      DB.devoluciones.push({id:id()+200+k,numero:"DV-"+DB.seq.dv,fecha:f,empresaId:e,baseId:b,
        proveedor:prov,recepcionNumero:num,articuloId:it.articuloId,cantidad:n(it.rechazada),
        costoUnit:n(it.precioReal)||n(it.precioOC),motivo:it.motivo,detalle:"",
        estado:"Pendiente de retiro",cierre:""});
    }
  });
  var ocNum="";
  /* descuenta de la ORDEN DE COMPRA: solo lo ACEPTADO baja el saldo pendiente */
  if(TMP.oc){
    var o=DB.ordenes.filter(function(x){return x.id==TMP.oc.id;})[0];
    if(o){
      ocNum=o.numero;
      items.forEach(function(it){
        var ren=o.items.filter(function(x){ return x.articuloId==it.articuloId; })[0];
        if(ren) ren.recibidaAcum = n(ren.recibidaAcum) + n(it.aceptada);
      });
      o.estado = pendienteOC(o)>0 ? "Recibida parcial" : "Recibida";
      o.recepciones = (o.recepciones||[]).concat([num]);
      /* si todas las órdenes de la solicitud quedaron completas, la solicitud se cierra */
      if(o.solicitudId){
        var s=DB.solicitudes.filter(function(x){return x.id==o.solicitudId;})[0];
        if(s){
          var abiertas=ordenesDeSol(s.id).filter(function(x){ return x.estado!=="Recibida" && x.estado!=="Anulada"; });
          s.estado = (!abiertas.length && pendienteSol(s)<=0) ? "Recibida" : "Con orden";
        }
      }
    }
  }
  DB.recepciones.push({id:id(),numero:num,fecha:f,empresaId:e,baseId:b,proveedor:prov,
    remito:val("f_rremito").trim(),factura:val("f_rfactura").trim(),
    ordenId:TMP.oc?TMP.oc.id:"",ordenNumero:ocNum,items:items,
    quienRecibe:val("f_rquien").trim(),estado:hayRechazo?"Con rechazo":"Aceptada"});
  guardar(); cerrar(); VISTA="recepcion"; SUB.rec=hayRechazo?"dev":"rec"; render();
  aviso(num+(ocNum? " · descontado de "+ocNum:" · SIN ORDEN")+(hayRechazo? " · quedó devolución":""));
}

function guardarDev(i){
  var d=DB.devoluciones.filter(function(x){return x.id==i;})[0]; if(!d) return;
  var est=val("f_dvest");
  d.detalle=val("f_dvdet").trim();
  if(est==="Repuesta por el proveedor"){
    DB.movimientos.push({id:id(),fecha:hoy(),tipo:"ingreso",articuloId:d.articuloId,empresaId:d.empresaId,
      baseId:d.baseId,cantidad:n(d.cantidad),costoUnit:n(d.costoUnit),
      doc:d.numero+" · reposición del proveedor",destinoTipo:"",unidadId:"",centro:"",ot:""});

    d.estado="Cerrada"; d.cierre=est;

  guardar(); cerrar(); render(); aviso("Devolución actualizada");
}

   ?v=<vista> abre en cualquiera de las del menú (stock, inventario, traslados…). */
function leerUrl(){
  var r = { modulo:"", vista:"" };
  /* si viene incrustado adentro de Gestión de Flota, el módulo lo manda el padre */
  try{
    if(window.__PANOL_VISTA){
      VISTA_FIJA = window.__PANOL_VISTA;
      r.vista = VISTA_FIJA;
      return r;
    }
    if(window.__PANOL_MODULO && MENU_MODULO[window.__PANOL_MODULO]){
      r.modulo = window.__PANOL_MODULO;
      r.vista  = (r.modulo === "compras") ? "solicitudes" : "stock";
      return r;
    }
  }catch(e){}
  try{
    var p = new URLSearchParams(location.search);
    var m = (p.get("m")||"").trim().toLowerCase();
    if(m==="almacén") m = "almacen";
    if(MENU_MODULO[m]){ r.modulo = m; r.vista = (m==="compras") ? "solicitudes" : "stock"; }
    var v = (p.get("v")||"").trim().toLowerCase();
    if(v && MENU.some(function(x){ return x[0]===v; })) r.vista = v;
  }catch(e){}
  return r;
}

/* La empresa la elige el selector de Gestión de Flota: acá se busca por nombre.
   Si no hay una que coincida, queda en "todo el grupo". */
function empresaDelPadre(){
  var idp = String(window.__GF_EMPRESA_ID||"").trim();
  if(idp){ var hay=""; DB.empresas.forEach(function(e){ if(String(e.id)===idp) hay=e.id; }); if(hay) return hay; }
  var n = String(window.__PANOL_EMPRESA||"").trim().toLowerCase();
  if(!n) return "";
  var r = "";
  DB.empresas.forEach(function(e){
    if(!r && String(e.nombre||"").trim().toLowerCase() === n) r = e.id;
  });
  if(!r) DB.empresas.forEach(function(e){          /* si no es igual, que empiece igual */
    if(!r && String(e.nombre||"").trim().toLowerCase().indexOf(n) === 0) r = e.id;
  });
  return r;
}

   Documentación → Vehículos). El padre las manda armadas y acá se pisan
   las del módulo, para que no haya dos listas que se contradigan.      */
function aplicarMaestros(){

  if(Array.isArray(M.bases))    DB.bases    = M.bases;
  if(Array.isArray(M.unidades)) DB.unidades = M.unidades;
  return true;
}

/* ------------------------------- conexión ---------------------------- */
function apiGet(params, cb, cbErr){
  if(!S.api) return cbErr && cbErr('Falta la dirección del script.');
  var p2 = { gf: params.accion || 'leer' };
  Object.keys(params).forEach(function(k){ if(k!=='accion') p2[k]=params[k]; });
  if(S.token && !p2.token) p2.token = S.token;   /* el conector con permisos lo pide */
  var q = Object.keys(p2).map(function(k){ return k+'='+encodeURIComponent(p2[k]); }).join('&');
  fetch(S.api+'?'+q).then(function(r){ return r.json(); })
    .then(function(j){ if(j && j.ok===false) return cbErr && cbErr(j.error||'La planilla devolvió un error.'); cb(j); })
    .catch(function(e){ cbErr && cbErr('No se pudo hablar con la planilla: '+e.message); });
}
function apiPost(cuerpo, cb, cbErr){
  if(!S.api) return cbErr && cbErr('Falta la dirección del script.');
  cuerpo.gf = cuerpo.accion || 'guardarTodo';   /* rama del sistema nuevo en el conector unificado */
  if(S.token) cuerpo.token = S.token;
  fetch(S.api, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(cuerpo) })
    .then(function(r){ return r.json(); })
    .then(function(j){ if(j && j.ok===false) return cbErr && cbErr(j.error||'No se pudo guardar.', j); cb(j); })
    .catch(function(e){ cbErr && cbErr('No se pudo guardar: '+e.message); });
}

/* El esquema (columnas de cada hoja) lo necesitan todos los formularios. Se pide al
   arrancar, pero si esa primera llamada falla (Apps Script arrancando en frío, red)
   se vuelve a pedir en cada Actualizar y en el momento de abrir un formulario. */
function pedirEsquema(cb){
  if(S.esqPidiendo) return;
  S.esqPidiendo = true;
  apiGet({accion:'esquema'}, function(j){
    S.esqPidiendo = false;
    if(j && j.esquema){ S.esq=j.esquema; S.listas=j.listas||S.listas; pintar(); cb && cb(true); }
    else cb && cb(false);
  }, function(err){ S.esqPidiendo = false; cb && cb(false, err); });
}

function traer(cb){
  S.cargando = true; S.error=''; pintar();
  if(!S.esq) pedirEsquema();
  apiGet({ accion:'leer' }, function(j){
    S.db = j.datos || {}; S.version = Number(j.version_datos||1); S.planilla = j.planilla||'';
    if(j.permisos) S.permServidor = j.permisos;
    if(j.clave_config!==undefined) S.claveConfigServidor = !!j.clave_config;   /* false = el .gs tiene GF_CLAVE_MIEMPRESA vacío: no pide */
    S.conectado = true; S.cargando = false; S.ultimo = new Date().toLocaleTimeString('es-AR');
    try{ localStorage.setItem(LS.cache, JSON.stringify({db:S.db, version:S.version, planilla:S.planilla, cuando:Date.now()})); }catch(e){}
    if(!S.empresa){ var e0 = T('Empresas')[0]; S.empresa = localStorage.getItem(LS.emp) || (e0?e0.codigo:''); }
    indexar(); S.cargando=false; pintar(); cb && cb();
  }, function(err){
    S.cargando = false; S.error = err;
    if(/sesi[oó]n vencida/i.test(String(err))){    /* el token se venció: de vuelta al login */
      S.token=''; S.usuario=null; S.permServidor=null;
      localStorage.removeItem(LS.tok); localStorage.removeItem(LS.ses);
    }
    var c = localStorage.getItem(LS.cache);
    if(c && !Object.keys(S.db).length){ try{ var j2=JSON.parse(c); S.db=j2.db; S.version=j2.version; S.planilla=j2.planilla; }catch(e){} }
    /* con el candado puesto no se puede leer nada sin entrar: pido solo la lista
       de usuarios (sin PIN) para poder dibujar el desplegable del login */
    if(!S.usuario && !(T('Usuarios')||[]).length){
      pedirUsuarios(S.clave);
      return;
    }
    pintar();
  });
}

/* La lista para el desplegable del login. Si alguna empresa tiene código de
   acceso, el conector no la entrega hasta que se escriba el código correcto. */
function pedirUsuarios(clave, cb){
  var p = {accion:'usuarios'}; if(clave) p.clave = clave;
  apiGet(p, function(j){
    S.exigeClave = !!(j && j.exige_clave);
    S.error='';   /* el "sesión vencida" de recién era solo que todavía no entró */
    if(j && j.usuarios && j.usuarios.length){ S.db.Usuarios = j.usuarios; }
    if(S.exigeClave){
      if(j.empresa){ S.clave = clave; S.empresaEntrada = j.empresa; localStorage.setItem(LS.clave, clave); }
      else { S.clave=''; S.empresaEntrada=null; localStorage.removeItem(LS.clave); }
    }
    pintar(); cb && cb(true);
  }, function(err){
    if(/c[oó]digo de acceso/i.test(String(err))){ S.exigeClave = true; S.clave=''; S.empresaEntrada=null; localStorage.removeItem(LS.clave); S.error = err; }
    pintar(); cb && cb(false);
  });
}

/* con el conector viejo (sin gf=usuarios) la clave se controla acá, contra la
   columna clave_acceso de Empresas, igual que pasa con el PIN */
function claveLocal(clave){
  var hit=null; T('Empresas').forEach(function(e){ if(e.activa!=='No' && String(e.clave_acceso||'').trim() && String(e.clave_acceso).trim()===String(clave||'').trim()) hit=e; });
  return hit ? { codigo:hit.codigo, nombre:hit.nombre } : null;
}
function exigeClaveLocal(){ return !S.exigeClave && T('Empresas').some(function(e){ return e.activa!=='No' && String(e.clave_acceso||'').trim(); }); }

/* Guarda solo las hojas tocadas. Si otro guardó en el medio, avisa y no pisa. */
function guardar(hojas, cb){
  (hojas||[]).forEach(function(h){ S.sucio[h]=true; });
  var pend = Object.keys(S.sucio);
  if(!pend.length) return cb && cb();
  var datos = {}; pend.forEach(function(h){ datos[h] = S.db[h]||[]; });
  S.guardando = true; pintar();
  apiPost({ accion:'guardarTodo', version:S.version, usuario:(S.usuario?S.usuario.nombre:''), datos:datos },
    function(j){ S.version = Number(j.version_datos||S.version+1); S.sucio={}; S.guardando=false; S.ultimo=new Date().toLocaleTimeString('es-AR');
      try{ localStorage.setItem(LS.cache, JSON.stringify({db:S.db, version:S.version, planilla:S.planilla, cuando:Date.now()})); }catch(e){}
      pintar(); cb && cb(); },
    function(err, j){ S.guardando=false;
      if(j && j.conflicto) S.error='Alguien más guardó en la planilla mientras trabajabas. Apretá Actualizar y volvé a cargarlo.';
      else S.error = err;
      pintar(); });
}

/* =====================================================================
   CAPA DE DATOS
   La planilla usa TUS nombres: en Vehiculos el interno es la columna
   "vehiculo" y el odómetro es "km"; las hojas hijas apuntan con
   vehiculo_id y traen Unidad/Patente al final. Acá se resuelve todo eso
   una sola vez y el resto de la app trabaja con el interno.
   ===================================================================== */
var IX = { vehId:{}, vehInt:{}, vehPat:{}, empId:{}, empCod:{}, condId:{}, condDni:{}, persLeg:{} };
function indexar(){
  IX = { vehId:{}, vehInt:{}, vehPat:{}, empId:{}, empCod:{}, condId:{}, condDni:{}, persLeg:{} };
  T('Vehiculos').forEach(function(v){
    if(v.id) IX.vehId[String(v.id)] = v;
    if(v.vehiculo) IX.vehInt[String(v.vehiculo).trim()] = v;
    if(v.patente) IX.vehPat[normTexto(v.patente)] = v;
  });
  T('Empresas').forEach(function(e){
    if(e.id) IX.empId[String(e.id)] = e;
    if(e.codigo) IX.empCod[String(e.codigo).trim().toUpperCase()] = e;
  });
  T('Conductores').forEach(function(c){ if(c.id) IX.condId[String(c.id)]=c; if(c.dni) IX.condDni[String(c.dni)]=c; });
  T('Personal').forEach(function(p){ if(p.legajo) IX.persLeg[String(p.legajo)]=p; });
}
function unidad(interno){ return IX.vehInt[String(interno||'').trim()] || null; }
/* de cualquier fila saca la unidad: por interno, por vehiculo_id o por patente */
function unidadDe(r){
  if(!r) return null;
  if(r.interno && IX.vehInt[String(r.interno).trim()]) return IX.vehInt[String(r.interno).trim()];
  if(r.Unidad && IX.vehInt[String(r.Unidad).trim()]) return IX.vehInt[String(r.Unidad).trim()];
  if(r.vehiculo_id && IX.vehId[String(r.vehiculo_id)]) return IX.vehId[String(r.vehiculo_id)];
  var pat = r.patente || r.dominio || r.Patente;
  if(pat && IX.vehPat[normTexto(pat)]) return IX.vehPat[normTexto(pat)];
  return null;
}
function internoDe(r){ var v = unidadDe(r); return v ? String(v.vehiculo) : String(r.interno || r.Unidad || ''); }
function empCod(r){
  if(!r) return '';
  if(r.empresa) return String(r.empresa).toUpperCase();
  if(r.empresa_id && IX.empId[String(r.empresa_id)]) return String(IX.empId[String(r.empresa_id)].codigo||'').toUpperCase();
  var v = unidadDe(r);
  if(v && v.empresa_id && IX.empId[String(v.empresa_id)]) return String(IX.empId[String(v.empresa_id)].codigo||'').toUpperCase();
  return '';
}
function empNombre(cod){ var e = IX.empCod[String(cod||'').toUpperCase()]; return e ? e.nombre : cod; }
function porEmpresa(filas){
  if(!S.empresa || S.empresa==='*') return filas;
  return filas.filter(function(f){ var c = empCod(f); return !c || c === S.empresa; });
}

/* ---------------------- kilómetros: una sola fuente ------------------ */
function lecturasDe(interno){
  var v = unidad(interno), l = [];
  T('Combustible').forEach(function(c){
    if(internoDe(c)!==String(interno)) return;
    if(num(c.km_carga)) l.push({ f:String(c.fecha), km:num(c.km_carga) });
  });
  T('Lecturas').forEach(function(c){ if(String(c.interno)===String(interno) && num(c.km)) l.push({f:String(c.fecha), km:num(c.km)}); });
  T('OT').forEach(function(c){ if(String(c.interno)===String(interno) && num(c.odometro)) l.push({f:String(c.fecha_apertura), km:num(c.odometro)}); });
  T('Partes').forEach(function(c){ if(internoDe(c)===String(interno) && num(c.kmFinal)) l.push({f:String(c.fecha), km:num(c.kmFinal)}); });
  T('Checks').forEach(function(c){ if(String(c.interno)===String(interno)){
    if(num(c.kmsFinales)) l.push({f:String(c.fecha), km:num(c.kmsFinales)});
    else if(num(c.kmsIniciales)) l.push({f:String(c.fecha), km:num(c.kmsIniciales)});
  }});
  if(v && num(v.km)) l.push({ f:'9999-12-31', km:num(v.km) });
  return l.sort(function(a,b){ return a.f<b.f?-1:1; });
}
function kmActual(interno){
  var k = 0;
  lecturasDe(interno).forEach(function(x){ k = Math.max(k, x.km); });
  return k;
}
function kmDelPeriodo(interno){
  var l = lecturasDe(interno).filter(function(x){ return x.f !== '9999-12-31'; });
  var d = desdePeriodo();
  var dentro = l.filter(function(x){ return x.f >= d; });
  if(!dentro.length) return 0;
  var antes = l.filter(function(x){ return x.f < d; });
  var base = antes.length ? antes[antes.length-1].km : dentro[0].km;
  return Math.max(0, dentro[dentro.length-1].km - base);
}
function consumoReal(interno){
  var cargas = [];
  T('Combustible').forEach(function(c){ if(internoDe(c)===String(interno) && num(c.litros) && num(c.km_carga)) cargas.push(c); });
  if(cargas.length<2) return 0;
  cargas.sort(function(a,b){ return String(a.fecha)<String(b.fecha)?-1:1; });
  var km = num(cargas[cargas.length-1].km_carga) - num(cargas[0].km_carga);
  var litros = 0;
  for(var i=1;i<cargas.length;i++) litros += num(cargas[i].litros);
  return (km>0 && litros>0) ? (litros*100/km) : 0;
}

/* --------------- plan de mantenimiento (PlanMant + PlanUnidades) ----- */
function jsonSeguro(v){ if(!v) return []; if(typeof v==='object') return v; try{ var x=JSON.parse(v); return x&&x.length?x:[]; }catch(e){ return []; } }
function planDe(interno){
  var pu = null;
  T('PlanUnidades').forEach(function(p){ if(String(p.interno).trim()===String(interno).trim()) pu=p; });
  if(!pu) return null;
  var pm = null;
  T('PlanMant').forEach(function(p){ if(String(p.id)===String(pu.planId)) pm=p; });
  return { unidad:pu, plan:pm, servicios:jsonSeguro(pm&&pm.servicios), ultimos:jsonSeguro(pu.ultimos) };
}
function proximoServicio(v){
  var interno = v.vehiculo || v.interno;
  var p = planDe(interno);
  if(!p || !p.servicios.length) return null;
  var km = kmActual(interno), mejor = null;
  p.servicios.forEach(function(sv){
    var inter = num(sv.km || sv.intervalo);
    if(!inter) return;
    var ult = 0;
    p.ultimos.forEach(function(u){ if(String(u.codigo)===String(sv.codigo)) ult = Math.max(ult, num(u.km)); });
    var proximo = ult ? ult + inter : Math.ceil((km||1)/inter)*inter;
    var falta = proximo - km;
    if(!mejor || falta < mejor.falta) mejor = { falta:falta, codigo:sv.codigo, desc:sv.descripcion||'', proximo:proximo, tol:num(sv.tolerancia)||1000 };
  });
  return mejor;
}

/* -------------------------- pañol (hojas nuevas) --------------------- */
function stockMapa(){
  var m = {};
  T('Movimientos').forEach(function(v){
    if(!v.articulo) return;
    var k = v.empresa+'|'+v.base+'|'+v.articulo;
    if(!m[k]) m[k] = { empresa:v.empresa, base:v.base, articulo:v.articulo, cant:0, costo:0, ult:'' };
    m[k].cant += num(v.cantidad);
    if(num(v.costo_unit)) m[k].costo = num(v.costo_unit);
    if(v.fecha > m[k].ult) m[k].ult = v.fecha;
  });
  return m;
}
function stockLista(){
  var m = stockMapa(), art = {}, par = {};
  T('Articulos').forEach(function(a){ art[a.codigo]=a; });
  T('StockParam').forEach(function(p){ par[p.articulo+'|'+p.empresa+'|'+p.base]=p; });
  return Object.keys(m).map(function(k){
    var r = m[k], a = art[r.articulo]||{}, p = par[r.articulo+'|'+r.empresa+'|'+r.base]||{};
    r.desc = a.descripcion||''; r.um = a.um||''; r.criticidad = a.criticidad||'';
    r.minimo = num(p.minimo); r.maximo = num(p.maximo); r.ubicacion = p.ubicacion||'';
    r.valor = r.cant * (r.costo || num(a.costo_referencia));
    r.bajo = r.minimo>0 && r.cant < r.minimo;
    return r;
  }).sort(function(a,b){ return (a.ubicacion||'zzz').localeCompare(b.ubicacion||'zzz'); });
}
function mesActual(){ var d=new Date(); return d.getFullYear()+'-'+p2(d.getMonth()+1); }
function desdePeriodo(){
  if(S.periodo==='todo') return '0000-00-00';
  var d = new Date();
  if(S.periodo==='mes') return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-01';
  d.setMonth(d.getMonth() - (S.periodo==='6' ? 5 : 2));
  return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-01';
}
function nombrePeriodo(){
  return S.periodo==='mes' ? 'este mes' : (S.periodo==='6' ? 'últimos 6 meses' : (S.periodo==='todo' ? 'todo el historial' : 'últimos 3 meses'));
}
function enPeriodo(f){ return String(f||'') >= desdePeriodo(); }

/* vencimientos: los de la hoja Documentacion y los que viven en Vehiculos */
function vencimientos(){
  var out = [], ya = {};
  T('Documentacion').forEach(function(d){
    if(!d.vencimiento) return;
    ya[normTexto(d.referencia)+'|'+normTexto(d.tipo)] = true;
    out.push({ ref:d.referencia, tipo:d.tipo, vence:String(d.vencimiento), origen:'Documentacion', fila:d });
  });
  T('Vehiculos').forEach(function(v){
    [['vencimientoVTV','VTV / RTO'],['vencimientoSeguro','Seguro'],['vencimientoOblea','Oblea GNC'],['vencimientoVTV2','VTV 2ª jurisdicción']].forEach(function(c){
      if(!v[c[0]]) return;
      if(ya[normTexto(v.vehiculo)+'|'+normTexto(c[1])]) return;   /* ya está en Documentacion */
      out.push({ ref:v.vehiculo, tipo:c[1], vence:String(v[c[0]]), origen:'Vehiculos', fila:v });
    });
  });
  T('Conductores').forEach(function(c){
    if(c.vencLicencia) out.push({ ref:c.nombre, tipo:'Licencia', vence:String(c.vencLicencia), origen:'Conductores', fila:c });
    if(c.vencPsicofisico) out.push({ ref:c.nombre, tipo:'Psicofísico', vence:String(c.vencPsicofisico), origen:'Conductores', fila:c });
  });
  return out.sort(function(a,b){ return a.vence<b.vence?-1:1; });
}

function alertasDelDia(){
  var a = [];
  var diasAviso = 30;
  T('Parametros').forEach(function(c){ if(c.clave==='dias_aviso_vencimiento') diasAviso = num(c.valor)||30; });

  porEmpresa(T('OT')).forEach(function(o){
    if(o.estado==='Espera repuesto') a.push({n:'ma', t:'O.T. '+o.numero+' esperando repuesto', d:'Interno '+o.interno+' · '+dias(o.fecha_apertura)+' días abierta', ir:'ot'});
    if(o.estado==='Espera autorización') a.push({n:'ma', t:'O.T. '+o.numero+' esperando autorización', d:'Interno '+o.interno, ir:'ot'});
  });
  porEmpresa(T('Solicitudes')).forEach(function(x){
    if(x.estado==='Esperando autorización') a.push({n:'ma', t:'Solicitud '+x.numero+' sin autorizar',
      d:(num(x.horas_espera)?num(x.horas_espera)+' horas de espera · ':'')+pesos(x.monto_estimado)+(x.interno?' · interno '+x.interno:''), ir:'solicitudes'});
  });
  T('Ordenes').forEach(function(o){
    if((o.estado==='Emitida'||o.estado==='Recibida parcial') && o.entrega_comprometida && o.entrega_comprometida < hoy())
      a.push({n:'al', t:'Orden '+o.numero+' vencida', d:'Prometida para el '+fecha(o.entrega_comprometida)+' · '+o.proveedor, ir:'ordenes'});
  });
  vencimientos().forEach(function(v){

/* ====================== PERMISOS POR USUARIO =========================
   Manda la hoja Permisos de la planilla, NO este archivo.
   Columnas: tipo | quien | modulo | ver | cargar | borrar | autorizar
     tipo   : "Rol" o "Usuario". Lo de Usuario pisa lo del Rol.
     quien  : el nombre del rol, el usuario, o * para todos.
     modulo : el id del módulo, o * para todos.
     ver/cargar/borrar/autorizar : Sí, No, o vacío (vacío = no lo toco, hereda).
   Reglas:
     - Si a una persona no la alcanza NINGUNA fila, ve todo (no rompe lo que ya andaba).
     - Apenas la alcanza una fila, arranca cerrada y solo se abre lo que digan las filas.
     - El rol Administrador siempre ve todo, para no quedarse afuera de esta misma pantalla.
   Esconder el menú es comodidad, no seguridad: el candado de verdad va en el .gs. */
var ACCIONES = ['ver','cargar','borrar','autorizar'];
function esSi(v){ var s=String(v==null?'':v).trim().toLowerCase(); return s==='si'||s==='sí'||s==='x'||s==='1'||s==='true'||s==='ok'; }
function esNo(v){ var s=String(v==null?'':v).trim().toLowerCase(); return s==='no'||s==='0'||s==='false'||s==='-'; }
function esAdmin(u){ return !!u && /administrador/i.test(String(u.rol||'')); }
function modulosNav(){
  var r=[]; NAV.forEach(function(n){
    if(n.t==='item') r.push({id:n.id, txt:n.txt, grupo:'General'});
    else if(n.t==='grupo') n.items.forEach(function(i){ r.push({id:i.id, txt:i.txt, grupo:n.txt}); });
  }); return r;
}
function calcularPermisos(u){
  var abierto = { abierto:true, def:{ver:true,cargar:true,borrar:true,autorizar:false}, mod:{} };
  if(!u || esAdmin(u)) return abierto;
  if(!T('Permisos').length) return abierto;   /* todavía nadie cargó una regla: queda como estaba */
  var rol = String(u.rol||'').trim().toLowerCase(), usr = String(u.usuario||'').trim().toLowerCase();
  var esUsuario = function(p){ return String(p.tipo||'').trim().toLowerCase().indexOf('usu')===0; };
  var mias = T('Permisos').filter(function(p){
    var q = String(p.quien||'').trim().toLowerCase();
    if(q==='*') return true;
    return esUsuario(p) ? q===usr : q===rol;
  });
  /* la hoja ya tiene reglas y a esta persona no la alcanza ninguna: no ve nada hasta que la habiliten */
  if(!mias.length) return { abierto:false, def:{ver:false,cargar:false,borrar:false,autorizar:false}, mod:{} };
  /* lo menos específico primero, así lo puntual pisa a lo general */
  var peso = function(p){
    var q = String(p.quien||'').trim().toLowerCase();
    var m = String(p.modulo||'*').trim();
    return (esUsuario(p) ? 4 : (q==='*' ? 0 : 2)) + (m==='*' ? 0 : 1);
  };
  var def = { ver:false, cargar:false, borrar:false, autorizar:false }, mod = {};
  var aplicar = function(p, o){ ACCIONES.forEach(function(a){ if(esSi(p[a])) o[a]=true; else if(esNo(p[a])) o[a]=false; }); };
  mias.slice().sort(function(a,b){ return peso(a)-peso(b); }).forEach(function(p){
    var m = String(p.modulo||'*').trim();
    if(m==='*'){ aplicar(p, def); Object.keys(mod).forEach(function(k){ aplicar(p, mod[k]); }); }
    else {
      if(!mod[m]) mod[m] = { ver:def.ver, cargar:def.cargar, borrar:def.borrar, autorizar:def.autorizar };
      aplicar(p, mod[m]);
    }
  });
  return { abierto:false, def:def, mod:mod };
}
/* si el conector ya manda los permisos resueltos, esos mandan */
function permisos(){ return S.permServidor || calcularPermisos(S.usuario); }
function puede(modulo, accion){
  accion = accion || 'ver';
  var p = permisos();
  if(p.abierto) return accion==='autorizar' ? /gerente|administrador/i.test(String(S.usuario&&S.usuario.rol||'')) : true;
  var m = p.mod[modulo] || p.def;
  return !!m[accion];
}
/* el menú ya filtrado: se caen los grupos vacíos y los títulos que quedaron colgando */
function navVisible(){
  var out = [];
  NAV.forEach(function(x){
    if(x.t==='item'){ if(puede(x.id,'ver')) out.push(x); }
    else if(x.t==='grupo'){
      var its = x.items.filter(function(i){ return puede(i.id,'ver'); });
      if(its.length) out.push({ t:'grupo', txt:x.txt, items:its });
    }
    else out.push(x);
  });
  return out.filter(function(x,i){
    if(x.t!=='sec') return true;
    var sig = out[i+1];
    return !!sig && sig.t!=='sec';
  });
}

/* del acento salen los tonos claros, para no tener que elegir 4 colores */
function tonos(){
  var hex = acento().replace('#','');
  if(hex.length!==6) return;
  var r=parseInt(hex.substr(0,2),16), g=parseInt(hex.substr(2,2),16), b=parseInt(hex.substr(4,2),16);
  var mez = function(p){ return 'rgb('+Math.round(r+(255-r)*p)+','+Math.round(g+(255-g)*p)+','+Math.round(b+(255-b)*p)+')'; };
  document.documentElement.style.setProperty('--acento-suave', mez(.92));
  document.documentElement.style.setProperty('--acento-borde', mez(.78));
}

/* tabla genérica: cols = [[clave, título, tipo]] tipo: t|n|$|chip|fecha */
function tabla(filas, cols, alClic, acciones){
  var w = el('div',{cls:'tabla-wrap'});
  if(!filas.length){ w.appendChild(el('div',{cls:'vacio'},'<b>Todavía no hay nada cargado</b>Cuando cargues el primer registro aparece acá.')); return w; }
  var t = el('table');

  cols.forEach(function(c){ tr.appendChild(el('th',{cls:(c[2]==='n'||c[2]==='$')?'n':''}, esc(c[1]))); });
  if(acciones && acciones.length) tr.appendChild(el('th',{cls:'n'},'Acciones'));
  thead.appendChild(tr); t.appendChild(thead);
  var tb = el('tbody');
  filas.forEach(function(f){
    var r = el('tr', alClic?{style:'cursor:pointer', onclick:function(){ alClic(f); }}:{});
    cols.forEach(function(c){
      var v = f[c[0]], h;
      if(c[2]==='$') h = pesos(v);
      else if(c[2]==='n') h = miles(v);
      else if(c[2]==='fecha') h = fecha(v);
      else if(c[2]==='chip') h = v ? '<span class="chip '+claseEstado(v)+'">'+esc(v)+'</span>' : '';
      else if(c[2]==='b') h = '<b>'+esc(v)+'</b>';
      else h = esc(v);
      r.appendChild(el('td',{cls:(c[2]==='n'||c[2]==='$')?'n':''}, h));
    });
    if(acciones && acciones.length){
      var td = el('td');
      var caja = el('div',{cls:'acc'});
      acciones.forEach(function(a){
        if(a.si && !a.si(f)) return;

        caja.appendChild(b);
      });
      td.appendChild(caja); r.appendChild(td);
    }
    tb.appendChild(r);
  });
  t.appendChild(tb); w.appendChild(t);
  return w;
}

function claseEstado(v){
  v = String(v);
  if(/Cerrad|Recibida$|Aceptada$|Vigente|Operativa|Activo|Sí|Conciliada|Pagada|Hecha|Apto$/.test(v)) return 'ok';
  if(/Espera|Esperando|En tránsito|parcial|Por vencer|Emitida|Abierta|En ejecución|Pendiente|Borrador|observación/.test(v)) return 'al';
  if(/Anulad|Rechazad|Vencido|Fuera de servicio|diferencia|Crítica|Siniestrada|Baja/.test(v)) return 'ma';
  if(/En taller|En curso|Alta/.test(v)) return 'in';
  return '';
}

function nada(){ return el('span',{style:'display:none'}); }
function btnMasiva(hoja, txt, base){
  if(!puede(S.vista,'cargar')) return nada();
  return el('button',{cls:'btn', onclick:function(){ importarMasivo(hoja, {base:base}); }}, ico(ICO.hoja)+' '+(txt||'Carga masiva'));
}
function btnNuevo(hoja, txt, base){
  if(!puede(S.vista,'cargar')) return nada();
  return el('button',{cls:'btn pri', onclick:function(){ formGenerico(hoja, base||null); }}, ico(ICO.mas)+' '+(txt||'Nuevo'));
}
function carta(m, contenido, titulo){
  var c = el('div',{cls:'card'});
  if(titulo) c.appendChild(el('h3',null, esc(titulo)));
  c.appendChild(contenido);
  m.appendChild(c);
  return c;
}
/* botones de la última columna: ver, editar y borrar, iguales en todas las tablas */
function accionesDe(hoja, opciones){
  opciones = opciones || {};
  var acc = [];
  if(opciones.ver) acc.push({ t:'Ver ficha', ic:'ojo', fn:opciones.ver });
  if(opciones.extra) opciones.extra.forEach(function(e){ acc.push(e); });
  if(puede(S.vista,'cargar')) acc.push({ t:'Editar', ic:'lapiz', cls:'ed', fn:function(f){ formGenerico(hoja, f, opciones.alTerminar); } });
  if(puede(S.vista,'borrar')) acc.push({ t:'Borrar', ic:'tacho', cls:'bo', fn:function(f){
    var quien = f.vehiculo || f.nombre || f.codigo || f.numero || f.fuego || f.descripcion || f.id;
    if(!confirm('¿Borrar "'+quien+'" de la hoja '+hoja+'?\n\nSe borra de la planilla y no se puede deshacer.')) return;
    borrarFila(hoja, f);
    guardar([hoja], opciones.alTerminar);
  }});
  return acc;
}

function ordenarPor(filas, campo){
  return filas.slice().sort(function(a,b){ return String(a[campo]||'')<String(b[campo]||'')?1:-1; });
}

function vistaProgramados(m){
  encabezado(m,'Programados','Planilla de viajes: origen, destino, interno y choferes',
    [btnMasiva('Programados'), btnNuevo('Programados','Nuevo viaje',{estado:'Programado', clase:'Turismo', empresa:(S.empresa!=='*'?S.empresa:'')})]);
  var vs = T('Programados').filter(function(v){ return enPeriodo(v.fechaInicio); });
  var locs = {}; T('Localidades').forEach(function(l){ locs[String(l.codigo).toUpperCase()] = l; });
  var rutas = {}; T('Rutas').forEach(function(r){ rutas[String(r.origen).toUpperCase()+'|'+String(r.destino).toUpperCase()] = num(r.km); });
  var kmDe = function(v){
    if(num(v.kmManual)) return num(v.kmManual);
    var k = rutas[String(v.origen).toUpperCase()+'|'+String(v.destino).toUpperCase()];
    if(!k) k = rutas[String(v.destino).toUpperCase()+'|'+String(v.origen).toUpperCase()];
    return num(k);
  };
  var sinKm = vs.filter(function(v){ return !kmDe(v); });
  var sinCoord = T('Localidades').filter(function(l){ return !num(l.lat) || !num(l.lng); });
  var g = el('div',{cls:'grid g4'});
  g.appendChild(kpi('Viajes', miles(vs.length), nombrePeriodo()));
  g.appendChild(kpi('Kilómetros', miles(vs.reduce(function(a,v){ return a+kmDe(v); },0)), 'según rutas cargadas'));
  g.appendChild(kpi('Sin km', miles(sinKm.length), 'falta la ruta o el km manual', sinKm.length>0));
  g.appendChild(kpi('Unidades en viaje', miles(Object.keys(vs.reduce(function(a,v){ if(v.interno) a[v.interno]=1; return a; },{})).length), 'internos distintos'));
  m.appendChild(g);
  if(sinCoord.length) m.appendChild(el('div',{cls:'aviso'},
    'Localidades sin coordenadas: '+sinCoord.map(function(l){ return esc(l.codigo||l.nombre); }).join(', ')+'. Sin lat/lng los kilómetros dan 0.'));

  var tab = S.sub || 'planilla';
  tabs(m,[['planilla','Planilla'],['unidades','Por unidad'],['locs','Localidades y rutas']], tab, function(v){ S.sub=v; pintar(); });
  if(tab==='planilla'){
    carta(m, tabla(vs.slice().sort(function(a,b){ return String(a.fechaInicio)<String(b.fechaInicio)?-1:1; }).map(function(v){
      var o=Object.create(v); o._km = kmDe(v); o._ruta = (v.origen||'')+' → '+(v.destino||''); return o; }),
      [['fechaInicio','Sale','fecha'],['fechaFin','Llega','fecha'],['hora','Hora'],['codigo','Código','b'],
       ['_ruta','Recorrido'],['interno','Interno'],['chofer1','Chofer 1'],['chofer2','Chofer 2'],
       ['contratante','Contratante'],['_km','Km','n'],['estado','Estado','chip']],
      function(f){ formGenerico('Programados', f); }, accionesDe('Programados')));
  } else if(tab==='unidades'){
    var porU = {};
    vs.forEach(function(v){ var k=v.interno||'(sin unidad)'; if(!porU[k]) porU[k]={interno:k, viajes:0, km:0, dias:0};
      porU[k].viajes++; porU[k].km += kmDe(v);
      var d = dias(v.fechaInicio, v.fechaFin||v.fechaInicio); porU[k].dias += (d>0?d:1); });
    carta(m, tabla(Object.keys(porU).map(function(k){ return porU[k]; }).sort(function(a,b){ return b.viajes-a.viajes; }),
      [['interno','Interno','b'],['viajes','Viajes','n'],['km','Kilómetros','n'],['dias','Días en viaje','n']],
      function(f){ if(unidad(f.interno)) fichaUnidad(f.interno); }), 'Ocupación por unidad · '+nombrePeriodo());

  }

/* PIN de la app del conductor. El PIN NUNCA baja al navegador: la planilla manda
   solo quién tiene PIN propio, y asignar / sacar va por gf=pin_conductor. */
function vistaPinesConductores(m){
  var conPin = {};
  T('PinesConductores').forEach(function(p){ conPin[String(p.dni||'').replace(/\D/g,'')] = true; });
  var filas = porEmpresa(T('Conductores')).map(function(c){
    var o = Object.create(c), d = String(c.dni||'').replace(/\D/g,'');
    o._dni = d;
    o._pin = conPin[d] ? 'PIN propio' : (d ? 'Últimos 4 del DNI ('+d.slice(-4)+')' : 'Sin DNI');
    o._app = conPin[d] ? 'Sí' : 'No';
    return o;
  });
  var mandar = function(c, pin){
    apiPost({accion:'pin_conductor', dni:c._dni, nombre:c.nombre||'', pin:pin}, function(){
      S.db.PinesConductores = (S.db.PinesConductores||[]).filter(function(p){ return String(p.dni||'').replace(/\D/g,'')!==c._dni; });
      if(pin) S.db.PinesConductores.push({dni:c._dni, nombre:c.nombre||'', tiene_pin:'Sí'});
      aviso(pin ? 'PIN asignado a '+(c.nombre||c._dni) : 'PIN sacado: entra con los últimos 4 del DNI');
      pintar();
    }, function(err){ alert(/desconocida/i.test(String(err)) ? 'La planilla tiene el conector viejo: hay que pegar el conector nuevo y publicar Versión NUEVA.' : err); });
  };
  var acc = [];
  if(puede(S.vista,'cargar')){
    acc.push({ t:'Asignar PIN', ic:'lapiz', cls:'ed', fn:function(c){
      if(!c._dni){ alert('Ese conductor no tiene DNI cargado. Cargáselo primero en Conductores.'); return; }

      p = String(p).trim();
      if(!/^\d{4,6}$/.test(p)){ alert('El PIN tiene que ser de 4 a 6 números.'); return; }
      mandar(c, p);
    }});
    acc.push({ t:'Sacar PIN', ic:'tacho', cls:'bo', fn:function(c){
      if(!conPin[c._dni]){ alert((c.nombre||c._dni)+' no tiene PIN propio: ya entra con los últimos 4 del DNI.'); return; }
      if(!confirm('¿Sacar el PIN propio de '+(c.nombre||c._dni)+'?\n\nVa a volver a entrar con los últimos 4 números de su DNI.')) return;
      mandar(c, '');
    }});
  }
  carta(m, tabla(filas, [['nombre','Conductor','b'],['_dni','DNI'],['_pin','PIN de la app'],['_app','PIN propio','chip']], null, acc));
  m.appendChild(el('div',{cls:'mini'},'Si un conductor no tiene PIN propio, entra a la app con los últimos 4 números de su DNI. '+
    'El PIN no se muestra nunca acá: si alguien lo olvidó, asignale uno nuevo. Los conductores se dan de alta en Conductores.'));
}

/* Dibujo del tren de ejes, visto desde arriba. Rueda simple = un bloque
   por lado; dual = dos bloques juntos, igual que la tabla de clasificación. */
function diagramaEjes(patron, ancho, resaltar){
  var partes = String(patron||'').split(/[-x\/, ]+/).map(function(x){ return num(x); }).filter(function(x){ return x>0; });
  if(!partes.length) return '';
  var w = ancho || 120, sep = 20;
  var h = partes.length * sep + 8;
  var cx = w/2, svg = '<svg viewBox="0 0 '+w+' '+h+'" width="'+w+'" height="'+h+'" style="display:block">';
  svg += '<line x1="'+cx+'" y1="6" x2="'+cx+'" y2="'+(h-6)+'" stroke="#c9cdd3" stroke-width="2"/>';
  partes.forEach(function(cant, i){
    var y = 10 + i*sep, mitad = Math.max(1, Math.round(cant/2));
    svg += '<line x1="14" y1="'+y+'" x2="'+(w-14)+'" y2="'+y+'" stroke="#9aa0a6" stroke-width="2"/>';
    for(var lado=0; lado<2; lado++){
      for(var k=0; k<mitad; k++){
        var xBase = lado===0 ? 6 + k*9 : w - 13 - k*9;
        var pinta = (resaltar && resaltar===i+1) ? 'var(--acento)' : '#3c4043';
        svg += '<rect x="'+xBase+'" y="'+(y-7)+'" width="7" height="14" rx="2" fill="'+pinta+'"/>';
      }
    }
  });
  svg += '</svg>';
  return svg;
}
function configPorCodigo(cod){ return CONFIG_EJES.filter(function(c){ return c.cod===String(cod); })[0] || null; }
function nombreConfig(valor){
  var c = configPorCodigo(valor);
  return c ? (c.cod+' · '+c.nombre) : (valor ? ('configuración '+valor) : '');
}
function patronDe(valor){
  var c = configPorCodigo(valor);
  return c ? c.patron : String(valor||'');
}
function totalRuedas(valor){
  return patronDe(valor).split(/[-x\/, ]+/).reduce(function(a,x){ return a+num(x); },0);
}

/* Selector: se elige el dibujo, no se escribe nada */
function selectorEjes(valor, alElegir){
  var caja = el('div');
  var elegido = String(valor||'');
  var cat = S.catEjes || CAT_EJES[0];
  var chips = el('div',{cls:'tabs',style:'margin:0 0 10px'});
  CAT_EJES.forEach(function(c){
    chips.appendChild(el('button',{cls:(cat===c?'on':''), onclick:function(){
      S.catEjes = c; caja.replaceWith(selectorEjes(elegido, alElegir));
    }}, esc(c)));
  });
  caja.appendChild(chips);

  var grilla = el('div',{style:'display:grid;grid-template-columns:repeat(auto-fill,minmax(146px,1fr));gap:8px;margin-bottom:12px'});
  CONFIG_EJES.filter(function(c){ return c.cat===cat; }).forEach(function(c){
    var sel = (elegido===c.cod);
    var tarj = el('div',{style:'border:1px solid '+(sel?'var(--acento)':'var(--linea)')+
      ';background:'+(sel?'var(--acento-suave)':'#fff')+
      ';border-radius:10px;padding:9px;cursor:pointer;text-align:center'});
    tarj.innerHTML = '<div style="font-size:11px;font-weight:800;letter-spacing:.5px;color:'+(sel?'var(--acento)':'var(--t3)')+'">'+esc(c.cod)+'</div>'+
      '<div style="display:flex;justify-content:center;margin:4px 0">'+diagramaEjes(c.patron, 92)+'</div>'+
      '<div style="font-size:11.5px;font-weight:700;line-height:1.2">'+esc(c.nombre)+'</div>'+
      '<div class="mini" style="font-size:10.5px">'+esc(c.patron)+' · '+totalRuedas(c.patron)+' neumáticos</div>'+
      '<div class="mini" style="font-size:10px;margin-top:2px">'+esc(c.para)+'</div>';
    tarj.addEventListener('click', function(){
      elegido = c.cod;
      alElegir(c.cod, c.patron.split('-').length);
      caja.replaceWith(selectorEjes(c.cod, alElegir));
    });
    grilla.appendChild(tarj);
  });
  caja.appendChild(grilla);
  var libre = el('input',{value: configPorCodigo(elegido) ? '' : elegido, placeholder:'configuración especial: 2-4-4-2'});
  libre.addEventListener('input', function(e){
    var p = e.target.value.trim();
    alElegir(p, p.split(/[-x\/, ]+/).filter(function(x){ return num(x)>0; }).length);
  });
  caja.appendChild(el('div',{cls:'mini',style:'margin-bottom:4px'},'¿Ninguna coincide? Escribí las ruedas por eje, de adelante hacia atrás:'));
  caja.appendChild(libre);
  return caja;
}

/* =====================================================================
   NEUMÁTICOS · el neumático es un individuo que vive en un depósito o
   montado en una posición. Montaje, rotación, controles y recapado.
   ===================================================================== */
function posicionesDe(v){
  if(!v) return [];
  var patron = patronDe(String(v.ruedas||'').trim());
  var ejes = num(v.ejes);
  if(!patron){
    if(!ejes) return [];
    patron = []; for(var i=0;i<ejes;i++) patron.push(i===0?2:4); patron = patron.join('-');
  }
  var partes = patron.split(/[-x\/, ]+/).filter(function(x){ return num(x)>0; }).map(function(x){ return num(x); });
  if(!partes.length) return [];
  var out = [], n = 0;
  partes.forEach(function(cant, i){
    var eje = i+1, mitad = cant/2;
    for(var lado=0; lado<2; lado++){
      for(var k=0; k<mitad; k++){
        n++;
        out.push({ n:String(n), eje:eje, lado: lado===0?'I':'D', dual: mitad>1,
          externa: (lado===0 ? k===0 : k===mitad-1),
          etiqueta: 'Eje '+eje+' · '+(lado===0?'izquierda':'derecha')+(mitad>1?(((lado===0?k===0:k===mitad-1))?' externa':' interna'):'') });
      }
    }
  });
  return out;
}
/* dónde está hoy cada cubierta, según el último movimiento */
function montajeActual(){
  var porFuego = {}, porPos = {};
  T('NeumaticosMovs').slice().sort(function(a,b){ return String(a.fecha)<String(b.fecha)?-1:1; }).forEach(function(mv){
    if(!mv.fuego) return;
    if(mv.accion==='Montaje'){
      porFuego[mv.fuego] = { interno:String(mv.interno), posicion:String(mv.posicion), fecha:mv.fecha, km:num(mv.km_vehiculo) };
    } else if(/Desmontaje|Baja|recapar|Recapado|Reparación/i.test(String(mv.accion))){
      delete porFuego[mv.fuego];
    }
  });
  Object.keys(porFuego).forEach(function(f){ porPos[porFuego[f].interno+'|'+porFuego[f].posicion] = f; });
  return { porFuego:porFuego, porPos:porPos };
}
function neumatico(fuego){ var r=null; T('Neumaticos').forEach(function(n){ if(String(n.fuego)===String(fuego)) r=n; }); return r; }
function profActual(n){ return num(n.profundidad_actual) || num(n.profundidad_inicial); }
function estadoDeDeposito(cod){
  var d = T('NeumDepositos').filter(function(x){ return String(x.codigo)===String(cod); })[0];
  if(!d) return 'En stock';
  if(d.tipo==='Recapado') return 'A recapar';
  if(d.tipo==='Scrap') return 'Scrap';
  if(d.tipo==='En tránsito') return 'En stock';
  return 'En stock';
}
function movNeum(o){
  o.id = idNuevo();
  if(!o.fecha) o.fecha = hoy();
  o.usuario = S.usuario ? S.usuario.nombre : '';
  guardarFila('NeumaticosMovs', o);
}

/* ---------------------------- acciones ------------------------------- */
function montarEn(fuego, posicion){
  var n = neumatico(fuego);
  if(!n){ alert('No encuentro la cubierta '+fuego+'.'); return; }
  var mont = montajeActual();
  var ocupa = mont.porPos[String(S.uniSel)+'|'+posicion];
  if(ocupa && ocupa!==fuego){ alert('La posición '+posicion+' ya tiene la cubierta '+ocupa+'. Sacala primero (arrastrala al espacio de transición).'); return; }
  var deDonde = mont.porFuego[fuego];
  var km = kmActual(S.uniSel);
  if(deDonde){
    /* venía montada en otro lado: es una rotación */
    cerrarMontaje(fuego, deDonde, 'Rotación programada', 'Rotación');
  }
  movNeum({ fuego:fuego, accion:'Montaje', interno:S.uniSel, posicion:posicion, km_vehiculo:km,
            km_neumatico:num(n.km_acumulados), profundidad_mm:profActual(n), presion_psi:num(n.presion_ref),
            motivo: deDonde?'Rotación programada':'', base:(unidad(S.uniSel)||{}).base||'' });
  n.estado = 'En uso'; n.deposito = '';
  guardarFila('Neumaticos', n);
  S.transito = (S.transito||[]).filter(function(x){ return x!==fuego; });
  S.selNeum = null;
  guardar(['NeumaticosMovs','Neumaticos']);
}
function sacarDeUnidad(fuego){
  var mont = montajeActual();
  var d = mont.porFuego[fuego];
  if(!d) return;
  cerrarMontaje(fuego, d, '', 'Desmontaje');
  S.transito = S.transito || [];
  if(S.transito.indexOf(fuego)<0) S.transito.push(fuego);
  guardar(['NeumaticosMovs','Neumaticos']);
}
/* escribe el desmontaje y le suma los km rodados a la cubierta */
function cerrarMontaje(fuego, montaje, motivo, accion){
  var n = neumatico(fuego); if(!n) return;
  var km = kmActual(montaje.interno);
  var rodados = Math.max(0, km - num(montaje.km));
  n.km_acumulados = num(n.km_acumulados) + rodados;
  n.estado = 'En stock';
  guardarFila('Neumaticos', n);
  movNeum({ fuego:fuego, accion:accion||'Desmontaje', interno:montaje.interno, posicion:montaje.posicion,
            km_vehiculo:km, km_neumatico:num(n.km_acumulados), profundidad_mm:profActual(n),
            motivo:motivo||'', base:(unidad(montaje.interno)||{}).base||'',
            obs:'Rodó '+miles(rodados)+' km en esta posición' });
}
function desmontarA(fuego, deposito){
  var n = neumatico(fuego); if(!n) return;
  var mont = montajeActual();
  var puesta = mont.porFuego[fuego];
  var cuerpo = el('div');
  var motivo = 'Desgaste normal', prof = profActual(n), dep = deposito;
  var f1 = el('div',{cls:'fila'});
  var sm = el('select'); ((S.listas||{}).motivo_neum||[]).forEach(function(x){ var o=el('option',{value:x},esc(x)); if(x===motivo)o.selected=true; sm.appendChild(o); });
  sm.addEventListener('change', function(e){ motivo=e.target.value; });
  f1.appendChild(el('div',{cls:'campo'},'<label>Motivo</label>').appendChild(sm).parentNode);
  var ip = el('input',{type:'number', step:'0.5', value:prof});
  ip.addEventListener('input', function(e){ prof=num(e.target.value); });
  f1.appendChild(el('div',{cls:'campo'},'<label>Profundidad al sacarla (mm)</label>').appendChild(ip).parentNode);
  var sd = el('select');
  T('NeumDepositos').forEach(function(d){ var o=el('option',{value:d.codigo}, esc(d.nombre+' · '+d.tipo)); if(d.codigo===dep) o.selected=true; sd.appendChild(o); });
  sd.addEventListener('change', function(e){ dep=e.target.value; });
  f1.appendChild(el('div',{cls:'campo'},'<label>¿A qué depósito va?</label>').appendChild(sd).parentNode);
  cuerpo.appendChild(f1);
  cuerpo.appendChild(el('div',{cls:'mini'}, puesta ? ('Está montada en el interno '+puesta.interno+', posición '+puesta.posicion+'.') : 'Está en el depósito, solo cambia de lugar.'));

  modal('Sacar la cubierta '+fuego, cuerpo, [el('button',{cls:'btn pri', onclick:function(){
    var n2 = neumatico(fuego);
    n2.profundidad_actual = prof;
    if(puesta) cerrarMontaje(fuego, puesta, motivo, 'Desmontaje');
    n2 = neumatico(fuego);
    n2.deposito = dep;
    n2.estado = estadoDeDeposito(dep);
    guardarFila('Neumaticos', n2);
    movNeum({ fuego:fuego, accion:'Movimiento de depósito', interno:'', posicion:'', motivo:motivo,
              profundidad_mm:prof, base:(T('NeumDepositos').filter(function(d){ return d.codigo===dep; })[0]||{}).base||'',
              obs:'Queda en '+dep });
    S.transito = (S.transito||[]).filter(function(x){ return x!==fuego; });
    guardar(['NeumaticosMovs','Neumaticos']);
    cerrarModal();
  }},'Confirmar')], 'angosto');
}

/* ----------------------------- 3) LISTADO ---------------------------- */
function neumListado(m){
  var mont = montajeActual();
  var ns = T('Neumaticos').map(function(n){
    var o = Object.create(n);
    var d = mont.porFuego[n.fuego];
    o._donde = d ? ('interno '+d.interno+' · pos '+d.posicion) : (n.deposito||'sin ubicar');
    o._mm = profActual(n);
    o._kmVida = num(n.km_acumulados);
    o._costoKm = o._kmVida ? Math.round(num(n.costo)/o._kmVida) : 0;
    return o;
  });
  var g = el('div',{cls:'grid g4'});
  g.appendChild(kpi('Cubiertas', miles(ns.length), 'en el sistema'));
  g.appendChild(kpi('Montadas', miles(Object.keys(mont.porFuego).length), 'rodando'));
  g.appendChild(kpi('Al límite', miles(ns.filter(function(n){ return n._mm>0 && n._mm<=4; }).length), '4 mm o menos', ns.filter(function(n){ return n._mm>0 && n._mm<=4; }).length>0));
  g.appendChild(kpi('Capital', pesos(ns.reduce(function(a,n){ return a+num(n.costo); },0)), 'valor de compra'));
  m.appendChild(g);
  carta(m, tabla(ns, [['fuego','Fuego','b'],['marca','Marca'],['medida','Medida'],['dibujo','Dibujo'],
    ['vida','Vida','n'],['_mm','mm','n'],['_kmVida','Km','n'],['_costoKm','$/km','$'],['_donde','Dónde está'],['estado','Estado','chip']],
    function(f){ fichaNeumatico(f.fuego); }));
  m.appendChild(el('div',{style:'display:flex;gap:8px'})
    .appendChild(btnMasiva('Neumaticos')).parentNode
    .appendChild(btnNuevo('Neumaticos','Nueva cubierta',{estado:'En stock', vida:1, fecha_alta:hoy(), tipo:'Nuevo'})).parentNode);
}

/* --------------------- 4) CARGAS Y CONTROLES ------------------------- */
function neumControles(m){
  var mont = montajeActual();
  encabezado(m,'','');
  var caja = el('div',{cls:'card'});
  caja.appendChild(el('h3',null,'Control de una unidad · milímetros y presión'));
  var vs = porEmpresa(T('Vehiculos'));
  S.uniSel = S.uniSel || (vs[0]?vs[0].vehiculo:'');
  var sel = el('select',{style:'max-width:280px'});
  vs.forEach(function(x){ var o=el('option',{value:x.vehiculo}, esc(x.vehiculo+' | '+(x.patente||''))); if(x.vehiculo===S.uniSel)o.selected=true; sel.appendChild(o); });
  sel.addEventListener('change', function(e){ S.uniSel=e.target.value; pintar(); });
  caja.appendChild(sel);
  var v = unidad(S.uniSel), pos = posicionesDe(v);
  var datos = {};
  var t = el('table',{style:'margin-top:12px'});
  t.innerHTML = '<thead><tr><th>Pos</th><th>Fuego</th><th class="n">Externa</th><th class="n">Centro</th><th class="n">Interna</th><th class="n">Presión</th></tr></thead>';
  var tb = el('tbody');
  pos.forEach(function(p){
    var f = mont.porPos[String(S.uniSel)+'|'+p.n];
    var tr = el('tr');
    tr.appendChild(el('td',null,'<b>'+esc(p.n)+'</b><br><span class="mini">'+esc(p.etiqueta)+'</span>'));
    tr.appendChild(el('td',null, f?esc(f):'<span class="mini">libre</span>'));
    ['ext','cen','int','psi'].forEach(function(k){
      var td = el('td',{cls:'n'});
      if(f){
        var i = el('input',{type:'number', step:'0.5', style:'text-align:right'});
        i.addEventListener('input', function(e){ datos[f] = datos[f]||{}; datos[f][k]=num(e.target.value); });
        td.appendChild(i);
      }
      tr.appendChild(td);
    });
    tb.appendChild(tr);
  });
  t.appendChild(tb);
  caja.appendChild(el('div',{cls:'tabla-wrap'}).appendChild(t).parentNode);
  caja.appendChild(el('button',{cls:'btn pri',style:'margin-top:10px', onclick:function(){
    var km = kmActual(S.uniSel), n = 0;
    Object.keys(datos).forEach(function(f){
      var d = datos[f];
      var mins = [d.ext,d.cen,d.int].filter(function(x){ return num(x)>0; });
      if(!mins.length && !num(d.psi)) return;
      var minimo = mins.length ? Math.min.apply(null, mins) : 0;
      var desgaste = 'Parejo';
      if(mins.length===3){
        if(d.ext < d.cen-1.5 && d.ext < d.int-1.5) desgaste='Hombro externo';
        else if(d.int < d.cen-1.5 && d.int < d.ext-1.5) desgaste='Hombro interno';
        else if(d.cen < d.ext-1.5 && d.cen < d.int-1.5) desgaste='Centro';
      }
      var p = mont.porFuego[f] || {};
      guardarFila('NeumControles', { id:idNuevo(), fecha:hoy(), fuego:f, interno:S.uniSel, posicion:p.posicion||'',
        prof_ext:d.ext||'', prof_cen:d.cen||'', prof_int:d.int||'', prof_min:minimo||'', presion_psi:d.psi||'',
        km_vehiculo:km, desgaste:desgaste, usuario:(S.usuario?S.usuario.nombre:''), obs:'' });
      if(minimo){ var nn = neumatico(f); if(nn){ nn.profundidad_actual = minimo; guardarFila('Neumaticos', nn); } }
      n++;
    });
    if(!n){ alert('Cargá al menos una medición.'); return; }
    guardar(['NeumControles','Neumaticos'], function(){ alert('Se guardaron '+n+' controles.'); });
  }},'Guardar el control'));
  m.appendChild(caja);

  carta(m, tabla(ordenarPor(T('NeumControles'),'fecha'),
    [['fecha','Fecha','fecha'],['fuego','Fuego','b'],['interno','Interno'],['posicion','Pos'],
     ['prof_min','mm mínimo','n'],['presion_psi','Presión','n'],['desgaste','Desgaste','chip'],['km_vehiculo','Km','n']],
    function(f){ formGenerico('NeumControles', f); }), 'Historial de controles');
}

function nuevaOrdenRecapado(){
  var pend = T('Neumaticos').filter(function(n){ return n.estado==='A recapar'; });
  if(!pend.length){ alert('No hay cubiertas marcadas como "A recapar". Desmontalas al depósito de recapado primero.'); return; }
  var prov='', marcadas={}, cuerpo = el('div');
  var sp = el('select'); sp.appendChild(el('option',{value:''},'— proveedor —'));
  T('Proveedores').filter(function(p){ return /neum/i.test(p.rubro||'') || true; }).forEach(function(p){ sp.appendChild(el('option',{value:p.codigo}, esc(p.codigo+' · '+p.razon_social))); });
  sp.addEventListener('change', function(e){ prov=e.target.value; });
  cuerpo.appendChild(el('div',{cls:'campo'},'<label>Proveedor de recapado</label>').appendChild(sp).parentNode);
  var t = el('table');
  t.innerHTML = '<thead><tr><th></th><th>Fuego</th><th>Marca</th><th>Medida</th><th class="n">Vida</th></tr></thead>';
  var tb = el('tbody');
  pend.forEach(function(n){
    var tr = el('tr');
    var chk = el('input',{type:'checkbox', style:'width:auto'}); chk.checked = true; marcadas[n.fuego]=true;
    chk.addEventListener('change', function(e){ marcadas[n.fuego]=e.target.checked; });
    tr.appendChild(el('td',null,'').appendChild(chk).parentNode);
    tr.appendChild(el('td',null,'<b>'+esc(n.fuego)+'</b>'));
    tr.appendChild(el('td',null, esc(n.marca||'')));
    tr.appendChild(el('td',null, esc(n.medida||'')));
    tr.appendChild(el('td',{cls:'n'}, num(n.vida)||1));
    tb.appendChild(tr);
  });
  t.appendChild(tb); cuerpo.appendChild(t);
  modal('Nueva orden de recapado', cuerpo, [el('button',{cls:'btn pri', onclick:function(){
    var fuegos = Object.keys(marcadas).filter(function(k){ return marcadas[k]; });
    if(!prov || !fuegos.length){ alert('Elegí proveedor y al menos una cubierta.'); return; }
    var max=0; T('NeumRecapado').forEach(function(o){ var mm=String(o.numero||'').match(/(\d+)$/); if(mm) max=Math.max(max,parseInt(mm[1],10)); });
    var nro='OR-'+('000000'+(max+1)).slice(-6);
    guardarFila('NeumRecapado', { id:idNuevo(), numero:nro, fecha:hoy(), proveedor:prov, estado:'Enviada',
      cantidad:fuegos.length, costo_total:0, fecha_envio:hoy(), fecha_retorno:'', remito:'',
      empresa:(S.empresa!=='*'?S.empresa:''), base:(S.usuario?S.usuario.base:''), obs:'' });
    fuegos.forEach(function(f){
      var n = neumatico(f);
      guardarFila('NeumRecapadoItems', { id:idNuevo(), orden:nro, fuego:f, banda:n.banda||'', costo:0,
        resultado:'', vida_nueva:num(n.vida)+1, obs:'' });
      n.estado = 'En recapado'; guardarFila('Neumaticos', n);
      movNeum({ fuego:f, accion:'A recapar', motivo:'', obs:'Orden '+nro+' · '+prov });
    });
    guardar(['NeumRecapado','NeumRecapadoItems','Neumaticos','NeumaticosMovs']);
    cerrarModal();
  }},'Crear la orden')], 'ancho');
}
function fichaRecapado(o){
  var items = T('NeumRecapadoItems').filter(function(i){ return i.orden===o.numero; });
  var cuerpo = el('div');
  cuerpo.appendChild(el('div',{cls:'card',style:'box-shadow:none;padding:0;margin-bottom:12px'},
    '<table><tbody>'+fila2('Proveedor', esc(o.proveedor))+fila2('Estado','<span class="chip '+claseEstado(o.estado)+'">'+esc(o.estado)+'</span>')+
    fila2('Enviada', fecha(o.fecha_envio))+fila2('Cubiertas', items.length)+'</tbody></table>'));
  cuerpo.appendChild(tabla(items, [['fuego','Fuego','b'],['banda','Banda'],['costo','Costo','$'],
    ['resultado','Resultado','chip'],['vida_nueva','Nueva vida','n']],
    function(f){ formGenerico('NeumRecapadoItems', f, function(){ fichaRecapado(o); }); }));
  var bots = [];
  if(o.estado!=='Recibida') bots.push(el('button',{cls:'btn pri', onclick:function(){
    items.forEach(function(it){
      var n = neumatico(it.fuego); if(!n) return;
      if(/Rechazada|Perdida/i.test(String(it.resultado||''))){ n.estado='Scrap'; n.deposito='SCRAP'; }
      else {
        n.estado='En stock'; n.deposito='STK-PNA'; n.vida = num(it.vida_nueva)||num(n.vida)+1;
        n.tipo='Recapado'; n.profundidad_actual = num(n.profundidad_inicial)||14; n.km_acumulados = 0;
        if(it.banda) n.dibujo = it.banda;
      }
      guardarFila('Neumaticos', n);
      movNeum({ fuego:it.fuego, accion:'Recapado', motivo:'', obs:'Volvió de la orden '+o.numero });
    });
    o.estado='Recibida'; o.fecha_retorno=hoy();
    o.costo_total = items.reduce(function(a,i){ return a+num(i.costo); },0);
    guardarFila('NeumRecapado', o);
    guardar(['NeumRecapado','Neumaticos','NeumaticosMovs']);
    cerrarModal();
  }},'Recibir la orden'));
  bots.push(el('button',{cls:'btn', onclick:function(){ formGenerico('NeumRecapado', o, function(){ fichaRecapado(o); }); }},'Editar'));
  modal('Orden de recapado '+o.numero, cuerpo, bots, 'ancho');
}
