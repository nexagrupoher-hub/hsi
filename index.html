<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gestión de Flota</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --acento:#2b3440;
  --acento-suave:#f6eaec;
  --acento-borde:#e6ccd1;
  --fondo:#f4f5f7;
  --tarjeta:#ffffff;
  --t1:#1f2328;
  --t2:#4a5057;
  --t3:#8a9099;
  --linea:#e7e9ec;
  --ok:#1e7a52; --ok-bg:#e9f4ee;
  --alerta:#8a5b00; --alerta-bg:#fbf2e0;
  --mal:#9b2c2c; --mal-bg:#fbecec;
  --info:#1a4f8a; --info-bg:#e9f0f8;
  --sombra:0 1px 2px rgba(16,24,40,.05), 0 4px 14px rgba(16,24,40,.05);
  --marca-txt:20px;   /* tamaño del nombre del sistema */
  --marca-logo:46px;  /* alto del logo o del cuadrado con las iniciales */
  --alto-top:74px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--fondo);color:var(--t1);font-family:Montserrat,-apple-system,Segoe UI,Roboto,sans-serif;font-size:13.5px;line-height:1.45}
button,input,select,textarea{font-family:inherit;font-size:13.5px;color:var(--t1)}
a{color:var(--acento);text-decoration:none}
.filo{height:3px;background:var(--acento)}
header.top{background:#fff;border-bottom:1px solid var(--linea);position:sticky;top:0;z-index:40}
.top-in{max-width:none;margin:0;padding:12px 22px 12px 14px;display:flex;align-items:center;gap:14px}
.marca{display:flex;align-items:center;gap:12px;width:248px;flex:none;padding-left:8px}
.marca .iso{width:var(--marca-logo);height:var(--marca-logo);border-radius:calc(var(--marca-logo)/4);background:var(--acento);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:calc(var(--marca-logo)*.4);flex:none}
.marca b{display:block;font-size:var(--marca-txt);font-weight:700;letter-spacing:-.2px;line-height:1.15}
.marca span{display:block;font-size:calc(var(--marca-txt)*.58);color:var(--t3);text-transform:uppercase;letter-spacing:.7px;margin-top:1px}
.top-sp{flex:1}
.top-tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.layout{display:flex;align-items:flex-start}
aside.side{width:248px;flex:none;background:#fff;border-right:1px solid var(--linea);min-height:calc(100vh - var(--alto-top));position:sticky;top:var(--alto-top);padding:14px 10px 40px;overflow:auto;max-height:calc(100vh - var(--alto-top))}
.side .sec{font-size:10px;text-transform:uppercase;letter-spacing:.9px;color:var(--t3);font-weight:700;padding:16px 12px 6px}
.side .grupo{font-size:13.5px;font-weight:700;color:var(--t1);padding:12px 12px 5px}
.side a{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:9px;color:var(--t2);cursor:pointer;font-size:13px;line-height:1.25}
.side a:hover{background:#f5f6f8;color:var(--t1)}
.side a.on{background:var(--acento-suave);color:var(--acento);font-weight:600}
.side a.on .ico{stroke:var(--acento)}
.side a .ico{stroke:var(--t3);flex:none}
.side a.falta{color:var(--t3)}
.side a .pend{margin-left:auto;font-size:9.5px;text-transform:uppercase;letter-spacing:.4px;background:#f0f1f3;color:var(--t3);border-radius:5px;padding:1px 5px}
main{flex:1;min-width:0;max-width:1240px;padding:20px 22px 70px}
/* el módulo de almacén/compras se monta acá adentro, a pantalla completa */
main.modulo{max-width:none;padding:0}
.modmarco{height:calc(100vh - var(--alto-top));width:100%}
.modmarco.chico{height:calc(100vh - var(--alto-top) - 150px);min-height:560px;border:1px solid var(--linea);border-radius:12px;overflow:hidden;background:#fff}
.modframe{width:100%;height:100%;border:0;display:block;background:#fff}
@media(max-width:900px){.layout{display:block}aside.side{width:auto;position:static;max-height:none;min-height:0;border-right:0;border-bottom:1px solid var(--linea);display:flex;flex-wrap:wrap;gap:2px;padding:8px}
 .side .sec,.side .grupo{width:100%;padding:8px 10px 2px}.side a{padding:7px 10px}}
.h1{font-size:20px;font-weight:700;margin:0 0 2px}
.sub{color:var(--t3);margin:0 0 18px;font-size:12.5px}
.card{background:var(--tarjeta);border-radius:12px;box-shadow:var(--sombra);padding:16px 18px;margin-bottom:14px}
.card h3{margin:0 0 12px;font-size:13.5px;font-weight:700;color:var(--t1);display:flex;align-items:center;gap:8px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.kpi{background:#fff;border-radius:12px;box-shadow:var(--sombra);padding:14px 16px}
.kpi .et{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--t3);font-weight:600}
.kpi .nu{font-size:26px;font-weight:700;margin-top:5px;letter-spacing:-.5px}
.kpi .pie{font-size:11.5px;color:var(--t3);margin-top:3px}
.kpi.aviso .nu{color:var(--mal)}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--t3);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--linea);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid #f1f2f4;color:var(--t2);vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:#fafbfc}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
td b{color:var(--t1);font-weight:600}
.tabla-wrap{overflow-x:auto;margin:0 -6px}
.chip{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:600;background:#f0f1f3;color:var(--t2);white-space:nowrap}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
.chip.al{background:var(--alerta-bg);color:var(--alerta)}
.chip.ma{background:var(--mal-bg);color:var(--mal)}
.chip.in{background:var(--info-bg);color:var(--info)}
.chip.ac{background:var(--acento-suave);color:var(--acento)}
.acc{display:flex;gap:5px;justify-content:flex-end}
.acc button{border:1px solid var(--linea);background:#fff;border-radius:8px;width:30px;height:28px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--t2);padding:0}
.acc button:hover{border-color:#d5d8dd;color:var(--t1);background:#fafbfc}
.acc button.ed:hover{border-color:var(--ok);color:var(--ok)}
.acc button.bo:hover{border-color:var(--mal);color:var(--mal)}
.acc button .ico{width:15px;height:15px}
.btn{border:1px solid var(--linea);background:#fff;border-radius:9px;padding:7px 12px;font-size:12.5px;cursor:pointer;font-weight:600;color:var(--t2);display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:#d5d8dd;color:var(--t1)}
.btn.pri{background:var(--acento);border-color:var(--acento);color:#fff}
.btn.pri:hover{filter:brightness(1.08);color:#fff}
.btn.chico{padding:4px 9px;font-size:11.5px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:not-allowed}
label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--t3);font-weight:600;margin-bottom:4px}
input,select,textarea{width:100%;padding:8px 10px;border:1px solid var(--linea);border-radius:9px;background:#fff;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--acento);box-shadow:0 0 0 3px var(--acento-suave)}
textarea{min-height:64px;resize:vertical}
.campo{margin-bottom:11px}
.fila{display:grid;gap:11px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.modal-bg{position:fixed;inset:0;background:rgba(16,24,40,.42);display:flex;align-items:flex-start;justify-content:center;padding:36px 14px;z-index:80;overflow:auto}
.modal{background:#fff;border-radius:14px;box-shadow:0 24px 60px rgba(16,24,40,.22);width:100%;max-width:860px}
.modal.ancho{max-width:1080px}
.modal.angosto{max-width:440px}
.modal-h{padding:15px 20px;border-bottom:1px solid var(--linea);display:flex;align-items:center;gap:10px}
.modal-h b{font-size:15px}
.modal-b{padding:18px 20px;max-height:70vh;overflow:auto}
.modal-f{padding:13px 20px;border-top:1px solid var(--linea);display:flex;gap:9px;justify-content:flex-end;background:#fbfbfc;border-radius:0 0 14px 14px}
.vacio{text-align:center;padding:34px 18px;color:var(--t3)}
.vacio b{display:block;color:var(--t2);margin-bottom:5px;font-size:14px}
.est{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--t3)}
.ver{font-size:11px;font-weight:700;letter-spacing:.3px;color:var(--acento);background:var(--acento-suave);border:1px solid var(--acento-borde);border-radius:999px;padding:3px 9px;white-space:nowrap;cursor:help}
.pt{width:7px;height:7px;border-radius:50%;background:var(--t3)}
.pt.v{background:var(--ok)} .pt.r{background:var(--mal)} .pt.a{background:var(--alerta)}
.tabs{display:flex;gap:3px;border-bottom:1px solid var(--linea);margin:-4px 0 14px;flex-wrap:wrap}
.tabs button{background:none;border:0;padding:9px 13px;cursor:pointer;color:var(--t3);font-weight:600;border-bottom:2px solid transparent}
.tabs button.on{color:var(--acento);border-bottom-color:var(--acento)}
.barra{height:6px;background:#eef0f2;border-radius:4px;overflow:hidden}
.barra i{display:block;height:100%;background:var(--acento)}
.mini{font-size:11.5px;color:var(--t3)}
/* pantalla de entrada: texto a la izquierda, foto a la derecha, el cuadro montado en el medio */
.login-wrap{min-height:100vh;display:grid;grid-template-columns:55% 45%;position:relative;background:#f7f8fa;overflow:hidden}
.portada-izq{display:flex;flex-direction:column;justify-content:center;padding:60px 42% 60px 7%}
.portada-izq h2{font-size:clamp(34px,5.2vw,64px);font-weight:300;line-height:1.05;margin:0 0 22px;color:#1f2328;letter-spacing:-.5px}
.portada-izq .raya{width:150px;height:2px;background:var(--acento);margin:0 0 26px}
.portada-izq p{color:#5c6470;font-size:15px;line-height:1.5;margin:0;max-width:520px}
.portada-der{background:linear-gradient(135deg,#1c2430 0%,#2b3440 45%,#4a5668 100%);background-size:cover;background-position:center}
.login{position:absolute;left:41%;top:50%;transform:translateY(-50%);background:#fff;border-radius:16px;box-shadow:0 24px 60px rgba(16,24,40,.22);padding:34px 36px;width:100%;max-width:440px;text-align:center;z-index:2}
@media(max-width:900px){
  /* celular: la MISMA composición que en la computadora, solo más chica */
  .login-wrap{grid-template-columns:50% 50%}
  .portada-izq{padding:40px 6% 24px 5%;justify-content:flex-start}
  .portada-izq h2{font-size:26px;margin-bottom:12px}
  .portada-izq .raya{width:70px;margin-bottom:12px}
  .portada-izq p{font-size:12px}
  .login{left:50%;top:56%;transform:translate(-50%,-50%);width:calc(100% - 28px);max-width:360px;padding:22px 18px}
  .login h1{font-size:16px}
}
.login .iso{width:52px;height:52px;border-radius:14px;background:var(--acento);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:21px;margin:0 auto 12px}
.login h1{font-size:19px;margin:0 0 3px}
.login p{color:var(--t3);margin:0 0 20px;font-size:12.5px}
.pin{letter-spacing:8px;text-align:center;font-size:19px}
.pin.codigo{letter-spacing:4px;font-size:17px}
.emp-entrada{background:var(--acento-suave);border:1px solid var(--acento-borde);border-radius:10px;padding:8px 12px;font-size:12.5px;margin:-8px 0 14px}
.emp-entrada a{color:var(--acento);cursor:pointer;text-decoration:underline}
.emp-fija{font-size:12.5px;font-weight:600;padding:6px 12px;border:1px solid var(--acento-borde);background:var(--acento-suave);border-radius:8px;white-space:nowrap}
.err{background:var(--mal-bg);color:var(--mal);padding:9px 12px;border-radius:9px;font-size:12.5px;margin-bottom:12px;font-weight:600}
.aviso{background:var(--alerta-bg);color:var(--alerta);padding:10px 13px;border-radius:10px;font-size:12.5px;font-weight:600;margin-bottom:12px}
.ico{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.soltar{border:2px dashed var(--linea);border-radius:12px;padding:26px 18px;text-align:center;color:var(--t3);background:#fbfbfc;cursor:pointer}
.soltar:hover{border-color:var(--acento);color:var(--acento);background:var(--acento-suave)}
.soltar b{display:block;color:var(--t1);font-size:14px;margin-bottom:4px}
.mapeo{font-size:11.5px;color:var(--t3);margin-top:10px}
.mapeo span{display:inline-block;background:#f0f1f3;border-radius:6px;padding:2px 8px;margin:2px}
.mapeo span.no{background:var(--mal-bg);color:var(--mal)}
.logoemp{height:var(--marca-logo);max-width:calc(var(--marca-logo)*3.6);object-fit:contain;flex:none}
.lista-doc{display:flex;flex-direction:column;gap:8px}
.doc{display:flex;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--linea);border-radius:10px;cursor:pointer;background:#fff}
.doc:hover{border-color:#d5d8dd;background:#fafbfc}
.doc .cre{flex:1;min-width:0}
.doc .cre b{display:block;font-size:13px}
.doc .cre span{font-size:11.5px;color:var(--t3)}
@media(max-width:700px){.marca{width:auto;padding-left:0}.marca span{display:none}main{padding:14px 12px 60px}}
.avisito{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--t1,#1f2328);color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.25);z-index:9999;max-width:92vw;text-align:center}
</style>
</head>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Almacén y compras</title>
<style>
:root{
  --tinta:#12202e;--t2:#40566b;--t3:#7d92a6;
  --papel:#fff;--fondo:#f2f5f8;--linea:#dde5ec;
  --pri:#0f4c81;--pri-s:#e7f0f8;
  --ok:#1c7a5e;--ok-s:#e3f4ee;
  --alerta:#b4630f;--alerta-s:#fdeedd;
  --mal:#b3261e;--mal-s:#fbe9e7;
  --gris-s:#eceff2;
}
*{box-sizing:border-box}
body{margin:0;background:var(--fondo);color:var(--tinta);font-size:14.5px;line-height:1.5;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;font-size:14.5px}
.top{background:var(--pri);color:#fff;padding:12px 18px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.top .marca{font-weight:800;font-size:17px;letter-spacing:-.2px;white-space:nowrap}
.top .marca small{display:block;font-size:11px;font-weight:500;opacity:.75;letter-spacing:.3px}
.top .marca .ver{font-size:11px;font-weight:700;background:rgba(255,255,255,.2);border-radius:999px;
  padding:2px 9px;vertical-align:middle;letter-spacing:.2px}
.top .sp{flex:1}
.top select{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.3);
  border-radius:8px;padding:7px 11px;font-weight:600;max-width:280px}
.top select option{color:#12202e}
.top .btn-top{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);color:#fff;
  border-radius:8px;padding:7px 12px;cursor:pointer;font-weight:600;font-size:13px}
.top .btn-top:hover{background:rgba(255,255,255,.25)}
nav{background:var(--papel);border-bottom:1px solid var(--linea);position:sticky;top:0;z-index:30;
  box-shadow:0 1px 3px rgba(18,32,46,.06)}
nav .wrap{display:flex;gap:2px;overflow-x:auto;padding:0 12px;max-width:1400px;margin:0 auto}
nav button{border:0;background:none;cursor:pointer;white-space:nowrap;padding:13px 14px;
  font-size:13.5px;font-weight:600;color:var(--t2);border-bottom:3px solid transparent}
nav button:hover{color:var(--pri)}
nav button.on{color:var(--pri);border-bottom-color:var(--pri)}
main{max-width:1400px;margin:0 auto;padding:20px 18px 90px}
h2{font-size:20px;font-weight:800;margin:0 0 3px;letter-spacing:-.2px}
.sub{color:var(--t2);font-size:14px;margin:0 0 18px;max-width:850px}
h3{font-size:15.5px;font-weight:700;margin:0 0 10px}
.card{background:var(--papel);border:1px solid var(--linea);border-radius:12px;padding:16px 18px;margin:12px 0}
.grid{display:grid;gap:12px}
@media(min-width:700px){.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}}
@media(min-width:1000px){.g4{grid-template-columns:repeat(4,1fr)}}
.kpi{background:var(--papel);border:1px solid var(--linea);border-radius:12px;padding:14px 16px}
.kpi .t{font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--t3);font-weight:700}
.kpi .v{font-size:25px;font-weight:800;margin:5px 0 1px;letter-spacing:-.5px}
.kpi .d{font-size:12.5px;color:var(--t2)}
.kpi.al{border-color:var(--alerta)}.kpi.al .v{color:var(--alerta)}
.kpi.bad{border-color:var(--mal)}.kpi.bad .v{color:var(--mal)}
.kpi.good .v{color:var(--ok)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--t3);
  border-bottom:1px solid var(--linea);padding:8px 9px;font-weight:700;white-space:nowrap}
td{border-bottom:1px solid var(--linea);padding:8px 9px;vertical-align:middle}
tbody tr:hover{background:#f7fafc}
.num{text-align:right;font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto}
.btn{background:var(--pri);color:#fff;border:0;border-radius:8px;padding:9px 15px;cursor:pointer;font-weight:600}
.btn:hover{background:#0d4272}
.btn.sec{background:var(--papel);color:var(--pri);border:1px solid var(--linea)}
.btn.sec:hover{background:var(--pri-s)}
.btn.ok{background:var(--ok)}.btn.ok:hover{background:#166550}
.btn.mal{background:var(--mal)}.btn.mal:hover{background:#8f1e17}
.btn.mini{padding:5px 10px;font-size:12.5px;border-radius:6px}
.barra{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.barra .sp{flex:1}
input[type=text],input[type=number],input[type=date],select,textarea{
  border:1px solid var(--linea);border-radius:8px;padding:8px 10px;background:#fff;color:var(--tinta);width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--pri-s);border-color:var(--pri)}
label{display:block;font-size:12px;font-weight:700;color:var(--t2);margin:0 0 4px;text-transform:uppercase;letter-spacing:.3px}
.campo{margin-bottom:12px}
.pill{display:inline-block;border-radius:999px;padding:2px 9px;font-size:11.5px;font-weight:700}
.pill.ok{background:var(--ok-s);color:var(--ok)}
.pill.al{background:var(--alerta-s);color:var(--alerta)}
.pill.mal{background:var(--mal-s);color:var(--mal)}
.pill.gris{background:var(--gris-s);color:var(--t2)}
.pill.pri{background:var(--pri-s);color:var(--pri)}
.emp{display:inline-flex;align-items:center;gap:6px;font-weight:600;white-space:nowrap}
.emp i{width:9px;height:9px;border-radius:3px;display:inline-block;flex:0 0 9px}
.modal-bg{position:fixed;inset:0;background:rgba(18,32,46,.5);display:flex;align-items:flex-start;
  justify-content:center;padding:30px 16px;z-index:100;overflow-y:auto}
.modal{background:var(--papel);border-radius:14px;width:100%;max-width:620px;padding:20px 22px;
  box-shadow:0 20px 50px rgba(18,32,46,.3)}
.modal.ancho{max-width:900px}
.modal h3{font-size:17px;margin:0 0 4px}
.modal .cierra{float:right;border:0;background:none;font-size:22px;cursor:pointer;color:var(--t3);line-height:1;padding:0}
.nota{border-left:3px solid var(--pri);background:var(--pri-s);padding:10px 14px;border-radius:0 8px 8px 0;

.vacio{text-align:center;padding:44px 20px;color:var(--t3)}

.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px}

.tabs2{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}

textarea{min-height:120px;font-family:ui-monospace,Menlo,monospace;font-size:12.5px}
/* ALERTAS: fondo pleno y letra blanca — se leen de lejos y sobre cualquier fila */
.grupoperm{border:1px solid var(--linea);border-radius:10px;padding:10px 12px;margin-bottom:8px;background:var(--fondo)}

.cajitas{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:4px;

.minifoto{border-radius:7px;object-fit:cover;border:1px solid var(--linea);cursor:pointer;display:block;background:#fff}
.minifoto:hover{border-color:var(--pri)}
.sinfoto{border-radius:7px;border:1px dashed var(--linea);display:flex;align-items:center;justify-content:center;

.tiras{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.tira{position:relative;border:1px solid var(--linea);border-radius:10px;padding:6px;background:var(--fondo)}
.tira img{width:96px;height:96px;object-fit:cover;border-radius:6px;display:block;background:#fff}
.tira .acc{display:flex;gap:4px;justify-content:center;margin-top:5px}
.tira .portada{position:absolute;top:-8px;left:6px;background:var(--pri);color:#fff;font-size:10px;

.galeria{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.galeria img{width:100%;border-radius:10px;border:1px solid var(--linea);background:#fff}
.fotovale{width:64px;height:64px;object-fit:cover;border-radius:9px;border:1px solid var(--pri);cursor:pointer;background:#fff}
.pill.solido{color:#fff !important;font-weight:800;letter-spacing:.2px;
  text-shadow:0 1px 1px rgba(0,0,0,.18);padding:3px 10px}
.pill.solido.mal{background:var(--mal) !important}
.pill.solido.al{background:var(--alerta) !important}
.pill.solido.ok{background:var(--ok) !important}
.pill.solido.pri{background:var(--pri) !important}
/* el titileo es un pulso lento, no un parpadeo: llama la atención sin marear al que
   pasa ocho horas frente a la pantalla */
@keyframes pulso{
  0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(179,38,30,.55)}
  50%{opacity:.72;box-shadow:0 0 0 6px rgba(179,38,30,0)}
}

  0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(180,99,15,.5)}

}

.titila.al{animation-name:pulsoAl}

.pinpad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:260px;margin:10px auto 0}
.pinpad button{border:1px solid var(--linea);background:var(--papel);border-radius:10px;padding:14px 0;
  font-size:19px;font-weight:700;cursor:pointer;color:var(--tinta)}

  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;color:var(--tinta);white-space:nowrap}
.ubicgrande{background:var(--pri-s);border:1px solid var(--pri);border-radius:10px;padding:12px 16px;margin:0 0 12px;
  display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.ubicgrande.sin{background:var(--alerta-s);border-color:var(--alerta)}

  font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.ubicgrande .lugar.sin{font-size:16px;color:var(--alerta);font-family:inherit}
.ubicgrande .hay{font-size:13.5px;color:var(--t2)}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--tinta);color:#fff;
  padding:11px 20px;border-radius:10px;z-index:200;font-weight:600;font-size:13.5px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
</style>
</head>
<body>

<div class="top">
  <div class="marca" id="marcaModulo">Almacén y compras <span class="ver" id="chipVer">v2.2</span><small id="bajadaModulo">GESTIÓN DE FLOTA</small></div>
  <select id="selEmpresa" onchange="setEmpresa(this.value)"></select>
  <div class="sp"></div>
  <span class="btn-top" id="chipMon" style="display:none;cursor:default"></span>
  <button class="btn-top" id="btnSesion" onclick="clickSesion()">🔒 Identificarse</button>
  <button class="btn-top" onclick="ir('config')">⚙ Configuración</button>
</div>

<nav><div class="wrap" id="nav"></div></nav>
<main id="app"></main>
<div id="modal"></div>

<script>
/* ============================================================
   ALMACÉN Y COMPRAS · GRUPO MULTI-EMPRESA
   Regla estructural: el CATÁLOGO es del grupo (código único),
   el STOCK y el PARQUE MÓVIL son de cada empresa, en cada base.
   La imputación del costo la define la EMPRESA PROPIETARIA del coche.
   ============================================================ */

var CLAVE = "PANOL_GRUPO_V1";
var DB = null, EMP = "", VISTA = "panel", SUB = {};

function vacio(){return {empresas:[],bases:[],unidades:[],articulos:[],params:[],movimientos:[],solicitudes:[],
  ordenes:[],traslados:[],recepciones:[],devoluciones:[],operadores:[],conteos:[],
  seq:{sc:1000,vc:1000,tr:100,re:100,dv:100,oc:100}};}
function cargar(){ try{ DB = JSON.parse(localStorage.getItem(CLAVE)) || vacio(); }catch(e){ DB = vacio(); }
  ["empresas","bases","unidades","articulos","params","movimientos","solicitudes","ordenes",
   "traslados","recepciones","devoluciones","operadores","conteos"].forEach(function(k){ if(!DB[k]) DB[k]=[]; });
  if(!DB.seq) DB.seq={};
  ["sc","vc"].forEach(function(k){ if(!DB.seq[k]) DB.seq[k]=1000; });
  ["tr","re","dv","oc","in"].forEach(function(k){ if(!DB.seq[k]) DB.seq[k]=100; });
}
function guardar(){ try{ localStorage.setItem(CLAVE, JSON.stringify(DB)); }catch(e){ aviso("No se pudo guardar: "+e.message); }
  panolProgramarSubida(); }

/* ══ v12 — RESPALDO AUTOMÁTICO EN PLANILLA DE GOOGLE ═════════════════════
   Con la URL del conector pegada en Respaldo, cada cambio se sube solo a la
   planilla (2 s después, para no escribir por cada tecla) y al abrir la app
   se traen los datos de ahí: todas las computadoras ven lo mismo y el
   navegador deja de ser el único lugar donde viven los datos.            */
var PANOL_SYNC_T=null;
/* La dirección del script de la planilla del pañol, ya puesta: la app se
   conecta sola. Si algún día cambia, se edita acá o en Configuración → Respaldo. */
var PANOL_API_DEFAULT = "https://script.google.com/macros/s/AKfycby4ei3BSJnGWygTyNkyD5ZSBuX8LWQXZsa1doLVDfPZh8YtZxEEFOyFQgbfNp9Qdgy_/exec";
function panolApi(){ return ((localStorage.getItem("PANOL_API")||"").trim() || PANOL_API_DEFAULT).trim(); }
function panolProgramarSubida(){ if(!panolApi()) return;
  clearTimeout(PANOL_SYNC_T); PANOL_SYNC_T=setTimeout(function(){ panolSubir(false); }, 2000); }
function panolSubir(manual){
  var u=panolApi(); if(!u){ if(manual) aviso("Primero pegá la URL del conector en Respaldo."); return; }
  fetch(u,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},
    body:JSON.stringify({accion:"guardarTodo",datos:DB})})
  .then(function(r){return r.json();})
  .then(function(r){ if(!r||r.ok===false) throw new Error((r&&r.error)||"el script no respondió");
    if(manual) aviso("Subido a la planilla ("+(r.total!=null?r.total+" registros":"ok")+")."); })
  .catch(function(e){ aviso("Quedó guardado en esta computadora, pero no en la planilla. "+(e.message||e)); });
}
function panolTraer(auto){
  var u=panolApi(); if(!u){ if(!auto) aviso("Primero pegá la URL del conector en Respaldo."); return; }
  fetch(u+(u.indexOf("?")>-1?"&":"?")+"accion=leer")
  .then(function(r){return r.json();})
  .then(function(r){ if(!r||r.ok===false) throw new Error((r&&r.error)||"el script no respondió");
    var d=r.datos||{};
    var tiene=Object.keys(d).some(function(k){ return Array.isArray(d[k])&&d[k].length; });
    if(!tiene){ if(!auto) aviso("La planilla está vacía. Usá «Subir todo ahora» para estrenarla con lo de esta computadora."); return; }
    try{ localStorage.setItem(CLAVE, JSON.stringify(d)); }catch(e){}
    cargar(); aplicarMaestros(); render();
    if(!auto) aviso("Datos traídos de la planilla.");
  })
  .catch(function(e){ if(!auto) aviso("No se pudo leer la planilla. "+(e.message||e)); });
}
function panolGuardarApi(){
  var u=(val("f_api")||"").trim();
  if(u && u.indexOf("https://script.google.com/")!==0){ aviso("La URL no parece de Apps Script (tiene que empezar con https://script.google.com/)."); return; }
  localStorage.setItem("PANOL_API", u); render();
  aviso(u? "URL guardada. Ahora «Subir todo ahora» o «Traer de la planilla».":"URL borrada: la app queda solo local.");
}
function id(){ return Date.now()*1000 + Math.floor(Math.random()*1000); }
function hoy(){ return new Date().toISOString().slice(0,10); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
function n(v){ if(typeof v==="number") return v; if(!v) return 0;
  var s=String(v).trim().replace(/\s/g,"").replace(/\$/g,"");
  if(s.indexOf(",")>-1 && s.indexOf(".")>-1) s=s.replace(/\./g,"").replace(",",".");
  else if(s.indexOf(",")>-1) s=s.replace(",",".");
  var x=parseFloat(s); return isNaN(x)?0:x; }
/* =============================== MONEDA ===============================
   Regla: TODO se guarda en pesos. El dólar es una forma de MIRAR y una forma
   de PACTAR con el proveedor — la cotización se congela en cada orden de compra,
   no se recalcula después. Si no, el costo histórico cambia solo cada mañana
   y nada de lo que informaste ayer se puede volver a reproducir.
   ====================================================================== */
function MON(){
  var d={base:"ARS",ver:"ARS",usd:0,fuente:"Banco Nación",fecha:""};
  try{ var g=JSON.parse(localStorage.getItem("PANOL_MONEDA")||"{}");
    for(var k in g) d[k]=g[k]; }catch(e){}
  return d;
}
function setMON(o){ localStorage.setItem("PANOL_MONEDA", JSON.stringify(o)); }
function cotiz(){ return n(MON().usd); }
/* pesos() sigue recibiendo SIEMPRE pesos; solo cambia cómo se muestra */
function pesos(v){
  v = n(v);
  var m=MON();
  if(m.ver==="USD"){
    if(!n(m.usd)) return "US$ —";
    var u=v/n(m.usd);
    return "US$ "+(Math.abs(u)>=100? Math.round(u).toLocaleString("es-AR")
      : (Math.round(u*100)/100).toLocaleString("es-AR",{minimumFractionDigits:2}));
  }
  return "$ "+Math.round(v).toLocaleString("es-AR");
}
function aPesos(valor, moneda, tc){ return moneda==="USD"? n(valor)*n(tc||cotiz()) : n(valor); }
/* SIEMPRE en pesos, sin importar cómo esté configurada la vista */
function soloPesos(v){ return "$ "+Math.round(n(v)).toLocaleString("es-AR"); }
/* SIEMPRE en dólares, a la cotización VIGENTE (la de hoy, la que está cargada) */
function soloUSD(v){
  if(!cotiz()) return "US$ —";
  var u=n(v)/cotiz();
  return "US$ "+(Math.abs(u)>=100? Math.round(u).toLocaleString("es-AR")
    : (Math.round(u*100)/100).toLocaleString("es-AR",{minimumFractionDigits:2}));
}
/* los dos juntos: es como hay que mirar el stock en un país con dos monedas */
function dual(v){
  if(!cotiz()) return soloPesos(v);
  return soloPesos(v)+'<div class="mini" style="font-weight:600;color:var(--pri)">'+soloUSD(v)+'</div>';
}
function dualLinea(v){ return cotiz()? soloPesos(v)+" · "+soloUSD(v) : soloPesos(v); }
function miles(v){ return Math.round((v||0)*100)/100 === Math.round(v||0)
  ? Math.round(v||0).toLocaleString("es-AR") : (Math.round((v||0)*100)/100).toLocaleString("es-AR"); }
function aviso(m){ var d=document.createElement("div"); d.className="toast"; d.textContent=m;
  document.body.appendChild(d); setTimeout(function(){ d.remove(); },2600); }

/* =========================== SESIÓN POR PIN ===========================
   OJO: esto es una SIMULACIÓN. Los PIN se guardan en el navegador y quien
   abra el archivo los puede ver. Sirve para que cada movimiento quede FIRMADO
   por una persona, no para impedir que alguien entre.
   ====================================================================== */
var SESION = null;              /* {operadorId, desde} */
var MINUTOS_SESION = 20;        /* se cierra sola: el mostrador queda abierto todo el día */

function operadores(){ return DB.operadores||[]; }
function operador(i){ return operadores().filter(function(o){return o.id==i;})[0]||null; }
function sesionViva(){
  if(!SESION) return null;
  if((Date.now()-SESION.desde)/60000 > MINUTOS_SESION){ SESION=null; return null; }
  return operador(SESION.operadorId);
}
function quienOpera(){ var o=sesionViva(); return o? o.nombre : ""; }
function pintarMoneda(){
  var b=document.getElementById('chipMon'); if(!b) return;
  var m=MON();
  b.style.display = m.ver==='USD'? '' : 'none';
  b.textContent = 'US$ a $'+miles(m.usd);
}
function pintarSesion(){
  var o=sesionViva();
  var txt = o ? esc(o.nombre)+' · salir' : 'Identificarse';
  var b=document.getElementById("btnSesion");
  if(b){ b.innerHTML = o? '👤 '+txt : '🔒 '+txt; b.style.background = o? "rgba(255,255,255,.3)" : ""; }
  var n=document.getElementById("btnSesionNav");
  if(n){ n.textContent = txt; n.className = "navses" + (o ? " dentro" : ""); }
}
function clickSesion(){
  if(sesionViva()){ SESION=null; pintarSesion(); aviso("Sesión cerrada"); }
  else mPin();
}
function mPin(alValidar, texto){
  if(!operadores().length){
    abrir('<h3>Todavía no hay operadores cargados</h3>'+
      '<p class="mini">El PIN identifica a quien entrega o recibe mercadería. Cargá al menos uno en Configuración.</p>'+
      '<div class="barra"><div class="sp"></div><button class="btn" onclick="cerrar();ir(\'config\')">Ir a Configuración</button></div>');
    return;
  }
  TMP.pinAccion = alValidar||null; TMP.pin=""; TMP.usuario="";
  abrir('<h3>Identificate</h3>'+
    '<p class="mini" style="margin:0 0 14px">'+(texto||"Cada entrega y cada ingreso queda firmado con quién lo hizo.")+'</p>'+
    '<div class="campo"><label>Usuario</label><select id="f_pinuser" onchange="TMP.usuario=this.value;TMP.pin=\'\';pintarPin()">'+
      '<option value="">— elegí tu usuario —</option>'+
      operadores().filter(function(o){return o.activo!==false;}).map(function(o){
        return '<option value="'+o.id+'">'+esc(o.nombre)+(o.rol? ' · '+esc(o.rol):'')+'</option>'; }).join("")+
      '</select></div>'+
    '<div class="pinbox"><div class="pindots" id="pinDots"></div>'+
    '<div class="pinpad">'+
      [1,2,3,4,5,6,7,8,9].map(function(d){ return '<button onclick="tecla('+d+')">'+d+'</button>'; }).join("")+
      '<button class="gris" onclick="borrarPin()">←</button>'+
      '<button onclick="tecla(0)">0</button>'+
      '<button class="okb" onclick="validarPin()">OK</button>'+
    '</div><div class="mini" id="pinMsg" style="margin-top:10px;min-height:18px"></div></div>'+
    '<div class="barra"><div class="sp"></div><button class="btn sec" onclick="cerrar()">Cancelar</button></div>');
  pintarPin();
}
function tecla(d){ if((TMP.pin||"").length<6){ TMP.pin=(TMP.pin||"")+d; pintarPin(); } }
function borrarPin(){ TMP.pin=(TMP.pin||"").slice(0,-1); pintarPin(); }
function pintarPin(){
  var d=document.getElementById("pinDots"); if(!d) return;
  var l=(TMP.pin||"").length, s="";
  for(var i=0;i<Math.max(4,l);i++) s += (i<l? "●":"○");
  d.textContent=s;
}
function validarPin(){
  var m=document.getElementById("pinMsg");
  var u=val("f_pinuser")||TMP.usuario;
  if(!u){ if(m) m.innerHTML='<span style="color:var(--mal)">Elegí primero tu usuario</span>'; return; }
  var o=operador(u);
  if(!o || o.activo===false || String(o.pin)!==String(TMP.pin)){
    if(o) o.intentos=(o.intentos||0)+1;
    if(m) m.innerHTML='<span style="color:var(--mal)">PIN incorrecto para '+esc(o?o.nombre:"ese usuario")+'</span>';
    TMP.pin=""; pintarPin(); guardar(); return;
  }
  o.intentos=0; o.ultimoAcceso=new Date().toLocaleString("es-AR"); guardar();
  SESION={operadorId:o.id, desde:Date.now()};
  var acc=TMP.pinAccion; TMP.pinAccion=null; TMP.pin="";
  cerrar(); pintarSesion();
  if(acc) acc(); else { aviso("Hola "+o.nombre); render(); }
}
/* true si hay alguien identificado; si no, pide el PIN y después ejecuta la acción */
function exigePin(accion, texto){
  if(sesionViva()) return true;
  mPin(accion, texto||"Para mover mercadería hay que identificarse.");
  return false;
}

/* ========================= PERMISOS POR ACCIÓN =========================
   Se define por ACCIÓN y no por cargo: los cargos cambian de nombre y de persona,
   los circuitos no. Un rol es apenas una plantilla de permisos para cargar rápido.
   La regla de fondo es la separación de funciones: quien pide no autoriza,
   quien emite no cierra, quien cuenta no ajusta solo.
   ====================================================================== */
var ACCIONES = [
  {k:"sc_crear",   g:"Compras",   t:"Crear solicitud"},
  {k:"sc_cerrar",  g:"Compras",   t:"Cerrar solicitud",  ojo:"Cancela el saldo que quedó sin comprar"},
  {k:"autorizar",  g:"Compras",   t:"Autorizar compra"},
  {k:"oc_emitir",  g:"Compras",   t:"Emitir orden de compra"},
  {k:"oc_cerrar",  g:"Compras",   t:"Cerrar o anular orden", ojo:"Sin condiciones. Da por perdido un saldo ya comprometido"},
  {k:"oc_cerrar_cond", g:"Compras", t:"Anular orden solo dentro de su alcance",
    ojo:"Únicamente si nació en Almacén Central Y es de una base o un vehículo a su cargo"},
  {k:"recibir",    g:"Almacén",   t:"Recibir mercadería"},
  {k:"egreso",     g:"Almacén",   t:"Entregar (vale de consumo)"},
  {k:"ingreso",    g:"Almacén",   t:"Ingreso directo"},
  {k:"tras_env",   g:"Almacén",   t:"Despachar traslado"},
  {k:"tras_rec",   g:"Almacén",   t:"Recibir traslado"},
  {k:"ajuste",     g:"Almacén",   t:"Ajuste de inventario", ojo:"Corrige el stock sin documento de respaldo"},
  {k:"cont_abrir", g:"Inventario",t:"Abrir conteo"},
  {k:"cont_cerrar",g:"Inventario",t:"Cerrar conteo y ajustar"},
  {k:"maestros",   g:"Maestros",  t:"Editar catálogo y niveles"},
  {k:"admin",      g:"Maestros",  t:"Empresas, usuarios y configuración"}
];
/* plantillas: lo que típicamente puede cada cargo */
var PLANTILLAS = {
  "Auxiliar de Almacén":       ["sc_crear","recibir","egreso","ingreso","tras_rec","cont_abrir"],
  "Responsable de Almacén":    ["sc_crear","sc_cerrar","recibir","egreso","ingreso","tras_env","tras_rec",
                                "ajuste","cont_abrir","cont_cerrar","maestros"],
  "Auxiliar de Compras":       ["sc_crear","oc_emitir","recibir"],
  "Responsable de Compras":    ["sc_crear","sc_cerrar","oc_emitir","oc_cerrar"],

/* ---- Permiso CONDICIONADO: anular una orden de compra ----
   Compras (responsable) puede siempre. El Gerente de Mantenimiento solo cuando
   se cumplen las DOS condiciones: que la necesidad haya nacido en Almacén Central
   y que sea de una base o un vehículo bajo su responsabilidad. */
function esAlmacenCentral(sol){
  if(!sol) return false;
  if(sol.area) return sol.area==="Almacén Central";
  var b=base(sol.baseId);                       /* si no se cargó el área, se deduce de la base */
  return !!(b && b.tipo==="Central");
}
function basesACargo(o){ return (o && o.basesACargo) ? o.basesACargo : (o&&o.baseId? [o.baseId] : []); }
function enSuAlcance(oc, usr){
  var bs=basesACargo(usr);
  if(!bs.length) return {ok:false, txt:"no tiene ninguna base ni vehículo asignado a su cargo"};
  if(bs.indexOf(String(oc.baseId))>-1 || bs.indexOf(oc.baseId)>-1)
    return {ok:true, txt:"la base "+nomBase(oc.baseId)+" está a su cargo"};
  /* o bien el pedido era para un vehículo de una base a su cargo */
  var sol=oc.solicitudId? DB.solicitudes.filter(function(x){return x.id==oc.solicitudId;})[0] : null;
  if(sol && sol.unidadId){
    var u=unidad(sol.unidadId);
    if(u && (bs.indexOf(String(u.baseId))>-1 || bs.indexOf(u.baseId)>-1))
      return {ok:true, txt:"el interno "+u.interno+" pertenece a una base a su cargo"};
  }
  return {ok:false, txt:"ni la base "+nomBase(oc.baseId)+" ni el vehículo del pedido están a su cargo"};
}
function puedeAnular(oc){
  var u=sesionViva();
  if(!u) return {ok:false, pidePin:true};
  if(puede("oc_cerrar")) return {ok:true, txt:"tiene la potestad plena de cerrar órdenes"};
  if(!puede("oc_cerrar_cond")) return {ok:false, txt:"no tiene permiso para anular órdenes de compra"};
  var sol=oc.solicitudId? DB.solicitudes.filter(function(x){return x.id==oc.solicitudId;})[0] : null;
  if(!esAlmacenCentral(sol))
    return {ok:false, txt:"esta orden no nació en Almacén Central (nació en "+
      (sol? esc(sol.area||nomBase(sol.baseId)) : "una compra sin solicitud")+")"};
  var al=enSuAlcance(oc,u);
  if(!al.ok) return {ok:false, txt:al.txt};
  return {ok:true, txt:"nació en Almacén Central y "+al.txt};
}

/* A quién se le imputa el costo de un movimiento: SIEMPRE la empresa dueña del coche.
   El stock baja donde estaba (m.empresaId), pero la plata la paga el dueño de la unidad. */
function imputa(m){ return m.imputaEmpresaId || m.empresaId; }

/* stock = SUMA DE MOVIMIENTOS. Nunca un campo guardado. */
function stock(articuloId, empresaId, baseId){
  var t=0;
  for(var i=0;i<DB.movimientos.length;i++){ var m=DB.movimientos[i];
    if(m.articuloId!=articuloId) continue;
    if(empresaId && m.empresaId!=empresaId) continue;
    if(baseId && m.baseId!=baseId) continue;
    t += n(m.cantidad); }
  return t;
}
function costoUlt(articuloId){
  for(var i=DB.movimientos.length-1;i>=0;i--){ var m=DB.movimientos[i];
    if(m.articuloId==articuloId && n(m.costoUnit)>0) return n(m.costoUnit); }
  return 0;
}
function param(articuloId, empresaId, baseId){
  return DB.params.filter(function(p){ return p.articuloId==articuloId && p.empresaId==empresaId && p.baseId==baseId; })[0] || null;
}
/* La ubicación es del artículo EN ESA BASE Y DE ESA EMPRESA: el mismo filtro está
   en el estante A-03 de Córdoba y en el B-01 de Santa Rosa. */
function ubic(articuloId, empresaId, baseId){
  var p=param(articuloId,empresaId,baseId); return p && p.ubicacion ? p.ubicacion : "";
}
function setUbic(articuloId, empresaId, baseId, u){
  if(!u) return;
  var p=param(articuloId,empresaId,baseId);
  if(p) p.ubicacion=u;
  else DB.params.push({id:id(),articuloId:articuloId,empresaId:empresaId,baseId:baseId,min:0,max:0,ubicacion:u});
}
/* Una sola función para TODAS las alertas: así el criterio de qué titila
   se cambia en un solo lugar y no queda cada pantalla decidiendo por su cuenta. */

/* ══ v12 — SEGUIMIENTO EN DÍAS (escalera de demora) ══════════════════════
   Cada solicitud muestra cuántos días lleva esperando a quien le toca mover:
   sin autorizar (demora del que autoriza) o autorizada sin orden (demora de
   compras). La escalera: 0-1 día gris, 2-3 ámbar, 4 o más ROJO TITILANDO. */
function fechaDe(t){
  if(!t) return null;
  var s=String(t).trim(), m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(m) return new Date(+m[1],+m[2]-1,+m[3]);
  m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if(m) return new Date(+m[3],+m[2]-1,+m[1]);
  var d=new Date(s); return isNaN(d)?null:d;
}
function diasDesde(t){ var d=fechaDe(t); if(!d) return null;
  return Math.max(0, Math.floor((new Date()-d)/86400000)); }
function chipDias(dias, txt){
  if(dias===null || dias===undefined) return "";
  if(dias<=1) return '<span class="pill gris">'+esc(txt)+' hace '+dias+' d</span>';
  if(dias<=3) return '<span class="pill al'+(titilar()&&dias===3?" titila":"")+'">'+esc(txt)+' hace '+dias+' d</span>';
  /* corto: la pastilla tiene que gritar por el color, no por el largo */
  return '<span class="pill solido mal'+(titilar()?" titila":"")+'" title="'+esc(txt)+' hace '+dias+' días">'+
         esc(txt).toUpperCase()+' · '+dias+' d</span>';
}
function esperaSolicitud(s){
  if(s.estado==="Esperando autorización") return chipDias(diasDesde(s.fecha), "sin autorizar");
  if((s.estado==="Autorizada"||s.estado==="Ordenada parcial") && pendienteSol(s)>0)
    return chipDias(diasDesde(s.autorizadoEn||s.fecha), "sin orden");
  return "";
}
function alerta(txt, nivel){        /* nivel: "mal" (rojo) o "al" (naranja) */
  return '<span class="pill solido '+(nivel||"mal")+(titilar()?" titila":"")+'">'+esc(txt)+'</span>';
}
/* ============================== FOTOS ==============================
   Las fotos se guardan dentro del archivo (como texto base64), así que hay
   que achicarlas antes o el navegador se llena y deja de guardar. Se redimensiona
   a 900px de lado mayor y se comprime: alcanza de sobra para reconocer una pieza.
   ==================================================================== */
var FOTO_MAX_LADO = 900, FOTO_CALIDAD = 0.72, FOTOS_POR_ART = 5;

function comprimirFoto(file, cb){
  var fr=new FileReader();
  fr.onload=function(){
    var img=new Image();
    img.onload=function(){
      var w=img.width, h=img.height, esc=Math.min(1, FOTO_MAX_LADO/Math.max(w,h));
      var c=document.createElement("canvas");
      c.width=Math.round(w*esc); c.height=Math.round(h*esc);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      cb(c.toDataURL("image/jpeg",FOTO_CALIDAD));
    };
    img.onerror=function(){ cb(null); };
    img.src=fr.result;
  };
  fr.onerror=function(){ cb(null); };
  fr.readAsDataURL(file);
}
function fotosDe(a){ return (a && a.fotos)? a.fotos : []; }
function miniFoto(a, tam){
  var f=fotosDe(a)[0];
  var t=tam||44;
  if(!f) return '<div class="sinfoto" style="width:'+t+'px;height:'+t+'px">—</div>';
  return '<img src="'+f+'" class="minifoto" style="width:'+t+'px;height:'+t+'px" '+
    'onclick="verFotos(\''+a.id+'\')" title="Ver fotos">';
}
function verFotos(aId){
  var a=art(aId); if(!a) return;
  var fs=fotosDe(a);
  if(!fs.length) return aviso("Este artículo no tiene fotos");
  abrir('<h3>'+esc(a.descripcion)+'</h3><p class="mini mono" style="margin:0 0 12px">'+esc(a.codigo)+
    (a.oem? ' · OEM '+esc(a.oem):'')+'</p>'+

    '<div class="barra"><div class="sp"></div><button class="btn sec" onclick="cerrar()">Cerrar</button></div>', true);
}
function chipUbic(u){

}
function valorizado(empresaId, baseId){
  var t=0;
  DB.articulos.forEach(function(a){ var s=stock(a.id, empresaId, baseId); if(s>0) t += s*costoUlt(a.id); });
  return t;
}
/* cuántos dólares costó de verdad lo que hoy está en el estante, al cambio de cada compra.
   Comparado con el valor de hoy, muestra si el stock se abarató o se encareció en dólares. */
function valorizadoUSDhistorico(empresaId, baseId){
  var t=0, hay=false;
  DB.movimientos.forEach(function(m){
    if(m.tipo!=="ingreso") return;
    if(empresaId && m.empresaId!=empresaId) return;
    if(baseId && m.baseId!=baseId) return;
    var tc=n(m.tcMov); if(!tc) return;
    hay=true; t += n(m.cantidad)*n(m.costoUnit)/tc;
  });
  return hay? t : null;
}
/* filas de stock con parámetros, para una empresa (todas sus bases o una) */
function filasStock(empresaId, baseId){
  var out=[], vistos={};
  DB.movimientos.forEach(function(m){
    if(empresaId && m.empresaId!=empresaId) return;
    if(baseId && m.baseId!=baseId) return;
    vistos[m.articuloId+"|"+m.empresaId+"|"+m.baseId]=1;
  });
  DB.params.forEach(function(p){
    if(empresaId && p.empresaId!=empresaId) return;
    if(baseId && p.baseId!=baseId) return;
    vistos[p.articuloId+"|"+p.empresaId+"|"+p.baseId]=1;
  });
  Object.keys(vistos).forEach(function(k){
    var pr=k.split("|"), a=art(pr[0]); if(!a) return;
    var s=stock(pr[0],pr[1],pr[2]), p=param(pr[0],pr[1],pr[2]);
    out.push({art:a, empresaId:pr[1], baseId:pr[2], stock:s,
      min:p?n(p.min):0, max:p?n(p.max):0, ubicacion:(p&&p.ubicacion)||"", costo:costoUlt(pr[0])});
  });
  if(SUB.ordenUbic) out.sort(function(x,y){
    if(!x.ubicacion) return 1; if(!y.ubicacion) return -1;
    return x.ubicacion.localeCompare(y.ubicacion,"es",{numeric:true}); });
  else out.sort(function(x,y){ return (x.art.descripcion||"").localeCompare(y.art.descripcion||""); });
  return out;
}
function semaforo(f){
  if(f.min<=0 && f.max<=0) return {clase:"gris", txt:"sin parámetro"};
  if(f.stock<=0) return {clase:"mal", txt:"SIN STOCK"};
  if(f.stock < f.min) return {clase:"mal", txt:"bajo mínimo"};
  if(f.stock === f.min) return {clase:"al", txt:"en el mínimo"};
  if(f.max>0 && f.stock > f.max) return {clase:"al", txt:"sobre máximo"};
  return {clase:"ok", txt:"ok"};
}
function bajoMinimo(empresaId){
  return filasStock(empresaId||"", "").filter(function(f){ return f.min>0 && f.stock < f.min; });
}

   Se entra con ?m=almacen o ?m=compras desde Gestión de Flota. Los datos
   son LOS MISMOS (una sola base): lo que cambia es qué pantallas ve cada uno,
   porque el pañolero y el de compras no hacen el mismo trabajo.
   Sin parámetro se ve todo, como siempre. */
var MODULO = "";

  almacen:  ["panel","stock","inventario","movimientos","traslados","recepcion","catalogo","solicitudes"],

/* en Compras el stock es de CONSULTA: se mira para comprar con criterio,
   no se tocan los niveles ni la ubicación (eso es trabajo del pañol) */
function stockSoloConsulta(){ return MODULO==="compras"; }
function menuDelModulo(){
  var ids = MENU_MODULO[MODULO];
  if(!ids) return MENU;
  return ids.map(function(id){
    var m = null;
    MENU.forEach(function(x){ if(x[0]===id) m = x; });

    if(id==="solicitudes" && MODULO==="almacen") return [id, "Pedidos al área de compras"];
    return m;
  }).filter(Boolean);

        '<td>'+chipUbic(f.ubicacion)+'</td>'+
        '<td class="num">'+alerta(miles(f.stock))+'</td>'+
        '<td class="num">'+miles(f.min)+'</td><td class="num">'+miles(f.max)+'</td>'+
        '<td class="num"><b>'+miles(falta)+'</b></td>'+
        '<td><button class="btn mini" onclick="mSolicitud(\''+f.art.id+'\',\''+f.empresaId+'\',\''+f.baseId+'\','+falta+')">Pedir</button></td></tr>';
    });
    h+='</tbody></table></div></div>';
  }

  if(pend.length){
    h+='<div class="card"><h3>Solicitudes esperando autorización</h3>'+tablaSolicitudes(pend)+'</div>';
  }

  /* órdenes emitidas que todavía no llegaron: la respuesta a "¿cuándo llega?" */
  var ocAb=DB.ordenes.filter(function(o){ return o.estado!=="Anulada" && pendienteOC(o)>0 && (!e || o.empresaId==e); });

    var vencidas=ocAb.filter(function(o){ return o.fechaComprometida && o.fechaComprometida<hoy(); });

      '<div class="scroll"><table><thead><tr><th>N°</th><th>Proveedor</th><th>Falta</th><th>Para</th>'+
      '<th>Entrega</th><th class="num">Pendiente</th><th></th></tr></thead><tbody>';
    ocAb.forEach(function(o){
      var tarde=o.fechaComprometida && o.fechaComprometida<hoy();
      var val=o.items.reduce(function(t,it){ return t+pendienteItem(it)*n(it.precio); },0);
      h+='<tr><td class="mono"><b>'+esc(o.numero)+'</b><div class="mini">'+esc(o.solicitudNumero||"")+'</div></td>'+
        '<td>'+esc(o.proveedor||"—")+'</td>'+
        '<td>'+o.items.filter(function(it){return pendienteItem(it)>0;}).map(function(it){ var a=art(it.articuloId);
          return miles(pendienteItem(it))+' × '+esc(a?a.descripcion:"?"); }).join("<br>")+'</td>'+
        '<td>'+chipEmp(o.empresaId)+'<div class="mini">'+esc(nomBase(o.baseId))+'</div></td>'+
        '<td class="mini">'+(o.fechaComprometida? esc(o.fechaComprometida)+(tarde?' '+alerta("VENCIDA"):'') :'sin fecha')+'</td>'+
        '<td class="num">'+pesos(val)+'</td>'+
        '<td><button class="btn ok mini" onclick="mRecepcion(\''+o.id+'\')">Recibir</button></td></tr>';
    });
    h+='</tbody></table></div></div>';
  }

  /* traslados en tránsito: mercadería que salió y nadie dio por recibida */
  var tran=DB.traslados.filter(function(t){ return t.estado==="En tránsito" && (!e || t.origenEmpresaId==e || t.destinoEmpresaId==e); });
  if(tran.length){
    h+='<div class="card"><h3>En tránsito ahora mismo</h3>'+
      '<p class="mini" style="margin:-4px 0 10px">Ya salió de una base y todavía no entró en la otra. Si queda así muchos días, '+
      'es stock que se perdió en el camino.</p><div class="scroll"><table><thead><tr>'+
      '<th>N°</th><th>Salió</th><th>Desde</th><th>Hacia</th><th>Qué</th><th class="num">Valor</th><th></th></tr></thead><tbody>';
    tran.forEach(function(t){
      var dias=Math.round((new Date(hoy())-new Date(t.fechaSalida))/86400000);
      h+='<tr><td class="mono"><b>'+esc(t.numero)+'</b></td>'+
        '<td class="mini">'+esc(t.fechaSalida)+(dias>2?' '+alerta(dias+" DÍAS EN TRÁNSITO"):'')+'</td>'+
        '<td>'+esc(nomBase(t.origenBaseId))+'</td><td>'+esc(nomBase(t.destinoBaseId))+'</td>'+
        '<td>'+t.items.map(function(it){ var a=art(it.articuloId);
          return miles(it.cantidad)+' × '+esc(a?a.descripcion:"?"); }).join("<br>")+'</td>'+
        '<td class="num">'+pesos(t.items.reduce(function(s,it){ return s+n(it.cantidad)*n(it.costoUnit); },0))+'</td>'+
        '<td><button class="btn ok mini" onclick="mRecibirTraslado(\''+t.id+'\')">Recibir</button></td></tr>';
    });
    h+='</tbody></table></div></div>';
  }

  /* devoluciones abiertas: plata de ustedes en manos del proveedor */
  var devAb=DB.devoluciones.filter(function(d){ return d.estado!=="Cerrada" && (!e || d.empresaId==e); });
  if(devAb.length){
    h+='<div class="card"><h3>Devoluciones sin resolver</h3>'+
      '<p class="mini" style="margin:-4px 0 10px">Mercadería rechazada que el proveedor todavía no compensó. Total: <b>'+
      pesos(devAb.reduce(function(t,d){ return t+n(d.cantidad)*n(d.costoUnit); },0))+'</b></p>'+
      '<div class="scroll"><table><thead><tr><th>N°</th><th>Proveedor</th><th>Artículo</th><th>Motivo</th>'+

      h+='<tr><td class="mono"><b>'+esc(d.numero)+'</b></td><td>'+esc(d.proveedor||"—")+'</td>'+
        '<td>'+miles(d.cantidad)+' × '+esc(a?a.descripcion:"?")+'</td>'+
        '<td><span class="pill mal">'+esc(d.motivo)+'</span></td>'+
        '<td class="num">'+pesos(n(d.cantidad)*n(d.costoUnit))+'</td>'+
        '<td>'+alerta(d.estado,"al")+'</td>'+
        '<td><button class="btn sec mini" onclick="mCerrarDev(\''+d.id+'\')">Resolver</button></td></tr>'; });
    h+='</tbody></table></div></div>';
  }

  /* recupero entre empresas: repuesto de una, coche de otra */
  var pres=DB.movimientos.filter(function(m){ return m.prestamo && (!e || m.empresaId==e || imputa(m)==e); });
  if(pres.length){
    var pares={};
    pres.forEach(function(m){ var k=(m.recuperoDe||m.empresaId)+"|"+imputa(m);
      pares[k]=(pares[k]||0)+Math.abs(n(m.cantidad))*n(m.costoUnit); });
    h+='<div class="card"><h3>Préstamos entre empresas · a recuperar</h3>'+
      '<p class="mini" style="margin:-4px 0 10px">Repuesto que puso una empresa en el coche de otra. El stock bajó de una y el costo lo paga la otra: '+
      'esto es lo que hay que cruzar a fin de mes entre las empresas del grupo.</p>'+
      '<div class="scroll"><table><thead><tr><th>Puso el repuesto</th><th>Lo usó</th><th class="num">A recuperar</th></tr></thead><tbody>';
    Object.keys(pares).forEach(function(k){ var pr=k.split("|");
      h+='<tr><td>'+chipEmp(pr[0])+'</td><td>'+chipEmp(pr[1])+'</td><td class="num"><b>'+pesos(pares[k])+'</b></td></tr>'; });
    h+='</tbody></table></div></div>';
  }
  return h;
}
function kpi(t,v,d,c){ return '<div class="kpi '+(c||"")+(((c==="al"||c==="mal")&&titilar())?" titila"+(c==="al"?" al":""):"")+'"><div class="t">'+t+'</div><div class="v">'+v+'</div><div class="d">'+d+'</div></div>'; }

function borrarEmpresa(i){

function importarUnidades(){
  var emp=val("f_iemp"), bdef=val("f_ibase"), txt=val("f_datos");
  if(!emp) return aviso("Elegí la empresa");
  var lineas=txt.split("\n").map(function(l){return l.trim();}).filter(Boolean);
  var nuevas=0, act=0, sinBase=0;
  lineas.forEach(function(l){
    var c=l.split(/[;\t]/).map(function(x){return x.trim();});
    if(!c[0]) return;
    if(/^interno$/i.test(c[0])) return; /* encabezado */
    var nomB=c[5]||"", bId=bdef;
    if(nomB){ var b=basesDe(emp).filter(function(x){ return x.nombre.toLowerCase()===nomB.toLowerCase() ||

      if(b) bId=b.id; else { bId=id(); DB.bases.push({id:bId,empresaId:emp,nombre:nomB,localidad:nomB,tipo:"Operativa"}); } }
    if(!bId){ sinBase++; return; }
    var ex=DB.unidades.filter(function(u){ return u.empresaId==emp &&
      (String(u.interno)===c[0] || (c[1]&&u.patente&&u.patente===c[1].toUpperCase())); })[0];
    if(ex){ ex.patente=(c[1]||ex.patente||"").toUpperCase(); ex.tipo=c[2]||ex.tipo; ex.marca=c[3]||ex.marca;

  });
  guardar(); cerrar(); render();

function subirFotos(inp){
  var files=[].slice.call(inp.files||[]);

  if(libres<=0){ aviso("Máximo "+FOTOS_POR_ART+" fotos por artículo"); inp.value=""; return; }
  files=files.slice(0,libres);
  var pend=files.length;
  files.forEach(function(f){

/* Lo primero que necesita el pañolero: de dónde lo saca y cuánto hay ahí. */
function ubicVale(){
  var d=document.getElementById("cajaUbicVale"); if(!d) return;
  var a=val("f_vart"), e=val("f_vemp"), b=val("f_vbase");
  if(!a||!e||!b){ d.innerHTML=""; return; }
  var u=ubic(a,e,b), s=stock(a,e,b), A=art(a);
  var otras=basesDe(e).filter(function(x){ return x.id!=b && stock(a,e,x.id)>0; });
  var html='<div class="ubicgrande'+(u?"":" sin")+'">'+
    (fotosDe(A).length? '<img src="'+fotosDe(A)[0]+'" class="fotovale" onclick="verFotos(\''+a+'\')">':'')+
    '<div>'+
    (u? '<div class="lugar">📍 '+esc(u)+'</div>' : '<div class="lugar sin">Sin ubicación cargada</div>')+
    '<div class="hay">Hay <b>'+miles(s)+'</b> en '+esc(nomBase(b))+'</div></div></div>';
  if(s<=0 && otras.length) html+='<div class="nota al" style="margin:8px 0 0">No hay en esta base, pero '+esc(nomEmp(e))+
    ' tiene en '+otras.map(function(x){ return esc(x.nombre)+' ('+miles(stock(a,e,x.id))+
    (ubic(a,e,x.id)?", "+esc(ubic(a,e,x.id)):"")+')'; }).join(", ")+'.</div>';
  d.innerHTML=html;
}

function calcPrestamo(){

  if(!u){ av.innerHTML=""; return; }

  else av.innerHTML='<span style="color:var(--alerta)">⚠ El repuesto es de '+esc(nomEmp(eStock))+' y el coche es de '+esc(nomEmp(u.empresaId))+
    '. Se registra como <b>préstamo entre empresas</b>: baja el stock de una y el costo se imputa a la otra.</span>';

function guardarVale(){
  var e=val("f_vemp"), b=val("f_vbase"), a=val("f_vart"), c=n(val("f_vcant")), d=val("f_vdest");
  if(!e||!b||!a) return aviso("Faltan empresa, base o artículo");
  if(c<=0) return aviso("Cantidad inválida");
  var disp=stock(a,e,b);
  if(c>disp && !confirm("En esa base "+nomEmp(e)+" tiene "+miles(disp)+" y estás sacando "+miles(c)+". ¿Seguir igual? El stock va a quedar en negativo.")) return;
  var u = d==="unidad"? unidad(val("f_vunidad")) : null;
  if(d==="unidad" && !u) return aviso("Elegí la unidad de destino");
  if(d==="centro" && !val("f_vcentro").trim()) return aviso("Poné el sector de destino");
  DB.seq.vc++;
  DB.movimientos.push({id:id(),fecha:val("f_vfecha")||hoy(),tipo:"egreso",articuloId:a,empresaId:e,baseId:b,
    cantidad:-Math.abs(c),costoUnit:costoUlt(a),doc:"V.C. "+DB.seq.vc,
    destinoTipo:d,unidadId:u?u.id:"",centro:d==="centro"?val("f_vcentro").trim():"",
    ot:val("f_vot").trim(),retira:val("f_vretira").trim(),
    usuario:quienOpera(),tcMov:cotiz(),
    imputaEmpresaId: u? u.empresaId : e,
    prestamo: !!(u && u.empresaId!=e)});
  guardar(); cerrar(); render();
  aviso("Vale V.C. "+DB.seq.vc+" registrado");
}

function vSolicitudes(){
  var h='<h2>Compras</h2><p class="sub">El circuito es <b>solicitud → autorización → orden de compra → recepción</b>. '+
    'La solicitud es un pedido interno; la orden es el compromiso con el proveedor, y es de la orden de donde descuenta lo que llega.</p>'+
    '<div class="barra"><button class="btn" onclick="mSolicitud()">+ Nueva solicitud</button>'+
    '<div class="sp"></div><span class="mini">Tope del gerente: '+pesos(tope())+' · <a href="#" onclick="mTope();return false;">cambiar</a></span></div>';

  var sols=DB.solicitudes.filter(function(s){ return !EMP || s.empresaId==EMP; })
    .slice().sort(function(a,b){ return (b.fecha+b.numero).localeCompare(a.fecha+a.numero); });
  var ocs=DB.ordenes.filter(function(o){ return !EMP || o.empresaId==EMP; })
    .slice().sort(function(a,b){ return (b.fecha+b.numero).localeCompare(a.fecha+a.numero); });
  var porOrdenar=sols.filter(function(s){ return s.estado==="Autorizada" && pendienteSol(s)>0; });
  var conSaldo=ocs.filter(function(o){ return pendienteOC(o)>0 && o.estado!=="Anulada"; });

  h+='<div class="tabs2">'+
    '<button class="'+(SUB.cmp!=="oc"?"on":"")+'" onclick="SUB.cmp=\'sc\';render()">Solicitudes'+
      (porOrdenar.length? " ("+porOrdenar.length+" para ordenar)":"")+'</button>'+
    '<button class="'+(SUB.cmp==="oc"?"on":"")+'" onclick="SUB.cmp=\'oc\';render()">Órdenes de compra'+
      (conSaldo.length? " ("+conSaldo.length+" abiertas)":"")+'</button></div>';

  if(SUB.cmp==="oc") return h+vOrdenes(ocs);

  if(porOrdenar.length) h+='<div class="nota al"><b>'+porOrdenar.length+' solicitud(es) autorizadas sin orden emitida.</b> '+
    'Mientras no se emita la orden, el proveedor no sabe nada: la autorización sola no compra.</div>';
  if(!sols.length) return h+'<div class="vacio card"><h3>Sin solicitudes</h3><p>Desde Stock podés pedir directo lo que está bajo mínimo.</p></div>';
  return h+'<div class="card">'+tablaSolicitudes(sols)+'</div>';
}

/* ===================== ÓRDENES DE COMPRA =====================
   La orden es el compromiso: desde que se emite, esa plata está gastada
   aunque no se haya pagado. Y es el documento contra el que se recibe.
   ============================================================= */
function vOrdenes(ocs){
  if(!ocs.length) return '<div class="vacio card"><h3>Sin órdenes de compra</h3>'+
    '<p>Se generan desde una solicitud ya autorizada, con el botón «Generar orden».</p></div>';
  var h='<div class="card scroll"><table><thead><tr><th>N°</th><th>Nace de</th><th>Proveedor</th>'+
    '<th>Empresa / base</th><th>Renglones</th><th class="num">Monto</th><th>Entrega</th><th>Estado</th><th></th></tr></thead><tbody>';
  ocs.forEach(function(o){
    var monto=o.items.reduce(function(t,it){ return t+n(it.cantidad)*n(it.precio); },0);
    var pend=pendienteOC(o);
    var pil = o.estado==="Recibida"?"ok":o.estado==="Anulada"?"gris":o.estado==="Recibida parcial"?"al":"pri";
    var tarde = pend>0 && o.fechaComprometida && o.fechaComprometida<hoy();
    h+='<tr><td class="mono"><b>'+esc(o.numero)+'</b><div class="mini">'+esc(o.fecha)+'</div></td>'+
      '<td class="mono mini">'+esc(o.solicitudNumero||"—")+'</td>'+
      '<td>'+esc(o.proveedor||"—")+'<div class="mini">'+esc(o.condicion||"")+
        (o.moneda==="USD"? '<div><span class="pill pri">USD a $'+miles(o.tc)+'</span></div>':'')+'</div></td>'+
      '<td>'+chipEmp(o.empresaId)+'<div class="mini">'+esc(nomBase(o.baseId))+'</div></td>'+
      '<td>'+o.items.map(function(it){ var a=art(it.articuloId), p=pendienteItem(it);
        return '<div>'+miles(it.cantidad)+' × '+esc(a?a.descripcion:"?")+
          (n(it.recibidaAcum)>0? (p>0? ' <span class="pill al">entraron '+miles(it.recibidaAcum)+' · faltan '+miles(p)+'</span>'
                                     : ' <span class="pill ok">completo</span>') : '')+'</div>'; }).join("")+'</td>'+
      '<td class="num">'+dual(monto)+'</td>'+
      '<td class="mini">'+(o.fechaComprometida? esc(o.fechaComprometida)+
        (tarde? '<div>'+alerta("VENCIDA")+'</div>':'') : '—')+'</td>'+
      '<td><span class="pill '+pil+'">'+esc(o.estado)+'</span></td>'+
      '<td style="white-space:nowrap">'+(pend>0 && o.estado!=="Anulada"?
        '<button class="btn ok mini" onclick="mRecepcion(\''+o.id+'\')">Recibir</button> '+
        '<button class="btn sec mini" onclick="anularOC(\''+o.id+'\')">Anular</button>':'')+'</td></tr>';
  });
  return h+'</tbody></table></div>';
}
function anularOC(i){
  var o=DB.ordenes.filter(function(x){return x.id==i;})[0]; if(!o) return;
  var v=puedeAnular(o);
  if(v.pidePin){ mPin(function(){anularOC(i);}, "Para anular una orden hay que identificarse."); return; }
  if(!v.ok){
    var u=sesionViva(), gente=quienesPueden("oc_cerrar");
    abrir('<h3>No se puede anular '+esc(o.numero)+'</h3>'+
      '<div class="nota mal"><b>'+esc(u.nombre)+'</b> ('+esc(u.rol||"")+') no puede anular esta orden porque '+
      v.txt+'.</div>'+
      '<p class="mini">La regla es: <b>Compras</b> puede cerrar cualquier orden. El <b>Gerente de Mantenimiento</b> solo puede '+
      'anular las que nacieron en Almacén Central y son de una base o un vehículo a su cargo.</p>'+
      (gente.length? '<p class="mini">Puede hacerlo:</p><div class="barra">'+gente.map(function(x){
        return '<span class="pill pri">'+esc(x.nombre)+' · '+esc(x.rol||"")+'</span>'; }).join(" ")+'</div>':'')+
      '<div class="barra"><div class="sp"></div><button class="btn sec" onclick="cerrar()">Entendido</button>'+
      '<button class="btn" onclick="cerrar();SESION=null;pintarSesion();mPin(null,\'Identificate con el usuario que sí puede.\')">Cambiar de usuario</button></div>');
    return;
  }
  var mot=prompt("¿Por qué se anula "+o.numero+"? (queda registrado)\n\nHabilitado porque "+v.txt+".",
    "El proveedor no puede entregar");
  if(mot===null) return;
  o.anuladaPor=quienOpera(); o.anuladaEn=new Date().toLocaleString("es-AR"); o.anuladaMotivoPermiso=v.txt;
  /* devuelve el saldo no recibido a la solicitud, para poder ordenarlo a otro proveedor */
  if(o.solicitudId){
    var s=DB.solicitudes.filter(function(x){return x.id==o.solicitudId;})[0];
    if(s) o.items.forEach(function(it){
      var ren=s.items.filter(function(x){ return x.articuloId==it.articuloId; })[0];
      if(ren) ren.ordenadaAcum = Math.max(0, n(ren.ordenadaAcum) - pendienteItem(it));
    });
    if(s) s.estado = pendienteSol(s)>0 ? "Autorizada" : s.estado;
  }
  o.estado="Anulada"; o.obs=mot;
  guardar(); render(); aviso(o.numero+" anulada · el saldo volvió a la solicitud");
}

  abrir('<h3>Generar orden de compra</h3>'+
  '<p class="mini" style="margin:0 0 14px">La orden es el compromiso con el proveedor. Desde que se emite, esa plata ya está comprometida '+
  'aunque no se haya pagado — y es el documento contra el que después se recibe.</p>'+
  '<div class="nota">Nace de <b>'+esc(s.numero)+'</b> · '+chipEmp(s.empresaId)+' · '+esc(nomBase(s.baseId))+
    (s.autorizadoPor? '<div class="mini">Autorizada por '+esc(s.autorizadoPor)+' el '+esc(s.autorizadoEn||"")+'</div>':'')+'</div>'+
  '<div class="grid g2">'+
    '<div class="campo"><label>Proveedor</label><input type="text" id="f_oprov" placeholder="Repuestos del Centro"></div>'+
    '<div class="campo"><label>Condición de pago</label><input type="text" id="f_ocond" placeholder="30 días · contado"></div></div>'+
  '<div class="grid g2">'+
    '<div class="campo"><label>Moneda pactada</label><select id="f_omon" onchange="avisoMonedaOC()">'+
      '<option value="ARS">Pesos</option><option value="USD">Dólares</option></select></div>'+
    '<div class="campo"><label>Cotización a congelar</label><input type="number" id="f_otc" value="'+(cotiz()||"")+'">'+
      '<div class="mini" id="avisoTC" style="margin-top:5px"></div></div></div>'+
  '<label>Renglones a ordenar</label>'+
  '<div class="mini" style="margin:-4px 0 8px">Podés ordenar menos de lo pedido: lo que quede sin ordenar sigue pendiente en la solicitud '+
  'y se puede comprar a otro proveedor.</div>'+
  '<div class="scroll"><table><thead><tr><th>Artículo</th><th class="num">Pedido</th><th class="num">Sin ordenar</th>'+
  '<th style="width:100px">Se ordena</th><th style="width:130px">Precio pactado</th></tr></thead><tbody>'+
  pend.map(function(it,k){ var a=art(it.articuloId);
    return '<tr><td><b>'+esc(a?a.descripcion:"?")+'</b><div class="mini mono">'+esc(a?a.codigo:"")+'</div></td>'+
      '<td class="num">'+miles(it.cantidad)+'</td><td class="num"><b>'+miles(pendienteItemSol(it))+'</b></td>'+
      '<td><input type="number" id="oc_cant_'+k+'" value="'+pendienteItemSol(it)+'"></td>'+
      '<td><input type="number" id="oc_prec_'+k+'" value="'+n(it.precioEst)+'"></td></tr>'; }).join("")+
  '</tbody></table></div>'+
  '<div class="grid g2" style="margin-top:12px">'+
    '<div class="campo"><label>Fecha de la orden</label><input type="date" id="f_ofecha" value="'+hoy()+'"></div>'+
    '<div class="campo"><label>Entrega comprometida</label><input type="date" id="f_oentrega"></div></div>'+
  '<div class="campo"><label>Observaciones</label><input type="text" id="f_oobs"></div>'+
  '<div class="barra"><div class="sp"></div><button class="btn sec" onclick="cerrar()">Cancelar</button>'+
  '<button class="btn" onclick="guardarOrden(\''+s.id+'\')">Emitir orden</button></div>', true);
  avisoMonedaOC();
}
function avisoMonedaOC(){
  var d=document.getElementById("avisoTC"); if(!d) return;
  var m=MON();
  if(val("f_omon")==="USD"){
    var vieja = m.fecha && Math.round((new Date(hoy())-new Date(m.fecha))/86400000)>3;
    d.innerHTML = cotiz()
      ? '<span style="color:'+(vieja?"var(--mal)":"var(--ok)")+'">Se congela en la orden: '+esc(m.fuente||"")+
        (m.fecha? " del "+esc(m.fecha):"")+(vieja? " — está desactualizada":"")+'</span>'
      : '<span style="color:var(--mal)">No hay cotización cargada. Cargala en Configuración → Moneda.</span>';
  } else d.innerHTML='<span class="mini">Solo se usa si la orden es en dólares.</span>';
}
function guardarOrden(solId){
  var s=DB.solicitudes.filter(function(x){return x.id==solId;})[0]; if(!s) return;
  var pend=s.items.filter(function(it){ return pendienteItemSol(it)>0; });
  var moneda=val("f_omon")||"ARS", tc=n(val("f_otc"));
  if(moneda==="USD" && !tc) return aviso("Falta la cotización para una orden en dólares");
  var items=[], monto=0;
  pend.forEach(function(it,k){
    var c=n(val("oc_cant_"+k)), p=n(val("oc_prec_"+k));
    if(c<=0) return;
    if(c>pendienteItemSol(it)) { c=pendienteItemSol(it); }
    /* precio: se guarda como lo pactaron y también convertido a pesos con el TC congelado */
    items.push({articuloId:it.articuloId,cantidad:c,precioMoneda:p,
      precio:aPesos(p,moneda,tc),recibidaAcum:0});
    monto+=c*aPesos(p,moneda,tc);
  });
  if(!items.length) return aviso("No hay nada para ordenar");
  var prov=val("f_oprov").trim();
  if(!prov) return aviso("Falta el proveedor: una orden sin proveedor no es una orden");
  if(monto>tope() && !confirm("La orden es por "+pesos(monto)+" y el tope del Gerente de Mantenimiento es "+pesos(tope())+
     ".\nCorresponde a Gerencia General. ¿Emitir igual?")) return;
  DB.seq.oc++;
  var num="OC-"+DB.seq.oc;
  DB.ordenes.push({id:id(),numero:num,fecha:val("f_ofecha")||hoy(),solicitudId:s.id,solicitudNumero:s.numero,
    empresaId:s.empresaId,baseId:s.baseId,proveedor:prov,condicion:val("f_ocond").trim(),
    moneda:moneda,tc:(moneda==="USD"? tc:0),tcFuente:(moneda==="USD"? MON().fuente:""),
    fechaComprometida:val("f_oentrega"),items:items,estado:"Emitida",
    autorizadaPor:s.autorizadoPor||"",obs:val("f_oobs").trim(),recepciones:[]});
  /* descarga la solicitud: lo ordenado ya no está pendiente de ordenar */
  items.forEach(function(it){
    var ren=s.items.filter(function(x){ return x.articuloId==it.articuloId; })[0];
    if(ren) ren.ordenadaAcum = n(ren.ordenadaAcum) + n(it.cantidad);
  });
  s.estado = pendienteSol(s)>0 ? "Ordenada parcial" : "Con orden";
  guardar(); cerrar(); SUB.cmp="oc"; VISTA="solicitudes"; render();
  aviso(num+" emitida por "+pesos(monto));
}

  'para Gerencia General.</p>'+

  '<div class="campo"><label>WhatsApp del gerente (con código de país, sin +)</label>'+

  '<div class="barra"><div class="sp"></div><button class="btn sec" onclick="cerrar()">Cancelar</button>'+

  localStorage.setItem("PANOL_TOPE", n(val("f_tope")));

function tablaSolicitudes(lista){

    '<th>Destino</th><th class="num">Estimado</th><th>Estado</th><th>Espera</th><th></th></tr></thead><tbody>';

    var est = n(s.items.reduce(function(t,it){ return t+n(it.cantidad)*n(it.precioEst); },0));
    var pil = s.estado==="Autorizada"?"ok":s.estado==="Rechazada"?"mal":
      s.estado==="Esperando autorización"?"al":s.estado==="Ordenada parcial"?"al":
      s.estado==="Con orden"?"pri":s.estado==="Cerrada"?"gris":"gris";
    var u = s.unidadId? unidad(s.unidadId):null;
    h+='<tr><td class="mono"><b>'+esc(s.numero)+'</b>'+(s.urgencia==="Urgente"?'<div>'+alerta("URGENTE")+'</div>':'')+'</td>'+
      '<td class="mono">'+esc(s.fecha)+'</td>'+
      '<td>'+chipEmp(s.empresaId)+'<div class="mini">'+esc(nomBase(s.baseId))+'</div></td>'+
      '<td>'+s.items.map(function(it){ var a=art(it.articuloId), sinOrd=pendienteItemSol(it);
        return '<div>'+miles(it.cantidad)+' × '+esc(a?a.descripcion:"?")+
          (n(it.ordenadaAcum)>0? (sinOrd>0
            ? ' <span class="pill al">ordenadas '+miles(it.ordenadaAcum)+' · faltan ordenar '+miles(sinOrd)+'</span>'
            : ' <span class="pill pri">ordenado</span>') : '')+
        '</div>'; }).join("")+
        (ordenesDeSol(s.id).length? '<div class="mini mono">→ '+ordenesDeSol(s.id).map(function(o){
          return esc(o.numero); }).join(", ")+'</div>':'')+'</td>'+
      '<td>'+(u? 'Interno '+esc(u.interno)+(s.ot?' <span class="mini">O.T. '+esc(s.ot)+'</span>':'')
              : '<span class="pill gris">stock de la base</span>')+
        '<div class="mini">'+esc(s.motivo||"")+'</div></td>'+
      '<td class="num">'+pesos(est)+(est>tope()?'<div><span class="pill al">Gerencia General</span></div>':'')+'</td>'+
      '<td><span class="pill '+pil+'">'+esc(s.estado)+'</span>'+
        (s.autorizadoPor?'<div class="mini">'+esc(s.autorizadoPor)+'<br>'+esc(s.autorizadoEn||"")+'</div>':'')+'</td>'+
      '<td>'+esperaSolicitud(s)+'</td>'+
      '<td style="white-space:nowrap">'+
        (s.estado==="Esperando autorización"?
          '<button class="btn sec mini" onclick="waSolicitud(\''+s.id+'\')">WhatsApp</button> '+
          '<button class="btn ok mini" onclick="autorizar(\''+s.id+'\',1)">Autorizar</button> '+
          '<button class="btn mal mini" onclick="autorizar(\''+s.id+'\',0)">Rechazar</button> '
        : (pendienteSol(s)>0 && s.estado!=="Rechazada" && s.estado!=="Cerrada")?
          '<button class="btn mini" onclick="mOrden(\''+s.id+'\')">Generar orden</button> ':'')+
        (s.estado!=="Rechazada" && s.estado!=="Cerrada" && s.estado!=="Recibida" && pendienteSol(s)>0?
          '<button class="btn sec mini" onclick="cerrarSolicitud(\''+s.id+'\')">Cerrar</button>':'')+
      '</td></tr>';
  });
  return h+'</tbody></table></div>';
}

    '<option value="unidad">Un coche en particular</option></select></div>'+

    ["Reposición","Plan preventivo","Correctivo","Proyecto"].map(function(m){return '<option>'+m+'</option>';}).join("")+'</select></div>'+
  '<div class="campo"><label>Urgencia</label><select id="f_surg"><option>Normal</option><option>Urgente</option></select></div></div>'+
  '<div class="grid g2"><div class="campo"><label>O.T. (si aplica)</label><input type="text" id="f_sot"></div>'+
  '<div class="campo"><label>Solicitante</label><input type="text" id="f_ssolic" placeholder="Nombre y taller"></div></div>'+
  '<div class="campo"><label>Área que solicita</label><select id="f_sarea">'+
    ["Almacén Central","Almacén de base","Taller","Oficina Técnica","Compras","Gerencia"].map(function(a){
      return '<option>'+a+'</option>'; }).join("")+'</select>'+
    '<div class="mini" style="margin-top:5px">De dónde nace la necesidad. Define, entre otras cosas, quién puede anular después la orden de compra.</div></div>'+
  '<div id="avisoOtraBase" class="mini"></div>'+
  '<div class="barra"><div class="sp"></div><button class="btn sec" onclick="cerrar()">Cancelar</button>'+

  var s=document.getElementById("f_semp");

  document.getElementById("f_sart").onchange=chequeoOtraBase;
  document.getElementById("f_sbase").onchange=chequeoOtraBase;

function llenarUnidadesSol(){
  var s=document.getElementById("f_sunidad"); if(!s) return;
  var e=val("f_semp");
  s.innerHTML=DB.unidades.filter(function(u){return u.empresaId==e;}).map(function(u){
    return '<option value="'+u.id+'">Interno '+esc(u.interno)+' · '+esc(u.patente||"s/patente")+'</option>'; }).join("")
    || '<option value="">— esta empresa no tiene unidades cargadas —</option>';
}
function cambioDestSol(){
  document.getElementById("cajaSolU").style.display = val("f_sdest")==="unidad"?"":"none";
}
/* la regla del flujo: antes de comprar, mirar si ya está en otra base */
function chequeoOtraBase(){
  var d=document.getElementById("avisoOtraBase"); if(!d) return;
  var a=val("f_sart"), e=val("f_semp"), b=val("f_sbase");
  if(!a||!e){ d.innerHTML=""; return; }
  var otras=basesDe(e).filter(function(x){ return x.id!=b && stock(a,e,x.id)>0; });
  if(otras.length) d.innerHTML='<div class="nota al" style="margin:6px 0 0">⚠ <b>Antes de comprar:</b> '+esc(nomEmp(e))+
    ' ya tiene este artículo en '+otras.map(function(x){ return esc(x.nombre)+' ('+miles(stock(a,e,x.id))+')'; }).join(", ")+
    '. Conviene transferir en vez de comprar.</div>';
  else d.innerHTML="";
}
function guardarSolicitud(){
  var e=val("f_semp"), b=val("f_sbase"), a=val("f_sart"), c=n(val("f_scant"));
  if(!e||!b||!a) return aviso("Faltan empresa, base o artículo");
  if(c<=0) return aviso("Cantidad inválida");
  var d=val("f_sdest");
  DB.seq.sc++;
  DB.solicitudes.push({id:id(),numero:"SC-"+DB.seq.sc,fecha:hoy(),empresaId:e,baseId:b,
    destinoTipo:d,unidadId:d==="unidad"?val("f_sunidad"):"",ot:val("f_sot").trim(),
    motivo:val("f_smotivo"),urgencia:val("f_surg"),solicitante:val("f_ssolic").trim(),
    area:val("f_sarea")||"Almacén Central",
    items:[{articuloId:a,cantidad:c,precioEst:n(val("f_sprecio"))}],
    estado:"Esperando autorización",autorizadoPor:"",autorizadoEn:""});
  guardar(); cerrar(); VISTA="solicitudes"; render();
  aviso("SC-"+DB.seq.sc+" creada · esperando autorización");
}
function autorizar(i,ok){
  if(!permitido("autorizar", function(){autorizar(i,ok);})) return;
  var s=DB.solicitudes.filter(function(x){return x.id==i;})[0]; if(!s) return;
  var quien=prompt(ok?"¿Quién autoriza? (queda registrado con fecha y hora)":"¿Quién rechaza?", "Gerente de Mantenimiento");
  if(quien===null) return;
  var est=n(s.items.reduce(function(t,it){ return t+n(it.cantidad)*n(it.precioEst); },0));
  if(ok && est>tope() && !confirm("El monto ("+pesos(est)+") supera el tope de "+pesos(tope())+
     ".\nEsta compra corresponde a Gerencia General. ¿Registrar igual la autorización?")) return;
  s.estado = ok? "Autorizada":"Rechazada";
  s.autorizadoPor = quien.trim()||"—";
  s.autorizadoEn = new Date().toLocaleString("es-AR");
  s.montoAlAutorizar = est;
  guardar(); render(); aviso(ok?"Autorizada":"Rechazada");
}
/* Cerrar una solicitud = dar por terminado lo que quedó sin comprar.
   No lo puede hacer el auxiliar: es una decisión sobre una necesidad que alguien declaró. */
function cerrarSolicitud(i){
  if(!permitido("sc_cerrar", function(){cerrarSolicitud(i);})) return;
  var s=DB.solicitudes.filter(function(x){return x.id==i;})[0]; if(!s) return;
  var pend=pendienteSol(s);
  var mot=prompt("Se va a cerrar "+s.numero+" con "+miles(pend)+" sin ordenar.\n"+
    "La necesidad queda sin cubrir. ¿Por qué se cierra?","Ya no se necesita");
  if(mot===null) return;
  s.estado="Cerrada"; s.cierreMotivo=mot; s.cierrePor=quienOpera(); s.cierreEn=new Date().toLocaleString("es-AR");
  guardar(); render(); aviso(s.numero+" cerrada");
}
function waSolicitud(i){
  var s=DB.solicitudes.filter(function(x){return x.id==i;})[0]; if(!s) return;
  var u=s.unidadId?unidad(s.unidadId):null;
  var est=n(s.items.reduce(function(t,it){ return t+n(it.cantidad)*n(it.precioEst); },0));
  var t = (s.urgencia==="Urgente"?"🔴 COMPRA URGENTE":"🟡 SOLICITUD DE COMPRA")+" · "+s.numero+"\n"+
    nomEmp(s.empresaId)+" · "+nomBase(s.baseId)+"\n"+
    (u? "Interno "+u.interno+(s.ot?" · O.T. "+s.ot:"")+"\n" : "Reposición de stock de la base\n")+
    s.items.map(function(it){ var a=art(it.articuloId);
      return miles(it.cantidad)+" × "+(a?a.descripcion+" ("+a.codigo+")":"?"); }).join("\n")+"\n"+
    "Estimado: "+pesos(est)+(est>tope()? " — SUPERA EL TOPE, va a Gerencia General":"")+"\n"+
    "Motivo: "+s.motivo+"\nPide: "+(s.solicitante||"—")+"\n\n"+
    "▸ Autorizar o rechazar en el sistema (SC "+s.numero+")";
  var tel=(localStorage.getItem("PANOL_WA")||"").replace(/[^0-9]/g,"");
  var url="https://wa.me/"+tel+"?text="+encodeURIComponent(t);
  window.open(url,"_blank");
  if(!tel) aviso("Cargá el WhatsApp del gerente en 'cambiar' para que vaya directo");
}
function recibirSolicitud(i){
  var s=DB.solicitudes.filter(function(x){return x.id==i;})[0]; if(!s) return;
  var it=s.items[0], a=art(it.articuloId);
  var costo=prompt("Costo unitario real de "+(a?a.descripcion:"")+":", it.precioEst||0);
  if(costo===null) return;
  DB.movimientos.push({id:id(),fecha:hoy(),tipo:"ingreso",articuloId:it.articuloId,empresaId:s.empresaId,
    baseId:s.baseId,cantidad:n(it.cantidad),costoUnit:n(costo),doc:"Recepción "+s.numero,
