/* ── kilómetros ─────────────────────────────────────────────────────────── */
/* Actual: manda el odómetro del surtidor, que es el que se mueve solo.
   El km cargado a mano queda de respaldo para las unidades sin cargas. */
const pmKmActual = (interno, U, combustible, vehiculos) => {
  const V = pgBuscarUnidad(vehiculos, interno);
  let odo = 0, fecha = "";
  (combustible || []).forEach(c => {
    if (!V || !mismoId(c.vehiculo_id, V.id)) return;
    const k = pgNum(c.km_carga);
    if (k > odo) { odo = k; fecha = c.fecha; }
  });
  if (odo > 0) return { km: odo, fuente: "odómetro del surtidor", fecha };
  if (U && pgNum(U.kmManual) > 0) return { km: pgNum(U.kmManual), fuente: "cargado a mano", fecha: "" };
  if (V && pgNum(V.km) > 0) return { km: pgNum(V.km), fuente: "kilometraje de alta", fecha: "" };
  return { km: 0, fuente: "sin datos", fecha: "" };
};

/* Km por día que vienen de Programados, de hoy en adelante.
   Los km de un viaje se reparten parejo entre los días que dura. */
const pmKmProgramados = (interno) => {
  let viajes = [], locs = [], rutas = [], cfg = {};
  try {
    viajes = JSON.parse(almacen.get(PG_LS.viajes) || "[]");
    locs = JSON.parse(almacen.get(PG_LS.locs) || "null") || PG_LOCS_INIT;
    rutas = JSON.parse(almacen.get(PG_LS.rutas) || "null") || PG_RUTAS_INIT;
    cfg = Object.assign({}, PG_CFG_INIT, JSON.parse(almacen.get(PG_LS.cfg) || "{}"));
  } catch (e) { /* sin Programados cargado */ }
  const ctx = { locs, rutas, cfg, vehiculos: [] };
  const hoy = pgHoy();
  const porDia = {};
  let futuros = 0, pasados = 0, kmPasados = 0;
  (viajes || []).forEach(v => {
    if (pgNorm(v.interno) !== pgNorm(interno) || v.estado === "cancelado") return;
    const c = pgCalcular(v, ctx);
    const a = pgFecha(v.fechaInicio); let b = pgFecha(v.fechaFin) || a;
    if (!a) return;
    if (b < a) b = a;
    const dias = pgDiasEntre(a, b) + 1;
    const porJornada = c.km / dias;
    for (let i = 0; i < dias; i++) {
      const d = pgSuma(a, i);
      if (d < hoy) { kmPasados += porJornada; continue; }
      porDia[pgIso(d)] = (porDia[pgIso(d)] || 0) + porJornada;
    }
    if (b >= hoy) futuros++; else pasados++;
  });
  const kmFuturos = Object.keys(porDia).reduce((a, k) => a + porDia[k], 0);
  return { porDia, kmFuturos, viajesFuturos: futuros, kmPasados, viajesPasados: pasados };
};

/* Fecha en la que la unidad va a acumular `faltan` km. Primero gasta los
   viajes ya programados; si se acaban, sigue con el promedio diario. */
const pmFechaEstimada = (faltan, prog, promedioDia) => {
  if (faltan <= 0) return { fecha: null, texto: "vencido", diasRestantes: -1, seguro: true };
  const hoy = pgHoy();
  let acum = 0;
  const claves = Object.keys(prog.porDia).sort();
  for (const k of claves) {
    acum += prog.porDia[k];
    if (acum >= faltan) {
      const d = pgFecha(k);
      return { fecha: d, texto: pgFmtF(d), diasRestantes: pgDiasEntre(hoy, d), seguro: true };
    }
  }
  if (promedioDia > 0) {
    const resto = faltan - acum;
    const ultimo = claves.length ? pgFecha(claves[claves.length - 1]) : hoy;
    const dias = Math.ceil(resto / promedioDia);
    const d = pgSuma(ultimo, dias);
    const restantes = pgDiasEntre(hoy, d);
    // Más allá de dos años la proyección no dice nada útil: estirar un promedio
    // chico a diez años da una fecha exacta y completamente inventada.
    if (restantes > 730) return { fecha: null, texto: "a más de 2 años", diasRestantes: restantes, seguro: false };
    return { fecha: d, texto: pgFmtF(d), diasRestantes: restantes, seguro: false };
  }
  return { fecha: null, texto: "sin viajes cargados", diasRestantes: null, seguro: false };
};

const pmSemaforo = (faltan, cadaKm) => {
  if (faltan <= 0) return { tono: "error", txt: "vencido" };
  if (faltan <= cadaKm * 0.12) return { tono: "alerta", txt: "próximo" };
  return { tono: "ok", txt: "al día" };
};

/* ═══ LÍNEA DE DÍAS LIBRES ════════════════════════════════════════════════
   Una fila por unidad y una celda por día. Rojo = viajando (no se puede pedir
   turno), verde = libre. Encima se marca el turno ya agendado y el día en que
   la unidad llega al service, así se ve de un vistazo si el turno cae bien.  */
const PmVentanas = ({ filas, turnos, dias, onElegir }) => {
  const hoy = pgHoy();
  const desde = hoy, hasta = pgSuma(hoy, (dias || 60) - 1);
  const total = (dias || 60);
  const ancho = Math.max(11, Math.min(26, Math.round(1080 / total)));

  return (
    <Card style={{ marginTop: 20 }}>
      <div style={{ padding: "16px 20px", borderBottom: "1px solid #F1F5F9", display: "flex", alignItems: "center", gap: 12, flexWrap: "wrap" }}>
        <h3 style={{ margin: 0, fontSize: 15, fontWeight: 700, color: "var(--c-primario)" }}>Días libres para pedir turno</h3>
        <span style={{ fontSize: 12, color: "#9CA3AF" }}>próximos {total} días · sale de los viajes de Programados</span>
        <span style={{ marginLeft: "auto", fontSize: 11.5, color: "#6B7280", display: "flex", gap: 14, flexWrap: "wrap" }}>
          <span><span style={{ display: "inline-block", width: 11, height: 11, background: "#16A34A", opacity: .35, borderRadius: 2, verticalAlign: -1, marginRight: 4 }} />libre</span>
          <span><span style={{ display: "inline-block", width: 11, height: 11, background: "#DC2626", opacity: .75, borderRadius: 2, verticalAlign: -1, marginRight: 4 }} />viajando</span>
          <span><span style={{ display: "inline-block", width: 11, height: 11, background: "var(--c-primario)", borderRadius: 2, verticalAlign: -1, marginRight: 4 }} />turno agendado</span>
          <span><span style={{ display: "inline-block", width: 11, height: 11, background: "#E8A020", borderRadius: 2, verticalAlign: -1, marginRight: 4 }} />llega al service</span>
        </span>
      </div>
      <div style={{ overflowX: "auto" }}>
        <div style={{ minWidth: 150 + total * ancho }}>
          <div style={{ display: "flex", background: "#F8FAFC", borderBottom: "1px solid #E5E7EB" }}>
            <div style={{ width: 150, flexShrink: 0, padding: "7px 12px", fontSize: 11, fontWeight: 700, color: "#6B7280", borderRight: "1px solid #E5E7EB" }}>Unidad</div>
            {Array.from({ length: total }, (_, i) => {
              const d = pgSuma(desde, i), we = d.getDay() === 0 || d.getDay() === 6;
              return <div key={i} style={{ width: ancho, flexShrink: 0, textAlign: "center", fontSize: 9, color: "#9CA3AF", padding: "5px 0", background: we ? "#EEF2F8" : "transparent" }}>
                {(i === 0 || d.getDate() === 1) && <div style={{ fontSize: 9.5, fontWeight: 700, color: "#6B7280" }}>{PG_MESC[d.getMonth()]}</div>}
                {d.getDate()}
              </div>;
            })}
          </div>
          {filas.map(f => {
            const ocup = pgDiasOcupados(f.U.interno);
            const libres = pgVentanasLibres(f.U.interno, desde, hasta, 1);
            const misTurnos = {};
            turnos.filter(t => pgNorm(t.interno) === pgNorm(f.U.interno)).forEach(t => { misTurnos[t.fecha] = t; });
            // el service más urgente y el día en que la unidad lo alcanza
            const crit = f.critico;
            const diaService = crit && crit.est && crit.est.fecha ? pgIso(crit.est.fecha) : null;
            const mayor = libres.slice().sort((a, b) => b.dias - a.dias)[0];
            return (
              <div key={f.U.id} style={{ display: "flex", borderBottom: "1px solid #F1F5F9", alignItems: "stretch" }}>
                <div style={{ width: 150, flexShrink: 0, padding: "8px 12px", borderRight: "1px solid #E5E7EB" }}>
                  <div style={{ fontSize: 12.5, fontWeight: 700 }}>{f.U.interno}</div>
                  <div style={{ fontSize: 10, color: "#9CA3AF" }}>
                    {crit ? (crit.faltan <= 0 ? "service vencido" : `${crit.nombre} en ${pgMiles(crit.faltan)} km`) : "sin plan"}
                  </div>
                  {mayor && (mayor.dias >= total
                    ? <div style={{ fontSize: 10, color: "#9CA3AF" }}>sin viajes cargados: libre todo el período</div>
                    : <div style={{ fontSize: 10, color: "#16A34A", fontWeight: 600 }}>mejor ventana: {mayor.dias} d desde {pgFmtF(mayor.desde)}</div>)}
                </div>
                <div style={{ display: "flex" }}>
                  {Array.from({ length: total }, (_, i) => {
                    const d = pgSuma(desde, i), iso = pgIso(d);
                    const viaja = !!ocup[iso], turno = misTurnos[iso], service = iso === diaService;
                    const we = d.getDay() === 0 || d.getDay() === 6;
                    let fondo = we ? "#F1F5F9" : "#F8FDF9";
                    if (!viaja) fondo = "rgba(22,163,74,.18)";
                    if (viaja) fondo = "rgba(220,38,38,.68)";
                    if (service) fondo = "#E8A020";
                    if (turno) fondo = "var(--c-primario)";
                    const tit = turno ? `Turno agendado: ${turno.concesionario} ${turno.hora}`
                      : service ? `Acá llega al ${crit.nombre}`
                      : viaja ? `Viajando: ${ocup[iso].origen} → ${ocup[iso].destino}`
                      : "Libre — se puede pedir turno";
                    return (
                      <div key={i} title={`${pgFmtF(d)} · ${tit}`}
                        onClick={() => { if (!viaja && onElegir) onElegir(f.U.interno, iso); }}
                        style={{ width: ancho, flexShrink: 0, minHeight: 30, background: fondo,
                          borderRight: "1px solid rgba(255,255,255,.7)", cursor: viaja ? "not-allowed" : "pointer" }} />
                    );
                  })}
                </div>
              </div>
            );
          })}
        </div>
      </div>
      <div style={{ padding: "14px 20px", borderTop: "1px solid #F1F5F9", fontSize: 12, color: "#9CA3AF", lineHeight: 1.7 }}>
        Hacé clic en cualquier día verde y se abre el turno con esa unidad y esa fecha ya puestas.
        Los días rojos no se pueden elegir: la unidad está de viaje. Si el cuadrado naranja cae sobre una racha roja,
        esa unidad llega al service estando en ruta y hay que mover algo — o el viaje, o adelantar el service.
      </div>
    </Card>
  );
};

/* ═══ MÓDULO ═══════════════════════════════════════════════════════════════ */
const PlanMantenimiento = ({ vehiculos, combustible, mantenimiento }) => {
  /* v1.2 (HSI) — sin datos de referencia: la app arranca sin ningún plan
     precargado; los planes se crean a mano o llegan de la planilla. */
  const [planes, setPlanes] = useState(() => pgLeer(PM_LS.planes, []));
  const [unidades, setUnidades] = useState(() => pgLeer(PM_LS.unidades, []));
  const [turnos, setTurnos] = useState(() => pgLeer(PM_LS.turnos, []));
  const [vista, setVista] = useState("estado");
  const [planActivo, setPlanActivo] = useState(() => (pgLeer(PM_LS.planes, [])[0] || {}).id);
  const [modalU, setModalU] = useState(null);
  const [modalT, setModalT] = useState(null);
  const [pegar, setPegar] = useState("");

  useEffect(() => { pgGuardar(PM_LS.planes, planes); }, [planes]);
  useEffect(() => { pgGuardar(PM_LS.unidades, unidades); }, [unidades]);
  useEffect(() => { pgGuardar(PM_LS.turnos, turnos); }, [turnos]);

  /* ── La misma planilla que Programados ────────────────────────────────────
     El plan de mantenimiento va a las hojas PlanMant, PlanUnidades y
     PlanTurnos del MISMO Sheet de Programados: es una sola URL para toda la
     operación de viajes y taller. Necesita el conector v1.3 o superior; con
     uno anterior esas hojas no existen y el guardado avisa el error tal cual
     lo devuelve el script. */
  const apiPM = almacen.get(PG_LS.api) || "";
  const [sincPM, setSincPM] = useState({ estado: "", texto: "" });
  const cargadoPM = useRef(false);
  const timerPM = useRef(null);
  const firmaPM = useRef("");

  const traerPlanDelSheet = (url) => {
    const u = (url || apiPM || "").trim();
    if (!u) { setSincPM({ estado: "error", texto: "Todavía no configuraste la planilla en Programados → Ajustes." }); return; }
    setSincPM({ estado: "cargando", texto: "Trayendo el plan…" });
    fetch(u + (u.indexOf("?") > -1 ? "&" : "?") + "accion=leer")
      .then(r => r.json())
      .then(res => {
        if (!res || res.ok === false) throw new Error((res && res.error) || "respuesta inválida");
        const d = res.datos || res;
        /* Si la planilla no tiene nada del plan y acá sí hay, no se pisa:
           casi siempre significa que todavía no se subió, no que se borró. */
        const nada = !(d.planes || []).length && !(d.planUnidades || []).length && !(d.turnos || []).length;
        if (nada && (planes.length || unidades.length || turnos.length)) {
          cargadoPM.current = true;
          setSincPM({ estado: "error", texto: "La planilla todavía no tiene el plan. No toqué nada: usá «Subir el plan a la planilla»." });
          return;
        }
        if (Array.isArray(d.planes) && d.planes.length) {
          setPlanes(d.planes.map(P => ({ ...P, servicios: Array.isArray(P.servicios) ? P.servicios : [] })));
          if (!d.planes.some(P => P.id === planActivo)) setPlanActivo(d.planes[0].id);
        }
        if (Array.isArray(d.planUnidades)) setUnidades(d.planUnidades.map(U => ({ ...U, ultimos: (U.ultimos && typeof U.ultimos === "object") ? U.ultimos : {} })));
        if (Array.isArray(d.turnos)) setTurnos(d.turnos);
        cargadoPM.current = true;
        setSincPM({ estado: "ok", texto: "Sincronizado " + new Date().toLocaleTimeString("es-AR", { hour: "2-digit", minute: "2-digit" }) });
      })
      .catch(e => { cargadoPM.current = true; setSincPM({ estado: "error", texto: "No se pudo leer la planilla. " + e }); });
  };
  useEffect(() => { if (apiPM) traerPlanDelSheet(apiPM); else cargadoPM.current = true; }, []);

  const cuerpoPM = () => JSON.stringify({ accion: "guardarTodo", planes, planUnidades: unidades, turnos });

  useEffect(() => {
    if (!apiPM || !cargadoPM.current) return;
    const cuerpo = cuerpoPM();
    if (cuerpo === firmaPM.current) return;
    if (timerPM.current) clearTimeout(timerPM.current);
    timerPM.current = setTimeout(() => {
      setSincPM({ estado: "guardando", texto: "Guardando…" });
      fetch(apiPM, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: cuerpo })
        .then(r => r.json())
        .then(res => {
          if (res && res.ok === false) throw new Error(res.error || "el script devolvió un error");
          firmaPM.current = cuerpo;
          setSincPM({ estado: "ok", texto: "Guardado " + new Date().toLocaleTimeString("es-AR", { hour: "2-digit", minute: "2-digit" }) });
        })
        .catch(e => setSincPM({ estado: "error", texto: "Se guardó en este equipo, pero no en la planilla. " + e }));
    }, 1200);
    return () => { if (timerPM.current) clearTimeout(timerPM.current); };
  }, [planes, unidades, turnos, apiPM]);

  const subirPlan = () => {
    const u = (apiPM || "").trim();
    if (!u) { setSincPM({ estado: "error", texto: "Primero pegá la URL en Programados → Ajustes." }); return; }
    setSincPM({ estado: "guardando", texto: "Subiendo el plan…" });
    const cuerpo = cuerpoPM();
    fetch(u, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: cuerpo })
      .then(r => r.text())
      .then(txt => {
        let res = null;
        try { res = JSON.parse(txt); } catch (e) {
          throw new Error("El script no devolvió datos. Suele ser que la implementación quedó en una versión vieja: en Apps Script, Implementar → Administrar implementaciones → lápiz → Versión: Nueva.");
        }
        if (!res || res.ok === false) throw new Error((res && res.error) || "el script devolvió un error sin detalle");
        firmaPM.current = cuerpo; cargadoPM.current = true;
        const f = res.filas || {};
        setSincPM({ estado: "ok", texto: `Subido: ${f.planes != null ? f.planes : planes.length} plan(es), ${f.planUnidades != null ? f.planUnidades : unidades.length} unidad(es) y ${f.turnos != null ? f.turnos : turnos.length} turno(s).` });
      })
      .catch(e => setSincPM({ estado: "error", texto: String(e.message || e) }));
  };
  const colorPM = sincPM.estado === "error" ? "#DC2626" : sincPM.estado === "ok" ? "#16A34A" : "#E8A020";

  const plan = planes.find(p => p.id === planActivo) || planes[0];
  const misUnidades = unidades.filter(u => !plan || u.planId === plan.id);

  /* ── cálculo central: una fila por unidad, con todos sus services ────── */
  const filas = misUnidades.map(U => {
    const act = pmKmActual(U.interno, U, combustible, vehiculos);
    const prog = pmKmProgramados(U.interno);
    // promedio de km por día: lo que ya viajó en los últimos 90 días programados
    const promedio = prog.kmPasados > 0 ? prog.kmPasados / 90 : (prog.kmFuturos > 0 ? prog.kmFuturos / 90 : 0);
    const servicios = (plan ? plan.servicios : []).map(s => {
      const ultimo = pgNum((U.ultimos || {})[s.codigo]);
      const proximo = ultimo > 0 ? ultimo + pgNum(s.cadaKm) : pgNum(s.cadaKm);
      const faltan = proximo - act.km;
      const est = pmFechaEstimada(faltan, prog, promedio);
      return { ...s, ultimo, proximo, faltan, est, sem: pmSemaforo(faltan, pgNum(s.cadaKm)) };
    });
    const critico = servicios.slice().sort((a, b) => a.faltan - b.faltan)[0];
    return { U, act, prog, promedio, servicios, critico };
  }).sort((a, b) => (a.critico ? a.critico.faltan : 9e9) - (b.critico ? b.critico.faltan : 9e9));

  const vencidos = filas.filter(f => f.critico && f.critico.faltan <= 0).length;
  const proximos = filas.filter(f => f.critico && f.critico.faltan > 0 && f.critico.sem.tono === "alerta").length;
  const sinProg = filas.filter(f => f.prog.viajesFuturos === 0).length;

  /* ── pegar el bloque de la planilla técnica ──────────────────────────── */
  const importarBloque = () => {
    if (!plan) return;
    const lineas = pegar.replace(/\r/g, "").split("\n").filter(l => l.trim() && l.replace(/[,;\t\s]/g, ""));
    const nuevas = [];
    lineas.forEach(l => {
      const c = l.split(/\t|;|,/).map(x => x.trim());
      // se busca la primera celda que parezca un número de interno (4-6 dígitos)
      const iInt = c.findIndex(x => /^\d{4,6}$/.test(x));
      if (iInt < 0) return;
      const nums = c.slice(iInt).map(x => pgNum(x));
      const interno = c[iInt];
      const kmActual = nums[1] || 0;
      // después del km actual vienen pares (último service, km que faltan)
      const ult = {};
      plan.servicios.forEach((s, i) => { ult[s.codigo] = nums[2 + i * 2] || 0; });
      const predio = c.slice(iInt).find(x => /^[A-Za-zÁÉÍÓÚÑ ]{4,}$/.test(x)) || "";
      nuevas.push({ id: "pu_" + interno + "_" + nuevas.length, planId: plan.id, interno,
                    kmManual: kmActual, predio: predio.toUpperCase(), chasis: "", patente: "", ultimos: ult });
    });
    if (!nuevas.length) { alert("No pude leer ninguna fila. Fijate que cada renglón arranque con el número interno."); return; }
    setUnidades(prev => [...prev.filter(u => !(u.planId === plan.id && nuevas.some(n => pgNorm(n.interno) === pgNorm(u.interno)))), ...nuevas]);
    setPegar("");
    alert(`Listo: ${nuevas.length} unidad(es) cargadas en el plan ${plan.nombre}.`);
  };

  const registrarService = (U, codigo, km) => {
    setUnidades(prev => prev.map(x => x.id === U.id
      ? { ...x, ultimos: { ...(x.ultimos || {}), [codigo]: pgNum(km) } } : x));
  };

  return (
    <div>
      <SectionHeader
        title="Plan de mantenimiento"
        sub={plan ? `${plan.nombre} · ${misUnidades.length} unidad(es) · los kilómetros que faltan salen del odómetro, y la fecha, de los viajes de Programados`
                  : "Todavía no hay ningún plan cargado"}
        action="Agendar turno" onAction={() => setModalT({ interno: "", codigo: plan && plan.servicios[0] ? plan.servicios[0].codigo : "", fecha: pgIso(pgHoy()), hora: "08:00", concesionario: PM_CONCESIONARIOS[0], predio: "", estado: "agendado", notas: "" })}
        extra={planes.length > 1 && (
          <select value={planActivo} onChange={e => setPlanActivo(e.target.value)}
            style={{ padding: "9px 12px", border: "1.5px solid #E5E7EB", borderRadius: 8, fontSize: 13, fontWeight: 600, background: "#fff", fontFamily: "inherit" }}>
            {planes.map(p => <option key={p.id} value={p.id}>{p.nombre}</option>)}
          </select>
        )} />

      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit,minmax(230px,1fr))", gap: 16, marginBottom: 20 }}>
        <KpiCard label="Unidades en el plan" value={misUnidades.length} icon="truck" color="var(--c-primario)"
          sub={plan ? plan.servicios.length + " tipos de service" : "—"} />
        <KpiCard label="Services vencidos" value={vencidos} icon="alert" color={vencidos ? "#DC2626" : "#16A34A"}
          sub={vencidos ? "pasaron el kilometraje" : "ninguno pasado"} />
        <KpiCard label="Próximos a vencer" value={proximos} icon="reloj" color="#E8A020"
          sub="dentro del 12% del intervalo" />
        <KpiCard label="Turnos agendados" value={turnos.filter(t => t.estado === "agendado").length} icon="parte" color="#3B82F6"
          sub={sinProg ? sinProg + " unidad(es) sin viajes programados" : "todas con viajes cargados"} />
      </div>

      <div style={{ display: "flex", gap: 4, background: "#fff", border: "1px solid #E5E7EB", borderRadius: 10, padding: 4, marginBottom: 20, flexWrap: "wrap" }}>
        {[["estado", "Estado de la flota"], ["detalle", "Detalle por unidad"], ["turnos", "Turnos"]].map(([id, lab]) => (
          <button key={id} onClick={() => setVista(id)}
            style={{ padding: "7px 14px", borderRadius: 7, border: "none", cursor: "pointer", fontSize: 12.5,
              background: vista === id ? "var(--c-primario)" : "transparent", color: vista === id ? "#fff" : "#6B7280", fontWeight: vista === id ? 700 : 600 }}>
            {lab}
          </button>
        ))}
        {sincPM.texto && (
          <span title={sincPM.texto} style={{ marginLeft: "auto", display: "flex", alignItems: "center", gap: 6, fontSize: 11, fontWeight: 600, color: colorPM, maxWidth: 380, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>
            <span style={{ width: 7, height: 7, borderRadius: "50%", background: colorPM, flexShrink: 0 }} />
            {sincPM.texto}
          </span>
        )}
        {/* La configuración del plan va sola a la derecha: se toca al principio
            y después casi nunca, así que no compite con las tres de trabajo. */}
        <button onClick={() => setVista("ajustes")}
          style={{ marginLeft: sincPM.texto ? 8 : "auto", display: "flex", alignItems: "center", gap: 6,
            padding: "7px 14px", borderRadius: 7, border: "none", cursor: "pointer", fontSize: 12.5,
            background: vista === "ajustes" ? "var(--c-primario)" : "transparent",
            color: vista === "ajustes" ? "#fff" : "#6B7280", fontWeight: vista === "ajustes" ? 700 : 600 }}>
          <Icon name="wrench" size={14} color={vista === "ajustes" ? "#fff" : "#6B7280"} />
          Ajustes
        </button>
      </div>

      {/* ── ESTADO DE LA FLOTA: la planilla técnica, viva ─────────────── */}
      {vista === "estado" && (
        <Card>
          <div style={{ padding: "16px 20px", borderBottom: "1px solid #F1F5F9", display: "flex", alignItems: "center", gap: 12, flexWrap: "wrap" }}>
            <h3 style={{ margin: 0, fontSize: 15, fontWeight: 700, color: "var(--c-primario)" }}>Kilómetros que faltan para cada service</h3>
            <span style={{ marginLeft: "auto", fontSize: 11.5, color: "#9CA3AF" }}>
              ordenado por urgencia · en cada celda, los km que faltan y la fecha estimada
            </span>
          </div>
          <Table headers={["Interno", "Predio", "Km actuales", ...(plan ? plan.servicios.map(s => `${s.nombre} · ${pgMiles(s.cadaKm)}`) : [])]}>
            {filas.map(f => (
              <TR key={f.U.id}>
                <TD bold>{f.U.interno}<div style={{ fontSize: 10.5, color: "#9CA3AF", fontWeight: 400 }}>{f.U.patente}</div></TD>
                <TD><span style={{ fontSize: 11.5, color: "#6B7280" }}>{f.U.predio}</span></TD>
                <TD>
                  <div style={{ fontWeight: 600 }}>{pgMiles(f.act.km)}</div>
                  <div style={{ fontSize: 10.5, color: "#9CA3AF" }}>{f.act.fuente}</div>
                </TD>
                {f.servicios.map(s => (
                  <TD key={s.codigo}>
                    <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
                      <span style={{ width: 7, height: 7, borderRadius: "50%", flexShrink: 0,
                        background: s.sem.tono === "error" ? "#DC2626" : s.sem.tono === "alerta" ? "#E8A020" : "#16A34A" }} />
                      <strong style={{ color: s.sem.tono === "error" ? "#DC2626" : "#111827" }}>
                        {s.faltan <= 0 ? "vencido" : pgMiles(s.faltan) + " km"}
                      </strong>
                    </div>
                    <div style={{ fontSize: 10.5, color: "#9CA3AF" }}>
                      {s.faltan <= 0 ? `pasó ${pgMiles(-s.faltan)} km`
                        : s.est.fecha ? (s.est.seguro ? "≈ " : "~ ") + s.est.texto : s.est.texto}
                    </div>
                  </TD>
                ))}
              </TR>
            ))}
            {!filas.length && (
              <tr><td colSpan={3 + (plan ? plan.servicios.length : 0)} style={{ padding: "34px 14px", textAlign: "center", color: "#9CA3AF", fontSize: 13 }}>
                Todavía no asignaste unidades a este plan. Andá a <strong>Unidades del plan</strong>: podés pegar el bloque de tu planilla técnica y quedan cargadas de una.
              </td></tr>
            )}
          </Table>
          <div style={{ padding: "14px 20px", borderTop: "1px solid #F1F5F9", fontSize: 12, color: "#9CA3AF", lineHeight: 1.7 }}>
            <strong>Cómo leer las fechas.</strong> Las que empiezan con <strong>≈</strong> salen de viajes que ya tenés cargados en Programados:
            son las firmes. Las que empiezan con <strong>~</strong> son una proyección con el promedio de kilómetros por día de esa unidad,
            porque los viajes cargados no alcanzan a cubrir lo que falta. Cuantos más viajes cargues en Programados, más lejos ve esta columna.
          </div>
        </Card>
      )}

      {/* ── DETALLE POR UNIDAD ───────────────────────────────────────── */}
      {vista === "detalle" && (
        <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit,minmax(360px,1fr))", gap: 20, alignItems: "start" }}>
          {filas.map(f => (
            <Card key={f.U.id}>
              <div style={{ padding: "16px 20px", borderBottom: "1px solid #F1F5F9", display: "flex", alignItems: "center", gap: 10 }}>
                <div>
                  <h3 style={{ margin: 0, fontSize: 15, fontWeight: 700, color: "var(--c-primario)" }}>Interno {f.U.interno}</h3>
                  <span style={{ fontSize: 11.5, color: "#9CA3AF" }}>
                    {f.U.patente || "sin patente"} · chasis {f.U.chasis || "—"} · {f.U.predio || "sin predio"}
                  </span>
                </div>
                <button onClick={() => setModalU(f.U)} style={{ marginLeft: "auto", background: "none", border: "none", cursor: "pointer", color: "var(--c-primario)", fontSize: 12, fontWeight: 600 }}>Editar</button>
              </div>
              <div style={{ padding: "12px 20px", background: "#F8FAFC", fontSize: 12, color: "#6B7280", display: "flex", gap: 16, flexWrap: "wrap" }}>
                <span><strong style={{ color: "#111827" }}>{pgMiles(f.act.km)} km</strong> actuales</span>
                <span>{f.prog.viajesFuturos} viaje(s) por delante</span>
                <span><strong style={{ color: "#111827" }}>{pgMiles(f.prog.kmFuturos)} km</strong> programados</span>
                {f.promedio > 0 && <span>{pgMiles(f.promedio)} km/día promedio</span>}
              </div>
              <div style={{ padding: "8px 20px 16px" }}>
                {f.servicios.map(s => {
                  const pct = Math.max(0, Math.min(100, (1 - s.faltan / pgNum(s.cadaKm)) * 100));
                  const col = s.sem.tono === "error" ? "#DC2626" : s.sem.tono === "alerta" ? "#E8A020" : "#16A34A";
                  return (
                    <div key={s.codigo} style={{ marginTop: 12 }}>
                      <div style={{ display: "flex", justifyContent: "space-between", fontSize: 12.5, marginBottom: 4 }}>
                        <span><strong>{s.nombre}</strong> <span style={{ color: "#9CA3AF" }}>cada {pgMiles(s.cadaKm)} km</span></span>
                        <span style={{ color: col, fontWeight: 700 }}>
                          {s.faltan <= 0 ? `vencido por ${pgMiles(-s.faltan)} km` : `faltan ${pgMiles(s.faltan)} km`}
                        </span>
                      </div>
                      <div style={{ height: 7, background: "#F1F5F9", borderRadius: 99 }}>
                        <div style={{ height: "100%", width: pct.toFixed(1) + "%", background: col, borderRadius: 99 }} />
                      </div>
                      <div style={{ display: "flex", justifyContent: "space-between", fontSize: 10.5, color: "#9CA3AF", marginTop: 3 }}>
                        <span>último: {s.ultimo > 0 ? pgMiles(s.ultimo) + " km" : "nunca se hizo"} · próximo: {pgMiles(s.proximo)} km</span>
                        <span>
                          {s.est.fecha ? (s.est.seguro ? "≈ " : "~ ") + s.est.texto : s.est.texto}
                          <button onClick={() => {
                            const km = prompt(`¿A qué kilometraje se hizo el ${s.nombre} de la unidad ${f.U.interno}?`, String(f.act.km));
                            if (km !== null) registrarService(f.U, s.codigo, km);
                          }} style={{ marginLeft: 8, background: "none", border: "none", cursor: "pointer", color: "var(--c-primario)", fontSize: 10.5, fontWeight: 700 }}>registrar</button>
                        </span>
                      </div>
                    </div>
                  );
                })}
              </div>
            </Card>
          ))}
        </div>
      )}

      {/* ── TURNOS ───────────────────────────────────────────────────── */}
      {vista === "turnos" && (
        <>
        <Card>
          <div style={{ padding: "16px 20px", borderBottom: "1px solid #F1F5F9", display: "flex", alignItems: "center", gap: 12 }}>
            <h3 style={{ margin: 0, fontSize: 15, fontWeight: 700, color: "var(--c-primario)" }}>Turnos con el concesionario</h3>
            <span style={{ fontSize: 12, color: "#9CA3AF" }}>{turnos.length} cargado(s)</span>
          </div>
          <Table headers={["Fecha", "Hora", "Interno", "Patente", "Service", "Concesionario", "Estado", "Notas", ""]}>
            {turnos.slice().sort((a, b) => String(a.fecha).localeCompare(String(b.fecha))).map(t => {
              const U = unidades.find(u => pgNorm(u.interno) === pgNorm(t.interno));
              const S = plan && plan.servicios.find(s => s.codigo === t.codigo);
              const pasado = pgFecha(t.fecha) && pgFecha(t.fecha) < pgHoy();
              return (
                <TR key={t.id}>
                  <TD bold>{pgFmtF(t.fecha)}</TD>
                  <TD>{t.hora}</TD>
                  <TD bold>{t.interno}</TD>
                  <TD>{U ? U.patente : ""}</TD>
                  <TD>{S ? S.nombre : t.codigo}</TD>
                  <TD>{t.concesionario}{t.predio ? <span style={{ color: "#9CA3AF" }}> · {t.predio}</span> : null}</TD>
                  <TD>{t.estado === "cumplido" ? <PgChip tono="ok">cumplido</PgChip>
                    : pasado ? <PgChip tono="error">se pasó la fecha</PgChip> : <PgChip tono="info">agendado</PgChip>}
                    {pgDiasOcupados(t.interno)[t.fecha] && t.estado !== "cumplido" && (
                      <div style={{ marginTop: 3 }}><PgChip tono="error">pisa un viaje</PgChip></div>
                    )}</TD>
                  <TD><span style={{ fontSize: 11.5, color: "#6B7280" }}>{t.notas}</span></TD>
                  <TD style={{ whiteSpace: "nowrap" }}>
                    <button onClick={() => setModalT(t)} style={{ background: "none", border: "none", cursor: "pointer", color: "var(--c-primario)", fontSize: 12, fontWeight: 600, marginRight: 8 }}>Editar</button>
                    <button onClick={() => { if (confirm("¿Borrar el turno?")) setTurnos(p => p.filter(x => x.id !== t.id)); }}
                      style={{ background: "none", border: "none", cursor: "pointer", color: "#DC2626", fontSize: 12, fontWeight: 600 }}>Borrar</button>
                  </TD>
                </TR>
              );
            })}
            {!turnos.length && (
              <tr><td colSpan={9} style={{ padding: "30px 14px", textAlign: "center", color: "#9CA3AF", fontSize: 13 }}>
                Sin turnos cargados. Usá «Agendar turno» arriba a la derecha, o hacé clic en un día verde de la línea de abajo.
              </td></tr>
            )}
          </Table>
        </Card>
        <PmVentanas filas={filas} turnos={turnos} dias={60}
          onElegir={(interno, iso) => setModalT({ interno, codigo: plan && plan.servicios[0] ? plan.servicios[0].codigo : "",
            fecha: iso, hora: "08:00", concesionario: PM_CONCESIONARIOS[0], predio: "", estado: "agendado", notas: "" })} />
        </>
      )}

      {/* ── PLAN E INTERVALOS ────────────────────────────────────────── */}
      {vista === "ajustes" && (
        <>
          <Card style={{ marginBottom: 20 }}>
            <div style={{ padding: "16px 20px" }}>
              <div style={{ display: "flex", alignItems: "center", gap: 12, flexWrap: "wrap", marginBottom: 10 }}>
                <h3 style={{ margin: 0, fontSize: 15, fontWeight: 700, color: "var(--c-primario)" }}>La planilla del plan</h3>
                {sincPM.texto && (
                  <span style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 11.5, fontWeight: 600, color: colorPM }}>
                    <span style={{ width: 7, height: 7, borderRadius: "50%", background: colorPM }} />
                    {sincPM.texto}
                  </span>
                )}
                <div style={{ marginLeft: "auto", display: "flex", gap: 8, flexWrap: "wrap" }}>
                  <button onClick={() => traerPlanDelSheet(apiPM)} disabled={!apiPM}
                    style={{ padding: "7px 14px", borderRadius: 8, border: "1.5px solid #E5E7EB", background: "#fff", fontSize: 12.5, fontWeight: 600, cursor: apiPM ? "pointer" : "not-allowed", color: apiPM ? "#374151" : "#9CA3AF" }}>
                    Traer de la planilla
                  </button>
                  <button onClick={subirPlan} disabled={!apiPM}
                    style={{ padding: "7px 14px", borderRadius: 8, border: "none", background: apiPM ? "var(--c-primario)" : "#CBD5E1", color: "#fff", fontSize: 12.5, fontWeight: 600, cursor: apiPM ? "pointer" : "not-allowed" }}>
                    Subir el plan a la planilla
                  </button>
                </div>
              </div>
              <div style={{ fontSize: 12.5, color: "#6B7280", lineHeight: 1.7 }}>
                {apiPM
                  ? <>El plan, las unidades y los turnos se guardan solos en las hojas <strong>PlanMant</strong>, <strong>PlanUnidades</strong> y <strong>PlanTurnos</strong> de la misma planilla de Programados. Si esas hojas no existen todavía, en la planilla andá al menú <strong>Programados → Preparar hojas</strong>. Hace falta el conector <strong>v1.3</strong> o superior.</>
                  : <>Todavía no hay planilla configurada, así que el plan se guarda <strong>solo en esta computadora</strong>. Para compartirlo, pegá la URL del script en <strong>Programados → Ajustes</strong>: es la misma para las dos pantallas.</>}
              </div>
            </div>
          </Card>

          <div style={{ fontSize: 12.5, color: "#9CA3AF", margin: "0 0 14px", lineHeight: 1.7 }}>
            Acá se configura el plan: cada cuántos kilómetros va cada service, y qué unidades lo siguen.
            Se toca al dar de alta una marca nueva o al sumar una unidad; el trabajo del día a día está en las otras tres pestañas.
          </div>
          {plan && <Card style={{ marginBottom: 20 }}>
            <div style={{ padding: "16px 20px", borderBottom: "1px solid #F1F5F9", display: "flex", alignItems: "center", gap: 12, flexWrap: "wrap" }}>
              <h3 style={{ margin: 0, fontSize: 15, fontWeight: 700, color: "var(--c-primario)" }}>Services del plan {plan.nombre}</h3>
              <button onClick={() => setPlanes(p => p.map(x => x.id === plan.id
                ? { ...x, servicios: [...x.servicios, { codigo: "NUEVO", nombre: "Service nuevo", cadaKm: 0 }] } : x))}
                style={{ marginLeft: "auto", padding: "7px 14px", borderRadius: 8, border: "none", background: "var(--c-primario)", color: "#fff", fontSize: 12.5, fontWeight: 600, cursor: "pointer" }}>+ Agregar service</button>
            </div>
            <Table headers={["Código", "Nombre", "Cada cuántos km", ""]}>
              {plan.servicios.map((s, i) => {
                const set = (k, v) => setPlanes(p => p.map(x => x.id === plan.id
                  ? { ...x, servicios: x.servicios.map((y, j) => j === i ? { ...y, [k]: v } : y) } : x));
                return (
                  <TR key={i}>
                    <TD><Input value={s.codigo} onChange={e => set("codigo", e.target.value.toUpperCase())} style={{ padding: "6px 9px", width: 100 }} /></TD>
                    <TD><Input value={s.nombre} onChange={e => set("nombre", e.target.value)} style={{ padding: "6px 9px" }} /></TD>
                    <TD><Input value={s.cadaKm} onChange={e => set("cadaKm", pgNum(e.target.value))} style={{ padding: "6px 9px", width: 120 }} /></TD>
                    <TD><button onClick={() => setPlanes(p => p.map(x => x.id === plan.id ? { ...x, servicios: x.servicios.filter((y, j) => j !== i) } : x))}
                      style={{ background: "none", border: "none", cursor: "pointer", color: "#DC2626", fontSize: 12, fontWeight: 600 }}>Borrar</button></TD>
                  </TR>
                );
              })}
            </Table>
            <div style={{ padding: "14px 20px", borderTop: "1px solid #F1F5F9", fontSize: 12, color: "#9CA3AF", lineHeight: 1.7 }}>
              Si cambiás un intervalo, todas las unidades del plan se recalculan solas. El código es el que se usa
              para guardar el kilometraje del último service de cada unidad, así que conviene no cambiarlo una vez cargado.
            </div>
          </Card>}

          <Card>
            <div style={{ padding: "16px 20px", borderBottom: "1px solid #F1F5F9", display: "flex", alignItems: "center", gap: 12 }}>
              <h3 style={{ margin: 0, fontSize: 15, fontWeight: 700, color: "var(--c-primario)" }}>Planes cargados</h3>
              <button onClick={() => {
                const nombre = prompt("Nombre del plan nuevo (por ejemplo, la marca):");
                if (!nombre) return;
                const id = "plan_" + pgId();
                setPlanes(p => [...p, { id, nombre: nombre.toUpperCase(), marca: nombre, notas: "", servicios: [] }]);
                setPlanActivo(id);
              }} style={{ marginLeft: "auto", padding: "7px 14px", borderRadius: 8, border: "1.5px solid var(--c-primario)", background: "#fff", color: "var(--c-primario)", fontSize: 12.5, fontWeight: 600, cursor: "pointer" }}>+ Nuevo plan</button>
            </div>
            <Table headers={["Plan", "Marca", "Services", "Unidades", ""]}>
              {planes.map(p => (
                <TR key={p.id}>
                  <TD bold>{p.nombre}</TD>
                  <TD>{p.marca}</TD>
                  <TD>{p.servicios.length}</TD>
                  <TD>{unidades.filter(u => u.planId === p.id).length}</TD>
                  <TD>{<button onClick={() => { if (confirm(`¿Borrar el plan ${p.nombre}? También se sacan del plan sus ${unidades.filter(u => u.planId === p.id).length} unidad(es) asignadas y sus turnos.`)) { const resto = planes.filter(y => y.id !== p.id); setPlanes(resto); setUnidades(x => x.filter(u => u.planId !== p.id)); setTurnos(x => x.filter(t => { const u = unidades.find(z => pgNorm(z.interno) === pgNorm(t.interno)); return !(u && u.planId === p.id); })); setPlanActivo(resto.length ? resto[0].id : null); } }}
                    style={{ background: "none", border: "none", cursor: "pointer", color: "#DC2626", fontSize: 12, fontWeight: 600 }}>Borrar</button>}</TD>
                </TR>
              ))}
            </Table>
          </Card>
        </>
      )}

      {/* ── UNIDADES DEL PLAN ────────────────────────────────────────── */}
      {vista === "ajustes" && plan && (
        <>
          <Card style={{ marginBottom: 20 }}>
            <div style={{ padding: "16px 20px", borderBottom: "1px solid #F1F5F9", display: "flex", alignItems: "center", gap: 12, flexWrap: "wrap" }}>
              <h3 style={{ margin: 0, fontSize: 15, fontWeight: 700, color: "var(--c-primario)" }}>Unidades asignadas a {plan.nombre}</h3>
              <span style={{ fontSize: 12, color: "#9CA3AF" }}>{misUnidades.length} cargada(s)</span>
              <div style={{ marginLeft: "auto", display: "flex", gap: 8, flexWrap: "wrap" }}>
                <button onClick={() => {
                  const nuevas = (vehiculos || [])
                    .filter(v => String(v.vehiculo || "").trim() && !unidades.some(u => u.planId === plan.id && pgNorm(u.interno) === pgNorm(String(v.vehiculo))))
                    .map(v => ({ id: "pu_" + pgId(), planId: plan.id, interno: String(v.vehiculo).trim(),
                      kmManual: pgNum(v.km), predio: "", chasis: "", patente: v.patente || "", ultimos: {} }));
                  if (!nuevas.length) { alert("Todas las unidades de Vehículos ya están en este plan (o no tienen N° interno cargado)."); return; }
                  setUnidades(prev => [...prev, ...nuevas]);
                  alert(`Listo: ${nuevas.length} unidad(es) traídas desde Vehículos. Después completá el km del último service de cada una para que el plan calcule bien.`);
                }} style={{ padding: "7px 14px", borderRadius: 8, border: "1.5px solid #E5E7EB", background: "#fff", fontSize: 12.5, fontWeight: 600, cursor: "pointer", color: "#374151" }}>
                  Traer unidades desde Vehículos
                </button>
                <button onClick={() => setModalU({ planId: plan.id, interno: "", chasis: "", patente: "", predio: "", kmManual: 0, ultimos: {} })}
                  style={{ padding: "7px 14px", borderRadius: 8, border: "none", background: "var(--c-primario)", color: "#fff", fontSize: 12.5, fontWeight: 600, cursor: "pointer" }}>+ Agregar unidad</button>
              </div>
            </div>
            <Table headers={["Interno", "Chasis", "Patente", "Predio", "Km a mano", ...plan.servicios.map(s => "Últ. " + s.codigo), ""]}>
              {misUnidades.map(U => (
                <TR key={U.id}>
                  <TD bold>{U.interno}</TD>
                  <TD>{U.chasis || "—"}</TD>
                  <TD>{U.patente || "—"}</TD>
                  <TD>{U.predio || "—"}</TD>
                  <TD>{U.kmManual ? pgMiles(U.kmManual) : "—"}</TD>
                  {plan.servicios.map(s => (
                    <TD key={s.codigo}>{pgNum((U.ultimos || {})[s.codigo]) > 0 ? pgMiles((U.ultimos || {})[s.codigo]) : <span style={{ color: "#9CA3AF" }}>nunca</span>}</TD>
                  ))}
                  <TD style={{ whiteSpace: "nowrap" }}>
                    <button onClick={() => setModalU(U)} style={{ background: "none", border: "none", cursor: "pointer", color: "var(--c-primario)", fontSize: 12, fontWeight: 600, marginRight: 8 }}>Editar</button>
                    <button onClick={() => { if (confirm(`¿Sacar la unidad ${U.interno} del plan?`)) setUnidades(p => p.filter(x => x.id !== U.id)); }}
                      style={{ background: "none", border: "none", cursor: "pointer", color: "#DC2626", fontSize: 12, fontWeight: 600 }}>Quitar</button>
                  </TD>
                </TR>
              ))}
            </Table>
          </Card>

          <Card>
            <div style={{ padding: "16px 20px", borderBottom: "1px solid #F1F5F9" }}>
              <h3 style={{ margin: 0, fontSize: 15, fontWeight: 700, color: "var(--c-primario)" }}>Pegar desde la planilla técnica</h3>
              <span style={{ fontSize: 12, color: "#9CA3AF" }}>copiá las filas del bloque de kilómetros y pegalas acá</span>
            </div>
            <div style={{ padding: 20 }}>
              <textarea value={pegar} onChange={e => setPegar(e.target.value)} rows={7}
                placeholder={"60507\t169693\t167706\t13013\t152323\t12630\t128928\t19235\t128928\t79235\t\t70307\tPARANA"}
                style={{ width: "100%", padding: "10px 12px", border: "1.5px solid #E5E7EB", borderRadius: 8, fontSize: 12, fontFamily: "ui-monospace,Menlo,Consolas,monospace", boxSizing: "border-box" }} />
              <div style={{ display: "flex", gap: 10, marginTop: 12, alignItems: "center", flexWrap: "wrap" }}>
                <button onClick={importarBloque} style={{ padding: "9px 18px", borderRadius: 8, border: "none", background: "var(--c-primario)", color: "#fff", fontSize: 13, fontWeight: 600, cursor: "pointer" }}>Cargar las filas pegadas</button>
                <span style={{ fontSize: 12, color: "#9CA3AF", lineHeight: 1.6 }}>
                  Lee: interno, km actuales, y después los pares de (kilometraje del último service, km que faltan) en el orden del plan.
                  Las columnas de «km p/servicio» las ignora porque las recalcula.
                </span>
              </div>
            </div>
          </Card>
        </>
      )}

      {modalU && <PmModalUnidad inicial={modalU} plan={plan} vehiculos={vehiculos}
        onGuardar={(U) => { setUnidades(p => U.id && p.some(x => x.id === U.id) ? p.map(x => x.id === U.id ? U : x) : [...p, { ...U, id: U.id || "pu_" + pgId() }]); setModalU(null); }}
        onCerrar={() => setModalU(null)} />}
      {modalT && <PmModalTurno inicial={modalT} plan={plan} unidades={misUnidades} vehiculos={vehiculos}
        onGuardar={(T) => {
          // v1.1 — si la unidad elegida vino de Vehículos y no está en el plan, se agrega sola
          if (plan && T.interno && !misUnidades.some(u => pgNorm(u.interno) === pgNorm(T.interno))) {
            const v = (vehiculos || []).find(x => pgNorm(String(x.vehiculo || "")) === pgNorm(T.interno) || pgNorm(x.patente) === pgNorm(T.interno));
            setUnidades(p => [...p, { id: "pu_" + pgId(), planId: plan.id, interno: String(T.interno).trim(),
              kmManual: v ? pgNum(v.km) : 0, predio: "", chasis: "", patente: v ? (v.patente || "") : "", ultimos: {} }]);
          }
          setTurnos(p => T.id && p.some(x => x.id === T.id) ? p.map(x => x.id === T.id ? T : x) : [...p, { ...T, id: T.id || "t_" + pgId() }]); setModalT(null); }}
        onCerrar={() => setModalT(null)} />}
    </div>
  );
};

const PmModalUnidad = ({ inicial, plan, vehiculos, onGuardar, onCerrar }) => {
  const [f, setF] = useState({ ...inicial, ultimos: { ...(inicial.ultimos || {}) } });
  const set = (k, v) => setF(p => ({ ...p, [k]: v }));
  const setUlt = (c, v) => setF(p => ({ ...p, ultimos: { ...p.ultimos, [c]: pgNum(v) } }));
  return (
    <Modal title={inicial.id ? `Unidad ${inicial.interno}` : "Agregar unidad al plan"} onClose={onCerrar}>
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: "0 14px" }}>
        <Field label="N° interno">
          <Input list="pm-internos" value={f.interno} onChange={e => set("interno", e.target.value)} />
        </Field>
        <Field label="Patente"><Input value={f.patente} onChange={e => set("patente", e.target.value.toUpperCase())} /></Field>
        <Field label="Chasis"><Input value={f.chasis} onChange={e => set("chasis", e.target.value.toUpperCase())} /></Field>
        <Field label="Predio"><Input value={f.predio} onChange={e => set("predio", e.target.value.toUpperCase())} placeholder="PARANA" /></Field>
      </div>
      <datalist id="pm-internos">{(vehiculos || []).map(v => <option key={v.id} value={v.vehiculo} />)}</datalist>
      <Field label="Kilometraje actual cargado a mano">
        <Input value={f.kmManual} onChange={e => set("kmManual", pgNum(e.target.value))} />
        <span style={{ fontSize: 11.5, color: "#9CA3AF", display: "block", marginTop: 6, lineHeight: 1.6 }}>
          Solo se usa si la unidad no tiene cargas de combustible. En cuanto haya una carga, manda el odómetro del surtidor.
        </span>
      </Field>
      <div style={{ fontSize: 12, fontWeight: 700, color: "#374151", textTransform: "uppercase", letterSpacing: "0.5px", margin: "4px 0 10px" }}>
        Kilometraje del último service
      </div>
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: "0 14px" }}>
        {(plan ? plan.servicios : []).map(s => (

   Agregado, no reemplaza nada. El logo se guarda en este navegador, separado por
   empresa, en la clave LOGOS_EMPRESA. No viaja a la planilla a propósito: una
   imagen no entra cómoda en una celda y no había que tocar el conector de flota
   para esto. Si mañana querés que se comparta entre PCs, se agrega ahí.

   Se usa en dos lugares y los dos leen y escriben lo mismo:
     · LogoEmpresa      → el cuadradito de la barra de arriba
     · LogoEmpresaFila  → el botón dentro de la fila, en la pantalla Empresas
   Cuando uno cambia el logo, el otro se entera por el aviso "logos-empresa": así
   cambiás el logo en la lista y la barra de arriba se actualiza sola. */
const LOGOS_LS = PREFIJO_DATOS + "LOGOS_EMPRESA";
const leerLogosEmpresa = () => { try { return JSON.parse(localStorage.getItem(LOGOS_LS) || "{}"); } catch (e) { return {}; } };
const grabarLogosEmpresa = (m) => {
  try { localStorage.setItem(LOGOS_LS, JSON.stringify(m)); } catch (e) {}
  try { window.dispatchEvent(new Event("logos-empresa")); } catch (e) {}
};
const ponerLogoEmpresa = (id, valor) => {
  const m = leerLogosEmpresa();
  if (valor) m[String(id)] = valor; else delete m[String(id)];
  grabarLogosEmpresa(m);
};
/* Un solo lugar donde engancharse al aviso, para no repetirlo en los dos botones. */
const usarLogosEmpresa = () => {
  const [logos, setLogos] = useState(leerLogosEmpresa);
  useEffect(() => {
    const refrescar = () => setLogos(leerLogosEmpresa());
    window.addEventListener("logos-empresa", refrescar);
    window.addEventListener("storage", refrescar);
    return () => {
      window.removeEventListener("logos-empresa", refrescar);
      window.removeEventListener("storage", refrescar);
    };
  }, []);
  return logos;
};

      {abierto && (
        <>

            position: "absolute", top: 38, left: 0, zIndex: 61, width: 250,
