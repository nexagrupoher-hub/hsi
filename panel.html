      horasDiagramadas: +f.horasDiagramadas || 0, horasExtras: +f.horasExtras || 0,
      sueldo: +f.sueldo || 0, productividad: +f.productividad || 0, estado: f.estado || "activo",
    }));
    if (!nuevos.length) return { agregados: 0, errores: ["Ninguna fila tiene nombre."] };
    setPersonal(prev => [...prev, ...nuevos]);
    return { agregados: nuevos.length, errores: [] };
  };

  const filtrados = personal.filter(p =>
    (p.nombre || "").toLowerCase().includes(busq.toLowerCase()) ||
    String(p.dni || "").includes(busq) ||
    (p.puesto || "").toLowerCase().includes(busq.toLowerCase()) ||
    (p.base || "").toLowerCase().includes(busq.toLowerCase())
  );

  const activos = personal.filter(p => esActivo(p.estado)).length;
  const costoTotal = personal.filter(p => esActivo(p.estado)).reduce((s, p) => s + (Number(p.sueldo) || 0), 0);
  const hsTotales = personal.filter(p => esActivo(p.estado)).reduce((s, p) => s + (Number(p.horasDiagramadas) || 0) + (Number(p.horasExtras) || 0), 0);
  const costoHora = hsTotales > 0 ? costoTotal / hsTotales : 0;

  return (
    <div>
      <SectionHeader title="Personal de mantenimiento" sub={`${activos} activo(s) de ${personal.length} · costo hora promedio: ${costoHora > 0 ? "$" + Math.round(costoHora).toLocaleString("es-AR") + "/h" : "—"}`}
        action="Nuevo personal" onAction={() => { setEditId(null); setModal(true); }}
        extra={<ImportarMasivo nombre="Personal" onImportar={importar}
          ejemplo={{ nombre: "José Fernández", dni: "27333444", puesto: "Mecánico", base: "Base Central", horasDiagramadas: "192", horasExtras: "16", sueldo: "1850000,00", productividad: "85", estado: "activo" }}
          columnas={[
            { campo: "nombre", etiqueta: "Nombre y apellido", tipo: "texto", requerido: true, alias: ["nombre", "apellido y nombre"] },
            { campo: "dni", etiqueta: "DNI", tipo: "texto", alias: ["documento"] },
            { campo: "puesto", etiqueta: "Puesto", tipo: "opcion", opciones: PUESTOS, porDefecto: "Mecánico", alias: ["cargo", "funcion", "sector"] },
            { campo: "base", etiqueta: "Base", tipo: "texto", alias: ["base de operaciones", "taller"] },
            { campo: "horasDiagramadas", etiqueta: "Horas diagramadas", tipo: "numero", alias: ["hs diagramadas", "horas", "hs"] },
            { campo: "horasExtras", etiqueta: "Horas extras", tipo: "numero", alias: ["hs extras", "extras"] },
            { campo: "sueldo", etiqueta: "Costo en sueldo", tipo: "numero", alias: ["sueldo", "costo sueldo", "costo laboral"] },
            { campo: "productividad", etiqueta: "Productividad (%)", tipo: "numero", alias: ["productividad"] },
            { campo: "estado", etiqueta: "Estado", tipo: "opcion", opciones: ["activo", "inactivo", "suspendido"], porDefecto: "activo" },
          ]} />} />

      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(180px, 1fr))", gap: 16, marginBottom: 20 }}>
        <KpiCard label="Personal activo" value={activos} icon="user" color="var(--c-primario)" sub={`${personal.length} en total`} />
        <KpiCard label="Costo mensual en sueldos" value={fmt(costoTotal)} icon="dollar" color="var(--c-acento)" sub="personal activo" />
        <KpiCard label="Horas del mes" value={hsTotales.toLocaleString("es-AR") + " h"} icon="chart" color="#8B5CF6" sub="diagramadas + extras" />
        <KpiCard label="Costo hora promedio" value={costoHora > 0 ? "$" + Math.round(costoHora).toLocaleString("es-AR") + "/h" : "—"} icon="wrench" color="#0891B2" sub="sueldos ÷ horas" />
      </div>

      <Card>
        <div style={{ padding: "12px 16px", borderBottom: "1px solid #F1F5F9" }}>
          <div style={{ position: "relative", maxWidth: 380 }}>
            <span style={{ position: "absolute", left: 10, top: "50%", transform: "translateY(-50%)" }}><Icon name="search" size={15} color="#9CA3AF" /></span>
            <Input placeholder="Buscar por nombre, DNI, puesto o base..." value={busq} onChange={e => setBusq(e.target.value)} style={{ paddingLeft: 32 }} />
          </div>
        </div>
        <Table headers={["Nombre", "DNI", "Puesto", "Base", "Hs diagramadas", "Hs extras", "Costo en sueldo", "Productividad", "Estado", "Acciones"]}>
          {filtrados.map(p => (
            <TR key={p.id}>
              <TD bold>{p.nombre}</TD>
              <TD>{p.dni || "—"}</TD>
              <TD><span style={{ padding: "2px 9px", background: "color-mix(in srgb, var(--c-primario) 9%, transparent)", color: "var(--c-primario)", borderRadius: 6, fontSize: 12, fontWeight: 700 }}>{p.puesto || "—"}</span></TD>
              <TD>{p.base || "—"}</TD>
              <TD>{(Number(p.horasDiagramadas) || 0).toLocaleString("es-AR")} h</TD>
              <TD>{Number(p.horasExtras) > 0 ? (Number(p.horasExtras)).toLocaleString("es-AR") + " h" : <span style={{ color: "#CBD5E1" }}>—</span>}</TD>
              <TD bold>{Number(p.sueldo) > 0 ? fmt(p.sueldo) : <span style={{ color: "#CBD5E1" }}>—</span>}</TD>
              <TD>{Number(p.productividad) > 0 ? <span style={{ fontWeight: 700, color: Number(p.productividad) >= 75 ? "#16A34A" : "#F0A020" }}>{p.productividad}%</span> : <span style={{ color: "#CBD5E1" }}>—</span>}</TD>
              <TD><Badge estado={p.estado} /></TD>
              <TD>
                <BotonIcono icono="edit" color="#6B7280" title="Editar" onClick={() => editar(p)} />
                <BotonIcono icono="trash" color="#DC2626" title="Eliminar" onClick={() => { if (window.confirm(`¿Eliminar a ${p.nombre}?`)) setPersonal(prev => prev.filter(x => !mismoId(x.id, p.id))); }} />
              </TD>
            </TR>
          ))}
          {filtrados.length === 0 && (
            <tr><td colSpan={10} style={{ padding: "28px 14px", textAlign: "center", color: "#9CA3AF", fontSize: 13 }}>
              {personal.length === 0 ? "Todavía no cargaste personal de mantenimiento. Usá el formulario o la carga masiva." : "Nadie coincide con la búsqueda."}
            </td></tr>
          )}
        </Table>
      </Card>

      {modal && (
        <Modal title={editId ? `Editar ${form.nombre || "personal"}` : "Nuevo personal de mantenimiento"} onClose={cerrar}>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: "0 16px" }}>
            <Field label="Nombre y apellido"><Input placeholder="José Fernández" value={form.nombre} onChange={e => setForm(p => ({ ...p, nombre: e.target.value }))} /></Field>
            <Field label="DNI"><Input placeholder="27333444" value={form.dni} onChange={e => setForm(p => ({ ...p, dni: e.target.value }))} /></Field>
            <Field label="Puesto">
              <Select value={form.puesto} onChange={e => setForm(p => ({ ...p, puesto: e.target.value }))}>
                {PUESTOS.map(x => <option key={x}>{x}</option>)}
              </Select>
            </Field>
            <Field label="Base">
              {(bases && bases.length > 0)
                ? <Select value={form.base} onChange={e => setForm(p => ({ ...p, base: e.target.value }))}>
                    <option value="">— Sin base —</option>
                    {bases.map(b => <option key={b.id} value={b.nombre}>{b.nombre}</option>)}
                  </Select>
                : <Input placeholder="Base Central" value={form.base} onChange={e => setForm(p => ({ ...p, base: e.target.value }))} />}
            </Field>
            <Field label="Horas diagramadas (mes)"><Input type="number" min="0" value={form.horasDiagramadas} onChange={e => setForm(p => ({ ...p, horasDiagramadas: e.target.value }))} /></Field>
            <Field label="Horas extras (mes)"><Input type="number" min="0" value={form.horasExtras} onChange={e => setForm(p => ({ ...p, horasExtras: e.target.value }))} /></Field>
            <Field label="Costo en sueldo ($/mes)"><Input type="number" min="0" value={form.sueldo} onChange={e => setForm(p => ({ ...p, sueldo: e.target.value }))} /></Field>
            <Field label="Productividad (%)"><Input type="number" min="0" max="100" value={form.productividad} onChange={e => setForm(p => ({ ...p, productividad: e.target.value }))} /></Field>
            <Field label="Estado">
              <Select value={form.estado} onChange={e => setForm(p => ({ ...p, estado: e.target.value }))}>
                <option value="activo">Activo</option>
                <option value="suspendido">Suspendido</option>
                <option value="inactivo">Inactivo</option>
              </Select>
            </Field>
          </div>
          <div style={{ display: "flex", gap: 10, justifyContent: "flex-end", marginTop: 8 }}>
            <button onClick={cerrar} style={{ padding: "9px 20px", borderRadius: 8, border: "1.5px solid #E5E7EB", background: "#fff", fontSize: 13, fontWeight: 600, cursor: "pointer", color: "#374151" }}>Cancelar</button>
            <button onClick={guardar} style={{ padding: "9px 20px", borderRadius: 8, border: "none", background: "var(--c-primario)", color: "#fff", fontSize: 13, fontWeight: 600, cursor: "pointer" }}>{editId ? "Guardar cambios" : "Guardar personal"}</button>
          </div>
        </Modal>
      )}
    </div>
  );
};

// ─── COSTOS FIJOS (por empresa y mes) ─────────────────────────────────────────
// El costo por km que mide combustible + mantenimiento + gastos es solo la parte
// VARIABLE. En una flota los fijos son la mayor parte del costo (conducción,
// taller, seguros, patentes, depreciación, estructura). Acá se cargan una vez
// por mes, por empresa, y el panel los reparte por kilómetro.
const FIJOS_VACIO = { periodo: "", conduccion: 0, taller: 0, seguros: 0, patentesTasas: 0, depreciacion: 0, estructura: 0, pctDepAnual: 12, notas: "" };
const RUBROS_FIJOS = [
  { campo: "conduccion",    etiqueta: "Conducción",        ayuda: "Sueldos y cargas de los choferes" },
  { campo: "taller",        etiqueta: "Taller",            ayuda: "Sueldos del personal de mantenimiento", auto: true },
  { campo: "seguros",       etiqueta: "Seguros",           ayuda: "Pólizas de la flota" },
  { campo: "patentesTasas", etiqueta: "Patentes y tasas",  ayuda: "Impuestos, habilitaciones, canon" },
  { campo: "depreciacion",  etiqueta: "Depreciación",      ayuda: "Desgaste del material rodante", auto: true },
  { campo: "estructura",    etiqueta: "Estructura",         ayuda: "Administración, alquileres, servicios" },
];

// Etiqueta legible de un período aaaa-MM.
// Google Sheets convierte "2026-08" en una fecha, así que puede volver como
// "2026-08-01T03:00:00.000Z" o como Date. Esto lo devuelve siempre a aaaa-MM.
const perNorm = (p) => {
  if (!p) return "";
  if (p instanceof Date) return isNaN(p) ? "" : p.getFullYear() + "-" + String(p.getMonth() + 1).padStart(2, "0");
  const s = String(p).trim();
  if (/^\d{4}-\d{2}$/.test(s)) return s;
  const m = s.match(/^(\d{4})-(\d{2})/);
  if (m) return m[1] + "-" + m[2];
  const d = new Date(s);
  return isNaN(d) ? s : d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0");
};

const rotuloPeriodo = (p0) => {
  const p = perNorm(p0);
  if (!p || !/^\d{4}-\d{2}$/.test(p)) return String(p0 || "") || "—";
  const [y, m] = p.split("-");
  const d = new Date(+y, +m - 1, 1);
  return d.toLocaleDateString("es-AR", { month: "long", year: "numeric" });
};
const periodoActual = () => {
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0");
};

const CostosFijos = ({ costosFijos, setCostosFijos, empresaActiva, personal, vehiculos, mantenimiento, viajes, combustible, gastos, partes, combustibleTodo }) => {
  const [form, setForm] = useState({ ...FIJOS_VACIO, periodo: periodoActual() });
  const [editId, setEditId] = useState(null);
  const [aviso, setAviso] = useState(null);
  const avisar = (tipo, texto) => setAviso({ tipo, texto });

  // ── Valores que el sistema puede calcular solo ──────────────────────────
  const sueldosTaller = personal.filter(p => esActivo(p.estado))
    .reduce((s, p) => s + (Number(p.sueldo) || 0), 0);
  const activos = vehiculos.filter(v => esActivo(v.estado) || String(v.estado).toLowerCase() === "mantenimiento");
  const valorFlota = activos.reduce((s, v) => s + (Number(v.valor0km) || 0), 0);
  const depSugerida = valorFlota > 0 ? valorFlota * ((Number(form.pctDepAnual) || 0) / 100) / 12 : 0;

  // ── Km del período elegido ──────────────────────────────────────────────
  // Prioridad: partes de servicio → servicios → odómetro (combustible y OT)
  // Km del mes (yyyy-MM) por odómetro, contra el historial COMPLETO de
  // combustible: cada unidad resta su lectura más alta del mes menos la última
  // anterior al mes. Así la suma de los meses da exactamente el histórico.
  const kmDelPeriodo = (per) => {
    if (!per || !/^\d{4}-\d{2}$/.test(per)) return 0;
    const anio = Number(per.slice(0, 4));
    const mes = Number(per.slice(5, 7));
    const ini = `${per}-01`;
    const fin = _isoFecha(new Date(anio, mes, 0));
    return kmFlotaRango(vehiculos, combustibleTodo || combustible, ini, fin);
  };

  const variableDelPeriodo = (per) => {
    const enPer = (f) => toDateInput(f).slice(0, 7) === per;
    return combustible.filter(c => enPer(c.fecha)).reduce((s, c) => s + (Number(c.total) || 0), 0)
         + mantenimiento.filter(m => enPer(m.fecha)).reduce((s, m) => s + (Number(m.costo) || 0), 0)
         + gastos.filter(g => enPer(g.fecha)).reduce((s, g) => s + (Number(g.monto) || 0), 0);
  };

  const totalFijos = (o) => RUBROS_FIJOS.reduce((s, r) => s + (Number(o[r.campo]) || 0), 0);

  const cancelar = () => { setForm({ ...FIJOS_VACIO, periodo: periodoActual() }); setEditId(null); };

  const guardar = () => {
    if (!/^\d{4}-\d{2}$/.test(form.periodo)) return avisar("error", "Elegí el mes al que corresponden estos costos.");
    const dup = costosFijos.find(c => perNorm(c.periodo) === form.periodo && !mismoId(c.id, editId));
    if (dup) return avisar("error", `Ya hay costos fijos cargados para ${rotuloPeriodo(form.periodo)}. Editá esa fila en lugar de duplicarla.`);
    const reg = { ...form, periodo: perNorm(form.periodo) };
    RUBROS_FIJOS.forEach(r => { reg[r.campo] = Number(reg[r.campo]) || 0; });
    reg.pctDepAnual = Number(reg.pctDepAnual) || 0;
    if (totalFijos(reg) <= 0) return avisar("error", "Cargá al menos un rubro con monto.");
    if (editId) {
      setCostosFijos(prev => prev.map(c => mismoId(c.id, editId) ? { ...c, ...reg } : c));
      avisar("ok", `Costos fijos de ${rotuloPeriodo(reg.periodo)} actualizados.`);
    } else {
      setCostosFijos(prev => [...prev, { ...reg, id: Date.now(), empresa_id: empresaActiva }]);
      avisar("ok", `Costos fijos de ${rotuloPeriodo(reg.periodo)} guardados.`);
    }
    cancelar();
  };

  const editar = (c) => {
    setEditId(c.id);
    setForm({ periodo: perNorm(c.periodo) || "", conduccion: c.conduccion || 0, taller: c.taller || 0,
              seguros: c.seguros || 0, patentesTasas: c.patentesTasas || 0, depreciacion: c.depreciacion || 0,
              estructura: c.estructura || 0, pctDepAnual: c.pctDepAnual || 12, notas: c.notas || "" });
    setAviso(null);
  };
  const eliminar = (c) => {
    if (!window.confirm(`¿Borrar los costos fijos de ${rotuloPeriodo(c.periodo)}?`)) return;
    setCostosFijos(prev => prev.filter(x => !mismoId(x.id, c.id)));
    if (mismoId(editId, c.id)) cancelar();
  };
  const copiarMesAnterior = () => {
    const ordenados = [...costosFijos].sort((a, b) => perNorm(b.periodo).localeCompare(perNorm(a.periodo)));
    const ult = ordenados.find(c => perNorm(c.periodo) !== form.periodo);
    if (!ult) return avisar("error", "Todavía no hay un mes cargado para copiar.");
    setForm(p => ({ ...p, conduccion: ult.conduccion || 0, taller: ult.taller || 0, seguros: ult.seguros || 0,
                    patentesTasas: ult.patentesTasas || 0, depreciacion: ult.depreciacion || 0,
                    estructura: ult.estructura || 0, pctDepAnual: ult.pctDepAnual || 12 }));
    avisar("info", `Copiado de ${rotuloPeriodo(ult.periodo)}. Ajustá lo que cambió y guardá.`);
  };

  const filas = [...costosFijos].sort((a, b) => perNorm(b.periodo).localeCompare(perNorm(a.periodo)));
  const kmForm = kmDelPeriodo(form.periodo);
  const fijoKmForm = kmForm > 0 ? totalFijos(form) / kmForm : 0;

  return (
    <div>
      <SectionHeader title="Costos fijos" sub="Se cargan una vez por mes y el panel los reparte por kilómetro recorrido"
        extra={<ImportarMasivo nombre="Costos fijos" onImportar={(fs) => {
          const nuevos = fs.map(f => ({ ...f, periodo: perNorm(f.periodo) }))
            .filter(f => /^\d{4}-\d{2}$/.test(f.periodo) && !costosFijos.some(c => perNorm(c.periodo) === f.periodo))
            .map((f, i) => ({ ...f, id: Date.now() + Math.floor(Math.random() * 1000) + i, empresa_id: empresaActiva }));
          if (!nuevos.length) return { agregados: 0, errores: ["Ninguna fila tiene un período nuevo con formato aaaa-mm."] };
          setCostosFijos(prev => [...prev, ...nuevos]);
          return { agregados: nuevos.length, errores: [] };
        }}
          ejemplo={{ periodo: "2026-08", conduccion: "48000000,00", taller: "15400000,00", seguros: "6200000,00", patentesTasas: "1800000,00", depreciacion: "22000000,00", estructura: "9500000,00" }}
          columnas={[
            { campo: "periodo", etiqueta: "Período (aaaa-mm)", tipo: "texto", requerido: true, alias: ["mes", "periodo"] },
            { campo: "conduccion", etiqueta: "Conducción", tipo: "numero", alias: ["choferes", "sueldos conduccion"] },
            { campo: "taller", etiqueta: "Taller", tipo: "numero", alias: ["mantenimiento personal", "sueldos taller"] },
            { campo: "seguros", etiqueta: "Seguros", tipo: "numero" },
            { campo: "patentesTasas", etiqueta: "Patentes y tasas", tipo: "numero", alias: ["patentes", "impuestos"] },
            { campo: "depreciacion", etiqueta: "Depreciación", tipo: "numero", alias: ["amortizacion"] },
            { campo: "estructura", etiqueta: "Estructura", tipo: "numero", alias: ["administracion", "gastos generales"] },
          ]} />} />

      {aviso && <Aviso tipo={aviso.tipo}>{aviso.texto}</Aviso>}

      <Aviso tipo="info">
        Sin estos datos el panel solo puede mostrar el costo <strong>variable</strong> por km (combustible,
        mantenimiento y gastos), que suele ser menos de un tercio del costo real.
      </Aviso>

      {/* Formulario del mes */}
      <Card style={{ marginBottom: 20 }}>
        <div style={{ padding: "18px 20px 4px" }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14, gap: 10, flexWrap: "wrap" }}>
            <div style={{ fontSize: 13, fontWeight: 700, color: "var(--c-primario)" }}>
              {editId ? `Modificar ${rotuloPeriodo(form.periodo)}` : "Cargar costos fijos del mes"}
            </div>
            <button onClick={copiarMesAnterior}
              style={{ padding: "6px 14px", borderRadius: 7, border: "1.5px solid #E5E7EB", background: "#fff", color: "var(--c-primario)", fontSize: 12, fontWeight: 600, cursor: "pointer" }}>
              Copiar del mes anterior
            </button>
          </div>

          <div style={{ display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: "0 14px" }}>
            <Field label="Mes">
              <Input type="month" value={form.periodo} onChange={e => setForm(p => ({ ...p, periodo: e.target.value }))} />
            </Field>
            <div style={{ gridColumn: "span 2", display: "flex", alignItems: "center", paddingBottom: 16, fontSize: 12, color: "#6B7280" }}>
              {kmForm > 0
                ? <span>Ese mes tiene <strong>{fmtKm(kmForm)}</strong> recorridos · fijo por km: <strong style={{ color: "var(--c-primario)" }}>{fijoKmForm > 0 ? "$" + Math.round(fijoKmForm).toLocaleString("es-AR") + "/km" : "—"}</strong></span>
                : <span>Todavía no hay kilómetros cargados en ese mes, así que el fijo por km no se puede calcular.</span>}
            </div>

            {RUBROS_FIJOS.map(r => (
              <Field key={r.campo} label={r.etiqueta}>
                <Input type="number" min="0" value={form[r.campo]} onChange={e => setForm(p => ({ ...p, [r.campo]: e.target.value }))} />
                <div style={{ fontSize: 11, color: "#9CA3AF", marginTop: 4, lineHeight: 1.45 }}>
                  {r.ayuda}
                  {r.campo === "taller" && sueldosTaller > 0 && (
                    <> · <button onClick={() => setForm(p => ({ ...p, taller: Math.round(sueldosTaller) }))}
                      style={{ padding: 0, border: "none", background: "none", color: "var(--c-primario)", fontWeight: 700, fontSize: 11, cursor: "pointer" }}>
                      usar {fmt(sueldosTaller)} del personal
                    </button></>
                  )}
                  {r.campo === "depreciacion" && depSugerida > 0 && (
                    <> · <button onClick={() => setForm(p => ({ ...p, depreciacion: Math.round(depSugerida) }))}
                      style={{ padding: 0, border: "none", background: "none", color: "var(--c-primario)", fontWeight: 700, fontSize: 11, cursor: "pointer" }}>

              <Field label="Notas"><Input placeholder="Ej: paritaria de julio, alta de 2 unidades" value={form.notas} onChange={e => setForm(p => ({ ...p, notas: e.target.value }))} /></Field>

          </div>

          <div style={{ display: "flex", gap: 10, alignItems: "center", marginBottom: 18, flexWrap: "wrap" }}>
            <button onClick={guardar} style={{ padding: "9px 22px", borderRadius: 8, border: "none", background: "var(--c-primario)", color: "#fff", fontSize: 13, fontWeight: 600, cursor: "pointer" }}>{editId ? "Actualizar" : "Guardar mes"}</button>

              Total del mes: <strong style={{ fontSize: 16, color: "var(--c-primario)" }}>{fmt(totalFijos(form))}</strong>
            </span>
          </div>
        </div>
      </Card>

      {/* Histórico */}
      <Card>
        <Table headers={["Mes", "Conducción", "Taller", "Seguros", "Patentes", "Depreciación", "Estructura", "Total fijo", "Km del mes", "Fijo $/km", "Total $/km", "Acciones"]}>
          {filas.map(c => {
            const tot = totalFijos(c);
            const km = kmDelPeriodo(perNorm(c.periodo));
            const fijoKm = km > 0 ? tot / km : 0;
            const varKm = km > 0 ? variableDelPeriodo(perNorm(c.periodo)) / km : 0;
            return (
              <TR key={c.id}>
                <TD bold>{rotuloPeriodo(c.periodo)}</TD>
                {RUBROS_FIJOS.map(r => (
                  <TD key={r.campo}>{Number(c[r.campo]) > 0 ? fmt(c[r.campo]) : <span style={{ color: "#CBD5E1" }}>—</span>}</TD>
                ))}
                <TD bold>{fmt(tot)}</TD>
                <TD>{km > 0 ? fmtKm(km) : <span style={{ color: "#CBD5E1" }}>sin km</span>}</TD>
                <TD>{fijoKm > 0 ? <span style={{ fontWeight: 700, color: "var(--c-primario)" }}>${Math.round(fijoKm).toLocaleString("es-AR")}</span> : <span style={{ color: "#CBD5E1" }}>—</span>}</TD>
                <TD>{fijoKm + varKm > 0 ? <span style={{ fontWeight: 800, color: "var(--c-acento)" }}>${Math.round(fijoKm + varKm).toLocaleString("es-AR")}</span> : <span style={{ color: "#CBD5E1" }}>—</span>}</TD>
                <TD>
                  <BotonIcono icono="edit" color="#6B7280" title="Editar" onClick={() => editar(c)} />
                  <BotonIcono icono="trash" color="#DC2626" title="Eliminar" onClick={() => eliminar(c)} />
                </TD>
              </TR>
            );
          })}
          {filas.length === 0 && (
            <tr><td colSpan={12} style={{ padding: "28px 14px", textAlign: "center", color: "#9CA3AF", fontSize: 13 }}>
              Todavía no cargaste costos fijos. Completá el mes de arriba: es lo que le falta al panel para mostrar el costo real por kilómetro.
            </td></tr>
          )}
        </Table>
      </Card>
    </div>
  );
};

const pgNorm = (s) => String(s == null ? "" : s).trim().toUpperCase()

const pgNum = (v) => {
  if (v === null || v === undefined || v === "") return 0;
  if (typeof v === "number") return isFinite(v) ? v : 0;
  let s = String(v).trim().replace(/[\s$]|km|hs?/gi, "");

    s = s.lastIndexOf(",") > s.lastIndexOf(".") ? s.replace(/\./g, "").replace(",", ".") : s.replace(/,/g, "");
  } else if (s.indexOf(",") > -1) { s = s.replace(/\./g, "").replace(",", "."); }
  else if ((s.match(/\./g) || []).length > 1) { s = s.replace(/\./g, ""); }
  const n = parseFloat(s);

};

const PG_MESES = { ene: 0, feb: 1, mar: 2, abr: 3, may: 4, jun: 5, jul: 6, ago: 7, sep: 8, set: 8, oct: 9, nov: 10, dic: 11 };
const pgFecha = (v, anioDef) => {
  if (!v) return null;
  if (v instanceof Date && !isNaN(v)) return new Date(v.getFullYear(), v.getMonth(), v.getDate());
  const s = String(v).trim();
  if (!s) return null;
  let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if (m) return new Date(+m[1], +m[2] - 1, +m[3]);
  m = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})/);
  if (m) { let a = +m[3]; if (a < 100) a += 2000; return new Date(a, +m[2] - 1, +m[1]); }
  m = s.toLowerCase().match(/^(\d{1,2})[\-\s\/\.]*([a-záéíóú]{3,10})\.?[\-\s\/\.]*(\d{2,4})?/);
  if (m && PG_MESES[m[2].slice(0, 3)] !== undefined) {
    const a = m[3] ? (+m[3] < 100 ? 2000 + +m[3] : +m[3]) : (anioDef || new Date().getFullYear());
    return new Date(a, PG_MESES[m[2].slice(0, 3)], +m[1]);

  const d = new Date(s);
  return isNaN(d) ? null : new Date(d.getFullYear(), d.getMonth(), d.getDate());

  const R = 6371, r = Math.PI / 180;

};

  const c = pgNorm(cod);

  for (const L of locs) {
    if (pgNorm(L.codigo) === c || pgNorm(L.nombre) === c) return L;
    if (L.alias && String(L.alias).split(/[,;]/).map(pgNorm).indexOf(c) > -1) return L;

  const A = pgBuscarLoc(locs, a), B = pgBuscarLoc(locs, b);
  const k = pgClaveRuta(A ? A.codigo : a, B ? B.codigo : b);
  return rutas.find(R => pgClaveRuta(R.origen, R.destino) === k) || null;
};
const pgKmTramo = (locs, rutas, cfg, a, b) => {
  const R = pgBuscarRuta(locs, rutas, a, b);
  if (R && pgNum(R.km) > 0) return { km: pgNum(R.km), fuente: "ruta cargada", estimado: !!R.estimado };
  const A = pgBuscarLoc(locs, a), B = pgBuscarLoc(locs, b);
  if (A && B && A.lat && B.lat) {
    return { km: Math.round(pgHaversine(A.lat, A.lng, B.lat, B.lng) * (pgNum(cfg.factorRuta) || 1.28)), fuente: "coordenadas", estimado: true };
  }
  return { km: 0, fuente: "sin datos", estimado: true };
};
// La unidad sale de TU módulo Vehículos: el N° interno es el campo "vehiculo".
const pgBuscarUnidad = (vehiculos, interno) => {
  const c = pgNorm(interno);
  if (!c) return null;
  return (vehiculos || []).find(v => pgNorm(v.vehiculo) === c || pgNorm(v.patente) === c) || null;
};
/* El consumo se busca en este orden, y el primero que aparece manda:
     1. el consumo cargado en la ficha de esa unidad (Vehículos)
     2. una regla de marca + modelo
     3. una regla de la marca sola
     4. el valor por defecto
   Así podés fijar el consumo de toda una marca de una sola vez, y aun así
   pisarlo unidad por unidad cuando alguna se sale de la norma. */
const pgConsumoDe = (interno, ctx) => {
  const U = pgBuscarUnidad(ctx.vehiculos, interno);
  if (U && pgNum(U.consumoRef) > 0) return { valor: pgNum(U.consumoRef), fuente: "ficha de la unidad" };
  const reglas = (Array.isArray(ctx.cfg.consumos) ? ctx.cfg.consumos : []).filter(r => r.marca && pgNum(r.consumo) > 0);
  if (U) {
    const conModelo = reglas.find(r => r.modelo && pgNorm(r.marca) === pgNorm(U.marca)
      && pgNorm(U.modelo).indexOf(pgNorm(r.modelo)) > -1);
    if (conModelo) return { valor: pgNum(conModelo.consumo), fuente: conModelo.marca + " " + conModelo.modelo };
    const soloMarca = reglas.find(r => !r.modelo && pgNorm(r.marca) === pgNorm(U.marca));
    if (soloMarca) return { valor: pgNum(soloMarca.consumo), fuente: soloMarca.marca };
  }
  return { valor: pgNum(ctx.cfg.consumoRefDef) || 28, fuente: "valor por defecto" };
};

const pgCalcular = (v, ctx) => {
  const t = pgKmTramo(ctx.locs, ctx.rutas, ctx.cfg, v.origen, v.destino);
  const km = pgNum(v.kmManual) > 0 ? pgNum(v.kmManual) : (v.idaVuelta === false ? t.km : t.km * 2);
  const c = pgConsumoDe(v.interno, ctx);
  const litros = km * c.valor / 100;
  const combustible = litros * (pgNum(ctx.cfg.precioLitro) || 0);
  const di = pgFecha(v.fechaInicio), df = pgFecha(v.fechaFin);
  const dias = (di && df) ? Math.max(1, pgDiasEntre(di, df) + 1) : 1;
  return {
    kmTramo: t.km, km, fuente: pgNum(v.kmManual) > 0 ? "cargado a mano" : t.fuente,
    estimado: pgNum(v.kmManual) > 0 ? false : t.estimado,
    consumo: c.valor, consumoFuente: c.fuente, litros, combustible, total: combustible, dias,
    ingreso: pgNum(v.tarifa), margen: pgNum(v.tarifa) > 0 ? pgNum(v.tarifa) - combustible : 0,
  };
};
const pgSolapan = (a, b) => {
  let a1 = pgFecha(a.fechaInicio), a2 = pgFecha(a.fechaFin) || a1;
  let b1 = pgFecha(b.fechaInicio), b2 = pgFecha(b.fechaFin) || b1;
  if (!a1 || !b1) return false;
  if (a2 < a1) a2 = a1;
  if (b2 < b1) b2 = b1;
  return a1 <= b2 && b1 <= a2;
};
const pgAvisos = (lista, ctx) => {
  const out = [];
  const vivos = lista.filter(v => v.estado !== "cancelado");
  vivos.forEach((v, i) => {
    const di = pgFecha(v.fechaInicio), df = pgFecha(v.fechaFin);
    if (!di) out.push({ id: v.id, tipo: "fecha", grave: true, txt: "Viaje sin fecha de inicio válida." });
    if (di && df && df < di) out.push({ id: v.id, tipo: "fecha", grave: true, txt: `${v.origen} → ${v.destino}: la fecha de fin (${pgFmtF(df)}) es anterior a la de inicio (${pgFmtF(di)}).` });
    if (!pgBuscarLoc(ctx.locs, v.origen)) out.push({ id: v.id, tipo: "localidad", grave: false, txt: `El origen "${v.origen}" no está en Localidades: sin coordenadas no hay kilómetros ni mapa.` });
    if (!pgBuscarLoc(ctx.locs, v.destino)) out.push({ id: v.id, tipo: "localidad", grave: false, txt: `El destino "${v.destino}" no está en Localidades: sin coordenadas no hay kilómetros ni mapa.` });
    if (v.interno && !pgBuscarUnidad(ctx.vehiculos, v.interno)) out.push({ id: v.id, tipo: "unidad", grave: false, txt: `El interno ${v.interno} no figura en Vehículos: se usa el consumo por defecto.` });
    for (let j = i + 1; j < vivos.length; j++) {
      const w = vivos[j];
      if (!pgSolapan(v, w)) continue;
      if (v.interno && w.interno && pgNorm(v.interno) === pgNorm(w.interno)) {
        out.push({ id: v.id, tipo: "unidad", grave: true, txt: `La unidad ${v.interno} está tomada dos veces a la vez: ${v.origen}→${v.destino} y ${w.origen}→${w.destino} (${pgFmtF(w.fechaInicio)}).` });
      }
      [v.chofer1, v.chofer2].forEach(ch => {
        if (!ch) return;
        if ((w.chofer1 && pgNorm(w.chofer1) === pgNorm(ch)) || (w.chofer2 && pgNorm(w.chofer2) === pgNorm(ch))) {
          out.push({ id: v.id, tipo: "chofer", grave: true, txt: `${ch} figura en dos viajes superpuestos (${pgFmtF(v.fechaInicio)} y ${pgFmtF(w.fechaInicio)}).` });
        }
      });
    }
  });
  return out;
};

/* Días en los que una unidad está viajando, mirando TODOS los programados
   (no solo los futuros). Es la base de los huecos libres y del bloqueo de
   turnos: si un día figura acá, el bus no puede estar en el taller. */
const pgDiasOcupados = (interno) => {
  let viajes = [];
  try { viajes = JSON.parse(almacen.get(PG_LS.viajes) || "[]"); } catch (e) { }
  const dias = {};
  (viajes || []).forEach(v => {
    if (pgNorm(v.interno) !== pgNorm(interno) || v.estado === "cancelado") return;
    const a = pgFecha(v.fechaInicio); let b = pgFecha(v.fechaFin) || a;
    if (!a) return;
    if (b < a) b = a;
    for (let i = 0; i <= pgDiasEntre(a, b); i++) {
      dias[pgIso(pgSuma(a, i))] = { origen: v.origen, destino: v.destino, contratante: v.contratante, estado: v.estado };
    }
  });
  return dias;
};

/* Huecos libres de una unidad entre dos fechas. `minDias` descarta los huecos
   demasiado cortos como para meter un service adentro. */
const pgVentanasLibres = (interno, desde, hasta, minDias) => {
  const ocup = pgDiasOcupados(interno);
  const total = pgDiasEntre(desde, hasta) + 1;
  const out = [];
  let ini = null;
  for (let i = 0; i < total; i++) {
    const libre = !ocup[pgIso(pgSuma(desde, i))];
    if (libre && ini === null) ini = i;
    if ((!libre || i === total - 1) && ini !== null) {
      const fin = libre ? i : i - 1;
      const dias = fin - ini + 1;
      if (dias >= (minDias || 1)) out.push({ desde: pgSuma(desde, ini), hasta: pgSuma(desde, fin), dias, i0: ini, i1: fin });
      ini = null;
    }
  }
  return out;
};

/* Turnos de taller cargados en Plan de mantenimiento. Programados los LEE para
   avisar, nunca los modifica: el taller es el dueño de esa agenda. */
const pgTurnosTaller = (interno) => {
  let turnos = [];
  try { turnos = JSON.parse(almacen.get("PLAN_MANT_TURNOS") || "[]"); } catch (e) { }
  return (turnos || []).filter(t => t.estado !== "cumplido" &&
    (!interno || pgNorm(t.interno) === pgNorm(interno)));
};
const pgTurnosPorDia = (interno) => {
  const m = {};
  pgTurnosTaller(interno).forEach(t => { if (t.fecha) m[t.fecha] = t; });
  return m;
};

/* Pegado desde la pantalla. Separa por tabulación, punto y coma o coma, y
   engancha cada columna por el nombre del encabezado. Es el camino más fiel
   cuando el dato ya está en una planilla: se copia el texto real, no hay
   ninguna lectura ni interpretación en el medio. */
const pgParsearPegado = (texto) => {
  const lineas = String(texto || "").replace(/\r/g, "").split("\n")
    .filter(l => l.replace(/[\t;,\s]/g, "") !== "");
  if (lineas.length < 2) return { error: "Hacen falta el encabezado y al menos una fila." };
  const sep = lineas[0].indexOf("\t") > -1 ? "\t"
            : (lineas[0].split(";").length > lineas[0].split(",").length ? ";" : ",");
  const partir = (l) => {
    if (sep === "\t") return l.split("\t");
    const out = []; let cur = "", q = false;
    for (let i = 0; i < l.length; i++) {
      const ch = l[i];
      if (ch === '"') { q = !q; continue; }
      if (ch === sep && !q) { out.push(cur); cur = ""; continue; }
      cur += ch;
    }
    out.push(cur); return out;
  };
  const enc = partir(lineas[0]).map(x => pgNorm(x.replace(/^"|"$/g, "")));
  const cols = enc.map(e => {
    const c = PG_COLS_IMP.find(k => [k.etiqueta, k.campo].concat(k.alias).map(pgNorm).indexOf(e) > -1);
    return c ? c.campo : null;
  });
  if (cols.indexOf("fechaInicio") === -1) {
    return { error: "No encuentro la columna de fecha. El encabezado que leí fue: " + enc.join(" | ") };
  }
  const filas = [];
  for (let i = 1; i < lineas.length; i++) {
    const celdas = partir(lineas[i]);
    const o = {};
    cols.forEach((c, ix) => { if (c) o[c] = (celdas[ix] || "").replace(/^"|"$/g, "").trim(); });
    if (o.fechaInicio) filas.push(o);
  }
  return { filas, enc: enc.join(" | ") };
};

/* Modal de pegado. Muestra siempre una vista previa antes de tocar nada: la
   carga masiva es la operación más fácil de arruinar sin darse cuenta. */
const PgPegar = ({ clase, onImportar, onCerrar }) => {
  const [texto, setTexto] = useState("");
  const [res, setRes] = useState(null);
  const leer = (t) => { setTexto(t); setRes(t.trim() ? pgParsearPegado(t) : null); };
  const filas = (res && res.filas) || [];
  return (
    <Modal title={`Pegar servicios · ${clase === "todas" ? "sin clase definida" : pgClaseLabel(clase)}`} onClose={onCerrar}>
      <p style={{ margin: "0 0 14px", fontSize: 13, color: "#6B7280", lineHeight: 1.6 }}>
        Copiá las filas desde Excel, Google Sheets o el sistema que uses, <strong>con la fila de encabezados incluida</strong>, y pegalas acá.
        Al copiar el texto real no hay error de lectura posible.
      </p>
      <div style={{ background: "#F8FAFC", border: "1px solid #E5E7EB", borderRadius: 8, padding: "12px 14px", marginBottom: 14 }}>
        <div style={{ fontSize: 11, fontWeight: 700, color: "#6B7280", textTransform: "uppercase", letterSpacing: "0.5px", marginBottom: 8 }}>Encabezados que reconoce</div>
        <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>
          {PG_COLS_IMP.map(c => (
            <span key={c.campo} style={{ padding: "3px 9px", borderRadius: 6, fontSize: 11, fontWeight: 600,
              background: c.requerido ? "color-mix(in srgb, var(--c-primario) 10%, transparent)" : "#fff",
              color: c.requerido ? "var(--c-primario)" : "#6B7280", border: "1px solid #E5E7EB" }}>
              {c.etiqueta}{c.requerido ? " *" : ""}
            </span>
          ))}
        </div>
      </div>
      <textarea value={texto} onChange={e => leer(e.target.value)} rows={8}
        placeholder={"Codigo\tFecha\tHora\tOri\tDes\tInt\tChofer1\tChofer2\nCC22\t07/08/2026\t22:00\tCOR\tCAM\t60527\tMILESSI\tGONZALEZ"}
        style={{ width: "100%", padding: "10px 12px", border: "1.5px solid #E5E7EB", borderRadius: 8,
          fontSize: 12, fontFamily: "ui-monospace,Menlo,Consolas,monospace", boxSizing: "border-box", marginBottom: 14 }} />

      {res && res.error && <Aviso tipo="error">{res.error}</Aviso>}
      {filas.length > 0 && (
        <>
          <Aviso tipo="ok">Leí <strong>{filas.length}</strong> servicio(s). Encabezado detectado: <span style={{ fontSize: 11.5 }}>{res.enc}</span></Aviso>
          <div style={{ maxHeight: 210, overflow: "auto", border: "1px solid #E5E7EB", borderRadius: 8, marginBottom: 14 }}>
            <Table headers={["Código", "Fecha", "Hora", "Origen", "Destino", "Interno", "Chofer 1"]}>
              {filas.slice(0, 30).map((o, i) => (
                <TR key={i}>
                  <TD bold>{o.codigo || "—"}</TD>
                  <TD>{pgFmtF(pgFecha(o.fechaInicio, new Date().getFullYear()))}</TD>
                  <TD>{o.hora || "—"}</TD>
                  <TD>{o.origen || "—"}</TD>
                  <TD>{o.destino || "—"}</TD>
                  <TD>{o.interno || "—"}</TD>
                  <TD>{o.chofer1 || "—"}</TD>
                </TR>
              ))}
            </Table>
          </div>
          {filas.length > 30 && <p style={{ fontSize: 12, color: "#9CA3AF", margin: "0 0 14px" }}>Se muestran las primeras 30 de {filas.length}.</p>}
        </>
      )}

      <div style={{ display: "flex", justifyContent: "flex-end", gap: 10 }}>
        <button onClick={onCerrar} style={{ padding: "9px 20px", borderRadius: 8, border: "1.5px solid #E5E7EB", background: "#fff", fontSize: 13, fontWeight: 600, cursor: "pointer", color: "#374151" }}>Cancelar</button>
        <button disabled={!filas.length} onClick={() => { const r = onImportar(filas) || {}; onCerrar(); alert(`Se importaron ${r.agregados || 0} servicio(s).`); }}
          style={{ padding: "9px 20px", borderRadius: 8, border: "none", background: filas.length ? "var(--c-primario)" : "#CBD5E1",
            color: "#fff", fontSize: 13, fontWeight: 600, cursor: filas.length ? "pointer" : "not-allowed" }}>
          Importar {filas.length || ""}
        </button>
      </div>
    </Modal>
  );
};

// ── formulario de un viaje ────────────────────────────────────────────────
const PgFormViaje = ({ inicial, ctx, viajes, onGuardar, onCerrar, onBorrar }) => {
  const [f, setF] = useState(inicial);
  const set = (k, v) => setF(prev => ({ ...prev, [k]: v }));
  const c = pgCalcular(f, ctx);
  const choques = [];
  const di = pgFecha(f.fechaInicio), df = pgFecha(f.fechaFin);
  if (di && df && df < di) choques.push("La fecha de fin es anterior a la de inicio.");
  // el bus no puede viajar el día que está en el concesionario
  if (f.interno && di) {
    const tt = pgTurnosPorDia(f.interno);
    const hasta = (df && df >= di) ? df : di;
    for (let i = 0; i <= pgDiasEntre(di, hasta); i++) {
      const T = tt[pgIso(pgSuma(di, i))];
      if (T) choques.push(`El ${pgFmtF(pgSuma(di, i))} la unidad ${f.interno} tiene TURNO DE TALLER en ${T.concesionario || "el concesionario"}${T.hora ? " a las " + T.hora : ""}.`);
    }
  }
  viajes.forEach(w => {
    if (w.id === f.id || w.estado === "cancelado" || !pgSolapan(f, w)) return;
    if (f.interno && pgNorm(w.interno) === pgNorm(f.interno)) choques.push(`La unidad ${f.interno} ya tiene el viaje ${w.origen}→${w.destino} del ${pgFmtF(w.fechaInicio)}.`);
    [f.chofer1, f.chofer2].forEach(ch => {
      if (ch && (pgNorm(w.chofer1) === pgNorm(ch) || pgNorm(w.chofer2) === pgNorm(ch))) choques.push(`${ch} ya está en el viaje del ${pgFmtF(w.fechaInicio)}.`);
    });
  });
  const locsOrd = ctx.locs.slice().sort((a, b) => String(a.nombre || "").localeCompare(String(b.nombre || "")));
  const guardar = () => {
    if (!f.fechaInicio) { alert("Falta la fecha de inicio."); return; }
    if (!f.origen || !f.destino) { alert("Falta el origen o el destino."); return; }
    onGuardar({ ...f, fechaFin: f.fechaFin || f.fechaInicio });
  };
  return (
    <Modal title={inicial.id ? "Editar viaje" : "Nuevo viaje programado"} onClose={onCerrar}>
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: "0 14px" }}>
