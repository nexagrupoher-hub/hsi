          <Select value={pgClase(f.clase)} onChange={e => set("clase", e.target.value)}>
            {PG_CLASES.map(c => <option key={c.id} value={c.id}>{c.label}</option>)}
          </Select>
        </Field>
        <Field label="Estado">
          <Select value={f.estado} onChange={e => set("estado", e.target.value)}>
            <option value="tentativo">Tentativo</option>
            <option value="confirmado">Confirmado</option>
            <option value="realizado">Realizado</option>
            <option value="cancelado">Cancelado</option>
          </Select>
        </Field>
        <Field label="Fecha de inicio"><Input type="date" value={f.fechaInicio || ""} onChange={e => set("fechaInicio", e.target.value)} /></Field>
        <Field label="Fecha de fin"><Input type="date" value={f.fechaFin || ""} onChange={e => set("fechaFin", e.target.value)} /></Field>
        <Field label="Origen">
          <Select value={f.origen} onChange={e => set("origen", e.target.value)}>
            <option value="">— elegir —</option>
            {locsOrd.map(L => <option key={L.id} value={L.codigo}>{L.nombre} ({L.codigo})</option>)}
          </Select>
        </Field>
        <Field label="Destino">
          <Select value={f.destino} onChange={e => set("destino", e.target.value)}>
            <option value="">— elegir —</option>
            {locsOrd.map(L => <option key={L.id} value={L.codigo}>{L.nombre} ({L.codigo})</option>)}
          </Select>
        </Field>
        <Field label="Unidad (N° interno)">
          <Input list="pg-unidades" value={f.interno || ""} onChange={e => set("interno", e.target.value)} placeholder="60507" />
        </Field>
        <Field label="Contratante">
          <Input list="pg-contratantes" value={f.contratante || ""} onChange={e => set("contratante", e.target.value)} />
        </Field>
        <Field label="Código del servicio">
          <Input value={f.codigo || ""} onChange={e => set("codigo", e.target.value.toUpperCase())} placeholder="CC22, COQN…" />
        </Field>
        <Field label="Hora de salida">
          <Input type="time" value={f.hora || ""} onChange={e => set("hora", e.target.value)} />
        </Field>
        <Field label="Chofer 1"><Input list="pg-choferes" value={f.chofer1 || ""} onChange={e => set("chofer1", e.target.value)} /></Field>
        <Field label="Chofer 2"><Input list="pg-choferes" value={f.chofer2 || ""} onChange={e => set("chofer2", e.target.value)} placeholder="opcional" /></Field>
        <Field label="Kilómetros">
          <Input value={f.kmManual || ""} onChange={e => set("kmManual", e.target.value)} placeholder="se calculan solos" />
        </Field>
        <Field label="Recorrido">
          <label style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 13, cursor: "pointer", padding: "9px 0" }}>
            <input type="checkbox" checked={f.idaVuelta !== false} onChange={e => set("idaVuelta", e.target.checked)} style={{ width: 16, height: 16 }} />
            Ida y vuelta
          </label>
        </Field>
        <Field label="Pasajeros"><Input value={f.pasajeros || ""} onChange={e => set("pasajeros", e.target.value)} placeholder="opcional" /></Field>
        <Field label="Valor cobrado"><Input value={f.tarifa || ""} onChange={e => set("tarifa", e.target.value)} placeholder="opcional" /></Field>
      </div>
      <Field label="Observaciones">
        <Input value={f.observaciones || ""} onChange={e => set("observaciones", e.target.value)} />
      </Field>

      <div style={{ background: choques.length ? "#FFFBEB" : "#F0FDF4", border: `1px solid ${choques.length ? "#FDE68A" : "#BBF7D0"}`, borderRadius: 8, padding: "12px 14px", marginBottom: 16 }}>
        <div style={{ display: "flex", gap: 18, flexWrap: "wrap", fontSize: 12.5, color: "#374151" }}>
          <span><strong>{pgMiles(c.km)} km</strong> <span style={{ color: "#9CA3AF" }}>({c.fuente}{c.estimado ? ", estimado" : ""})</span></span>
          <span>Combustible <strong>{fmt(c.combustible)}</strong> <span style={{ color: "#9CA3AF" }}>{pgMiles(c.litros)} L</span></span>
          <span>Consumo <strong>{c.consumo} L/100</strong> <span style={{ color: "#9CA3AF" }}>({c.consumoFuente})</span></span>
          <span>{c.dias} día{c.dias > 1 ? "s" : ""}</span>
          {c.ingreso > 0 && <span>Margen <strong>{fmt(c.margen)}</strong></span>}
        </div>
        {choques.length > 0 && (
          <div style={{ marginTop: 8, fontSize: 12.5, color: "#92400E" }}>
            <strong>Avisos:</strong>{choques.map((t, i) => <div key={i}>· {t}</div>)}
          </div>
        )}
      </div>

      <div style={{ display: "flex", justifyContent: "space-between", gap: 10 }}>
        <div>
          {inicial.id && onBorrar && (
            <button onClick={() => { if (confirm("¿Borrar este viaje?")) onBorrar(inicial.id); }}
              style={{ padding: "9px 16px", borderRadius: 8, border: "1.5px solid #FCA5A5", background: "#fff", color: "#DC2626", fontSize: 13, fontWeight: 600, cursor: "pointer" }}>Borrar</button>
          )}
        </div>
        <div style={{ display: "flex", gap: 10 }}>
          <button onClick={onCerrar} style={{ padding: "9px 20px", borderRadius: 8, border: "1.5px solid #E5E7EB", background: "#fff", fontSize: 13, fontWeight: 600, cursor: "pointer", color: "#374151" }}>Cancelar</button>
          <button onClick={guardar} style={{ padding: "9px 20px", borderRadius: 8, border: "none", background: "var(--c-primario)", color: "#fff", fontSize: 13, fontWeight: 600, cursor: "pointer" }}>Guardar viaje</button>
        </div>
      </div>
    </Modal>
  );
};

// ── mapa (SVG dibujado a mano, sin librerías ni internet) ─────────────────
const PgMapa = ({ lista, ctx }) => {
  const W = 1000, H = 640, pad = 44;
  const pares = {}, nodos = {};
  lista.forEach(v => {
    const A = pgBuscarLoc(ctx.locs, v.origen), B = pgBuscarLoc(ctx.locs, v.destino);
    if (!A || !B) return;
    const k = A.codigo + "→" + B.codigo;
    if (!pares[k]) pares[k] = { a: A, b: B, n: 0, km: 0, costo: 0, unidades: {}, contratantes: {} };
    const c = pgCalcular(v, ctx);
    pares[k].n++; pares[k].km += c.km; pares[k].costo += c.total;
    if (v.interno) pares[k].unidades[v.interno] = 1;
    if (v.contratante) pares[k].contratantes[v.contratante] = 1;
    [[A, "sal"], [B, "lleg"]].forEach(([L, campo]) => {
      if (!nodos[L.codigo]) nodos[L.codigo] = { L, sal: 0, lleg: 0 };
      nodos[L.codigo][campo]++;
    });
  });
  const claves = Object.keys(pares);
  if (!claves.length) {
    return <Card><div style={{ padding: "48px 20px", textAlign: "center", color: "#9CA3AF", fontSize: 13 }}>
      Todavía no hay viajes con origen y destino ubicados en el mapa.<br />
      <span style={{ fontSize: 12 }}>Cargá las coordenadas en la pestaña «Localidades y rutas».</span>
    </div></Card>;
  }
  const lats = [], lngs = [];
  Object.keys(nodos).forEach(k => { lats.push(nodos[k].L.lat); lngs.push(nodos[k].L.lng); });
  let minLat = Math.min(...lats), maxLat = Math.max(...lats), minLng = Math.min(...lngs), maxLng = Math.max(...lngs);
  const mLat = (maxLat - minLat) * 0.16 + 0.9, mLng = (maxLng - minLng) * 0.16 + 0.9;
  minLat -= mLat; maxLat += mLat; minLng -= mLng; maxLng += mLng;
  const kx = Math.cos((minLat + maxLat) / 2 * Math.PI / 180);
  const escala = Math.min((W - pad * 2) / ((maxLng - minLng) * kx), (H - pad * 2) / (maxLat - minLat));
  const offX = (W - (maxLng - minLng) * kx * escala) / 2, offY = (H - (maxLat - minLat) * escala) / 2;
  const X = lng => offX + (lng - minLng) * kx * escala;
  const Y = lat => offY + (maxLat - lat) * escala;
  const maxN = Math.max(...claves.map(k => pares[k].n));
  const maxLleg = Math.max(1, ...Object.keys(nodos).map(k => nodos[k].lleg));

  let s = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;height:auto">`;
  s += `<defs><radialGradient id="pgGlow" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#E8A020" stop-opacity=".5"/><stop offset="100%" stop-color="#E8A020" stop-opacity="0"/></radialGradient></defs>`;
  s += `<rect width="${W}" height="${H}" fill="#12263F"/>`;
  for (let g = Math.ceil(minLat); g <= Math.floor(maxLat); g++) {
    s += `<line x1="0" y1="${Y(g).toFixed(1)}" x2="${W}" y2="${Y(g).toFixed(1)}" stroke="#fff" stroke-opacity=".045"/>`;
    s += `<text x="5" y="${(Y(g) - 3).toFixed(1)}" fill="#fff" fill-opacity=".2" font-size="9">${g}°</text>`;
  }
  for (let g = Math.ceil(minLng); g <= Math.floor(maxLng); g++) {
    s += `<line x1="${X(g).toFixed(1)}" y1="0" x2="${X(g).toFixed(1)}" y2="${H}" stroke="#fff" stroke-opacity=".045"/>`;
  }
  PG_CONTORNOS.forEach(poly => {
    const d = poly.map((p, i) => `${i ? "L" : "M"}${X(p[0]).toFixed(1)} ${Y(p[1]).toFixed(1)}`).join(" ") + " Z";
    s += `<path d="${d}" fill="#fff" fill-opacity=".035" stroke="#8FB3D9" stroke-opacity=".26" stroke-width="1"/>`;
  });
  claves.slice().sort((a, b) => pares[a].n - pares[b].n).forEach(k => {
    const P = pares[k];
    const x1 = X(P.a.lng), y1 = Y(P.a.lat), x2 = X(P.b.lng), y2 = Y(P.b.lat);
    const dx = x2 - x1, dy = y2 - y1, len = Math.sqrt(dx * dx + dy * dy) || 1;
    const cx = (x1 + x2) / 2 - dy * 0.13, cy = (y1 + y2) / 2 + dx * 0.13;
    const us = Object.keys(P.unidades);
    const col = us.length === 1 ? pgColor(us[0]) : "#9EC5F0";
    const w = 1.1 + (P.n / maxN) * 4.6;
    s += `<path d="M${x1.toFixed(1)} ${y1.toFixed(1)} Q${cx.toFixed(1)} ${cy.toFixed(1)} ${x2.toFixed(1)} ${y2.toFixed(1)}" fill="none" stroke="${col}" stroke-opacity=".8" stroke-width="${w.toFixed(2)}" stroke-linecap="round">` +
      `<title>${P.a.nombre} → ${P.b.nombre} · ${P.n} viaje(s) · ${pgMiles(P.km)} km · unidades ${us.join(", ")}</title></path>`;
  });
  // etiquetas que se corren para no pisarse
  const ocupados = [];
  const libre = b => !ocupados.some(o => b.x < o.x + o.w && b.x + b.w > o.x && b.y < o.y + o.h && b.y + b.h > o.y)
    && b.x > 2 && b.y > 2 && b.x + b.w < W - 2 && b.y + b.h < H - 2;
  const orden = Object.keys(nodos).sort((a, b) => {
    const ba = nodos[a].L.base ? 1 : 0, bb = nodos[b].L.base ? 1 : 0;
    if (ba !== bb) return bb - ba;
    return (nodos[b].lleg + nodos[b].sal) - (nodos[a].lleg + nodos[a].sal);
  });
  orden.forEach(k => {
    const N = nodos[k], x = X(N.L.lng), y = Y(N.L.lat);
    const r = 4 + (N.lleg / maxLleg) * 11;
    N._x = x; N._y = y; N._r = r;
    ocupados.push({ x: x - r - 2, y: y - r - 2, w: r * 2 + 4, h: r * 2 + 4 });
    if (N.lleg > 0) s += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${(r * 2.6).toFixed(1)}" fill="url(#pgGlow)"/>`;
    s += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r.toFixed(1)}" fill="${N.L.base ? "#E8A020" : "#8ECAFC"}" fill-opacity=".92" stroke="#12263F" stroke-width="1.4">` +
      `<title>${N.L.nombre}${N.L.prov ? " · " + N.L.prov : ""} — llegadas: ${N.lleg} · salidas: ${N.sal}</title></circle>`;
  });
  const ANG = [0, -35, 35, 180, -145, 145, -90, 90, -70, 70, -110, 110];
  orden.forEach(k => {
    const N = nodos[k], x = N._x, y = N._y, r = N._r;
    const sub = N.lleg > 0 ? `${N.lleg} llegada${N.lleg > 1 ? "s" : ""}` : "";
    const w = String(N.L.nombre || "").length * 6.6 + 6, alto = sub ? 23 : 14;
    let puesto = null, lejos = false;
    for (let d = 0; d < 5 && !puesto; d++) {
      const dist = r + 7 + d * 26;
      for (const ang of ANG) {
        const a = ang * Math.PI / 180;
        const cx2 = x + Math.cos(a) * dist, cy2 = y + Math.sin(a) * dist;
        const bx = Math.cos(a) < -0.3 ? cx2 - w : (Math.abs(Math.cos(a)) < 0.3 ? cx2 - w / 2 : cx2);
        const b = { x: bx, y: cy2 - alto / 2, w, h: alto };
        if (libre(b)) { puesto = b; lejos = d > 0; break; }
      }
    }
    if (!puesto) return;
    ocupados.push(puesto);
    if (lejos) {
      const ax = puesto.x + w / 2 < x ? puesto.x + w : (puesto.x > x ? puesto.x : puesto.x + w / 2);
      s += `<line x1="${x.toFixed(1)}" y1="${y.toFixed(1)}" x2="${ax.toFixed(1)}" y2="${(puesto.y + alto / 2).toFixed(1)}" stroke="#9DBBDC" stroke-opacity=".5" stroke-width="1" stroke-dasharray="2 2"/>`;
    }
    s += `<text x="${puesto.x.toFixed(1)}" y="${(puesto.y + 11).toFixed(1)}" fill="#E4EEFB" font-size="11.5" font-weight="600" style="paint-order:stroke;stroke:#12263F;stroke-width:3.5px">${N.L.nombre}</text>`;
    if (sub) s += `<text x="${puesto.x.toFixed(1)}" y="${(puesto.y + 22).toFixed(1)}" fill="#93B6DC" font-size="9.5" style="paint-order:stroke;stroke:#12263F;stroke-width:3.5px">${sub}</text>`;
  });
  s += "</svg>";

  const filas = claves.slice().sort((a, b) => pares[b].n - pares[a].n);
  return (
    <>
      <Card style={{ marginBottom: 20 }}>
        <div style={{ padding: "16px 20px", borderBottom: "1px solid #F1F5F9", display: "flex", alignItems: "center", gap: 12, flexWrap: "wrap" }}>
          <h3 style={{ margin: 0, fontSize: 15, fontWeight: 700, color: "var(--c-primario)" }}>Mapa de viajes</h3>
          <span style={{ fontSize: 12, color: "#9CA3AF" }}>{claves.length} recorridos distintos · {Object.keys(nodos).length} localidades</span>
          <span style={{ marginLeft: "auto", fontSize: 11.5, color: "#9CA3AF" }}>
            El grosor de la línea es la cantidad de viajes · el tamaño del punto, las llegadas · en naranja, las bases
          </span>
        </div>
        <div dangerouslySetInnerHTML={{ __html: s }} />
      </Card>
      <Card>
        <div style={{ padding: "16px 20px", borderBottom: "1px solid #F1F5F9" }}>
          <h3 style={{ margin: 0, fontSize: 15, fontWeight: 700, color: "var(--c-primario)" }}>Recorridos del período</h3>
        </div>
        <Table headers={["Recorrido", "Viajes", "Km acumulados", "Combustible estimado", "Unidades", "Contratantes"]}>
          {filas.map(k => {
            const P = pares[k];
            return (
              <TR key={k}>
                <TD bold>{P.a.nombre} → {P.b.nombre}</TD>
                <TD>{P.n}</TD>
                <TD>{pgMiles(P.km)}</TD>
                <TD>{fmt(P.costo)}</TD>
                <TD>{Object.keys(P.unidades).join(", ")}</TD>
                <TD>{Object.keys(P.contratantes).join(", ")}</TD>
              </TR>
            );
          })}
        </Table>
      </Card>
    </>
  );
};

// ── línea de tiempo (ocupación de cada unidad, día por día) ───────────────
const PgTimeline = ({ lista, ctx }) => {
  const fs = lista.map(v => pgFecha(v.fechaInicio)).filter(Boolean);
  if (!fs.length) return <Card><div style={{ padding: "48px 20px", textAlign: "center", color: "#9CA3AF", fontSize: 13 }}>No hay viajes para mostrar.</div></Card>;
  const ff = lista.map(v => pgFecha(v.fechaFin) || pgFecha(v.fechaInicio)).filter(Boolean);
  /* La ventana también tiene que abarcar los turnos de taller de esas unidades:
     si no, un turno agendado más adelante que el último viaje queda fuera de la
     pantalla y parece que el módulo no lo ve. */
  const internosVista = pgUnicos(lista.map(v => v.interno));
  pgTurnosTaller().forEach(t => {
    if (internosVista.some(u => pgNorm(u) === pgNorm(t.interno))) {
      const d = pgFecha(t.fecha);
      if (d) { fs.push(d); ff.push(d); }
    }
  });
  let desde = new Date(Math.min(...fs.map(d => d.getTime())));
  let hasta = new Date(Math.max(...ff.map(d => d.getTime())));
  if (hasta < desde) hasta = desde;
  desde = pgSuma(desde, -1); hasta = pgSuma(hasta, 1);
  let total = pgDiasEntre(desde, hasta) + 1;
  if (total > 120) { desde = pgSuma(hasta, -119); total = 120; }
  const unidades = pgUnicos(lista.map(v => v.interno)).sort();
  const anchoDia = Math.max(17, Math.min(34, Math.round(1100 / total)));
  const anchoTot = anchoDia * total;

  const ocupacion = unidades.map(u => {
    const vs = lista.filter(v => v.interno === u);
    let d = 0; vs.forEach(v => { d += pgCalcular(v, ctx).dias; });
    return { u, dias: d, viajes: vs.length, pct: Math.min(100, d / total * 100) };
  }).sort((a, b) => b.dias - a.dias);

  return (
    <>
      <Card style={{ marginBottom: 20 }}>
        <div style={{ padding: "16px 20px", borderBottom: "1px solid #F1F5F9", display: "flex", alignItems: "center", gap: 12, flexWrap: "wrap" }}>
          <h3 style={{ margin: 0, fontSize: 15, fontWeight: 700, color: "var(--c-primario)" }}>Ocupación de las unidades</h3>
          <span style={{ fontSize: 12, color: "#9CA3AF" }}>{pgFmtF(desde)} a {pgFmtF(hasta)} · {total} días</span>
          <span style={{ marginLeft: "auto", fontSize: 11.5, color: "#9CA3AF", display: "flex", gap: 14, alignItems: "center", flexWrap: "wrap" }}>
            <span>La barra rayada es un viaje tentativo</span>
            <span style={{ display: "inline-flex", alignItems: "center", gap: 5 }}>
              <span style={{ width: 22, height: 3, background: "#F5C518", borderRadius: 3, display: "inline-block" }} />
              días libres entre viajes
            </span>
            <span style={{ display: "inline-flex", alignItems: "center", gap: 5 }}>
              <span style={{ width: 13, height: 13, borderRadius: 3, display: "inline-block", borderLeft: "2px solid var(--c-primario)",
                background: "repeating-linear-gradient(45deg,rgba(27,58,107,.14) 0 4px,rgba(27,58,107,.30) 4px 8px)" }} />
              turno de taller
            </span>
          </span>
        </div>
        <div style={{ overflowX: "auto" }}>
          <div style={{ minWidth: 140 + anchoTot }}>
            <div style={{ display: "flex", background: "#F8FAFC", borderBottom: "1px solid #E5E7EB", position: "sticky", top: 0 }}>
              <div style={{ width: 140, flexShrink: 0, padding: "7px 12px", fontSize: 11, fontWeight: 700, color: "#6B7280", borderRight: "1px solid #E5E7EB" }}>Unidad</div>
              {Array.from({ length: total }, (_, i) => {
                const d = pgSuma(desde, i), we = d.getDay() === 0 || d.getDay() === 6;
                return <div key={i} style={{ width: anchoDia, flexShrink: 0, textAlign: "center", fontSize: 9.5, color: "#9CA3AF", padding: "5px 0", borderRight: "1px solid #F1F5F9", background: we ? "#EEF2F8" : "transparent" }}>
                  {(i === 0 || d.getDate() === 1) && <div style={{ fontSize: 10, fontWeight: 700, color: "#6B7280" }}>{PG_MESC[d.getMonth()]}</div>}
                  {d.getDate()}
                </div>;
              })}
            </div>
            {unidades.map(u => {
              const turnosU = pgTurnosPorDia(u);
              const vs = lista.filter(v => v.interno === u);
              const ocup = [];
              const barras = vs.map(v => {
                const a = pgFecha(v.fechaInicio); let b = pgFecha(v.fechaFin) || a;
                if (!a) return null;
                if (b < a) b = a;
                const i0 = Math.max(0, pgDiasEntre(desde, a)), i1 = Math.min(total - 1, pgDiasEntre(desde, b));
                if (i1 < 0 || i0 > total - 1) return null;
                let fila = 0;
                while (ocup[fila] && ocup[fila] > i0) fila++;
                ocup[fila] = i1 + 1;
                return { v, i0, i1, fila };
              }).filter(Boolean);
              const alto = Math.max(38, 10 + (ocup.length || 1) * 26);
              const U = pgBuscarUnidad(ctx.vehiculos, u);
              return (
                <div key={u} style={{ display: "flex", borderBottom: "1px solid #F1F5F9", minHeight: alto }}>
                  <div style={{ width: 140, flexShrink: 0, padding: "8px 12px", borderRight: "1px solid #E5E7EB" }}>
                    <div style={{ fontSize: 12.5, fontWeight: 700, color: "#111827" }}>{u || "sin unidad"}</div>
                    <div style={{ fontSize: 10, color: "#9CA3AF" }}>{U ? (U.patente || U.modelo || "") : "no está en Vehículos"}</div>
                  </div>
                  <div style={{ position: "relative", width: anchoTot, flexShrink: 0 }}>
                    {Array.from({ length: total }, (_, i) => {
                      const d = pgSuma(desde, i), we = d.getDay() === 0 || d.getDay() === 6;
                      const T = turnosU[pgIso(d)];
                      return <div key={i} title={T ? `TALLER: ${T.concesionario || ""} ${T.hora || ""} ${T.notas || ""}` : ""}
                        style={{ position: "absolute", left: i * anchoDia, top: 0, bottom: 0, width: anchoDia,
                          borderRight: "1px solid #F1F5F9",
                          background: T ? "repeating-linear-gradient(45deg,rgba(27,58,107,.14) 0 4px,rgba(27,58,107,.30) 4px 8px)" : (we ? "#F8FAFC" : "transparent"),
                          borderLeft: T ? "2px solid var(--c-primario)" : "none" }} />;
                    })}
                    {(() => {
                      /* Los huecos entre viajes: ahí es donde entra un service.
                         Se dibujan como una línea ámbar con la cantidad de días. */
                      const ocupados = {};
                      barras.forEach(B => { for (let i = B.i0; i <= B.i1; i++) ocupados[i] = 1; });
                      const huecos = []; let ini = null;
                      for (let i = 0; i < total; i++) {
                        if (!ocupados[i] && ini === null) ini = i;
                        if ((ocupados[i] || i === total - 1) && ini !== null) {
                          const fin = ocupados[i] ? i - 1 : i;
                          if (fin >= ini) huecos.push({ i0: ini, i1: fin });
                          ini = null;
                        }
                      }
                      return huecos.filter(h => (h.i1 - h.i0 + 1) >= 2).map((h, hi) => {
                        const dias = h.i1 - h.i0 + 1;
                        const ancho = dias * anchoDia - 8;
                        const entreViajes = h.i0 > 0 && h.i1 < total - 1;
                        return (
                          <div key={"h" + hi} title={`${dias} día(s) sin viajes: del ${pgFmtF(pgSuma(desde, h.i0))} al ${pgFmtF(pgSuma(desde, h.i1))}`}
                            style={{ position: "absolute", left: h.i0 * anchoDia + 4, width: Math.max(6, ancho),
                              top: 16, height: 3, borderRadius: 3,
                              background: entreViajes ? "#F5C518" : "#E5E7EB" }}>
                            {ancho > 42 && (
                              <span style={{ position: "absolute", left: "50%", top: -13, transform: "translateX(-50%)",
                                fontSize: 9.5, fontWeight: 700, color: entreViajes ? "#8A6A12" : "#9CA3AF", whiteSpace: "nowrap" }}>
                                {dias} d
                              </span>
                            )}
                          </div>
                        );
                      });
                    })()}
                    {barras.map((B, bi) => {
                      const tent = B.v.estado === "tentativo";
                      return (
                        <div key={bi} title={`${B.v.origen} → ${B.v.destino} · ${pgFmtF(B.v.fechaInicio)} a ${pgFmtF(B.v.fechaFin)}${B.v.contratante ? " · " + B.v.contratante : ""}`}
                          style={{
                            position: "absolute", left: B.i0 * anchoDia + 1, width: (B.i1 - B.i0 + 1) * anchoDia - 2,
                            top: 6 + B.fila * 26, height: 22, borderRadius: 5, background: pgColor(u), opacity: tent ? 0.72 : 1,
                            backgroundImage: tent ? "repeating-linear-gradient(45deg,rgba(255,255,255,.28) 0 5px,transparent 5px 10px)" : "none",
                            color: "#fff", fontSize: 10.5, display: "flex", alignItems: "center", padding: "0 6px",
                            overflow: "hidden", whiteSpace: "nowrap", boxShadow: "0 1px 3px rgba(20,40,70,.22)",
                          }}>
                          {B.v.destino}
                        </div>
                      );
                    })}
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      </Card>

      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit,minmax(320px,1fr))", gap: 20, alignItems: "start" }}>
        <Card>
          <div style={{ padding: "16px 20px", borderBottom: "1px solid #F1F5F9" }}>
            <h3 style={{ margin: 0, fontSize: 15, fontWeight: 700, color: "var(--c-primario)" }}>Días ocupados por unidad</h3>
            <span style={{ fontSize: 12, color: "#9CA3AF" }}>sobre {total} días</span>
          </div>
          <div style={{ padding: 20 }}>
            {ocupacion.map(o => (
              <div key={o.u} style={{ marginBottom: 12 }}>
                <div style={{ display: "flex", justifyContent: "space-between", fontSize: 12.5, marginBottom: 4 }}>
                  <strong>{o.u || "sin unidad"}</strong>
                  <span style={{ color: "#6B7280" }}>{o.dias} días · {o.viajes} viajes · {Math.round(o.pct)}%</span>
                </div>
                <div style={{ height: 7, background: "#F1F5F9", borderRadius: 99 }}>
                  <div style={{ height: "100%", width: o.pct.toFixed(1) + "%", background: pgColor(o.u), borderRadius: 99 }} />
                </div>
              </div>
            ))}
          </div>
        </Card>
        <Card>
          <div style={{ padding: "16px 20px", borderBottom: "1px solid #F1F5F9" }}>
            <h3 style={{ margin: 0, fontSize: 15, fontWeight: 700, color: "var(--c-primario)" }}>Capacidad libre</h3>
          </div>
          <div style={{ padding: 20 }}>
            {ocupacion.filter(o => o.pct < 25).length === 0
              ? <Aviso tipo="ok">Todas las unidades tienen más de un cuarto del período comprometido.</Aviso>
              : <>
                <p style={{ margin: "0 0 12px", fontSize: 12.5, color: "#6B7280" }}>Unidades con menos de un cuarto del período tomado. Son las que te quedan para vender.</p>
                {ocupacion.filter(o => o.pct < 25).map(o => (
                  <div key={o.u} style={{ display: "flex", justifyContent: "space-between", padding: "7px 0", borderBottom: "1px solid #F1F5F9", fontSize: 12.5 }}>
                    <strong>{o.u || "sin unidad"}</strong>
                    <span style={{ color: "#9CA3AF" }}>{o.dias} de {total} días · {Math.round(o.pct)}%</span>
                  </div>
                ))}
              </>}
          </div>
        </Card>
      </div>
    </>
  );
};

// ── productividad de la programación ──────────────────────────────────────
/* La pregunta que responde: de los días que el mes tiene, ¿cuántos usó
   realmente cada bus? Un colectivo parado no deja de costar, así que los días
   sin viaje son plata que no se hizo.

   Cómo se arma, paso por paso:
     días del mes            los que tiene el mes
     − días programados      los que tienen algún viaje cargado
     − días en taller        los que tienen turno de mantenimiento
     = días parados          los que se podrían haber vendido y no se vendieron

   Después esos días se pasan a horas (jornada configurable) y se les descuentan
   las horas que el taller se lleva, para no cargarle a tráfico un día en el que
   la unidad no estaba disponible. Lo que queda son las horas ociosas reales.

   Y los kilómetros: cada día parado se multiplica por lo que esa unidad rinde
   en un día de trabajo. Eso da los kilómetros que se podrían haber hecho. Es el
   número que después se lleva al panel gerencial para ponerle precio.        */

/* El parque hace tres cosas distintas y conviene medirlas por separado: el
   turismo es a pedido, las líneas nacionales son frecuencia fija, y las
   internacionales suman aduana y descansos. "regular" es como se llamaba antes
   a las nacionales: se sigue leyendo para no perder lo ya cargado. */
const PG_CLASES = [
  { id: "turismo", label: "Turismo", corto: "Turismo", color: "#16A34A" },
  { id: "nacional", label: "Línea nacional", corto: "Nacionales", color: "#2563a8" },
  { id: "internacional", label: "Línea internacional", corto: "Internacionales", color: "#8e44ad" },
];
const pgClase = (v) => {
  const c = pgNorm(v);
  if (c.indexOf("INTERNACIONAL") > -1 || c === "INTER") return "internacional";
  if (c.indexOf("NACIONAL") > -1 || c.indexOf("REGULAR") > -1 || c.indexOf("LINEA") > -1) return "nacional";
  return "turismo";
};
const pgClaseLabel = (id) => (PG_CLASES.find(c => c.id === id) || PG_CLASES[0]).label;

const PG_PROD_DEF = { horasJornada: 10, horasPorService: 8, kmObjetivoDia: 0 };

const PgProductividad = ({ viajes, ctx, vehiculos, cfg, setCfg }) => {
  const hoy = pgHoy();
  const [mes, setMes] = useState(() => `${hoy.getFullYear()}-${String(hoy.getMonth() + 1).padStart(2, "0")}`);
  const par = { ...PG_PROD_DEF, ...(cfg.prod || {}) };
  const setPar = (k, v) => setCfg(p => ({ ...p, prod: { ...PG_PROD_DEF, ...(p.prod || {}), [k]: pgNum(v) } }));

  const meses = [];
  for (let i = 0; i < 14; i++) {
    const d = new Date(hoy.getFullYear(), hoy.getMonth() - i, 1);
    meses.push({ id: `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`,
                 label: `${PG_MESC[d.getMonth()]} ${d.getFullYear()}` });
  }
  const anio = +mes.slice(0, 4), mesN = +mes.slice(5) - 1;
  const primero = new Date(anio, mesN, 1), ultimo = new Date(anio, mesN + 1, 0);
  const diasMes = ultimo.getDate();
  const etiquetaMes = (meses.find(m => m.id === mes) || { label: mes }).label;

  // Se evalúan todas las unidades de la flota, no solo las que tienen viajes:
  // un bus sin ningún viaje cargado es justamente el caso más grave.
  const internos = pgUnicos([].concat(
    (vehiculos || []).filter(V => !V.estado || esActivo(V.estado)).map(V => V.vehiculo).filter(Boolean),
    viajes.map(v => v.interno)
  )).sort();

  const crudas = internos.map(u => {
    const ocup = pgDiasOcupados(u);
    const turnos = pgTurnosPorDia(u);
    let diasProg = 0, diasTaller = 0, kmMes = 0;
    for (let i = 0; i < diasMes; i++) {
      const iso = pgIso(new Date(anio, mesN, i + 1));
      if (ocup[iso]) diasProg++;
      else if (turnos[iso]) diasTaller++;
    }
    viajes.forEach(v => {
      if (pgNorm(v.interno) !== pgNorm(u) || v.estado === "cancelado") return;
      const a = pgFecha(v.fechaInicio); let b = pgFecha(v.fechaFin) || a;
      if (!a) return;
      if (b < a) b = a;
      const dur = pgDiasEntre(a, b) + 1;
      const porDia = pgCalcular(v, ctx).km / dur;
      for (let i = 0; i < dur; i++) {
        const d = pgSuma(a, i);
        if (d >= primero && d <= ultimo) kmMes += porDia;
      }
    });
    const diasParados = Math.max(0, diasMes - diasProg - diasTaller);
    const pctUso = diasMes ? diasProg / diasMes * 100 : 0;
    const kmDiaActivo = diasProg ? kmMes / diasProg : 0;
    const horasDisp = diasMes * pgNum(par.horasJornada);
    const horasProg = diasProg * pgNum(par.horasJornada);
    const horasTaller = diasTaller * Math.min(pgNum(par.horasPorService), pgNum(par.horasJornada));
    const horasOciosas = Math.max(0, horasDisp - horasProg - horasTaller);
    return { u, diasProg, diasTaller, diasParados, pctUso, kmMes, kmDiaActivo, horasOciosas };
  });

  /* La unidad que no trabajó ni un día no tiene rendimiento propio con el cual
     compararse, y es justamente el peor caso: si la dejaba en cero, el bus más
     parado de todos quedaba sin número. Para esas se usa lo que rinde el resto
     de la flota en un día de trabajo. */
  const activas = crudas.filter(f => f.kmDiaActivo > 0);
  const kmDiaFlota = activas.length ? activas.reduce((a, f) => a + f.kmDiaActivo, 0) / activas.length : 0;

  const filas = crudas.map(f => {
    const objetivo = pgNum(par.kmObjetivoDia);
    const kmDiaRef = objetivo > 0 ? objetivo : (f.kmDiaActivo > 0 ? f.kmDiaActivo : kmDiaFlota);
    const refPropia = objetivo > 0 ? "objetivo" : (f.kmDiaActivo > 0 ? "propia" : "flota");
    return { ...f, kmDiaRef, refPropia, kmPosibles: f.diasParados * kmDiaRef };
  }).sort((a, b) => a.pctUso - b.pctUso);

  const T = filas.reduce((a, f) => ({
    diasProg: a.diasProg + f.diasProg, diasTaller: a.diasTaller + f.diasTaller,
    diasParados: a.diasParados + f.diasParados, km: a.km + f.kmMes,
    horasOciosas: a.horasOciosas + f.horasOciosas, kmPosibles: a.kmPosibles + f.kmPosibles,
  }), { diasProg: 0, diasTaller: 0, diasParados: 0, km: 0, horasOciosas: 0, kmPosibles: 0 });
  const diasFlota = filas.length * diasMes;
  const usoFlota = diasFlota ? T.diasProg / diasFlota * 100 : 0;
  const color = (p) => p >= 70 ? "#16A34A" : p >= 40 ? "#E8A020" : "#DC2626";

  return (
    <>
      <Card style={{ marginBottom: 20 }}>
        <div style={{ padding: "14px 20px", display: "flex", gap: 14, alignItems: "flex-end", flexWrap: "wrap" }}>
          <div style={{ width: 175 }}>
            <label style={{ display: "block", fontSize: 10.5, fontWeight: 700, color: "#6B7280", textTransform: "uppercase", letterSpacing: "0.5px", marginBottom: 4 }}>Mes</label>
            <Select value={mes} onChange={e => setMes(e.target.value)}>
              {meses.map(m => <option key={m.id} value={m.id}>{m.label}</option>)}
            </Select>
          </div>
          <div style={{ fontSize: 12.5, color: "#6B7280", paddingBottom: 9 }}>
            {diasMes} días · {filas.length} unidad(es) · <strong>{pgMiles(diasFlota)}</strong> días-bus disponibles en el mes
          </div>
          <div style={{ marginLeft: "auto", display: "flex", gap: 12, alignItems: "flex-end", flexWrap: "wrap" }}>
            <div style={{ width: 118 }}>
              <label style={{ display: "block", fontSize: 10.5, fontWeight: 700, color: "#6B7280", textTransform: "uppercase", marginBottom: 4 }}>Horas por jornada</label>
              <Input value={par.horasJornada} onChange={e => setPar("horasJornada", e.target.value)} style={{ padding: "6px 9px" }} />
            </div>
            <div style={{ width: 128 }}>
              <label style={{ display: "block", fontSize: 10.5, fontWeight: 700, color: "#6B7280", textTransform: "uppercase", marginBottom: 4 }}>Horas por service</label>
              <Input value={par.horasPorService} onChange={e => setPar("horasPorService", e.target.value)} style={{ padding: "6px 9px" }} />
            </div>
            <div style={{ width: 150 }}>
              <label style={{ display: "block", fontSize: 10.5, fontWeight: 700, color: "#6B7280", textTransform: "uppercase", marginBottom: 4 }}>Km/día objetivo</label>
              <Input value={par.kmObjetivoDia} onChange={e => setPar("kmObjetivoDia", e.target.value)} placeholder="0 = usar el propio" style={{ padding: "6px 9px" }} />
            </div>
          </div>
        </div>
      </Card>

      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit,minmax(230px,1fr))", gap: 16, marginBottom: 20 }}>
        <KpiCard label="Uso de la flota" value={usoFlota.toFixed(0) + "%"} icon="chart" color={color(usoFlota)}
          sub={`${T.diasProg} de ${diasFlota} días-bus con viaje`} />
        <KpiCard label="Días parados" value={pgMiles(T.diasParados)} icon="reloj" color={T.diasParados ? "#DC2626" : "#16A34A"}
          sub={T.diasTaller ? `${T.diasTaller} día(s) en taller, no se cuentan` : "sin días en taller"} />
        <KpiCard label="Horas ociosas" value={pgMiles(T.horasOciosas) + " h"} icon="reloj" color="#E8A020"
          sub={`jornada de ${par.horasJornada} h, ya descontado el taller`} />
        <KpiCard label="Km que se podrían haber hecho" value={pgMiles(T.kmPosibles)} icon="truck" color="#DC2626"
          sub={T.km ? `contra ${pgMiles(T.km)} km programados` : "no hay viajes cargados en el mes"} />
      </div>

      {T.kmPosibles > 0 && (
        <div style={{ background: "#FFFBEB", border: "1px solid #FDE68A", borderRadius: 8, padding: "14px 18px", marginBottom: 20, fontSize: 13, color: "#92400E", lineHeight: 1.7 }}>
          Con la flota parada <strong>{pgMiles(T.diasParados)} días</strong> en {etiquetaMes}, se dejaron de recorrer
          <strong> {pgMiles(T.kmPosibles)} km</strong> que las unidades estaban en condiciones de hacer:
          <strong> {pgMiles(T.horasOciosas)} horas</strong> de bus disponible que nadie vendió.
          {usoFlota < 40 && " Con menos del 40% de uso, el costo fijo por kilómetro se dispara: cada kilómetro que sí se recorre carga con el costo de todos los días que el bus no salió."}
        </div>
      )}

      <Card style={{ marginBottom: 20 }}>
        <div style={{ padding: "16px 20px", borderBottom: "1px solid #F1F5F9" }}>
          <h3 style={{ margin: 0, fontSize: 15, fontWeight: 700, color: "var(--c-primario)" }}>Uso por unidad</h3>
          <span style={{ fontSize: 12, color: "#9CA3AF" }}>de peor a mejor · verde 70% o más, ámbar entre 40 y 70, rojo por debajo de 40 · la franja azul es taller</span>
        </div>
        <div style={{ padding: 20 }}>
          {filas.map(f => (
            <div key={f.u} style={{ marginBottom: 13 }}>
              <div style={{ display: "flex", justifyContent: "space-between", fontSize: 12.5, marginBottom: 4, flexWrap: "wrap", gap: 8 }}>
                <span><strong>{f.u}</strong> <span style={{ color: "#9CA3AF" }}>
                  {f.diasProg} día(s) con viaje · {f.diasParados} parado(s){f.diasTaller ? ` · ${f.diasTaller} en taller` : ""}</span></span>
                <span style={{ color: color(f.pctUso), fontWeight: 700 }}>
                  {f.pctUso.toFixed(0)}%
                  {f.kmPosibles > 0 && <span style={{ color: "#9CA3AF", fontWeight: 400 }}> · {pgMiles(f.kmPosibles)} km sin hacer</span>}
                </span>
              </div>
              <div style={{ height: 9, background: "#F1F5F9", borderRadius: 99, display: "flex", overflow: "hidden" }}>
                <div style={{ width: (f.diasProg / diasMes * 100).toFixed(1) + "%", background: color(f.pctUso) }} />
                <div style={{ width: (f.diasTaller / diasMes * 100).toFixed(1) + "%", background: "var(--c-primario)", opacity: .55 }} />
              </div>
            </div>
          ))}
          {!filas.length && <span style={{ fontSize: 12.5, color: "#9CA3AF" }}>Todavía no hay unidades cargadas en Vehículos ni viajes con interno.</span>}
        </div>
      </Card>

      <Card>
        <div style={{ padding: "16px 20px", borderBottom: "1px solid #F1F5F9" }}>
          <h3 style={{ margin: 0, fontSize: 15, fontWeight: 700, color: "var(--c-primario)" }}>El número, abierto</h3>
          <span style={{ fontSize: 12, color: "#9CA3AF" }}>para poder auditar de dónde sale cada cosa</span>
        </div>
        <Table headers={["Interno", "Días del mes", "Con viaje", "En taller", "Parado", "% uso", "Km programados",
                         "Km por día trabajado", "Horas ociosas", "Km que podría haber hecho"]}>
          {filas.map(f => (
            <TR key={f.u}>
              <TD bold>{f.u}</TD>
              <TD>{diasMes}</TD>
              <TD>{f.diasProg}</TD>
              <TD>{f.diasTaller || "—"}</TD>
              <TD><span style={{ color: f.diasParados > diasMes / 2 ? "#DC2626" : "#374151", fontWeight: f.diasParados > diasMes / 2 ? 700 : 400 }}>{f.diasParados}</span></TD>
              <TD><span style={{ color: color(f.pctUso), fontWeight: 700 }}>{f.pctUso.toFixed(0)}%</span></TD>
              <TD>{pgMiles(f.kmMes)}</TD>
              <TD>{f.diasProg ? pgMiles(f.kmDiaActivo)
                : <span style={{ color: "#9CA3AF" }}>{pgMiles(f.kmDiaRef)} <span style={{ fontSize: 10.5 }}>(promedio de la flota)</span></span>}</TD>
              <TD>{pgMiles(f.horasOciosas)} h</TD>
              <TD bold>{f.kmPosibles > 0 ? pgMiles(f.kmPosibles) : "—"}</TD>
            </TR>
          ))}
          <TR>
            <TD bold>Total</TD><TD bold>{diasMes}</TD><TD bold>{T.diasProg}</TD><TD bold>{T.diasTaller || "—"}</TD>
            <TD bold>{T.diasParados}</TD><TD bold>{usoFlota.toFixed(0)}%</TD><TD bold>{pgMiles(T.km)}</TD><TD></TD>
            <TD bold>{pgMiles(T.horasOciosas)} h</TD><TD bold>{pgMiles(T.kmPosibles)}</TD>
          </TR>
        </Table>
        <div style={{ padding: "14px 20px", borderTop: "1px solid #F1F5F9", fontSize: 12, color: "#9CA3AF", lineHeight: 1.8 }}>
          <strong style={{ color: "#374151" }}>Cómo se calcula.</strong><br />
          <strong>Parado</strong> = días del mes − días con viaje − días en taller. Los días de taller no se le cargan a tráfico:
          esos días la unidad no estaba disponible para vender.<br />
          <strong>Horas ociosas</strong> = días parados × {par.horasJornada} h de jornada.<br />
          <strong>Km que podría haber hecho</strong> = días parados × {pgNum(par.kmObjetivoDia) > 0
            ? `${pgMiles(par.kmObjetivoDia)} km, el objetivo cargado arriba`
            : "los kilómetros que esa misma unidad rinde en un día que sí trabaja"}.
          {pgNum(par.kmObjetivoDia) <= 0 && kmDiaFlota > 0 &&
            ` A la unidad que no trabajó ningún día del mes se le aplica el promedio de la flota, ${pgMiles(kmDiaFlota)} km por día: es el caso más grave y no puede quedar sin número.`}<br />
          Si preferís medir contra una meta en vez de contra el propio rendimiento de cada unidad, cargá un km/día objetivo
          arriba y la cuenta pasa a usar ese número para todas.
        </div>
      </Card>
    </>
  );
};


// ── localidades y rutas ───────────────────────────────────────────────────
const PgLocalidades = ({ ctx, viajes, setLocs, setRutas }) => {
  const [modal, setModal] = useState(null);
  const [modalRuta, setModalRuta] = useState(null);
  const usadas = {};
  viajes.forEach(v => { usadas[pgNorm(v.origen)] = 1; usadas[pgNorm(v.destino)] = 1; });
  const faltan = Object.keys(usadas).filter(k => k && !pgBuscarLoc(ctx.locs, k));
  const dudosas = ctx.locs.filter(L => L.verificar);

  const pares = {};
  viajes.forEach(v => {
    const A = pgBuscarLoc(ctx.locs, v.origen), B = pgBuscarLoc(ctx.locs, v.destino);
    if (!A || !B) return;
    const k = pgClaveRuta(A.codigo, B.codigo);
    pares[k] = pares[k] || { a: A, b: B, n: 0 };
    pares[k].n++;
  });

  const guardarLoc = (L) => {
    setLocs(prev => L.id && prev.some(x => x.id === L.id) ? prev.map(x => x.id === L.id ? L : x) : [...prev, { ...L, id: L.id || pgId() }]);
    setModal(null);
  };
  const guardarRuta = (R) => {
    setRutas(prev => {
      const ex = prev.find(x => pgClaveRuta(x.origen, x.destino) === pgClaveRuta(R.origen, R.destino));
      return ex ? prev.map(x => x.id === ex.id ? { ...x, ...R, id: ex.id } : x) : [...prev, { ...R, id: pgId() }];
    });
    setModalRuta(null);
  };

  return (
    <>
      {faltan.length > 0 && <Aviso tipo="alerta">
        <strong>{faltan.length} código(s) de la planilla sin localidad cargada:</strong> {faltan.join(", ")}. Sin coordenadas no se calculan kilómetros ni se dibuja el recorrido.
      </Aviso>}
      {dudosas.length > 0 && <Aviso tipo="alerta">
        <strong>Ubicaciones que puse aproximadas y conviene confirmar:</strong> {dudosas.map(L => L.nombre).join(", ")}. El código de la planilla no alcanzaba para ubicarlas con certeza.
      </Aviso>}

      <Card style={{ marginBottom: 20 }}>
        <div style={{ padding: "16px 20px", borderBottom: "1px solid #F1F5F9", display: "flex", alignItems: "center", gap: 12 }}>
          <h3 style={{ margin: 0, fontSize: 15, fontWeight: 700, color: "var(--c-primario)" }}>Localidades</h3>
          <span style={{ fontSize: 12, color: "#9CA3AF" }}>{ctx.locs.length} cargadas</span>
          <button onClick={() => setModal({ codigo: "", nombre: "", prov: "", lat: "", lng: "", alias: "" })}
            style={{ marginLeft: "auto", padding: "7px 14px", borderRadius: 8, border: "none", background: "var(--c-primario)", color: "#fff", fontSize: 12.5, fontWeight: 600, cursor: "pointer" }}>+ Agregar</button>
        </div>
        <Table headers={["Código", "Nombre", "Provincia / país", "Latitud", "Longitud", "Otros nombres", "", ""]}>
          {ctx.locs.map(L => (
            <TR key={L.id}>
              <TD bold>{L.codigo}</TD>
              <TD>{L.nombre} {L.verificar && <PgChip tono="alerta">revisar ubicación</PgChip>} {L.base && <PgChip tono="info">base</PgChip>}</TD>
              <TD>{L.prov || ""}</TD>
              <TD>{L.lat ? Number(L.lat).toFixed(4) : "—"}</TD>
              <TD>{L.lng ? Number(L.lng).toFixed(4) : "—"}</TD>
              <TD>{L.alias || ""}</TD>
              <TD style={{ whiteSpace: "nowrap" }}>
                <button onClick={() => window.open(L.lat ? pgMapsPunto(L.lat + "," + L.lng) : pgMapsPunto(L.nombre + " " + (L.prov || "")), "_blank")}
                  title="Ver el punto en Google Maps"
                  style={{ background: "none", border: "none", cursor: "pointer", color: "#1a73e8", fontSize: 12, fontWeight: 600, marginRight: 10 }}>Ver en Maps</button>

      {modalRuta && <PgModalRuta inicial={modalRuta} locs={ctx.locs} onGuardar={guardarRuta} onCerrar={() => setModalRuta(null)} />}
    </>
  );
};

  `https://www.google.com/maps/dir/?api=1&origin=${pgPunto(A)}&destination=${pgPunto(B)}&travelmode=driving`;
const pgMapsPunto = (texto) =>
  `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(texto || "")}`;

// ═══ MÓDULO PRINCIPAL ═════════════════════════════════════════════════════
const Programados = ({ vehiculos, conductores, empresaActiva, empresas }) => {
  const [viajes, setViajes] = useState(() => pgLeer(PG_LS.viajes, []));
  const [locs, setLocs] = useState(() => { const L = pgLocsLimpias(pgLeer(PG_LS.locs, PG_LOCS_INIT)); return L.length ? L : PG_LOCS_INIT; });
  const [rutas, setRutas] = useState(() => pgLeer(PG_LS.rutas, PG_RUTAS_INIT));
  const [cfg, setCfg] = useState(() => pgCfgLimpia(pgLeer(PG_LS.cfg, {})));
  /* UNA SOLA URL para toda la app: Programados ya no tiene la suya.
     Toma la del engranaje de arriba y la deja escrita en PROG_API_URL, que es
     de donde la lee el Plan de mantenimiento. Así no hay manera de que queden
     dos direcciones distintas apuntando a planillas distintas. */
  const [api, setApi] = useState(() => SHEET_API_URL || almacen.get(PG_LS.api) || "");
  useEffect(() => {
    const sincronizarUrl = () => {
      const u = SHEET_API_URL || "";
      if (u) { almacen.set(PG_LS.api, u); setApi(u); }
    };
    sincronizarUrl();
    window.addEventListener("sheet-api-url", sincronizarUrl);
    return () => window.removeEventListener("sheet-api-url", sincronizarUrl);
  }, []);
  const [vista, setVista] = useState("planilla");
  const [modal, setModal] = useState(null);
  const [busca, setBusca] = useState("");
  const [fClase, setFClase] = useState("todas");
  const [fEstado, setFEstado] = useState("todos");
  const [fUnidad, setFUnidad] = useState("");
  const [fDesde, setFDesde] = useState("");
  const [fHasta, setFHasta] = useState("");
  const [verAvisos, setVerAvisos] = useState(false);
  const [subLinea, setSubLinea] = useState("todas");
  const [pegar, setPegar] = useState(false);
  const [sel, setSel] = useState({});
  const [sinc, setSinc] = useState({ estado: "", texto: "" });
  const cargadoProg = useRef(false);
  const timerProg = useRef(null);
  const firmaProg = useRef("");

  useEffect(() => { pgGuardar(PG_LS.viajes, viajes); }, [viajes]);
  useEffect(() => { pgGuardar(PG_LS.locs, locs); }, [locs]);
  useEffect(() => { pgGuardar(PG_LS.rutas, rutas); }, [rutas]);
  useEffect(() => { pgGuardar(PG_LS.cfg, cfg); }, [cfg]);

  // ── Sheet propio de Programados ────────────────────────────────────────
  const traerDelSheet = (url) => {
    const u = (url || api || "").trim();
    if (!u) { setSinc({ estado: "error", texto: "Todavía no configuraste la planilla de Programados." }); return; }
    setSinc({ estado: "cargando", texto: "Trayendo datos…" });
    fetch(u + (u.indexOf("?") > -1 ? "&" : "?") + "accion=leer")
      .then(r => r.json())
      .then(res => {
        if (!res || res.ok === false) throw new Error((res && res.error) || "respuesta inválida");
        const d = res.datos || res;
        // Si la planilla vuelve vacía y acá hay viajes cargados, NO se pisa nada:
        // casi siempre significa que todavía no subió nada, no que se borró todo.
        const llegan = Array.isArray(d.programados) ? d.programados.length : -1;
        if (llegan === 0 && viajes.length > 0) {
          cargadoProg.current = true;
          setSinc({ estado: "error", texto: `La planilla está vacía y acá tenés ${viajes.length} viaje(s). No toqué nada. Usá «Subir todo a la planilla» para mandarlos.` });
          return;
        }
        if (Array.isArray(d.programados)) setViajes(d.programados.map(pgNormalizar));
        if (Array.isArray(d.localidades) && d.localidades.length) { const _L = pgLocsLimpias(d.localidades); if (_L.length) setLocs(_L); }
        if (Array.isArray(d.rutas) && d.rutas.length) setRutas(d.rutas);
        if (d.config && Object.keys(d.config).length) setCfg(p => pgCfgLimpia({ ...p, ...d.config }));
        cargadoProg.current = true;
        setSinc({ estado: "ok", texto: "Sincronizado " + new Date().toLocaleTimeString("es-AR", { hour: "2-digit", minute: "2-digit" }) });
      })
      .catch(e => { cargadoProg.current = true; setSinc({ estado: "error", texto: "No se pudo leer la planilla. " + e }); });
  };
  useEffect(() => { if (api) traerDelSheet(api); else cargadoProg.current = true; }, []);

  // guardado automático, con la misma lógica que el resto de la app
  useEffect(() => {
    if (!api || !cargadoProg.current) return;
    const cuerpo = JSON.stringify({ accion: "guardarTodo", programados: viajes, localidades: locs, rutas, config: cfg });
    if (cuerpo === firmaProg.current) return;
    if (timerProg.current) clearTimeout(timerProg.current);
    timerProg.current = setTimeout(() => {
      setSinc({ estado: "guardando", texto: "Guardando…" });
      fetch(api, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: cuerpo })
        .then(r => r.json())
        .then(res => {
          if (res && res.ok === false) throw new Error(res.error || "el script devolvió un error");
          firmaProg.current = cuerpo;
          setSinc({ estado: "ok", texto: "Guardado " + new Date().toLocaleTimeString("es-AR", { hour: "2-digit", minute: "2-digit" }) });
        })
        .catch(e => setSinc({ estado: "error", texto: "Se guardó en este equipo, pero no en la planilla. " + e }));
    }, 1200);
    return () => { if (timerProg.current) clearTimeout(timerProg.current); };
  }, [viajes, locs, rutas, cfg, api]);

  /* Empujón manual. El guardado automático a veces no se dispara — por ejemplo
     si cargaste todo ANTES de pegar la URL — y además, cuando el script falla,
     conviene ver el error tal cual lo devuelve y no un cartel genérico. */
  const subirTodo = () => {
    const u = (api || "").trim();
    if (!u) { setSinc({ estado: "error", texto: "Primero pegá la URL del script de Programados." }); return; }
    setSinc({ estado: "guardando", texto: "Subiendo " + viajes.length + " viaje(s)…" });
    const cuerpo = JSON.stringify({ accion: "guardarTodo", programados: viajes, localidades: locs, rutas, config: cfg });
    fetch(u, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: cuerpo })
      .then(r => r.text())
      .then(txt => {
        let res = null;
        try { res = JSON.parse(txt); } catch (e) {
          throw new Error("El script no devolvió datos. Suele ser que la implementación quedó en una versión vieja: en Apps Script, Implementar → Administrar implementaciones → lápiz → Versión: Nueva.");
        }
        if (!res || res.ok === false) {
          throw new Error((res && res.error) || "el script devolvió un error sin detalle");
        }
        const n = res.filas && res.filas.programados;
        firmaProg.current = cuerpo;
        cargadoProg.current = true;
        setSinc({ estado: "ok", texto: `Subidos ${n != null ? n : viajes.length} viaje(s) a la planilla.` });
      })
      .catch(e => setSinc({ estado: "error", texto: String(e.message || e) }));
  };

  /* Duplicados: mismo día, misma unidad y mismo destino. Pasa al importar dos
     veces el mismo archivo o al cargar el ejemplo arriba de lo ya cargado. */
  const clave = (v) => [v.fechaInicio, pgNorm(v.interno), pgNorm(v.destino), pgNorm(v.origen)].join("|");
  const repetidos = (() => {
    const vistos = {}; let n = 0;
    viajes.forEach(v => { const k = clave(v); if (vistos[k]) n++; else vistos[k] = 1; });
    return n;
  })();
  const quitarRepetidos = () => {
    const vistos = {}, limpio = [];
    viajes.forEach(v => { const k = clave(v); if (!vistos[k]) { vistos[k] = 1; limpio.push(v); } });
    const sacados = viajes.length - limpio.length;
    if (!sacados) { alert("No hay viajes repetidos."); return; }
    if (!confirm(`Se van a quitar ${sacados} viaje(s) repetidos y quedan ${limpio.length}. Se considera repetido el que tiene la misma fecha, la misma unidad y el mismo tramo. ¿Seguimos?`)) return;
    setViajes(limpio);
  };

  /* Selección múltiple. Borrar no se deshace, así que pregunta dos veces: la
     primera dice cuántos, la segunda muestra cuáles y avisa que no hay vuelta. */
  const seleccionados = Object.keys(sel).filter(k => sel[k]);
  const alternar = (id) => setSel(p => ({ ...p, [id]: !p[id] }));
  const borrarSeleccionados = () => {
    const ids = seleccionados;
    if (!ids.length) return;
    const elegidos = viajes.filter(v => ids.indexOf(v.id) > -1);
    if (!confirm(`Vas a borrar ${ids.length} viaje(s) programados.\n\n¿Seguimos?`)) return;
    const muestra = elegidos.slice(0, 6).map(v => `· ${pgFmtF(v.fechaInicio)}   ${v.interno || "sin unidad"}   ${v.origen} → ${v.destino}`).join("\n");
    const resto = elegidos.length > 6 ? `\n…y ${elegidos.length - 6} más.` : "";
    if (!confirm(`Última confirmación.\n\nSe borran definitivamente:\n\n${muestra}${resto}\n\nEsto no se puede deshacer. ¿Borro?`)) return;
    setViajes(p => p.filter(v => ids.indexOf(v.id) === -1));
    setSel({});
  };

  const ctx = { locs, rutas, cfg, vehiculos: vehiculos || [] };

  // ── filtros ────────────────────────────────────────────────────────────
  const q = pgNorm(busca);
  /* UNA SOLA EMPRESA: no hay nada que filtrar. Se ven todos los viajes,
     tengan o no el campo empresa cargado de antes. */
  const mismaEmpresa = () => true;
  const sinEmpresa = 0;
  const deOtras = 0;
  const nombreEmpresa = ((empresas || [])[0] || {}).nombre || "";

  const lista = viajes.filter(v => {
    if (!mismaEmpresa(v)) return false;
    if (fClase !== "todas" && v.clase !== fClase) return false;
    if (fEstado !== "todos" && v.estado !== fEstado) return false;
    if (fUnidad && pgNorm(v.interno) !== pgNorm(fUnidad)) return false;
    if (fDesde && (v.fechaFin || v.fechaInicio) < fDesde) return false;
    if (fHasta && v.fechaInicio > fHasta) return false;
    if (q && pgNorm([v.origen, v.destino, v.interno, v.chofer1, v.chofer2, v.contratante, v.observaciones].join(" ")).indexOf(q) === -1) return false;
    return true;
  }).sort((a, b) => String(a.fechaInicio).localeCompare(String(b.fechaInicio)));

  /* Los totales de arriba tienen que hablar de lo que se está mirando. Si en
     Líneas elegís Internacionales, los kilómetros y el combustible son los de
     las internacionales, no los de toda la programación. */
  const claseVista = (vista === "timeline" && subLinea !== "todas") ? subLinea : null;
  const listaVista = claseVista ? lista.filter(v => pgClase(v.clase) === claseVista) : lista;

  let rKm = 0, rComb = 0, rLitros = 0, confirmados = 0, tentativos = 0;
  listaVista.forEach(v => {
    const c = pgCalcular(v, ctx);
    rKm += c.km; rComb += c.combustible; rLitros += c.litros;
    if (v.estado === "confirmado" || v.estado === "realizado") confirmados++;
    else if (v.estado === "tentativo") tentativos++;
  });
  const avisos = pgAvisos(listaVista, ctx);
  const graves = avisos.filter(a => a.grave);

  const guardarViaje = (v) => {
    setViajes(prev => v.id && prev.some(x => x.id === v.id)
      ? prev.map(x => x.id === v.id ? { ...v, kmManual: pgNum(v.kmManual), pasajeros: pgNum(v.pasajeros), tarifa: pgNum(v.tarifa) } : x)
      : [...prev, { ...v, id: pgId(), empresa: v.empresa || empresaActiva || "", kmManual: pgNum(v.kmManual), pasajeros: pgNum(v.pasajeros), tarifa: pgNum(v.tarifa) }]);
    setModal(null);
  };
  const borrarViaje = (id) => { setViajes(prev => prev.filter(x => x.id !== id)); setModal(null); };
  const nuevo = () => setModal({
    clase: "turismo", estado: "tentativo", idaVuelta: true, origen: "PNA", destino: "",
    fechaInicio: pgIso(pgHoy()), fechaFin: pgIso(pgHoy()), interno: "", chofer1: "", chofer2: "",
    contratante: "", observaciones: "", kmManual: 0, pasajeros: 0, tarifa: 0, codigo: "", hora: "",
    empresa: empresaActiva || "",
  });

  const importar = (filas, claseDef) => {
    const anio = new Date().getFullYear();
    const nuevos = filas.map(f => ({
      id: pgId(),
      clase: f.clase ? pgClase(f.clase) : (claseDef && claseDef !== "todas" ? claseDef : "turismo"),
      estado: pgNorm(f.estado) === "CONFIRMADO" ? "confirmado" : pgNorm(f.estado) === "REALIZADO" ? "realizado" : pgNorm(f.estado) === "CANCELADO" ? "cancelado" : "tentativo",
      fechaInicio: pgIso(pgFecha(f.fechaInicio, anio)),
      fechaFin: pgIso(pgFecha(f.fechaFin, anio)) || pgIso(pgFecha(f.fechaInicio, anio)),
      origen: String(f.origen || "").trim(), destino: String(f.destino || "").trim(),
      interno: String(f.interno || "").trim(),
      chofer1: String(f.chofer1 || "").trim(),
      chofer2: pgNorm(f.chofer2) === "X" ? "" : String(f.chofer2 || "").trim(),
      contratante: String(f.contratante || "").trim(),
      observaciones: String(f.observaciones || "").trim(),
      kmManual: pgNum(f.kmManual), idaVuelta: true, pasajeros: pgNum(f.pasajeros), tarifa: pgNum(f.tarifa),
      codigo: String(f.codigo || "").trim().toUpperCase(), hora: String(f.hora || "").trim(),
      empresa: empresaActiva || "",
    })).filter(o => o.fechaInicio);
    if (!nuevos.length) return { agregados: 0, errores: ["Ninguna fila tenía una fecha de inicio que se pueda leer."] };
    setViajes(prev => [...prev, ...nuevos]);
    return { agregados: nuevos.length, errores: [] };
  };

  const exportarCSV = () => {
    const enc = ["Dia", "Fecha inicio", "Fecha fin", "Origen", "Destino", "Interno", "Chofer 1", "Chofer 2", "Contratante", "Clase", "Estado", "Km", "Consumo L/100", "Litros", "Combustible", "Observaciones"];
    const filas = lista.map(v => {
      const c = pgCalcular(v, ctx), d = pgFecha(v.fechaInicio);
      return [d ? PG_DIAS[d.getDay()] : "", pgFmtF(v.fechaInicio), pgFmtF(v.fechaFin), v.origen, v.destino, v.interno,
      v.chofer1, v.chofer2, v.contratante, v.clase, v.estado, Math.round(c.km), c.consumo,
      Math.round(c.litros), Math.round(c.combustible), v.observaciones];
    });
    const csv = [enc, ...filas].map(f => f.map(x => { const s = String(x == null ? "" : x); return /[;"\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }).join(";")).join("\n");
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob(["﻿" + csv], { type: "text/csv;charset=utf-8;" }));
    a.download = "programados_" + pgIso(pgHoy()) + ".csv";
    a.click();
  };

  const unidadesUsadas = pgUnicos(viajes.map(v => v.interno)).sort();
  const contratantes = pgUnicos(viajes.map(v => v.contratante)).sort();
  const choferes = pgUnicos([].concat(
    (conductores || []).map(c => c.nombre),
    viajes.map(v => v.chofer1), viajes.map(v => v.chofer2)
  )).sort();
  const internosVehiculos = pgUnicos((vehiculos || []).map(v => v.vehiculo).filter(Boolean)).sort();

  const colorSinc = { ok: "#16A34A", cargando: "#3B82F6", guardando: "#F0A020", error: "#DC2626" }[sinc.estado] || "#9CA3AF";

  return (
    <div>
      <datalist id="pg-unidades">{pgUnicos([].concat(internosVehiculos, unidadesUsadas)).map(u => <option key={u} value={u} />)}</datalist>
      <datalist id="pg-choferes">{choferes.map(c => <option key={c} value={c} />)}</datalist>
      <datalist id="pg-contratantes">{contratantes.map(c => <option key={c} value={c} />)}</datalist>

      <SectionHeader
        title="Programados"
        sub={`${listaVista.length} ${claseVista ? "servicio(s) de " + pgClaseLabel(claseVista).toLowerCase() : "viaje(s)"} · ${confirmados} confirmado(s) · ${tentativos} tentativo(s)`}
        action="Nuevo viaje" onAction={nuevo}
        extra={
          <div style={{ display: "flex", gap: 10, alignItems: "center" }}>
            {api && <span style={{ fontSize: 11, fontWeight: 600, color: colorSinc, display: "flex", alignItems: "center", gap: 6 }}>
              <span style={{ width: 7, height: 7, borderRadius: "50%", background: colorSinc }} />{sinc.texto || "Planilla conectada"}
            </span>}
            <ImportarMasivo nombre="Programados" onImportar={importar}
              ayuda={<>Subí la planilla de programación tal cual la tenés en Excel. Reconoce el delimitador solo y las fechas cortas tipo <strong>24-jul</strong> (les pone el año en curso). La columna «Día» no hace falta: se calcula de la fecha.</>}
              ejemplo={{ fechaInicio: "24/07/2026", fechaFin: "27/07/2026", origen: "COR", destino: "CAM", interno: "60527", chofer1: "DONDA", chofer2: "ACEVEDO", contratante: "DUMAS", clase: "turismo", estado: "confirmado", observaciones: "" }}
              columnas={[
                { campo: "fechaInicio", etiqueta: "Fecha inicio", tipo: "texto", requerido: true, alias: ["fecha inicio", "inicio", "desde", "fecha"] },
                { campo: "fechaFin", etiqueta: "Fecha fin", tipo: "texto", alias: ["fecha fin", "fin", "hasta"] },
                { campo: "origen", etiqueta: "Origen", tipo: "texto", alias: ["salida"] },
                { campo: "destino", etiqueta: "Destino", tipo: "texto", alias: ["llegada"] },
                { campo: "interno", etiqueta: "Interno", tipo: "texto", alias: ["unidad", "coche", "n interno", "nro interno"] },
                { campo: "chofer1", etiqueta: "Chofer 1", tipo: "texto", alias: ["chofer", "conductor", "conductor 1"] },
                { campo: "chofer2", etiqueta: "Chofer 2", tipo: "texto", alias: ["conductor 2", "acompanante"] },
                { campo: "contratante", etiqueta: "Contratante", tipo: "texto", alias: ["cliente", "empresa"] },
                { campo: "codigo", etiqueta: "Código", tipo: "texto", alias: ["cod", "codigo servicio"] },
                { campo: "hora", etiqueta: "Hora", tipo: "texto", alias: ["hora salida", "salida"] },
                { campo: "clase", etiqueta: "Clase", tipo: "texto", alias: ["servicio", "tipo"] },
                { campo: "estado", etiqueta: "Estado", tipo: "texto" },
                { campo: "kmManual", etiqueta: "Km", tipo: "numero", alias: ["kilometros", "kilometraje"] },
                { campo: "pasajeros", etiqueta: "Pasajeros", tipo: "numero", alias: ["pax"] },
                { campo: "tarifa", etiqueta: "Valor cobrado", tipo: "numero", alias: ["valor", "importe", "precio", "tarifa"] },
                { campo: "observaciones", etiqueta: "Observaciones", tipo: "texto", alias: ["obs", "notas", "observacion"] },
              ]} />
          </div>
        } />

      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit,minmax(230px,1fr))", gap: 16, marginBottom: 20 }}>
        <KpiCard label={claseVista ? pgClaseLabel(claseVista) : "Viajes del filtro"} value={listaVista.length} icon="map"
          color={claseVista ? (PG_CLASES.find(c => c.id === claseVista) || {}).color : "#3B82F6"}
          sub={`${confirmados} confirmados · ${tentativos} tentativos`} />
        <KpiCard label="Kilómetros programados" value={pgMiles(rKm) + " km"} icon="truck" color="var(--c-primario)" sub={listaVista.length ? `promedio ${pgMiles(rKm / listaVista.length)} km por viaje` : "—"} />
        <KpiCard label="Litros estimados" value={pgMiles(rLitros)} icon="fuel" color="#E8A020" sub={rKm ? (rLitros / rKm * 100).toFixed(1).replace(".", ",") + " L/100 km promedio" : "—"} />
        <KpiCard label="Combustible estimado" value={fmt(rComb)} icon="dollar" color={graves.length ? "#DC2626" : "#16A34A"} sub={rKm ? fmt(rComb / rKm) + " por km · litro a " + fmt(cfg.precioLitro) : "—"} />
      </div>

      {empresaActiva && (deOtras > 0 || sinEmpresa > 0) && (
        <div style={{ background: "#F8FAFC", border: "1px solid #E5E7EB", borderRadius: 8, padding: "12px 16px", marginBottom: 20, display: "flex", alignItems: "center", gap: 12, flexWrap: "wrap" }}>
          <Icon name="building" size={17} color="#6B7280" />
          <span style={{ fontSize: 13, color: "#374151" }}>
            {deOtras > 0 && <><strong>{deOtras} viaje(s)</strong> no se muestran porque son de otra empresa. </>}
            {sinEmpresa > 0 && <><strong>{sinEmpresa} viaje(s)</strong> no tienen empresa asignada: se ven siempre, en cualquier empresa.</>}
          </span>
          {sinEmpresa > 0 && nombreEmpresa && (
            <button onClick={() => {
              if (!confirm(`Se van a asignar ${sinEmpresa} viaje(s) sin empresa a "${nombreEmpresa}".\n\n¿Seguimos?`)) return;
              setViajes(p => p.map(v => v.empresa ? v : { ...v, empresa: empresaActiva }));
            }} style={{ marginLeft: "auto", padding: "6px 12px", borderRadius: 7, border: "1.5px solid #CBD5E1", background: "#fff", color: "var(--c-primario)", fontSize: 12, fontWeight: 600, cursor: "pointer" }}>
              Asignarlos a {nombreEmpresa}
            </button>
          )}
        </div>
      )}

      {repetidos > 0 && (
        <div style={{ background: "#FFFBEB", border: "1px solid #FDE68A", borderRadius: 8, padding: "12px 16px", marginBottom: 20, display: "flex", alignItems: "center", gap: 12, flexWrap: "wrap" }}>
          <Icon name="alert" size={17} color="#B45309" />
          <span style={{ fontSize: 13, color: "#92400E" }}>
            <strong>{repetidos} viaje(s) repetidos.</strong> Hay filas con la misma fecha, la misma unidad y el mismo tramo: suele pasar al importar dos veces el mismo archivo.
          </span>
          <button onClick={quitarRepetidos} style={{ marginLeft: "auto", padding: "6px 12px", borderRadius: 7, border: "1.5px solid #FCD34D", background: "#fff", color: "#92400E", fontSize: 12, fontWeight: 600, cursor: "pointer" }}>Quitar los repetidos</button>
        </div>
      )}

      {graves.length > 0 && (
        <div style={{ background: "#FFFBEB", border: "1px solid #FDE68A", borderRadius: 8, padding: "12px 16px", marginBottom: 20, display: "flex", alignItems: "center", gap: 12, flexWrap: "wrap" }}>
          <Icon name="alert" size={17} color="#B45309" />
          <span style={{ fontSize: 13, color: "#92400E" }}><strong>{graves.length} cosa(s) para revisar en la programación.</strong> {graves[0].txt}</span>
          <button onClick={() => setVerAvisos(true)} style={{ marginLeft: "auto", padding: "6px 12px", borderRadius: 7, border: "1.5px solid #FCD34D", background: "#fff", color: "#92400E", fontSize: 12, fontWeight: 600, cursor: "pointer" }}>Ver todos</button>
        </div>
      )}

      <div style={{ display: "flex", gap: 4, background: "#fff", border: "1px solid #E5E7EB", borderRadius: 10, padding: 4, marginBottom: 20, flexWrap: "wrap" }}>
        {[["planilla", "Planilla"], ["timeline", "Líneas"], ["mapa", "Mapa"], ["analisis", "Productividad"]].map(([id, lab]) => (
          <button key={id} onClick={() => setVista(id)}
            style={{ padding: "7px 14px", borderRadius: 7, border: "none", cursor: "pointer", fontSize: 12.5,
              background: vista === id ? "var(--c-primario)" : "transparent", color: vista === id ? "#fff" : "#6B7280", fontWeight: vista === id ? 700 : 600 }}>
            {lab}
          </button>
        ))}
        {/* Localidades, rutas y parámetros se tocan al principio y después casi
            nunca: van juntos a la derecha, igual que en Plan de mantenimiento. */}
        <button onClick={() => setVista("ajustes")}
          style={{ marginLeft: "auto", display: "flex", alignItems: "center", gap: 6,
            padding: "7px 14px", borderRadius: 7, border: "none", cursor: "pointer", fontSize: 12.5,
            background: vista === "ajustes" ? "var(--c-primario)" : "transparent",
            color: vista === "ajustes" ? "#fff" : "#6B7280", fontWeight: vista === "ajustes" ? 700 : 600 }}>
          <Icon name="wrench" size={14} color={vista === "ajustes" ? "#fff" : "#6B7280"} />
          Ajustes
        </button>
      </div>

      {["planilla", "timeline", "mapa"].includes(vista) && (
        <Card style={{ marginBottom: 20 }}>
          <div style={{ padding: "14px 18px", display: "flex", gap: 10, flexWrap: "wrap", alignItems: "center" }}>
            <div style={{ minWidth: 210, flex: "0 1 260px" }}>
              <Input placeholder="Buscar destino, chofer, contratante…" value={busca} onChange={e => setBusca(e.target.value)} />
            </div>
            <div style={{ width: 150 }}>
              <Select value={fClase} onChange={e => setFClase(e.target.value)}>
                <option value="todas">Todas las clases</option>
                {PG_CLASES.map(c => <option key={c.id} value={c.id}>{c.label}</option>)}
              </Select>
            </div>
            <div style={{ width: 160 }}>
              <Select value={fEstado} onChange={e => setFEstado(e.target.value)}>
                <option value="todos">Todos los estados</option>
                <option value="confirmado">Confirmados</option>
                <option value="tentativo">Tentativos</option>
                <option value="realizado">Realizados</option>
                <option value="cancelado">Cancelados</option>
              </Select>
            </div>
            <div style={{ width: 160 }}>
              <Select value={fUnidad} onChange={e => setFUnidad(e.target.value)}>
                <option value="">Todas las unidades</option>
                {unidadesUsadas.map(u => <option key={u} value={u}>Interno {u}</option>)}
              </Select>
            </div>
            <div style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 12, color: "#6B7280" }}>
              Desde <Input type="date" value={fDesde} onChange={e => setFDesde(e.target.value)} style={{ width: 145 }} />
              hasta <Input type="date" value={fHasta} onChange={e => setFHasta(e.target.value)} style={{ width: 145 }} />
            </div>
            {(busca || fClase !== "todas" || fEstado !== "todos" || fUnidad || fDesde || fHasta) && (
              <button onClick={() => { setBusca(""); setFClase("todas"); setFEstado("todos"); setFUnidad(""); setFDesde(""); setFHasta(""); }}
                style={{ background: "none", border: "none", color: "var(--c-primario)", fontSize: 12, fontWeight: 600, cursor: "pointer" }}>Limpiar filtros</button>
            )}
          </div>
        </Card>
      )}

      {vista === "planilla" && (
        <Card>
          <div style={{ padding: "16px 20px", borderBottom: "1px solid #F1F5F9", display: "flex", alignItems: "center", gap: 12, flexWrap: "wrap" }}>
            <h3 style={{ margin: 0, fontSize: 15, fontWeight: 700, color: "var(--c-primario)" }}>Planilla de programación</h3>
            <span style={{ fontSize: 12, color: "#9CA3AF" }}>{lista.length} viajes</span>
            <div style={{ marginLeft: "auto", display: "flex", gap: 8 }}>
              {seleccionados.length > 0 && (
                <button onClick={borrarSeleccionados}
                  style={{ padding: "7px 14px", borderRadius: 8, border: "none", background: "#DC2626", color: "#fff", fontSize: 12.5, fontWeight: 700, cursor: "pointer" }}>
                  Borrar {seleccionados.length} seleccionado{seleccionados.length > 1 ? "s" : ""}
                </button>
              )}
              <button onClick={exportarCSV} style={{ padding: "7px 14px", borderRadius: 8, border: "1.5px solid #E5E7EB", background: "#fff", fontSize: 12.5, fontWeight: 600, cursor: "pointer", color: "#374151" }}>Exportar CSV</button>
              <button onClick={() => window.print()} style={{ padding: "7px 14px", borderRadius: 8, border: "1.5px solid #E5E7EB", background: "#fff", fontSize: 12.5, fontWeight: 600, cursor: "pointer", color: "#374151" }}>Imprimir</button>
            </div>
          </div>
          <Table headers={[
            <input key="todos" type="checkbox" title="Seleccionar todo lo que estás viendo"
              checked={lista.length > 0 && lista.every(v => sel[v.id])}
              onChange={e => { const marcar = e.target.checked;
                setSel(p => { const n = { ...p }; lista.forEach(v => { n[v.id] = marcar; }); return n; }); }}
              style={{ width: 15, height: 15, cursor: "pointer" }} />,
            "Día", "Fecha inicio", "Fecha fin", "Origen", "Destino", "Interno", "Chofer 1", "Chofer 2", "Contratante", "Km", "Combustible", "Estado y notas"]}>
            {lista.map(v => {
              const c = pgCalcular(v, ctx);
              const d = pgFecha(v.fechaInicio);
              const conAviso = avisos.some(a => a.id === v.id && a.grave);
              const O = pgBuscarLoc(locs, v.origen), D = pgBuscarLoc(locs, v.destino);
              return (
                <TR key={v.id} onClick={() => setModal(v)}>
                  <TD>
                    <span onClick={e => { e.stopPropagation(); alternar(v.id); }} style={{ display: "inline-flex", padding: 4, margin: -4 }}>
                      <input type="checkbox" checked={!!sel[v.id]} readOnly style={{ width: 15, height: 15, cursor: "pointer" }} />
                    </span>
                  </TD>
                  <TD>{d ? PG_DIAS_C[d.getDay()] : "—"}</TD>
                  <TD>{pgFmtF(v.fechaInicio)}</TD>
                  <TD>{pgFmtF(v.fechaFin)}</TD>
                  <TD>
                    {O ? O.nombre : <span title="No está en Localidades">{v.origen} ⚠</span>}
                    {(v.codigo || v.hora) && (
                      <div style={{ fontSize: 10.5, color: "#9CA3AF" }}>
                        {v.codigo ? <strong style={{ color: "#6B7280" }}>{v.codigo}</strong> : null}
                        {v.codigo && v.hora ? " · " : ""}{v.hora || ""}
                      </div>

// ═══════════════════════════════════════════════════════════════════════════
//  PLAN DE MANTENIMIENTO — por marca, con proyección de kilómetros
//
//  De dónde sale cada número:
//   · el plan (cada cuántos km va cada service) lo cargás vos, por marca
//   · los km del último service de cada unidad los cargás vos (o los pegás
//     desde la planilla técnica)
//   · los km ACTUALES salen del odómetro de la última carga de combustible;
//     si esa unidad no tiene cargas, se usa el km que cargues a mano
//   · los km QUE VAN A HACER salen de los viajes de Programados
//
//  Con eso el módulo no solo dice "le faltan 13.013 km": dice qué día los va
//  a cumplir, según los viajes que ya tenés vendidos.
// ═══════════════════════════════════════════════════════════════════════════

const PM_LS = { planes: "PLAN_MANT_PLANES", unidades: "PLAN_MANT_UNIDADES", turnos: "PLAN_MANT_TURNOS" };
