/* ═══ APP CONDUCTOR — BANDEJA DE LA OFICINA (v8.7) ═════════════════════════
   El otro lado del mostrador de CheckFlota: acá la oficina ve TODO lo que
   mandan los choferes (novedades con fotos y audios, checks, pedidos de
   insumos) y lo puede tratar sin abrir la planilla:
     · comentarios de seguimiento que el chofer ve en su teléfono
     · avance de estado de cada novedad (los mismos pasos de su app)
     · pedidos: Preparado → Enviado + respuesta del pañol
     · diagramas de lavado/gasoil y catálogo de insumos
   Lee lo que ya trae el GET del conector (v1.6+) y escribe con las
   acciones panel* del conector v2.6.                                      */
/* A veces Google contesta con una página HTML en vez de datos (planilla ocupada).
   En vez de mostrar un error raro, se reintenta solo hasta 3 veces. */
/* ═══ ASIGNACIÓN DE UNIDADES (v1.1) ═══════════════════════════════════════
   Quién tiene cada unidad, con fecha de inicio y de cierre (relevo). Mientras
   la asignación está vigente, el uso y los km de esa unidad se le imputan a
   ese conductor. Cada alta y cada cierre piden un código de autorización que
   queda registrado. Se guarda en este equipo y se intenta subir a la hoja
   AsignacionUnidades vía el conector (hace falta la versión con asignaciones;
   hasta entonces queda local y avisa). */
const ASIG_LS = "ASIGNACION_UNIDADES_V1";
const asigLeer = () => pgLeer(ASIG_LS, []);
const asigVigenteDe = (asigs, v) => (asigs || []).find(a => !a.fechaFin &&
  (mismoId(a.vehiculo_id, v.id) || (String(v.vehiculo || "").trim() && pgNorm(a.interno) === pgNorm(String(v.vehiculo)))));

const cfPost = async (action, data) => {
  for (let intento = 0; intento < 3; intento++) {
    try {
      const r = await fetch(SHEET_API_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ action: action, data: data }) });
      const texto = await r.text();
      return JSON.parse(texto);
    } catch (e) {
      if (intento < 2) await new Promise(res => setTimeout(res, 1200 + intento * 1000));
    }
  }
  throw new Error("la planilla estuvo ocupada y no respondió. Esperá unos segundos y probá otra vez.");
};

/* Los links de Drive (fotos y audios del chofer) se muestran como botones
   cortos en vez del chorizo de letras — mismo criterio que su app. */
const LinksAdjuntos = ({ texto }) => {
  const partes = String(texto || "").split(/(https?:\/\/[^\s]+)/g);
  let n = 0;
  return (
    <React.Fragment>
      {partes.map((p, i) => {
        if (/^https?:\/\//.test(p)) {
          n++;
          return <a key={i} href={p} target="_blank" rel="noopener noreferrer"
            style={{ display: "inline-block", margin: "2px 4px 2px 0", padding: "3px 10px", borderRadius: 8, background: "var(--c-primario)15", color: "var(--c-primario)", fontWeight: 700, fontSize: 12, textDecoration: "none" }}>
            📎 Ver adjunto {n > 1 ? n : ""}
          </a>;
        }
        return p;
      })}
    </React.Fragment>
  );
};
const cfConductorDe = (m) => { const x = String(m.descripcion || "").match(/^\[([^\]]+)\]/); return x ? x[1] : ""; };
const cfSinPrefijo = (t) => String(t || "").replace(/^\[[^\]]*\]\s*/, "");
const cfEsDeConductor = (m) => /novedad de conductor/i.test(m.tipo || "") || /app conductor/i.test(m.taller || "") || /^\[/.test(String(m.descripcion || ""));

const PED_PASOS = ["solicitado", "preparado", "enviado", "recibido"];
const PED_ETIQ = { solicitado: "Solicitado", preparado: "Preparado", enviado: "Enviado", recibido: "Recibido" };
const PED_COLOR = { solicitado: "#F0A020", preparado: "#2563EB", enviado: "#0E7490", recibido: "#16A34A" };
const pedPaso = (e) => { const s = String(e || "solicitado").toLowerCase(); if (/recib/.test(s)) return 3; if (/envi/.test(s)) return 2; if (/prepar|aprob/.test(s)) return 1; return 0; };

const BandejaConductor = ({ mantenimiento, setMantenimiento, vehiculos, conductores, empresaActiva, cf, setCf }) => {
  const [tab, setTab] = useState("novedades");
  const [coment, setComent] = useState({});
  const [resp, setResp] = useState({});
  const [busy, setBusy] = useState("");
  const [aviso, setAviso] = useState(null);
  const [verCerradas, setVerCerradas] = useState(false);
  const [verTerminados, setVerTerminados] = useState(false);   // pedidos ya recibidos
  const [formD, setFormD] = useState({ fecha: "", interno: "", tarea: "LAVADO", hora: "", duracion: "", notas: "" });
  const [insumosEd, setInsumosEd] = useState(null);

  /* ── asignación de unidades ── */
  const [asigs, setAsigs] = useState(() => asigLeer());
  const [formA, setFormA] = useState({ conductor_id: "", vehiculo_id: "", fechaInicio: new Date().toISOString().slice(0, 10), notas: "", codigo: "" });
  const [verRelevos, setVerRelevos] = useState(false);
  useEffect(() => { pgGuardar(ASIG_LS, asigs); }, [asigs]);

  /* v2.9 — la planilla es la que manda: cuando el GET trae el historial de
     asignaciones, se pisa lo local. Así todas las computadoras ven lo mismo. */
  useEffect(() => {
    if (Array.isArray(cf.asignaciones) && cf.asignaciones.length) setAsigs(cf.asignaciones);
  }, [cf.asignaciones]);

  const guardarAsig = async () => {
    const c = (conductores || []).find(x => mismoId(x.id, formA.conductor_id));
    const v = vehiculos.find(x => mismoId(x.id, formA.vehiculo_id));
    if (!c) return avisar("error", "Elegí el conductor.");
    if (!v) return avisar("error", "Elegí la unidad.");
    if (!formA.fechaInicio) return avisar("error", "Falta la fecha de inicio.");
    if (!String(formA.codigo).trim()) return avisar("error", "Falta el código de autorización: sin código no se asigna.");
    if (asigs.some(a => !a.fechaFin && mismoId(a.vehiculo_id, v.id))) return avisar("error", `La unidad ${v.patente} ya está asignada. Primero cerrá esa asignación (relevo).`);
    if (asigs.some(a => !a.fechaFin && mismoId(a.conductor_id, c.id)) && !window.confirm(`${c.nombre} ya tiene otra unidad vigente. ¿Le asignamos esta también?`)) return;
    const nueva = { id: "as_" + pgId(), conductor_id: c.id, conductor: c.nombre, dni: c.dni || "",
      vehiculo_id: v.id, interno: String(v.vehiculo || ""), patente: v.patente,
      fechaInicio: formA.fechaInicio, fechaFin: "", notas: formA.notas || "",
      autorizo_alta: "", autorizo_cierre: "", empresa_id: empresaActiva };
    setBusy("a-nueva");
    try {
      /* El código lo valida la PLANILLA contra la hoja Autorizadores:
         si no es válido, el conector no guarda nada y acá tampoco. */
      const r = await cfPost("panelAsignarUnidad", { asignacion: nueva, codigo: String(formA.codigo).trim() });
      if (!r || r.ok === false) throw new Error((r && r.error) || "el script no respondió");
      setAsigs(prev => [...prev, { ...nueva, autorizo_alta: r.autorizo || "" }]);
      setFormA({ conductor_id: "", vehiculo_id: "", fechaInicio: new Date().toISOString().slice(0, 10), notas: "", codigo: "" });
      avisar("ok", `Listo: ${v.patente} asignada a ${c.nombre} (autorizó ${r.autorizo}). El chofer ya la ve en su app.`);
    } catch (e) { avisar("error", "No se asignó. " + (e.message || e)); }
    setBusy("");
  };

  const cerrarAsig = async (a) => {
    const codigo = window.prompt(`Relevo de ${a.conductor} en ${a.patente || a.interno}.\nCódigo de autorización:`);
    if (codigo == null) return;
    if (!String(codigo).trim()) return avisar("error", "Sin código no se cierra la asignación.");
    const hoyTxt = new Date().toISOString().slice(0, 10);
    setBusy("a" + a.id);
    try {
      const r = await cfPost("panelCerrarAsignacion", { id: a.id, codigo: String(codigo).trim(), fechaFin: hoyTxt });
      if (!r || r.ok === false) throw new Error((r && r.error) || "el script no respondió");
      setAsigs(prev => prev.map(x => x.id === a.id ? { ...x, fechaFin: hoyTxt, autorizo_cierre: r.autorizo || "" } : x));
      avisar("ok", `Asignación cerrada (autorizó ${r.autorizo}): ${a.patente || a.interno} quedó libre.`);
    } catch (e) { avisar("error", "No se cerró. " + (e.message || e)); }
    setBusy("");
  };

  const avisar = (tipo, texto) => { setAviso({ tipo, texto }); setTimeout(() => setAviso(null), 4500); };

  const novedades = mantenimiento
    .filter(cfEsDeConductor)
    .filter(m => !m.empresa_id || mismoId(m.empresa_id, empresaActiva))
    .filter(m => verCerradas || !/complet|finaliz|cancel/.test(String(m.estado || "").toLowerCase()))
    .sort((a, b) => String(b.fecha || "").localeCompare(String(a.fecha || "")));
  const segDe = (id) => (cf.seguimientoOT || []).filter(s => mismoId(s.ot_id, id))
    .sort((a, b) => String(a.fecha || "").localeCompare(String(b.fecha || "")));
  const unidadDe = (m) => {
    const v = vehiculos.find(x => mismoId(x.id, m.vehiculo_id)) || buscarVehiculo(m.vehiculo_id, vehiculos);
    return v ? (v.vehiculo ? v.vehiculo + " · " + v.patente : v.patente) : "sin unidad";
  };
  const pedidos = (cf.pedidos || []).slice()
    .filter(p => verTerminados || pedPaso(p.estado) < 3)
    .sort((a, b) => String(b.fecha || "").localeCompare(String(a.fecha || "")));
  const terminados = (cf.pedidos || []).filter(p => pedPaso(p.estado) >= 3).length;
  const pendPed = pedidos.filter(p => pedPaso(p.estado) < 3).length;

  const enviarComentario = async (m) => {
    const texto = String(coment[m.id] || "").trim();
    if (!texto) { avisar("error", "Escribí el comentario primero."); return; }
    setBusy("c" + m.id);
    try {
      const hoyTxt = new Date().toISOString().slice(0, 10);
      const r = await cfPost("panelComentarOT", { ot_id: m.id, comentario: texto, estado: m.estado || "", fecha: hoyTxt });
      if (!r || r.ok === false) throw new Error((r && r.error) || "el script no respondió");
      setCf(p => ({ ...p, seguimientoOT: [...(p.seguimientoOT || []), { ot_id: m.id, fecha: hoyTxt, comentario: texto, estado: m.estado || "" }] }));
      setComent(p => ({ ...p, [m.id]: "" }));
      avisar("ok", "Comentario enviado: el chofer ya lo ve en su app.");
    } catch (e) { avisar("error", "No se pudo enviar el comentario. " + (e.message || e)); }
    setBusy("");
  };

  const avanzarOT = (m) => {
    const e = String(m.estado || "programado").toLowerCase();
    const nuevo = /progres|proceso|curso/.test(e) ? "completado" : "en_progreso";
    setMantenimiento(prev => prev.map(x => mismoId(x.id, m.id) ? { ...x, estado: nuevo } : x));
  };

  const actualizarPedido = async (p, nuevoEstado) => {
    setBusy("p" + p.id);
    try {
      const data = { id: p.id };
      if (nuevoEstado) data.estado = nuevoEstado;
      if (resp[p.id] !== undefined) data.respuesta = resp[p.id];
      const r = await cfPost("panelActualizarPedido", data);
      if (!r || r.ok === false) throw new Error((r && r.error) || "el script no respondió");
      setCf(prev => ({ ...prev, pedidos: (prev.pedidos || []).map(x => mismoId(x.id, p.id) ? { ...x, ...(nuevoEstado ? { estado: nuevoEstado } : {}), ...(resp[p.id] !== undefined ? { respuesta: resp[p.id] } : {}) } : x) }));
      avisar("ok", nuevoEstado ? "Pedido actualizado: el chofer lo ve en su app." : "Respuesta guardada: el chofer la ve en su pedido.");
    } catch (e) { avisar("error", "No se pudo actualizar el pedido. " + (e.message || e)); }
    setBusy("");
  };

  const guardarDiagrama = async () => {
    if (!formD.fecha || !formD.interno || !String(formD.tarea).trim()) { avisar("error", "Completá al menos fecha, unidad y tarea."); return; }
    setBusy("d-nuevo");
    try {
      const r = await cfPost("panelGuardarDiagrama", { diagrama: { ...formD } });
      if (!r || r.ok === false) throw new Error((r && r.error) || "el script no respondió");
      setCf(prev => ({ ...prev, diagramas: [...(prev.diagramas || []), { ...formD, id: r.id, estado: "pendiente" }] }));
      setFormD({ fecha: "", interno: "", tarea: "LAVADO", hora: "", duracion: "", notas: "" });
      avisar("ok", "Tarea programada: el chofer la ve en Diagramas.");
    } catch (e) { avisar("error", "No se pudo programar la tarea. " + (e.message || e)); }
    setBusy("");
  };
  const borrarDiagrama = async (d) => {
    if (!window.confirm("¿Borrar esta tarea del diagrama?")) return;
    setBusy("d" + d.id);
    try {
      const r = await cfPost("panelBorrarDiagrama", { id: d.id });
      if (!r || r.ok === false) throw new Error((r && r.error) || "el script no respondió");
      setCf(prev => ({ ...prev, diagramas: (prev.diagramas || []).filter(x => !mismoId(x.id, d.id)) }));
    } catch (e) { avisar("error", "No se pudo borrar. " + (e.message || e)); }
    setBusy("");
  };

  const listaInsumos = insumosEd || cf.insumos || [];
  const setIns = (i, k, v) => setInsumosEd((insumosEd || cf.insumos || []).map((x, j) => j === i ? { ...x, [k]: v } : x));
  const guardarInsumos = async () => {
    setBusy("ins");
    try {
      const limpios = listaInsumos.filter(x => String(x.nombre || "").trim());
      const r = await cfPost("panelGuardarInsumos", { insumos: limpios });
      if (!r || r.ok === false) throw new Error((r && r.error) || "el script no respondió");
      setCf(prev => ({ ...prev, insumos: limpios }));
      setInsumosEd(null);
      avisar("ok", "Catálogo guardado: los choferes ya ven la lista nueva.");
    } catch (e) { avisar("error", "No se pudo guardar el catálogo. " + (e.message || e)); }
    setBusy("");
  };

  // v8.8: carga masiva del catálogo de insumos y repuestos — suma sin duplicar y guarda de una
  const importarInsumos = (filas) => {
    const errores = []; const nuevos = [];
    const yaEsta = {};
    (insumosEd || cf.insumos || []).forEach(x => { yaEsta[sinAcentos(x.nombre || "")] = true; });
    filas.forEach((f, i) => {
      const nombre = String(f.nombre || "").trim();
      if (!nombre) { errores.push(`Fila ${i + 2}: falta el nombre.`); return; }
      const clave = sinAcentos(nombre);
      if (yaEsta[clave]) { errores.push(`Fila ${i + 2}: "${nombre}" ya está en el catálogo — no se duplicó.`); return; }
      yaEsta[clave] = true;
      nuevos.push({ id: "I-" + (Date.now() + i), nombre, categoria: String(f.categoria || "").trim(),
                    unidad: String(f.unidad || "").trim(), activo: /^no$/i.test(String(f.activo || "").trim()) ? "no" : "si" });
    });
    if (!nuevos.length) return { agregados: 0, errores: errores.length ? errores : ["No hay filas válidas."] };
    const total = [...(insumosEd || cf.insumos || []), ...nuevos].filter(x => String(x.nombre || "").trim());
    setCf(prev => ({ ...prev, insumos: total }));
    setInsumosEd(null);
    cfPost("panelGuardarInsumos", { insumos: total })
      .then(r => { if (!r || r.ok === false) throw new Error((r && r.error) || "el script no respondió");
        avisar("ok", `Catálogo actualizado: ${nuevos.length} insumo(s) nuevos, los choferes ya los ven.`); })
      .catch(e => avisar("error", "OJO: el catálogo se ve acá pero NO llegó a la planilla. " + (e.message || e)));
    return { agregados: nuevos.length, errores };
  };

  // v8.8: carga masiva de diagramas (CSV/Excel) — todo en un solo guardado
  const importarDiagramas = (filas) => {
    const errores = []; const lista = [];
    filas.forEach((f, i) => {
      const fecha = toDateInput(f.fecha);
      if (!fecha) { errores.push(`Fila ${i + 2}: la fecha "${f.fecha}" no se entendió.`); return; }
      if (!String(f.interno || "").trim()) { errores.push(`Fila ${i + 2}: falta la unidad (interno).`); return; }
      if (!String(f.tarea || "").trim()) { errores.push(`Fila ${i + 2}: falta la tarea.`); return; }
      lista.push({ fecha, interno: String(f.interno).trim(), tarea: String(f.tarea).trim().toUpperCase(),
                   hora: String(f.hora || "").trim(), duracion: String(f.duracion || "").trim(), notas: String(f.notas || "").trim() });
    });
    if (!lista.length) return { agregados: 0, errores: errores.length ? errores : ["No hay filas válidas."] };
    const marca = "DM-" + Date.now() + "-";
    setCf(prev => ({ ...prev, diagramas: [...(prev.diagramas || []), ...lista.map((t, i) => ({ ...t, id: marca + i, estado: "pendiente" }))] }));
    cfPost("panelGuardarDiagramasMasivo", { diagramas: lista })
      .then(r => {
        if (!r || r.ok === false) throw new Error((r && r.error) || "el script no respondió");
        if (Array.isArray(r.ids)) setCf(prev => ({ ...prev, diagramas: (prev.diagramas || []).map(d => {
          const j = String(d.id || "").indexOf(marca) === 0 ? Number(String(d.id).slice(marca.length)) : -1;
          return j >= 0 && r.ids[j] ? { ...d, id: r.ids[j] } : d;
        }) }));
        avisar("ok", `Diagrama cargado: ${lista.length} tarea(s) ya están en la planilla y en la app de los choferes.`);
      })
      .catch(e => avisar("error", "OJO: las tareas se ven acá pero NO llegaron a la planilla. " + (e.message || e)));
    return { agregados: lista.length, errores };
  };

  // resumen por día: cantidad de tareas y tiempo total (para dimensionar personal y horarios)
  const resumenDias = (() => {
    const por = {};
    (cf.diagramas || []).forEach(d => {
      const f = String(d.fecha || "");
      if (!f) return;
      if (!por[f]) por[f] = { n: 0, min: 0, sinDato: 0 };
      por[f].n++;
      const mins = Number(d.duracion);
      if (isFinite(mins) && mins > 0) por[f].min += mins; else por[f].sinDato++;
    });
    return Object.keys(por).sort().map(f => ({ fecha: f, ...por[f] }));
  })();
  const fmtMin = (m) => m >= 60 ? Math.floor(m / 60) + " h " + (m % 60 ? (m % 60) + " m" : "") : m + " min";

  const TabBtn = ({ id, label, cant }) => (
    <button onClick={() => setTab(id)}
      style={{ padding: "8px 16px", borderRadius: 8, border: "none", cursor: "pointer", fontSize: 13, fontWeight: 700, background: tab === id ? "var(--c-primario)" : "transparent", color: tab === id ? "#fff" : "#6B7280" }}>
      {label}{cant > 0 ? <span style={{ marginLeft: 6, padding: "1px 7px", borderRadius: 99, fontSize: 11, background: tab === id ? "rgba(255,255,255,0.25)" : "#DC262618", color: tab === id ? "#fff" : "#DC2626" }}>{cant}</span> : null}
    </button>
  );

  const btnChico = (activo) => ({ padding: "6px 14px", borderRadius: 8, border: "none", background: activo ? "var(--c-primario)" : "#E5E7EB", color: activo ? "#fff" : "#9CA3AF", fontSize: 12, fontWeight: 700, cursor: activo ? "pointer" : "default" });

  return (
    <div>
      <SectionHeader title="App conductor" sub={`${novedades.length} novedad(es) abiertas · ${pendPed} pedido(s) en curso — todo lo que mandan los choferes, tratado desde acá`} />
      {!SHEET_API_URL && <Card style={{ border: "1.5px solid #D7DEE8", boxShadow: "0 1px 6px rgba(15,30,60,0.08)" }}><div style={{ color: "#DC2626", fontSize: 13 }}>Sin conexión a la planilla: esta pantalla necesita la URL del script.</div></Card>}
      {aviso && (
        <div style={{ position: "fixed", top: 70, left: "50%", transform: "translateX(-50%)", zIndex: 300, padding: "11px 22px", borderRadius: 9, fontWeight: 700, fontSize: 13, color: "#fff", background: aviso.tipo === "ok" ? "#16A34A" : "#DC2626", boxShadow: "0 10px 30px rgba(0,0,0,0.25)", maxWidth: "90vw" }}>{aviso.texto}</div>
      )}
      <Card style={{ border: "1.5px solid #D7DEE8", boxShadow: "0 1px 6px rgba(15,30,60,0.08)",  padding: "10px 12px", marginBottom: 14 }}>
        <div style={{ display: "flex", gap: 4, flexWrap: "wrap" }}>
          <TabBtn id="novedades" label="Novedades" cant={novedades.length} />
          <TabBtn id="asignaciones" label="Asignación de unidades" cant={0} />
          <TabBtn id="pedidos" label="Pedidos de insumos" cant={pendPed} />
          <TabBtn id="diagramas" label="Diagramas" cant={0} />
          <TabBtn id="insumos" label="Insumos y repuestos" cant={0} />
        </div>
      </Card>

      {tab === "novedades" && (
        <React.Fragment>
          <div style={{ display: "flex", justifyContent: "flex-end", marginBottom: 10 }}>
            <label style={{ fontSize: 12, color: "#6B7280", cursor: "pointer", display: "flex", alignItems: "center", gap: 6 }}>
              <input type="checkbox" checked={verCerradas} onChange={e => setVerCerradas(e.target.checked)} /> mostrar también las completadas
            </label>
          </div>
          {novedades.length === 0 && <Card style={{ border: "1.5px solid #D7DEE8", boxShadow: "0 1px 6px rgba(15,30,60,0.08)" }}><div style={{ color: "#9CA3AF", fontSize: 13, textAlign: "center", padding: 10 }}>No hay novedades abiertas de los choferes. Cuando manden una desde su app, aparece acá.</div></Card>}
          {novedades.map(m => {
            const cerrada = /complet|finaliz|cancel/.test(String(m.estado || "").toLowerCase());
            const enProceso = /progres|proceso|curso/.test(String(m.estado || "").toLowerCase());
            const comentarios = segDe(m.id);
            return (
              <Card key={m.id} style={{ marginBottom: 12 }}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 10, flexWrap: "wrap" }}>
                  <div>
                    <div style={{ fontSize: 14, fontWeight: 800, color: "var(--c-primario)" }}>
                      {cfConductorDe(m) || "Conductor"} <span style={{ color: "#9CA3AF", fontWeight: 600 }}>· {unidadDe(m)} · {fmtFecha(m.fecha)}{horaDeId(m.id) ? " · " + horaDeId(m.id) + " hs" : ""}</span>
                    </div>
                    <div style={{ fontSize: 12, color: "#6B7280", marginTop: 2 }}>{m.tipo}</div>
                  </div>
                  <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                    <Badge estado={m.estado} />
                    {!cerrada && (
                      <button onClick={() => avanzarOT(m)} style={{ border: "1.5px solid var(--c-primario)", background: "#fff", color: "var(--c-primario)", borderRadius: 7, padding: "4px 12px", fontSize: 12, fontWeight: 700, cursor: "pointer" }}>
                        {enProceso ? "✔ Finalizar" : "▶ Iniciar"}
                      </button>
                    )}
                  </div>
                </div>
                <div style={{ marginTop: 10, border: "1px solid #DCE4EE", borderLeft: "4px solid var(--c-primario)", borderRadius: 8, overflow: "hidden" }}>
                  <div style={{ fontSize: 11, fontWeight: 800, color: "var(--c-primario)", background: "#EEF3F9", padding: "5px 12px", letterSpacing: ".4px" }}>📄 EL CHOFER REPORTÓ:</div>
                  <div style={{ fontSize: 13.5, color: "#1F2937", lineHeight: 1.6, background: "#fff", padding: "10px 12px" }}>
                    <LinksAdjuntos texto={cfSinPrefijo(m.descripcion)} />
                  </div>
                </div>
                {comentarios.length > 0 && (
                  <div style={{ marginTop: 10 }}>
                    <div style={{ fontSize: 11, fontWeight: 800, color: "#6B7280", letterSpacing: ".4px", marginBottom: 5 }}>🔧 RESPUESTAS DEL TALLER (el chofer las ve en su teléfono):</div>
                    {comentarios.map((c, i) => (
                      <div key={i} style={{ fontSize: 12.5, background: "var(--c-primario)0d", borderLeft: "3px solid var(--c-primario)", borderRadius: "0 8px 8px 0", padding: "7px 10px", marginBottom: 5 }}>
                        <span style={{ color: "#9CA3AF", marginRight: 8 }}>{fmtFecha(c.fecha)}</span>{c.comentario}
                      </div>
                    ))}
                  </div>
                )}
                <div style={{ fontSize: 11, fontWeight: 800, color: "#6B7280", letterSpacing: ".4px", marginTop: 12, marginBottom: 5 }}>✍️ ESCRIBILE AL CHOFER (le llega a su app):</div>
                <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
                  <input value={coment[m.id] || ""} onChange={e => setComent(p => ({ ...p, [m.id]: e.target.value }))}
                    onKeyDown={e => { if (e.key === "Enter") enviarComentario(m); }}
                    placeholder='Comentario para el chofer — ej: "se pidió el repuesto, llega el lunes"'
                    style={{ flex: "1 1 240px", minWidth: 0, padding: "8px 12px", border: "1.5px solid #D7DEE8", borderRadius: 8, fontSize: 13, outline: "none" }} />
                  <button onClick={() => enviarComentario(m)} disabled={busy === "c" + m.id} style={btnChico(busy !== "c" + m.id)}>
                    {busy === "c" + m.id ? "Enviando…" : "Enviar al chofer"}
                  </button>
                </div>
              </Card>
            );
          })}
        </React.Fragment>
      )}

      {tab === "pedidos" && (
        <React.Fragment>
          <div style={{ display: "flex", justifyContent: "flex-end", marginBottom: 10 }}>
            <label style={{ fontSize: 12, color: "#6B7280", cursor: "pointer", display: "flex", alignItems: "center", gap: 6 }}>
              <input type="checkbox" checked={verTerminados} onChange={e => setVerTerminados(e.target.checked)} /> mostrar también los terminados{terminados ? ` (${terminados})` : ""}
            </label>
          </div>
          {pedidos.length === 0 && <Card style={{ border: "1.5px solid #D7DEE8", boxShadow: "0 1px 6px rgba(15,30,60,0.08)" }}><div style={{ color: "#9CA3AF", fontSize: 13, textAlign: "center", padding: 10 }}>{terminados ? "No hay pedidos en curso: los terminados quedan archivados (casilla de arriba para verlos)." : "Todavía no hay pedidos de insumos."}</div></Card>}
          {pedidos.map(p => {
            const paso = pedPaso(p.estado);
            const color = PED_COLOR[PED_PASOS[paso]];
            return (
              <Card key={p.id} style={{ marginBottom: 12 }}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 10, flexWrap: "wrap" }}>
                  <div>
                    <div style={{ fontSize: 14, fontWeight: 800, color: "var(--c-primario)" }}>
                      {p.conductor || "Conductor"} <span style={{ color: "#9CA3AF", fontWeight: 600 }}>· {p.interno ? "unidad " + p.interno : ""} · {fmtFecha(p.fecha)} {p.hora || ""}</span>
                    </div>
                    <div style={{ fontSize: 13, color: "#374151", marginTop: 6 }}>{String(p.items || "")}</div>
                    {p.comentario ? <div style={{ fontSize: 12, color: "#6B7280", marginTop: 4 }}>💬 {p.comentario}</div> : null}
                  </div>
                  <span style={{ padding: "3px 12px", borderRadius: 99, fontSize: 11.5, fontWeight: 800, background: color + "18", color: color, whiteSpace: "nowrap" }}>{PED_ETIQ[PED_PASOS[paso]]}</span>
                </div>
                <div style={{ display: "flex", gap: 8, marginTop: 10, flexWrap: "wrap", alignItems: "center" }}>
                  {paso === 0 && <button disabled={busy === "p" + p.id} onClick={() => actualizarPedido(p, "preparado")} style={btnChico(busy !== "p" + p.id)}>✔ Marcar preparado</button>}
                  {paso === 1 && <button disabled={busy === "p" + p.id} onClick={() => actualizarPedido(p, "enviado")} style={btnChico(busy !== "p" + p.id)}>🚚 Marcar enviado</button>}
                  {paso === 2 && (
                    <React.Fragment>
                      <span style={{ fontSize: 12, color: "#6B7280" }}>Esperando que el chofer confirme desde su app…</span>
                      <button disabled={busy === "p" + p.id} onClick={() => actualizarPedido(p, "recibido")}
                        title="Si el chofer no puede confirmar, cerralo vos: sale del listado"
                        style={{ padding: "6px 14px", borderRadius: 8, border: "1.5px solid #16A34A", background: "#fff", color: "#16A34A", fontSize: 12, fontWeight: 700, cursor: "pointer" }}>✔ Finalizar igual</button>
                    </React.Fragment>
                  )}
                  {paso === 3 && <span style={{ fontSize: 12, color: "#16A34A", fontWeight: 700 }}>✓ Recibido{p.recibido_el ? " el " + p.recibido_el : ""}</span>}
                  <input value={resp[p.id] !== undefined ? resp[p.id] : (p.respuesta || "")}
                    onChange={e => setResp(x => ({ ...x, [p.id]: e.target.value }))}
                    placeholder='Respuesta del pañol — ej: "retirar en pañol central"'
                    style={{ flex: 1, minWidth: 200, padding: "7px 12px", border: "1.5px solid #E5E7EB", borderRadius: 8, fontSize: 12.5, outline: "none" }} />
                  <button disabled={busy === "p" + p.id} onClick={() => actualizarPedido(p, null)} style={btnChico(busy !== "p" + p.id)}>Guardar respuesta</button>
                </div>
              </Card>
            );
          })}
        </React.Fragment>
      )}

      {tab === "diagramas" && (
        <React.Fragment>
          <Card style={{ border: "1.5px solid #D7DEE8", boxShadow: "0 1px 6px rgba(15,30,60,0.08)",  marginBottom: 12 }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10, flexWrap: "wrap", gap: 8 }}>
              <div style={{ fontSize: 13, fontWeight: 800, color: "var(--c-primario)" }}>Programar tarea (el chofer la ve en su app y la marca iniciada/hecha)</div>
              <ImportarMasivo nombre="Diagramas"
                ayuda="Subí el diagrama completo: una fila por tarea. La duración en minutos sirve para calcular el tiempo total de cada día."

/* ═══ RECORRIDOS DE PERSONAL (v1 de ejemplo) ═══════════════════════════════
   Para el cliente que pide la planilla amarilla de pasajeros (Tratayen).
   La idea: el PADRÓN (quién es cada pasajero, de dónde sale, a dónde va,
   a qué hora, teléfono, si lleva trasbordo) se carga UNA vez. Cada día el
   operador solo tilda quiénes confirmaron (o pega el chat de WhatsApp y
   se tildan solos, matcheando por el número del remitente),
   elige chofer e interno, y saca la planilla con el formato del cliente.
   Por ahora guarda en esta computadora; la sincronización a la planilla
   viene en la próxima versión si el circuito convence.                    */
/* v2 — el padrón ahora guarda APELLIDO y NOMBRE por separado, pero todo lo
   demás (la planilla que se imprime, el matcheo del WhatsApp, los listados)
   sigue trabajando con el nombre completo. */
const recNomComp = (p) => {
  const n = String(p.nombre || "").trim(), a = String(p.apellido || "").trim();
  if (!a) return n;
  if (!n) return a;
  /* idempotente: si el nombre YA termina en el apellido, no lo repite.
     Hace falta porque en algunos lados (la planilla impresa, el recorrido)
     el registro ya viene con el nombre completo en .nombre. */
  const N = n.toLowerCase(), A = a.toLowerCase();
  if (N === A || N.endsWith(" " + A)) return n;
  return n + " " + a;
};

/* Parte un nombre completo en nombre + apellido. Regla: la ÚLTIMA palabra es
   el apellido ("Walter Sebastian Nuñez" -> Walter Sebastian / Nuñez). Si ya
   viene el apellido cargado, se respeta y solo se lo saca del completo. */
const recPartirNombre = (completo, apellidoYa) => {
  const full = String(completo || "").trim().replace(/\s+/g, " ");
  const ap = String(apellidoYa || "").trim();
  if (ap) {
    const fin = " " + ap.toLowerCase();
    if (full.toLowerCase().endsWith(fin)) return { nombre: full.slice(0, full.length - ap.length).trim(), apellido: ap };
    if (full.toLowerCase() === ap.toLowerCase()) return { nombre: "", apellido: ap };
    return { nombre: full, apellido: ap };
  }
  if (!full) return { nombre: "", apellido: "" };
  const partes = full.split(" ");
  if (partes.length === 1) return { nombre: full, apellido: "" };
  return { nombre: partes.slice(0, -1).join(" "), apellido: partes[partes.length - 1] };
};

/* Deja cualquier fila (venga de la planilla, del archivo de carga masiva o de
   una versión vieja) con la forma que usa el padrón v2. */
const recNormalizarPasajero = (x) => {
  const { nombre, apellido } = recPartirNombre(x.nombre, x.apellido);
  return { ...x, nombre: nombre, apellido: apellido };
};

/* La letra que sigue en un grupo: A, B, C… */
/* Metros entre dos puntos del mapa (Haversine). */
const recDistancia = (la1, lo1, la2, lo2) => {
  const a1 = Number(la1), b1 = Number(lo1), a2 = Number(la2), b2 = Number(lo2);
  if (!a1 || !b1 || !a2 || !b2) return null;
  const R = 6371000, dLa = (a2 - a1) * Math.PI / 180, dLo = (b2 - b1) * Math.PI / 180;
  const h = Math.sin(dLa / 2) ** 2 +
            Math.cos(a1 * Math.PI / 180) * Math.cos(a2 * Math.PI / 180) * Math.sin(dLo / 2) ** 2;
  return Math.round(R * 2 * Math.atan2(Math.sqrt(h), Math.sqrt(1 - h)));
};

const recLetraSiguiente = (paradas, grupoId) => {
  const usadas = paradas.filter(p => String(p.grupo) === String(grupoId))
                        .map(p => String(p.letra || "").toUpperCase());
  for (let i = 0; i < 26; i++) {
    const L = String.fromCharCode(65 + i);
    if (usadas.indexOf(L) < 0) return L;
  }
  return "";
};

/* Matcheo por nombre, tolerante: sin tildes ni mayúsculas, y alcanza con que
   las palabras de un lado estén contenidas en el otro ("Nicolas Alvarez"
   engancha con "Nicolas Alvares" por la primera palabra + inicial). */
const recCoincide = (a, b) => {
  const A = pgNorm(a).split(" ").filter(x => x.length > 2);
  const B = pgNorm(b).split(" ").filter(x => x.length > 2);
  if (!A.length || !B.length) return false;
  const contiene = (xs, ys) => xs.filter(x => ys.some(y => y === x || y.indexOf(x) === 0 || x.indexOf(y) === 0)).length;
  const n = Math.min(A.length, B.length);
  return contiene(A, B) >= Math.min(2, n) || (n === 1 && contiene(A, B) === 1);
};

const recEsc = (s) => String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

/* Los últimos 8 dígitos identifican el número aunque venga con +54 9, con
   guiones o con espacios: "+54 9 2995 21-5851" y "2995215851" son el mismo. */
const recTelNorm = (tel) => String(tel || "").replace(/\D/g, "").slice(-8);
const REC_CONFIRMA = /(subo|sube|voy|va\b|confirmo|confirmado|presente|ahi estare|ah[ií] estar[eé])/i;

/* ── EL RECORRIDO DEL DÍA ──────────────────────────────────────────────────
   Con la gente que confirmó hoy, arma las PARADAS JUSTAS: junta a los que
   salen del mismo lugar en una sola parada, las ordena por hora y les pone
   letra A, B, C… Las paradas donde hoy no sube nadie sencillamente no están
   — que es la regla del comunicado: "la unidad solo para donde hay pasajeros
   para ascender".
   Los que vienen por trasbordo van aparte: a esos no los levanta la unidad. */
const recArmarRecorrido = (pasajeros, todasLasParadas) => {
  const paradas = [], trasbordos = [];
  const mapa = {};
  (todasLasParadas || []).forEach(x => { mapa[String(x.id)] = x; });
  (pasajeros || []).forEach(p => {
    if (String(p.trasbordo || "").trim()) { trasbordos.push(p); return; }
    /* La parada la definió tráfico y el pasajero está asignado a ella.
       Si todavía no tiene parada asignada, se cae para atrás al domicilio
       para no perderlo: aparece igual, con un cartel de que falta asignarla. */
    const par = mapa[String(p.parada || "")];
    const clave = par ? "P:" + par.id : "D:" + pgNorm(String(p.desde || "") || "sin direccion");
    let g = paradas.find(x => x.clave === clave);
    if (!g) {
      g = par
        ? { clave: clave, parada_id: par.id, lugar: par.nombre, letra: par.letra,
            hora: String(par.hora || ""), orden: Number(par.orden) || 999,
            lat: par.lat, lng: par.lng, sinAsignar: false, gente: [] }
        : { clave: clave, parada_id: "", lugar: String(p.desde || "").trim() || "(sin dirección)",
            letra: "", hora: String(p.hora || ""), orden: 998,
            lat: p.lat, lng: p.lng, sinAsignar: true, gente: [] };
      paradas.push(g);
    }
    g.gente.push(p);
  });
  /* Se ordenan por el orden que les puso tráfico; si empatan, por hora. */
  paradas.sort((a, b) => (a.orden - b.orden) || String(a.hora).localeCompare(String(b.hora)));
  paradas.forEach((g, i) => { if (!g.letra) g.letra = "·"; });

  /* los trasbordos se agrupan por proveedor y por punto de encuentro */
  const porProveedor = [];
  trasbordos.forEach(p => {
    const prov = String(p.trasbordo).trim();
    let g = porProveedor.find(x => x.proveedor === prov);
    if (!g) { g = { proveedor: prov, punto: String(p.hasta || "").trim(), gente: [] }; porProveedor.push(g); }
    g.gente.push(p);
  });

  const horas = paradas.map(g => g.hora).filter(Boolean).sort();
  return { paradas: paradas, trasbordos: porProveedor,
           primera: horas[0] || "", ultima: horas[horas.length - 1] || "",
           cuantos: (pasajeros || []).length };
};

/* Link a Google Maps con las paradas como puntos intermedios, para leer los
   kilómetros y el tiempo real del recorrido de hoy. */
const recMapaDelRecorrido = (rec, destino) => {
  const puntos = rec.paradas.map(g => g.lugar).filter(Boolean);
  if (!puntos.length) return "";
  const origen = encodeURIComponent(puntos[0]);
  const fin = encodeURIComponent(destino || puntos[puntos.length - 1]);
  const medio = puntos.slice(1).map(encodeURIComponent).join("%7C");
  return "https://www.google.com/maps/dir/?api=1&origin=" + origen + "&destination=" + fin +
         (medio ? "&waypoints=" + medio : "") + "&travelmode=driving";
};

    (rec.paradas.some(g => g.letra === "\u00b7")
      ? `<p style="font-size:11px;color:#a33;margin-top:6px;font-weight:bold">OJO: las filas que dicen SIN PARADA son pasajeros que todavia no estan asignados a una parada del grupo: se los muestra por su domicilio y NO le aparecen al chofer en el mapa.</p>`
      : "") +
    `<p style="font-size:11px;color:#555;margin-top:6px">La unidad solo para donde hay pasajeros. Si una parada no se hace, se sigue a la siguiente y las horas posteriores se adelantan. Espera máxima en cada parada: 3 minutos.</p>`;
};

/* ── LO QUE VIAJA A LA APP DEL CONDUCTOR ──────────────────────────────────
   El panel deja el recorrido YA ARMADO en el servicio. La app no calcula
   nada: agarra esto y lo dibuja. Una sola fuente de verdad. */
const recRecorridoParaLaApp = (rec, destino, coordenadas) => {
  const coord = (dir) => (coordenadas || {})[pgNorm(dir)] || {};
  const paradas = rec.paradas.map((g, i) => {
    const c = (g.lat && g.lng) ? { lat: Number(g.lat), lng: Number(g.lng) } : coord(g.lugar);
    return {
      parada_id: g.parada_id || ("p" + (i + 1)),
      letra: g.letra === "·" ? "" : g.letra,
      nombre: g.lugar,
      tipo: "ascenso",
      hora_prevista: g.hora || "",
      lat: c.lat || "", lng: c.lng || "",
      notas: "",
      pasajeros: g.gente.map(p => ({
        pasajero_id: p.id, nombre: recNomComp(p), tel: p.tel || "",
        trasbordo: p.trasbordo || "", direccion: p.desde || ""
      }))
    };
  });
  if (destino) {
    const c = coord(destino);
    paradas.push({ parada_id: "pfin", letra: "", nombre: destino, tipo: "destino",
      hora_prevista: "", lat: c.lat || "", lng: c.lng || "", notas: "", pasajeros: [] });
  }
  return {
    destino: destino || "",
    paradas: paradas,
    trasbordos: rec.trasbordos.map(t => ({
      proveedor: t.proveedor, punto: t.punto,
      gente: t.gente.map(p => ({ pasajero_id: p.id, nombre: recNomComp(p), tel: p.tel || "" }))
    }))
  };
};

/* ── BUSCAR LAS COORDENADAS DE UNA DIRECCIÓN ──────────────────────────────
   Usa Nominatim, el buscador de OpenStreetMap: gratis, sin cuenta y sin
   clave. Se consulta UNA sola vez por dirección y queda guardada en el
   padrón, así que no se repite ni se abusa del servicio.
   Si falla, no pasa nada: el recorrido anda igual, solo que sin mapa. */
const recBuscarCoordenadas = async (direccion) => {
  const q = String(direccion || "").trim();
  if (!q) return null;
  const url = "https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=ar&q=" +
              encodeURIComponent(q);
  try {
    const r = await fetch(url, { headers: { "Accept": "application/json" } });
    if (!r.ok) return null;
    const j = await r.json();
    if (!j || !j.length) return null;
    return { lat: Number(j[0].lat), lng: Number(j[0].lon) };
  } catch (e) { return null; }
};

/* ═══ GRUPOS DE TRANSPORTE (v3) ═══════════════════════════════════════════
   Cambió el eje: antes había UN padrón con todos mezclados; ahora manda el
   GRUPO, que es el mismo grupo de WhatsApp de la operación real
   ("Planta Tratayen Cipolleti Dia", "Rio Neuquen - Diurno", …).

   Cómo se usa, en criollo:
     1. GRUPOS      se crean y se editan a demanda (nombre, destino, hora)
     2. PASAJEROS   cada uno vive en un grupo; se puede mover cuando haga falta
     3. HOY         se elige el grupo, se tilda quién confirmó, se pone chofer
                    e interno, y sale la planilla impresa
   ═══════════════════════════════════════════════════════════════════════════ */

const Recorridos = ({ vehiculos, conductores, empresaActiva, recPadron, recServicios, recProveedores, recGrupos, recParadas }) => {
  const [grupos, setGrupos] = useState(() => {
    const g = pgLeer(REC_LS.grupos, null);
    return (g && g.length) ? g : REC_GRUPOS_INICIAL;
  });
  const [paradas, setParadas] = useState(() => {
    const p = pgLeer(REC_LS.paradas, null);
    return (p && p.length) ? p : REC_PARADAS_INICIAL;
  });
  const [grupoParadas, setGrupoParadas] = useState(null);   // qué grupo estoy editando
  const [padron, setPadron] = useState(() => {
    const p = pgLeer(REC_LS.padron, null);
    if (!p || !p.length) return REC_PADRON_INICIAL;
    return p.map(x => {
      const y = recNormalizarPasajero(x);
      if (y.tel) return y;
      const ini = REC_PADRON_INICIAL.find(i => pgNorm(recNomComp(i)) === pgNorm(recNomComp(y)));
      return { ...y, tel: ini ? ini.tel : "" };
    });
  });
  const [servicios, setServicios] = useState(() => pgLeer(REC_LS.servicios, []));
  const [proveedores, setProveedores] = useState(() => { const p = pgLeer(REC_LS.proveedores, null); return (p && p.length) ? p : REC_PROVEEDORES_INICIAL; });

  const [vista, setVista] = useState("grupos");
  const [grupoAbierto, setGrupoAbierto] = useState(null);   // id del grupo con el que se está armando el servicio
  const [srv, setSrv] = useState({ fecha: new Date().toISOString().slice(0, 10), chofer: "", interno: "", hora: "", nota: "" });
  const [marcados, setMarcados] = useState({});
  const [chat, setChat] = useState("");
  const [resultadoChat, setResultadoChat] = useState(null);
  const [nuevoProv, setNuevoProv] = useState("");
  const [avisoPadron, setAvisoPadron] = useState("");
  const [buscandoCoords, setBuscandoCoords] = useState("");
  const [verTodos, setVerTodos] = useState(false);          // sumar gente de otros grupos
  const [filtroPadron, setFiltroPadron] = useState("");

  /* ── la planilla manda: si el GET trae contenido, pisa lo local ── */
  const recCargado = useRef(false);
  const recFirma = useRef("");
  useEffect(() => {
    let hubo = false;
    if (Array.isArray(recPadron) && recPadron.length) {
      setPadron(recPadron.map(x => recNormalizarPasajero({ ...x, activo: String(x.activo) !== "false" })));
      hubo = true;
    }
    if (Array.isArray(recServicios) && recServicios.length) {
      setServicios(recServicios.map(s => {
        let pj = s.pasajeros;
        if (typeof pj === "string" && pj) { try { pj = JSON.parse(pj); } catch (e) { pj = []; } }
        return { ...s, pasajeros: Array.isArray(pj) ? pj : [] };
      }));
      hubo = true;
    }
    if (Array.isArray(recParadas) && recParadas.length) {
      setParadas(recParadas.map(p => ({ ...p, activo: String(p.activo) !== "false" })));
      hubo = true;
    }
    if (Array.isArray(recGrupos) && recGrupos.length) {
      setGrupos(recGrupos.map(g => ({ ...g, activo: String(g.activo) !== "false" })));
      hubo = true;
    }
    if (Array.isArray(recProveedores) && recProveedores.length) {
      setProveedores(recProveedores.map(x => String(x.nombre || x)).filter(Boolean));
      hubo = true;
    }
    if (hubo) recFirma.current = "seed";
    recCargado.current = true;
  }, [recPadron, recServicios, recProveedores, recGrupos, recParadas]);

  useEffect(() => {
    pgGuardar(REC_LS.grupos, grupos);
    pgGuardar(REC_LS.paradas, paradas);
    pgGuardar(REC_LS.padron, padron);
    pgGuardar(REC_LS.servicios, servicios);
    pgGuardar(REC_LS.proveedores, proveedores);
    if (!SHEET_API_URL || !recCargado.current) return;
    /* a la hoja va el nombre COMPLETO (RecPadron tiene una sola columna de
       nombre) y, además, apellido y grupo por si el conector ya tiene esas
       columnas. Si no las tiene, se ignoran y no se rompe nada. */
    const padronHoja = padron.map(p => ({ ...p, nombre: recNomComp(p), apellido: String(p.apellido || ""), grupo: recNombreGrupo(grupos, p.grupo) }));
    const paradasHoja = paradas.map(p => ({ ...p, grupo: recNombreGrupo(grupos, p.grupo) }));
    const cuerpo = JSON.stringify({ padron: padronHoja, servicios, proveedores, grupos, paradas: paradasHoja });
    if (recFirma.current === "seed") { recFirma.current = cuerpo; return; }
    if (cuerpo === recFirma.current) return;
    const t = setTimeout(() => {
      cfPost("panelGuardarRecorridos", { padron: padronHoja, servicios, proveedores, grupos, paradas: paradasHoja })
        .then(r => { if (r && r.ok !== false) recFirma.current = cuerpo; })
        .catch(() => { });
    }, 1500);
    return () => clearTimeout(t);
  }, [grupos, paradas, padron, servicios, proveedores]);

  /* ── ayudantes ── */
  const activos = padron.filter(p => p.activo !== false);
  const gruposActivos = grupos.filter(g => g.activo !== false);
  const grupoActual = grupos.find(g => g.id === grupoAbierto) || null;
  const delGrupo = (gid) => activos.filter(p => String(p.grupo || "") === String(gid));
  const candidatos = grupoActual ? (verTodos ? activos : delGrupo(grupoActual.id)) : [];
  const elegidos = activos.filter(p => marcados[p.id]);

  const setP = (id, k, v) => setPadron(prev => prev.map(x => x.id === id ? { ...x, [k]: v } : x));
  const setG = (id, k, v) => setGrupos(prev => prev.map(x => x.id === id ? { ...x, [k]: v } : x));
  const setPar = (id, k, v) => setParadas(prev => prev.map(x => x.id === id ? { ...x, [k]: v } : x));

  const paradasDe = (gid) => paradas
    .filter(p => String(p.grupo) === String(gid) && p.activo !== false)
    .sort((a, b) => (Number(a.orden) || 999) - (Number(b.orden) || 999));

  const agregarParada = (gid) => {
    const mias = paradas.filter(p => String(p.grupo) === String(gid));
    const orden = mias.reduce((m, p) => Math.max(m, Number(p.orden) || 0), 0) + 1;
    setParadas(prev => [...prev, { id: "pa_" + pgId(), grupo: gid, orden: orden,
      letra: recLetraSiguiente(prev, gid), nombre: "", hora: "", lat: "", lng: "", activo: true, notas: "" }]);
  };

  const borrarParada = (p) => {
    const n = padron.filter(x => String(x.parada) === String(p.id)).length;
    const msg = n ? `La parada ${p.letra || ""} tiene ${n} pasajero(s) asignado(s). Si la borrás, esa gente queda SIN parada (no se borra del padrón). ¿Seguís?`
                  : `¿Borrar la parada ${p.letra || ""} — ${p.nombre || "sin nombre"}?`;
    if (!confirm(msg)) return;
    setPadron(prev => prev.map(x => String(x.parada) === String(p.id) ? { ...x, parada: "" } : x));
    setParadas(prev => prev.filter(x => x.id !== p.id));
  };

  /* Le pone a cada pasajero la parada MÁS CERCANA a su domicilio, dentro de
     las paradas de su grupo. Es una propuesta: siempre se puede corregir a
     mano en la columna «Sube en la parada». */
  const asignarPorCercania = (gid) => {
    const todas = paradasDe(gid);
    const mias = todas.filter(p => Number(p.lat) && Number(p.lng));
    if (!mias.length) { alert("Las paradas de este grupo todavía no tienen ubicación (Lat y Lng).\n\nCompletalas en esta misma pantalla o con el botón «Buscar la ubicación de las paradas», y volvé a intentar."); return; }
    /* Sin esta advertencia pasa algo feo y silencioso: si solo 2 de 9 paradas
       tienen ubicación, TODOS los pasajeros caen en esas 2 por descarte. */
    const sinUbicacion = todas.length - mias.length;
    if (sinUbicacion > 0) {
      const faltantes = todas.filter(p => !(Number(p.lat) && Number(p.lng)))
                             .map(p => (p.letra ? p.letra + " · " : "") + (p.nombre || "sin nombre")).join("\n   · ");
      if (!window.confirm(
        "OJO: de las " + todas.length + " paradas de este grupo, solo " + mias.length + " tienen ubicación cargada.\n\n" +
        "Si seguís, TODOS los pasajeros van a caer en esas " + mias.length + " paradas, aunque les quede lejos, " +
        "porque las otras no las puedo medir.\n\nLes falta Lat y Lng a:\n   · " + faltantes + "\n\n" +
        "Aceptar = asignar igual con las que hay.\nCancelar = primero cargo las ubicaciones que faltan.")) return;
    }
    const gente = padron.filter(p => String(p.grupo) === String(gid) && p.activo !== false && !String(p.trasbordo || "").trim());
    const conUbic = gente.filter(p => Number(p.lat) && Number(p.lng));
    if (!conUbic.length) { alert("Ningún pasajero de este grupo tiene su domicilio ubicado (Lat y Lng), así que no puedo medir cuál parada le queda más cerca.\n\nCargá Lat y Lng en la carga masiva del padrón, o asignales la parada a mano."); return; }
    const yaTenian = conUbic.filter(p => String(p.parada || "").trim()).length;
    if (yaTenian && !window.confirm(`${yaTenian} pasajero(s) ya tienen parada asignada.\n\nAceptar = se les vuelve a calcular la más cercana.\nCancelar = solo se asignan los que no tienen ninguna.`)) {
      return asignarSoloVacios(gid, mias, conUbic);
    }
    aplicarCercania(mias, conUbic, true);
  };

  const asignarSoloVacios = (gid, mias, conUbic) =>
    aplicarCercania(mias, conUbic.filter(p => !String(p.parada || "").trim()), false);

  const aplicarCercania = (mias, gente, pisar) => {
    const asignaciones = {};
    let lejos = 0, sinUbic = 0;
    gente.forEach(p => {
      let mejor = null, mejorD = Infinity;
      mias.forEach(par => {
        const d = recDistancia(p.lat, p.lng, par.lat, par.lng);
        if (d !== null && d < mejorD) { mejorD = d; mejor = par; }
      });
      if (!mejor) { sinUbic++; return; }
      asignaciones[p.id] = mejor.id;
      if (mejorD > 1500) lejos++;
    });
    const cuantos = Object.keys(asignaciones).length;
    if (!cuantos) { alert("No se pudo asignar ninguno."); return; }
    setPadron(prev => prev.map(x => asignaciones[x.id] ? { ...x, parada: asignaciones[x.id] } : x));
    setAvisoPadron(`Listo: ${cuantos} pasajero(s) quedaron asignados a la parada más cercana, ` +
      `eligiendo entre las ${mias.length} paradas que tienen ubicación.` +
      (lejos ? ` OJO: ${lejos} quedaron con la parada a más de 1,5 km — casi seguro es porque falta cargar la ubicación de otras paradas. Revisalos.` : "") +
      " Podés corregir cualquiera en la solapa «3 · Pasajeros».");
    setTimeout(() => setAvisoPadron(""), 12000);
  };

  const importarParadas = (filas) => {
    if (!grupoParadas) return { agregados: 0, errores: ["Primero elegí un grupo."] };
    const salida = paradas.slice();
    const errores = [];
    let nuevas = 0, actualizadas = 0;
    (filas || []).forEach((f, i) => {
      const nombre = String(f.nombre || "").trim();
      if (!nombre) { errores.push(`Fila ${i + 2}: sin nombre de parada.`); return; }
      const letra = String(f.letra || "").trim().toUpperCase();
      const j = salida.findIndex(x => String(x.grupo) === String(grupoParadas) &&
        (letra ? String(x.letra).toUpperCase() === letra : pgNorm(x.nombre) === pgNorm(nombre)));
      const datos = { nombre: nombre, hora: String(f.hora || "").trim(),
        lat: String(f.lat || "").trim(), lng: String(f.lng || "").trim(),
        notas: String(f.notas || "").trim() };
      if (letra) datos.letra = letra;
      if (String(f.orden || "").trim()) datos.orden = Number(f.orden);
      if (j >= 0) {
        const act = { ...salida[j] };
        Object.keys(datos).forEach(c => { if (datos[c] !== "" && datos[c] !== undefined) act[c] = datos[c]; });
        salida[j] = act; actualizadas++;
      } else {
        const orden = datos.orden || (salida.filter(x => String(x.grupo) === String(grupoParadas))
          .reduce((m, p) => Math.max(m, Number(p.orden) || 0), 0) + 1);
        salida.push({ id: "pa_" + pgId(), grupo: grupoParadas, activo: true,
          letra: letra || recLetraSiguiente(salida, grupoParadas), ...datos, orden: orden });
        nuevas++;
      }
    });
    if (!nuevas && !actualizadas) return { agregados: 0, errores: errores.length ? errores : ["No se importó ninguna fila."] };
    setParadas(salida);
    setAvisoPadron(`Paradas actualizadas: ${nuevas} nueva(s) y ${actualizadas} actualizada(s).`);
    setTimeout(() => setAvisoPadron(""), 8000);
    return { agregados: nuevas + actualizadas, errores: errores };
  };

  const abrirGrupo = (g) => {
    setGrupoAbierto(g.id);
    setMarcados({});
    setVerTodos(false);
    setChat(""); setResultadoChat(null);
    setSrv({ fecha: new Date().toISOString().slice(0, 10), chofer: g.chofer || "", interno: g.unidad || "",
             hora: g.hora || "", nota: g.nota || ("Personal que ingresa a " + (g.destino || "")) });
    setVista("hoy");
  };

  /* ── el chat de WhatsApp del grupo ── */
  const leerChat = () => {
    if (!chat.trim()) return;
    const universo = verTodos ? activos : delGrupo(grupoAbierto);
    const lineas = chat.replace(/\r/g, "").split("\n").map(l => l.trim()).filter(Boolean);
    const nuevos = {}, sinMatch = [];
    lineas.forEach(l => {
      if (!REC_CONFIRMA.test(l)) return;
      const antes = l.split(/:\s/).slice(0, -1).join(": ") || l;
      const telMatch = antes.match(/\+?\d[\d\s\-()]{7,}/g);
      let p = null;
      if (telMatch && telMatch.length) {
        const dig = recTelNorm(telMatch[telMatch.length - 1]);
        if (dig.length >= 7) p = universo.find(x => recTelNorm(x.tel) === dig);
      }
      if (!p) {
        const limpia = l.replace(/^\W+/, "").replace(/\[[^\]]*\]/g, "").replace(/\+?\d[\d\s\-()]{6,}/g, "").replace(/[-–—:].*$/, "").trim();
        if (limpia) p = universo.find(x => recCoincide(recNomComp(x), limpia));
      }
      if (p) nuevos[p.id] = true; else sinMatch.push(l);
    });
    setMarcados(prev => ({ ...prev, ...nuevos }));
    setResultadoChat({ ok: Object.keys(nuevos).length, dudas: sinMatch });
  };

  const imprimirPlanilla = () => {
    if (!srv.chofer.trim()) return alert("Falta poner el chofer.");
    if (!srv.interno.trim()) return alert("Falta poner el interno.");
    if (!elegidos.length) return alert("No tildaste a nadie. Marcá quién viaja hoy.");
    const pasajeros = elegidos
      .slice()
      .sort((a, b) => String(a.hora).localeCompare(String(b.hora)))
      .map(p => ({ ...p, nombre: recNomComp(p), contacto: p.tel || "" }));
    /* el recorrido se calcula UNA vez acá y viaja con el servicio: es lo
       que va a ver el chofer en su teléfono, idéntico a lo que se imprime */
    const rec = recArmarRecorrido(pasajeros, paradas);
    const coords = {};
    padron.forEach(p => { if (p.lat && p.lng) coords[pgNorm(p.desde)] = { lat: Number(p.lat), lng: Number(p.lng) }; });
    const chofer = (conductores || []).find(c => pgNorm(c.nombre) === pgNorm(srv.chofer));
    const nuevo = { id: "rs_" + pgId(), ...srv, grupo: grupoActual ? grupoActual.nombre : "",
                    pasajeros, empresa_id: empresaActiva, creado: new Date().toISOString(),
                    dni_chofer: chofer ? String(chofer.dni || "") : "",
                    recorrido: recRecorridoParaLaApp(rec, grupoActual ? grupoActual.destino : "", coords),
                    __paradas: paradas,
                    estado: "programado" };
    setServicios(prev => [nuevo, ...prev.filter(s => !(s.fecha === srv.fecha && s.grupo === nuevo.grupo))]);
    recImprimir(nuevo, pasajeros);
  };

  const agregarProveedor = () => {
    const n = nuevoProv.trim();
    if (!n) return;
    if (!proveedores.some(x => pgNorm(x) === pgNorm(n))) setProveedores(prev => [...prev, n]);
    setNuevoProv("");
  };

  const importarPadron = (filas) => {
    const salida = padron.slice();
    const clave = (p) => pgNorm(recNomComp(p));
    const errores = [];
    let nuevos = 0, actualizados = 0;
    (filas || []).forEach((f, i) => {
      const nomGrupo = String(f.grupo || "").trim();
      let gid = "";
      if (nomGrupo) {
        const g = grupos.find(x => pgNorm(x.nombre) === pgNorm(nomGrupo));
        gid = g ? g.id : "";
        if (!g) errores.push(`Fila ${i + 2}: el grupo "${nomGrupo}" no existe todavía, el pasajero quedó sin grupo.`);
      }
      const fila = {
        nombre: String(f.nombre || "").trim(), apellido: String(f.apellido || "").trim(),
        tel: String(f.tel || "").trim(), desde: String(f.desde || "").trim(),
        hasta: String(f.hasta || "").trim(), hora: String(f.hora || "").trim(),
        trasbordo: String(f.trasbordo || "").trim(),
        lat: String(f.lat || "").trim(),
        lng: String(f.lng || "").trim(),
      };
      if (gid) fila.grupo = gid;
      if (!fila.apellido && !fila.nombre) { errores.push(`Fila ${i + 2}: sin apellido ni nombre.`); return; }
      const k = pgNorm(recNomComp(fila));
      const j = salida.findIndex(x => clave(x) === k);
      if (j >= 0) {
        const act = { ...salida[j] };
        Object.keys(fila).forEach(c => { if (fila[c]) act[c] = fila[c]; });
        salida[j] = act; actualizados++;
      } else {
        salida.push({ id: "px_" + pgId(), activo: true, grupo: "",
          hasta: fila.hasta || "", hora: fila.hora || "06:00", ...fila });
        nuevos++;
      }
    });
    if (!nuevos && !actualizados) return { agregados: 0, errores: errores.length ? errores : ["No se importó ninguna fila."] };
    setPadron(salida);
    setAvisoPadron(`Padrón actualizado: ${nuevos} pasajero(s) nuevo(s) y ${actualizados} actualizado(s).`);
    setTimeout(() => setAvisoPadron(""), 8000);
    return { agregados: nuevos + actualizados, errores: errores };
  };

  const nuevoGrupo = () => {
    const id = "gr_" + pgId();
    setGrupos(prev => [...prev, { id, nombre: "Grupo nuevo", destino: "", hora: "06:00", unidad: "", chofer: "", nota: "", activo: true }]);
    setVista("grupos");
  };

  const borrarGrupo = (g) => {
    const n = activos.filter(p => String(p.grupo) === String(g.id)).length;
    const msg = n ? `El grupo "${g.nombre}" tiene ${n} pasajero(s). Si lo borrás, esa gente queda SIN grupo (no se borra del padrón). ¿Seguís?`
                  : `¿Borrar el grupo "${g.nombre}"?`;
    if (!confirm(msg)) return;
    setPadron(prev => prev.map(p => String(p.grupo) === String(g.id) ? { ...p, grupo: "" } : p));
    setGrupos(prev => prev.filter(x => x.id !== g.id));
  };

  const sinGrupo = activos.filter(p => !p.grupo).length;
  const padronFiltrado = padron.filter(p => {
    if (!filtroPadron.trim()) return true;
    const q = pgNorm(filtroPadron);
    return pgNorm(recNomComp(p)).includes(q) || pgNorm(p.desde || "").includes(q) ||
           pgNorm(recNombreGrupo(grupos, p.grupo)).includes(q) || String(p.tel || "").includes(filtroPadron.trim());
  });

  /* ══════════════════════════════════════════════════════════════════════ */
  return (
    <div>
      <SectionHeader title="Recorridos de personal"
        sub="un grupo por cada grupo de WhatsApp: se elige el grupo, se tilda quién confirmó y sale la planilla" />

      <div style={{ display: "flex", gap: 4, background: "#fff", border: "1px solid #E5E7EB", borderRadius: 10, padding: 4, marginBottom: 20, flexWrap: "wrap" }}>
        {[["grupos", "1 · Grupos"], ["paradas", "2 · Paradas"], ["padron", "3 · Pasajeros"], ["hoy", "4 · Armar la planilla de hoy"], ["historial", "Planillas anteriores"]].map(([id, lab]) => (
          <button key={id} onClick={() => setVista(id)}
            style={{ padding: "7px 14px", borderRadius: 7, border: "none", cursor: "pointer", fontSize: 12.5,
              background: vista === id ? "var(--c-primario)" : "transparent", color: vista === id ? "#fff" : "#6B7280", fontWeight: vista === id ? 700 : 600 }}>
            {lab}
          </button>
        ))}
      </div>

      {/* ═══════════════ 1 · GRUPOS ═══════════════ */}
      {vista === "grupos" && (
        <React.Fragment>
          <div style={{ background: "#EFF6FF", border: "1px solid #BFDBFE", borderRadius: 10, padding: "12px 16px", marginBottom: 16, fontSize: 13.5, color: "#1E3A8A", lineHeight: 1.55 }}>
            <b>¿Qué es un grupo?</b> Es cada uno de los grupos de WhatsApp de la operación —
            "Planta Tratayen Cipolleti Dia", "Rio Neuquén - Diurno", "Turno Río Neuquén - Camioneta".
            Cada grupo tiene su gente, su horario y su destino. <b>Tocá una tarjeta para armar la planilla de ese grupo.</b>
          </div>

          {sinGrupo > 0 && (
            <div style={{ background: "#FEF9C3", border: "1px solid #FDE68A", borderRadius: 10, padding: "10px 16px", marginBottom: 16, fontSize: 13, color: "#854D0E", fontWeight: 600 }}>
              Hay {sinGrupo} pasajero(s) sin grupo asignado. Andá a <b>2 · Pasajeros</b> y elegiles el grupo en la columna «Grupo».
            </div>
          )}

          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill,minmax(310px,1fr))", gap: 14, marginBottom: 18 }}>
            {gruposActivos.map(g => {
              const gente = delGrupo(g.id);
              return (
                <div key={g.id} style={{ background: "#fff", border: "1px solid #E5E7EB", borderRadius: 14, padding: 16, display: "flex", flexDirection: "column", gap: 10 }}>
                  <div style={{ display: "flex", alignItems: "flex-start", gap: 10 }}>
                    <div style={{ width: 40, height: 40, borderRadius: 11, background: "color-mix(in srgb, var(--c-primario) 10%, transparent)", color: "var(--c-primario)", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 19, flex: "0 0 auto" }}>🚐</div>
                    <div style={{ flex: 1, minWidth: 0 }}>
                      <div style={{ fontSize: 15, fontWeight: 800, color: "#111827", lineHeight: 1.25 }}>{g.nombre}</div>
                      <div style={{ fontSize: 12.5, color: "#6B7280", fontWeight: 600, marginTop: 2 }}>
                        {g.destino || "sin destino"}{g.hora ? " · sale " + g.hora : ""}
                      </div>
                    </div>
                  </div>
                  <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
                    <span style={{ padding: "3px 10px", borderRadius: 99, background: gente.length ? "#DCFCE7" : "#F3F4F6", color: gente.length ? "#166534" : "#9CA3AF", fontSize: 12, fontWeight: 700 }}>
                      {gente.length} pasajero{gente.length === 1 ? "" : "s"}
                    </span>
                    <span style={{ padding: "3px 10px", borderRadius: 99, background: paradasDe(g.id).length ? "#E0E7FF" : "#FEF9C3", color: paradasDe(g.id).length ? "#3730A3" : "#854D0E", fontSize: 12, fontWeight: 700 }}>
                      {paradasDe(g.id).length} parada{paradasDe(g.id).length === 1 ? "" : "s"}
                    </span>
                    {g.unidad ? <span style={{ padding: "3px 10px", borderRadius: 99, background: "#E0E7FF", color: "#3730A3", fontSize: 12, fontWeight: 700 }}>Interno {g.unidad}</span> : null}
                  </div>
                  <div style={{ marginTop: "auto", display: "grid", gridTemplateColumns: "1fr auto", gap: 8 }}>
                    <button onClick={() => abrirGrupo(g)}
                      style={{ padding: "11px 14px", borderRadius: 9, border: "none", background: "var(--c-primario)", color: "#fff", fontSize: 13.5, fontWeight: 700, cursor: "pointer" }}>
                      Armar la planilla de hoy →
                    </button>
                    <button onClick={() => { setGrupoParadas(g.id); setVista("paradas"); }}
                      title="Las esquinas donde para la unidad"
                      style={{ padding: "11px 13px", borderRadius: 9, border: "1.5px solid var(--c-primario)", background: "#fff", color: "var(--c-primario)", fontSize: 13, fontWeight: 700, cursor: "pointer", whiteSpace: "nowrap" }}>
                      📍 {paradasDe(g.id).length}
                    </button>
                  </div>
                </div>
              );
            })}
            <button onClick={nuevoGrupo}
              style={{ background: "#fff", border: "2px dashed #CBD5E1", borderRadius: 14, padding: 16, cursor: "pointer", color: "#64748B", fontSize: 14, fontWeight: 700, minHeight: 150 }}>
              + Crear un grupo nuevo
            </button>
          </div>

          <Card>
            <div style={{ padding: "16px 20px", borderBottom: "1px solid #F1F5F9" }}>
              <h3 style={{ margin: 0, fontSize: 15, fontWeight: 700, color: "var(--c-primario)" }}>Editar los grupos</h3>
              <span style={{ fontSize: 12, color: "#9CA3AF" }}>el nombre conviene que sea igual al del grupo de WhatsApp, así no se confunde nadie</span>
            </div>
            <Table headers={["Nombre del grupo", "Destino", "Sale", "Interno habitual", "Chofer habitual", "Activo", ""]}>
              {grupos.map(g => (
                <TR key={g.id}>
                  <TD><Input value={g.nombre} onChange={e => setG(g.id, "nombre", e.target.value)} style={{ padding: "5px 8px", fontSize: 12, minWidth: 210, fontWeight: 600 }} /></TD>
                  <TD><Input value={g.destino || ""} placeholder="Planta Tratayen" onChange={e => setG(g.id, "destino", e.target.value)} style={{ padding: "5px 8px", fontSize: 12, minWidth: 170 }} /></TD>
                  <TD><Input type="time" value={g.hora || ""} onChange={e => setG(g.id, "hora", e.target.value)} style={{ padding: "5px 8px", fontSize: 12, width: 90 }} /></TD>
                  <TD><Input value={g.unidad || ""} placeholder="14502" onChange={e => setG(g.id, "unidad", e.target.value)} style={{ padding: "5px 8px", fontSize: 12, width: 95 }} /></TD>
                  <TD><Input list="rec-choferes" value={g.chofer || ""} onChange={e => setG(g.id, "chofer", e.target.value)} style={{ padding: "5px 8px", fontSize: 12, minWidth: 150 }} /></TD>
                  <TD><input type="checkbox" checked={g.activo !== false} onChange={e => setG(g.id, "activo", e.target.checked)} style={{ width: 15, height: 15, cursor: "pointer" }} /></TD>
                  <TD><button onClick={() => borrarGrupo(g)} style={{ background: "none", border: "none", cursor: "pointer", color: "#DC2626", fontSize: 12, fontWeight: 600 }}>Borrar</button></TD>
                </TR>
              ))}
            </Table>
            <datalist id="rec-choferes">{(conductores || []).map(c => <option key={c.id} value={c.nombre} />)}</datalist>
          </Card>
        </React.Fragment>
      )}

      {/* ═══════════════ 2 · PARADAS DEL GRUPO ═══════════════ */}
      {vista === "paradas" && (
        <React.Fragment>
          <div style={{ background: "#EFF6FF", border: "1px solid #BFDBFE", borderRadius: 10, padding: "12px 16px", marginBottom: 16, fontSize: 13.5, color: "#1E3A8A", lineHeight: 1.55 }}>
            <b>¿Qué es una parada?</b> Es la esquina donde para la unidad — "Parada A · Mte Negro y Circunvalación" —
            y hasta ahí camina la gente. <b>No es el domicilio de cada pasajero.</b> Las paradas las armás vos una vez
            por grupo; lo que cambia cada día es quiénes suben en cada una.
          </div>

          <div style={{ display: "flex", gap: 8, marginBottom: 16, flexWrap: "wrap", alignItems: "center" }}>
            <span style={{ fontSize: 13, fontWeight: 700, color: "#374151" }}>Grupo:</span>
            {grupos.filter(g => g.activo !== false).map(g => (
              <button key={g.id} onClick={() => setGrupoParadas(g.id)}
                style={{ padding: "7px 14px", borderRadius: 8, cursor: "pointer", fontSize: 12.5, fontWeight: 700,
                  border: "1.5px solid " + (grupoParadas === g.id ? "var(--c-primario)" : "#E5E7EB"),
                  background: grupoParadas === g.id ? "var(--c-primario)" : "#fff",
                  color: grupoParadas === g.id ? "#fff" : "#6B7280" }}>
                {g.nombre} ({paradasDe(g.id).length})
              </button>
            ))}
          </div>

          {!grupoParadas ? (
            <Card><div style={{ padding: "26px 20px", textAlign: "center", fontSize: 13.5, color: "#6B7280" }}>
              Elegí un grupo arriba para ver y editar sus paradas.
            </div></Card>
          ) : (
            <Card>
              <div style={{ padding: "16px 20px", borderBottom: "1px solid #F1F5F9", display: "flex", alignItems: "center", gap: 12, flexWrap: "wrap" }}>
                <div style={{ flex: 1, minWidth: 220 }}>
                  <h3 style={{ margin: 0, fontSize: 15, fontWeight: 700, color: "var(--c-primario)" }}>
                    Paradas de {recNombreGrupo(grupos, grupoParadas)}
                  </h3>
                  <span style={{ fontSize: 12, color: "#9CA3AF" }}>en orden de recorrido · la letra y la hora son las que ve el personal en el comunicado</span>
                </div>
                <button onClick={() => asignarPorCercania(grupoParadas)}
                  title="Le pone a cada pasajero la parada de este grupo que le queda más cerca del domicilio"
                  style={{ padding: "7px 14px", borderRadius: 8, border: "1.5px solid #16A34A", background: "#fff", color: "#16A34A", fontSize: 12.5, fontWeight: 700, cursor: "pointer" }}>
                  ⚡ Asignar pasajeros por cercanía
                </button>
                <button onClick={() => agregarParada(grupoParadas)}
