            { campo: "total", etiqueta: "Total", tipo: "numero", alias: ["importe"] },
            { campo: "km_carga", etiqueta: "KM de carga", tipo: "numero", alias: ["km", "odometro", "kilometraje"] },
            { campo: "tipo", etiqueta: "Combustible", tipo: "opcion", opciones: ["Gasoil", "Nafta", "GNC"], porDefecto: "Gasoil" },
          ]} />
          <ImportarMasivo nombre="YPF" textoBoton="Carga masiva YPF" onImportar={importar} validar={validarImport}
          ejemplo={{ "IDENTIFICACION TARJETA": "AF994DY", FECHA: "30/07/2026 11:08:41", "LITROS UNIDADES": "52.43", "PRECIO YER": "2189.3", "IMP TOT YER": "114784.99", ODOMETRO: "54642", PRODUCTO: "D.DIESEL 500" }}
          columnas={[
            { campo: "patente", etiqueta: "Patente", tipo: "texto", requerido: true, alias: ["identificacion tarjeta", "dominio", "interno"] },
            { campo: "fecha", etiqueta: "Fecha", tipo: "fecha", alias: ["fecha"] },
            { campo: "litros", etiqueta: "Litros", tipo: "numero", alias: ["litros unidades", "lts", "cantidad"] },
            { campo: "precio_litro", etiqueta: "Precio por litro", tipo: "numero", alias: ["precio yer", "precio pvp establecimiento", "precio"] },
            { campo: "total", etiqueta: "Total", tipo: "numero", alias: ["imp tot yer", "imp tot pvp establecimiento", "importe"] },
            { campo: "km_carga", etiqueta: "KM de carga", tipo: "numero", alias: ["odometro", "km", "kilometraje"] },
            { campo: "tipo", etiqueta: "Combustible", tipo: "opcion", opciones: ["Gasoil", "Nafta", "GNC"], porDefecto: "Gasoil", alias: ["producto"], transform: productoYPF },
          ]} />
        </div>} />
      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(180px, 1fr))", gap: 16, marginBottom: 20 }}>
        <KpiCard label="Total litros" value={totalLitros.toLocaleString("es-AR") + " L"} icon="fuel" color="var(--c-acento)" />
        <KpiCard label="Gasto total" value={fmt(totalPesos)} icon="dollar" color="var(--c-primario)" />
        <KpiCard label="Precio promedio" value={totalLitros > 0 ? "$" + Math.round(totalPesos / totalLitros).toLocaleString("es-AR") + "/L" : "—"} icon="chart" color="#8B5CF6" />
      </div>
      <Card>
        <Table headers={["Vehículo", "Fecha", "Tipo", "Litros", "Precio/L", "Total", "KM", "Acciones"]}>
          {combustible.map(c => {
            const v = vehiculos.find(x => mismoId(x.id, c.vehiculo_id));
            return (
              <TR key={c.id}>
                <TD bold>{v?.patente || "—"}</TD>
                <TD>{fmtFecha(c.fecha)}</TD>
                <TD>{c.tipo}</TD>

              <Select value={form.tipo} onChange={e => setForm(p => ({ ...p, tipo: e.target.value }))}>

              )}
              {!lecturaBaja && saltoRaro && (
                <div style={{ marginTop: 8, fontSize: 12, fontWeight: 600, color: "#B45309", lineHeight: 1.5 }}>

                </div>
              )}
              {lecturaNueva === 0 && (
                <div style={{ marginTop: 8, fontSize: 11, color: "#9CA3AF", lineHeight: 1.5 }}>

  const totalAprobado = gastos.filter(g => g.estado === "aprobado").reduce((s, g) => s + (Number(g.monto) || 0), 0);
  const totalPendiente = gastos.filter(g => g.estado === "pendiente").reduce((s, g) => s + (Number(g.monto) || 0), 0);

  useEffect(() => {
    if (modal) {
      setForm({ vehiculo_id: vehiculos[0]?.id ?? "", conductor_id: conductores[0]?.id ?? "", categoria: "Peaje", descripcion: "", monto: 0, fecha: "", estado: "pendiente", empresa_id: empresaActiva });
    }
  }, [modal, vehiculos, conductores, empresaActiva]);

  const guardar = () => {
    if (!form.vehiculo_id || !vehiculos.some(v => mismoId(v.id, form.vehiculo_id))) {
      alert("Elegí un vehículo antes de registrar el gasto.");
      return;
    }
    setGastos(prev => [...prev, { ...form, id: Date.now(), empresa_id: empresaActiva, vehiculo_id: form.vehiculo_id, conductor_id: form.conductor_id || null, monto: +form.monto || 0 }]);
    setModal(false);
  };

  const porPatente = (pat) => vehiculos.find(v => (v.patente || "").toUpperCase().replace(/\s/g, "") === String(pat || "").toUpperCase().replace(/\s/g, "") || String(v.vehiculo || "") === String(pat || "").trim());
  const importar = (filas) => {
    const errores = []; const nuevos = [];
    const base = Date.now();
    filas.forEach((f, i) => {
      const veh = porPatente(f.patente);
      if (!veh) { errores.push(`Fila ${i + 2}: la patente "${f.patente}" no existe en esta empresa.`); return; }
      const cond = conductores.find(c => (c.dni || "") === f.conductor || (c.nombre || "").toLowerCase() === String(f.conductor || "").toLowerCase());
      nuevos.push({ ...f, id: base + i + 1, empresa_id: empresaActiva, vehiculo_id: veh.id, conductor_id: cond ? cond.id : null, monto: +f.monto || 0 });
    });
    if (!nuevos.length) return { agregados: 0, errores: errores.length ? errores : ["No hay filas válidas."] };
    setGastos(prev => [...prev, ...nuevos]);
    return { agregados: nuevos.length, errores };

  const aprobar = (id) => setGastos(prev => prev.map(g => mismoId(g.id, id) ? { ...g, estado: "aprobado" } : g));

          ejemplo={{ patente: "AC123DE", categoria: "Peaje", descripcion: "Autopista Paraná - Santa Fe", monto: "8500,00", fecha: "20/06/2026", conductor: "28451234", estado: "pendiente" }}
          columnas={[
            { campo: "patente", etiqueta: "Patente", tipo: "texto", requerido: true, alias: ["dominio", "interno"] },
            { campo: "categoria", etiqueta: "Categoría", tipo: "opcion", opciones: ["Peaje", "Lavado", "Multa", "Parking", "Reparación menor", "Seguro", "Patente", "Otro"], porDefecto: "Otro" },
            { campo: "descripcion", etiqueta: "Descripción", tipo: "texto", alias: ["detalle", "concepto"] },
            { campo: "monto", etiqueta: "Monto", tipo: "numero", alias: ["importe", "total"] },
            { campo: "fecha", etiqueta: "Fecha", tipo: "fecha" },
            { campo: "conductor", etiqueta: "Conductor (DNI o nombre)", tipo: "texto", alias: ["conductor", "dni", "chofer"] },
            { campo: "estado", etiqueta: "Estado", tipo: "opcion", opciones: ["pendiente", "aprobado"], porDefecto: "pendiente" },
          ]} />} />
      <Card>
        <Table headers={["Categoría", "Descripción", "Vehículo", "Conductor", "Fecha", "Monto", "Estado", "Acciones"]}>
          {gastos.map(g => {
            const v = vehiculos.find(x => mismoId(x.id, g.vehiculo_id));
            const c = conductores.find(x => mismoId(x.id, g.conductor_id));
            return (
              <TR key={g.id}>
                <TD><span style={{ padding: "2px 8px", background: "#F1F5F9", color: "#374151", borderRadius: 6, fontSize: 12, fontWeight: 600 }}>{g.categoria}</span></TD>

                <TD>{v?.patente || "—"}</TD>
                <TD>{c?.nombre || "—"}</TD>
                <TD>{fmtFecha(g.fecha)}</TD>

            </Field>
            <Field label="Fecha"><Input type="date" value={toDateInput(form.fecha)} onChange={e => setForm(p => ({ ...p, fecha: e.target.value }))} /></Field>
            <Field label="Vehículo">

};

// ─── PANEL GERENCIAL (visión ejecutiva en tiempo real) ────────────────────────
// Pensado para el directorio: costos, consumos y oportunidades de mejora
// detectadas automáticamente, con estimación de ahorro en pesos.

const fmtCorto = (n) => {
  n = Number(n) || 0;
  if (Math.abs(n) >= 1e6) return "$" + (n / 1e6).toLocaleString("es-AR", { maximumFractionDigits: 1 }) + " M";
  if (Math.abs(n) >= 1e3) return "$" + Math.round(n / 1e3).toLocaleString("es-AR") + " mil";
  return fmt(n);
};

// Tarjeta KPI ejecutiva con variación vs mes anterior
const KpiGerencial = ({ label, value, delta, deltaInvertida, sub, tinte, icono }) => {
  // delta > 0 = subió. Para costos, subir es malo (rojo); deltaInvertida=true para métricas donde subir es bueno.
  const tieneDelta = delta != null && isFinite(delta);
  const esBueno = tieneDelta ? (deltaInvertida ? delta >= 0 : delta <= 0) : null;
  return (
    <div style={{ background: tinte, borderRadius: 14, padding: "18px 20px", border: "1px solid rgba(0,0,0,0.05)" }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
        <div style={{ fontSize: 11, color: "#64748B", fontWeight: 700, textTransform: "uppercase", letterSpacing: "0.6px" }}>{label}</div>
        <Icon name={icono} size={17} color="#94A3B8" />
      </div>
      <div style={{ fontSize: 27, fontWeight: 800, color: "#0F172A", lineHeight: 1.15, margin: "8px 0 4px" }}>{value}</div>
      <div style={{ display: "flex", alignItems: "center", gap: 8, minHeight: 18 }}>
        {tieneDelta && (
          <span style={{ display: "inline-flex", alignItems: "center", gap: 3, padding: "2px 8px", borderRadius: 99, fontSize: 11, fontWeight: 700, background: esBueno ? "#DCFCE7" : "#FEE2E2", color: esBueno ? "#15803D" : "#B91C1C" }}>
            {delta > 0 ? "▲" : delta < 0 ? "▼" : "="} {Math.abs(delta).toFixed(1)}%
          </span>
        )}
        <span style={{ fontSize: 11, color: "#94A3B8" }}>{sub}</span>
      </div>
    </div>
  );
};

const PanelGerencial = ({ vehiculos, conductores, viajes, combustible, gastos, mantenimiento, partes, combustibleTodo, desde, hasta, periodoLabel }) => {
  const mesDe = (f) => toDateInput(f).slice(0, 7);
  const ahora = new Date();
  const P = partes || [];
  const histo = combustibleTodo || combustible;

  // Últimos 6 meses calendario. Este gráfico mira siempre los 6 meses, sin
  // importar el período elegido arriba: es la foto de tendencia del directorio.
  const meses = [];
  for (let i = 5; i >= 0; i--) {
    const d = new Date(ahora.getFullYear(), ahora.getMonth() - i, 1);
    const fin = new Date(d.getFullYear(), d.getMonth() + 1, 0);
    meses.push({
      key: `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`,
      label: d.toLocaleDateString("es-AR", { month: "short" }).replace(".", ""),
      desde: _isoFecha(d), hasta: _isoFecha(fin),
    });
  }
  const porMes = meses.map(m => {
    const comb = combustible.filter(c => mesDe(c.fecha) === m.key).reduce((s, c) => s + (Number(c.total) || 0), 0);
    const mant = mantenimiento.filter(x => mesDe(x.fecha) === m.key).reduce((s, x) => s + (Number(x.costo) || 0), 0);
    const otros = gastos.filter(g => mesDe(g.fecha) === m.key).reduce((s, g) => s + (Number(g.monto) || 0), 0);
    // Km del mes por odómetro. Al ser una resta de lecturas, la suma de los
    // meses da exactamente el histórico: ningún kilómetro se cuenta dos veces.
    const kmMes = kmFlotaRango(vehiculos, histo, m.desde, m.hasta);
    const hsMes = P.filter(p => mesDe(p.fecha) === m.key).reduce((s, p) => s + (Number(p.horas) || 0), 0);
    const litrosMes = combustible.filter(c => mesDe(c.fecha) === m.key).reduce((s, c) => s + (Number(c.litros) || 0), 0);
    return { ...m, comb, mant, otros, total: comb + mant + otros, kmMes, hsMes, litrosMes };
  });
  const mesAct = porMes[5], mesAnt = porMes[4];
  const varPct = (a, b) => (b > 0 ? ((a - b) / b) * 100 : null);
  const maxMes = Math.max(1, ...porMes.map(m => m.total));

  // ── Métricas por unidad, dentro del período elegido arriba ───────────────
  // Los km salen del odómetro (resta de lecturas contra el historial completo);
  // los pesos y los litros son sumas de lo que cae adentro del período.
  const enPer = (f) => {
    if (!desde && !hasta) return true;
    const d = toDateInput(f);
    if (!d) return true;
    return (!desde || d >= desde) && (!hasta || d <= hasta);
  };
  const combPer = combustible.filter(c => enPer(c.fecha));
  const mantPer = mantenimiento.filter(m => enPer(m.fecha));
  const gastosPer = gastos.filter(g => enPer(g.fecha));
  const partesPer = P.filter(p => enPer(p.fecha));

  const unidades = vehiculos.map(v => {
    const cargas = combPer.filter(c => mismoId(c.vehiculo_id, v.id));
    const litros = cargas.reduce((s, c) => s + (Number(c.litros) || 0), 0);
    const combPesos = cargas.reduce((s, c) => s + (Number(c.total) || 0), 0);
    const km = kmUnidadRango(v, histo, desde, hasta);
    const hs = partesPer.filter(p => mismoId(p.vehiculo_id, v.id)).reduce((s, p) => s + (Number(p.horas) || 0), 0);
    const mantPesos = mantPer.filter(x => mismoId(x.vehiculo_id, v.id)).reduce((s, x) => s + (Number(x.costo) || 0), 0);
    const otrosPesos = gastosPer.filter(g => mismoId(g.vehiculo_id, v.id)).reduce((s, g) => s + (Number(g.monto) || 0), 0);
    const total = combPesos + mantPesos + otrosPesos;
    const l100 = litrosPor100(litros, km);
    const ref = consumoRefDe(v);
    return {
      v, litros, combPesos, mantPesos, otrosPesos, total, km, hs, l100, ref,
      precioLitro: litros > 0 ? combPesos / litros : 0,
      cpk: km > 0 ? total / km : 0,
      rend: litros > 0 && km > 0 ? km / litros : 0, // km por litro
    };
  });

  const conCpk = unidades.filter(u => u.cpk > 0);
  const promCpk = conCpk.length ? conCpk.reduce((s, u) => s + u.cpk, 0) / conCpk.length : 0;
  const conRend = unidades.filter(u => u.rend > 0);
  // Rendimiento de flota PONDERADO: total de km sobre total de litros (no promedio simple)
  const kmRendTot = conRend.reduce((s, u) => s + u.km, 0);
  const litrosRendTot = conRend.reduce((s, u) => s + u.litros, 0);
  const promRend = litrosRendTot > 0 ? kmRendTot / litrosRendTot : 0;
  const maxCpk = Math.max(1, ...conCpk.map(u => u.cpk));

  // ── Detección automática de oportunidades ────────────────────────────────
  const oportunidades = [];
  conCpk.forEach(u => {
    if (promCpk > 0 && u.cpk > promCpk * 1.25 && conCpk.length > 1) {
      const ahorro = (u.cpk - promCpk) * u.km;
      oportunidades.push({ nivel: "alto", titulo: `${u.v.patente} tiene un costo por km ${Math.round((u.cpk / promCpk - 1) * 100)}% arriba del promedio de la flota`, detalle: `$${Math.round(u.cpk).toLocaleString("es-AR")}/km contra $${Math.round(promCpk).toLocaleString("es-AR")}/km promedio. Revisar estado mecánico, asignación de servicios y consumo.`, impacto: ahorro });
    }
  });
  conRend.forEach(u => {
    if (promRend > 0 && u.rend < promRend * 0.8 && conRend.length > 1) {
      const litrosExtra = (u.km / u.rend) - (u.km / promRend);
      const precioProm = u.litros > 0 ? u.combPesos / u.litros : 0;
      oportunidades.push({ nivel: "alto", titulo: `${u.v.patente} rinde ${u.rend.toFixed(1)} km/L, un ${Math.round((1 - u.rend / promRend) * 100)}% menos que la flota`, detalle: `Puede indicar problema de motor, filtros, presión de neumáticos o modo de conducción. Promedio de flota: ${promRend.toFixed(1)} km/L.`, impacto: litrosExtra > 0 ? litrosExtra * precioProm : 0 });
    }
  });
  // Consumo real contra la referencia cargada en la ficha de cada unidad.
  // Más de un 20 % arriba es plata que se está yendo por el caño de escape.
  unidades.forEach(u => {
    if (u.ref > 0 && u.l100 > 0 && u.l100 > u.ref * 1.20) {
      const litrosEsperados = (u.km * u.ref) / 100;
      const litrosDeMas = Math.max(0, u.litros - litrosEsperados);
      const pesos = litrosDeMas * (u.precioLitro || 0);
      oportunidades.push({
        nivel: "alto",
        titulo: `${u.v.patente} consume ${u.l100.toFixed(1)} L/100km contra una referencia de ${u.ref}`,
        detalle: `Un ${Math.round((u.l100 / u.ref - 1) * 100)} % por encima de lo que debería consumir esta unidad. Son ${Math.round(litrosDeMas).toLocaleString("es-AR")} litros de más en el período. Revisar inyección, filtros, presión de neumáticos y forma de manejo.`,
        impacto: pesos,
      });
    }
  });
  // Partes sin firma del supervisor: es control interno, no un costo
  const sinFirma = partesPer.filter(p => p.firmado !== "si");
  if (sinFirma.length) oportunidades.push({ nivel: "medio", titulo: `${sinFirma.length} parte(s) de servicio sin firma del supervisor`, detalle: "El parte sin firmar no sirve como respaldo ante el cliente ni ante una discusión de horas trabajadas.", impacto: 0 });
  const pendientes = gastosPer.filter(g => g.estado === "pendiente");
  const montoPend = pendientes.reduce((s, g) => s + (Number(g.monto) || 0), 0);
  if (pendientes.length > 0) {
    oportunidades.push({ nivel: "medio", titulo: `${pendientes.length} gasto(s) sin aprobar por ${fmt(montoPend)}`, detalle: "Costos que todavía no están validados por administración: el total real del período puede ser mayor al informado.", impacto: 0 });
  }
  const vtvVencidas = vehiculos.filter(v => (v.vencimientoVTV && daysUntil(v.vencimientoVTV) < 0) || (v.vencimientoVTV2 && daysUntil(v.vencimientoVTV2) < 0));
  const vtvPorVencer = vehiculos.filter(v => (v.vencimientoVTV && daysUntil(v.vencimientoVTV) >= 0 && daysUntil(v.vencimientoVTV) <= 30) || (v.vencimientoVTV2 && daysUntil(v.vencimientoVTV2) >= 0 && daysUntil(v.vencimientoVTV2) <= 30));
  if (vtvVencidas.length) oportunidades.push({ nivel: "alto", titulo: `${vtvVencidas.length} unidad(es) con VTV vencida: ${vtvVencidas.map(v => v.patente).join(", ")}`, detalle: "Riesgo de multas e inmovilización. Unidades fuera de norma no deberían prestar servicio.", impacto: 0 });
  if (vtvPorVencer.length) oportunidades.push({ nivel: "medio", titulo: `${vtvPorVencer.length} VTV vence(n) en los próximos 30 días`, detalle: vtvPorVencer.map(v => `${v.patente} (${fmtFecha(v.vencimientoVTV)})`).join(" · "), impacto: 0 });
  const licProx = conductores.filter(c => c.vencLicencia && daysUntil(c.vencLicencia) <= 60);
  if (licProx.length) oportunidades.push({ nivel: "medio", titulo: `${licProx.length} licencia(s) de conducir por vencer en 60 días`, detalle: licProx.map(c => c.nombre).join(" · "), impacto: 0 });
  const sinDatos = vehiculos.filter(v => esActivo(v.estado)).filter(v => !unidades.find(u => mismoId(u.v.id, v.id) && (u.km > 0 || u.total > 0)));
  if (sinDatos.length) oportunidades.push({ nivel: "bajo", titulo: `${sinDatos.length} unidad(es) activas sin datos de costos ni km`, detalle: `${sinDatos.map(v => v.patente).join(", ")}. Sin carga de datos no se puede medir su rentabilidad.`, impacto: 0 });
  const enMant = vehiculos.filter(v => String(v.estado).toLowerCase() === "mantenimiento");
  if (enMant.length) oportunidades.push({ nivel: "bajo", titulo: `${enMant.length} unidad(es) detenidas en mantenimiento`, detalle: `${enMant.map(v => v.patente).join(", ")}. Flota disponible: ${vehiculos.length - enMant.length} de ${vehiculos.length}.`, impacto: 0 });

  const orden = { alto: 0, medio: 1, bajo: 2 };
  oportunidades.sort((a, b) => orden[a.nivel] - orden[b.nivel] || b.impacto - a.impacto);
  const ahorroPotencial = oportunidades.reduce((s, o) => s + (o.impacto || 0), 0);

  const nivelCfg = {
    alto: { color: "#B91C1C", fondo: "#FEF2F2", borde: "#FECACA", etiqueta: "Prioridad alta" },
    medio: { color: "#B45309", fondo: "#FFFBEB", borde: "#FDE68A", etiqueta: "Prioridad media" },
    bajo: { color: "#0369A1", fondo: "#F0F9FF", borde: "#BAE6FD", etiqueta: "Para revisar" },
  };

  const disponibilidad = vehiculos.length ? Math.round(vehiculos.filter(v => esActivo(v.estado)).length / vehiculos.length * 100) : 0;
  const cpkMes = mesAct.kmMes > 0 ? mesAct.total / mesAct.kmMes : 0;
  const cpkMesAnt = mesAnt.kmMes > 0 ? mesAnt.total / mesAnt.kmMes : 0;
  const rendMes = mesAct.litrosMes > 0 && mesAct.kmMes > 0 ? mesAct.kmMes / mesAct.litrosMes : 0;

  const rankingCpk = [...conCpk].sort((a, b) => b.cpk - a.cpk);

  return (
    <div>
      <SectionHeader title="Panel Gerencial" sub={`Visión ejecutiva de costos, consumos y oportunidades · ${periodoLabel || "período actual"} — datos en tiempo real desde la operación`} />

      {/* KPIs del mes con variación */}
      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(215px, 1fr))", gap: 14, marginBottom: 22 }}>
        <KpiGerencial label="Costo total del mes" value={fmt(mesAct.total)} delta={varPct(mesAct.total, mesAnt.total)} sub="vs mes anterior" tinte="#F0F7FF" icono="dollar" />
        <KpiGerencial label="Costo por km (mes)" value={cpkMes > 0 ? "$" + Math.round(cpkMes).toLocaleString("es-AR") + "/km" : "—"} delta={cpkMes > 0 && cpkMesAnt > 0 ? varPct(cpkMes, cpkMesAnt) : null} sub={cpkMes > 0 ? "vs mes anterior" : "faltan km del mes"} tinte="#FFF9EF" icono="trend" />
        <KpiGerencial label="Consumo del mes" value={mesAct.kmMes > 0 && mesAct.litrosMes > 0 ? litrosPor100(mesAct.litrosMes, mesAct.kmMes).toFixed(1) + " L/100km" : "—"} sub={rendMes > 0 ? `${mesAct.litrosMes.toLocaleString("es-AR")} L · ${rendMes.toFixed(1)} km/L` : "faltan datos del mes"} tinte="#F2FBF5" icono="fuel" />
        <KpiGerencial label="Horas trabajadas (mes)" value={mesAct.hsMes > 0 ? Math.round(mesAct.hsMes).toLocaleString("es-AR") + " h" : "—"} delta={mesAct.hsMes > 0 && mesAnt.hsMes > 0 ? varPct(mesAct.hsMes, mesAnt.hsMes) : null} deltaInvertida sub="según partes de servicio" tinte="#F0FBFF" icono="reloj" />
        <KpiGerencial label="Disponibilidad de flota" value={disponibilidad + "%"} sub={`${vehiculos.filter(v => esActivo(v.estado)).length} de ${vehiculos.length} unidades operativas`} tinte="#F7F5FF" icono="truck" />
      </div>

      {/* Oportunidades de mejora — el corazón del panel */}
      <Card style={{ marginBottom: 22 }}>
        <div style={{ padding: "16px 20px", borderBottom: "1px solid #F1F5F9", display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 8 }}>
          <h3 style={{ margin: 0, fontSize: 15, fontWeight: 700, color: "var(--c-primario)", display: "flex", alignItems: "center", gap: 8 }}>
            <Icon name="target" size={17} color="var(--c-acento)" /> Oportunidades de mejora detectadas
          </h3>
          {ahorroPotencial > 0 && (
            <span style={{ padding: "5px 14px", borderRadius: 99, background: "#DCFCE7", color: "#15803D", fontSize: 12, fontWeight: 700 }}>
              Ahorro potencial estimado: {fmtCorto(ahorroPotencial)}
            </span>
          )}
        </div>
        <div style={{ padding: "14px 20px 18px", display: "grid", gap: 10 }}>
          {oportunidades.length === 0 && (
            <div style={{ padding: "22px 0", textAlign: "center", color: "#16A34A", fontSize: 13, fontWeight: 600 }}>✅ Sin desvíos detectados: la operación está dentro de los parámetros normales.</div>
          )}
          {oportunidades.map((o, i) => {
            const c = nivelCfg[o.nivel];
            return (
              <div key={i} style={{ background: c.fondo, border: `1px solid ${c.borde}`, borderRadius: 10, padding: "12px 16px", display: "flex", gap: 12, alignItems: "flex-start" }}>
                <span style={{ marginTop: 2, width: 8, height: 8, borderRadius: "50%", background: c.color, flexShrink: 0 }} />
                <div style={{ flex: 1 }}>
                  <div style={{ display: "flex", justifyContent: "space-between", gap: 10, flexWrap: "wrap" }}>
                    <div style={{ fontSize: 13, fontWeight: 700, color: "#111827" }}>{o.titulo}</div>
                    <div style={{ display: "flex", gap: 8, alignItems: "center", flexShrink: 0 }}>
                      {o.impacto > 0 && <span style={{ fontSize: 12, fontWeight: 800, color: "#15803D" }}>≈ {fmtCorto(o.impacto)}</span>}
                      <span style={{ fontSize: 10, fontWeight: 700, color: c.color, textTransform: "uppercase", letterSpacing: "0.5px" }}>{c.etiqueta}</span>
                    </div>
                  </div>
                  <div style={{ fontSize: 12, color: "#6B7280", marginTop: 3, lineHeight: 1.55 }}>{o.detalle}</div>
                </div>
              </div>
            );
          })}
        </div>
      </Card>

      <div style={{ display: "grid", gridTemplateColumns: "1.15fr 1fr", gap: 20, marginBottom: 22 }}>
        {/* Evolución mensual apilada */}
        <Card>
          <div style={{ padding: "16px 20px", borderBottom: "1px solid #F1F5F9", display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 8 }}>
            <h3 style={{ margin: 0, fontSize: 15, fontWeight: 700, color: "var(--c-primario)" }}>Evolución de costos · últimos 6 meses</h3>
            <div style={{ display: "flex", gap: 12, fontSize: 11, color: "#6B7280", fontWeight: 600 }}>
              <span><span style={{ display: "inline-block", width: 9, height: 9, borderRadius: 2, background: "var(--c-acento)", marginRight: 4 }} />Combustible</span>
              <span><span style={{ display: "inline-block", width: 9, height: 9, borderRadius: 2, background: "var(--c-primario)", marginRight: 4 }} />Mantenimiento</span>
              <span><span style={{ display: "inline-block", width: 9, height: 9, borderRadius: 2, background: "#A78BFA", marginRight: 4 }} />Gastos</span>
            </div>
          </div>
          <div style={{ padding: "22px 20px 16px" }}>
            <div style={{ display: "flex", alignItems: "flex-end", gap: 16, height: 210 }}>
              {porMes.map(m => (
                <div key={m.key} style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", gap: 6 }}>
                  <div style={{ fontSize: 10.5, fontWeight: 700, color: "#64748B", whiteSpace: "nowrap" }}>{m.total > 0 ? fmtCorto(m.total) : ""}</div>
                  <div style={{ width: "100%", maxWidth: 52, display: "flex", flexDirection: "column-reverse", height: 160, justifyContent: "flex-start" }} title={`Combustible ${fmt(m.comb)} · Mantenimiento ${fmt(m.mant)} · Gastos ${fmt(m.otros)}`}>
                    <div style={{ height: `${(m.comb / maxMes) * 100}%`, background: "var(--c-acento)", borderRadius: m.mant + m.otros > 0 ? 0 : "5px 5px 0 0", transition: "height 0.4s" }} />
                    <div style={{ height: `${(m.mant / maxMes) * 100}%`, background: "var(--c-primario)", transition: "height 0.4s" }} />
                    <div style={{ height: `${(m.otros / maxMes) * 100}%`, background: "#A78BFA", borderRadius: "5px 5px 0 0", transition: "height 0.4s" }} />
                  </div>
                  <div style={{ fontSize: 11, fontWeight: m.key === mesAct.key ? 800 : 600, color: m.key === mesAct.key ? "var(--c-primario)" : "#94A3B8", textTransform: "capitalize" }}>{m.label}</div>
                </div>
              ))}
            </div>
            {porMes.every(m => m.total === 0) && <div style={{ textAlign: "center", color: "#9CA3AF", fontSize: 12, marginTop: -110, marginBottom: 96 }}>Sin costos registrados en los últimos 6 meses.</div>}
          </div>
        </Card>

        {/* Ranking costo por km */}
        <Card>
          <div style={{ padding: "16px 20px", borderBottom: "1px solid #F1F5F9" }}>
            <h3 style={{ margin: 0, fontSize: 15, fontWeight: 700, color: "var(--c-primario)" }}>Costo por km por unidad</h3>
            <div style={{ fontSize: 11, color: "#9CA3AF", marginTop: 2 }}>{promCpk > 0 ? `Promedio de flota: $${Math.round(promCpk).toLocaleString("es-AR")}/km` : "Se calcula con costos y km cargados"}</div>
          </div>
          <div style={{ padding: "16px 20px" }}>
            {rankingCpk.length === 0 && <div style={{ padding: "20px 0", textAlign: "center", color: "#9CA3AF", fontSize: 13 }}>Todavía no hay unidades con costos y km suficientes.</div>}
            {rankingCpk.map(u => {
              const desviada = promCpk > 0 && u.cpk > promCpk * 1.25 && rankingCpk.length > 1;
              return (
                <div key={u.v.id} style={{ marginBottom: 13 }}>
                  <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 4 }}>
                    <span style={{ fontSize: 13, fontWeight: 600, color: "#374151" }}>{u.v.patente} <span style={{ color: "#9CA3AF", fontWeight: 400 }}>· {u.v.modelo}</span></span>
                    <span style={{ fontSize: 13, fontWeight: 800, color: desviada ? "#B91C1C" : "var(--c-primario)" }}>${Math.round(u.cpk).toLocaleString("es-AR")}/km</span>
                  </div>
                  <div style={{ height: 8, background: "#F1F5F9", borderRadius: 5, position: "relative" }}>
                    <div style={{ height: "100%", borderRadius: 5, background: desviada ? "#EF4444" : "var(--c-primario)", width: `${(u.cpk / maxCpk) * 100}%`, transition: "width 0.5s" }} />
                    {promCpk > 0 && <div title="Promedio de flota" style={{ position: "absolute", top: -2, bottom: -2, left: `${Math.min(99, (promCpk / maxCpk) * 100)}%`, width: 2, background: "#0F172A", opacity: 0.35, borderRadius: 2 }} />}
                  </div>
                  <div style={{ fontSize: 11, color: "#9CA3AF", marginTop: 2 }}>
                    {fmt(u.total)} totales · {fmtKm(u.km)}
                    {u.l100 > 0 && <> · <span style={{ color: consumoColor(u.l100, u.ref), fontWeight: 700 }}>{u.l100.toFixed(1)} L/100km</span>{u.ref > 0 ? ` (ref. ${u.ref})` : ""}</>}
                  </div>
                </div>
              );
            })}
          </div>
        </Card>
      </div>

      {/* Estructura del gasto acumulado */}
      <Card>
        <div style={{ padding: "16px 20px", borderBottom: "1px solid #F1F5F9" }}>
          <h3 style={{ margin: 0, fontSize: 15, fontWeight: 700, color: "var(--c-primario)" }}>Estructura del gasto acumulado por unidad</h3>
          <div style={{ fontSize: 11, color: "#9CA3AF", marginTop: 2 }}>Cómo se compone el costo de cada unidad: combustible, mantenimiento y otros gastos. Los km salen del odómetro; el consumo se compara contra la referencia cargada en la ficha de cada unidad.</div>
        </div>
        <Table headers={["Unidad", "Combustible", "Mantenimiento", "Otros gastos", "Total", "Km", "Horas", "$/km", "L/100km", "Ref."]}>
          {[...unidades].sort((a, b) => b.total - a.total).map(u => (
            <TR key={u.v.id}>
              <TD bold>{u.v.patente} <span style={{ color: "#9CA3AF", fontWeight: 400 }}>· {u.v.marca} {u.v.modelo}</span></TD>
              <TD>{u.combPesos > 0 ? fmt(u.combPesos) : <span style={{ color: "#CBD5E1" }}>—</span>}</TD>
              <TD>{u.mantPesos > 0 ? fmt(u.mantPesos) : <span style={{ color: "#CBD5E1" }}>—</span>}</TD>
              <TD>{u.otrosPesos > 0 ? fmt(u.otrosPesos) : <span style={{ color: "#CBD5E1" }}>—</span>}</TD>
              <TD bold>{u.total > 0 ? fmt(u.total) : <span style={{ color: "#CBD5E1" }}>—</span>}</TD>
              <TD>{u.km > 0 ? fmtKm(u.km) : <span style={{ color: "#CBD5E1" }}>—</span>}</TD>
              <TD>{u.hs > 0 ? Math.round(u.hs).toLocaleString("es-AR") + " h" : <span style={{ color: "#CBD5E1" }}>—</span>}</TD>
              <TD>{u.cpk > 0 ? <span style={{ fontWeight: 700, color: promCpk > 0 && u.cpk > promCpk * 1.25 && conCpk.length > 1 ? "#B91C1C" : "var(--c-primario)" }}>${Math.round(u.cpk).toLocaleString("es-AR")}</span> : <span style={{ color: "#CBD5E1" }}>—</span>}</TD>
              <TD>{u.l100 > 0 ? <span style={{ fontWeight: 700, color: consumoColor(u.l100, u.ref) }}>{u.l100.toFixed(1)}</span> : <span style={{ color: "#CBD5E1" }}>—</span>}</TD>
              <TD>{u.ref > 0 ? <span style={{ color: "#6B7280" }}>{u.ref}</span> : <span style={{ color: "#CBD5E1" }} title="Cargá el consumo de referencia en la ficha del vehículo">—</span>}</TD>
            </TR>
          ))}
          {unidades.length === 0 && (
            <tr><td colSpan={10} style={{ padding: "28px 14px", textAlign: "center", color: "#9CA3AF", fontSize: 13 }}>Todavía no hay unidades cargadas en esta empresa.</td></tr>
          )}
        </Table>
      </Card>
    </div>
  );
};

// ─── EMPRESAS / BASES DE OPERACIONES ──────────────────────────────────────────
const EMPRESA_VACIA = { nombre: "", rut: "", plan: "Pro", estado: "activo", localidad: "", provincia: "", telefono: "", email: "", responsable: "" };
const BASE_VACIA = { nombre: "", direccion: "", localidad: "", telefono: "" };

const Empresas = ({ empresas, setEmpresas, empresaActiva, setEmpresaActiva, vehiculos, conductores }) => {
  const [vista, setVista] = useState("empresas");     // "empresas" | "bases"
  const [empresaBases, setEmpresaBases] = useState(null);
  const [form, setForm] = useState(EMPRESA_VACIA);
  const [editId, setEditId] = useState(null);
  const [formBase, setFormBase] = useState(BASE_VACIA);
  const [editBaseId, setEditBaseId] = useState(null);
  const [busq, setBusq] = useState("");
  const [aviso, setAviso] = useState(null);

  const avisar = (tipo, texto) => setAviso({ tipo, texto });
  const contarVeh = (id) => vehiculos.filter(v => mismoId(v.empresa_id, id)).length;
  const contarCond = (id) => conductores.filter(c => mismoId(c.empresa_id, id)).length;

  // ── CRUD EMPRESAS ──────────────────────────────────────────────────────────
  const guardar = () => {
    if (!form.nombre.trim()) return avisar("error", "Ingresá la razón social de la empresa.");
    const dup = empresas.find(e => e.rut && form.rut && e.rut.trim() === form.rut.trim() && !mismoId(e.id, editId));
    if (dup) return avisar("error", `Ya existe una empresa con el CUIT ${form.rut}.`);

    if (editId) {
      setEmpresas(prev => prev.map(e => mismoId(e.id, editId) ? { ...e, ...form } : e));
      avisar("ok", `Empresa "${form.nombre}" actualizada.`);
    } else {
      const nueva = { ...form, id: Date.now(), bases: [] };
      setEmpresas(prev => [...prev, nueva]);
      const primera = !empresaActiva;
      if (primera && esActivo(nueva.estado)) setEmpresaActiva(nueva.id);
      avisar("ok", `Empresa "${form.nombre}" creada.${primera ? " Quedó seleccionada como empresa activa: ya podés cargar vehículos y personal." : " Cargale las bases de operaciones desde el botón azul."}`);
    }
    cancelar();
  };
  const cancelar = () => { setForm(EMPRESA_VACIA); setEditId(null); };
  const editar = (e) => { setEditId(e.id); setForm({ nombre: e.nombre, rut: e.rut, plan: e.plan, estado: e.estado, localidad: e.localidad || "", provincia: e.provincia || "", telefono: e.telefono || "", email: e.email || "", responsable: e.responsable || "" }); setAviso(null); };
  const eliminar = (e) => {
    if (mismoId(e.id, empresaActiva)) return avisar("error", "No podés eliminar la empresa activa. Cambiá de empresa y volvé a intentar.");
    const v = contarVeh(e.id), c = contarCond(e.id);
    if (v || c) return avisar("error", `"${e.nombre}" tiene ${v} vehículo(s) y ${c} conductor(es) asociados. Reasignalos o dala de baja en lugar de eliminarla.`);
    if (!window.confirm(`¿Eliminar definitivamente "${e.nombre}"?`)) return;
    setEmpresas(prev => prev.filter(x => !mismoId(x.id, e.id)));
    if (mismoId(editId, e.id)) cancelar();
    avisar("ok", "Empresa eliminada.");
  };
  const toggleEstado = (e) => {
    if (mismoId(e.id, empresaActiva) && esActivo(e.estado)) return avisar("error", "No podés dar de baja la empresa activa.");
    setEmpresas(prev => prev.map(x => mismoId(x.id, e.id) ? { ...x, estado: esActivo(x.estado) ? "inactivo" : "activo" } : x));
  };

  // ── CRUD BASES ─────────────────────────────────────────────────────────────
  const emp = empresas.find(e => mismoId(e.id, empresaBases));
  const abrirBases = (e) => { setEmpresaBases(e.id); setVista("bases"); setFormBase(BASE_VACIA); setEditBaseId(null); setAviso(null); };
  const volver = () => { setVista("empresas"); setEmpresaBases(null); setAviso(null); };
  const cancelarBase = () => { setFormBase(BASE_VACIA); setEditBaseId(null); };
  const guardarBase = () => {
    if (!formBase.nombre.trim()) return avisar("error", "Ingresá el nombre de la base.");
    setEmpresas(prev => prev.map(e => {
      if (!mismoId(e.id, empresaBases)) return e;
      const bases = e.bases || [];
      return editBaseId
        ? { ...e, bases: bases.map(b => mismoId(b.id, editBaseId) ? { ...b, ...formBase } : b) }
        : { ...e, bases: [...bases, { ...formBase, id: Date.now() }] };
    }));
    avisar("ok", editBaseId ? "Base actualizada." : `Base "${formBase.nombre}" agregada.`);
    cancelarBase();
  };
  const editarBase = (b) => { setEditBaseId(b.id); setFormBase({ nombre: b.nombre, direccion: b.direccion || "", localidad: b.localidad || "", telefono: b.telefono || "" }); setAviso(null); };
  const eliminarBase = (b) => {
    if (!window.confirm(`¿Eliminar la base "${b.nombre}"?`)) return;
    setEmpresas(prev => prev.map(e => mismoId(e.id, empresaBases) ? { ...e, bases: (e.bases || []).filter(x => !mismoId(x.id, b.id)) } : e));
    if (mismoId(editBaseId, b.id)) cancelarBase();
    avisar("ok", "Base eliminada.");
  };

  const importar = (filas) => {
    const errores = []; const nuevas = [];
    filas.forEach((f, i) => {
      if (!f.nombre) return;
      const dup = [...empresas, ...nuevas].find(e => e.rut && f.rut && e.rut.trim() === f.rut.trim());
      if (dup) { errores.push(`Fila ${i + 2}: el CUIT ${f.rut} ya existe.`); return; }
      nuevas.push({ ...f, id: Date.now() + Math.floor(Math.random() * 1000) + i, bases: [] });
    });
    if (!nuevas.length) return { agregados: 0, errores: errores.length ? errores : ["No hay filas válidas."] };
    setEmpresas(prev => [...prev, ...nuevas]);
    if (!empresaActiva) {
      const activa = nuevas.find(e => esActivo(e.estado));
      if (activa) setEmpresaActiva(activa.id);
    }
    return { agregados: nuevas.length, errores };
  };

  const importarBases = (filas) => {
    const nuevas = filas.filter(f => f.nombre).map((f, i) => ({ ...f, id: Date.now() + Math.floor(Math.random() * 1000) + i }));
    if (!nuevas.length) return { agregados: 0, errores: ["Ninguna fila tiene nombre de base."] };
    setEmpresas(prev => prev.map(e => mismoId(e.id, empresaBases) ? { ...e, bases: [...(e.bases || []), ...nuevas] } : e));
    return { agregados: nuevas.length, errores: [] };
  };

  const filtradas = empresas.filter(e =>
    e.nombre.toLowerCase().includes(busq.toLowerCase()) ||
    (e.rut || "").includes(busq) ||
    (e.localidad || "").toLowerCase().includes(busq.toLowerCase())
  );

  // ══ VISTA BASES DE OPERACIONES ═════════════════════════════════════════════
  if (vista === "bases" && emp) {
    const bases = emp.bases || [];
    return (
      <div>
        <button onClick={volver} style={{ display: "flex", alignItems: "center", gap: 6, background: "none", border: "none", color: "var(--c-primario)", fontSize: 13, fontWeight: 600, cursor: "pointer", padding: 0, marginBottom: 14 }}>
          <Icon name="back" size={15} color="var(--c-primario)" /> Volver a Empresas
        </button>
        <SectionHeader title="Bases de Operaciones" sub={`${emp.nombre} · ${bases.length} base(s) cargada(s)`}
          extra={<ImportarMasivo nombre="Bases" onImportar={importarBases}
            ejemplo={{ nombre: "Base Neuquén", direccion: "Ruta 7 km 12", localidad: "Añelo", telefono: "+54 299 400-0000" }}
            columnas={[
              { campo: "nombre", etiqueta: "Nombre", tipo: "texto", requerido: true, alias: ["base"] },
              { campo: "direccion", etiqueta: "Dirección", tipo: "texto", alias: ["domicilio"] },
              { campo: "localidad", etiqueta: "Localidad", tipo: "texto" },
              { campo: "telefono", etiqueta: "Teléfono", tipo: "texto" },
            ]} />} />

        {aviso && <Aviso tipo={aviso.tipo}>{aviso.texto}</Aviso>}

        <Card style={{ marginBottom: 20 }}>
          <div style={{ padding: "18px 20px 4px" }}>
            <div style={{ fontSize: 13, fontWeight: 700, color: "var(--c-primario)", marginBottom: 14 }}>
              {editBaseId ? "Modificar base" : "Agregar nueva base de operaciones"}
            </div>
            <div style={{ display: "grid", gridTemplateColumns: "repeat(4, 1fr)", gap: "0 14px" }}>
              <Field label="Nombre"><Input placeholder="Base Neuquén" value={formBase.nombre} onChange={e => setFormBase(p => ({ ...p, nombre: e.target.value }))} /></Field>
              <Field label="Dirección"><Input placeholder="Ruta 7 km 12" value={formBase.direccion} onChange={e => setFormBase(p => ({ ...p, direccion: e.target.value }))} /></Field>
              <Field label="Localidad"><Input placeholder="Añelo" value={formBase.localidad} onChange={e => setFormBase(p => ({ ...p, localidad: e.target.value }))} /></Field>
              <Field label="Teléfono"><Input placeholder="+54 299 400-0000" value={formBase.telefono} onChange={e => setFormBase(p => ({ ...p, telefono: e.target.value }))} /></Field>
            </div>
            <div style={{ display: "flex", gap: 10, marginBottom: 18 }}>
              <button onClick={guardarBase} style={{ padding: "9px 22px", borderRadius: 8, border: "none", background: "var(--c-primario)", color: "#fff", fontSize: 13, fontWeight: 600, cursor: "pointer" }}>{editBaseId ? "Actualizar" : "Guardar"}</button>
              <button onClick={cancelarBase} style={{ padding: "9px 22px", borderRadius: 8, border: "1.5px solid #E5E7EB", background: "#fff", color: "#374151", fontSize: 13, fontWeight: 600, cursor: "pointer" }}>Cancelar</button>
            </div>
          </div>
        </Card>

        <Card>
          <Table headers={["ID", "Nombre", "Dirección", "Localidad", "Teléfono", "Acciones"]}>
            {bases.map(b => (
              <TR key={b.id}>
                <TD>{b.id}</TD>
                <TD bold>{b.nombre}</TD>
                <TD>{b.direccion || "—"}</TD>
                <TD>{b.localidad || "—"}</TD>
                <TD>{b.telefono || "—"}</TD>
                <TD>
                  <AccionBtn tipo="editar" title="Editar base" onClick={() => editarBase(b)} />
                  <AccionBtn tipo="borrar" title="Eliminar base" onClick={() => eliminarBase(b)} />
                </TD>
              </TR>
            ))}
            {bases.length === 0 && (
              <tr><td colSpan={6} style={{ padding: "28px 14px", textAlign: "center", color: "#9CA3AF", fontSize: 13 }}>Todavía no hay bases cargadas. Completá el formulario de arriba para agregar la primera.</td></tr>
            )}
          </Table>
        </Card>
      </div>
    );
  }

  // ══ VISTA EMPRESAS ═════════════════════════════════════════════════════════
  return (
    <div>
      <SectionHeader title="Mi empresa y bases de operaciones" sub={`${(empresas[0] || {}).nombre || "todavía no cargaste tu empresa"} · ${(((empresas[0] || {}).bases) || []).length} base(s)`}
        extra={<ImportarMasivo nombre="Empresas" onImportar={importar}
          ejemplo={{ nombre: "Transportes Del Litoral S.A.", rut: "30-71234567-8", plan: "Pro", estado: "activo", localidad: "Paraná", provincia: "Entre Ríos", telefono: "+54 343 400-0000", email: "operaciones@empresa.com.ar", responsable: "Ing. Pablo Ruiz" }}
          columnas={[
            { campo: "nombre", etiqueta: "Razón social", tipo: "texto", requerido: true, alias: ["empresa", "razon social", "nombre"] },
            { campo: "rut", etiqueta: "CUIT", tipo: "texto", alias: ["cuit", "rut"] },
            { campo: "plan", etiqueta: "Plan", tipo: "opcion", opciones: ["Básico", "Pro"], porDefecto: "Pro" },
            { campo: "estado", etiqueta: "Estado", tipo: "opcion", opciones: ["activo", "inactivo"], porDefecto: "activo" },
            { campo: "localidad", etiqueta: "Localidad", tipo: "texto" },
            { campo: "provincia", etiqueta: "Provincia", tipo: "texto" },
            { campo: "telefono", etiqueta: "Teléfono", tipo: "texto", alias: ["telefono"] },
            { campo: "email", etiqueta: "Email", tipo: "texto", alias: ["correo"] },
            { campo: "responsable", etiqueta: "Responsable", tipo: "texto", alias: ["contacto"] },
          ]} />} />

      {aviso && <Aviso tipo={aviso.tipo}>{aviso.texto}</Aviso>}

      {/* Formulario alta / edición */}
      <Card style={{ marginBottom: 20 }}>
        <div style={{ padding: "18px 20px 4px" }}>
          <div style={{ fontSize: 13, fontWeight: 700, color: "var(--c-primario)", marginBottom: 14 }}>
            {editId ? `Modificar empresa #${editId}` : "Crear nueva empresa"}
          </div>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(4, 1fr)", gap: "0 14px" }}>
            <div style={{ gridColumn: "span 2" }}>
              <Field label="Razón social"><Input placeholder="Transportes Del Litoral S.A." value={form.nombre} onChange={e => setForm(p => ({ ...p, nombre: e.target.value }))} /></Field>
            </div>
            <Field label="CUIT"><Input placeholder="30-71234567-8" value={form.rut} onChange={e => setForm(p => ({ ...p, rut: e.target.value }))} /></Field>
            <Field label="Plan">
              <Select value={form.plan} onChange={e => setForm(p => ({ ...p, plan: e.target.value }))}>
                {["Básico", "Pro"].map(t => <option key={t}>{t}</option>)}
              </Select>
            </Field>
            <Field label="Localidad"><Input placeholder="Paraná" value={form.localidad} onChange={e => setForm(p => ({ ...p, localidad: e.target.value }))} /></Field>
            <Field label="Provincia"><Input placeholder="Entre Ríos" value={form.provincia} onChange={e => setForm(p => ({ ...p, provincia: e.target.value }))} /></Field>
            <Field label="Teléfono"><Input placeholder="+54 343 400-0000" value={form.telefono} onChange={e => setForm(p => ({ ...p, telefono: e.target.value }))} /></Field>
            <Field label="Estado">
              <Select value={form.estado} onChange={e => setForm(p => ({ ...p, estado: e.target.value }))}>
                <option value="activo">Activa</option>
                <option value="inactivo">Inactiva</option>
              </Select>
            </Field>
            <div style={{ gridColumn: "span 2" }}>
              <Field label="Email de contacto"><Input placeholder="operaciones@empresa.com.ar" value={form.email} onChange={e => setForm(p => ({ ...p, email: e.target.value }))} /></Field>
            </div>
            <div style={{ gridColumn: "span 2" }}>
              <Field label="Responsable"><Input placeholder="Nombre del responsable" value={form.responsable} onChange={e => setForm(p => ({ ...p, responsable: e.target.value }))} /></Field>
            </div>
          </div>
          <div style={{ display: "flex", gap: 10, marginBottom: 18 }}>
            <button onClick={guardar} style={{ padding: "9px 22px", borderRadius: 8, border: "none", background: "var(--c-primario)", color: "#fff", fontSize: 13, fontWeight: 600, cursor: "pointer" }}>{editId ? "Actualizar" : "Guardar"}</button>
            <button onClick={cancelar} style={{ padding: "9px 22px", borderRadius: 8, border: "1.5px solid #E5E7EB", background: "#fff", color: "#374151", fontSize: 13, fontWeight: 600, cursor: "pointer" }}>Cancelar</button>
          </div>
        </div>
      </Card>

      {/* Listado */}
      <Card>
        <div style={{ padding: "12px 16px", borderBottom: "1px solid #F1F5F9" }}>
          <div style={{ position: "relative", maxWidth: 380 }}>
            <span style={{ position: "absolute", left: 10, top: "50%", transform: "translateY(-50%)" }}><Icon name="search" size={15} color="#9CA3AF" /></span>
            <Input placeholder="Buscar por razón social, CUIT o localidad..." value={busq} onChange={e => setBusq(e.target.value)} style={{ paddingLeft: 32 }} />
          </div>
        </div>
        <Table headers={["ID", "Razón social", "CUIT", "Localidad", "Plan", "Bases", "Vehículos", "Estado", "Acciones"]}>
          {filtradas.map(e => (
            <TR key={e.id}>
              <TD>{e.id}</TD>
              <TD bold>
                {e.nombre}
                {mismoId(e.id, empresaActiva) && <span style={{ marginLeft: 8, padding: "2px 8px", borderRadius: 99, background: "#DCFCE7", color: "#166534", fontSize: 10.5, fontWeight: 800 }}>EN USO</span>}
              </TD>
              <TD>{e.rut || "—"}</TD>
              <TD>{e.localidad || "—"}</TD>
              <TD>
                <span style={{ padding: "3px 10px", background: e.plan === "Pro" ? "color-mix(in srgb, var(--c-acento) 12%, transparent)" : "color-mix(in srgb, var(--c-primario) 9%, transparent)", color: e.plan === "Pro" ? "var(--c-acento)" : "var(--c-primario)", borderRadius: 99, fontSize: 11, fontWeight: 700 }}>{e.plan}</span>
              </TD>
              <TD>{(e.bases || []).length}</TD>
              <TD>{contarVeh(e.id)}</TD>
              <TD>
                <button onClick={() => toggleEstado(e)} title="Cambiar estado" style={{ background: "none", border: "none", padding: 0, cursor: "pointer" }}>
                  <Badge estado={e.estado} />
                </button>
              </TD>
              <TD>
                <div style={{ display: "flex", alignItems: "center" }}>
                  <LogoEmpresaFila empresa={e} />
                  <AccionBtn tipo="editar" title="Editar empresa" onClick={() => editar(e)} />
                  <AccionBtn tipo="borrar" title="Eliminar empresa" onClick={() => eliminar(e)} disabled={mismoId(e.id, empresaActiva)} />
                  <AccionBtn tipo="ver" title="Bases de operaciones" onClick={() => abrirBases(e)} />
                  {!mismoId(e.id, empresaActiva) && esActivo(e.estado) && (
                    <button onClick={() => setEmpresaActiva(e.id)} title="Trabajar con esta empresa"
                      style={{ marginLeft: 4, padding: "6px 12px", borderRadius: 8, border: "none", background: "var(--c-primario)", color: "#fff", fontSize: 12, fontWeight: 700, cursor: "pointer" }}>
                      Usar
                    </button>
                  )}
                </div>
              </TD>
            </TR>
          ))}
          {filtradas.length === 0 && (
            <tr><td colSpan={9} style={{ padding: "28px 14px", textAlign: "center", color: "#9CA3AF", fontSize: 13 }}>
              {empresas.length === 0
                ? "Todavía no cargaste ninguna empresa. Usá el formulario de arriba o el botón de carga masiva."
                : "No hay empresas que coincidan con la búsqueda."}
            </td></tr>
          )}
        </Table>
      </Card>
    </div>
  );
};

// ─── MARCA (panel white-label) ────────────────────────────────────────────────
const PRESETS = [
  { nombre: "Azul institucional", primario: "#1B3A6B", acento: "#E8A020" },
  { nombre: "Verde operativo", primario: "#14532D", acento: "#F59E0B" },
  { nombre: "Grafito", primario: "#1F2937", acento: "#0EA5E9" },
  { nombre: "Bordó", primario: "#7F1D1D", acento: "#D4A017" },
];

const Marca = ({ marca, setMarca }) => {
  const [borr, setBorr] = useState(marca);
  const [guardado, setGuardado] = useState(false);
  const set = (k, v) => { setBorr(p => ({ ...p, [k]: v })); setGuardado(false); };
  const aplicar = () => {
    const iniciales = (borr.iniciales || "").trim() || (borr.nombreUsuario || "US").trim().slice(0, 2).toUpperCase();
    setMarca({ ...borr, nombreSistema: borr.nombreSistema.trim() || "Sistema de Flota", iniciales: iniciales.slice(0, 2).toUpperCase() });
    setGuardado(true);
  };
  const restaurar = () => { setBorr(MARCA_INIT); setMarca(MARCA_INIT); setGuardado(true); };

  return (
    <div>
      <SectionHeader title="Marca del sistema" sub="Definí cómo se identifica la instalación en cada cliente" />

      {guardado && <Aviso tipo="ok">Marca aplicada. Mirá el sidebar y la barra superior.</Aviso>}

      <div style={{ display: "grid", gridTemplateColumns: "1.3fr 1fr", gap: 20, alignItems: "start" }}>
        {/* Formulario */}
        <Card>
          <div style={{ padding: "20px 22px 6px" }}>
            <div style={{ fontSize: 13, fontWeight: 700, color: "var(--c-primario)", marginBottom: 16 }}>Identidad</div>
            <Field label="Nombre del sistema">
              <Input placeholder="FlotaGestión" value={borr.nombreSistema} onChange={e => set("nombreSistema", e.target.value)} />
            </Field>
            <Field label="Leyenda / bajada (opcional)">
              <Input placeholder="Ej: nombre de tu consultora o del cliente" value={borr.bajada} onChange={e => set("bajada", e.target.value)} />
            </Field>
            <CampoImagen etiqueta="Logotipo" valor={borr.logo} onCambio={v => set("logo", v)}
              maxLado={160} formato="image/png" calidad={0.92} fondo="var(--c-acento)"
              ayuda="PNG con fondo transparente queda mejor. Se achica a 160 px automáticamente." />

            <div style={{ display: "grid", gridTemplateColumns: "2fr 1fr", gap: "0 14px" }}>
              <Field label="Nombre del usuario"><Input placeholder="Admin" value={borr.nombreUsuario} onChange={e => set("nombreUsuario", e.target.value)} /></Field>
              <Field label="Iniciales"><Input maxLength={2} placeholder="AD" value={borr.iniciales} onChange={e => set("iniciales", e.target.value.toUpperCase())} /></Field>
            </div>

            <CampoImagen etiqueta="Foto de usuario" valor={borr.avatar} onCambio={v => set("avatar", v)} redonda
              maxLado={200} formato="image/jpeg" calidad={0.85}
              ayuda="Si no cargás ninguna, se muestran las iniciales. Conviene una foto cuadrada." />

            <div style={{ fontSize: 13, fontWeight: 700, color: "var(--c-primario)", margin: "8px 0 16px" }}>Colores</div>
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: "0 14px" }}>
              <Field label="Color primario">
                <div style={{ display: "flex", gap: 8 }}>
                  <input type="color" value={borr.colorPrimario} onChange={e => set("colorPrimario", e.target.value)} style={{ width: 44, height: 38, border: "1.5px solid #E5E7EB", borderRadius: 8, padding: 2, background: "#fff", cursor: "pointer" }} />
                  <Input value={borr.colorPrimario} onChange={e => set("colorPrimario", e.target.value)} />
                </div>
              </Field>
              <Field label="Color de acento">
                <div style={{ display: "flex", gap: 8 }}>
                  <input type="color" value={borr.colorAcento} onChange={e => set("colorAcento", e.target.value)} style={{ width: 44, height: 38, border: "1.5px solid #E5E7EB", borderRadius: 8, padding: 2, background: "#fff", cursor: "pointer" }} />
                  <Input value={borr.colorAcento} onChange={e => set("colorAcento", e.target.value)} />
                </div>
              </Field>
            </div>

            <Field label="Paletas rápidas">
              <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
                {PRESETS.map(p => (
                  <button key={p.nombre} onClick={() => setBorr(b => ({ ...b, colorPrimario: p.primario, colorAcento: p.acento }))}
                    style={{ display: "flex", alignItems: "center", gap: 8, padding: "6px 12px", border: "1.5px solid #E5E7EB", borderRadius: 8, background: "#fff", cursor: "pointer", fontSize: 12, fontWeight: 600, color: "#374151" }}>
                    <span style={{ display: "flex" }}>
                      <span style={{ width: 12, height: 12, borderRadius: "50% 0 0 50%", background: p.primario }} />
                      <span style={{ width: 12, height: 12, borderRadius: "0 50% 50% 0", background: p.acento }} />
                    </span>
                    {p.nombre}
                  </button>
                ))}
              </div>
            </Field>

            <div style={{ display: "flex", gap: 10, margin: "6px 0 20px" }}>
              <button onClick={aplicar} style={{ padding: "9px 22px", borderRadius: 8, border: "none", background: "var(--c-primario)", color: "#fff", fontSize: 13, fontWeight: 600, cursor: "pointer" }}>Aplicar marca</button>
              <button onClick={restaurar} style={{ padding: "9px 22px", borderRadius: 8, border: "1.5px solid #E5E7EB", background: "#fff", color: "#374151", fontSize: 13, fontWeight: 600, cursor: "pointer" }}>Restaurar valores</button>
            </div>
          </div>
        </Card>

        {/* Vista previa en vivo */}
        <Card>
          <div style={{ padding: "20px 22px" }}>
            <div style={{ fontSize: 13, fontWeight: 700, color: "var(--c-primario)", marginBottom: 16 }}>Vista previa</div>

            <div style={{ borderRadius: 10, overflow: "hidden", border: "1px solid #E5E7EB" }}>
              <div style={{ background: borr.colorPrimario, padding: "18px 16px", display: "flex", alignItems: "center", gap: 10 }}>
                <div style={{ width: 32, height: 32, borderRadius: 8, background: borr.logo ? "#fff" : borr.colorAcento, display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0, overflow: "hidden" }}>
                  {borr.logo ? <img src={borr.logo} alt="" style={{ width: "100%", height: "100%", objectFit: "contain" }} /> : <Icon name="truck" size={18} color="#fff" />}
                </div>
                <div style={{ overflow: "hidden" }}>
                  <div style={{ fontSize: 14, fontWeight: 800, color: "#fff", whiteSpace: "nowrap" }}>{borr.nombreSistema || "Sistema de Flota"}</div>
                  {borr.bajada && <div style={{ fontSize: 10, color: "rgba(255,255,255,0.5)", whiteSpace: "nowrap" }}>{borr.bajada}</div>}
                </div>
              </div>
              <div style={{ background: "#fff", padding: "12px 16px", display: "flex", alignItems: "center", justifyContent: "flex-end", gap: 8, borderTop: "1px solid #E5E7EB" }}>
                <div style={{ width: 30, height: 30, borderRadius: "50%", background: borr.colorPrimario, display: "flex", alignItems: "center", justifyContent: "center", overflow: "hidden" }}>
                  {borr.avatar
                    ? <img src={borr.avatar} alt="" style={{ width: "100%", height: "100%", objectFit: "cover" }} />
                    : <span style={{ fontSize: 12, fontWeight: 700, color: "#fff" }}>{(borr.iniciales || (borr.nombreUsuario || "US").slice(0, 2)).toUpperCase()}</span>}
                </div>
                <span style={{ fontSize: 13, fontWeight: 600, color: "#374151" }}>{borr.nombreUsuario || "Usuario"}</span>
              </div>
            </div>

            <div style={{ marginTop: 16, display: "flex", gap: 8 }}>
              <button style={{ padding: "8px 16px", borderRadius: 8, border: "none", background: borr.colorPrimario, color: "#fff", fontSize: 12, fontWeight: 600 }}>Botón primario</button>
              <button style={{ padding: "8px 16px", borderRadius: 8, border: "none", background: borr.colorAcento, color: "#fff", fontSize: 12, fontWeight: 600 }}>Acento</button>
            </div>

            <p style={{ fontSize: 12, color: "#9CA3AF", marginTop: 18, lineHeight: 1.6 }}>
              Los cambios se aplican a toda la interfaz al tocar <strong style={{ color: "#6B7280" }}>Aplicar marca</strong>. Dejá la leyenda vacía si no querés mostrar ninguna.
            </p>
          </div>
        </Card>
      </div>
    </div>
  );
};

// ─── PROYECTOS (asignación de unidad + conductor a una obra) ──────────────────
const PROYECTO_VACIO = { nombre: "", cliente: "", vehiculo_id: "", conductor_id: "", base_id: "", origen: "", destino: "", fechaInicio: "", fechaFin: "", observaciones: "" };

// días entre inicio y (fin || hoy), inclusive del día de inicio
const diasEntre = (inicio, fin) => {
  if (!inicio) return null;
  const d1 = new Date(inicio); if (isNaN(d1)) return null;
  const d2 = fin ? new Date(fin) : new Date();
  const ms = d2.setHours(0,0,0,0) - d1.setHours(0,0,0,0);
  return Math.max(0, Math.floor(ms / 86400000) + 1);
};

const Proyectos = ({ proyectos, setProyectos, vehiculos, conductores, empresaActiva, bases, partes, viajes, combustible, combustibleTodo }) => {
  const [form, setForm] = useState(PROYECTO_VACIO);
  const [editId, setEditId] = useState(null);
  const [aviso, setAviso] = useState(null);
  const [busq, setBusq] = useState("");
  const avisar = (tipo, texto) => setAviso({ tipo, texto });

  // Preselección: cuando el form está vacío (nuevo proyecto) y llegan vehículos/conductores, arrancar con el primero
  useEffect(() => {
    if (editId) return; // si está editando, no tocar
    setForm(prev => {
      const cambios = {};
      if (!prev.vehiculo_id && vehiculos.length > 0) cambios.vehiculo_id = vehiculos[0].id;
      if (!prev.conductor_id && conductores.length > 0) cambios.conductor_id = conductores[0].id;
      return Object.keys(cambios).length > 0 ? { ...prev, ...cambios } : prev;
    });
  }, [vehiculos, conductores, editId]);

  const cancelar = () => { setForm(PROYECTO_VACIO); setEditId(null); };

  const guardar = () => {
    if (!form.nombre.trim()) return avisar("error", "Poné el nombre del proyecto u obra.");
    if (!form.vehiculo_id) return avisar("error", "Elegí la unidad asignada.");
    if (!form.fechaInicio) return avisar("error", "Cargá la fecha de inicio de la asignación.");
    const estado = form.fechaFin ? "finalizado" : "en_curso";
    if (editId) {
      setProyectos(prev => prev.map(p => mismoId(p.id, editId) ? { ...p, ...form, estado, vehiculo_id: form.vehiculo_id, conductor_id: form.conductor_id || null, base_id: form.base_id || null } : p));
      avisar("ok", "Proyecto actualizado.");
    } else {
      setProyectos(prev => [...prev, { ...form, id: Date.now(), empresa_id: empresaActiva, estado, vehiculo_id: form.vehiculo_id, conductor_id: form.conductor_id || null, base_id: form.base_id || null }]);
      avisar("ok", `Proyecto "${form.nombre}" creado${form.fechaFin ? "" : " y marcado EN CURSO"}.`);
    }
    cancelar();
  };

  const editar = (p) => {
    setEditId(p.id);
    setForm({ nombre: p.nombre || "", cliente: p.cliente || "", vehiculo_id: p.vehiculo_id || "", conductor_id: p.conductor_id || "", base_id: p.base_id || "", origen: p.origen || "", destino: p.destino || "", fechaInicio: toDateInput(p.fechaInicio), fechaFin: toDateInput(p.fechaFin), observaciones: p.observaciones || "" });
    setAviso(null);
  };

  const finalizar = (p) => {
    const hoy = new Date().toISOString().slice(0, 10);
    setProyectos(prev => prev.map(x => mismoId(x.id, p.id) ? { ...x, fechaFin: hoy, estado: "finalizado" } : x));
  };
  const reabrir = (p) => setProyectos(prev => prev.map(x => mismoId(x.id, p.id) ? { ...x, fechaFin: "", estado: "en_curso" } : x));
  const eliminar = (p) => { if (window.confirm(`¿Eliminar el proyecto "${p.nombre}"?`)) setProyectos(prev => prev.filter(x => !mismoId(x.id, p.id))); };

  const nombreVeh = (id) => { const v = vehiculos.find(x => mismoId(x.id, id)); return v ? `${v.patente} — ${v.marca} ${v.modelo}` : "—"; };
  const nombreCond = (id) => { const c = conductores.find(x => mismoId(x.id, id)); return c ? c.nombre : "—"; };
  const nombreBase = (id) => { const b = (bases || []).find(x => mismoId(x.id, id)); return b ? b.nombre : "—"; };

  // Carga masiva: la unidad puede venir como patente o como N° interno,
  // el conductor como DNI o como nombre, y la base por su nombre.
  const buscarVeh = (ref) => vehiculos.find(v => norm(v.patente) === norm(ref) || String(v.vehiculo || "") === String(ref || "").trim());
  const importar = (filas) => {
    const errores = []; const nuevos = []; const base = Date.now();
    filas.forEach((f, i) => {
      if (!String(f.nombre || "").trim()) { errores.push(`Fila ${i + 2}: falta el nombre del proyecto.`); return; }
      const v = buscarVeh(f.unidad);
      if (!v) { errores.push(`Fila ${i + 2}: la unidad "${f.unidad}" no existe en esta empresa.`); return; }
      const c = conductores.find(x => norm(x.nombre) === norm(f.conductor) || String(x.dni || "") === String(f.conductor || "").trim());
      const b = (bases || []).find(x => norm(x.nombre) === norm(f.base));
      const fechaFin = toDateInput(f.fechaFin);
      nuevos.push({
        id: base + i + 1, empresa_id: empresaActiva,
        nombre: String(f.nombre).trim(), cliente: f.cliente || "",
        vehiculo_id: v.id, conductor_id: c ? c.id : null, base_id: b ? b.id : null,
        origen: f.origen || "", destino: f.destino || "",
        fechaInicio: toDateInput(f.fechaInicio), fechaFin,
        estado: fechaFin ? "finalizado" : "en_curso",
        observaciones: f.observaciones || "",
      });
    });
    if (!nuevos.length) return { agregados: 0, errores: errores.length ? errores : ["No hay filas válidas."] };
    setProyectos(prev => [...prev, ...nuevos]);
    return { agregados: nuevos.length, errores };
  };

  // Km, litros y consumo de la unidad DENTRO del período del proyecto.
  // Los km salen del odómetro contra el historial COMPLETO de combustible:
  // el motor necesita la última lectura anterior al inicio del proyecto.
  const datosDeProyecto = (p) => {
    const vacio = { km: 0, litros: 0, l100: 0, ref: 0, pesos: 0 };
    if (!p.vehiculo_id) return vacio;
    const v = vehiculos.find(x => mismoId(x.id, p.vehiculo_id));
    if (!v) return vacio;
    const ini = toDateInput(p.fechaInicio);
    if (!ini) return vacio;
    const fin = toDateInput(p.fechaFin) || "9999-12-31";
    const histo = combustibleTodo || combustible;
    const km = kmUnidadRango(v, histo, ini, fin);
    const litros = litrosUnidadRango(v, histo, ini, fin);
    const pesos = (histo || [])
      .filter(c => mismoId(c.vehiculo_id, v.id))
      .filter(c => { const f = toDateInput(c.fecha); return !!f && f >= ini && f <= fin; })
      .reduce((s, c) => s + (Number(c.total) || 0), 0);
    return { km, litros, pesos, l100: litrosPor100(litros, km), ref: consumoRefDe(v) };
  };

  const enCurso = proyectos.filter(p => !p.fechaFin);
  const filtrados = proyectos.filter(p =>
    (p.nombre || "").toLowerCase().includes(busq.toLowerCase()) ||
    (p.cliente || "").toLowerCase().includes(busq.toLowerCase()) ||
    nombreVeh(p.vehiculo_id).toLowerCase().includes(busq.toLowerCase())
  ).sort((a, b) => (a.fechaFin ? 1 : 0) - (b.fechaFin ? 1 : 0) || new Date(b.fechaInicio || 0) - new Date(a.fechaInicio || 0));

  return (
    <div>
      <SectionHeader title="Proyectos" sub={`${proyectos.length} en total · ${enCurso.length} en curso`}
        extra={<ImportarMasivo nombre="Proyectos" onImportar={importar}
          ayuda={<>Subí las asignaciones en CSV o Excel. La <strong>unidad</strong> puede ser la patente o el número interno, y el <strong>conductor</strong> el DNI o el nombre. Si dejás la <strong>fecha de culminación</strong> vacía, el proyecto queda EN CURSO.</>}
          ejemplo={{ nombre: "Los Toldos 2 Este", cliente: "Techint", unidad: "AH078EO", conductor: "Vizcaino Melanie", base: "Base Neuquén", origen: "Base Neuquén", destino: "Añelo, Neuquén", fechaInicio: "01/07/2026", fechaFin: "", observaciones: "Traslado de personal" }}
          columnas={[
            { campo: "nombre", etiqueta: "Proyecto / Obra", tipo: "texto", requerido: true, alias: ["proyecto", "obra", "nombre"] },
            { campo: "cliente", etiqueta: "Cliente", tipo: "texto", alias: ["empresa", "empresa cliente"] },
            { campo: "unidad", etiqueta: "Unidad (patente o interno)", tipo: "texto", requerido: true, alias: ["patente", "dominio", "interno", "unidad"] },
            { campo: "conductor", etiqueta: "Conductor (DNI o nombre)", tipo: "texto", alias: ["conductor", "chofer", "dni"] },
            { campo: "base", etiqueta: "Base de referencia", tipo: "texto", alias: ["base"] },
            { campo: "origen", etiqueta: "Origen", tipo: "texto", alias: ["desde"] },
            { campo: "destino", etiqueta: "Destino", tipo: "texto", alias: ["hasta"] },
            { campo: "fechaInicio", etiqueta: "Fecha de inicio", tipo: "fecha", alias: ["inicio", "fecha inicio", "desde fecha"] },
            { campo: "fechaFin", etiqueta: "Fecha de culminación", tipo: "fecha", alias: ["fin", "fecha fin", "culminacion", "fecha de fin"] },
            { campo: "observaciones", etiqueta: "Observaciones", tipo: "texto", alias: ["notas", "detalle"] },
          ]} />} />

      {aviso && <Aviso tipo={aviso.tipo}>{aviso.texto}</Aviso>}

      {/* Formulario de asignación */}
      <Card style={{ marginBottom: 20 }}>
        <div style={{ padding: "18px 20px 4px" }}>
          <div style={{ fontSize: 13, fontWeight: 700, color: "var(--c-primario)", marginBottom: 14 }}>
            {editId ? "Modificar proyecto" : "Nuevo proyecto / asignación"}
          </div>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: "0 14px" }}>
            <Field label="Proyecto / Obra"><Input placeholder="Los Toldos 2 Este" value={form.nombre} onChange={e => setForm(p => ({ ...p, nombre: e.target.value }))} /></Field>
            <Field label="Cliente"><Input placeholder="Techint" value={form.cliente} onChange={e => setForm(p => ({ ...p, cliente: e.target.value }))} /></Field>
            <Field label="Base de referencia">
              <Select value={form.base_id} onChange={e => setForm(p => ({ ...p, base_id: e.target.value }))}>
                <option value="">— Sin base —</option>
                {(bases || []).map(b => <option key={b.id} value={b.id}>{b.nombre}</option>)}
              </Select>
            </Field>
            <Field label="Unidad asignada">
              <Select value={form.vehiculo_id} onChange={e => setForm(p => ({ ...p, vehiculo_id: e.target.value }))}>
                <option value="">— Elegí una unidad —</option>
                {vehiculos.map(v => <option key={v.id} value={v.id}>{v.patente} — {v.marca} {v.modelo}</option>)}
              </Select>
            </Field>
            <Field label="Conductor asignado">
              <Select value={form.conductor_id} onChange={e => setForm(p => ({ ...p, conductor_id: e.target.value }))}>
                <option value="">— Elegí un conductor —</option>
                {conductores.map(c => <option key={c.id} value={c.id}>{c.nombre}</option>)}
              </Select>
            </Field>
            <div />
            <Field label="Origen"><Input placeholder="Base Neuquén" value={form.origen} onChange={e => setForm(p => ({ ...p, origen: e.target.value }))} /></Field>
            <Field label="Destino"><Input placeholder="Añelo, Neuquén" value={form.destino} onChange={e => setForm(p => ({ ...p, destino: e.target.value }))} /></Field>
            <div />
            <Field label="Fecha de inicio (asignación)"><Input type="date" value={toDateInput(form.fechaInicio)} onChange={e => setForm(p => ({ ...p, fechaInicio: e.target.value }))} /></Field>
            <Field label="Fecha de culminación">
              <Input type="date" value={toDateInput(form.fechaFin)} onChange={e => setForm(p => ({ ...p, fechaFin: e.target.value }))} />
            </Field>
            <div style={{ display: "flex", alignItems: "flex-end", paddingBottom: 16 }}>
              <span style={{ fontSize: 12, color: "#9CA3AF" }}>Dejá la culminación vacía para que quede <strong style={{ color: "#3B82F6" }}>EN CURSO</strong>.</span>
            </div>
          </div>
          <Field label="Observaciones"><Input placeholder="Detalle, tipo de servicio, cantidad de personal, etc." value={form.observaciones} onChange={e => setForm(p => ({ ...p, observaciones: e.target.value }))} /></Field>
          <div style={{ display: "flex", gap: 10, marginBottom: 18 }}>
            <button onClick={guardar} style={{ padding: "9px 22px", borderRadius: 8, border: "none", background: "var(--c-primario)", color: "#fff", fontSize: 13, fontWeight: 600, cursor: "pointer" }}>{editId ? "Actualizar" : "Guardar proyecto"}</button>
            <button onClick={cancelar} style={{ padding: "9px 22px", borderRadius: 8, border: "1.5px solid #E5E7EB", background: "#fff", color: "#374151", fontSize: 13, fontWeight: 600, cursor: "pointer" }}>Cancelar</button>
          </div>
        </div>
      </Card>

      {/* Tarjetas de proyectos */}
      <div style={{ padding: "0 0 8px" }}>
        <div style={{ position: "relative", maxWidth: 380, marginBottom: 16 }}>
          <span style={{ position: "absolute", left: 10, top: "50%", transform: "translateY(-50%)" }}><Icon name="search" size={15} color="#9CA3AF" /></span>
          <Input placeholder="Buscar por proyecto, cliente o unidad..." value={busq} onChange={e => setBusq(e.target.value)} style={{ paddingLeft: 32 }} />
        </div>
      </div>

      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(340px, 1fr))", gap: 16 }}>
        {filtrados.map(p => {
          const dias = diasEntre(p.fechaInicio, p.fechaFin);
          const dp = datosDeProyecto(p);
          const km = dp.km;
          const activo = !p.fechaFin;
          return (
            <Card key={p.id} style={{ borderTop: `3px solid ${activo ? "#3B82F6" : "#9CA3AF"}` }}>
              <div style={{ padding: "16px 18px" }}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 8, marginBottom: 12 }}>
                  <div>
                    <div style={{ fontSize: 16, fontWeight: 800, color: "var(--c-primario)" }}>{p.nombre}</div>
                    {p.cliente && <div style={{ fontSize: 12, color: "#6B7280", marginTop: 1 }}>{p.cliente}</div>}
                  </div>
                  <span style={{ padding: "3px 10px", borderRadius: 99, fontSize: 10, fontWeight: 700, background: activo ? "color-mix(in srgb, #3B82F6 12%, transparent)" : "#F1F5F9", color: activo ? "#3B82F6" : "#6B7280", whiteSpace: "nowrap" }}>
                    {activo ? "● EN CURSO" : "FINALIZADO"}
                  </span>
                </div>

                {/* Contadores: días y kilómetros del período */}
                <div style={{ display: "grid", gridTemplateColumns: km > 0 ? "1fr 1fr" : "1fr", gap: 10, marginBottom: dp.litros > 0 ? 6 : 12 }}>
                  <div style={{ padding: "10px 14px", background: "color-mix(in srgb, var(--c-primario) 5%, transparent)", borderRadius: 10 }}>
                    <div style={{ fontSize: 21, fontWeight: 800, color: "var(--c-primario)", lineHeight: 1.1 }}>{dias != null ? dias : "—"}</div>
                    <div style={{ fontSize: 12, color: "#6B7280", fontWeight: 600 }}>{dias === 1 ? "día" : "días"} {activo ? "en curso" : "trabajados"}</div>
                  </div>
                  <div title="Kilómetros de la unidad dentro del período del proyecto, calculados por odómetro (lectura más alta del período menos la última anterior)"
                    style={{ padding: "10px 14px", background: "color-mix(in srgb, var(--c-acento) 7%, transparent)", borderRadius: 10 }}>
                    <div style={{ fontSize: 21, fontWeight: 800, color: "var(--c-acento)", lineHeight: 1.1 }}>{km > 0 ? km.toLocaleString("es-AR") : "0"}</div>
                    <div style={{ fontSize: 12, color: "#6B7280", fontWeight: 600 }}>km recorridos</div>
                  </div>
                </div>

                {/* Combustible del proyecto, en letra chica */}
                {dp.litros > 0 && (
                  <div style={{ fontSize: 11, color: "#9CA3AF", marginBottom: 12, lineHeight: 1.5 }}>
                    {Math.round(dp.litros).toLocaleString("es-AR")} L
                    {dp.l100 > 0 && <> · <strong style={{ color: consumoColor(dp.l100, dp.ref) }}>{dp.l100.toFixed(1)} L/100km</strong>{dp.ref > 0 ? ` (ref. ${dp.ref})` : ""}</>}
                    {dp.pesos > 0 && <> · {fmt(dp.pesos)}</>}
                  </div>
                )}

                <div style={{ display: "grid", gap: 7, fontSize: 13 }}>
                  <div style={{ display: "flex", gap: 8 }}><span style={{ color: "#9CA3AF", minWidth: 76 }}>Unidad</span><span style={{ fontWeight: 600, color: "#111827" }}>{nombreVeh(p.vehiculo_id)}</span></div>
                  <div style={{ display: "flex", gap: 8 }}><span style={{ color: "#9CA3AF", minWidth: 76 }}>Conductor</span><span style={{ fontWeight: 600, color: "#111827" }}>{nombreCond(p.conductor_id)}</span></div>
                  <div style={{ display: "flex", gap: 8 }}><span style={{ color: "#9CA3AF", minWidth: 76 }}>Base</span><span style={{ color: "#374151" }}>{nombreBase(p.base_id)}</span></div>
                  {(p.origen || p.destino) && <div style={{ display: "flex", gap: 8 }}><span style={{ color: "#9CA3AF", minWidth: 76 }}>Ruta</span><span style={{ color: "#374151" }}>{p.origen || "—"} → {p.destino || "—"}</span></div>}
                  <div style={{ display: "flex", gap: 8 }}><span style={{ color: "#9CA3AF", minWidth: 76 }}>Período</span><span style={{ color: "#374151" }}>{fmtFecha(p.fechaInicio) || "—"} → {fmtFecha(p.fechaFin) || "en curso"}</span></div>
                  {p.observaciones && <div style={{ display: "flex", gap: 8 }}><span style={{ color: "#9CA3AF", minWidth: 76 }}>Notas</span><span style={{ color: "#374151" }}>{p.observaciones}</span></div>}
                </div>

                <div style={{ display: "flex", gap: 8, marginTop: 14, flexWrap: "wrap" }}>
                  {activo
                    ? <button onClick={() => finalizar(p)} style={{ padding: "7px 14px", borderRadius: 7, border: "none", background: "#16A34A", color: "#fff", fontSize: 12, fontWeight: 600, cursor: "pointer" }}>Finalizar hoy</button>
                    : <button onClick={() => reabrir(p)} style={{ padding: "7px 14px", borderRadius: 7, border: "1.5px solid #E5E7EB", background: "#fff", color: "#374151", fontSize: 12, fontWeight: 600, cursor: "pointer" }}>Reabrir</button>}
                  <button onClick={() => editar(p)} style={{ padding: "7px 14px", borderRadius: 7, border: "1.5px solid #E5E7EB", background: "#fff", color: "var(--c-primario)", fontSize: 12, fontWeight: 600, cursor: "pointer" }}>Editar</button>
                  <button onClick={() => eliminar(p)} style={{ padding: "7px 14px", borderRadius: 7, border: "1.5px solid #E5E7EB", background: "#fff", color: "#DC2626", fontSize: 12, fontWeight: 600, cursor: "pointer" }}>Eliminar</button>
                </div>
              </div>
            </Card>
          );
        })}
        {filtrados.length === 0 && (
          <Card><div style={{ padding: "32px 20px", textAlign: "center", color: "#9CA3AF", fontSize: 13 }}>
            {proyectos.length === 0 ? "Todavía no cargaste ningún proyecto. Completá el formulario de arriba para asignar la primera unidad." : "Ningún proyecto coincide con la búsqueda."}
          </div></Card>
        )}
      </div>
    </div>
  );
};

// ─── PERSONAL DE MANTENIMIENTO ────────────────────────────────────────────────
// Personal del taller por base: mecánicos, electricistas, gomería, etc.
// Se carga como los conductores, con costos y horas para el costeo de mano de obra.
const PERSONAL_VACIO = { nombre: "", dni: "", puesto: "Mecánico", base: "", horasDiagramadas: 0, horasExtras: 0, sueldo: 0, productividad: 0, estado: "activo" };
const PUESTOS = ["Mecánico", "Electricista", "Carrocero", "Gomería", "Lavadero", "Supervisor", "Administrativo", "Otro"];

const Personal = ({ personal, setPersonal, empresaActiva, bases }) => {
  const [modal, setModal] = useState(false);
  const [editId, setEditId] = useState(null);
  const [form, setForm] = useState(PERSONAL_VACIO);
  const [busq, setBusq] = useState("");

  useEffect(() => {
    if (modal && !editId) setForm({ ...PERSONAL_VACIO, base: (bases && bases[0] && bases[0].nombre) || "" });
  }, [modal, editId]);

  const cerrar = () => { setModal(false); setEditId(null); setForm(PERSONAL_VACIO); };

  const guardar = () => {
    if (!form.nombre.trim()) { alert("Poné el nombre y apellido."); return; }
    const reg = { ...form, horasDiagramadas: +form.horasDiagramadas || 0, horasExtras: +form.horasExtras || 0, sueldo: +form.sueldo || 0, productividad: +form.productividad || 0 };
    if (editId) setPersonal(prev => prev.map(p => mismoId(p.id, editId) ? { ...p, ...reg } : p));
    else setPersonal(prev => [...prev, { ...reg, id: Date.now(), empresa_id: empresaActiva }]);
    cerrar();
  };

  const editar = (p) => {
    setEditId(p.id);
    setForm({ nombre: p.nombre || "", dni: p.dni || "", puesto: p.puesto || "Mecánico", base: p.base || "",
              horasDiagramadas: p.horasDiagramadas || 0, horasExtras: p.horasExtras || 0,
              sueldo: p.sueldo || 0, productividad: p.productividad || 0, estado: p.estado || "activo" });
    setModal(true);
  };

  const importar = (filas) => {
    const nuevos = filas.filter(f => f.nombre).map((f, i) => ({
      ...f, id: Date.now() + Math.floor(Math.random() * 1000) + i, empresa_id: empresaActiva,
