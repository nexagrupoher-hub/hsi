    setForm({ patente: v.patente || "", vehiculo: v.vehiculo || "", marca: v.marca || "", modelo: v.modelo || "", año: v.año || 2024, km: v.km || 0, consumoRef: v.consumoRef || 0,
              estado: v.estado || "activo", tipo: v.tipo || "Camión", vencimientoVTV: v.vencimientoVTV || "", provinciaVTV: v.provinciaVTV || "", vencimientoVTV2: v.vencimientoVTV2 || "", provinciaVTV2: v.provinciaVTV2 || "",
              vencimientoSeguro: v.vencimientoSeguro || "", vencimientoOblea: v.vencimientoOblea || "", proyecto: v.proyecto || "", cliente: v.cliente || "", valor0km: v.valor0km || 0, empresa_id: v.empresa_id });
    setModal(true);
  };

  const alternar = (id) => setSel(p => p.includes(id) ? p.filter(x => x !== id) : [...p, id]);
  const idsVisibles = filtered.map(v => v.id);
  const todosTildados = idsVisibles.length > 0 && idsVisibles.every(id => sel.includes(id));
  const alternarTodos = () => setSel(todosTildados ? sel.filter(id => !idsVisibles.includes(id))
                                                   : [...new Set([...sel, ...idsVisibles])]);

  // suma de dependencias de todos los ids a borrar
  const depsDe = (ids) => {
    const tot = { mantenimiento: 0, servicios: 0, combustible: 0, gastos: 0, partes: 0 };
    ids.forEach(id => { const d = dependencias(id); Object.keys(tot).forEach(k => tot[k] += (d[k] || 0)); });
    return [
      { etiqueta: "órdenes de trabajo", cantidad: tot.mantenimiento },
      { etiqueta: "servicios", cantidad: tot.servicios },
      { etiqueta: "partes de servicio", cantidad: tot.partes },
      { etiqueta: "cargas de combustible", cantidad: tot.combustible },
      { etiqueta: "gastos", cantidad: tot.gastos },
    ];
  };

  const confirmarBorrado = (cascada) => {
    onEliminar(borrar.ids, cascada);
    setSel(p => p.filter(id => !borrar.ids.includes(id)));
    setBorrar(null);
  };

  const importar = (filas) => {
    const nuevos = filas.filter(f => f.patente).map(f => ({
      ...f, id: Date.now() + Math.random(), empresa_id: empresaActiva,
      año: f.año || 2024, km: f.km || 0, consumoRef: +f.consumoRef || 0,
    }));
    if (!nuevos.length) return { agregados: 0, errores: ["Ninguna fila tiene patente."] };
    setVehiculos(prev => [...prev, ...nuevos]);
    return { agregados: nuevos.length, errores: [] };
  };

  return (
    <div>
      <SectionHeader title="Vehículos" sub={`${vehiculos.length} unidades registradas`} action="Nuevo vehículo" onAction={() => setModal(true)}
        extra={<ImportarMasivo nombre="Vehículos" onImportar={importar}
          ejemplo={{ patente: "AC123DE", vehiculo: "24506", marca: "Mercedes-Benz", modelo: "Atego 1725", "año": "2021", km: "148320", consumoRef: "28", tipo: "Camión", estado: "activo", vencimientoVTV: "15/08/2026", vencimientoSeguro: "01/12/2026" }}
          columnas={[
            { campo: "patente", etiqueta: "Patente", tipo: "texto", requerido: true },
            { campo: "vehiculo", etiqueta: "N° interno", tipo: "texto", alias: ["interno", "numero interno", "nro interno", "unidad", "coche"] },
            { campo: "marca", etiqueta: "Marca", tipo: "texto" },
            { campo: "modelo", etiqueta: "Modelo", tipo: "texto" },
            { campo: "año", etiqueta: "Año", tipo: "numero", alias: ["anio", "ano"] },
            { campo: "km", etiqueta: "Kilometraje de alta", tipo: "numero", alias: ["km", "kilometros", "kilometraje", "km de alta"] },
            { campo: "consumoRef", etiqueta: "Consumo ref. (L/100km)", tipo: "numero", alias: ["consumo", "consumo referencia", "consumo ref", "l/100", "l100", "litros cada 100"] },
            { campo: "tipo", etiqueta: "Tipo", tipo: "opcion", opciones: ["Camión", "Furgón", "Van", "Pickup", "Colectivo", "Semirremolque"], porDefecto: "Camión" },
            { campo: "estado", etiqueta: "Estado", tipo: "opcion", opciones: ["activo", "inactivo", "mantenimiento"], porDefecto: "activo" },
            { campo: "vencimientoVTV", etiqueta: "Vencimiento VTV", tipo: "fecha", alias: ["vtv", "tecnica", "tecnica 1"] },
            { campo: "provinciaVTV", etiqueta: "Provincia técnica 1", tipo: "texto", alias: ["provincia vtv", "provincia tecnica"] },
            { campo: "vencimientoVTV2", etiqueta: "Vencimiento técnica 2", tipo: "fecha", alias: ["vtv 2", "tecnica 2", "segunda tecnica"] },
            { campo: "provinciaVTV2", etiqueta: "Provincia técnica 2", tipo: "texto", alias: ["provincia vtv 2", "provincia tecnica 2"] },
            { campo: "vencimientoSeguro", etiqueta: "Vencimiento Seguro", tipo: "fecha", alias: ["seguro"] },
            { campo: "vencimientoOblea", etiqueta: "Vencimiento Oblea", tipo: "fecha", alias: ["oblea", "obleas"] },
            { campo: "proyecto", etiqueta: "Proyecto", tipo: "texto", alias: ["obra", "estructura"] },
            { campo: "cliente", etiqueta: "Cliente", tipo: "texto", alias: ["empresa cliente"] },
            { campo: "valor0km", etiqueta: "Valor 0 km", tipo: "numero", alias: ["valor 0km", "valor reposicion", "valor de reposicion"] },
          ]} />} />
      <Card>
        <div style={{ padding: "12px 16px", borderBottom: "1px solid #F1F5F9", display: "flex", gap: 10 }}>
          <div style={{ position: "relative", flex: 1 }}>
            <span style={{ position: "absolute", left: 10, top: "50%", transform: "translateY(-50%)" }}><Icon name="search" size={15} color="#9CA3AF" /></span>
            <Input placeholder="Buscar por patente, interno, marca, modelo..." value={search} onChange={e => setSearch(e.target.value)} style={{ paddingLeft: 32 }} />
          </div>
        </div>
        {sel.length > 0 && (
          <BarraSeleccion cantidad={sel.length} etiqueta="vehículo" onLimpiar={() => setSel([])}
            onEliminar={() => setBorrar({ ids: sel })} />
        )}
        <Table headers={[
          <Check checked={todosTildados} indeterminate={!todosTildados && idsVisibles.some(id => sel.includes(id))} onChange={alternarTodos} title="Seleccionar todos" />,
          "Patente", "Interno", "Vehículo", "Tipo", "Conductor", "Odómetro", "Consumo ref.", "VTV", "Estado", "Acciones"]}>
          {filtered.map(v => {
            const diasVTV = daysUntil(v.vencimientoVTV);
            const diasVTV2 = v.vencimientoVTV2 ? daysUntil(v.vencimientoVTV2) : null;
            const odo = odometroActual(v, combustibleTodo);
            return (
              <TR key={v.id}>
                <TD><Check checked={sel.includes(v.id)} onChange={() => alternar(v.id)} /></TD>
                <TD bold>{v.patente}</TD>
                <TD>{v.vehiculo || <span style={{ color: "#CBD5E1" }}>—</span>}</TD>
                <TD>{v.marca} {v.modelo} ({v.año})</TD>
                <TD>{v.tipo}</TD>
                <TD>{(() => {
                  const a = asigVigenteDe(asigsV, v);
                  return a
                    ? <span style={{ fontSize: 12, fontWeight: 600 }} title="Se gestiona en App conductor → Asignación de unidades">{a.conductor}
                        <div style={{ fontSize: 10.5, color: "#9CA3AF", fontWeight: 400 }}>desde {fmtFecha(a.fechaInicio) || a.fechaInicio}</div></span>
                    : <span style={{ color: "#CBD5E1" }}>—</span>;
                })()}</TD>
                <TD>
                  <span title={`Calculado: la lectura más alta de las cargas de combustible. Kilometraje de alta: ${fmtKm(v.km)}`}>{fmtKm(odo)}</span>
                </TD>
                <TD>{consumoRefDe(v) > 0 ? <span>{consumoRefDe(v)} <span style={{ color: "#9CA3AF", fontSize: 11 }}>L/100km</span></span> : <span style={{ color: "#CBD5E1" }}>—</span>}</TD>
                {/* v1.1 — El valor 0 km es dato económico: se sacó de la vista general.
                    Se sigue cargando en la ficha del vehículo y lo usa Costos fijos. */}
                <TD>
                  <span style={{ color: diasVTV < 0 ? "#DC2626" : diasVTV < 30 ? "#F0A020" : "#16A34A", fontWeight: 600, fontSize: 12 }}>
                    {diasVTV < 0 ? `Vencida hace ${-diasVTV}d` : diasVTV < 30 ? `Vence en ${diasVTV}d` : (fmtFecha(v.vencimientoVTV) || v.vencimientoVTV)}{v.provinciaVTV ? ` · ${v.provinciaVTV}` : ""}
                  </span>
                  {diasVTV2 !== null && (
                    <div style={{ color: diasVTV2 < 0 ? "#DC2626" : diasVTV2 < 30 ? "#F0A020" : "#16A34A", fontWeight: 600, fontSize: 11.5 }}>
                      {diasVTV2 < 0 ? `Vencida hace ${-diasVTV2}d` : diasVTV2 < 30 ? `Vence en ${diasVTV2}d` : (fmtFecha(v.vencimientoVTV2) || v.vencimientoVTV2)}{v.provinciaVTV2 ? ` · ${v.provinciaVTV2}` : " · 2ª técnica"}
                    </div>
                  )}
                </TD>
                <TD><Badge estado={v.estado} /></TD>
                <TD>
                  <BotonIcono icono="edit" color="#6B7280" title="Editar vehículo" onClick={() => editar(v)} />
                  <BotonIcono icono="trash" color="#DC2626" title="Eliminar vehículo" onClick={() => setBorrar({ ids: [v.id] })} />
                </TD>
              </TR>
            );
          })}
          {filtered.length === 0 && (
            <tr><td colSpan={11} style={{ padding: "28px 14px", textAlign: "center", color: "#9CA3AF", fontSize: 13 }}>
              {vehiculos.length === 0 ? "Todavía no cargaste ningún vehículo." : "Ningún vehículo coincide con la búsqueda."}
            </td></tr>
          )}
        </Table>
      </Card>

      {borrar && (
        <ConfirmarBorrado
          titulo={borrar.ids.length > 1 ? `Eliminar ${borrar.ids.length} vehículos` : "Eliminar vehículo"}
          resumen={borrar.ids.length > 1
            ? `Vas a eliminar ${borrar.ids.length} vehículos de la flota. Esta acción no se puede deshacer.`
            : `Vas a eliminar el vehículo ${(vehiculos.find(v => mismoId(v.id, borrar.ids[0])) || {}).patente || ""} de la flota. Esta acción no se puede deshacer.`}
          dependencias={depsDe(borrar.ids)}
          etiquetaCascada="Eliminar también todos esos registros asociados"
          notaCascada="Si no los eliminás, quedarían huérfanos: sin vehículo al cual referir. Por eso hay que confirmarlo."
          onCancelar={() => setBorrar(null)}
          onConfirmar={confirmarBorrado} />
      )}

      {modal && (
        <Modal title={editId ? `Editar ${form.patente || "vehículo"}` : "Nuevo Vehículo"} onClose={cerrarModal}>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: "0 16px" }}>
            <Field label="Patente / Dominio"><Input placeholder="AH078EO" value={form.patente} onChange={e => setForm(p => ({ ...p, patente: e.target.value }))} /></Field>
            <Field label="N° interno"><Input placeholder="24506" value={form.vehiculo} onChange={e => setForm(p => ({ ...p, vehiculo: e.target.value }))} /></Field>
            <Field label="Tipo">
              <Select value={form.tipo} onChange={e => setForm(p => ({ ...p, tipo: e.target.value }))}>
                {["Camión", "Furgón", "Van", "Pickup", "Colectivo", "Semirremolque"].map(t => <option key={t}>{t}</option>)}
              </Select>
            </Field>
            <Field label="Marca"><Input placeholder="Mercedes-Benz" value={form.marca} onChange={e => setForm(p => ({ ...p, marca: e.target.value }))} /></Field>
            <Field label="Modelo"><Input placeholder="Atego 1725" value={form.modelo} onChange={e => setForm(p => ({ ...p, modelo: e.target.value }))} /></Field>
            <Field label="Año"><Input type="number" value={form.año} onChange={e => setForm(p => ({ ...p, año: e.target.value }))} /></Field>
            <div style={{ gridColumn: "span 2" }}>
              <Field label="Kilometraje de alta">
                <Input type="number" value={form.km} onChange={e => setForm(p => ({ ...p, km: e.target.value }))} />
                <div style={{ fontSize: 11, color: "#9CA3AF", marginTop: 4 }}>
                  El odómetro que tenía la unidad el día que entró al sistema. <strong>Se carga una sola vez y no se toca más</strong>:
                  de acá en adelante el odómetro lo mueven las cargas de combustible.
                  {editId && <> Odómetro calculado hoy: <strong>{fmtKm(odometroActual({ id: editId, km: +form.km || 0 }, combustibleTodo))}</strong>.</>}
                </div>
              </Field>
            </div>
            <div style={{ gridColumn: "span 2" }}>
              <Field label="Consumo de referencia (litros cada 100 km)">
                <Input type="number" step="0.1" min="0" placeholder="28" value={form.consumoRef} onChange={e => setForm(p => ({ ...p, consumoRef: e.target.value }))} />
                <div style={{ fontSize: 11, color: "#9CA3AF", marginTop: 4 }}>
                  Se carga a mano porque la flota es muy variada (un Mercedes 450 ronda los 28 L/100 km, una Iveco Daily los 17).
                  Con esto la app pinta el consumo real: verde hasta +5 %, ámbar hasta +20 %, rojo arriba de eso.
                </div>
              </Field>
            </div>
            <Field label="Vencimiento técnica 1 (VTV)"><Input type="date" value={toDateInput(form.vencimientoVTV)} onChange={e => setForm(p => ({ ...p, vencimientoVTV: e.target.value }))} /></Field>
              <Field label="Provincia técnica 1"><Input placeholder="ej: Neuquén" value={form.provinciaVTV} onChange={e => setForm(p => ({ ...p, provinciaVTV: e.target.value }))} /></Field>
              {/* v1.2 — hay unidades que hacen la técnica en dos provincias distintas */}
              <Field label="Vencimiento técnica 2 (otra provincia)"><Input type="date" value={toDateInput(form.vencimientoVTV2)} onChange={e => setForm(p => ({ ...p, vencimientoVTV2: e.target.value }))} /></Field>
              <Field label="Provincia técnica 2"><Input placeholder="ej: Río Negro" value={form.provinciaVTV2} onChange={e => setForm(p => ({ ...p, provinciaVTV2: e.target.value }))} /></Field>
            <Field label="Vencimiento Seguro"><Input type="date" value={toDateInput(form.vencimientoSeguro)} onChange={e => setForm(p => ({ ...p, vencimientoSeguro: e.target.value }))} /></Field>
            <Field label="Vencimiento Oblea"><Input type="date" value={toDateInput(form.vencimientoOblea)} onChange={e => setForm(p => ({ ...p, vencimientoOblea: e.target.value }))} /></Field>
            <Field label="Proyecto / Obra"><Input placeholder="Los Toldos 2 Este" value={form.proyecto} onChange={e => setForm(p => ({ ...p, proyecto: e.target.value }))} /></Field>
            <Field label="Cliente"><Input placeholder="Techint" value={form.cliente} onChange={e => setForm(p => ({ ...p, cliente: e.target.value }))} /></Field>
            <div style={{ gridColumn: "span 2" }}>
              <Field label="Valor 0 km (para depreciación)">
                <Input type="number" min="0" placeholder="185000000" value={form.valor0km} onChange={e => setForm(p => ({ ...p, valor0km: e.target.value }))} />
                <div style={{ fontSize: 11, color: "#9CA3AF", marginTop: 4 }}>Valor de reposición de una unidad nueva equivalente. Con esto el módulo Costos fijos calcula la depreciación mensual.</div>
              </Field>
            </div>
            <div style={{ gridColumn: "span 2" }}>
              <Field label="Estado">
                <Select value={form.estado} onChange={e => setForm(p => ({ ...p, estado: e.target.value }))}>
                  <option value="activo">Activo</option>
                  <option value="inactivo">Inactivo</option>
                  <option value="mantenimiento">En mantenimiento</option>
                </Select>
              </Field>
            </div>
          </div>
          <div style={{ display: "flex", gap: 10, justifyContent: "flex-end", marginTop: 8 }}>
            <button onClick={cerrarModal} style={{ padding: "9px 20px", borderRadius: 8, border: "1.5px solid #E5E7EB", background: "#fff", fontSize: 13, fontWeight: 600, cursor: "pointer", color: "#374151" }}>Cancelar</button>
            <button onClick={guardar} style={{ padding: "9px 20px", borderRadius: 8, border: "none", background: "var(--c-primario)", color: "#fff", fontSize: 13, fontWeight: 600, cursor: "pointer" }}>{editId ? "Guardar cambios" : "Guardar vehículo"}</button>
          </div>
        </Modal>
      )}
    </div>
  );
};

// ─── CONDUCTORES ──────────────────────────────────────────────────────────────
const Conductores = ({ conductores, setConductores, empresaActiva, dependencias, onEliminar }) => {
  const [modal, setModal] = useState(false);
  const [form, setForm] = useState({ nombre: "", dni: "", tel: "", licencia: "B1", vencLicencia: "", estado: "activo", empresa_id: 1 });

  const [editId, setEditId] = useState(null);
  const [sel, setSel] = useState([]);
  const [borrar, setBorrar] = useState(null);

  const cerrarModal = () => { setModal(false); setEditId(null); setForm({ nombre: "", dni: "", tel: "", licencia: "B1", vencLicencia: "", estado: "activo", empresa_id: 1 }); };

  const guardar = () => {
    if (editId) setConductores(prev => prev.map(c => mismoId(c.id, editId) ? { ...c, ...form } : c));
    else setConductores(prev => [...prev, { ...form, id: Date.now(), empresa_id: empresaActiva, viajesTotal: 0 }]);
    cerrarModal();
  };

  const editar = (c) => {
    setEditId(c.id);
    setForm({ nombre: c.nombre || "", dni: c.dni || "", tel: c.tel || "", licencia: c.licencia || "B1",
              vencLicencia: c.vencLicencia || "", estado: c.estado || "activo", empresa_id: c.empresa_id });
    setModal(true);
  };

  const alternar = (id) => setSel(p => p.includes(id) ? p.filter(x => x !== id) : [...p, id]);
  const ids = conductores.map(c => c.id);
  const todos = ids.length > 0 && ids.every(id => sel.includes(id));
  const alternarTodos = () => setSel(todos ? [] : ids);

  const depsDe = (lista) => {
    const tot = { servicios: 0, gastos: 0, partes: 0 };
    lista.forEach(id => { const d = dependencias(id); tot.servicios += d.servicios; tot.gastos += d.gastos; tot.partes += (d.partes || 0); });
    return [{ etiqueta: "servicios asignados", cantidad: tot.servicios }, { etiqueta: "partes de servicio", cantidad: tot.partes }, { etiqueta: "gastos registrados", cantidad: tot.gastos }];
  };

  const confirmarBorrado = () => {
    onEliminar(borrar.ids);
    setSel(p => p.filter(id => !borrar.ids.includes(id)));
    setBorrar(null);
  };

  const importar = (filas) => {
    const nuevos = filas.filter(f => f.nombre).map(f => ({ ...f, id: Date.now() + Math.random(), empresa_id: empresaActiva, viajesTotal: 0 }));
    if (!nuevos.length) return { agregados: 0, errores: ["Ninguna fila tiene nombre."] };
    setConductores(prev => [...prev, ...nuevos]);
    return { agregados: nuevos.length, errores: [] };
  };

  return (
    <div>
      <SectionHeader title="Conductores" sub={`${conductores.length} conductores registrados`} action="Nuevo conductor" onAction={() => setModal(true)}
        extra={<ImportarMasivo nombre="Conductores" onImportar={importar}
          ejemplo={{ nombre: "Carlos Mendez", dni: "28451234", tel: "+54 343 400-0000", licencia: "C1", vencLicencia: "15/03/2027", estado: "activo" }}
          columnas={[
            { campo: "nombre", etiqueta: "Nombre", tipo: "texto", requerido: true, alias: ["apellido y nombre", "nombre y apellido"] },
            { campo: "dni", etiqueta: "DNI", tipo: "texto", alias: ["documento", "nro doc.", "nro doc"] },
            { campo: "tel", etiqueta: "Teléfono", tipo: "texto", alias: ["telefono", "celular"] },
            { campo: "licencia", etiqueta: "Licencia", tipo: "texto", alias: ["categoria", "carnet", "nro licencia"] },
            { campo: "vencLicencia", etiqueta: "Vencimiento Licencia", tipo: "fecha", alias: ["vence licencia", "venc licencia", "fecha fin vigencia"] },
            { campo: "estado", etiqueta: "Estado", tipo: "opcion", opciones: ["activo", "inactivo", "suspendido"], porDefecto: "activo" },
          ]} />} />
      <Card>
        {sel.length > 0 && (
          <BarraSeleccion cantidad={sel.length} etiqueta="conductor" onLimpiar={() => setSel([])}
            onEliminar={() => setBorrar({ ids: sel })} />
        )}
        <Table headers={[
          <Check checked={todos} indeterminate={!todos && ids.some(id => sel.includes(id))} onChange={alternarTodos} title="Seleccionar todos" />,
          "Nombre", "DNI", "Teléfono", "Licencia", "Vence", "Servicios", "Estado", "Acciones"]}>
          {conductores.map(c => {
            const diasLic = daysUntil(c.vencLicencia);
            return (
              <TR key={c.id}>
                <TD><Check checked={sel.includes(c.id)} onChange={() => alternar(c.id)} /></TD>
                <TD bold>{c.nombre}</TD>
                <TD>{c.dni}</TD>
                <TD>{c.tel}</TD>
                <TD><span style={{ padding: "2px 8px", background: "color-mix(in srgb, var(--c-primario) 9%, transparent)", color: "var(--c-primario)", borderRadius: 6, fontSize: 12, fontWeight: 700 }}>{c.licencia}</span></TD>
                <TD><span style={{ color: diasLic < 0 ? "#DC2626" : diasLic < 60 ? "#F0A020" : "#374151", fontWeight: diasLic < 60 ? 600 : 400, fontSize: 12 }}>{diasLic < 0 ? "Vencida" : diasLic < 60 ? `${diasLic}d` : c.vencLicencia}</span></TD>
                <TD>{c.viajesTotal}</TD>
                <TD><Badge estado={c.estado} /></TD>
                <TD>
                  <BotonIcono icono="edit" color="#6B7280" title="Editar conductor" onClick={() => editar(c)} />
                  <BotonIcono icono="trash" color="#DC2626" title="Eliminar conductor" onClick={() => setBorrar({ ids: [c.id] })} />
                </TD>
              </TR>
            );
          })}
        </Table>
      </Card>

      {borrar && (
        <ConfirmarBorrado
          titulo={borrar.ids.length > 1 ? `Eliminar ${borrar.ids.length} conductores` : "Eliminar conductor"}
          resumen={borrar.ids.length > 1
            ? `Vas a eliminar ${borrar.ids.length} conductores. Esta acción no se puede deshacer.`
            : `Vas a eliminar a ${(conductores.find(c => mismoId(c.id, borrar.ids[0])) || {}).nombre || ""}. Esta acción no se puede deshacer.`}
          dependencias={depsDe(borrar.ids)}
          notaCascada="Esos registros no se borran: quedan sin conductor asignado, así no perdés el historial de servicios ni de gastos."
          onCancelar={() => setBorrar(null)}
          onConfirmar={confirmarBorrado} />
      )}

      {modal && (
        <Modal title={editId ? `Editar ${form.nombre || "conductor"}` : "Nuevo Conductor"} onClose={cerrarModal}>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: "0 16px" }}>
            <Field label="Nombre completo" ><Input placeholder="Juan Pérez" value={form.nombre} onChange={e => setForm(p => ({ ...p, nombre: e.target.value }))} /></Field>
            <Field label="DNI"><Input placeholder="28451234" value={form.dni} onChange={e => setForm(p => ({ ...p, dni: e.target.value }))} /></Field>
            <Field label="Teléfono"><Input placeholder="+54 11 1234-5678" value={form.tel} onChange={e => setForm(p => ({ ...p, tel: e.target.value }))} /></Field>
            <Field label="Clase de licencia">
              <Select value={form.licencia} onChange={e => setForm(p => ({ ...p, licencia: e.target.value }))}>
                {["B1", "B2", "C1", "C2", "D1", "D2", "D3", "E"].map(l => <option key={l}>{l}</option>)}
              </Select>
            </Field>
            <Field label="Vencimiento licencia"><Input type="date" value={toDateInput(form.vencLicencia)} onChange={e => setForm(p => ({ ...p, vencLicencia: e.target.value }))} /></Field>
            <Field label="Estado">
              <Select value={form.estado} onChange={e => setForm(p => ({ ...p, estado: e.target.value }))}>
                <option value="activo">Activo</option>
                <option value="suspendido">Suspendido</option>
                <option value="inactivo">Inactivo</option>
              </Select>
            </Field>
          </div>
          <div style={{ display: "flex", gap: 10, justifyContent: "flex-end", marginTop: 8 }}>
            <button onClick={cerrarModal} style={{ padding: "9px 20px", borderRadius: 8, border: "1.5px solid #E5E7EB", background: "#fff", fontSize: 13, fontWeight: 600, cursor: "pointer", color: "#374151" }}>Cancelar</button>
            <button onClick={guardar} style={{ padding: "9px 20px", borderRadius: 8, border: "none", background: "var(--c-primario)", color: "#fff", fontSize: 13, fontWeight: 600, cursor: "pointer" }}>{editId ? "Guardar cambios" : "Guardar conductor"}</button>
          </div>
        </Modal>
      )}
    </div>
  );
};

// ─── PARTES DE SERVICIO ───────────────────────────────────────────────────────
// Digitalización del "Parte Servicio Trabajado Personal" que hoy se llena a mano.
// Encabezado: proyecto, empresa (cliente), interno y dominio.
// Una fila por día: fecha, apellido y nombre, hora de entrada, hora de salida,
// km inicio, km final, detalle de la operación y firma del supervisor.
// La app calcula sola los km recorridos y las horas, y controla que el km de
// inicio siga al km final del parte anterior.
//
// v5 — El parte YA NO adelanta el odómetro de la unidad ni alimenta los KPI de
// kilómetros: el odómetro lo mueven únicamente las cargas de combustible.
// El parte sigue siendo la fuente de horas trabajadas, operador, firma y del
// papel que se imprime; sus km quedan como control interno del propio parte.
const PARTE_VACIO = {
  fecha: "", vehiculo_id: "", conductor_id: "", operador: "",
  proyecto: "", cliente: "", interno: "", dominio: "",
  horaEntrada: "", horaSalida: "", kmInicio: 0, kmFinal: 0,
  detalle: "", supervisor: "", firmado: "no",
};

// Detalles que más se repiten en el parte de papel (botones rápidos)
const DETALLES_RAPIDOS = ["Carga combustible", "Lavadero", "YPF", "Mecánicos", "Comercio", "Traslado de personal", "Contingencia"];

const Partes = ({ partes, setPartes, vehiculos, setVehiculos, conductores, proyectos, empresaActiva, combustibleTodo }) => {
  const [form, setForm] = useState(PARTE_VACIO);
  const [editId, setEditId] = useState(null);
  const [aviso, setAviso] = useState(null);
  const [filtroVeh, setFiltroVeh] = useState("");
  const [filtroMes, setFiltroMes] = useState("");
  const [busq, setBusq] = useState("");
  const avisar = (tipo, texto) => setAviso({ tipo, texto });

  const veh = vehiculos.find(v => mismoId(v.id, form.vehiculo_id)) || null;

  // Último parte cargado de una unidad (por fecha y, a igual fecha, mayor km final)
  const ultimoDe = (vehId, exceptoId) => [...partes]
    .filter(p => mismoId(p.vehiculo_id, vehId) && !mismoId(p.id, exceptoId) && p.fecha)
    .sort((a, b) => toDateInput(b.fecha).localeCompare(toDateInput(a.fecha)) || (Number(b.kmFinal) || 0) - (Number(a.kmFinal) || 0))[0] || null;

  // Al elegir unidad se completa el encabezado y el km de inicio encadenado
  const elegirUnidad = (id) => {
    const v = vehiculos.find(x => mismoId(x.id, id));
    const ult = ultimoDe(id, editId);
    const proy = (proyectos || []).filter(p => mismoId(p.vehiculo_id, id) && !p.fechaFin)
      .sort((a, b) => new Date(b.fechaInicio || 0) - new Date(a.fechaInicio || 0))[0];
    setForm(p => ({
      ...p,
      vehiculo_id: id,
      dominio: v ? (v.patente || "") : "",
      interno: v ? String(v.vehiculo || "") : "",
      proyecto: (proy && proy.nombre) || (v && v.proyecto) || p.proyecto || "",
      cliente: (proy && proy.cliente) || (v && v.cliente) || p.cliente || "",
      // Si no hay parte anterior se arranca del odómetro real de la unidad
      // (la lectura más alta de combustible), no del kilometraje de alta.
      kmInicio: ult ? (Number(ult.kmFinal) || 0) : (v ? odometroActual(v, combustibleTodo) : 0),
    }));
  };

  // Preselección de la primera unidad al abrir el módulo
  useEffect(() => {
    if (!editId && !form.vehiculo_id && vehiculos.length > 0) elegirUnidad(vehiculos[0].id);
  }, [vehiculos]);

  const elegirOperador = (val) => {
    if (val === "__otro__") { setForm(p => ({ ...p, conductor_id: "" })); return; }
    const c = conductores.find(x => mismoId(x.id, val));
    setForm(p => ({ ...p, conductor_id: val, operador: c ? c.nombre : p.operador }));
  };

  const kmRec = Math.max(0, (Number(form.kmFinal) || 0) - (Number(form.kmInicio) || 0));
  const horas = hsTrabajadas(form.horaEntrada, form.horaSalida);
  const ultParte = form.vehiculo_id ? ultimoDe(form.vehiculo_id, editId) : null;
  const saltoKm = ultParte ? (Number(form.kmInicio) || 0) - (Number(ultParte.kmFinal) || 0) : 0;

  const cancelar = () => {
    const v = form.vehiculo_id;
    setEditId(null);
    setForm({ ...PARTE_VACIO });
    if (v) setTimeout(() => elegirUnidad(v), 0);
  };

  const validar = () => {
    if (!form.vehiculo_id) return "Elegí la unidad del parte.";
    if (!toDateInput(form.fecha)) return "Cargá la fecha del parte.";
    if (!String(form.operador || "").trim()) return "Poné el apellido y nombre del operador.";
    if (aMinutos(form.horaEntrada) == null) return "La hora de entrada no es válida (usá HH:MM, por ejemplo 06:50).";
    if (aMinutos(form.horaSalida) == null) return "La hora de salida no es válida (usá HH:MM, por ejemplo 20:28).";
    const ini = Number(form.kmInicio) || 0, fin = Number(form.kmFinal) || 0;
    if (fin <= 0) return "Cargá el km final del día.";
    if (fin < ini) return "El km final no puede ser menor que el km de inicio.";
    if (fin - ini > 2000) return "La diferencia de kilómetros supera los 2.000 km en un día. Revisá el odómetro antes de guardar.";
    const dup = partes.find(p => mismoId(p.vehiculo_id, form.vehiculo_id) && toDateInput(p.fecha) === toDateInput(form.fecha) && !mismoId(p.id, editId));
    if (dup) return `Esa unidad ya tiene un parte cargado el ${fmtFecha(form.fecha)}. Editá esa fila en lugar de duplicarla.`;
    return null;
  };

  const guardar = (seguir) => {
    const err = validar();
    if (err) return avisar("error", err);
    const reg = {
      ...form,
      fecha: toDateInput(form.fecha),
      horaEntrada: hhmm(form.horaEntrada),
      horaSalida: hhmm(form.horaSalida),
      kmInicio: Number(form.kmInicio) || 0,
      kmFinal: Number(form.kmFinal) || 0,
      kmRecorridos: kmRec,
      horas: Math.round(horas * 100) / 100,
      operador: String(form.operador || "").trim(),
      conductor_id: form.conductor_id || null,
    };
    if (editId) {
      setPartes(prev => prev.map(p => mismoId(p.id, editId) ? { ...p, ...reg } : p));
      avisar("ok", `Parte del ${fmtFecha(reg.fecha)} actualizado.`);
    } else {
      setPartes(prev => [...prev, { ...reg, id: Date.now(), empresa_id: empresaActiva }]);
      avisar("ok", `Parte del ${fmtFecha(reg.fecha)} guardado · ${fmtKm(reg.kmRecorridos)} y ${fmtHoras(reg.horas)}.`);
    }
    // v5 — Acá antes se adelantaba el odómetro de la unidad al km final del
    // parte. Se sacó a propósito: el odómetro lo mueven SOLO las cargas de
    // combustible, y el campo km del vehículo es el kilometraje de alta.
    if (seguir) {
      // Encadena el día siguiente: misma unidad, mismo operador, km inicio = km final
      setEditId(null);
      setForm(p => ({
        ...p,
        fecha: sumarDias(reg.fecha, 1),
        kmInicio: reg.kmFinal,
        kmFinal: 0,
        horaEntrada: "", horaSalida: "", detalle: "",
      }));
    } else {
      cancelar();
    }
  };

  const editar = (p) => {
    setEditId(p.id);
    setForm({
      fecha: toDateInput(p.fecha), vehiculo_id: p.vehiculo_id || "", conductor_id: p.conductor_id || "",
      operador: p.operador || "", proyecto: p.proyecto || "", cliente: p.cliente || "",
      interno: p.interno || "", dominio: p.dominio || "", horaEntrada: hhmm(p.horaEntrada), horaSalida: hhmm(p.horaSalida),
      kmInicio: p.kmInicio || 0, kmFinal: p.kmFinal || 0, detalle: p.detalle || "",
      supervisor: p.supervisor || "", firmado: p.firmado || "no",
    });
    setAviso(null);
    if (typeof window !== "undefined") window.scrollTo({ top: 0, behavior: "smooth" });
  };

  const eliminar = (p) => {
    if (!window.confirm(`¿Borrar el parte del ${fmtFecha(p.fecha)} de ${p.operador || "esa unidad"}?`)) return;
    setPartes(prev => prev.filter(x => !mismoId(x.id, p.id)));
    if (mismoId(editId, p.id)) cancelar();
  };

  const firmar = (p) => setPartes(prev => prev.map(x => mismoId(x.id, p.id) ? { ...x, firmado: x.firmado === "si" ? "no" : "si" } : x));

  // ── Importación masiva ────────────────────────────────────────────────
  const porUnidad = (ref) => vehiculos.find(v => norm(v.patente) === norm(ref) || String(v.vehiculo || "") === String(ref || "").trim());

  const validarImport = (filas) => {
    const avs = [];
    const chicos = filas.filter(f => Number(f.kmFinal) > 0 && Number(f.kmFinal) < 1000).length;
    if (chicos) avs.push(`${chicos} fila(s) traen un km final menor a 1.000. Si el odómetro venía escrito con punto de miles ("78.251"), el archivo lo está leyendo dividido por mil: corregilo antes de importar.`);
    const sinHora = filas.filter(f => !f.horaEntrada || !f.horaSalida).length;
    if (sinHora) avs.push(`${sinHora} fila(s) no tienen hora de entrada o de salida: se van a guardar con 0 horas trabajadas.`);
    const sinUnidad = filas.filter(f => !porUnidad(f.unidad)).length;
    if (sinUnidad) avs.push(`${sinUnidad} fila(s) tienen una unidad que no existe en esta empresa: se van a omitir.`);
    return avs;
  };

  const importar = (filas) => {
    const errores = []; const nuevos = []; const base = Date.now();
    filas.forEach((f, i) => {
      const v = porUnidad(f.unidad);
      if (!v) { errores.push(`Fila ${i + 2}: la unidad "${f.unidad}" no existe en esta empresa.`); return; }
      const fecha = toDateInput(f.fecha);
      if (!fecha) { errores.push(`Fila ${i + 2}: la fecha está vacía o mal escrita.`); return; }
      if (partes.some(p => mismoId(p.vehiculo_id, v.id) && toDateInput(p.fecha) === fecha) ||
          nuevos.some(p => mismoId(p.vehiculo_id, v.id) && p.fecha === fecha)) {
        errores.push(`Fila ${i + 2}: ya hay un parte de ${v.patente} el ${fmtFecha(fecha)}.`); return;
      }
      const cond = conductores.find(c => norm(c.nombre) === norm(f.operador));
      const ini = Number(f.kmInicio) || 0, fin = Number(f.kmFinal) || 0;
      nuevos.push({
        id: base + i + 1, empresa_id: empresaActiva, vehiculo_id: v.id,
        conductor_id: cond ? cond.id : null, operador: String(f.operador || "").trim(),
        fecha, horaEntrada: hhmm(f.horaEntrada), horaSalida: hhmm(f.horaSalida),
        kmInicio: ini, kmFinal: fin, kmRecorridos: Math.max(0, fin - ini),
        horas: Math.round(hsTrabajadas(f.horaEntrada, f.horaSalida) * 100) / 100,
        detalle: f.detalle || "", supervisor: f.supervisor || "", firmado: "no",
        proyecto: f.proyecto || v.proyecto || "", cliente: f.cliente || v.cliente || "",
        interno: String(v.vehiculo || ""), dominio: v.patente || "",
      });
    });
    if (!nuevos.length) return { agregados: 0, errores: errores.length ? errores : ["No hay filas válidas."] };
    setPartes(prev => [...prev, ...nuevos]);
    // v5 — Tampoco acá se toca el odómetro de las unidades: lo mueven
    // únicamente las cargas de combustible.
    return { agregados: nuevos.length, errores };
  };

  // ── Listado filtrado ──────────────────────────────────────────────────
  const filtradas = partes
    .filter(p => !filtroVeh || mismoId(p.vehiculo_id, filtroVeh))
    .filter(p => !filtroMes || toDateInput(p.fecha).slice(0, 7) === filtroMes)
    .filter(p => {
      if (!busq) return true;
      const t = busq.toLowerCase();
      const v = vehiculos.find(x => mismoId(x.id, p.vehiculo_id));
      return (p.operador || "").toLowerCase().includes(t) || (p.detalle || "").toLowerCase().includes(t)
        || (v ? (v.patente || "").toLowerCase().includes(t) || String(v.vehiculo || "").includes(t) : false);
    })
    .sort((a, b) => toDateInput(a.fecha).localeCompare(toDateInput(b.fecha)));

  const totKm = filtradas.reduce((s, p) => s + (Number(p.kmRecorridos) || 0), 0);
  const totHs = filtradas.reduce((s, p) => s + (Number(p.horas) || 0), 0);
  const sinFirma = filtradas.filter(p => p.firmado !== "si").length;
  const operadores = [...new Set(filtradas.map(p => p.operador).filter(Boolean))];

  // ── Impresión con el formato del papel ────────────────────────────────
  const imprimir = () => {
    if (!filtradas.length) return avisar("error", "No hay partes en el filtro actual para imprimir.");
    const v = filtroVeh ? vehiculos.find(x => mismoId(x.id, filtroVeh)) : null;
    const enc = filtradas[0] || {};
    const esc = (s) => String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    const filasHtml = filtradas.map(p => {
      const ve = vehiculos.find(x => mismoId(x.id, p.vehiculo_id));
      return `<tr>
        <td>${esc(fmtFecha(p.fecha))}</td>
        <td class="izq">${esc(p.operador)}</td>
        <td>${esc(p.horaEntrada)}</td>
        <td>${esc(p.horaSalida)}</td>
        <td>${esc((Number(p.kmInicio) || 0).toLocaleString("es-AR"))}</td>
        <td>${esc((Number(p.kmFinal) || 0).toLocaleString("es-AR"))}</td>
        <td class="izq">${esc(p.detalle)}${filtroVeh ? "" : ` <small>(${esc(ve ? ve.patente : p.dominio)})</small>`}</td>
        <td></td>
      </tr>`;
    }).join("");
    const html = `<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8">
<title>Parte Servicio Trabajado Personal</title>
<style>
  @page { size: A4 portrait; margin: 12mm; }
  body { font-family: Arial, Helvetica, sans-serif; color: #000; font-size: 11px; }
  h1 { font-size: 15px; margin: 0 0 2px; letter-spacing: .5px; }
  .sub { font-size: 10px; color: #333; margin-bottom: 10px; }
  .enc { width: 100%; border-collapse: collapse; margin-bottom: 8px; }
  .enc td { border: 1px solid #000; padding: 4px 6px; font-size: 11px; }
  .enc .lab { background: #eee; font-weight: bold; width: 70px; }
  table.datos { width: 100%; border-collapse: collapse; }
  table.datos th, table.datos td { border: 1px solid #000; padding: 3px 4px; text-align: center; font-size: 10px; height: 20px; }
  table.datos th { background: #eee; font-size: 9px; text-transform: uppercase; }
  table.datos td.izq { text-align: left; }
  .tot { margin-top: 8px; font-size: 11px; font-weight: bold; }
  .firmas { margin-top: 34px; display: flex; gap: 40px; }
  .firmas div { flex: 1; border-top: 1px solid #000; padding-top: 3px; text-align: center; font-size: 9px; text-transform: uppercase; }
  @media print { .noprint { display: none; } }
  .noprint { margin-bottom: 12px; }
  .noprint button { padding: 8px 18px; font-size: 13px; cursor: pointer; }
</style></head><body>
<div class="noprint"><button onclick="window.print()">Imprimir</button></div>
<h1>PARTE SERVICIO TRABAJADO PERSONAL</h1>
<div class="sub">Servicios Industriales</div>
<table class="enc">
  <tr><td class="lab">PROYECTO</td><td>${esc(enc.proyecto || (v && v.proyecto) || "")}</td>
      <td class="lab">INTERNO</td><td>${esc(enc.interno || (v && v.vehiculo) || "")}</td></tr>
  <tr><td class="lab">EMPRESA</td><td>${esc(enc.cliente || (v && v.cliente) || "")}</td>
      <td class="lab">DOMINIO</td><td>${esc(v ? v.patente : (enc.dominio || "VARIAS UNIDADES"))}</td></tr>
</table>
<table class="datos">
  <thead><tr>
    <th>Fecha</th><th>Apellido y Nombre</th><th>Hora entrada</th><th>Hora salida</th>
    <th>Km inicio</th><th>Km final</th><th>Detalle operación realizada</th><th>Firma supervisor</th>
  </tr></thead>
  <tbody>${filasHtml}</tbody>
</table>
<div class="tot">Total del período: ${filtradas.length} día(s) · ${totKm.toLocaleString("es-AR")} km recorridos · ${Math.round(totHs)} horas trabajadas</div>
<div class="firmas"><div>Firma y aclaración operador unidad</div><div>Firma y aclaración supervisor</div></div>
</body></html>`;
    const w = window.open("", "_blank");
    if (!w) return avisar("error", "El navegador bloqueó la ventana de impresión. Permití las ventanas emergentes de este sitio.");
    w.document.write(html);
    w.document.close();
  };

  // ── Continuidad de odómetro en el listado ─────────────────────────────
  const cortes = {};
  vehiculos.forEach(v => {
    const suyos = filtradas.filter(p => mismoId(p.vehiculo_id, v.id));
    suyos.forEach((p, i) => {
      if (i === 0) return;
      const prev = suyos[i - 1];
      const d = (Number(p.kmInicio) || 0) - (Number(prev.kmFinal) || 0);
      if (d !== 0) cortes[String(p.id)] = d;
    });
  });

  return (
    <div>
      <SectionHeader title="Partes de servicio" sub={`${partes.length} parte(s) cargado(s) · el papel, pero con los km y las horas calculados solos`}
        extra={<div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
          <button onClick={imprimir} title="Imprimir el filtro actual con el formato del parte de papel"
            style={{ display: "flex", alignItems: "center", gap: 6, padding: "9px 16px", background: "#fff", color: "var(--c-primario)", border: "1.5px solid #E5E7EB", borderRadius: 8, fontSize: 13, fontWeight: 600, cursor: "pointer" }}>
            <Icon name="print" size={16} color="var(--c-primario)" /> Imprimir
          </button>
          <ImportarMasivo nombre="Partes de servicio" onImportar={importar} validar={validarImport}
            ayuda={<>Subí los partes viejos en CSV o Excel. La <strong>unidad</strong> puede ser la patente o el número interno. Las horas van como <strong>HH:MM</strong> y los kilómetros <strong>sin punto de miles</strong>.</>}
            ejemplo={{ fecha: "16/07/2026", operador: "Vizcaino Melanie", unidad: "24506", horaEntrada: "06:50", horaSalida: "20:28", kmInicio: "78251", kmFinal: "78346", detalle: "YPF", proyecto: "Los Toldos 2 Este", cliente: "Techint", supervisor: "" }}
            columnas={[
              { campo: "fecha", etiqueta: "Fecha", tipo: "fecha", requerido: true },
              { campo: "operador", etiqueta: "Apellido y nombre", tipo: "texto", requerido: true, alias: ["operador", "chofer", "conductor", "nombre"] },
              { campo: "unidad", etiqueta: "Unidad (patente o interno)", tipo: "texto", requerido: true, alias: ["patente", "dominio", "interno", "unidad"] },
              { campo: "horaEntrada", etiqueta: "Hora entrada", tipo: "hora", alias: ["hora entrada", "entrada", "hs entrada"] },
              { campo: "horaSalida", etiqueta: "Hora salida", tipo: "hora", alias: ["hora salida", "salida", "hs salida"] },
              { campo: "kmInicio", etiqueta: "Km inicio", tipo: "numero", alias: ["km inicio", "km inicial", "odometro inicio"] },
              { campo: "kmFinal", etiqueta: "Km final", tipo: "numero", alias: ["km final", "km fin", "odometro final"] },
              { campo: "detalle", etiqueta: "Detalle operación", tipo: "texto", alias: ["detalle", "operacion", "detalle operacion realizada", "observaciones"] },
              { campo: "proyecto", etiqueta: "Proyecto", tipo: "texto", alias: ["obra"] },
              { campo: "cliente", etiqueta: "Empresa / Cliente", tipo: "texto", alias: ["empresa", "cliente"] },
              { campo: "supervisor", etiqueta: "Supervisor", tipo: "texto", alias: ["firma supervisor"] },
            ]} />
        </div>} />

      {aviso && <Aviso tipo={aviso.tipo}>{aviso.texto}</Aviso>}

      {/* ── Carga del parte, con el mismo orden que el papel ── */}
      <Card style={{ marginBottom: 20 }}>
        <div style={{ padding: "18px 20px 4px" }}>
          <div style={{ fontSize: 13, fontWeight: 700, color: "var(--c-primario)", marginBottom: 14 }}>
            {editId ? `Modificar el parte del ${fmtFecha(form.fecha) || "día"}` : "Cargar un día del parte"}
          </div>

          {/* Encabezado del parte */}
          <div style={{ display: "grid", gridTemplateColumns: "repeat(4, 1fr)", gap: "0 14px" }}>
            <Field label="Unidad">
              <Select value={form.vehiculo_id} onChange={e => elegirUnidad(e.target.value)}>
                <option value="">— Elegí la unidad —</option>
                {vehiculos.map(v => <option key={v.id} value={v.id}>{v.vehiculo ? v.vehiculo + " · " : ""}{v.patente} — {v.marca} {v.modelo}</option>)}
              </Select>
            </Field>
            <Field label="Interno"><Input placeholder="24506" value={form.interno} onChange={e => setForm(p => ({ ...p, interno: e.target.value }))} /></Field>
            <Field label="Dominio"><Input placeholder="AH078EO" value={form.dominio} onChange={e => setForm(p => ({ ...p, dominio: e.target.value }))} /></Field>
            <Field label="Empresa / Cliente"><Input placeholder="Techint" value={form.cliente} onChange={e => setForm(p => ({ ...p, cliente: e.target.value }))} /></Field>
            <div style={{ gridColumn: "span 2" }}>
              <Field label="Proyecto"><Input placeholder="Los Toldos 2 Este" value={form.proyecto} onChange={e => setForm(p => ({ ...p, proyecto: e.target.value }))} /></Field>
            </div>
            <div style={{ gridColumn: "span 2" }}>
              <Field label="Supervisor que firma"><Input placeholder="Apellido del supervisor" value={form.supervisor} onChange={e => setForm(p => ({ ...p, supervisor: e.target.value }))} /></Field>
            </div>
          </div>

          <div style={{ height: 1, background: "#F1F5F9", margin: "2px 0 16px" }} />

          {/* Fila del día */}
          <div style={{ display: "grid", gridTemplateColumns: "repeat(4, 1fr)", gap: "0 14px" }}>
            <Field label="Fecha"><Input type="date" value={toDateInput(form.fecha)} onChange={e => setForm(p => ({ ...p, fecha: e.target.value }))} /></Field>
            <div style={{ gridColumn: "span 2" }}>
              <Field label="Apellido y nombre">
                <Select value={form.conductor_id || "__otro__"} onChange={e => elegirOperador(e.target.value)}>
                  {conductores.map(c => <option key={c.id} value={c.id}>{c.nombre}</option>)}
                  <option value="__otro__">— Otro / escribir a mano —</option>
                </Select>
                {!form.conductor_id && (
                  <Input placeholder="Vizcaino Melanie" value={form.operador} onChange={e => setForm(p => ({ ...p, operador: e.target.value }))} style={{ marginTop: 8 }} />
                )}
              </Field>
            </div>
            <Field label="Firma del supervisor">
              <Select value={form.firmado} onChange={e => setForm(p => ({ ...p, firmado: e.target.value }))}>
                <option value="no">Sin firmar</option>
                <option value="si">Firmado</option>
              </Select>
            </Field>

            <Field label="Hora entrada"><Input type="time" value={hhmm(form.horaEntrada)} onChange={e => setForm(p => ({ ...p, horaEntrada: e.target.value }))} /></Field>
            <Field label="Hora salida"><Input type="time" value={hhmm(form.horaSalida)} onChange={e => setForm(p => ({ ...p, horaSalida: e.target.value }))} /></Field>
            <Field label="Km inicio">
              <Input type="number" min="0" value={form.kmInicio} onChange={e => setForm(p => ({ ...p, kmInicio: e.target.value }))} />
              {ultParte && (
                <div style={{ fontSize: 11, color: saltoKm === 0 ? "#16A34A" : "#F0A020", marginTop: 4, fontWeight: 600 }}>
                  {saltoKm === 0
                    ? `Encadena con el parte del ${fmtFecha(ultParte.fecha)} ✓`
                    : `${saltoKm > 0 ? "Faltan" : "Se superponen"} ${Math.abs(saltoKm).toLocaleString("es-AR")} km respecto del parte del ${fmtFecha(ultParte.fecha)} (cerró en ${(Number(ultParte.kmFinal) || 0).toLocaleString("es-AR")})`}
                </div>
              )}
            </Field>
            <Field label="Km final"><Input type="number" min="0" value={form.kmFinal} onChange={e => setForm(p => ({ ...p, kmFinal: e.target.value }))} /></Field>
          </div>

          <Field label="Detalle de la operación realizada">
            <Input placeholder="Carga combustible / Lavadero / Traslado de personal" value={form.detalle} onChange={e => setForm(p => ({ ...p, detalle: e.target.value }))} />
            <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginTop: 8 }}>
              {DETALLES_RAPIDOS.map(d => (
                <button key={d} onClick={() => setForm(p => ({ ...p, detalle: p.detalle ? p.detalle + " / " + d : d }))}
                  style={{ padding: "4px 10px", borderRadius: 99, border: "1.5px solid #E5E7EB", background: "#fff", color: "#6B7280", fontSize: 11, fontWeight: 600, cursor: "pointer" }}>
                  + {d}
                </button>
              ))}
            </div>
          </Field>

          {/* Lo que calcula el sistema */}
          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(150px, 1fr))", gap: 10, marginBottom: 16 }}>
            <DatoPanel etiqueta="Km recorridos" valor={kmRec > 0 ? fmtKm(kmRec) : "—"} color="var(--c-primario)" />
            <DatoPanel etiqueta="Horas trabajadas" valor={fmtHoras(horas)} color="var(--c-acento)" />
            <DatoPanel etiqueta="Promedio del día" valor={horas > 0 && kmRec > 0 ? Math.round(kmRec / horas) + " km/h" : "—"} />
            <DatoPanel etiqueta="Odómetro de la unidad" valor={veh ? fmtKm(veh.km) : "—"} />
          </div>

          <div style={{ display: "flex", gap: 10, marginBottom: 18, flexWrap: "wrap" }}>
            <button onClick={() => guardar(false)} style={{ padding: "9px 22px", borderRadius: 8, border: "none", background: "var(--c-primario)", color: "#fff", fontSize: 13, fontWeight: 600, cursor: "pointer" }}>{editId ? "Actualizar parte" : "Guardar parte"}</button>
            {!editId && (
              <button onClick={() => guardar(true)} title="Guarda este día y deja listo el día siguiente con el km encadenado"
                style={{ padding: "9px 22px", borderRadius: 8, border: "none", background: "var(--c-acento)", color: "#fff", fontSize: 13, fontWeight: 600, cursor: "pointer" }}>Guardar y seguir con el día siguiente</button>
            )}
            <button onClick={cancelar} style={{ padding: "9px 22px", borderRadius: 8, border: "1.5px solid #E5E7EB", background: "#fff", color: "#374151", fontSize: 13, fontWeight: 600, cursor: "pointer" }}>Cancelar</button>
          </div>
        </div>
      </Card>

      {/* ── KPIs del filtro ── */}
      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(180px, 1fr))", gap: 16, marginBottom: 20 }}>
        <KpiCard label="Partes en el filtro" value={filtradas.length} icon="parte" color="var(--c-primario)" sub={`${operadores.length} operador(es)`} />
        <KpiCard label="Km recorridos" value={totKm > 0 ? fmtKm(totKm) : "—"} icon="truck" color="#3B82F6" sub={filtradas.length ? Math.round(totKm / filtradas.length).toLocaleString("es-AR") + " km por día" : ""} />
        <KpiCard label="Horas trabajadas" value={totHs > 0 ? Math.round(totHs).toLocaleString("es-AR") + " h" : "—"} icon="reloj" color="#0891B2" sub={filtradas.length ? (totHs / filtradas.length).toFixed(1) + " h por día" : ""} />
        <KpiCard label="Sin firma del supervisor" value={sinFirma} icon="alert" color={sinFirma > 0 ? "#DC2626" : "#16A34A"} sub={sinFirma > 0 ? "partes pendientes de firma" : "todos firmados"} />
      </div>

      {/* ── Listado ── */}
      <Card>
        <div style={{ padding: "12px 16px", borderBottom: "1px solid #F1F5F9", display: "grid", gridTemplateColumns: "1.4fr 1fr 1fr", gap: 10 }}>
          <div style={{ position: "relative" }}>
            <span style={{ position: "absolute", left: 10, top: "50%", transform: "translateY(-50%)" }}><Icon name="search" size={15} color="#9CA3AF" /></span>
            <Input placeholder="Buscar por operador, unidad o detalle..." value={busq} onChange={e => setBusq(e.target.value)} style={{ paddingLeft: 32 }} />
          </div>
          <Select value={filtroVeh} onChange={e => setFiltroVeh(e.target.value)}>
            <option value="">Todas las unidades</option>
            {vehiculos.map(v => <option key={v.id} value={v.id}>{v.vehiculo ? v.vehiculo + " · " : ""}{v.patente}</option>)}
          </Select>
          <Input type="month" value={filtroMes} onChange={e => setFiltroMes(e.target.value)} />
        </div>
        <Table headers={["Fecha", "Apellido y nombre", "Unidad", "Entrada", "Salida", "Km inicio", "Km final", "Km rec.", "Horas", "Detalle", "Firma", "Acciones"]}>
          {filtradas.map(p => {
            const v = vehiculos.find(x => mismoId(x.id, p.vehiculo_id));
            const corte = cortes[String(p.id)];
            return (
              <TR key={p.id}>
                <TD bold>{fmtFecha(p.fecha)}</TD>
                <TD>{p.operador || "—"}</TD>
                <TD>{v ? (v.vehiculo ? v.vehiculo + " · " + v.patente : v.patente) : (p.dominio || "—")}</TD>
                <TD>{p.horaEntrada || "—"}</TD>
                <TD>{p.horaSalida || "—"}</TD>
                <TD>
                  {(Number(p.kmInicio) || 0).toLocaleString("es-AR")}
                  {corte ? <span title={`No encadena con el parte anterior: ${corte > 0 ? "faltan" : "se superponen"} ${Math.abs(corte)} km`}
                    style={{ marginLeft: 6, padding: "1px 6px", borderRadius: 99, background: "#FEF3C7", color: "#B45309", fontSize: 10, fontWeight: 700 }}>
                    {corte > 0 ? "+" : ""}{corte}
                  </span> : null}
                </TD>
                <TD>{(Number(p.kmFinal) || 0).toLocaleString("es-AR")}</TD>
                <TD bold>{fmtKm(p.kmRecorridos)}</TD>
                <TD>{fmtHoras(p.horas)}</TD>
                <TD>{p.detalle || <span style={{ color: "#CBD5E1" }}>—</span>}</TD>
                <TD>
                  <button onClick={() => firmar(p)} title="Marcar / desmarcar la firma del supervisor"
                    style={{ padding: "2px 9px", borderRadius: 99, border: "none", cursor: "pointer", fontSize: 11, fontWeight: 700,
                             background: p.firmado === "si" ? "#DCFCE7" : "#F1F5F9", color: p.firmado === "si" ? "#15803D" : "#6B7280" }}>
                    {p.firmado === "si" ? "Firmado" : "Sin firma"}
                  </button>
                </TD>
                <TD>
                  <BotonIcono icono="edit" color="#6B7280" title="Editar parte" onClick={() => editar(p)} />
                  <BotonIcono icono="trash" color="#DC2626" title="Eliminar parte" onClick={() => eliminar(p)} />
                </TD>
              </TR>
            );
          })}
          {filtradas.length === 0 && (
            <tr><td colSpan={12} style={{ padding: "28px 14px", textAlign: "center", color: "#9CA3AF", fontSize: 13 }}>
              {partes.length === 0 ? "Todavía no cargaste ningún parte de servicio. Completá el formulario de arriba o usá la carga masiva." : "Ningún parte coincide con el filtro."}
            </td></tr>
          )}
        </Table>
      </Card>
    </div>
  );
};

// ─── MANTENIMIENTO ────────────────────────────────────────────────────────────
// Tres clases de trabajo, que son las que mira el mantenimiento de flota:
//   · PREVENTIVO          — el plan, lo programado
//   · CORRECTIVO          — la rotura reparada en taller
//   · CORRECTIVA EN RUTA  — la falla en servicio: el auxilio, el coche que no sale
// La clase no es una columna nueva en la Hoja: se declara adentro del "Tipo de
// trabajo", que es lo que los asesores ya completan. Así no hay que tocar el
// conector ni migrar lo que ya está cargado.
const CLASES_OT = [
  { id: "preventivo", label: "Preventivo", corto: "Prev.", prefijo: "Preventivo", color: "#16A34A" },
  { id: "correctivo", label: "Correctivo", corto: "Corr.", prefijo: "Correctivo", color: "#F0A020" },
  { id: "ruta", label: "Correctiva en ruta", corto: "En ruta", prefijo: "Contingencia", color: "#DC2626" },
];
const claseCfg = (id) => CLASES_OT.find(c => c.id === id) || CLASES_OT[1];

// ¿La OT declara su clase en el texto? (si no, se cuenta como correctiva pero se avisa)
const claseDeclarada = (m) => {
  const t = sinAcentos((m && m.tipo) || "") + " " + sinAcentos((m && m.descripcion) || "");
  return /contingencia|auxilio|rescate|en ruta|remolque|grua|falla en servicio|averia en servicio|preventiv|correctiv|service|programad|plan de mant|engrase|lubricacion|inspeccion periodica|revision periodica/.test(t);
};

const claseDeOT = (m) => {
  const t = sinAcentos((m && m.tipo) || "") + " " + sinAcentos((m && m.descripcion) || "");
  if (/contingencia|auxilio|rescate|en ruta|remolque|grua|falla en servicio|averia en servicio/.test(t)) return "ruta";
  if (/preventiv|service|programad|plan de mant|engrase|lubricacion|inspeccion periodica|revision periodica/.test(t)) return "preventivo";
  return "correctivo";
};

// Escribe la clase adentro del tipo de trabajo, sin repetirla si ya está
const conClase = (tipo, claseId) => {
  const cfg = claseCfg(claseId);
  const limpio = String(tipo || "").trim();
  if (!limpio) return cfg.prefijo;
  if (claseDeOT({ tipo: limpio }) === claseId && claseDeclarada({ tipo: limpio })) return limpio;
  return cfg.prefijo + " — " + limpio;
};

const Mantenimiento = ({ mantenimiento, setMantenimiento, vehiculos, empresaActiva, partes, combustible, combustibleTodo, desde, hasta }) => {
  const [modal, setModal] = useState(false);
  const [vista, setVista] = useState("unidades");   // "unidades" | "listado"
  const [filtroClase, setFiltroClase] = useState("");
  const [busq, setBusq] = useState("");
  const [form, setForm] = useState({ vehiculo_id: "", clase: "preventivo", tipo: "", descripcion: "", fecha: "", costo: 0, km: 0, estado: "programado", taller: "", empresa_id: 1 });
  const [editId, setEditId] = useState(null);   // v8.6: id de la OT que se está editando

  useEffect(() => {
    if (modal && editId == null) {
      setForm({ vehiculo_id: vehiculos[0]?.id ?? "", clase: "preventivo", tipo: "", descripcion: "", fecha: "", costo: 0, km: 0, estado: "programado", taller: "", empresa_id: empresaActiva });
    }
  }, [modal, vehiculos, empresaActiva]);

  // v8.6: abre el modal con los datos de una OT existente (sirve también para
  // las novedades de la app conductor: se les puede asignar unidad, costo, etc.)
  const abrirEdicion = (m) => {
    const clase = claseDeOT(m);
    const tipoLimpio = String(m.tipo || "").replace(/^(Preventivo|Correctivo|Contingencia)\s*—\s*/i, "");
    // v8.6.2: si la unidad vino como patente o interno, se resuelve al id real
    let vid = m.vehiculo_id ?? "";
    if (vid !== "" && !vehiculos.some(v => mismoId(v.id, vid))) {
      const vv = buscarVehiculo(vid, vehiculos);
      vid = vv ? vv.id : "";
    }
    setForm({ vehiculo_id: vid, clase, tipo: tipoLimpio, descripcion: m.descripcion || "",
              fecha: toDateInput(m.fecha), costo: Number(m.costo) || 0, km: Number(m.km) || 0,
              estado: m.estado || "programado", taller: m.taller || "", empresa_id: m.empresa_id ?? empresaActiva });
    setEditId(m.id);
    setModal(true);
  };
  const cerrarModal = () => { setModal(false); setEditId(null); };

  // v8.6: avance rápido de estado, mismos pasos que ve el chofer en su app
  const avanzarEstado = (m) => {
    const e = String(m.estado || "programado").toLowerCase();
    const nuevo = /progres|proceso|curso/.test(e) ? "completado" : "en_progreso";
    setMantenimiento(prev => prev.map(x => mismoId(x.id, m.id) ? { ...x, estado: nuevo } : x));
  };

  const guardar = () => {
    if (!form.vehiculo_id || !vehiculos.some(v => mismoId(v.id, form.vehiculo_id))) {
      alert("Elegí un vehículo antes de registrar la OT.");
      return;
    }
    if (!String(form.tipo).trim()) { alert("Poné el tipo de trabajo."); return; }
    const reg = { ...form, tipo: conClase(form.tipo, form.clase), id: Date.now(), empresa_id: empresaActiva, vehiculo_id: form.vehiculo_id, costo: +form.costo || 0, km: +form.km || 0 };
    delete reg.clase;   // la clase viaja adentro del tipo, no es columna de la Hoja
    if (editId != null) {
      // edición: conserva id y empresa de la OT original
      setMantenimiento(prev => prev.map(x => mismoId(x.id, editId) ? { ...x, ...reg, id: x.id, empresa_id: x.empresa_id ?? reg.empresa_id } : x));
    } else {
      setMantenimiento(prev => [...prev, reg]);
    }
    cerrarModal();
  };

  const porPatente = (pat) => vehiculos.find(v => (v.patente || "").toUpperCase().replace(/\s/g, "") === String(pat || "").toUpperCase().replace(/\s/g, "") || String(v.vehiculo || "") === String(pat || "").trim());

  const validarImport = (filas) => {
    const avs = [];
    const chicos = filas.filter(f => Number(f.km) > 0 && Number(f.km) < 1000).length;
    if (chicos) avs.push(`${chicos} fila(s) traen un kilometraje menor a 1.000. Si el odómetro venía con punto de miles ("446.000"), se está leyendo dividido por mil.`);
    const sinClase = filas.filter(f => !f.clase && !claseDeclarada(f)).length;
    if (sinClase) avs.push(`${sinClase} fila(s) no declaran si son preventivas, correctivas o en ruta: se van a contar como CORRECTIVAS. Si querés, agregá una columna "Clase" con preventivo / correctivo / ruta.`);
    return avs;
  };

  const importar = (filas) => {
    const errores = []; const nuevos = [];
    const base = Date.now();
    filas.forEach((f, i) => {
      const veh = porPatente(f.patente);
      if (!veh) { errores.push(`Fila ${i + 2}: la patente "${f.patente}" no existe en esta empresa.`); return; }
      var tipo = f.tipo;
      if (f.clase) {
        const idc = sinAcentos(f.clase);
        const cls = /ruta|conting|auxilio|rescate/.test(idc) ? "ruta" : /prevent/.test(idc) ? "preventivo" : /correct/.test(idc) ? "correctivo" : null;
        if (cls) tipo = conClase(f.tipo, cls);
      }
      const reg = { ...f, tipo: tipo, id: base + i + 1, empresa_id: empresaActiva, vehiculo_id: veh.id, costo: +f.costo || 0, km: +f.km || 0 };
      delete reg.clase;
      nuevos.push(reg);
    });
    if (!nuevos.length) return { agregados: 0, errores: errores.length ? errores : ["No hay filas válidas."] };
    setMantenimiento(prev => [...prev, ...nuevos]);
    return { agregados: nuevos.length, errores };
  };

  // ── Km de una unidad en el período: SOLO odómetro (motor único) ──────────
  const kmDeUnidad = (v) => kmUnidadRango(v, combustibleTodo || combustible, desde, hasta);

  // ── Resumen por unidad (según dominio) ──────────────────────────────────
  const filas = vehiculos.map(v => {
    const suyas = mantenimiento.filter(m => mismoId(m.vehiculo_id, v.id));
    const cuenta = { preventivo: 0, correctivo: 0, ruta: 0 };
    const pesos = { preventivo: 0, correctivo: 0, ruta: 0 };
    suyas.forEach(m => {
      const c = claseDeOT(m);
      cuenta[c]++;
      pesos[c] += Number(m.costo) || 0;
    });
    const total = suyas.length;
    const costo = pesos.preventivo + pesos.correctivo + pesos.ruta;
    const km = kmDeUnidad(v);
    return {
      v, total, cuenta, pesos, costo, km,
      pctPrev: total > 0 ? Math.round(cuenta.preventivo / total * 100) : 0,
      kmEntreFallas: cuenta.ruta > 0 && km > 0 ? Math.round(km / cuenta.ruta) : 0,
      sinDeclarar: suyas.filter(m => !claseDeclarada(m)).length,
    };
  }).filter(f => f.total > 0 || !busq)
    .filter(f => !busq || (f.v.patente || "").toLowerCase().includes(busq.toLowerCase()) || String(f.v.vehiculo || "").includes(busq))
    .sort((a, b) => b.cuenta.ruta - a.cuenta.ruta || b.total - a.total);

  const tot = { preventivo: 0, correctivo: 0, ruta: 0 };
  mantenimiento.forEach(m => { tot[claseDeOT(m)]++; });
  const totalCostos = mantenimiento.reduce((s, m) => s + (Number(m.costo) || 0), 0);
  const sinDeclararTotal = mantenimiento.filter(m => !claseDeclarada(m)).length;
  const pctPrevFlota = mantenimiento.length ? Math.round(tot.preventivo / mantenimiento.length * 100) : 0;

  const listado = mantenimiento
    .filter(m => !filtroClase || claseDeOT(m) === filtroClase)
    .filter(m => {
      if (!busq) return true;
      const t = busq.toLowerCase();
      const v = vehiculos.find(x => mismoId(x.id, m.vehiculo_id));
      return (m.tipo || "").toLowerCase().includes(t) || (m.taller || "").toLowerCase().includes(t) ||
        (v ? (v.patente || "").toLowerCase().includes(t) || String(v.vehiculo || "").includes(t) : false);
    })
    .sort((a, b) => toDateInput(b.fecha).localeCompare(toDateInput(a.fecha)));

  return (
    <div>
      <SectionHeader title="Mantenimiento" sub={`${mantenimiento.length} OT · ${fmt(totalCostos)} invertidos · ${pctPrevFlota}% preventivo`} action="Registrar OT" onAction={() => setModal(true)}
        extra={<ImportarMasivo nombre="Mantenimiento" onImportar={importar} validar={validarImport}
          ejemplo={{ patente: "AC123DE", clase: "preventivo", tipo: "Cambio de aceite", descripcion: "Aceite 15W40 y filtros", fecha: "10/05/2026", costo: "28500,00", km: "148000", estado: "completado", taller: "Taller Central SA" }}
          columnas={[
            { campo: "patente", etiqueta: "Patente", tipo: "texto", requerido: true, alias: ["dominio", "interno"] },
            { campo: "clase", etiqueta: "Clase", tipo: "texto", alias: ["clase", "tipo de mantenimiento", "preventivo/correctivo"] },
            { campo: "tipo", etiqueta: "Tipo de trabajo", tipo: "texto", requerido: true, alias: ["tipo", "trabajo", "tarea"] },
            { campo: "descripcion", etiqueta: "Descripción", tipo: "texto", alias: ["detalle", "observaciones"] },
            { campo: "fecha", etiqueta: "Fecha", tipo: "fecha" },
            { campo: "costo", etiqueta: "Costo", tipo: "numero", alias: ["importe", "monto"] },
            { campo: "km", etiqueta: "Kilometraje", tipo: "numero", alias: ["km", "odometro"] },
            { campo: "estado", etiqueta: "Estado", tipo: "opcion", opciones: ["programado", "en_progreso", "completado"], porDefecto: "programado" },
            { campo: "taller", etiqueta: "Taller", tipo: "texto", alias: ["proveedor", "sector"] },
          ]} />} />

      {/* KPIs de las tres clases */}
      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(190px, 1fr))", gap: 16, marginBottom: 20 }}>
        <KpiCard label="Preventivos" value={tot.preventivo} icon="check" color="#16A34A" sub={`${pctPrevFlota}% del total de OT`} />

                {x.label}

          {vista === "listado" && (
            <Select value={filtroClase} onChange={e => setFiltroClase(e.target.value)} style={{ width: 200 }}>

      {/* ── VISTA POR UNIDAD ── */}

        <Card>
          <Table headers={["Dominio", "Interno", "Preventivos", "Correctivos", "Correctivas en ruta", "Total OT", "% preventivo", "Km entre fallas", "Costo"]}>
            {filas.map(f => (
              <TR key={f.v.id}>
                <TD bold>{f.v.patente}</TD>
                <TD>{f.v.vehiculo || <span style={{ color: "#CBD5E1" }}>—</span>}</TD>

                <TD><span style={{ fontWeight: 700, color: f.cuenta.correctivo > 0 ? "#F0A020" : "#CBD5E1" }}>{f.cuenta.correctivo}</span>{f.pesos.correctivo > 0 ? <span style={{ color: "#9CA3AF", fontSize: 11 }}> · {fmt(f.pesos.correctivo)}</span> : null}</TD>
                <TD><span style={{ fontWeight: 800, color: f.cuenta.ruta > 0 ? "#DC2626" : "#CBD5E1" }}>{f.cuenta.ruta}</span>{f.pesos.ruta > 0 ? <span style={{ color: "#9CA3AF", fontSize: 11 }}> · {fmt(f.pesos.ruta)}</span> : null}</TD>
                <TD bold>{f.total}</TD>
                <TD>

const Servicios = ({ viajes, setViajes, vehiculos, conductores, empresaActiva }) => {
  const [modal, setModal] = useState(false);
  const [form, setForm] = useState({ conductor_id: "", vehiculo_id: "", origen: "", destino: "", fecha: "", carga: "", kmRecorridos: 0, estado: "programado", empresa_id: 1 });

  const disponibles = vehiculos.filter(v => esActivo(v.estado));
  const conductoresActivos = conductores.filter(c => esActivo(c.estado));

  useEffect(() => {
    if (modal) {
      setForm({ conductor_id: conductoresActivos[0]?.id ?? "", vehiculo_id: disponibles[0]?.id ?? "", origen: "", destino: "", fecha: "", carga: "", kmRecorridos: 0, estado: "programado", empresa_id: empresaActiva });
    }
  }, [modal, empresaActiva]);

  const guardar = () => {
    if (!form.vehiculo_id || !vehiculos.some(v => mismoId(v.id, form.vehiculo_id))) {
      alert("Elegí un vehículo antes de registrar el servicio.");
      return;
    }
    setViajes(prev => [...prev, { ...form, id: Date.now(), empresa_id: empresaActiva, conductor_id: form.conductor_id || null, vehiculo_id: form.vehiculo_id, kmRecorridos: +form.kmRecorridos || 0 }]);
    setModal(false);
  };

  const porPatente = (pat) => vehiculos.find(v => (v.patente || "").toUpperCase().replace(/\s/g, "") === String(pat || "").toUpperCase().replace(/\s/g, "") || String(v.vehiculo || "") === String(pat || "").trim());
  const importar = (filas) => {
    const errores = []; const nuevos = [];
    const base = Date.now();
    filas.forEach((f, i) => {
      const veh = porPatente(f.patente);
      if (!veh) { errores.push(`Fila ${i + 2}: la patente "${f.patente}" no existe en esta empresa.`); return; }
      const cond = conductores.find(c => (c.dni || "") === f.conductor || (c.nombre || "").toLowerCase() === String(f.conductor || "").toLowerCase());
      nuevos.push({ ...f, id: base + i + 1, empresa_id: empresaActiva, vehiculo_id: veh.id, conductor_id: cond ? cond.id : null, kmRecorridos: +f.kmRecorridos || 0 });
    });
    if (!nuevos.length) return { agregados: 0, errores: errores.length ? errores : ["No hay filas válidas."] };
    setViajes(prev => [...prev, ...nuevos]);
    return { agregados: nuevos.length, errores };
  };

  return (
    <div>
      <SectionHeader title="Servicios" sub={`${viajes.filter(v => v.estado === "en_curso").length} en curso · ${viajes.filter(v => v.estado === "programado").length} programados`} action="Nuevo servicio" onAction={() => setModal(true)}
        extra={<ImportarMasivo nombre="Servicios" onImportar={importar}
          ejemplo={{ patente: "AC123DE", conductor: "28451234", origen: "Paraná", destino: "Rosario", fecha: "20/06/2026", kmRecorridos: "318", carga: "Materiales de construcción", estado: "programado" }}
          columnas={[
            { campo: "patente", etiqueta: "Patente", tipo: "texto", requerido: true, alias: ["dominio", "interno"] },
            { campo: "conductor", etiqueta: "Conductor (DNI o nombre)", tipo: "texto", alias: ["conductor", "dni", "chofer"] },
            { campo: "origen", etiqueta: "Origen", tipo: "texto", requerido: true, alias: ["desde"] },
            { campo: "destino", etiqueta: "Destino", tipo: "texto", alias: ["hasta"] },
            { campo: "fecha", etiqueta: "Fecha", tipo: "fecha" },
            { campo: "kmRecorridos", etiqueta: "KM recorridos", tipo: "numero", alias: ["km", "kilometros"] },
            { campo: "carga", etiqueta: "Carga / Detalle", tipo: "texto", alias: ["carga", "detalle", "servicio"] },
            { campo: "estado", etiqueta: "Estado", tipo: "opcion", opciones: ["programado", "en_curso", "completado"], porDefecto: "programado" },
          ]} />} />
      <Card>
        <Table headers={["Ruta", "Conductor", "Vehículo", "Fecha", "KM", "Carga", "Estado", "Acciones"]}>
          {viajes.map(v => {
            const c = conductores.find(x => mismoId(x.id, v.conductor_id));
            const ve = vehiculos.find(x => mismoId(x.id, v.vehiculo_id));
            return (
              <TR key={v.id}>
                <TD bold>{v.origen} → {v.destino}</TD>
                <TD>{c?.nombre || "—"}</TD>
                <TD>{ve?.patente || "—"}</TD>
                <TD>{fmtFecha(v.fecha)}</TD>
                <TD>{Number(v.kmRecorridos) > 0 ? fmtKm(v.kmRecorridos) : <span style={{ color: "#9CA3AF" }}>—</span>}</TD>
                <TD>{v.carga}</TD>
                <TD><Badge estado={v.estado} /></TD>
                <TD><BotonIcono icono="trash" color="#DC2626" title="Eliminar servicio" onClick={() => setViajes(prev => prev.filter(x => !mismoId(x.id, v.id)))} /></TD>
              </TR>
            );
          })}
          {viajes.length === 0 && (
            <tr><td colSpan={8} style={{ padding: "28px 14px", textAlign: "center", color: "#9CA3AF", fontSize: 13 }}>Todavía no cargaste ningún servicio.</td></tr>
          )}
        </Table>
      </Card>

      {modal && (
        <Modal title="Registrar Servicio" onClose={() => setModal(false)}>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: "0 16px" }}>
            <Field label="Origen"><Input placeholder="Buenos Aires" value={form.origen} onChange={e => setForm(p => ({ ...p, origen: e.target.value }))} /></Field>
            <Field label="Destino"><Input placeholder="Rosario" value={form.destino} onChange={e => setForm(p => ({ ...p, destino: e.target.value }))} /></Field>
            <Field label="Conductor">
              <Select value={form.conductor_id} onChange={e => setForm(p => ({ ...p, conductor_id: e.target.value }))}>
                {conductores.filter(c => esActivo(c.estado)).map(c => <option key={c.id} value={c.id}>{c.nombre}</option>)}
              </Select>
            </Field>
            <Field label="Vehículo">
              <Select value={form.vehiculo_id} onChange={e => setForm(p => ({ ...p, vehiculo_id: e.target.value }))}>
                {disponibles.map(v => <option key={v.id} value={v.id}>{v.patente} — {v.modelo}</option>)}
              </Select>
            </Field>
            <Field label="Fecha"><Input type="date" value={toDateInput(form.fecha)} onChange={e => setForm(p => ({ ...p, fecha: e.target.value }))} /></Field>
            <Field label="Estado">
              <Select value={form.estado} onChange={e => setForm(p => ({ ...p, estado: e.target.value }))}>
                <option value="programado">Programado</option>
                <option value="en_curso">En curso</option>
                <option value="completado">Completado</option>
              </Select>
            </Field>
            <Field label="KM recorridos"><Input type="number" placeholder="318" value={form.kmRecorridos} onChange={e => setForm(p => ({ ...p, kmRecorridos: e.target.value }))} /></Field>
          </div>
          <Field label="Tipo de carga"><Input placeholder="Mercadería general, materiales, etc." value={form.carga} onChange={e => setForm(p => ({ ...p, carga: e.target.value }))} /></Field>
          <div style={{ display: "flex", gap: 10, justifyContent: "flex-end", marginTop: 8 }}>
            <button onClick={() => setModal(false)} style={{ padding: "9px 20px", borderRadius: 8, border: "1.5px solid #E5E7EB", background: "#fff", fontSize: 13, fontWeight: 600, cursor: "pointer", color: "#374151" }}>Cancelar</button>
            <button onClick={guardar} style={{ padding: "9px 20px", borderRadius: 8, border: "none", background: "var(--c-primario)", color: "#fff", fontSize: 13, fontWeight: 600, cursor: "pointer" }}>Registrar viaje</button>
          </div>
        </Modal>
      )}
    </div>
  );
};

// ─── COMBUSTIBLE ──────────────────────────────────────────────────────────────
const Combustible = ({ combustible, setCombustible, vehiculos, empresaActiva, combustibleTodo }) => {
  const [modal, setModal] = useState(false);
  const [form, setForm] = useState({ vehiculo_id: "", fecha: "", litros: 0, precio_litro: 1240, total: 0, km_carga: 0, tipo: "Gasoil", empresa_id: 1 });

  useEffect(() => {
    if (modal) {
      setForm({ vehiculo_id: vehiculos[0]?.id ?? "", fecha: "", litros: 0, precio_litro: 1240, total: 0, km_carga: 0, tipo: "Gasoil", empresa_id: empresaActiva });
    }
  }, [modal, vehiculos, empresaActiva]);

  const guardar = () => {
    if (!form.vehiculo_id || !vehiculos.some(v => mismoId(v.id, form.vehiculo_id))) {
      alert("Elegí un vehículo antes de registrar la carga.");
      return;
    }
    const total = (+form.litros || 0) * (+form.precio_litro || 0);
    setCombustible(prev => [...prev, { ...form, id: Date.now(), empresa_id: empresaActiva, vehiculo_id: form.vehiculo_id, litros: +form.litros || 0, precio_litro: +form.precio_litro || 0, total, km_carga: +form.km_carga || 0 }]);
    setModal(false);
  };

  const porPatente = (pat) => vehiculos.find(v => (v.patente || "").toUpperCase().replace(/\s/g, "") === String(pat || "").toUpperCase().replace(/\s/g, "") || String(v.vehiculo || "") === String(pat || "").trim());
  const validarImport = (filas) => {
    const avs = [];
    const chicos = filas.filter(f => Number(f.km_carga) > 0 && Number(f.km_carga) < 1000).length;
    if (chicos) avs.push(`${chicos} fila(s) traen un odómetro menor a 1.000. Si venía con punto de miles ("78.251"), se está leyendo dividido por mil y el costo por km va a salir mil veces más alto.`);
    return avs;
  };
  const importar = (filas) => {
    const errores = []; const nuevos = [];
    const base = Date.now();
    filas.forEach((f, i) => {
      const veh = porPatente(f.patente);
      if (!veh) { errores.push(`Fila ${i + 2}: la patente "${f.patente}" no existe en esta empresa.`); return; }
      const litros = +f.litros || 0;
      const precio_litro = +f.precio_litro || 0;
      const total = +f.total || (litros * precio_litro);
      nuevos.push({ ...f, id: base + i + 1, empresa_id: empresaActiva, vehiculo_id: veh.id, litros, precio_litro, total, km_carga: +f.km_carga || 0 });
    });
    if (!nuevos.length) return { agregados: 0, errores: errores.length ? errores : ["No hay filas válidas."] };
    setCombustible(prev => [...prev, ...nuevos]);
    return { agregados: nuevos.length, errores };
  };

  const totalLitros = combustible.reduce((s, c) => s + (Number(c.litros) || 0), 0);
  const totalPesos = combustible.reduce((s, c) => s + (Number(c.total) || 0), 0);

  // ── Control del odómetro al cargar ──────────────────────────────────────
  // Este dato sostiene todo el sistema de kilómetros: tiene que gritar cuando
  // está mal. Se compara SIEMPRE contra el historial completo, no contra el
  // filtrado por período.
  const histoComb = combustibleTodo || combustible;
  const vehSel = vehiculos.find(v => mismoId(v.id, form.vehiculo_id)) || null;
  const odoAnterior = vehSel ? odometroActual(vehSel, histoComb) : 0;
  const lecturaNueva = Number(form.km_carga) || 0;
  const kmSumados = lecturaNueva > 0 ? lecturaNueva - odoAnterior : 0;
  const lecturaBaja = lecturaNueva > 0 && lecturaNueva < odoAnterior;
  const saltoRaro = kmSumados > 5000;

  return (

          columnas={[

            { campo: "fecha", etiqueta: "Fecha", tipo: "fecha" },
