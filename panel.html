            const mapa = recMapaDelRecorrido(rec, grupoActual.destino);
            return (
              <Card style={{ marginBottom: 16 }}>
                <div style={{ padding: "14px 20px", borderBottom: "1px solid #F1F5F9", background: "#F8FAFC" }}>
                  <h3 style={{ margin: 0, fontSize: 14.5, fontWeight: 700, color: "var(--c-primario)" }}>Paso 3 · El recorrido de hoy</h3>
                  <span style={{ fontSize: 12.5, color: "#6B7280" }}>Las paradas del grupo donde hoy sube alguien, en el orden que definiste. Las que quedan vacías no se hacen.</span>
                </div>
                {!elegidos.length ? (
                  <div style={{ padding: "18px 20px", fontSize: 13.5, color: "#6B7280" }}>
                    Todavía no tildaste a nadie. Apenas marques quién viaja, acá aparece el recorrido.
                  </div>
                ) : (
                  <div style={{ padding: "14px 20px" }}>
                    <div style={{ display: "flex", gap: 10, flexWrap: "wrap", marginBottom: 14 }}>
                      <span style={{ padding: "5px 12px", borderRadius: 99, background: "#E0E7FF", color: "#3730A3", fontSize: 12.5, fontWeight: 800 }}>
                        {rec.paradas.length} parada{rec.paradas.length === 1 ? "" : "s"}
                      </span>
                      <span style={{ padding: "5px 12px", borderRadius: 99, background: "#DCFCE7", color: "#166534", fontSize: 12.5, fontWeight: 800 }}>
                        {rec.cuantos} pasajero{rec.cuantos === 1 ? "" : "s"}
                      </span>
                      {rec.primera ? <span style={{ padding: "5px 12px", borderRadius: 99, background: "#FEF9C3", color: "#854D0E", fontSize: 12.5, fontWeight: 800 }}>
                        primera parada {rec.primera}
                      </span> : null}
                      {grupoActual.hora ? <span style={{ padding: "5px 12px", borderRadius: 99, background: "#F3F4F6", color: "#374151", fontSize: 12.5, fontWeight: 800 }}>
                        entrada {grupoActual.hora}
                      </span> : null}
                    </div>

                    {rec.paradas.some(g => g.sinAsignar) && (
                      <div style={{ marginBottom: 12, padding: "10px 14px", borderRadius: 9, background: "#FEF9C3", border: "1px solid #FDE68A", fontSize: 12.5, color: "#854D0E", fontWeight: 600, lineHeight: 1.5 }}>
                        Hay pasajeros <b>sin parada asignada</b>: por ahora se los muestra en su domicilio.
                        Asignales una parada en la solapa <b>3 · Pasajeros</b>, columna «Sube en la parada».
                      </div>
                    )}
                    {rec.paradas.map(g => (
                      <div key={g.clave} style={{ display: "flex", gap: 12, alignItems: "flex-start", padding: "10px 0", borderBottom: "1px dashed #E5E7EB" }}>
                        <div style={{ width: 34, height: 34, borderRadius: 9, background: g.sinAsignar ? "#F5B52E" : "var(--c-primario)", color: "#fff", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 15, fontWeight: 800, flex: "0 0 auto" }}>{g.letra}</div>
                        <div style={{ width: 54, fontSize: 13.5, fontWeight: 800, color: "#111827", flex: "0 0 auto", paddingTop: 7 }}>{g.hora || "—"}</div>
                        <div style={{ flex: 1, minWidth: 0 }}>
                          <div style={{ fontSize: 13.5, fontWeight: 700, color: "#111827" }}>{g.lugar}</div>
                          <div style={{ fontSize: 12.5, color: "#6B7280", fontWeight: 600, marginTop: 2 }}>
                            sube{g.gente.length === 1 ? "" : "n"} {g.gente.map(p => recNomComp(p)).join(", ")}
                          </div>
                        </div>
                        <span style={{ padding: "2px 9px", borderRadius: 7, background: "#F3F4F6", color: "#374151", fontSize: 12, fontWeight: 800, flex: "0 0 auto" }}>{g.gente.length}</span>
                      </div>
                    ))}

                    {rec.trasbordos.map(t => (
                      <div key={t.proveedor} style={{ display: "flex", gap: 12, alignItems: "center", padding: "10px 0", borderBottom: "1px dashed #E5E7EB", background: "#FFFBEB" }}>
                        <div style={{ width: 34, height: 34, borderRadius: 9, background: "#FEF9C3", color: "#854D0E", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 15, flex: "0 0 auto" }}>↔</div>
                        <div style={{ flex: 1, minWidth: 0 }}>
                          <div style={{ fontSize: 13.5, fontWeight: 700, color: "#854D0E" }}>Trasbordo · los trae {t.proveedor}</div>
                          <div style={{ fontSize: 12.5, color: "#92400E", fontWeight: 600, marginTop: 2 }}>
                            {t.gente.map(p => recNomComp(p)).join(", ")}{t.punto ? " · encuentro en " + t.punto : ""}
                          </div>
                        </div>
                        <span style={{ padding: "2px 9px", borderRadius: 7, background: "#FEF3C7", color: "#854D0E", fontSize: 12, fontWeight: 800 }}>{t.gente.length}</span>
                      </div>
                    ))}

                    <div style={{ display: "flex", gap: 10, alignItems: "center", marginTop: 14, flexWrap: "wrap" }}>
                      <button disabled={!!buscandoCoords} onClick={async () => {
                        /* Busca la ubicación de las PARADAS que todavía no la tienen.
                           Las que no son parada de tráfico (gente sin asignar) se
                           completan sobre el domicilio del pasajero. */
                        const faltan = rec.paradas.filter(g => !(Number(g.lat) && Number(g.lng)));
                        if (!faltan.length) { setBuscandoCoords(""); alert("Todas las paradas de hoy ya tienen su ubicación cargada."); return; }
                        let hechas = 0;
                        for (let i = 0; i < faltan.length; i++) {
                          const g = faltan[i];
                          setBuscandoCoords("Buscando " + (i + 1) + " de " + faltan.length + "…");
                          const busqueda = g.lugar + (/(cipolletti|neuquen|centenario|manzano|saltos)/i.test(g.lugar) ? "" : ", Cipolletti, Rio Negro");
                          const c = await recBuscarCoordenadas(busqueda);
                          if (c) {
                            if (g.parada_id) {
                              setParadas(prev => prev.map(x => x.id === g.parada_id ? { ...x, lat: c.lat, lng: c.lng } : x));
                            } else {
                              setPadron(prev => prev.map(x => pgNorm(x.desde) === pgNorm(g.lugar) ? { ...x, lat: c.lat, lng: c.lng } : x));
                            }
                            hechas++;
                          }
                          await new Promise(r => setTimeout(r, 1100));   // 1 por segundo: lo que pide OpenStreetMap
                        }
                        setBuscandoCoords("");
                        alert("Listo: encontré la ubicación de " + hechas + " de " + faltan.length + " paradas.\n\n" +
                              "Las que no encontró las podés completar a mano en la solapa «2 · Paradas», columnas Lat y Lng. El recorrido funciona igual, solo que esas no salen en el mapa del chofer.");
                      }} style={{ padding: "9px 16px", borderRadius: 9, border: "1.5px solid #16A34A", background: "#fff", color: "#16A34A", fontSize: 13, fontWeight: 700, cursor: "pointer" }}>
                        {buscandoCoords || "Buscar la ubicación de las paradas"}
                      </button>
                      {mapa ? (
                        <button onClick={() => window.open(mapa, "_blank")}
                          style={{ padding: "9px 16px", borderRadius: 9, border: "1.5px solid var(--c-primario)", background: "#fff", color: "var(--c-primario)", fontSize: 13, fontWeight: 700, cursor: "pointer" }}>
                          Ver el recorrido en Google Maps
                        </button>
                      ) : null}
                      {(() => {
                        const con = rec.paradas.filter(g => Number(g.lat) && Number(g.lng)).length;
                        const total = rec.paradas.length;
                        return (
                          <span style={{ fontSize: 12.5, color: con === total ? "#166534" : "#B45309", fontWeight: 600 }}>
                            {con === total
                              ? "Las " + total + " paradas tienen su ubicación: el chofer las va a ver en el mapa."
                              : con + " de " + total + " paradas tienen ubicación. Las otras no salen en el mapa del chofer."}
                          </span>
                        );
                      })()}
                    </div>

                    <div style={{ marginTop: 12, padding: "10px 14px", borderRadius: 9, background: "#EFF6FF", border: "1px solid #BFDBFE", fontSize: 12.5, color: "#1E3A8A", lineHeight: 1.55 }}>
                      La unidad <b>solo para donde hay pasajeros</b>. Si una parada no se hace, sigue a la siguiente y
                      las horas posteriores se adelantan. La espera máxima en cada parada es de <b>3 minutos</b>.
                    </div>
                  </div>
                )}
              </Card>
            );
          })()}

          <Card>
            <div style={{ padding: "14px 20px", borderBottom: "1px solid #F1F5F9", background: "#F8FAFC" }}>
              <h3 style={{ margin: 0, fontSize: 14.5, fontWeight: 700, color: "var(--c-primario)" }}>Paso 4 · Sacar la planilla</h3>
              <span style={{ fontSize: 12.5, color: "#6B7280" }}>Sale la lista de pasajeros Y el recorrido. Además, este mismo recorrido le llega al chofer a su teléfono: lo va a ver en la app, en el mapa.</span>
            </div>
            <div style={{ padding: "18px 20px" }}>
              <div style={{ fontSize: 13.5, color: "#374151", marginBottom: 14, lineHeight: 1.6 }}>
                Vas a imprimir <b>{elegidos.length} pasajero(s)</b> en <b>{recArmarRecorrido(elegidos, paradas).paradas.length} parada(s)</b> del grupo <b>{grupoActual.nombre}</b>
                {srv.chofer ? <span> · chofer <b>{srv.chofer}</b></span> : <span style={{ color: "#B45309" }}> · <b>falta el chofer</b></span>}
                {srv.interno ? <span> · interno <b>{srv.interno}</b></span> : <span style={{ color: "#B45309" }}> · <b>falta el interno</b></span>}
              </div>
              <button onClick={imprimirPlanilla}
                style={{ width: "100%", padding: "16px", borderRadius: 11, border: "none", background: "#16A34A", color: "#fff", fontSize: 16, fontWeight: 800, cursor: "pointer" }}>
                🖨 Imprimir la planilla del servicio
              </button>
            </div>
          </Card>
        </React.Fragment>
      )}

      {/* ═══════════════ PLANILLAS ANTERIORES ═══════════════ */}
      {vista === "historial" && (
        <Card>
          <div style={{ padding: "16px 20px", borderBottom: "1px solid #F1F5F9" }}>
            <h3 style={{ margin: 0, fontSize: 15, fontWeight: 700, color: "var(--c-primario)" }}>Planillas anteriores</h3>
            <span style={{ fontSize: 12, color: "#9CA3AF" }}>cada planilla que sacaste queda guardada y se puede volver a imprimir</span>
          </div>
          {!servicios.length
            ? <div style={{ padding: "24px 20px", fontSize: 13.5, color: "#6B7280", textAlign: "center" }}>Todavía no sacaste ninguna planilla.</div>
            : <Table headers={["Fecha", "Grupo", "Chofer", "Interno", "Pasajeros", ""]}>
                {servicios.map(s => (
                  <TR key={s.id}>
                    <TD bold>{fmtFecha(s.fecha) || s.fecha}</TD>
                    <TD>{s.grupo || "—"}</TD>
                    <TD>{s.chofer}</TD>
                    <TD>{s.interno}</TD>
                    <TD>{(s.pasajeros || []).length}</TD>
                    <TD>
                      <button onClick={() => recImprimir({ ...s, __paradas: paradas }, s.pasajeros || [])} style={{ background: "none", border: "none", cursor: "pointer", color: "var(--c-primario)", fontSize: 12, fontWeight: 700 }}>Volver a imprimir</button>
                      <button onClick={() => { if (confirm("¿Borrar esta planilla del historial?")) setServicios(prev => prev.filter(x => x.id !== s.id)); }} style={{ background: "none", border: "none", cursor: "pointer", color: "#DC2626", fontSize: 12, fontWeight: 600, marginLeft: 10 }}>Borrar</button>
                    </TD>
                  </TR>
                ))}
              </Table>}
        </Card>
      )}
    </div>
  );
};

/* ═══ BIBLIOTECA (v1) ═══════════════════════════════════════════════════════
   Manuales, instructivos y documentos de la operación. Por ahora los ve la
   oficina; el paso siguiente es publicarlos en la app del conductor para que
   cada chofer tenga los manuales en su teléfono. Cada documento es un LINK
   (Drive, PDF online, etc.): la app no guarda el archivo, solo la ficha. */
const BIB_LS = "BIBLIOTECA_V1";
const BIB_CATEGORIAS = ["Manual de unidad", "Instructivo de operación", "Seguridad e higiene", "RRHH y administración", "Otros"];

const Biblioteca = ({ remoto }) => {
  const [docs, setDocs] = useState(() => pgLeer(BIB_LS, []));
  const [modal, setModal] = useState(null);
  const [busq, setBusq] = useState("");
  const bibCargado = useRef(false);
  const bibFirma = useRef("");

  /* v1.1 — la planilla manda: cuando el GET trae la hoja Biblioteca con
     contenido, se pisa lo local. Así todas las computadoras ven lo mismo. */
  useEffect(() => {
    if (Array.isArray(remoto) && remoto.length) {
      const limpio = remoto.map(d => ({ ...d, paraConductores: String(d.paraConductores) !== "false" }));
      bibFirma.current = JSON.stringify(limpio);
      setDocs(limpio);
    }
    bibCargado.current = true;
  }, [remoto]);

  useEffect(() => { pgGuardar(BIB_LS, docs); }, [docs]);

  /* v1.2 — la biblioteca solo la tocan los autorizados: agregar, editar y
     quitar piden un código de la hoja Autorizadores. La PLANILLA valida el
     código; si no es válido, no se guarda nada (ni acá ni allá). */
  const bibSincronizar = async (lista, codigo) => {
    if (!SHEET_API_URL) return { autorizo: "" };   // modo local (prueba sin planilla)
    const r = await cfPost("panelGuardarBiblioteca", { docs: lista, codigo: String(codigo).trim() });
    if (!r || r.ok === false) throw new Error((r && r.error) || "el script no respondió");
    return r;
  };

  const lista = docs.filter(d =>
    !busq.trim() ||
    pgNorm(d.titulo + " " + d.categoria + " " + (d.notas || "")).indexOf(pgNorm(busq)) > -1);
  const porCat = BIB_CATEGORIAS.map(c => ({ cat: c, items: lista.filter(d => d.categoria === c) }))
    .concat([{ cat: "Sin categoría", items: lista.filter(d => !BIB_CATEGORIAS.includes(d.categoria)) }])
    .filter(g => g.items.length);

  const guardarDoc = async () => {
    const f = modal;
    if (!String(f.titulo || "").trim()) return alert("Falta el título del documento.");
    if (!String(f.url || "").trim()) return alert("Falta el link (Drive, PDF online, etc.).");
    if (!String(f.codigo || "").trim()) return alert("Falta el código de autorización: sin código no se guarda en la biblioteca.");
    const doc = { ...f, id: f.id || "bib_" + pgId() };
    delete doc.codigo;
    const lista = docs.some(x => x.id === doc.id) ? docs.map(x => x.id === doc.id ? doc : x) : [...docs, doc];
    try {
      const r = await bibSincronizar(lista.map(x => x.id === doc.id ? { ...x, actualizado_el: new Date().toISOString().slice(0, 16).replace("T", " ") } : x), f.codigo);
      const final = lista.map(x => x.id === doc.id ? { ...x, cargado_por: r.autorizo || x.cargado_por || "", actualizado_el: new Date().toISOString().slice(0, 16).replace("T", " ") } : x);
      bibFirma.current = JSON.stringify(final);
      setDocs(final);
      setModal(null);
    } catch (e) { alert("No se guardó. " + (e.message || e)); }
  };

  const quitarDoc = async (d) => {
    const codigo = window.prompt(`Quitar «${d.titulo}» de la biblioteca (el archivo original no se toca).\nCódigo de autorización:`);
    if (codigo == null) return;
    if (!String(codigo).trim()) return alert("Sin código no se quita nada.");
    const lista = docs.filter(x => x.id !== d.id);
    try {
      await bibSincronizar(lista, codigo);
      bibFirma.current = JSON.stringify(lista);
      setDocs(lista);
    } catch (e) { alert("No se quitó. " + (e.message || e)); }
  };

  return (
    <div>
      <SectionHeader title="Biblioteca"
        sub="manuales e instructivos de la operación · el próximo paso es que los conductores los vean desde su app"
        action="Agregar documento" onAction={() => setModal({ titulo: "", categoria: BIB_CATEGORIAS[0], url: "", notas: "", paraConductores: true })} />

      <Card style={{ marginBottom: 16 }}>
        <div style={{ padding: "12px 16px", position: "relative" }}>
          <Input placeholder="Buscar por título, categoría o notas..." value={busq} onChange={e => setBusq(e.target.value)} />
        </div>
      </Card>

      {porCat.map(g => (
        <Card key={g.cat} style={{ marginBottom: 16 }}>
          <div style={{ padding: "14px 20px", borderBottom: "1px solid #F1F5F9" }}>
            <h3 style={{ margin: 0, fontSize: 14.5, fontWeight: 700, color: "var(--c-primario)" }}>{g.cat} <span style={{ fontWeight: 400, color: "#9CA3AF", fontSize: 12 }}>· {g.items.length}</span></h3>
          </div>
          <Table headers={["Documento", "Notas", "Visible para conductores", "Cargado por", "Acciones"]}>
            {g.items.map(d => (
              <TR key={d.id}>
                <TD bold>
                  <a href={d.url} target="_blank" rel="noopener noreferrer" style={{ color: "var(--c-primario)", textDecoration: "none" }}>📄 {d.titulo}</a>
                </TD>
                <TD><span style={{ fontSize: 12, color: "#6B7280" }}>{d.notas || "—"}</span></TD>
                <TD>{d.paraConductores !== false
                  ? <span style={{ padding: "2px 9px", borderRadius: 6, background: "#DCFCE7", color: "#166534", fontSize: 11.5, fontWeight: 700 }}>sí, cuando se publique</span>
                  : <span style={{ padding: "2px 9px", borderRadius: 6, background: "#F1F5F9", color: "#6B7280", fontSize: 11.5, fontWeight: 700 }}>solo oficina</span>}</TD>
                <TD><span style={{ fontSize: 11.5, color: "#6B7280" }}>{d.cargado_por || "—"}{d.actualizado_el ? <div style={{ fontSize: 10, color: "#9CA3AF" }}>{d.actualizado_el}</div> : null}</span></TD>
                <TD style={{ whiteSpace: "nowrap" }}>
                  <button onClick={() => setModal({ ...d })} style={{ background: "none", border: "none", cursor: "pointer", color: "var(--c-primario)", fontSize: 12, fontWeight: 600, marginRight: 8 }}>Editar</button>
                  <button onClick={() => quitarDoc(d)}
                    style={{ background: "none", border: "none", cursor: "pointer", color: "#DC2626", fontSize: 12, fontWeight: 600 }}>Quitar</button>
                </TD>
              </TR>
            ))}
          </Table>
        </Card>
      ))}
      {porCat.length === 0 && (
        <Card><div style={{ padding: "44px 20px", textAlign: "center", color: "#9CA3AF", fontSize: 13 }}>
          La biblioteca está vacía.<br />
          <span style={{ fontSize: 12 }}>Subí los manuales a Drive, tocá «Agregar documento» y pegá el link. Cuando publiquemos la biblioteca en la app del conductor, los choferes van a ver los marcados como visibles.</span>
        </div></Card>
      )}

      {modal && (
        <Modal title={modal.id ? "Editar documento" : "Agregar documento"} onClose={() => setModal(null)}>
          <Field label="Título"><Input value={modal.titulo} placeholder="Manual de cabina Scania K450" onChange={e => setModal(p => ({ ...p, titulo: e.target.value }))} /></Field>
          <Field label="Categoría">
            <Select value={modal.categoria} onChange={e => setModal(p => ({ ...p, categoria: e.target.value }))}>
              {BIB_CATEGORIAS.map(c => <option key={c} value={c}>{c}</option>)}
            </Select>
          </Field>
          <Field label="Link al documento">
            <Input value={modal.url} placeholder="https://drive.google.com/..." onChange={e => setModal(p => ({ ...p, url: e.target.value }))} />
            <span style={{ fontSize: 11.5, color: "#9CA3AF", display: "block", marginTop: 5, lineHeight: 1.5 }}>
              Subí el PDF a Drive, compartilo como «Cualquier persona con el enlace puede ver» y pegá acá ese link.
            </span>
          </Field>
          <Field label="Notas"><Input value={modal.notas} placeholder="opcional — versión, a quién aplica…" onChange={e => setModal(p => ({ ...p, notas: e.target.value }))} /></Field>
          <Field label="">
            <label style={{ fontSize: 13, color: "#374151", display: "flex", alignItems: "center", gap: 8, cursor: "pointer" }}>
              <input type="checkbox" checked={modal.paraConductores !== false} onChange={e => setModal(p => ({ ...p, paraConductores: e.target.checked }))} />
              Visible para los conductores (cuando la biblioteca se publique en su app)
            </label>
          </Field>
          <Field label="Código de autorización">
            <Input type="password" placeholder="obligatorio — lo valida la planilla" value={modal.codigo || ""} onChange={e => setModal(p => ({ ...p, codigo: e.target.value }))} />
          </Field>
          <div style={{ display: "flex", justifyContent: "flex-end", gap: 10, alignItems: "center" }}>
            <span style={{ fontSize: 11.5, color: "#9CA3AF", marginRight: "auto" }}>Queda registrado quién autorizó cada documento.</span>
            <button onClick={() => setModal(null)} style={{ padding: "9px 20px", borderRadius: 8, border: "1.5px solid #E5E7EB", background: "#fff", fontSize: 13, fontWeight: 600, cursor: "pointer", color: "#374151" }}>Cancelar</button>
            <button onClick={guardarDoc} style={{ padding: "9px 20px", borderRadius: 8, border: "none", background: "var(--c-primario)", color: "#fff", fontSize: 13, fontWeight: 600, cursor: "pointer" }}>Guardar</button>
          </div>
        </Modal>
      )}
    </div>
  );
};

  // OCULTOS (se trabajan aparte, en su propio panel):
  //{ id: "gerencial", label: "Gerencial", icon: "trend" },
  //{ id: "costosfijos", label: "Costos fijos", icon: "chart" },
  // FUERA: se pisaba con Programados (el mismo viaje, cargado dos veces).
  //{ id: "servicios", label: "Servicios", icon: "map" },
];

const App = () => {
  const [page, setPage] = useState("dashboard");
  const [empresas, setEmpresas] = useState(EMPRESAS_INIT);
  const [marca, setMarca] = useState(MARCA_INIT);
  /* UNA SOLA EMPRESA. Se sigue guardando empresa_id en cada registro para no
     romper lo que ya está cargado, pero se toma siempre la primera empresa de
     la lista: no hay entre qué elegir. */
  /* v1.2 — vuelve la elección de empresa: se guarda en este equipo y toda la
     app (vehículos, partes, gastos…) filtra por la empresa elegida. */
  const [empresaActiva, setEmpresaActivaCruda] = useState(() => {
    const g = almacen.get("EMPRESA_ACTIVA");
    return g ? (isNaN(+g) ? g : +g) : null;
  });
  const setEmpresaActiva = (id) => { setEmpresaActivaCruda(id); try { almacen.set("EMPRESA_ACTIVA", String(id)); } catch (e) { } };
  // v8.7: lo que manda la app del conductor (el GET del conector ya lo trae)
  const [cfDatos, setCfDatos] = useState({ insumos: [], pedidos: [], seguimientoOT: [], diagramas: [], asignaciones: [], biblioteca: [], recPadron: [], recServicios: [], recProveedores: [] });
  const [vehiculos, setVehiculos] = useState(VEHICULOS_INIT);
  const [conductores, setConductores] = useState(CONDUCTORES_INIT);
  const [mantenimiento, setMantenimiento] = useState(MANTENIMIENTO_INIT);
  const [viajes, setViajes] = useState(VIAJES_INIT);
  const [combustible, setCombustible] = useState(COMBUSTIBLE_INIT);
  const [gastos, setGastos] = useState(GASTOS_INIT);
  const [proyectos, setProyectos] = useState(PROYECTOS_INIT);
  const [personal, setPersonal] = useState([]);
  const [costosFijos, setCostosFijos] = useState([]);
  const [partes, setPartes] = useState([]);

  // ── Período global (barra superior) ─────────────────────────────────────
  // Filtra los módulos de datos de toda la app y queda guardado en el navegador.
  const [periodo, setPeriodo] = useState(() => almacen.get("PERIODO_FLOTA") || "mes");
  useEffect(() => { almacen.set("PERIODO_FLOTA", periodo); }, [periodo]);
  const rangoPeriodo = rangoDe(periodo);
  const perDesde = rangoPeriodo.desde;
  const perHasta = rangoPeriodo.hasta;
  const periodoLabel = etiquetaPeriodo(periodo);
  // Un registro sin fecha no se puede excluir: se muestra siempre, para que
  // nada desaparezca en silencio por un dato mal cargado.
  const enRango = (f) => {
    if (!perDesde && !perHasta) return true;
    const d = toDateInput(f);
    if (!d) return true;
    return (!perDesde || d >= perDesde) && (!perHasta || d <= perHasta);
  };

  // ── Sincronización con Google Sheets ────────────────────────────────────
  const [estadoSinc, setEstadoSinc] = useState("ok");
  const [errorSinc, setErrorSinc] = useState("");
  const [ultimaSinc, setUltimaSinc] = useState(null);
  const [mostrarModalURL, setMostrarModalURL] = useState(!SHEET_API_URL);
  const [urlInput, setUrlInput] = useState("");
  const [panelBase, setPanelBase] = useState(() => almacen.get("PANEL_BASE_URL") || "");
  const [copiado, setCopiado] = useState(false);
  const urlParaPanel = () => {
    const base = (panelBase || "").trim().replace(/\/+$/, "").replace(/\?.*$/, "");
    if (!base || !SHEET_API_URL) return "";
    return base + "/?api=" + encodeURIComponent(SHEET_API_URL);
  };
  const copiarUrlPanel = () => {
    const u = urlParaPanel();
    if (!u) return;
    almacen.set("PANEL_BASE_URL", (panelBase || "").trim());
    const listo = () => { setCopiado(true); setTimeout(() => setCopiado(false), 2000); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(u).then(listo).catch(listo);
    else listo();
  };
  const cargado = useRef(false);       // ya se hizo la primera carga
  const firmaGuardada = useRef("");    // último estado guardado (para no re-postear igual)
  const timerGuardar = useRef(null);

  const firmaDatos = (d) => JSON.stringify(d);
  const armarPayload = () => ({ empresas, marca, vehiculos, conductores, mantenimiento, viajes, combustible, gastos, proyectos, personal, costosfijos: costosFijos, partes });

  const cargarDeHoja = () => {
    if (!SHEET_API_URL) return;
    setEstadoSinc("cargando");
    fetch(SHEET_API_URL)
      .then(r => r.json())
      .then(raw => {
        const data = normalizarDatosDeHoja(raw);
        if (Array.isArray(data.empresas)) setEmpresas(data.empresas);
        if (data.marca && data.marca.nombreSistema != null) setMarca(prev => ({ ...prev, ...data.marca }));
        if (Array.isArray(data.vehiculos)) setVehiculos(data.vehiculos);
        if (Array.isArray(data.conductores)) setConductores(data.conductores);
        if (Array.isArray(data.mantenimiento)) setMantenimiento(data.mantenimiento);
        if (Array.isArray(data.viajes)) setViajes(data.viajes);
        if (Array.isArray(data.combustible)) setCombustible(data.combustible);
        if (Array.isArray(data.gastos)) setGastos(data.gastos);
        if (Array.isArray(data.proyectos)) setProyectos(data.proyectos);
        if (Array.isArray(data.personal)) setPersonal(data.personal);
        if (Array.isArray(data.costosfijos)) setCostosFijos(data.costosfijos);
        if (Array.isArray(data.partes)) setPartes(data.partes);
        setCfDatos({
          insumos: Array.isArray(data.insumos) ? data.insumos : [],
          pedidos: Array.isArray(data.pedidos) ? data.pedidos : [],
          seguimientoOT: Array.isArray(data.seguimientoOT) ? data.seguimientoOT : [],
          diagramas: Array.isArray(data.diagramas) ? data.diagramas : [],
          asignaciones: Array.isArray(data.asignaciones) ? data.asignaciones : [],
          biblioteca: Array.isArray(data.biblioteca) ? data.biblioteca : [],
          recPadron: Array.isArray(data.recPadron) ? data.recPadron : [],
          recServicios: Array.isArray(data.recServicios) ? data.recServicios : [],
          recProveedores: Array.isArray(data.recProveedores) ? data.recProveedores : [],
        });
        // Empresa activa: la primera activa disponible
        if (Array.isArray(data.empresas) && data.empresas.length) {
          const act = data.empresas.find(e => esActivo(e.estado)) || data.empresas[0];
          setEmpresaActivaCruda(prev => prev != null && data.empresas.some(e => mismoId(e.id, prev)) ? prev : act.id);
        }
        // Registrar la firma de lo cargado para no re-guardar lo mismo
        firmaGuardada.current = firmaDatos({ empresas: data.empresas || [], marca: data.marca || marca, vehiculos: data.vehiculos || [], conductores: data.conductores || [], mantenimiento: data.mantenimiento || [], viajes: data.viajes || [], combustible: data.combustible || [], gastos: data.gastos || [], proyectos: data.proyectos || [], personal: data.personal || [], costosfijos: data.costosfijos || [], partes: data.partes || [] });
        cargado.current = true;
        setEstadoSinc("ok"); setErrorSinc(""); setUltimaSinc(new Date());
      })
      .catch(err => {
        cargado.current = true; // permitir trabajar offline igual
        setEstadoSinc("error");
        setErrorSinc("No se pudo leer la Hoja. Verificá la URL del script y que esté publicado para 'Cualquier persona'. " + err);
      });
  };

  useEffect(() => { if (SHEET_API_URL) cargarDeHoja(); else { cargado.current = true; } }, []);

  // Guardado automático (debounce) cuando cambia cualquier dato
  useEffect(() => {
    if (!SHEET_API_URL || !cargado.current) return;
    const payload = armarPayload();
    const firma = firmaDatos(payload);
    if (firma === firmaGuardada.current) return;
    if (timerGuardar.current) clearTimeout(timerGuardar.current);
    timerGuardar.current = setTimeout(() => {
      setEstadoSinc("guardando");
      fetch(SHEET_API_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: firma })
        .then(r => r.json())
        .then(res => {
          if (res && res.ok === false) throw new Error(res.error || "El script devolvió un error");
          firmaGuardada.current = firma;
          setEstadoSinc("ok"); setErrorSinc(""); setUltimaSinc(new Date());
        })
        .catch(err => { setEstadoSinc("error"); setErrorSinc("No se pudo guardar en la Hoja. " + err); });
    }, 1200);
    return () => { if (timerGuardar.current) clearTimeout(timerGuardar.current); };
  }, [empresas, marca, vehiculos, conductores, mantenimiento, viajes, combustible, gastos, proyectos, personal, costosFijos, partes]);

  const guardarURLModal = () => {
    const url = urlInput.trim();
    if (url && !/^https:\/\/script\.google\.com\//.test(url)) {
      alert("La URL no parece de Apps Script. Tiene que empezar con https://script.google.com/");
      return;
    }
    if (url) {
      almacen.set("SHEET_API_URL_PRUEBAS", url);
      SHEET_API_URL = url;
      almacen.set(PG_LS.api, url);                       // Programados usa la misma
      window.dispatchEvent(new Event("sheet-api-url"));  // avisar a Programados
      setMostrarModalURL(false);
      cargarDeHoja();
    } else {
      setMostrarModalURL(false); // sigue sin conexión, modo local
    }
  };

  // ── "Abrir Sheet" protegido con clave ───────────────────────────────────
  const [modalSheet, setModalSheet] = useState(false);
  const [pasoSheet, setPasoSheet] = useState("clave");   // "clave" | "config"
  const [claveSheetInput, setClaveSheetInput] = useState("");
  const [urlSheetInput, setUrlSheetInput] = useState("");
  const [claveNueva, setClaveNueva] = useState("");
  const [errorSheet, setErrorSheet] = useState("");
  const sheetConfigurado = () => !!(almacen.get("AS_SHEET_URL") && almacen.get("AS_SHEET_CLAVE"));

  const abrirModalSheet = () => {
    setErrorSheet(""); setClaveSheetInput(""); setUrlSheetInput(""); setClaveNueva("");
    setPasoSheet(sheetConfigurado() ? "clave" : "config");
    setModalSheet(true);
  };
  const confirmarConfigSheet = () => {
    const url = urlSheetInput.trim();
    const clave = claveNueva.trim();
    if (!/^https:\/\/docs\.google\.com\/spreadsheets\//.test(url)) { setErrorSheet("Pegá la URL completa de la planilla (empieza con https://docs.google.com/spreadsheets/...)."); return; }
    if (clave.length < 4) { setErrorSheet("La clave tiene que tener al menos 4 caracteres."); return; }
    almacen.set("AS_SHEET_URL", url);
    almacen.set("AS_SHEET_CLAVE", clave);
    setModalSheet(false);
    window.open(url, "_blank");
  };
  const confirmarClaveSheet = () => {
    if (claveSheetInput !== almacen.get("AS_SHEET_CLAVE")) { setErrorSheet("Clave incorrecta."); setClaveSheetInput(""); return; }
    setModalSheet(false);
    window.open(almacen.get("AS_SHEET_URL"), "_blank");
  };
  const cambiarURLSheet = () => {
    if (claveSheetInput !== almacen.get("AS_SHEET_CLAVE")) { setErrorSheet("Para cambiar la URL primero poné la clave actual."); return; }
    setErrorSheet(""); setUrlSheetInput(""); setClaveNueva(claveSheetInput);
    setPasoSheet("config");
  };

  // ── Colores de marca aplicados a toda la interfaz ───────────────────────
  useEffect(() => {
    document.documentElement.style.setProperty("--c-primario", marca.colorPrimario || "#1B3A6B");
    document.documentElement.style.setProperty("--c-acento", marca.colorAcento || "#E8A020");
    document.title = (marca.nombreSistema || "FlotaGestión") + " - Sistema de Gestión de Flotas";
  }, [marca]);

  // ── Datos de la empresa activa ──────────────────────────────────────────
  const empresa = empresas.find(e => mismoId(e.id, empresaActiva)) || null;

  // Maestros: no se filtran por período (una unidad o un chofer no "pertenecen" a un mes).
  const vData = vehiculos.filter(v => mismoId(v.empresa_id, empresaActiva));
  const cData = conductores.filter(c => mismoId(c.empresa_id, empresaActiva));
  const perData = personal.filter(p => mismoId(p.empresa_id, empresaActiva));

  // Colecciones con fecha: primero la empresa (historial completo), después el período.
  const mTodo = mantenimiento.filter(m => mismoId(m.empresa_id, empresaActiva));
  const viTodo = viajes.filter(v => mismoId(v.empresa_id, empresaActiva));
  const coTodo = combustible.filter(c => mismoId(c.empresa_id, empresaActiva));
  const gTodo = gastos.filter(g => mismoId(g.empresa_id, empresaActiva));
  const pTodo = proyectos.filter(p => mismoId(p.empresa_id, empresaActiva));
  const cfTodo = costosFijos.filter(c => mismoId(c.empresa_id, empresaActiva));
  const paTodo = partes.filter(p => mismoId(p.empresa_id, empresaActiva));

  const mData = mTodo.filter(m => enRango(m.fecha));
  const viData = viTodo.filter(v => enRango(v.fecha));
  // coTodo (historial COMPLETO) se le pasa aparte a todo lo que calcula kilómetros:
  // el odómetro necesita la última lectura ANTERIOR al período. Si se filtrara,
  // los km del primer mes darían mal.
  const coData = coTodo.filter(c => enRango(c.fecha));
  const gData = gTodo.filter(g => enRango(g.fecha));
  const paData = paTodo.filter(p => enRango(p.fecha));
  // Un proyecto entra si su período SE SUPERPONE con el elegido, no por una sola fecha.
  const pData = pTodo.filter(p => {
    if (!perDesde && !perHasta) return true;
    const ini = toDateInput(p.fechaInicio) || "0000-01-01";
    const fin = toDateInput(p.fechaFin) || "9999-12-31";
    return (!perHasta || ini <= perHasta) && (!perDesde || fin >= perDesde);
  });
  // Los costos fijos se guardan por mes (yyyy-MM): se filtra esa columna.
  const cfData = cfTodo.filter(c => {
    if (!perDesde && !perHasta) return true;
    const per = String(c.periodo || "").slice(0, 7);
    if (!per) return true;
    return (!perDesde || per >= perDesde.slice(0, 7)) && (!perHasta || per <= perHasta.slice(0, 7));
  });

  // ── Dependencias y borrado en cascada ───────────────────────────────────
  const depsVehiculo = (id) => ({
    mantenimiento: mantenimiento.filter(m => mismoId(m.vehiculo_id, id)).length,
    servicios: viajes.filter(v => mismoId(v.vehiculo_id, id)).length,
    combustible: combustible.filter(c => mismoId(c.vehiculo_id, id)).length,
    gastos: gastos.filter(g => mismoId(g.vehiculo_id, id)).length,
    partes: partes.filter(p => mismoId(p.vehiculo_id, id)).length,
  });
  const eliminarVehiculos = (ids, cascada) => {
    setVehiculos(prev => prev.filter(v => !ids.some(id => mismoId(id, v.id))));
    if (cascada) {
      setMantenimiento(prev => prev.filter(m => !ids.some(id => mismoId(id, m.vehiculo_id))));
      setViajes(prev => prev.filter(v => !ids.some(id => mismoId(id, v.vehiculo_id))));
      setCombustible(prev => prev.filter(c => !ids.some(id => mismoId(id, c.vehiculo_id))));
      setGastos(prev => prev.filter(g => !ids.some(id => mismoId(id, g.vehiculo_id))));
      setPartes(prev => prev.filter(p => !ids.some(id => mismoId(id, p.vehiculo_id))));
    }
    setProyectos(prev => prev.map(p => ids.some(id => mismoId(id, p.vehiculo_id)) ? { ...p, vehiculo_id: "" } : p));
  };
  const depsConductor = (id) => ({
    servicios: viajes.filter(v => mismoId(v.conductor_id, id)).length,
    gastos: gastos.filter(g => mismoId(g.conductor_id, id)).length,
    partes: partes.filter(p => mismoId(p.conductor_id, id)).length,
  });
  const eliminarConductores = (ids) => {
    setConductores(prev => prev.filter(c => !ids.some(id => mismoId(id, c.id))));
    // Los registros quedan sin conductor (no se borran, para conservar el historial)
    setViajes(prev => prev.map(v => ids.some(id => mismoId(id, v.conductor_id)) ? { ...v, conductor_id: null } : v));
    setGastos(prev => prev.map(g => ids.some(id => mismoId(id, g.conductor_id)) ? { ...g, conductor_id: null } : g));
    setProyectos(prev => prev.map(p => ids.some(id => mismoId(id, p.conductor_id)) ? { ...p, conductor_id: null } : p));
    // En los partes se conserva el nombre escrito (columna operador) y se suelta el vínculo
    setPartes(prev => prev.map(p => ids.some(id => mismoId(id, p.conductor_id)) ? { ...p, conductor_id: null } : p));
  };

  const irAEmpresas = () => setPage("empresas");
  const necesitaEmpresa = ["vehiculos", "conductores", "personal", "mantenimiento", "servicios", "combustible", "gastos", "proyectos", "costosfijos", "partes"];

  return (
    <div style={{ display: "flex", minHeight: "100vh", background: "#F3F6FA", fontFamily: "'Segoe UI', system-ui, -apple-system, sans-serif" }}>
      {/* ── SIDEBAR ── */}
      <aside style={{ width: 232, background: "var(--c-primario)", color: "#fff", display: "flex", flexDirection: "column", position: "sticky", top: 0, height: "100vh", flexShrink: 0 }}>
        <div style={{ padding: "20px 18px", display: "flex", alignItems: "center", gap: 10, borderBottom: "1px solid rgba(255,255,255,0.09)" }}>
          <div style={{ width: 36, height: 36, borderRadius: 9, background: marca.logo ? "#fff" : "var(--c-acento)", display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0, overflow: "hidden" }}>
            {marca.logo ? <img src={marca.logo} alt="" style={{ width: "100%", height: "100%", objectFit: "contain" }} /> : <Icon name="truck" size={20} color="#fff" />}
          </div>
          <div style={{ overflow: "hidden" }}>
            <div style={{ fontSize: 15, fontWeight: 800, whiteSpace: "nowrap" }}>{marca.nombreSistema || "FlotaGestión"} <span style={{ fontSize: 9, fontWeight: 700, background: "var(--c-acento)", color: "#fff", borderRadius: 4, padding: "1px 5px", verticalAlign: "middle" }}>PRUEBA</span></div>
            {marca.bajada && <div style={{ fontSize: 10, color: "rgba(255,255,255,0.5)", whiteSpace: "nowrap" }}>{marca.bajada}</div>}
          </div>
        </div>

        <nav style={{ flex: 1, padding: "12px 10px", overflowY: "auto" }}>
          {NAV.map((grupo, gi) => (
            <div key={gi} style={{ marginBottom: 6 }}>
              {grupo.seccion && (
                <div style={{ padding: "10px 12px 4px", fontSize: 10, fontWeight: 700, letterSpacing: "0.8px", textTransform: "uppercase", color: "rgba(255,255,255,0.35)" }}>
                  {grupo.seccion}
                </div>
              )}
              {grupo.items.map(item => (
                <button key={item.id} onClick={() => setPage(item.id)}
                  style={{ display: "flex", alignItems: "center", gap: 11, width: "100%", padding: "9px 12px", marginBottom: 2, background: page === item.id ? "rgba(255,255,255,0.13)" : "none", border: "none", borderRadius: 8, color: page === item.id ? "#fff" : "rgba(255,255,255,0.65)", fontSize: 13, fontWeight: page === item.id ? 700 : 500, cursor: "pointer", textAlign: "left" }}>
                  <Icon name={item.icon} size={17} color={page === item.id ? "#fff" : "rgba(255,255,255,0.65)"} />
                  {item.label}
                </button>
              ))}
            </div>
          ))}
        </nav>

        <div style={{ padding: "14px 18px", borderTop: "1px solid rgba(255,255,255,0.09)", fontSize: 11, color: "rgba(255,255,255,0.45)" }}>
          {empresa ? <strong style={{ color: "rgba(255,255,255,0.85)" }}>{empresa.nombre}</strong> : "Cargá tu empresa en la pantalla Empresas"}
          <div style={{ marginTop: 8, fontSize: 10, color: "rgba(255,255,255,0.35)", whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{VERSION_APP}</div>
        </div>
      </aside>

      {/* ── ÁREA PRINCIPAL ── */}
      <div style={{ flex: 1, display: "flex", flexDirection: "column", minWidth: 0 }}>
        {/* Topbar */}
        <header style={{ background: "#fff", borderBottom: "1px solid #E5E7EB", padding: "10px 26px", display: "flex", alignItems: "center", gap: 14, position: "sticky", top: 0, zIndex: 50 }}>
          <div style={{ display: "flex", alignItems: "center", gap: 9 }}>
            <LogoEmpresa empresa={empresa} />
            <div style={{ fontSize: 14, fontWeight: 700, color: "var(--c-primario)" }}>
              {empresa ? empresa.nombre : "FlotaGestión"}
            </div>
          </div>

          {/* ── SELECTOR DE PERÍODO GLOBAL ── */}
          <div title="Filtra los datos de toda la app. Los kilómetros se siguen calculando contra el historial completo del odómetro."
            style={{ display: "flex", alignItems: "center", gap: 4, background: "#F3F6FA", borderRadius: 9, padding: 3 }}>
            {PERIODOS.map(p => (
              <button key={p.id} onClick={() => setPeriodo(p.id)}
                style={{
                  padding: "5px 11px", borderRadius: 7, border: "none", cursor: "pointer",
                  background: periodo === p.id ? "var(--c-primario)" : "transparent",
                  color: periodo === p.id ? "#fff" : "#6B7280",
                  fontSize: 11.5, fontWeight: periodo === p.id ? 700 : 600, whiteSpace: "nowrap",
                }}>
                {p.label}
              </button>
            ))}
          </div>

          <div style={{ marginLeft: "auto", display: "flex", alignItems: "center", gap: 12 }}>
            <SincBadge estado={estadoSinc} error={errorSinc} ultima={ultimaSinc} onSync={cargarDeHoja} configurado={!!SHEET_API_URL} />
            {SHEET_API_URL && (
              <button onClick={cargarDeHoja} disabled={estadoSinc === "cargando"} title="Traer los datos que están hoy en la Hoja de Google"
                style={{ display: "flex", alignItems: "center", gap: 6, padding: "7px 14px", background: "var(--c-primario)", color: "#fff", border: "none", borderRadius: 8, fontSize: 12, fontWeight: 600, cursor: estadoSinc === "cargando" ? "wait" : "pointer", opacity: estadoSinc === "cargando" ? 0.6 : 1 }}>
                🔄 {estadoSinc === "cargando" ? "Actualizando…" : "Actualizar"}
              </button>
            )}
            <button onClick={abrirModalSheet}
              style={{ display: "flex", alignItems: "center", gap: 6, padding: "7px 14px", background: "#fff", color: "var(--c-primario)", border: "1.5px solid #E5E7EB", borderRadius: 8, fontSize: 12, fontWeight: 600, cursor: "pointer" }}>
              📊 Abrir Sheet
            </button>
            <button onClick={() => { setUrlInput(""); setMostrarModalURL(true); }} title="Configurar conexión con Google Sheets"
              style={{ display: "flex", alignItems: "center", gap: 6, padding: "7px 10px", background: "none", color: "#6B7280", border: "none", borderRadius: 8, fontSize: 12, fontWeight: 600, cursor: "pointer" }}>
              ⚙️
            </button>
            <div style={{ width: 32, height: 32, borderRadius: "50%", background: "var(--c-primario)", display: "flex", alignItems: "center", justifyContent: "center", overflow: "hidden" }}>
              {marca.avatar
                ? <img src={marca.avatar} alt="" style={{ width: "100%", height: "100%", objectFit: "cover" }} />
                : <span style={{ fontSize: 12, fontWeight: 700, color: "#fff" }}>{(marca.iniciales || "AD").toUpperCase()}</span>}
            </div>
          </div>
        </header>

        {/* Contenido */}
        <main style={{ flex: 1, padding: "26px 26px 60px", maxWidth: 1400, width: "100%", margin: "0 auto", boxSizing: "border-box" }}>
          {!empresa && necesitaEmpresa.includes(page) ? (
            <SinEmpresa onIr={irAEmpresas} modulo={NAV.flatMap(g => g.items).find(n => n.id === page)?.label?.toLowerCase()} />
          ) : (
            <>
              {page === "dashboard" && (empresa
                ? <Dashboard vehiculos={vData} conductores={cData} mantenimiento={mData} viajes={viData} combustible={coData} gastos={gData} proyectos={pData} partes={paData} setVehiculos={setVehiculos}
                    combustibleTodo={coTodo} desde={perDesde} hasta={perHasta} periodoLabel={periodoLabel} />
                : <SinEmpresa onIr={irAEmpresas} />)}
              {/* El Gerencial recibe el historial COMPLETO y filtra adentro: el gráfico
                  de los últimos 6 meses tiene que seguir viéndose entero. */}
              {page === "gerencial" && (empresa
                ? <PanelGerencial vehiculos={vData} conductores={cData} viajes={viTodo} combustible={coTodo} gastos={gTodo} mantenimiento={mTodo} partes={paTodo}
                    combustibleTodo={coTodo} desde={perDesde} hasta={perHasta} periodoLabel={periodoLabel} />
                : <SinEmpresa onIr={irAEmpresas} />)}
              {page === "programados" && <Programados vehiculos={vehiculos} conductores={conductores} empresaActiva={empresaActiva} empresas={empresas} />}
              {empresa && page === "partes" && <Partes partes={paData} setPartes={setPartes} vehiculos={vData} setVehiculos={setVehiculos} conductores={cData} proyectos={pData} empresaActiva={empresaActiva} combustibleTodo={coTodo} />}
              {empresa && page === "vehiculos" && <><Vehiculos vehiculos={vData} setVehiculos={setVehiculos} empresaActiva={empresaActiva} dependencias={depsVehiculo} onEliminar={eliminarVehiculos} combustibleTodo={coTodo} /><ConsumoPorMarca vehiculos={vData} /></>}
              {empresa && page === "conductores" && <Conductores conductores={cData} setConductores={setConductores} empresaActiva={empresaActiva} dependencias={depsConductor} onEliminar={eliminarConductores} />}
              {empresa && page === "personal" && <Personal personal={perData} setPersonal={setPersonal} empresaActiva={empresaActiva} bases={empresa.bases || []} />}
              {empresa && page === "mantenimiento" && <Mantenimiento mantenimiento={mData} setMantenimiento={setMantenimiento} vehiculos={vData} empresaActiva={empresaActiva} partes={paData} combustible={coData} combustibleTodo={coTodo} desde={perDesde} hasta={perHasta} />}
              {page === "biblioteca" && <Biblioteca remoto={cfDatos.biblioteca} />}
              {empresa && page === "appconductor" && <BandejaConductor mantenimiento={mantenimiento} setMantenimiento={setMantenimiento} vehiculos={vData} conductores={cData} empresaActiva={empresaActiva} cf={cfDatos} setCf={setCfDatos} />}
              {page === "planmant" && <PlanMantenimiento vehiculos={vehiculos} combustible={coTodo} mantenimiento={mTodo} />}
              {empresa && page === "servicios" && <Servicios viajes={viData} setViajes={setViajes} vehiculos={vData} conductores={cData} empresaActiva={empresaActiva} />}
              {empresa && page === "combustible" && <Combustible combustible={coData} setCombustible={setCombustible} vehiculos={vData} empresaActiva={empresaActiva} combustibleTodo={coTodo} />}
              {/* Costos fijos trabaja mes a mes: se le filtran las FILAS por período,
                  pero las fuentes van completas para que la cuenta de cada mes cierre. */}
              {empresa && page === "costosfijos" && <CostosFijos costosFijos={cfData} setCostosFijos={setCostosFijos} empresaActiva={empresaActiva} personal={perData} vehiculos={vData} mantenimiento={mTodo} viajes={viTodo} combustible={coTodo} gastos={gTodo} partes={paTodo} combustibleTodo={coTodo} />}
              {empresa && page === "gastos" && <Gastos gastos={gData} setGastos={setGastos} vehiculos={vData} conductores={cData} empresaActiva={empresaActiva} />}
              {empresa && page === "recorridos" && <Recorridos vehiculos={vData} conductores={cData} empresaActiva={empresaActiva} recPadron={cfDatos.recPadron} recServicios={cfDatos.recServicios} recProveedores={cfDatos.recProveedores} recGrupos={cfDatos.recGrupos} recParadas={cfDatos.recParadas} />}
              {empresa && page === "proyectos" && <Proyectos proyectos={pData} setProyectos={setProyectos} vehiculos={vData} conductores={cData} empresaActiva={empresaActiva} bases={empresa.bases || []} partes={paTodo} viajes={viTodo} combustible={coTodo} combustibleTodo={coTodo} />}
              {page === "empresas" && <Empresas empresas={empresas} setEmpresas={setEmpresas} empresaActiva={empresaActiva} setEmpresaActiva={setEmpresaActiva} vehiculos={vehiculos} conductores={conductores} />}
              {page === "marca" && <Marca marca={marca} setMarca={setMarca} />}
            </>
          )}
        </main>
      </div>

      {/* ── MODAL: URL del Apps Script (conexión de datos) ── */}
      {mostrarModalURL && (
        <Modal title="Conectar con Google Sheets" onClose={() => setMostrarModalURL(false)}>
          <p style={{ margin: "0 0 14px", fontSize: 13, color: "#6B7280", lineHeight: 1.6 }}>
            Pegá la URL de la <strong>Aplicación Web</strong> del Apps Script de tu Hoja de prueba
            (termina en <code>/exec</code>). Si la dejás vacía, la app funciona solo en este navegador.
          </p>
          <Field label="URL del script (/exec)">
            <Input placeholder="https://script.google.com/macros/s/..../exec" value={urlInput} onChange={e => setUrlInput(e.target.value)} />
          </Field>
          {SHEET_API_URL && <Aviso tipo="info">Ya hay un script conectado ✓ — pegá una URL nueva solo si querés cambiarlo.</Aviso>}
          {SHEET_API_URL && (
            <div style={{ background: "#F8FAFC", border: "1px solid #E5E7EB", borderRadius: 8, padding: "12px 14px", marginBottom: 16 }}>
              <div style={{ fontSize: 11, fontWeight: 700, color: "#6B7280", textTransform: "uppercase", letterSpacing: "0.5px", marginBottom: 8 }}>
                URL para el panel del celular
              </div>
              <p style={{ margin: "0 0 10px", fontSize: 12, color: "#6B7280", lineHeight: 1.55 }}>
                El panel del celular solo LEE lo que la app guarda acá: no necesita planilla propia. Abrilo UNA vez con esta dirección y queda conectado.
                Poné abajo la dirección de tu panel.
              </p>
              <Input value={panelBase} onChange={e => setPanelBase(e.target.value)} placeholder="https://mi-panel.netlify.app" style={{ marginBottom: 8, fontSize: 12 }} />
              <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
                <input readOnly value={urlParaPanel()} onFocus={e => e.target.select()}
                  style={{ flex: 1, minWidth: 0, padding: "8px 10px", border: "1.5px solid #E5E7EB", borderRadius: 8, fontSize: 11, fontFamily: "monospace", background: "#fff", color: "#374151", boxSizing: "border-box" }} />
                <button onClick={copiarUrlPanel}
                  style={{ padding: "8px 14px", borderRadius: 8, border: "none", background: "var(--c-primario)", color: "#fff", fontSize: 12, fontWeight: 600, cursor: "pointer", whiteSpace: "nowrap" }}>
                  {copiado ? "Copiado ✓" : "Copiar"}
                </button>
              </div>
            </div>
          )}
          <div style={{ display: "flex", gap: 10, justifyContent: "flex-end" }}>
            <button onClick={() => setMostrarModalURL(false)} style={{ padding: "9px 20px", borderRadius: 8, border: "1.5px solid #E5E7EB", background: "#fff", fontSize: 13, fontWeight: 600, cursor: "pointer", color: "#374151" }}>Cerrar</button>
            <button onClick={guardarURLModal} style={{ padding: "9px 20px", borderRadius: 8, border: "none", background: "var(--c-primario)", color: "#fff", fontSize: 13, fontWeight: 600, cursor: "pointer" }}>Guardar y conectar</button>
          </div>
        </Modal>
      )}

      {/* ── MODAL: Abrir Sheet con clave ── */}
      {modalSheet && (
        <Modal title={pasoSheet === "config" ? "Configurar acceso a la planilla" : "Abrir la planilla"} onClose={() => setModalSheet(false)}>
          {pasoSheet === "config" ? (
            <>
              <p style={{ margin: "0 0 14px", fontSize: 13, color: "#6B7280", lineHeight: 1.6 }}>
                Definí una <strong>clave</strong> y pegá la <strong>URL de la planilla</strong>. La URL queda guardada
                en este navegador y <strong>no se vuelve a mostrar</strong>: de acá en adelante solo se pide la clave.
              </p>
              <Field label="Clave (mínimo 4 caracteres)">
                <Input type="password" placeholder="••••••" value={claveNueva} onChange={e => setClaveNueva(e.target.value)} />
              </Field>
              <Field label="URL de la planilla de Google Sheets">
                <Input type="password" placeholder="https://docs.google.com/spreadsheets/d/..." value={urlSheetInput} onChange={e => setUrlSheetInput(e.target.value)} />
              </Field>
              {errorSheet && <Aviso tipo="error">{errorSheet}</Aviso>}
              <div style={{ display: "flex", gap: 10, justifyContent: "flex-end" }}>
                <button onClick={() => setModalSheet(false)} style={{ padding: "9px 20px", borderRadius: 8, border: "1.5px solid #E5E7EB", background: "#fff", fontSize: 13, fontWeight: 600, cursor: "pointer", color: "#374151" }}>Cancelar</button>
                <button onClick={confirmarConfigSheet} style={{ padding: "9px 20px", borderRadius: 8, border: "none", background: "var(--c-primario)", color: "#fff", fontSize: 13, fontWeight: 600, cursor: "pointer" }}>Guardar y abrir</button>
              </div>
            </>
          ) : (
            <>
              <p style={{ margin: "0 0 14px", fontSize: 13, color: "#6B7280", lineHeight: 1.6 }}>
                La planilla está protegida. Ingresá la clave para abrirla.
              </p>
              <Field label="Clave">
                <Input type="password" placeholder="••••••" value={claveSheetInput} autoFocus
                  onChange={e => { setClaveSheetInput(e.target.value); setErrorSheet(""); }}
                  onKeyDown={e => { if (e.key === "Enter") confirmarClaveSheet(); }} />
              </Field>
              {errorSheet && <Aviso tipo="error">{errorSheet}</Aviso>}
              <div style={{ display: "flex", gap: 10, justifyContent: "space-between", alignItems: "center" }}>
                <button onClick={cambiarURLSheet} title="Requiere la clave actual"
                  style={{ padding: "9px 0", border: "none", background: "none", fontSize: 12, fontWeight: 600, cursor: "pointer", color: "#6B7280", textDecoration: "underline" }}>
                  Cambiar URL o clave
                </button>
                <div style={{ display: "flex", gap: 10 }}>
                  <button onClick={() => setModalSheet(false)} style={{ padding: "9px 20px", borderRadius: 8, border: "1.5px solid #E5E7EB", background: "#fff", fontSize: 13, fontWeight: 600, cursor: "pointer", color: "#374151" }}>Cancelar</button>
                  <button onClick={confirmarClaveSheet} style={{ padding: "9px 20px", borderRadius: 8, border: "none", background: "var(--c-primario)", color: "#fff", fontSize: 13, fontWeight: 600, cursor: "pointer" }}>Abrir planilla</button>
                </div>
              </div>
            </>
          )}
        </Modal>
      )}
    </div>
  );
};

class PantallaDeError extends React.Component {
  constructor(p) { super(p); this.state = { error: null }; }
  static getDerivedStateFromError(e) { return { error: e }; }
  render() {
    if (!this.state.error) return this.props.children;
    return (
      <div style={{ fontFamily: "'Segoe UI',system-ui,sans-serif", maxWidth: 640, margin: "80px auto", padding: "28px 32px", border: "1px solid #FCA5A5", borderRadius: 12, background: "#FEF2F2", color: "#374151" }}>
        <div style={{ fontSize: 17, fontWeight: 800, color: "#DC2626", marginBottom: 10 }}>La pantalla se cerró por un error</div>
        <div style={{ fontSize: 13, lineHeight: 1.6, marginBottom: 12 }}>
          Tus datos están guardados: esto es solo la pantalla. Sacale una foto a este texto y pasámelo, y después tocá «Volver a abrir».
        </div>
        <div style={{ fontSize: 12, fontFamily: "monospace", background: "#fff", border: "1px solid #E5E7EB", borderRadius: 8, padding: "10px 12px", marginBottom: 14, whiteSpace: "pre-wrap", wordBreak: "break-word" }}>
          {String(this.state.error && (this.state.error.message || this.state.error))}
        </div>
        <button onClick={() => window.location.reload()} style={{ padding: "10px 22px", borderRadius: 8, border: "none", background: "#1E3A5F", color: "#fff", fontSize: 13, fontWeight: 700, cursor: "pointer" }}>Volver a abrir</button>
      </div>
    );
  }
}
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<PantallaDeError><App /></PantallaDeError>);

    </script>
</body>
</html>
